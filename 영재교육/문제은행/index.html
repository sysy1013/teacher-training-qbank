<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>영재교육 문제은행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface-2:#eeebe3; --ink:#18212f; --ink-2:#3f4a5c; --muted:#6a7080;
  --line:#d8d3c7; --line-2:#c4bdae;
  --navy:#1f3a5f; --navy-2:#2c4f7c; --on-navy:#ffffff; --navy-bg:#e3e9f2;
  --red:#b8322a; --red-bg:#f9e6e3; --green:#2a7148; --green-bg:#e2f0e7; --amber:#94600f; --amber-bg:#f6ecd9;
  --quote-bg:#f3f0e8; --focus:#2563c9; --shadow:0 1px 2px rgba(20,28,40,.06);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Noto Serif KR","AppleMyungjo","Batang","바탕",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151c; --surface:#19202a; --surface-2:#212a36; --ink:#e6e9ef; --ink-2:#bcc4d1; --muted:#8c95a5;
    --line:#2d3746; --line-2:#3d4959;
    --navy:#8db2e3; --navy-2:#a9c6ee; --on-navy:#0e1522; --navy-bg:#1c2a3d;
    --red:#ff8576; --red-bg:#3a1e1c; --green:#72cc96; --green-bg:#173022; --amber:#e3ae62; --amber-bg:#33281a;
    --quote-bg:#1d2530; --focus:#7fb0ff; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#19202a; --surface-2:#212a36; --ink:#e6e9ef; --ink-2:#bcc4d1; --muted:#8c95a5;
  --line:#2d3746; --line-2:#3d4959;
  --navy:#8db2e3; --navy-2:#a9c6ee; --on-navy:#0e1522; --navy-bg:#1c2a3d;
  --red:#ff8576; --red-bg:#3a1e1c; --green:#72cc96; --green-bg:#173022; --amber:#e3ae62; --amber-bg:#33281a;
  --quote-bg:#1d2530; --focus:#7fb0ff; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy);padding-top:0}
.hdr-in{max-width:720px;margin:0 auto;padding:0 16px;min-height:52px;display:flex;align-items:center;gap:10px}
.hdr-back{min-width:48px;min-height:40px;padding:0 10px;border-radius:8px;border:1px solid currentColor;background:transparent;color:var(--on-navy);font-size:14px;font-weight:500;opacity:.92}
.hdr-title{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:12px;opacity:.8;font-weight:400;display:block;line-height:1.3}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 32px}
.wrap.has-bar{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
h2.sec{font-size:15px;font-weight:700;color:var(--ink-2);margin:22px 0 10px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px;text-align:center}
.btn-primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn-danger{background:var(--red);border-color:var(--red);color:var(--surface)}
.btn-ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{display:flex;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;line-height:1;padding:5px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip-navy{background:var(--navy-bg);border-color:transparent;color:var(--navy)}
.chip-red{background:var(--red-bg);border-color:transparent;color:var(--red)}
.chip-green{background:var(--green-bg);border-color:transparent;color:var(--green)}
.chip-amber{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip-muted{color:var(--muted)}

/* progress */
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:15px;font-weight:500;color:var(--muted)}
.meter{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:10px}
.meter>span{display:block;height:100%;background:var(--navy);border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.course{font-family:var(--serif);font-size:15px;color:var(--ink-2);margin:0 0 12px}

/* mode grid */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:56px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;box-shadow:var(--shadow)}
.mode b{font-size:14px;line-height:1.35}
.mode span{font-size:11px;color:var(--muted);line-height:1.3}

/* segmented */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.seg button[disabled]{opacity:.4}

/* lesson list */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:0;background:transparent;text-align:left}
.lrow[disabled]{cursor:default}
.lno{flex:0 0 36px;height:36px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.lmain{flex:1;min-width:0}
.ltitle{font-size:15px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lmeta{font-size:12px;color:var(--muted);margin-top:2px}
.lrow[disabled] .ltitle{color:var(--muted)}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px}
.qcount{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.qcount span{color:var(--muted);font-weight:500}
.qbar{flex:1;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.qbar>span{display:block;height:100%;background:var(--navy)}
.qchips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.qchips .sp{flex:1}
.bm{min-height:40px;min-width:48px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.bm[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.gridbtn{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:10px}
.qgrid button{min-height:44px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.qgrid button.done{background:var(--navy-bg);border-color:transparent;color:var(--navy);font-weight:700}
.qgrid button.ok{background:var(--green-bg);border-color:transparent;color:var(--green);font-weight:700}
.qgrid button.ng{background:var(--red-bg);border-color:transparent;color:var(--red);font-weight:700}
.qgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.stem{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.65;margin:16px 0 0;white-space:pre-wrap}
.stem .qn{font-family:var(--font);font-weight:700;color:var(--red);margin-right:4px}
.box{margin-top:14px;border:1.5px solid var(--ink-2);border-radius:4px;padding:18px 14px 12px;position:relative;background:var(--surface)}
.box-label{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 8px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.box-body{white-space:pre-wrap;font-size:15px;line-height:1.7}
.choices{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:52px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:16px;line-height:1.5}
.choice .cn{flex:0 0 auto;font-size:18px;line-height:1.35;color:var(--ink-2);font-family:var(--serif)}
.choice .ct{flex:1;min-width:0}
.choice .cm{flex:0 0 auto;font-size:12px;font-weight:700;padding-top:3px}
.choice.picked{border-color:var(--navy);background:var(--navy-bg)}
.choice.picked .cn{color:var(--navy);font-weight:700}
.choice.correct{border-color:var(--green);background:var(--green-bg)}
.choice.correct .cn,.choice.correct .cm{color:var(--green);font-weight:700}
.choice.wrong{border-color:var(--red);background:var(--red-bg)}
.choice.wrong .cn,.choice.wrong .cm{color:var(--red);font-weight:700}
.choice.dim{opacity:.72}
.choice[aria-disabled="true"]{cursor:default}
.explain{margin-top:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.verdict{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;font-weight:700}
.verdict.ok{background:var(--green-bg);color:var(--green)}
.verdict.ng{background:var(--red-bg);color:var(--red)}
.verdict.na{background:var(--surface-2);color:var(--ink-2)}
.verdict .note{font-weight:500;font-size:13px;margin-left:auto}
.ex-body{padding:14px;white-space:pre-wrap;font-size:15px;line-height:1.7}
.src{margin:0 14px 14px;border:1px solid var(--line);border-radius:10px;background:var(--quote-bg);padding:12px}
.src-h{font-size:13px;font-weight:500;color:var(--ink-2);line-height:1.5}
.src-h b{color:var(--ink)}
.src blockquote{margin:8px 0 0;padding:2px 0 2px 12px;border-left:3px solid var(--red);font-family:var(--serif);font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap}

/* bottom bar */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bbar-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;gap:8px}
.bbar-in .btn{flex:1;padding:0 10px}
.bbar-in .btn.wide{flex:1.6}

/* result */
.score{text-align:center;padding:24px 16px}
.score .num{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.score .num.pass{color:var(--green)}
.score .num.fail{color:var(--red)}
.scale{position:relative;height:12px;background:var(--surface-2);border-radius:999px;margin:22px 4px 26px}
.scale>.fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--navy)}
.scale>.line{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--red)}
.scale>.lbl{position:absolute;top:18px;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--red);white-space:nowrap}
details.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.item+details.item{margin-top:8px}
details.item>summary{list-style:none;cursor:pointer;padding:12px 14px;min-height:52px;display:flex;gap:10px;align-items:flex-start}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .sum-t{flex:1;min-width:0;font-size:15px;line-height:1.5}
details.item>summary .car{flex:0 0 auto;color:var(--muted);font-size:13px;padding-top:2px}
details.item[open]>summary{border-bottom:1px solid var(--line)}
details.item .inner{padding:4px 14px 14px}
details.item .inner .explain{margin-top:12px}
.sumlist{margin:0;padding:6px 14px 14px 32px}
.sumlist li{margin:6px 0;font-size:15px;line-height:1.65}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.flabel{font-size:14px;font-weight:700;color:var(--ink-2)}
.input,.select{width:100%;min-height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:16px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--navy);flex:0 0 auto}
mark{background:var(--amber-bg);color:var(--ink);padding:0 1px;border-radius:2px}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.reset{margin-top:32px;padding-top:16px;border-top:1px dashed var(--line-2)}
.foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}

@media (prefers-reduced-motion: no-preference){
  .meter>span,.qbar>span,.scale>.fill{transition:width .25s ease}
  .choice,.btn,.seg button,.lrow{transition:background-color .12s ease,border-color .12s ease}
}
@media (hover:hover){
  .lrow:not([disabled]):hover,.mode:hover{background:var(--surface-2)}
  .choice:not([aria-disabled="true"]):hover{border-color:var(--navy-2)}
}
</style>
</head>
<body>
<header class="hdr" id="hdr"><div class="hdr-in" id="hdr-in"></div></header>
<main class="wrap" id="app" tabindex="-1"></main>
<div id="bar-slot"></div>
<script>

'use strict';

30년까지 2.8% 성장률)","기술혁신과 실업: 실질실업률 100년간 큰 변화 없음, 상관은 미미 / 실업률에 가장 큰 영향 = 1·2차 세계대전, 경제대공황, 한국전쟁, 베트남전쟁, 911테러 등","TIME(1961.2.24) ‘AUTOMATION JOBLESS’: 제3차 산업혁명 ‘인터넷’ 발전으로 인간의 일자리는 사라질 것","2023~2027 창출 일자리: AI 및 머신러닝 전문가, 지속가능성 전문가, 비즈니스 인텔리전스 전문가, 정보보안분석가, 핀테크 엔지니어, 데이터 분석가 및 과학자, 로보틱스 엔지니어, 빅데이터 전문가, 농업장비 운영자, 디지털 트랜스포메이션 전문가 / 사라지는 일자리: 은행 및 관련 사무원, 우체국 사무원, 출납원 및 매표원, 데이터입력 사무원, 행정 및 집행 비서, 회계·부기·급여 사무원, 입법자와 공무원 등","챗GPT 영향 많이 받는 직업: 회계사·수학자·통역사·작가 (오픈AI + 미국 펜실베이니아대 연구) / 미국 전체 노동자의 19%는 업무의 최소 절반 이상을 훨씬 빠르게 마칠 수 있음(연합뉴스, 2023.3.28)","골드만삭스: 전 세계 기업 절반이 AI 도입하면 향후 10년간 글로벌 GDP 7%, 7조 달러 증가","지금까지 교육: 표준화된 사회시스템에서 공통 교과서 지식·기능 반복 습득·암기, 평가 시스템으로 우수인재 양성 → 고연봉 화이트칼라층 형성","화이트칼라 사무행정 직업(교사, 공무원, 회사원 등)이 10년 안에 사라지는 714만 개 중 475만 개인 67%","떠오르는 10가지 기술 유형: 인지능력, 자기효능감, 관리능력, 과학 기술 능력, 회합 기술 (창의적 사고, 분석적 사고, 시스템 사고, AI와 빅데이터 등)","영재학생의 4가지 혁신역량: ①창의력 ②융합력 ③자기 주도력 ④공감·협업력 (세계경제포럼·OECD가 혁신(innovative) 역량 용어 사용, 출처 이정규)"],"questions":[{"id":"02-01","type":"개념 찾기","q":"“패러다임의 변화에 적응하는 유기체는 이니셔티브를 장악하게 될 것이며, 그렇지 못한 존재는 도태되고 만다.”는 말의 출처로 교안에 제시된 것은?","box":null,"choices":["유발 하라리 『사피엔스』","이정규 『성공하는 미래교육전략』","토마스 쿤 『과학혁명의 구조』","세계경제포럼 『직업의 미래 보고서』","TIME 「AUTOMATION JOBLESS」"],"answer":3,"explain":"정답 ③ 토마스 쿤 『과학혁명의 구조』. ① 하라리는 ‘지적 설계의 법칙’. ② 이정규는 ‘속도가 아니라 방향’, 4가지 혁신역량 출처. ④ WEF는 직업 전망 보고서. ⑤ TIME은 자동화 실업 기사.","source":{"page":3,"section":"01. 미래직업의 전망","quote":"토마스쿤“과학혁명의구조” / 패러다임의변화에적응하는유기체는이니셔티브를장악하게될것이며 , 그렇지못한존재는도태되고만다."}},{"id":"02-02","type":"옳은 것","q":"교안에서 소개한 ‘미래의 일자리 보고서(Future of Jobs Report)’에 대한 설명으로 옳은 것은?","box":null,"choices":["OECD가 2023년에 발표하였다.","세계경제포럼(WEF)이 2020년에 발표하였다.","미국 노동부가 회원국 통계를 바탕으로 작성하였다.","세계경제포럼(WEF)이 2023년에 발표하였으며, 전 세계 전문가 설문조사와 의견수렴을 바탕으로 하였다.","교육 분야 전문가만을 대상으로 한 설문조사 결과이다."],"answer":4,"explain":"정답 ④: Future of Jobs Report는 세계경제포럼(WEF, 2023), 전 세계 전문가(정치, 경제, 사회, 테크 등) 설문조사와 의견수렴. ① OECD 아님. ② 2020 → 2023. ③ 미국 노동부는 실업률 자료 출처. ⑤ 정치·경제·사회·테크 등 다양한 분야 전문가.","source":{"page":4,"section":"미래의 일자리 보고서","quote":"Future of Jobs Report세계경제포럼(WEF, 2023) / ‣ 전세계 전문가( 정치 , 경제 , 사회 , 테크 등) 설문조사와 의견수렴"}},{"id":"02-03","type":"옳지 않은 것","q":"세계경제포럼(2023) 미래의 일자리 보고서의 내용으로 옳지 않은 것은?","box":null,"choices":["인공지능, 데이터 과학, 기계 학습, 로봇공학 등 새로운 기술의 발전이 직업에 미치는 영향을 분석하였다.","클라우드 컴퓨팅, 사이버 보안 등의 기술 발전도 분석 대상에 포함되었다.","의료, 교육, 환경, 복지 등 사회적 서비스 분야는 분석에서 제외하였다.","정부, 기업, 교육기관 등이 협력하여 미래 직업 창출을 지원해야 한다고 주장하였다.","미래 직업 전망에 대비하기 위해 인재를 양성할 필요가 있다고 주장하였다."],"answer":3,"explain":"정답 ③: 보고서는 의료, 교육, 환경, 복지 등 사회적 서비스 분야의 변화에 따른 직업 전망도 분석함. ①②④⑤는 교안과 일치.","source":{"page":5,"section":"미래의 일자리 보고서","quote":"의료, 교육 , 환경 , 복지 등과같은사회적서비스분야의변화에따른직업전망도분석보고서는미래직업전망에대비하기위해정부, 기업 , 교육기관등이협력하여미래직업창출을지원하고, 인재를양성할필요가있다고주장"}},{"id":"02-04","type":"옳지 않은 것","q":"세계경제포럼(2023)이 제시한 ‘미래 직업 변화의 3 key drivers’에 해당하지 않는 것은?","box":null,"choices":["녹색전환(Green transition)","기술(Technology)","경제전망(Economic outlook)","인구 고령화(Population aging)","위 ①~③은 모두 3 key drivers에 해당한다."],"answer":4,"explain":"정답 ④: 3 key drivers는 녹색전환, 기술, 경제전망. 인구 고령화는 3 key drivers로 제시되지 않음. ⑤는 옳은 진술.","source":{"page":6,"section":"미래직업변화의 3 key drivers","quote":"녹색전환(Green transition) 미래직업변화의3 key drivers / 기술(Technology) / 경제전망(Economic outlook)"}},{"id":"02-05","type":"옳은 것","q":"‘미래 직업 변화의 3 key drivers’에 대한 설명으로 옳은 것은?","box":null,"choices":["녹색전환: 재생가능에너지, 환경보호, 에너지효율 높이는 기술 개발 및 적용 분야가 일자리 창출의 주요 동인이다.","기술: 자동화, AI, Big-Data 분야는 일자리 창출에만 긍정적 영향을 미친다.","경제전망: 2030년까지 3.8%의 성장률이 전망된다.","경제전망: 2050년까지 2.8%의 성장률이 전망된다.","녹색전환: 단순 반복 사무직 업무의 소멸을 가져오는 주된 동인이다."],"answer":1,"explain":"정답 ①. ② 기술은 새로운 일자리 창출과 단순반복 사무직 업무 소멸의 ‘양면적 영향’. ③④ 2030년까지 2.8%. ⑤ 단순반복 사무직 업무 소멸은 ‘기술’ 동인의 설명.","source":{"page":6,"section":"미래직업변화의 3 key drivers","quote":"‣ 일자리 창출의주요동인으로재생가능에너지, 환경보호 , 에너지효율높이는기술개발및적용 분야"}},{"id":"02-06","type":"빈칸","q":"다음은 미래 직업 변화의 key driver 중 ‘경제전망(Economic outlook)’에 대한 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"2030년까지 (   )의 성장률","choices":["1.8%","2.8%","3.2%","7%","19%"],"answer":2,"explain":"정답 ② 2.8%. ④ 7%는 골드만삭스의 AI 도입 시 글로벌 GDP 증가율, ⑤ 19%는 AI 도움으로 업무 절반 이상을 빨리 마칠 10년안에 사라지는714만개중475 만개인 67%를차지함"}},{"id":"02-18","type":"옳은 것","q":"교안의 ‘앞으로 영재교육은?’에서 제기한 문제의식으로 가장 적절한 것은?","box":null,"choices":["영재학생은 안정적인 사무행정 직업을 목표로 준비시키는 것이 바람직하다.","영재학생이 곧 사라질지도 모르는 직업을 바라보고 수년간 헛된 공부와 노력을 하고 있는 것은 아닌지 성찰해야 한다.","영재교육기관은 진로 선택에 관여하지 않는 것이 바람직하다.","미래 직업 세계는 현재와 크게 다르지 않으므로 기존 방식의 교육을 유지해야 한다.","영재학생의 진로는 고연봉 전문직으로 한정하여 지도해야 한다."],"answer":2,"explain":"정답 ②: 교안은 ‘곧 사라질지도 모르는 직업을 바라보고 수년간 헛된 공부와 노력을 하고 있는 것은 아닌지’, ‘떠오를 유망한 직업세계를 준비하여 앞서 나가게 할 것인지’, ‘영재교육기관에서 무엇을 준비시켜 주어야 할 것인지’를 질문함. ①③④⑤는 이 문제의식과 반대.","source":{"page":18,"section":"02. 미래직업의 전망과 영재교육 – 앞으로 영재교육은?","quote":"미래를살아갈우리영재학생이곧사라질지도 모르는직업을바라보고수년간헛된공부와노력을하고있는것은아닌지?"}},{"id":"02-19","type":"옳지 않은 것","q":"세계경제포럼(2023)이 제시한 ‘떠오르고 있는 10가지 기술’의 기술 유형에 해당하지 않는 것은?","box":null,"choices":["인지능력","자기효능감","관리능력","신체능력","회합 기술"],"answer":4,"explain":"정답 ④: 기술 유형은 인지능력, 자기효능감, 관리능력, 과학 기술 능력, 회합 기술의 5가지. 신체능력은 포함되지 않음.","source":{"page":19,"section":"떠오르고 있는 10가지 기술","quote":"‣ ■인지능력 ■자기효능감 ■관리능력 ■과학 기술능력■회합 기술"}},{"id":"02-20","type":"옳지 않은 것","q":"세계경제포럼(2023)이 제시한 ‘떠오르고 있는 10가지 기술’에 해당하지 않는 것은?","box":null,"choices":["창의적 사고","분석적 사고","AI와 빅데이터","호기심 평생학습","반복 숙달과 암기력"],"answer":5,"explain":"정답 ⑤: 10가지 기술은 창의적 사고, 시스템 사고, 분석적 사고, AI와 빅데이터, 과학 기술적 소양, 동기부여와 자기인식, 호기심 평생학습, 경영 능력, 탄력성·유연성·민첩성, 서비스 지향점 및 고객 서비스. 반복 숙달과 암기력은 없음.","source":{"page":19,"section":"떠오르고 있는 10가지 기술","quote":"창의적사고시스템사고분석적사고AI 와빅데이터 / 과학기술적소양동기부여와자기인식호기심평생학습경영능력탄력성, 유연성 , 민첩성 서비스 지향점및고객 서비스"}},{"id":"02-21","type":"빈칸","q":"다음은 ‘영재학생의 4가지 혁신역량’에 대한 내용이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"미래는 우리가 지금까지 예측하지 못했던, 그리고 나타난 적도 없었던 새로운 ( ㄱ )의 세계임. 영재학생은 그 누구보다도 영재성을 발휘하여 미래의 ( ㄱ )를 해결해야 함. 최근 세계경제포럼이나 OECD는 ( ㄴ ) 역량이란 용어를 많이 쓰기 시작하였음","choices":["ㄱ: 기회, ㄴ: 핵심(key)","ㄱ: 경쟁, ㄴ: 혁신(innovative)","ㄱ: 위기, ㄴ: 디지털(digital)","ㄱ: 딜레마, ㄴ: 핵심(key)","ㄱ: 딜레마, ㄴ: 혁신(innovative)"],"answer":5,"explain":"정답 ⑤:새로운 딜레마의 세계, 혁신(innovative) 역량. 출처: 이정규 『성공하는 미래교육전략』.","source":{"page":20,"section":"영재학생의 4가지 혁신역량","quote":"미래는우리가지금까지예측하지못했던, 그리고 나타난적도없었던새로운딜레마의세계임영재학생은그누구보다도 영재성을발휘하여미래의딜레마를해결해야함최근세계경제포럼이나 OECD는혁신(innovative) 역량이란용어를많이쓰기시작하였음"}},{"id":"02-22","type":"보기 조합","q":"교안에서 제시한 ‘영재학생의 4가지 혁신역량’을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 창의력\nㄴ. 융합력\nㄷ. 암기력\nㄹ. 자기 주도력\nㅁ. 공감·협업력\nㅂ. 경쟁력","choices":["ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ, ㅂ","ㄱ, ㄴ, ㄹ, ㅁ","ㄴ, ㄹ, ㅁ, ㅂ","ㄱ, ㄴ, ㅁ, ㅂ"],"answer":3,"explain":"정답 ③ ㄱ, ㄴ, ㄹ, ㅁ: ①창의력 ②융합력 ③자기 주도력 ④공감·협업력. 세계경제포럼, OECD, 우리나라 정부·각종 위원회·대기업에서 꼽은 혁신역량을 종합한 것. 암기력·경쟁력은 해당 없음.","source":{"page":21,"section":"영재학생의 4가지 혁신역량","quote":"‣ ①창의력 , ②융합력 , ③자기 주도력, ④공감 · 협업력을 꼽고있기에우리의영재교육도혁신역량을갖추기위한교육으로패러다임을전환하여야함"}},{"id":"02-23","type":"옳은 것","q":"영재학생의 4가지 혁신역량에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["4가지 혁신역량은 세계경제포럼이 단독으로 제시한 것이다.","4가지 혁신역량은 창의력, 사고력, 자기 주도력, 리더십이다.","혁신역량은 4차 산업혁명 이전 시대의 핵심 역량으로 제시되었다.","4가지 혁신역량은 창의력, 융합력, 자기 주도력, 공감·협업력이며, 영재교육도 혁신역량을 갖추기 위한 교육으로 패러다임을 전환하여야 한다.","출처는 토마스 쿤의 『과학혁명의 구조』이다."],"answer":4,"explain":"정답 ④. ① WEF·OECD·우리나라 정부와 각종 위원회 및 대기업에서 꼽은 혁신역량을 ‘종합’한 것. ② 사고력·리더십 아님. ③ 4차 산업혁명 시대임을 선언한 WEF 등에서 꼽은 역량. ⑤ 출처는 이정규 『성공하는 미래교육전략』.","source":{"page":21,"section":"영재학생의 4가지 혁신역량","quote":"혁신역량중에서도세계의정치, 경제지도자 , 대학의 석학들이모여4 차산업혁명 시대임을선언한세계경제포럼이나OECD, 그리고우리나라정부와각종위원회및대기업에서 꼽은혁신역량을종합해보면"}}]},{"lesson":3,"title":"우리나라 영재교육의 변화와 최근 동향","file":"4. 교안 (1~30)/03.pdf","summary":["발전과정: 1983~1989 경기과학고 설립(1983)·영재교육연구실 설치(1983)·신동프로젝트(1985~1988) 실패 → 1997~1998 교육기본법(제19조) 영재교육 의무화, 초중등교육법시행령(제90조5항) 과학계열 고등학교, 과기부 대학부설 과학영재교육센터 설립 → 2000~2002 영재교육진흥법(2000) 및 시행령(2002) 제정·공포, ‘영재’로 용어 통일 → 2003~2022 제1~4차 영재교육진흥종합계획, 수월성 종합계획(2004), 서울과학고 영재학교 전환(2009) → 2023~2027 제5차","신동프로젝트: 1985년 9월 청와대 지시, 1차 180여 명 → 85년 12월 2차 144명(만 3~6세), 65명 평균 IQ 142(상위 0.5%), 언어성 IQ 142.4 vs 102.1, 동작성 132.5 vs 98, 88년 이후 흐지부지","실패 원인: 1차적으로 사후관리 소홀한 정부, 본질적으로 산술적 평등주의·하향 평준화의 구조적 문제 / 교육의 원칙: 수월성과 형평성","선진국: 70년대 후반부터 영재교육, 미국 상위 3~5% + 연방정부 해마다 1천만 달러, 일부 주 상위 30%까지 / 미국 88년 영재교육진흥법, 51개 주 중 32개 주 의무화 / 이스라엘 73년 교육부 영재교육과, 상위 3% 초3~대학 / 대만 84년 특수교육법","우수한 고급두뇌 한 사람이 인구 100만 명을 먹여 살릴 수 있다 / 정부 계획: 2002년 중앙영재교육진흥위원회, 국립영재학교, 1000개 이상 영재학급","20년 지난 영재교육: 대상자 2003 1만9964(0.25%) → 2015 11만53(1.81%) → 2021 7만9048(1.49%), 교원 2007 7084 → 2017 2만5489 → 2021 2만137 / 과학영재고 경쟁률 15:1(2019) → 14:1 → 6:1(2021)","교육부(2023) 성과와 한계: 물적·인적 기반 마련, 운영 내실화·특성화 미흡 / 대상자 2013년부터 지속 감소 / 일부 졸업생 의약학계열 진학 지속","영재 정의: 재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 특별한 교육이 필요한 사람 (재능: 일반 지능, 특수 학문적성, 창의적 사고능력, 예술적 재능, 신체적 재능, 그 밖의 특별한 재능)","영재교육기관 = 영재학교, 영재교육원, 영재학급 / 담당교원 = 「초‧중등교육법」 제21조 교원자격 + 소정의 연수 이수 (영재학교는 박사학위 또는 해당 분야 5년 이상 경력 석사 등 임용 가능)","영재교육 체계: 영재학교(정부 주도 운영, 전문분야로 특화, 특수분야 소수정예·창의성 개발), 영재학급(각급 학교 운영, 방과 후/지역공동), 영재교육원(교육청·대학 등 운영, 주1회/방과후/주말, 방학 중 집중), 기반: 영재교육진흥법·영재교육진흥위원회·영재교육연구원","현황(교육부 2023): 대상자 72,518명(전체 5,275,054명의 1.37%), 초 37,153(51.2%)·중 24,289(33.5%)·고 11,076(15.3%), 기관 영재학교·과학고 28·영재교육원 340·영재학급 1,118, 학급당 15.3명, 수학·과학 63%, 소외계층 4,762명(6.56%)"],"questions":[{"id":"03-01","type":"옳은 것","q":"우리나라 영재교육의 발전과정에 대한 설명으로 옳은 것은?","box":null,"choices":["경기과학고는 1985년에 설립되었다.","영재교육진흥법은 2000년에, 시행령은 2002년에 제정·공포되었다.","서울과학고는 2004년에 영재학교로 전환되었다.","교육기본법 제90조에 영재교육이 의무화되었다.","제1~4차 영재교육진흥종합계획은 1997~2022년에 시행되었다."],"answer":2,"explain":"정답 ②. ① 경기과학고 설립은 1983년. ③ 서울과학고 영재학교 전환은 2009년(2004년은 창의적 인재육성을 위한 수월성 종합계획). ④ 교육기본법 제19조(제90조5항은 초중등교육법시행령). ⑤ 제1~4차는 2003~2022.","source":{"page":3,"section":"01. 영재교육의 발전과정","quote":"•영재교육진흥법 (2000)및시행령(2002)제정〮공포"}},{"id":"03-02","type":"옳지 않은 것","q":"영재교육진흥법 및 시행령 제정·공포 시기(2000~2002)의 내용으로 옳지 않은 것은?","box":null,"choices":["‘영재’로 용어 통일","영재교육기관 규정","영재교육담당교원 규정","중앙정부와 지자체의 지원 규정","과기부 대학부설 과학영재교육센터 설립"],"answer":5,"explain":"정답 ⑤: 과기부 대학부설 과학영재교육센터 설립은 1997~1998 시기 내용(교육기본법 제19조 영재교육 의무화, 초중등교육법시행령 제90조5항과 함께). ①~④는 2000~2002 시기 내용.","source":{"page":3,"section":"01. 영재교육의 발전과정","quote":"• ‘영재 ’로용어 통일•영재교육기관 규정•영재교육담당교원 규정•중앙정부와 지자체의지원규정"}},{"id":"03-03","type":"옳은 것","q":"우리나라 영재교육 발전과정 중 1983~1989년 시기의 내용으로 옳은 것은?","box":null,"choices":["경기과학고 설립, 영재교육연구실 설치, 신동프로젝트(1985~1988) 실패","교육기본법 제19조에 의한 영재교육 의무화","창의적 인재육성을 위한 수월성 종합계획 수립","영재교육진흥법 제정·공포","제1차 영재교육진흥종합계획 시행"],"answer":1,"explain":"정답 ①: 1983~1989 = 경기과학고 설립(1983), 영재교육연구실 설치(1983), 신동프로젝트(1985~1988) 실패. ② 1997~1998. ③ 2004. ④ 2000. ⑤ 2003~.","source":{"page":3,"section":"01. 영재교육의 발전과정","quote":"•경기과학고 설립( 1983) •영재교육연구실 설치(1983)•신동프로젝트 (1985~1988) 실패"}},{"id":"03-04","type":"옳은 것","q":"신동프로젝트(1985~1988)의 영재 선발 과정에 대한 설명으로 옳은 것은?","box":null,"choices":["1988년 9월 문교부의 자체 계획으로 시작되었다.","1차로 발굴된 전국 영재는 1백44명이었다.","85년 12월 2차로 당시 만 3~6세의 영재 1백44명을 추렸다.","선발된 영재들은 대부분 초등학교 고학년이었다.","장학관들은 학교에서 지필고사만으로 영재를 선발하였다."],"answer":3,"explain":"정답 ③. ① 1985년 9월 청와대 비서실의 지시로 시작. ② 1차 발굴은 1백80여 명, 144명은 2차. ④ 취학 전 만 3~6세. ⑤ 장학관들이 집을 직접 방문해 지능검사와 영재성테스트를 실시.","source":{"page":4,"section":"실패로 끝난 최초의 영재교육(신동프로젝트, 1985~1988)","quote":"이렇게해서1차로발굴된전국영재는1백80여명이었다. 장학관들은이들의 집을직접방문해지능검사와영재성테스트를했다. 85년12월2차로영재1백44명(당시만3~6세)을추렸다."}},{"id":"03-05","type":"옳지 않은 것","q":"신동프로젝트 영재들에 대한 검사 결과(중앙일보, 2001.3.26)로 옳지 않은 것은?","box":null,"choices":["1백44명 가운데 65명을 상대로 실시한 검사에서 평균 IQ는 142였다.","평균 IQ 142는 전국에서 상위 0.5% 안에 드는 수준이다.","영재집단의 언어성 IQ 점수는 142.4로 일반집단의 102.1보다 40포인트나 높았다.","5세 영재들과 이들보다 두 살 많은 7세 일반 아이들을 비교하였다.","동작성 IQ는 영재집단 98, 일반집단 132.5였다."],"answer":5,"explain":"정답 ⑤: 동작성은 영재집단 132.5, 일반집단 98(반대로 서술). ①~④는 교안과 일치. 당시 연구총책임은 교육개발원 임선하 박사.","source":{"page":5,"section":"실패로 끝난 최초의 영재교육(신동프로젝트, 1985~1988)","quote":"영재집단의언어성IQ점수는 142.4로일반집단의102.1보다40포인트나높았다. 동작성도영재집단은 132.5, 일반집단은98이었다."}},{"id":"03-06","type":"빈칸","q":"신동프로젝트 사례를 통해 교안이 제시한 시사점이다. (   )에 들어갈 말로 알맞은 것은?","box":"(유전과 환경) 타고난 영재성이 잘 발현되기 위해서는 (   )의 지원이 중요. (   )이 되기 위해서는 다양한 주체들의 관심과 지원이 중요","choices":["조기 선발","질 높은 영재교육","가정의 경제력","속진 학습","국가 주도 관리"],"answer":2,"explain":"정답 ② 질 높은 영재교육. 교안: 타고난 영재성이 잘 발현되려면 질 높은 영재교육의 지원이 중요하고, 질 높은 영재교육이 되려면 다양한 주체들의 관심과 지원이 중요.","source":{"page":6,"section":"실패로 끝난 최초의 영재교육(신동프로젝트, 1985~1988)","quote":"( 유전과 환경) 타고난 영재성이잘발현되기 위해서는질높은영재교육의지원이중요질높은 영재교육이되기위해서는다양한주체들의관심과지원이중요"}},{"id":"03-07","type":"빈칸","q":"다음은 ‘평준화 교육 이대론 안 된다’(중앙일보, 2001.3.26) 사례의 일부이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"영재들을 제대로 키우지 못한 책임은 1차적으로 ( ㄱ )를 소홀히 한 정부에 있다. … 그러나 영재들이 이처럼 ‘추락’한 것은 본질적으로 우리나라 교육의 구조적 문제 때문이라고 봐야 한다. 현재의 우리 교육체제는 ( ㄴ )를 토대로 하고 있다.","choices":["ㄱ: 사전선발, ㄴ: 수월성 원칙","ㄱ: 사후관리, ㄴ: 능력주의","ㄱ: 예산집행, ㄴ: 입시 경쟁주의","ㄱ: 사후관리, ㄴ: 산술적 평등주의","ㄱ: 교원연수, ㄴ: 산술적 평등주의"],"answer":4,"explain":"정답 ④: 1차적 책임은 사후관리를 소홀히 한 정부, 본질적으로는 산술적 평등주의를 토대로 하향 평준화를 고수하는 구조적 문제.","source":{"page":7,"section":"사례2: 평준화 교육 이대론 안된다","quote":"영재들을제대로키우지못한책임은1차적으로사후관리를소홀히한정부에 있다. … 현재의우리교육체제는산술적평등주의를 토대로하고있다."}},{"id":"03-08","type":"옳은 것","q":"‘평준화 교육 이대론 안 된다’(중앙일보, 2001.3.26)에서 소개한 선진국의 영재교육에 대한 설명으로 옳은 것은?","box":null,"choices":["선진국들은 90년대 후반부터 영재교육에 힘을 쏟기 시작했다.","미국 연방정부는 상위 1%의 영재만 지원한다.","미국 일부 주에서는 상위 10%까지만 심사 대상에 포함시킨다.","미국 연방정부는 가정환경 등이 어려운 영재 발굴을 위해 해마다 1천만 달러를 특별 지원하고 있다.","미국은 연방정부가 해마다 1억 달러를 특별 지원하고 있다."],"answer":4,"explain":"정답 ④. ① 70년대 후반부터. ② 상위 3~5%의 영재뿐 아니라 가정환경 등이 어려운 영재 발굴까지. ③ 일부 주는 상위 30%까지 심사 대상. ⑤ 1천만 달러.","source":{"page":8,"section":"사례2: 평준화 교육 이대론 안된다","quote":"이미선진국들은70년대후반부터영재교육에힘을쏟기시작했다. 미국의경우상위3~5%의영재뿐아니라가정환경등이어려운영재발굴을 위해연방정부가해마다1천만달러를특별지원하고있는실정이다."}},{"id":"03-09","type":"빈칸","q":"신동프로젝트 사례에서 도출한 교육의 원칙에 대한 내용이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"교육의 원칙: ( ㄱ )과 ( ㄴ )\n교육의 하향평준화 정책 고수는 교육의 후진성 → 교육의 ( ㄱ ) 전환","choices":["ㄱ: 형평성, ㄴ: 수월성","ㄱ: 자율성, ㄴ: 책무성","ㄱ: 수월성, ㄴ: 형평성","ㄱ: 보편성, ㄴ: 특수성","ㄱ: 효율성, ㄴ: 평등성"],"answer":3,"explain":"정답 ③: 교육의 원칙은 수월성과 형평성이며, 하향평준화 정책 고수는 교육의 후진성이므로 교육의 ‘수월성’ 전환이 필요. ① 순서가 뒤바뀌어 ‘형평성 전환’이 되므로 틀림.","source":{"page":9,"section":"실패로 끝난 최초의 영재교육(신동프로젝트, 1985~1988)","quote":"교육의원칙: 수월성과 형평성교육의하향평준화정책고수는교육의후진성교육의수월성전환"}},{"id":"03-10","type":"사례","q":"다음 학생들(중앙일보, 2001.3.26)의 공통점으로 교안에 제시된 것은?","box":"• MIT에 장학생으로 입학한 이건호 군(19)\n• 대입검정고시에서 최연소 합격한 김현규 군(14)\n• 과학고등학교에서 개별지도를 받고 있는 엄성민 군(16)\n• 초등학교 입학 전에 책 2000여 권을 읽은 최푸름 군(7)","choices":["모두 신동프로젝트를 통해 선발된 영재이다.","모두 영재학교를 조기 졸업하였다.","특정 분야에서 뛰어남을 인정받았으면서도 학교에서 따돌림을 당하거나 교육과정이 맞지 않아 정규교육과정을 포기했다.","모두 국가 장학금을 받아 해외 대학에 진학하였다.","모두 영재교육진흥법에 따라 영재학급에서 교육을 받았다."],"answer":3,"explain":"정답 ③: 교안은 이들이 어려서부터 특정 분야에서 남다르게 뛰어났지만 결국 학교에서 따돌림을 당하거나 교육과정이 맞지 않아 정규교육과정을 포기했다는 공통점을 제시. 이를 통해 획일화된 교육이 영재성을 사장시킨다는 지적을 소개. ①②④⑤는 교안에 없는 내용.","source":{"page":10,"section":"사례1: 영재교육진흥법 및 시행령 제정공포","quote":"어려서부터특정분야에서남다르게뛰어난점을 인정받았으면서도결국학교에서는따돌림을당하거나교육과정이맞지않아 정규교육과정을포기했던것."}},{"id":"03-11","type":"옳지 않은 것","q":"‘영재교육진흥법 및 시행령 제정공포’ 사례(중앙일보, 2001.3.26)에서 소개한 미국의 영재교육으로 옳지 않은 것은?","box":null,"choices":["미국은 지난 88년 영재교육진흥법을 제정했다.","51개 주 중에서 32개 주가 영재교육을 의무화하고 있다.","법의 핵심 내용에 국립영재교육연구소 설립이 포함된다.","영재교육의 형태는 월반과 조기진급, 조기졸업, 과목별 속진, 대학과목 수강 등 다양하다.","법의 핵심 내용은 상위 3% 이내 모든 학생에게 초등학교 3학년부터 대학까지 영재교육을 실시하는 것이다."],"answer":5,"explain":"정답 ⑤: 상위 3% 이내 학생에게 초등학교 3학년부터 대학교까지 영재교육을 실시하는 나라는 이스라엘(73년 교육부 영재교육과 설치). 미국 법의 핵심은 창의적·생산적 전문가 양성, 연구비 지원, 영재모델프로그램 지원, 국립영재교육연구소 설립.","source":{"page":11,"section":"사례1: 영재교육진흥법 및 시행령 제정공포","quote":"미국은지난88년영재교육진흥법을제정했다. 현재51개주중에서32개주가 영재교육을의무화하고있다."}},{"id":"03-12","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"정보화사회로 본격 진입하면서 두뇌전쟁은 소수 엘리트가 국가발전을 주도하는 형태를 띠고 있다. 우수한 고급두뇌 한 사람이 인구 (   )을 먹여 살릴 수 있다는 통계자료가 이를 입증한다.","choices":["1만 명","10만 명","1000만 명","100만 명","1억 명"],"answer":4,"explain":"정답 ④ 100만 명. 같은 기사에서 전문가들은 ‘영재에게만 특별한 혜택을 주자는 논리가 아니라 모든 학생이 각자의 특성에 맞는 교육을 받을 권리가 있다는 뜻’이라고 말함.","source":{"page":11,"section":"사례1: 영재교육진흥법 및 시행령 제정공포","quote":"우수한고급두뇌한사람이인구100만명을먹여 살릴수있다는통계자료가이를입증한다."}},{"id":"03-13","type":"옳은 것","q":"‘영재교육진흥법 및 시행령 제정공포’ 사례(중앙일보, 2001.3.26)에 소개된 내용으로 옳은 것은?","box":null,"choices":["이스라엘은 84년 교육부에 영재교육과를 설치하였다.","대만은 73년부터 장애아와 영재들을 위한 특수교육법을 제정하였다.","이스라엘은 상위 10% 이내 학생에게 영재교육을 실시한다.","우리 정부는 2002년에 중앙영재교육진흥위원회를 설치하고, 국공립 초·중·고교에 1000개 이상의 영재학급을 개설·운영키로 하는 계획을 발표했다.","우리 정부는 국립영재학교 설립 계획을 철회하였다."],"answer":4,"explain":"정답 ④. ① 이스라엘은 73년(84년은 대만). ② 대만은 84년. ③ 이스라엘은 상위 3% 이내. ⑤ 국립영재학교를 세우는 계획을 발표함.","source":{"page":12,"section":"사례1: 영재교육진흥법 및 시행령 제정공포","quote":"최근우리정부는체계적영재교육정책마련을위해오는2002년에 중앙영재교육진흥위원회를설치하고국립영재학교를세우는한편국공립 초·중·고교에1000개이상의영재학급을개설해운영키로한다는계획을 발표했다."}},{"id":"03-14","type":"빈칸","q":"‘영재교육에 대한 기대와 우려’를 정리한 교안 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"우리 교육시스템에서 뛰어난 학생은 갈 곳이 없는가? 영재성을 (   )하는 교육 / 선진국들은 고급두뇌자원 개발의 영재교육 활발 / 시작단계인 영재교육에 기대와 우려","choices":["발현","사장","계발","판별","확산"],"answer":2,"explain":"정답 ② 사장. 획일화된 교육이 영재성을 사장(死藏)시키고 있다는 지적을 정리한 것. ① 발현 ③ 계발은 반대 의미.","source":{"page":13,"section":"영재교육에 대한 기대와 우려","quote":"우리교육시스템에서뛰어난학생은갈곳이 없는가? 영재성을사장하는교육선진국들은고급두뇌자원개발의영재교육활발시작단계인영재교육에기대와우려"}},{"id":"03-15","type":"빈칸","q":"‘길 잃은 영재교육 20년’(중앙일보, 2022.9.24)의 내용이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"‘재능이 뛰어난 사람을 국가가 ( ㄱ ) 발굴해 키우겠다’고 한 게 영재교육진흥법의 구호였다. 하지만 현실은 ‘( ㄱ )’가 아니라, ‘( ㄴ )’ 가고 있다.","choices":["ㄱ: 앞서, ㄴ: 뒤로","ㄱ: 먼저, ㄴ: 나중에","ㄱ: 함께, ㄴ: 따로","ㄱ: 빨리, ㄴ: 늦게","ㄱ: 앞서, ㄴ: 옆으로"],"answer":1,"explain":"정답 ①: ‘앞서’가 아니라 ‘뒤로’ 가고 있다 → 영재교육 위기론. 기사에는 수업 중 질문·탐구하는 학생이 없고 ‘부모님이 시켜서 듣는다’는 학생 사례가 소개됨.","source":{"page":14,"section":"20년이 지난 지금의 영재교육","quote":"‘재능이뛰어난사람을국가가앞서발굴해키우겠다’고한게 영재교육진흥법의구호였다. 하지만현실은‘앞서‘가아니라, ‘뒤로’가고있다."}},{"id":"03-16","type":"사례","q":"다음 사례(중앙일보, 2022.9.24)가 보여주는 영재교육의 문제점으로 가장 적절한 것은?","box":"서울교대 영재원 수강생인 초등학교 3학년 윤모 학생은 “영재원에 다니는 학생들 대다수가 같은 학원 영재원 준비반 출신”이라며, “고1 선행학습까지 마쳤기 때문에 영재원에서 배우는 내용 자체는 다 아는 것”이라고 말했다.","choices":["영재교육 담당교원의 수가 지나치게 많다.","영재교육이 결국 입시를 위한 징검다리 역할을 하기도 한다.","영재교육원의 수업 시수가 지나치게 많다.","영재교육이 예체능 분야에 편중되어 있다.","영재교육 대상자가 지나치게 증가하고 있다."],"answer":2,"explain":"정답 ②: 교안은 ‘영재교육이 결국 입시를 위한 징검다리 역할을 하기도 한다’며 이 사례를 제시(사교육·선행학습 문제). ⑤ 대상자는 오히려 감소 추세. ①③④는 사례와 무관.","source":{"page":15,"section":"20년이 지난 지금의 영재교육","quote":"영재교육이 결국입시를위한징검다리역할을하기도한다."}},{"id":"03-17","type":"옳지 않은 것","q":"‘감소하는 영재교육대상자’(중앙일보, 2022.9.24) 자료에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["2003년 영재교육대상자는 1만9964명(0.25%)이었다.","2021년 영재교육대상자는 7만9048명(1.49%)이었다.","영재교육 담당교원 수는 2017년 2만5489명에서 2021년 2만137명으로 줄었다.","대상자·담당교원·기관 수가 줄어든 것은 학령인구 감소만이 원인이라고 분석하였다.","정부의 무관심과 예산 급감, 영재교육 중요성의 인식 부족이 낳은 결과라고 지적하였다."],"answer":4,"explain":"정답 ④: 기사는 ‘학령인구 감소만 탓할 순 없다’며 정부의 무관심, 예산 급감, 영재교육 중요성의 인식 부족이 낳은 결과라고 지적. ①②③⑤는 자료와 일치(참고: 2015년 11만53명 1.81%, 2017년 10만9266명 1.81%, 교원 2007년 7084명).","source":{"page":16,"section":"20년이 지난 지금의 영재교육","quote":"“영재교육대상자·담당교원·기관수가일제히줄어들었다는것은학령인구 감소만탓할순없다”며“정부의무관심과예산급감, 영재교육중요성의인식 부족이낳은결과”"}},{"id":"03-18","type":"옳은 것","q":"‘인기 떨어지는 과학고·영재고’(중앙일보, 2022.9.24) 자료에 대한 설명으로 옳은 것은?","box":null,"choices":["8개 과학영재고 평균 정원 내 경쟁률은 2019년 6:1에서 2021년 15:1로 높아졌다.","8개 과학영재고 평균 정원 내 경쟁률은 2019년 15:1, 2020년 14:1, 2021년 6:1로 낮아졌다.","진학 희망율은 2019년 4.4%에서 2021년 4.8%로 높아졌다.","정원 내 경쟁률은 20개 과학고 평균이다.","진학 희망율은 3년간 변화가 없었다."],"answer":2,"explain":"정답 ②: 정원 내 경쟁률(8개 과학영재고 평균) 15:1 → 14:1 → 6:1. ① 반대. ③ 진학 희망율은 4.8 → 4.5 → 4.4로 감소. ④ 8개 과학영재고 평균. ⑤ 감소함.","source":{"page":17,"section":"20년이 지난 지금의 영재교육","quote":"인기떨어지는과학고· 영재고 / 15:114:1 / 단위: % (지원년도기준)정원내경쟁률(8 개과학영재고 평균)진학희망율 / 6:14.8 / 4.54.4 / 2019년2020년2021년"}},{"id":"03-19","type":"빈칸","q":"‘영재학교 떠나는 영재들…한국 영재교육 어디로?’(YTN, 2023.8.25) 사례에 대한 교안 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   ) 자퇴 건(2023.8.)으로 영재교육 및 고도영재 중간점검","choices":["서울과학고","한국과학영재학교","경기과학고","대구과학고","세종과학예술영재학교"],"answer":1,"explain":"정답 ① 서울과학고. 교안: 서울과학고 자퇴 건(2023.8.)으로 영재교육 및 고도영재 중간점검.","source":{"page":18,"section":"20년이 지난 지금의 영재교육","quote":"서울과학고자퇴건(2023.8.)으로영재교육및고도영재중간점검"}},{"id":"03-20","type":"옳지 않은 것","q":"‘대학만 보고 질주하는 영재학교엔, 조기입학 어린 영재 설 자리가 없다’(한국일보, 2023.10.11) 사례의 내용으로 옳지 않은 것은?","box":null,"choices":["[영재, 미로를 헤매다] 좌절하는 어린 영재","조기입학 영재는 제때 입학한 영재보다 중도포기율이 낮다.","영재고도 대입이 지상과제여서 어린 영재를 배려하지 못한다.","전문가는 영재학교의 대입 부담을 덜고 대인관계 교육이 필요하다고 하였다.","어린 영재들이 월반해 빨리 대학에 입학해도 뛰어난 학자로 자라났다는 해피엔딩을 접하긴 어렵다."],"answer":2,"explain":"정답 ②: 기사는 ‘조기입학 영재, 제때 입학보다 중도포기율 높아’라고 함. ①③④⑤는 기사 내용과 일치.","source":{"page":19,"section":"20년이 지난 지금의 영재교육","quote":"• 조기입학영재, 제때입학보다중도포기율높아 • 영재고도대입이지상과제... 어린영재배려못해 • 전문가“영재학교대입부담덜고대인관계교육”"}},{"id":"03-21","type":"빈칸","q":"교안의 ‘20년이 지난 지금의 영재교육’ 사례4(KBS, 2023.3.19)의 제목이다. (   )에 들어갈 말로 알맞은 것은?","box":"영재학교 졸업생 (   ) 의대 진학","choices":["2명 중 1명","5명 중 1명","100명 중 1명","20명 중 1명","10명 중 1명"],"answer":5,"explain":"정답 ⑤ 10명 중 1명. 함께 제시된 사례5(EBS, 2023.9.25)는 ‘교육비 환수해도 ‘의대’ 가는 영재학교 학생들…대책은?’.","source":{"page":20,"section":"20년이 지난 지금의 영재교육","quote":"사례4: 영재학교 졸업생10명중1 명의대 진학 / ( 출처 - KBS, 2023. 3. 19) / 사례5 : 교육비 환수해도‘의대 ’ 가는 영재학교학생들…대책은 ?"}},{"id":"03-22","type":"옳지 않은 것","q":"교육부(2023)가 진단한 ‘20년이 지난 지금의 영재교육 성과와 한계’로 옳지 않은 것은?","box":null,"choices":["영재교육이 국내에 도입된 지 20년이 경과되어 물적·인적 기반은 마련되었다.","운영의 내실화 및 특성화는 미흡하다.","학령 인구 감소, 영재교육의 관심 저하 등으로 영재교육대상자가 2017년부터 지속적으로 감소하였다.","영재학교·과학고 설립 목적 및 학교의 노력에도 불구하고 일부 졸업생의 의약학계열 진학이 지속되고 있다.","제5차 영재교육진흥종합계획을 통해 새로운 재도약을 위한 영재교육의 방향을 재정립하고자 한다."],"answer":3,"explain":"정답 ③: 교육부(2023)는 영재교육대상자가 ‘2013년부터’ 지속적으로 감소했다고 진단. ①②④⑤는 교안과 일치.","source":{"page":21,"section":"20년이 지난 지금의 영재교육 성과와 한계 교육부(2023)","quote":"‣ 학령 인구감소, 영재교육의 관심저하등으로영재교육대상자가2013년부터지속적으로감소"}},{"id":"03-23","type":"옳지 않은 것","q":"영재교육진흥법 및 시행령에서 영재를 정의할 때 제시한 ‘재능’에 해당하지 않는 것은?","box":null,"choices":["일반 지능","특수 학문적성","창의적 사고능력","정서적 공감능력","신체적 재능"],"answer":4,"explain":"정답 ④: 재능 = 일반 지능, 특수 학문적성, 창의적 사고능력, 예술적 재능, 신체적 재능, 그 밖의 특별한 재능. 정서적 공감능력은 명시되어 있지 않음. 영재란 ‘재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 특별한 교육이 필요한 사람’.","source":{"page":23,"section":"02. 영재교육 체계 – 주요 용어 해설","quote":"* 일반 지능, 특수 학문적성, 창의적 사고능력, 예술적 재능, 신체적재능, 그밖의 특별한재능"}},{"id":"03-24","type":"빈칸","q":"영재교육진흥법 및 시행령의 ‘영재’ 정의이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"재능이 뛰어난 사람으로서 ( ㄱ )을 계발하기 위하여 ( ㄴ )이 필요한 사람을 말한다.","choices":["ㄱ: 타고난 잠재력, ㄴ: 특별한 교육","ㄱ: 학업 성취, ㄴ: 속진 교육","ㄱ: 타고난 잠재력, ㄴ: 국가의 지원","ㄱ: 창의적 역량, ㄴ: 특별한 교육","ㄱ: 우수한 지능, ㄴ: 개별 상담"],"answer":1,"explain":"정답 ①: ‘재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 특별한 교육이 필요한 사람’.","source":{"page":23,"section":"02. 영재교육 체계 – 주요 용어 해설","quote":"재능*이뛰어난사람으로서타고난잠재력을계발하기 / 위하여특별한교육이필요한사람을말한다."}},{"id":"03-25","type":"보기 조합","q":"영재교육진흥법 및 시행령에서 규정한 ‘영재교육기관’을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 영재학교\nㄴ. 과학고등학교\nㄷ. 영재교육원\nㄹ. 영재학급","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"answer":5,"explain":"정답 ⑤ ㄱ, ㄷ, ㄹ: 영재교육기관이란 영재학교, 영재교육원, 영재학급. 과학고는 「초‧중등교육법」에 근거한 학교로 영재교육기관 정의에 포함되지 않음. 영재교육은 ‘영재를 대상으로 각 개인의 능력과 소질에 맞는 내용과 방법으로 실시하는 교육’.","source":{"page":24,"section":"02. 영재교육 체계 – 주요 용어 해설","quote":"영재교육기관이란? / 영재학교, 영재교육원, 영재학급을말한다."}},{"id":"03-26","type":"옳지 않은 것","q":"영재교육진흥법 및 시행령의 ‘영재교육담당교원’에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["「초‧중등교육법」 제21조에 따른 교원자격이 있고 소정의 연수를 이수한 자를 말한다.","영재학교는 박사학위 취득 등 일정한 자격요건을 갖춘 자를 임용할 수 있다.","해당 분야에 3년 이상 경력이 있는 학사학위 취득자는 영재학교에 임용될 수 있다.","해당 교과 분야에서 동등한 수준의 학위와 영재교육 능력을 보유한 경우 교원자격을 갖춘 자를 우선 임용한다.","해당 분야에 특수한 능력을 보유한 자로서 영재교육을 담당할 능력이 있다고 인정되는 자도 자격요건에 포함된다."],"answer":3,"explain":"정답 ③: 자격요건은 ‘박사학위를 취득하거나 해당 분야에 5년 이상 경력이 있는 석사학위 취득자’ 또는 특수한 능력 보유자. ①②④⑤는 교안과 일치.","source":{"page":25,"section":"02. 영재교육 체계 – 주요 용어 해설","quote":"* 박사학위를 취득하거나해당분야에5 년이상 경력이있는석사학위취득자, 또는 해당분야에특수한능력을보유한자로서영재교육을담당할능력이있다고인정되는자"}},{"id":"03-27","type":"옳은 것","q":"교안의 ‘영재교육 체계 구성’에 대한 설명으로 옳은 것은?","box":null,"choices":["영재학급은 교육청, 대학 등이 운영하며 주1회/주말/방학 중 집중 프로그램을 운영한다.","영재교육원은 각급 학교에서 방과 후/지역공동으로 운영한다.","영재학교는 정부 주도로 운영되며 전문분야로 특화되어 있고, 특수분야 소수정예·창의성 개발을 담당한다.","영재학급과 영재교육원은 소수정예 특수분야 교육을 담당한다.","영재교육 체계의 기반은 초중등교육법, 교육과정심의회, 한국과학창의재단이다."],"answer":3,"explain":"정답 ③. ①② 영재학급과 영재교육원의 설명이 뒤바뀜 — 영재학급은 각급 학교 운영(방과 후/지역공동), 영재교육원은 교육청·대학 등 운영(주1회/방과후/주말, 방학 중 집중 프로그램). ④ 영재학급·영재교육원은 영재성 발굴·개발 저변확대. ⑤ 기반은 영재교육진흥법, 영재교육진흥위원회, 영재교육연구원.","source":{"page":26,"section":"02. 영재교육 체계 – 영재교육 체계 구성","quote":"특수분야소수정예, 창의성개발 / 영재학교정부주도운영 전문분야로특화"}},{"id":"03-28","type":"옳지 않은 것","q":"교육부(2023) 제5차 영재교육진흥종합계획의 ‘영재교육 현황’ 자료로 옳지 않은 것은?","box":null,"choices":["영재교육대상자는 72,518명으로 전체 학생 5,275,054명의 1.37%이다.","영재교육대상자 중 초등학생이 37,153명(51.2%)으로 가장 많다.","영재교육기관 수는 영재학급 1,118개, 영재교육원 340개, 영재학교·과학고 28개이다.","분야별 영재교육대상자 중 수학, 과학 분야가 45,714명(63%)이다.","영재교육대상자 중 소외계층은 11,076명(15.3%)이다."],"answer":5,"explain":"정답 ⑤: 소외계층은 4,762명(6.56%). 11,076명(15.3%)은 고등학생 대상자 수. 참고: 중학생 24,289명(33.5%), 학급당 학생 수 15.3명, 발명·정보과학·외국어·예체능·인문사회·융합·기타 26,804명(37%).","source":{"page":27,"section":"02. 영재교육 체계 – 영재교육 현황","quote":"소외계층비율 / 영재교육대상자비율 5,275,054명 / 72,518명 / 45,714명(63%) / 26,804명(37%) / 4,762명(6.56%) / 72,518명(1.37%)"}},{"id":"03-29","type":"빈칸","q":"교육부(2023) ‘영재교육 현황’ 자료이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"• 영재교육대상자 중 중학생: ( ㄱ )\n• 학급당 학생 수: ( ㄴ )","choices":["ㄱ: 24,289명(33.5%), ㄴ: 15.3명","ㄱ: 37,153명(51.2%), ㄴ: 15.3명","ㄱ: 24,289명(33.5%), ㄴ: 20명","ㄱ: 11,076명(15.3%), ㄴ: 12.5명","ㄱ: 26,804명(37%), ㄴ: 15.3명"],"answer":1,"explain":"정답 ①: 중학생 24,289명(33.5%), 학급당 학생 수 15.3명. ② 37,153명(51.2%)은 초등학생. ④ 11,076명(15.3%)은 고등학생. ⑤ 26,804명(37%)은 수학·과학 외 분야 대상자.","source":{"page":27,"section":"02. 영재교육 체계 – 영재교육 현황","quote":"학급당학생수 / 1,118개 / 15.3명 / 영재교육대상자수 37,153명(51.2%) / 340개 / 24,289명(33.5%) / 11,076명(15.3%) / 28개"}}]},{"lesson":4,"title":"영재교육정책 제대로 알아보기: 제5차 영재교육진흥종합계획 해설(1)","file":"4. 교안 (1~30)/04.pdf","summary":["영재교육정책: 원리 = “수월성(excellence)” vs. “형평성(equity)”, 주체 = 중앙부처(교육부)와 전국 17개 시도교육청, 대상 = 영재교육기관·영재교육 담당교원·영재교육 대상자, 요소 = 자원(예산, 시설, 인력 등)의 효율적 배분","법률 체계: 헌법 → 교육기본법 → 영재교육진흥법(시행령) → 제5차 영재교육진흥종합계획(2023-2027) → 영재교육진흥기본계획 → 시행계획 → 세부추진계획","헌법 제31조 1항: 모든 국민은 능력과 적성에 따라 교육을 받을 권리 / 교육기본법 제3조(학습권), 제12조 2항(학습자), 제19조(영재교육: 학문·예술 또는 체육 등의 분야에서 재능이 특히 뛰어난 사람의 교육에 필요한 시책)","영재교육진흥법 제1조(목적): 교육기본법 제12조 및 제19조에 따라 재능이 뛰어난 사람을 조기에 발굴, 타고난 잠재력 계발, 개인의 자아실현과 국가·사회 발전에 기여","사업근거: 교육기본법 제19조 영재교육 의무조항, 영재교육진흥법(2017.12.19. 법률 제15231호), 시행령(2017.07.26. 대통령령 제28211호)","종합계획 변천: 1차(2003~2007) 능력과 소질 극대화·발굴·육성 체계 확립 / 2차(2008~2012) 국가경쟁력 강화·전체 학생 1%(7만여 명) / 3차(2013~2017) 영재교육 최적화·창조적 인재·질적 수준 제고 / 4차(2018~2022) 창의융합인재·희망 학생에게 기회 / 5차(2023~2027) 사회 각 분야에서 혁신을 주도하는 창의적인 인재 양성","제5차 5대 영역: [선발·발굴] 잠재력 있는 인재 발굴, [교육·지원] 맞춤형 교육·지원 확대, [기관·체제] 교육기관 운영의 특성화, [교원·강사] 교원의 전문성·역량 강화, [행·재정·환경] 지속가능한 교육기반 마련","수립배경: 디지털 사회 대전환, 전염병·기후 위기, 국가간 경쟁 심화, 학령인구 급격한 감소 / 교육 패러다임 전환: 지식 중심 분절적 교과교육 → 주제 중심 교과융합 및 역량 교육","수혜자 추이: 2007 4만6천 명 → 2013 12만1천 명(최고점) → 2017 10만9천 명 → 2022 7만2천 명","제5차 중점: 숨은 인재 발굴, 개인 특성 맞춤형 교육, 양적으로 성장해온 영재교육을 내실화하여 사회적 책임","성과와 한계: 양질의 프로그램 개발, 교사 관찰추천제 도입 / ‘선발’에서 ‘교육’으로 패러다임 전환 시도, ’20년 관심 급감 / 상급학교 진학 시 이력 미반영, 일반교육과 차별성 부족, 학교생활기록부 글자 수 불리 / 수학·과학 중심 운영 / 고도영재 정책 미흡 / 소수 ‘엘리트교육’ 부정적 인식"],"questions":[{"id":"04-01","type":"빈칸","q":"교안에서 제시한 영재교육정책의 원리이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"정책의 원리: “( ㄱ )(excellence)” vs. “( ㄴ )(equity)”의 원리","choices":["ㄱ: 수월성, ㄴ: 형평성","ㄱ: 효율성, ㄴ: 평등성","ㄱ: 탁월성, ㄴ: 공정성","ㄱ: 형평성, ㄴ: 수월성","ㄱ: 자율성, ㄴ: 책무성"],"answer":1,"explain":"정답 ①: 수월성(excellence) vs. 형평성(equity). ④는 영어 대응이 뒤바뀜. 영재교육정책은 영재교육 현장이 체계적으로 잘 구성되고 운영되기 위해 반드시 필요함.","source":{"page":4,"section":"01. 우리나라 영재교육정책에 대한 체계 – 영재교육정책은 왜 필요한가?","quote":"‣ “수월성 (excellence)” vs. “형평성(equity)”의원리"}},{"id":"04-02","type":"옳지 않은 것","q":"교안에서 설명한 영재교육정책의 구성으로 옳지 않은 것은?","box":null,"choices":["정책의 원리: 수월성 vs. 형평성","정책의 주체: 중앙부처(교육부)와 전국 18개 시도교육청","정책의 대상: 영재교육기관, 영재교육 담당교원, 영재교육 대상자 등","정책의 요소: 자원(예산, 시설, 인력 등)의 효율적 배분","영재교육정책은 영재교육 현장이 체계적으로 잘 구성되고 운영되기 위해 반드시 필요하다."],"answer":2,"explain":"정답 ②: 정책의 주체는 중앙부처(교육부)와 전국 ‘17개’ 시도교육청. ①③④⑤는 교안과 일치.","source":{"page":4,"section":"01. 우리나라 영재교육정책에 대한 체계 – 영재교육정책은 왜 필요한가?","quote":"‣ 중앙부처 ( 교육부 ) 와전국 17개시도교육청 정책의대상 / ‣ 영재교육기관 , 영재교육 담당교원, 영재교육 대상자등정책의요소 / ‣ 자원 ( 예산 , 시설 , 인력 등) 의효율적 배분"}},{"id":"04-03","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재교육 현장이 체계적으로 잘 구성되고 운영되기 위해서 반드시 필요한 “(   )”","choices":["예산","교육과정","정책","평가","교원"],"answer":3,"explain":"정답 ③ 정책. 교안은 영재교육정책이 왜 필요한가에 대해 영재교육 현장이 체계적으로 잘 구성·운영되기 위해 반드시 필요한 ‘정책’이라고 설명.","source":{"page":3,"section":"01. 우리나라 영재교육정책에 대한 체계 – 영재교육정책은 왜 필요한가?","quote":"영재교육현장이체계적으로잘구성되고 운영되기위해서반드시필요한“정책”"}},{"id":"04-04","type":"옳은 것","q":"영재교육정책의 근간이 되는 법률 및 계획의 위계(순서)로 옳은 것은?","box":null,"choices":["교육기본법 → 헌법 → 영재교육진흥법(시행령) → 제5차 영재교육진흥종합계획","헌법 → 영재교육진흥법(시행령) → 교육기본법 → 제5차 영재교육진흥종합계획","헌법 → 교육기본법 → 제5차 영재교육진흥종합계획 → 영재교육진흥법(시행령)","헌법 → 교육기본법 → 영재교육진흥법(시행령) → 제5차 영재교육진흥종합계획","영재교육진흥법(시행령) → 헌법 → 교육기본법 → 제5차 영재교육진흥종합계획"],"answer":4,"explain":"정답 ④: 헌법 → 교육기본법 → 영재교육진흥법(시행령) → 제5차 영재교육진흥종합계획(2023-2027), 이후 영재교육진흥기본계획 → 시행계획 → 세부추진계획.","source":{"page":5,"section":"01. 우리나라 영재교육정책에 대한 체계 – 영재교육정책의 근간이 되는 법률","quote":"헌법 / 교육기본법영재교육진흥법 / ( 시행령 ) / 제5 차영재교육 진흥종합계획(2023 - 2027) / 영재교육진흥기본계획 →시행계획 →세부추진계획"}},{"id":"04-05","type":"개념 찾기","q":"“모든 국민은 능력과 적성에 따라 교육을 받을 권리를 가진다.”는 영재교육정책의 근간이 되는 법률 조항은?","box":null,"choices":["헌법 제31조 1항","교육기본법 제3조","교육기본법 제19조","영재교육진흥법 제1조","헌법 제19조 1항"],"answer":1,"explain":"정답 ① 헌법 제31조 1항. ② 교육기본법 제3조(학습권)는 ‘모든 국민은 평생에 걸쳐 학습하고 능력과 적성에 따라 교육받을 권리’. ③ 교육기본법 제19조는 영재교육 조항. ④ 영재교육진흥법 제1조는 목적. ⑤ 교안에 없음.","source":{"page":6,"section":"영재교육정책 수립과 시행의 근간이 되는 법률 – 헌법","quote":"제31 조1 항 모든국민은능력과적성에따라교육을받을권리를가진다."}},{"id":"04-06","type":"옳지 않은 것","q":"교육기본법의 조항과 내용의 연결로 옳지 않은 것은?","box":null,"choices":["제3조(학습권) – 모든 국민은 평생에 걸쳐 학습하고 능력과 적성에 따라 교육받을 권리를 가진다.","제12조 2항(학습자) – 교육내용·교육 방법·교재 및 교육 시설은 학습자의 인격을 존중하고 개성을 중시하여 학습자의 능력이 최대한으로 발휘될 수 있도록 마련되어야 한다.","제19조(영재교육) – 국가와 지방자치단체는 재능이 특히 뛰어난 사람의 교육에 필요한 시책을 수립·실시하여야 한다.","제12조(영재교육) – 모든 국민은 능력과 적성에 따라 교육을 받을 권리를 가진다.","제19조는 학문·예술 또는 체육 등의 분야를 명시하고 있다."],"answer":4,"explain":"정답 ④: 영재교육 조항은 제19조이며, ‘모든 국민은 능력과 적성에 따라 교육을 받을 권리’는 헌법 제31조 1항. 제12조 2항은 ‘학습자’ 조항. ①②③⑤는 교안과 일치.","source":{"page":7,"section":"영재교육정책 수립과 시행의 근간이 되는 법률 – 교육기본법","quote":"제19 조( 영재교육 )국가와지방자치단체는학문ㆍ예술또는체육등의분야에서재능이특히뛰어난사람의교육에필요한시책을수립ㆍ실시하여야한다."}},{"id":"04-07","type":"빈칸","q":"다음은 교육기본법 제19조(영재교육)이다. (   )에 들어갈 말로 알맞은 것은?","box":"국가와 지방자치단체는 (   ) 등의 분야에서 재능이 특히 뛰어난 사람의 교육에 필요한 시책을 수립ㆍ실시하여야 한다.","choices":["수학ㆍ과학 또는 정보","학문ㆍ예술 또는 체육","과학ㆍ기술 또는 공학","인문ㆍ사회 또는 예술","발명ㆍ창업 또는 기술"],"answer":2,"explain":"정답 ② 학문ㆍ예술 또는 체육. 나머지는 조문과 다름.","source":{"page":7,"section":"영재교육정책 수립과 시행의 근간이 되는 법률 – 교육기본법","quote":"국가와지방자치단체는학문ㆍ예술또는체육등의분야에서재능이특히뛰어난사람의교육에필요한시책을수립ㆍ실시하여야한다."}},{"id":"04-08","type":"빈칸","q":"다음은 영재교육진흥법 제1조(목적)이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"이 법은 교육기본법 ( ㄱ )의 규정에 따라 재능이 뛰어난 사람을 조기에 발굴하여 타고난 잠재력을 계발할 수 있도록 능력과 소질에 맞는 교육을 실시함으로써 ( ㄴ )을 도모하고 국가·사회의 발전에 기여하게 함을 목적으로 한다.","choices":["ㄱ: 제3조 및 제19조, ㄴ: 개인의 자아실현","ㄱ: 제12조 및 제19조, ㄴ: 국가경쟁력 강화","ㄱ: 제12조 및 제19조, ㄴ: 개인의 자아실현","ㄱ: 제19조 및 제31조, ㄴ: 개인의 자아실현","ㄱ: 제3조 및 제12조, ㄴ: 교육의 수월성"],"answer":3,"explain":"정답 ③: 교육기본법 제12조 및 제19조, 개인의 자아실현. 시행령 제1조(목적)는 ‘영재교육진흥법에서 위임된 사항과 그 시행에 관하여 필요한 사항을 규정함’.","source":{"page":8,"section":"영재교육정책 수립과 시행의 근간이 되는 법률 – 영재교육진흥법(시행령)","quote":"이법은 교육기본법제12 조및제19 조의 규정에따라재능이뛰어난사람을조기에발굴하여타고난잠재력을계발할수있도록 능력과소질에맞는교육을실시함으로써개인의자아실현을도모하고국가· 사회의 발전에기여하게함을목적으로한다."}},{"id":"04-09","type":"개념 찾기","q":"“이 영은 영재교육진흥법에서 위임된 사항과 그 시행에 관하여 필요한 사항을 규정함을 목적으로 한다.”에 해당하는 것은?","box":null,"choices":["교육기본법 제19조","영재교육진흥법 제1조","헌법 제31조","영재교육진흥법 시행령 제1조","제5차 영재교육진흥종합계획"],"answer":4,"explain":"정답 ④ 영재교육진흥법 시행령 제1조(목적). ② 영재교육진흥법 제1조는 ‘재능이 뛰어난 사람을 조기에 발굴…개인의 자아실현…’.","source":{"page":8,"section":"영재교육정책 수립과 시행의 근간이 되는 법률 – 영재교육진흥법(시행령)","quote":"시행령제1 조 ( 목적 ) / 이영은영재교육진흥법에서 위임된사항과그시행에 관하여필요한사항을규정함을목적으로한다."}},{"id":"04-10","type":"옳지 않은 것","q":"교안(서울특별시교육청 2023학년도 영재교육 세부추진계획)에 제시된 제5차 영재교육진흥종합계획 관련 내용으로 옳지 않은 것은?","box":null,"choices":["교육부는 2023년부터 향후 5년간 영재교육의 방향과 과제를 담은 제5차 영재교육진흥종합계획(2023~2027)을 발표하였다.","영재교육진흥기본계획 → 영재교육진흥시행계획 → (교육청 및 영재교육기관) 세부추진계획 순으로 구체화된다.","사업근거로 교육기본법 제19조 영재교육 의무조항이 제시되었다.","사업근거로 영재교육진흥법(2017.12.19. 법률 제15231호)이 제시되었다.","사업근거로 영재교육진흥법 시행령(2017.12.19. 법률 제28211호)이 제시되었다."],"answer":5,"explain":"정답 ⑤: 시행령은 ‘2017.07.26. 대통령령 제28211호’. ①~④는 교안과 일치. 이 밖에 2023년도 서울교육 주요업무(2023.1. 서울시교육청)도 사업근거.","source":{"page":9,"section":"영재교육정책 수립과 시행의 근간이 되는 법률 – 제5차 영재교육진흥종합계획","quote":"• 교육기본법 제19 조영재교육 의무조항• 영재교육진흥법 (2017.12.19. 법률제15231 호)• 영재교육진흥법시행령 (2017.07.26. 대통령령제28211 호)"}},{"id":"04-11","type":"개념 찾기","q":"정부의 5개년 영재교육종합계획 중 ‘잠재력 발현 고도화를 통한 국가경쟁력 강화’와 ‘전체 학생 1%(7만여 명)에게 영재교육 제공’을 주요 이슈로 한 것은?","box":null,"choices":["1차(2003~2007)","2차(2008~2012)","3차(2013~2017)","4차(2018~2022)","5차(2023~2027)"],"answer":2,"explain":"정답 ② 2차(2008~2012). ① 1차: 각 개인의 능력과 소질 극대화, 영재 발굴·육성 체계 확립. ③ 3차: 영재교육 최적화를 통한 창조적 인재 육성, 질적 수준 제고. ④ 4차: 재능 계발 영재교육 기회 확대를 통한 창의융합인재 육성, 희망 학생에게 기회 제공. ⑤ 5차: 사회 각 분야에서 혁신을 주도하는 창의적인 인재 양성.","source":{"page":11,"section":"02. 제5차 영재교육진흥종합계획 – 정부의 5개년 영재교육종합계획에서 주요 이슈는?","quote":"2차 / (2008~2012) / ‣ 잠재력 발현고도화를통한국가경쟁력강화‣ 전체 학생1% (7만여명) 에게 영재교육제공"}},{"id":"04-12","type":"옳은 것","q":"정부의 5개년 영재교육종합계획의 차수별 주요 이슈로 옳은 것은?","box":null,"choices":["1차(2003~2007) – 영재교육 최적화를 통한 창조적 인재 육성","3차(2013~2017) – 각 개인의 능력과 소질 극대화","4차(2018~2022) – 재능 계발 영재교육 기회 확대를 통한 창의융합인재 육성, 희망 학생에게 영재교육 기회 제공","5차(2023~2027) – 전체 학생 1%(7만여 명)에게 영재교육 제공","2차(2008~2012) – 영재교육 질적 수준 제고"],"answer":3,"explain":"정답 ③. ① 창조적 인재 육성은 3차. ② 능력과 소질 극대화는 1차. ④ 전체 학생 1%는 2차. ⑤ 질적 수준 제고는 3차.","source":{"page":11,"section":"02. 제5차 영재교육진흥종합계획 – 정부의 5개년 영재교육종합계획에서 주요 이슈는?","quote":"4차 / (2018~2022) / ‣ 재능 계발영재교육기회확대를통한창의융합인재육성‣ 희망 학생에게영재교육기회제공"}},{"id":"04-13","type":"옳지 않은 것","q":"제5차 영재교육종합계획의 세부추진과제 영역과 내용의 연결로 옳지 않은 것은?","box":null,"choices":["[선발·발굴] – 잠재력 있는 인재 발굴","[교육·지원] – 맞춤형 교육·지원 확대","[기관·체제] – 교육기관 운영의 특성화","[교원·강사] – 지속가능한 교육기반 마련","[행·재정·환경] – 지속가능한 교육기반 마련"],"answer":4,"explain":"정답 ④: [교원·강사]는 ‘교원의 전문성·역량 강화’. ‘지속가능한 교육기반 마련’은 [행·재정·환경]. 목차: 수립배경 → 그간의 성과와 한계 → 추진방향 및 과제 → 세부추진과제 → 정책기대효과.","source":{"page":12,"section":"제5차 영재교육종합계획의 목차","quote":"‣ [ 선발 ‧발굴 ] 잠재력 있는인재발굴‣ [ 교육 ‧지원 ] 맞춤형 교육‧지원 확대‣ [ 기관 ‧체제 ] 교육기관 운영의특성화‣ [ 교원 ‧강사 ] 교원의 전문성‧역량 강화‣ [ 행 ‧재정 ‧환경 ] 지속가능한 교육기반마련"}},{"id":"04-14","type":"옳지 않은 것","q":"제5차 영재교육종합계획의 수립배경으로 옳지 않은 것은?","box":null,"choices":["첨단과학기술 발달에 따른 디지털 사회로의 대전환","전염병·기후 위기 등 범지구적 문제 증가","경제·기술·안보 분야에서의 국가 간 경쟁 심화","학령인구의 급격한 증가","지식 중심의 분절적 교과교육에서 주제 중심의 교과융합 및 역량 교육으로의 교육 패러다임 전환"],"answer":4,"explain":"정답 ④: 수립배경은 학령인구의 급격한 ‘감소’. ①②③⑤는 교안과 일치. 국제 경쟁 심화는 해외 주요국의 자국우선주의 경향 강화 등으로 설명됨.","source":{"page":13,"section":"제5차 영재교육종합계획의 수립배경은 무엇인가요?","quote":"첨단과학기술발달에따른 디지털사회로의대전환, 전염병‧기후 위기등범지구적 문제증가, 경제· 기술 · 안보 분야에서의국가간경쟁 심화, 학령인구의급격한감소등"}},{"id":"04-15","type":"빈칸","q":"제5차 영재교육종합계획 수립배경 중 ‘교육 패러다임 전환’에 대한 설명이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"( ㄱ ) 중심의 분절적 교과교육에서 ( ㄴ ) 중심의 교과융합 및 역량 교육을 강조하는 방향으로 변화","choices":["ㄱ: 교사, ㄴ: 학생","ㄱ: 지식, ㄴ: 주제","ㄱ: 입시, ㄴ: 진로","ㄱ: 이론, ㄴ: 실습","ㄱ: 주제, ㄴ: 지식"],"answer":2,"explain":"정답 ②: 지식 중심 분절적 교과교육 → 주제 중심 교과융합 및 역량 교육. 이에 따라 학생 개개인의 잠재력을 계발하고 사회 각 분야의 창조적 혁신을 주도할 인재 양성이 국가적으로 더욱 중요한 과제가 됨.","source":{"p 도영재의 체계적인발굴‧지원 및일반 학생의재능과진로에따른심화교육에대한정책미흡 / ‣ 소수 엘리트교육이라는부정적인식 / • 소수를 위한‘엘리트교육’이라는부정적인식등으로영재교육의필요성과사회적공감대형성에한계"}}]},{"lesson":5,"title":"영재교육정책 제대로 알아보기: 제5차 영재교육진흥종합계획 해설(2)","file":"4. 교안 (1~30)/05.pdf","summary":["제5차 영재교육종합계획 비전: 사회 각 분야에서 혁신을 주도하는 창의적인 인재 양성","중점 추진과제 3가지: ① 숨은 인재 발굴 및 개별 학생 특성에 따른 맞춤형 지원 강화 ② 소프트웨어·인공지능 영재교육 강화 및 인문·사회·예술 등 영재교육 영역 다양화 ③ 영재학교 등 영재교육기관 내실화 및 성과 관리 추진","앞으로 달라질 모습: 영재 개념의 다층화(숨은 인재, 호기심이 많은 자, 재능이 우수한 자 등), 선교육·후선발을 통해 ‘교육 중심’ 영재교육으로 패러다임 전환, SW·AI 인재 육성, 불필요한 규제 개선으로 진입 장벽 해소","추진 중점 4가지와 과제: 고도영재 등 영재성에 따른 맞춤형 선발 교육(①-1, ②-1, ②-2) / 숨은 인재 성장·지원 체제 구축(①-1, ①-2, ②-3) / 디지털 분야 등 영역 확대·내실화(②-1, ②-2, ③) / 체계적 지원 및 성과 관리(④, ⑤)","추구하는 인간상: 개인 = 고유한 특성(개성)과 다름을 존중, 잠재력과 재능 발현 / 공공 = 사회 변화에 능동적 대응, 도전과 위협에 창의적이고 협력적으로 대처","추진과제 5영역: ①[선발·발굴] 잠재력 있는 인재 발굴 ②[교육·지원] 맞춤형 교육·지원 확대 ③[기관·체계] 교육기관 운영의 특성화 ④[교원·강사] 교원의 전문성·역량 강화 ⑤[행·재정·환경] 지속가능한 교육 기반 마련","고도영재: (2023년) 정책연구 → (2024년) 기준 설정 및 판별·지원 체계 시범 → (2025년~) 판별·지원 체계 운영 / 국가 수준의 판별 기준 마련","‘영재키움 프로젝트’ 참여 학생 수: (2022년) 670명 → (2024년) 770명 / 1:1 상담(멘토링) 등 소외계층 프로그램 확대","GIST·KAIST 부설 영재학교 설립 기획연구(과학기술정보통신부, 2023년~) / SW 영재학급 40개(2022)→100개(2027), SW 영재교육원 5개(2024)→15개(2027) / 영재학교·과학고 SW·AI 특화 교육과정 2개교(2022)→28개교(2025)","대학부설 예술영재교육원: (2022년) 8개 시도, 총 15개 → (2027년) 17개 시도별 1개 이상 / 예술 영역: 음악, 미술 → 미디어, 연극·영화, 만화창작 등 / ‘차세대 영재기업인교육원’ 확대","의약학 계열 진학 제재 방안: 2022학년도 입학생부터, 일반고 전출 권고, 학교생활기록부Ⅱ 제공, 교육비·장학금 환수 등","영재학교 입학 전형 사교육 유발 정도 매년 점검(2021년~), 학교 운영 성과평가 제도 도입(2025년~) / 영재학급 = 단위 학교 재능 계발 중심, 영재교육원 = 수준별 교육 및 전문가 사사 교육 중심"],"questions":[{"id":"05-01","type":"빈칸","q":"다음은 제5차 영재교육종합계획의 비전이다. (   )에 들어갈 말로 알맞은 것은?","box":"사회 각 분야에서 (   ) 창의적인 인재 양성","choices":["첨단 기술을 선도하는","혁신을 주도하는","국가 경쟁력을 높이는","공동체에 기여하는","미래 사회를 준비하는"],"answer":2,"explain":"제5차 영재교육종합계획 비전은 ‘사회 각 분야에서 혁신을 주도하는 창의적인 인재 양성’이다. ①③④⑤는 교안의 비전 문구에 없는 표현이다.","source":{"page":3,"section":"제5차 영재교육종합계획 비전","quote":"사회 각 분야에서 혁신을 주도하는 창의적인 인재 양성"}},{"id":"05-02","type":"옳은 것","q":"제5차 영재교육종합계획 비전 아래 제시된 중점 과제로 옳은 것은?","box":null,
