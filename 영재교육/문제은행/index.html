]},{"lesson":36,"title":"인문사회 융합영재교육 개발(2)","file":"4. 교안 (31~60)[1] (1)/36.pdf","summary":["칼 세이건 \"에덴의 용\": 우주 역사를 1년으로 변환 → 1월 1일 대폭발, 5월 1일 은하수 탄생, 9월 9일 태양계 탄생, 9월 14일 지구 탄생, 9월 25일 지구에 생명 출현, 12월 31일 13시 30분 유인원과 사람의 조상 출현(호모 에렉투스), 22시 30분 최초의 인간(호모 사피엔스)","12월 31일 23시 59분 35초 신석기 문명 농경사회·최초의 도시 메소포타미아 수메르 문명 / 52초 철기문물·아시리아 제국 / 56초 그리스 로마 문명 / 59초 르네상스와 대항해 시대(1450년 인쇄술 발명) / 59초~ 인간의 달 탐사(1966년 12월)","예측할 수 없는 미래사회 문제해결에 가장 핵심적인 질문과 답은 인문학에 있음: 무궁무진한 콘텐츠(유전적 진화/문화적 진화), 상상력·질문·사고력·경험, 가치와 윤리의식, 지혜와 통찰력·성찰","인문학적 역량 목표: 통찰(고차적 사고능력-비판·분석·종합 / 시민의식-공동체 의식·준법정신·환경의식·윤리의식·봉사정신·민주적 절차의 존중), 융합과 창의(창의력-창의적 사고 기능과 사고 성향 / 문제해결력), 소통(의사소통능력-토론에 집중·분명한 의견표현·의견존중 / 팀 만들기-긍정적인 태도·격려·경청)","인천과학예술융합영재학교 \"사회문제와 인문학적 상상력\" 1단원 상상하는 인간: 1-1 문학과 과학의 만남(3시간), 1-2 문학 속 과학적 상상(6시간), 1-3 문학과 과학의 발전적 만남(9시간, 2학년)","작가-작품: 쥘 베른-지구에서 달까지(우주선, 1865년 → 1902 프랑스 영화 \"달나라 여행\"), 에드거 앨런 포-한스 팔의 환상여행(열기구), 올더스 헉슬리-멋진 신세계(유전자 조작), 레이첼 카슨-침묵의 봄(환경)","베르나르 베르베르 = 문학가이면서 과학적 지식이 뛰어난 사람(개미 1991, 타나토노트 1994, 뇌 2001, 제3인류 2012, 특히 곤충) / 레이첼 카슨 = 과학자이면서 문학적 소양이 뛰어난 사람(존스홉킨스 동물학, 미국 해양생물학자, 침묵의 봄 1962, 4년간 직접 조사, \"뉴요커\" 연재, DDT 고발)","\"지구에서 달까지\" 토론: 착륙 시 역추진, 발사 후 대지 진동, 달의 공기와 물, 12 km/s 발사속도, 포신 길이 효과, 대포알 속 호흡·충격량","2. 소통하는 인간(자연과 인간에 대한 과학 / 우리의 현재는 과거의 미래 / 인간, 육체와 정신), 3. 미래를 내다보는 인간(과학기술과 인문학적 상상력 / 로봇문화와 융합적 사고 / 스마트폰과 스마트 라이프)","소집단 토의: 리더가 사회, 모두 한마디씩, 리더는 요점 정리 / 리더 역할: 타인 의견존중·자신의 견해 억제, 성급하게 판단하지 않고 수용과 격려의 자세","교수학습상 유의점: 속진이 아닌 심화학습 권장, 인문학적 소양·창의적 사고·고차원적 사고·학생주도적 수업·팀 만들기와 소통 유도","평가: 수행평가(산물평가-자료의 충실성·참신성·실용성·예술성 / 태도평가-발표 횟수·질문 횟수·상호평가 / 역량평가-리커트 척도나 상중하) + 지필평가(객관식·단답형·서술형) / 프로그램 평가: 내용(추상적·복잡·다양·인물연구·방법연구), 과정(열린 문제 등), 산출(실제 문제·실생활 적용·실제 대중 발표·적절한 평가)"],"questions":[{"id":"36-01","type":"개념 찾기","q":"과학자 칼 세이건이 \"에덴의 용\"에서 우주 역사를 1년으로 변환한 내용 중 '지구 탄생'에 해당하는 날짜는?","box":null,"choices":["1월 1일","5월 1일","9월 9일","9월 14일","9월 25일"],"answer":4,"explain":"교안의 1년 달력에서 지구 탄생은 9월 14일이다. ① 1월 1일은 대폭발, ② 5월 1일은 은하수 탄생, ③ 9월 9일은 태양계 탄생, ⑤ 9월 25일은 지구에 생명 출현이다.","source":{"page":3,"section":"인문사회 융합영재교육 프로그램 개발의 필요성","quote":"1 월 1 일 대폭발 / 5 월 1 일 은하수 탄생 / 9 월 9 일 태양계 탄생 / 9 월 14일 지구 탄생 / 9 월 25일 지구에 생명 출현"}},{"id":"36-02","type":"옳은 것","q":"칼 세이건의 \"에덴의 용\"에 제시된 우주 역사에 대한 설명으로 옳은 것은?","box":null,"choices":["45억년 전 지구상 최초의 생물이 등장하였다.","137억년 전 빅뱅으로 인해 우주가 탄생하였다.","35억년 전 태양과 지구가 형성되었다.","1년 달력에서 5월 1일은 태양계 탄생에 해당한다.","1년 달력에서 9월 25일은 은하수 탄생에 해당한다."],"answer":2,"explain":"교안: 137억년 전 빅뱅으로 인한 우주 탄생. ① 45억년 전은 태양과 지구의 형성, ③ 35억년 전은 지구상 최초의 생물 등장, ④ 5월 1일은 은하수 탄생(태양계 탄생은 9월 9일), ⑤ 9월 25일은 지구에 생명 출현이다.","source":{"page":3,"section":"인문사회 융합영재교육 프로그램 개발의 필요성","quote":"137억년 전 빅뱅으로 인한 우주 탄생 45억년 전 태양과 지구의 형성 35억년 전 지구상 최초의 생물 등장"}},{"id":"36-03","type":"개념 찾기","q":"칼 세이건의 우주 달력에서 12월 31일 23시 59분 35초(BC 1만년 내외)에 해당하는 것은?","box":null,"choices":["유인원과 사람의 조상 출현(호모 에렉투스)","최초의 인간 출현(호모 사피엔스)","신석기 문명 농경사회, 최초의 도시: 메소포타미아 수메르 문명","철기문물, 아시리아 제국","그리스 로마 문명"],"answer":3,"explain":"23시 59분 35초(BC 1만년 내외)는 신석기 문명 농경사회와 최초의 도시인 메소포타미아 수메르 문명이다. ① 13시 30분, ② 22시 30분, ④ 23시 59분 52초, ⑤ 23시 59분 56초에 해당한다.","source":{"page":4,"section":"인문사회 융합영재교육 프로그램 개발의 필요성 - 인문학에는 무한한 콘텐츠가 있다","quote":"23시59분35초(BC 1 만년 내외) 신석기 문명 농경사회 최초의 도시: 메소포타미아 수메르 문명"}},{"id":"36-04","type":"옳지 않은 것","q":"칼 세이건의 우주 달력(12월 31일)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["22시 30분(20~30만년 전)에 최초의 인간(호모 사피엔스)이 출현하였다.","23시 59분 52초는 철기문물, 아시리아 제국에 해당한다.","23시 59분 59초(1350년경~1600년)의 르네상스와 대항해 시대에는 교회 중심 문화가 강화되었다.","르네상스 시기에 1450년 인쇄술 발명 및 책 전파가 있었다.","23시 59분 59초~(1966년 12월)는 인간의 달 탐사에 해당한다."],"answer":3,"explain":"교안은 르네상스와 대항해 시대를 '교회 중심 문화 쇠퇴, 인본주의 문화'로 설명한다. 따라서 ③ '교회 중심 문화 강화'는 틀렸다. 나머지는 교안 표와 일치한다.","source":{"page":4,"section":"인문사회 융합영재교육 프로그램 개발의 필요성 - 인문학에는 무한한 콘텐츠가 있다","quote":"23시59분59초(1350년경~1600년) 르네상스와 대항해시대: 교회 중심 문화 쇠퇴, 인본주의 문화(셰익스피어, 세르바 테스의 돈키호테, 피렌체 성당, 1450년 인쇄술 발명 및 책 전파, 교육)"}},{"id":"36-05","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"예측할 수 없는 미래사회 문제해결에 가장 핵심적인 질문과 답은 (   )에 있음","choices":["과학기술","인공지능","수학","인문학","공학"],"answer":4,"explain":"교안은 '인문학에는 무엇이 있는가?'에서 예측할 수 없는 미래사회 문제해결의 가장 핵심적인 질문과 답이 인문학에 있다고 제시한다. 나머지는 교안 문장과 다르다.","source":{"page":5,"section":"인문사회 융합영재교육 프로그램 개발의 필요성 - 인문학에는 무엇이 있는가?","quote":"예측할 수 없는 미래사회 문제해결에 가장 핵심적인 질문과 답은 인문학에 있음"}},{"id":"36-06","type":"보기 조합","q":"\u003c보기\u003e에서 교안이 '인문학에 있는 것'으로 제시한 것을 모두 고른 것은?","box":"ㄱ. 무궁무진한 콘텐츠(유전적 진화/문화적 진화)\nㄴ. 상상력, 질문, 사고력, 경험\nㄷ. 가치와 윤리의식\nㄹ. 지혜와 통찰력, 성찰","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":5,"explain":"교안은 인문학에 무궁무진한 콘텐츠(유전적 진화/문화적 진화), 상상력·질문·사고력·경험, 가치와 윤리의식, 지혜와 통찰력·성찰이 있다고 제시한다. 네 가지 모두 해당하므로 ⑤가 정답이다.","source":{"page":5,"section":"인문사회 융합영재교육 프로그램 개발의 필요성 - 인문학에는 무엇이 있는가?","quote":"무궁무진한 콘텐츠(유전적 진화/ 문화적 진화) • 상상력, 질문, 사고력, 경험 • 가치와 윤리의식 • 지혜와 통찰력, 성찰"}},{"id":"36-07","type":"옳은 것","q":"교안에 제시된 인문학적 역량의 '목표' 세 가지로 옳은 것은?","box":null,"choices":["창의력, 문제해결력, 의사소통","통찰, 융합과 창의, 소통","시민의식, 창의력, 팀 만들기","통찰, 시민의식, 협력","고차적 사고능력, 융합, 소통"],"answer":2,"explain":"인문학적 역량의 목표는 통찰, 융합과 창의, 소통이다. ①③⑤의 창의력·문제해결력·의사소통·시민의식·팀 만들기·고차적 사고능력은 목표가 아니라 '핵심역량'이다. ④ 협력은 목표로 제시되지 않았다.","source":{"page":6,"section":"인문학적 역량과 목표","quote":"목표 통찰 융합과 창의 소통 / 핵심역량"}},{"id":"36-08","type":"개념 찾기","q":"인문학적 역량과 목표에서 목표 '소통'에 해당하는 핵심역량으로 옳은 것은?","box":null,"choices":["고차적 사고능력, 시민의식","창의력, 문제해결력","창의력, 팀 만들기","시민의식, 의사소통능력","의사소통능력, 팀 만들기"],"answer":5,"explain":"목표별 핵심역량: 통찰 → 고차적 사고능력·시민의식, 융합과 창의 → 창의력·문제해결력, 소통 → 의사소통능력·팀 만들기. 따라서 ⑤가 정답이다. ① 통찰, ② 융합과 창의의 핵심역량이며 ③④는 목표가 섞여 있다.","source":{"page":7,"section":"인문학적 역량과 목표","quote":"소통 의사소통능력 토론에 집중, 분명한 의견표현, 의견존중 / 팀 만들기 긍정적인 태도, 격려, 경청"}},{"id":"36-09","type":"옳지 않은 것","q":"인문학적 역량 중 핵심역량 '시민의식'의 하위요소로 옳지 않은 것은?","box":null,"choices":["경청","준법정신","환경의식","공동체 의식","민주적 절차의 존중"],"answer":1,"explain":"시민의식의 하위요소는 공동체 의식, 준법정신, 환경의식, 윤리의식, 봉사정신, 민주적 절차의 존중이다. ① 경청은 '팀 만들기'의 하위요소(긍정적인 태도, 격려, 경청)이다.","source":{"page":7,"section":"인문학적 역량과 목표","quote":"시민의식 공동체 의식, 준법정신, 환경의식, 윤리의식, 봉사정신, 민주적 절차의 존중"}},{"id":"36-10","type":"개념 찾기","q":"다음 하위요소를 갖는 인문학적 핵심역량은?","box":"문제의 발견, 문제의 명료화, 해결 방안의 탐색, 해결 방안의 실행과 평가, 논리적 사고력, 비판적 사고력","choices":["문제해결력","고차적 사고능력","창의력","의사소통능력","시민의식"],"answer":1,"explain":"제시된 하위요소는 목표 '융합과 창의'의 핵심역량인 문제해결력의 하위요소이다. ② 고차적 사고능력은 비판·분석·종합, ③ 창의력은 창의적 사고 기능과 사고 성향, ④ 의사소통능력은 토론에 집중·분명한 의견표현·의견존중, ⑤ 시민의식은 공동체 의식 등이다.","source":{"page":7,"section":"인문학적 역량과 목표","quote":"문제해결력 문제의 발견, 문제의 명료화, 해결 방안의 탐색, 해결 방안의 실행과 평가, 논리적 사고력, 비판적 사고력"}},{"id":"36-11","type":"옳은 것","q":"인문학적 핵심역량과 그 하위요소의 연결로 옳은 것은?","box":null,"choices":["고차적 사고능력 – 긍정적인 태도, 격려, 경청","팀 만들기 – 비판, 분석, 종합","창의력 – 창의적 사고 기능과 사고 성향","의사소통능력 – 공동체 의식, 준법정신","시민의식 – 토론에 집중, 분명한 의견표현"],"answer":3,"explain":"창의력의 하위요소는 '창의적 사고 기능과 사고 성향'이다. ① 긍정적인 태도·격려·경청은 팀 만들기, ② 비판·분석·종합은 고차적 사고능력, ④ 공동체 의식·준법정신은 시민의식, ⑤ 토론에 집중·분명한 의견표현은 의사소통능력의 하위요소이다.","source":{"page":7,"section":"인문학적 역량과 목표","quote":"통찰 고차적 사고능력 비판, 분석, 종합 / 융합과 창의 창의력 창의적 사고 기능과 사고 성향"}},{"id":"36-12","type":"옳지 않은 것","q":"세종/인천과학예술융합영재학교의 '사회 문제와 인문학적 상상력' 과목에서 제시한 인문학적 역량과 목표로 옳지 않은 것은?","box":null,"choices":["프로젝트 수업, 협동 수업 등의 팀 활동을 통해 의사소통능력과 팀 만들기 능력 고취","토론 수업을 통해 문제해결능력과 고차적 사고능력 배양","문학적인 상상력과 과학적 이론의 결합을 통한 창의력 함양","현재와 미래 사회에 필요한 시민정신 함양","문학, 사회학, 과학 간의 응용 및 연관성에 대한 통찰력 함양"],"answer":2,"explain":"교안에서 문제해결능력과 고차적 사고능력은 '문제 기반 학습'을 통해 배양하며, 토론 수업을 통해서는 '토론과 글쓰기 능력'을 함양한다. 따라서 ②가 틀렸다.","source":{"page":8,"section":"세종/인천과학예술융합영재학교 인문학적 역량과 목표 - 사회 문제와 인문학적 상상력","quote":"문제 기반 학습을 통해 문제해결능력과 고차적 사고능력 배양 • 문학적인 상상력과 과학적 이론의 결합을 통한 창의력 함양 • 토론 수업을 통해 토론과 글쓰기 능력 함양"}},{"id":"36-13","type":"빈칸","q":"'사회 문제와 인문학적 상상력' 과목의 목표 중 다음 (   )에 들어갈 말로 알맞은 것은?","box":"문학적인 상상력과 (   )의 결합을 통한 창의력 함양","choices":["역사적 사실","예술적 감성","공학적 설계","수학적 원리","과학적 이론"],"answer":5,"explain":"교안: '문학적인 상상력과 과학적 이론의 결합을 통한 창의력 함양'. 나머지는 교안에 없는 표현이다.","source":{"page":8,"section":"세종/인천과학예술융합영재학교 인문학적 역량과 목표 - 사회 문제와 인문학적 상상력","quote":"문학적인 상상력과 과학적 이론의 결합을 통한 창의력 함양"}},{"id":"36-14","type":"옳지 않은 것","q":"인천과학예술융합영재학교 '사회문제와 인문학적 상상력'의 내용 체계 예시(1. 상상하는 인간)에서 작가와 작품의 연결로 옳지 않은 것은?","box":null,"choices":["쥘 베른 – 지구에서 달까지(우주선)","에드거 앨런 포 – 지구에서 달까지(열기구)","올더스 헉슬리 – 멋진 신세계(유전자 조작에 의한 우성인자)","레이첼 카슨 – 침묵의 봄 읽기(환경)","에드거 앨런 포 – 한스 팔의 환상여행(열기구)"],"answer":2,"explain":"\"지구에서 달까지\"(우주선)는 쥘 베른의 작품이고, 에드거 앨런 포의 작품은 \"한스 팔의 환상여행\"(열기구)이다. 따라서 ②가 틀렸다.","source":{"page":9,"section":"내용 체계 예시","quote":"1 - 2 - 1 . 쥘 베른: 지구에서 달까지(우주선) / 1 - 2 - 2 . 에드거 앨런 포: 한스 팔의 환상여행(열기구)"}},{"id":"36-15","type":"옳은 것","q":"대단원 '1. 상상하는 인간'의 중단원과 수업 시간의 연결로 옳은 것은?","box":null,"choices":["1-1. 문학과 과학의 만남 – 6시간","1-2. 문학 속 과학적 상상 – 3시간","1-2. 문학 속 과학적 상상 – 9시간","1-3. 문학과 과학의 발전적 만남 – 9시간","1-3. 문학과 과학의 발전적 만남 – 6시간"],"answer":4,"explain":"교안: 1-1 문학과 과학의 만남(3시간), 1-2 문학 속 과학적 상상(6시간), 1-3 문학과 과학의 발전적 만남(9시간). 따라서 ④만 옳다.","source":{"page":9,"section":"내용 체계 예시","quote":"1 - 1 .문학과 과학의 만남(3 시간) ... 1 - 2 .문학 속 과학적 상상(6 시간) ... 1 - 3 .문학과 과학의 발전적 만남(9 시간)"}},{"id":"36-16","type":"옳지 않은 것","q":"대단원 '1. 상상하는 인간'의 학년·교과명·단원명에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["1-3(문학과 과학의 발전적 만남)은 1학년을 대상으로 한다.","1-1의 단원명에는 토의와 토론, 작문내용의 생성과 조직이 있다.","1-2(문학 속 과학적 상상)의 교과명에는 문학, 세계사, 물리, 화법과 작문이 있다.","1-1(문학과 과학의 만남)의 교과명은 문학, 과학, 화법과 작문이다.","1-3의 단원명에는 소설문학 감상, 염색체와 유전물질, 인간의 의미, 생명존중사상과 책임이 있다."],"answer":1,"explain":"교안 표에서 1-1과 1-2는 1학년, 1-3(문학과 과학의 발전적 만남)은 2학년이다. 따라서 ①이 틀렸다. 1-3의 교과명은 문학, 생명과학, 윤리와 사상, 화법과 작문, 사회문화이다.","source":{"page":10,"section":"내용 체계 예시","quote":"2 / • 소설문학 감상, 염색체와 유전물질, 인간의 의미 / 1 - 3 .문학과 과학의 발전적 만남 / • 생명존중사상과 책임 / (9 시간) / 문학, 생명과학, 윤리와 사상, 화법과 작문, 사회문화"}},{"id":"36-17","type":"개념 찾기","q":"대단원 '1. 상상하는 인간'에서 중단원 '1-3. 문학과 과학의 발전적 만남'의 최종 창의적 산출물은?","box":null,"choices":["토론, 발표, 은유적 글쓰기","미래의 상상적 이동수단을 글쓰기, 모형/그림 등으로 표현","멋진 신세계 시나리오와 공연하기","리스크 테이블 만들기","스마트폰 사용에 대한 찬반 토론"],"answer":3,"explain":"1-3의 최종 창의적 산출물은 '멋진 신세계 시나리오와 공연하기'이다. ① 1-1, ② 1-2의 산출물이다. ④는 2단원의 소단원(리스크 테이블을 만들자), ⑤는 3단원의 소단원이다.","source":{"page":11,"section":"내용 체계 예시","quote":"1 - 3 .문학과 과학의 발전적 만남 / VV 멋진 신세계 시나리오와 공연하기"}},{"id":"36-18","type":"옳은 것","q":"대단원 '1. 상상하는 인간'의 내용 체계(과학·공학·예술·수학 연계 및 최종 창의적 산출물)에 대한 설명으로 옳은 것은?","box":null,"choices":["1-1 문학과 과학의 만남의 최종 창의적 산출물은 '멋진 신세계 시나리오와 공연하기'이다.","1-2 문학 속 과학적 상상은 과학, 예술, 수학과 연계되어 있다.","세 중단원 모두 공학과 연계되어 있다.","1-3 문학과 과학의 발전적 만남은 수학과 연계되어 있다.","1-2의 최종 창의적 산출물은 '토론, 발표, 은유적 글쓰기'이다."],"answer":2,"explain":"교안 표에서 1-2는 과학·예술·수학에 V 표시가 있고, 1-1과 1-3은 과학·예술에만 V 표시가 있다. 공학에 V 표시된 중단원은 없다. ① 1-1 산출물은 토론, 발표, 은유적 글쓰기, ⑤ 1-2 산출물은 미래의 상상적 이동수단을 글쓰기, 모형/그림 등으로 표현이다.","source":{"page":11,"section":"내용 체계 예시","quote":"VVV 미래의 상상적 이동수단을 글쓰기, 모형/그림 등으로 표현"}},{"id":"36-19","type":"옳지 않은 것","q":"'문학과 과학의 만남'의 인물 베르나르 베르베르(Bernard Werber)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["\"뇌\"(1991)를 출간하였다.","\"개미\"(1991)를 출간하였다.","\"타나토노트\"(1994)를 출간하였다.","문학가이면서 과학적인 지식과 소양이 뛰어난 사람의 예이다.","해박한 과학지식(특히 곤충)을 바탕으로 독특한 소재와 기발한 상상력이 돋보이는 작품을 출간하였다."],"answer":1,"explain":"교안에서 \"뇌\"는 2001년 작품이다(1991년은 \"개미\"). 그 외 \"제 3 인류\"(2012)도 제시되어 있다.","source":{"page":12,"section":"내용 체계 예시: 문학과 과학의 만남 - 베르나르 베르베르","quote":"“개미”(1991), “타나토노트”(1994), “뇌”(2001), “제 3 인류”(2012)"}},{"id":"36-20","type":"개념 찾기","q":"다음 설명에 해당하는 인물은?","box":"· 과학자이면서 문학적인 소양과 자질이 뛰어난 사람\n· 존스홉킨스 대학에서 동물학을 공부한 미국의 해양생물학자\n· 과학에 기초한 기술이 초래한 환경오염의 가공할 결과를 대중에게 인식시킴","choices":["베르나르 베르베르","쥘 베른","올더스 헉슬리","에드거 앨런 포","레이첼 카슨"],"answer":5,"explain":"제시문은 \"침묵의 봄(Silent Spring)\"(1962)의 저자 레이첼 카슨에 대한 설명이다. ① 베르나르 베르베르는 반대로 '문학가이면서 과학적인 지식과 소양이 뛰어난 사람'의 예이다. ②③④는 문학 작품의 작가로 제시된 인물이다.","source":{"page":13,"section":"내용 체계 예시: 문학과 과학의 만남 - 레이첼 카슨","quote":"과학자이면서 문학적인 소양과 자질이 뛰어난 사람 ‣ 존스홉킨스 대학에서 동물학을 공부한 미국의 해양생물학자"}},{"id":"36-21","type":"옳은 것","q":"레이첼 카슨의 \"침묵의 봄(Silent Spring)\"에 대한 설명으로 옳은 것은?","box":null,"choices":["1972년에 출간되었다.","\"타임\"지에 작품을 연재하였다.","유전자 조작에 의한 우성인자 문제를 고발하였다.","1년간의 문헌 조사를 바탕으로 하였다.","4년간의 직접 조사를 바탕으로 하였다."],"answer":5,"explain":"교안: 4년간의 직접 조사를 바탕으로 \"뉴요커\"지에 연재, 디디티(DDT)와 같은 살충제와 농약의 파괴적 결과를 고발. ① 1962년, ② \"뉴요커\"지, ③ 유전자 조작은 올더스 헉슬리 \"멋진 신세계\"의 주제, ④ 1년간의 문헌 조사가 아니라 4년간의 직접 조사이다.","source":{"page":13,"section":"내용 체계 예시: 문학과 과학의 만남 - 레이첼 카슨","quote":"4 년간의 직접 조사를 바탕으로 “뉴요커” 지에 작품을 연재하였으며 디디티(DDT)와 같은 살충제와 농약이 새, 물고기, 야생동물, 인간에게 미치는 파괴적 결과를 고발"}},{"id":"36-22","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"쥘 베른 1865년 \"지구에서 달까지\"를 영화화한 1902 프랑스 영화 \"(   )\"","choices":["달나라 여행","한스 팔의 환상여행","멋진 신세계","침묵의 봄","제 3 인류"],"answer":1,"explain":"\"지구에서 달까지\"(1865년)를 영화화한 1902년 프랑스 영화는 \"달나라 여행\"이다. ② 에드거 앨런 포, ③ 올더스 헉슬리, ④ 레이첼 카슨, ⑤ 베르나르 베르베르의 작품이다.","source":{"page":14,"section":"내용 체계 예시: 문학 속 과학적 상상 - 쥘 베른","quote":"쥘 베른 1865년 “지구에서 달까지” 를 영화화한 1902 프랑스 영화 “달나라 여행”"}},{"id":"36-23","type":"빈칸","q":"\"지구에서 달까지\"의 과학적 요소에 대해 학생들과 토론하는 활동 중 다음 (   )에 들어갈 말로 알맞은 것은?","box":"(   )의 발사속도가 현실적인 숫자인지 확인하기 위해서 지구의 표면에서 달까지 가기 위해서 필요한 초속도를 가늠해 보기","choices":["8 km/s","11 km/s","12 km/s","15 km/s","21 km/s"],"answer":3,"explain":"교안에 제시된 발사속도는 12 km/s이다. 나머지 수치는 교안에 없다.","source":{"page":15,"section":"내용 체계 예시: 문학 속 과학적 상상 - 쥘 베른","quote":"12 km/s 의 발사속도가 현실적인 숫자인지 확인하기 위해서 지구의 표면에서 달까지 가기 위해서 필요한 초속도를 가늠해 보기"}},{"id":"36-24","type":"보기 조합","q":"\"지구에서 달까지\"를 통해 학생들과 토론하고 오류를 증명해 보는 과학 요소로 교안에 제시된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 착륙할 때 역추진의 문제에 대해 설명해 보기\nㄴ. 발사 후의 대지의 진동에 대해 설명해 보기\nㄷ. 대포의 포신이 길어지면 대포알에 어떤 효과가 있을지 정성적으로 설명해 보기\nㄹ. 열기구의 부력으로 달까지 갈 수 있는지 계산해 보기","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"ㄱ·ㄴ(14쪽)과 ㄷ(15쪽)은 \"지구에서 달까지\"의 토론 요소이다. 그 밖에 달에 공기와 물이 있는가, 대포알 안에서 숨을 쉴 수 있는가, 충격량을 견딜 수 있는가도 제시된다. ㄹ 열기구는 에드거 앨런 포 \"한스 팔의 환상여행\"의 소재로, \"지구에서 달까지\"의 토론 요소가 아니다.","source":{"page":14,"section":"내용 체계 예시: 문학 속 과학적 상상 - 쥘 베른","quote":"착륙할 때 역추진의 문제에 대해 설명해 보기 • 발사 후의 대지의 진동에 대해 설명해 보기 • 달에 공기와 물이 있는가?"}},{"id":"36-25","type":"옳은 것","q":"에드거 앨런 포의 \"한스 팔의 환상여행\"에 대한 설명으로 옳은 것은?","box":null,"choices":["과학자 한스 팔이 우주선을 타고 화성까지 여행하는 이야기이다.","평범한 한 시민의 달나라까지의 여행을 다루고 있다.","도시에 나타난 기이한 물체는 대포알이었다.","한스 팔의 일기장에는 열기구를 만든 과정이 담겨 있었다.","한스 팔이 마을 사람들 앞에서 직접 여행 과정을 발표한다."],"answer":2,"explain":"교안: 평범한 한 시민의 달나라까지의 여행을 다룬 작품. ① 우주선·화성이 아니라 열기구·달나라, ③ 기이한 물체는 열기구, ④ 일기장이 아니라 열기구 안의 편지, ⑤ 사라진 한스 팔로부터 온 편지로 과정이 전달된다.","source":{"page":16,"section":"내용 체계 예시: 문학 속 과학적 상상 - 에드거 앨런 포의 \"한스 팔의 환상여행\"","quote":"평범한 한 시민의 달나라까지의 여행을 다루고 있는 작품 ‣ 도시에 기이한 물체가 나타나는데 그것은 바로 열기구였음"}},{"id":"36-26","type":"빈칸","q":"\"한스 팔의 환상여행\"에 대한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"황당하고 믿기 어려운 이야기이지만 풍부한 과학적 지식과 근거를 가지고 그 과정을 세밀하고 자세하게, (   ) 제시하고 있으므로 달나라에서 잘 살고 있다는 한스 팔의 편지는 설득력을 가지게 됨","choices":["감성적으로","상징적으로","은유적으로","논리적으로","극적으로"],"answer":4,"explain":"교안: '세밀하고 자세하게, 논리적으로 제시하고 있으므로' 편지가 설득력을 가진다. 나머지는 교안 표현이 아니다.","source":{"page":17,"section":"내용 체계 예시: 문학 속 과학적 상상 - 에드거 앨런 포의 \"한스 팔의 환상여행\"","quote":"풍부한 과학적 지식과 근거를 가지고 그 과정을 세밀하고 자세하게, 논리적으로 제시하고 있으므로 달나라에서 잘 살고 있다는 한스 팔의 편지는 설득력을 가지게 됨"}},{"id":"36-27","type":"옳지 않은 것","q":"제1단원 '상상하는 인간'의 중단원 '1-1. 문학과 과학의 만남'의 목표로 옳지 않은 것은?","box":null,"choices":["문학과 과학의 정의와 목적을 이해할 수 있음","문학과 과학의 융합적인 인물을 이해","창의적 사고기법을 활용","문학과 과학의 공통점과 차이점을 이해할 수 있음","19세기 쥘 베른의 삶과 작품 배경을 이해"],"answer":5,"explain":"'19세기 쥘 베른의 삶과 작품 배경을 이해'는 1-2. 문학 속 과학적 상상의 목표이다. 1-1의 목표에는 이 밖에 문학과 과학의 융합의 특성 이해, 상관관계와 융합의 시너지 설명이 있다.","source":{"page":18,"section":"내용 체계 예시 - 제1단원: 상상하는 인간 목표","quote":"문학과 과학의 정의와 목적을 이해할 수 있음 • 문학과 과학의 융합적인 인물을 이해 • 문학과 과학의 융합의 특성을 이해 • 문학과 과학의 공통점과 차이점을 이해할 수 있음"}},{"id":"36-28","type":"옳은 것","q":"제1단원 '상상하는 인간'의 중단원 '1-2. 문학 속 과학적 상상'의 목표에 해당하는 것은?","box":null,"choices":["문학과 과학의 상관관계와 융합의 시너지에 대해 설명할 수 있음","문학과 과학의 융합의 특성을 이해","20세기 에드거 앨런 포의 삶과 작품 배경을 이해","상상할 수 있는 창의적인 미래의 이동수단을 제시","멋진 신세계 시나리오를 작성하고 공연할 수 있음"],"answer":4,"explain":"1-2의 목표: 19세기 쥘 베른·에드거 앨런 포의 삶과 작품 배경 이해, 작품 내용과 의미 이해, 과학적 이론 검증, 현재의 과학적 이론 이해, 창의적인 미래의 이동수단 제시. ①② 1-1의 목표, ③ 20세기가 아니라 19세기, ⑤ 1-3의 산출물이다.","source":{"page":19,"section":"내용 체계 예시 - 제1단원: 상상하는 인간 목표","quote":"현재의 과학적 이론을 이해 • 상상할 수 있는 창의적인 미래의 이동수단을 제시"}},{"id":"36-29","type":"옳지 않은 것","q":"대단원 '2. 소통하는 인간'의 소단원으로 옳지 않은 것은?","box":null,"choices":["과학이란 무엇인가?","뉴스로 보는 환경문제","리스크 테이블을 만들자","로봇, 인간 인정 소송을 제기하다.","스마트폰 사용에 대한 찬반토론"],"answer":5,"explain":"'스마트폰 사용에 대한 찬반토론'은 대단원 '3. 미래를 내다보는 인간'의 3-3(스마트폰과 스마트 라이프) 소단원이다. 2단원은 2-1 자연과 인간에 대한 과학, 2-2 우리의 현재는 과거의 미래, 2-3 인간, 육체와 정신으로 구성된다.","source":{"page":20,"section":"내용 체계 예시","quote":"2 - 2 - 1 . 뉴스로 보는 환경문제 / 2 - 2 - 2 . 리스크 테이블을 만들자 / 2 - 2 .우리의 현재는 과거의 미래(6 시간)"}},{"id":"36-30","type":"옳은 것","q":"인천과학예술융합영재학교 '사회문제와 인문학적 상상력'의 대단원 순서로 옳은 것은?","box":null,"choices":["1. 소통하는 인간 → 2. 상상하는 인간 → 3. 미래를 내다보는 인간","1. 상상하는 인간 → 2. 미래를 내다보는 인간 → 3. 소통하는 인간","1. 상상하는 인간 → 2. 소통하는 인간 → 3. 미래를 내다보는 인간","1. 미래를 내다보는 인간 → 2. 상상하는 인간 → 3. 소통하는 인간","1. 소통하는 인간 → 2. 미래를 내다보는 인간 → 3. 상상하는 인간"],"answer":3,"explain":"대단원은 1. 상상하는 인간, 2. 소통하는 인간, 3. 미래를 내다보는 인간 순이다.","source":{"page":21,"section":"내용 체계 예시","quote":"3.미래를 내다보는 인간"}},{"id":"36-31","type":"개념 찾기","q":"대단원 '3. 미래를 내다보는 인간'에서 다음 소단원들이 속한 중단원은?","box":"· 로봇이 인간에게 미치는 사회적 영향\n· 인간과 로봇의 융합\n· 로봇 과학기술의 미래","choices":["과학기술과 인문학적 상상력","로봇문화와 융합적 사고","스마트폰과 스마트 라이프","인간, 육체와 정신","자연과 인간에 대한 과학"],"answer":2,"explain":"제시된 소단원은 3-2. 로봇문화와 융합적 사고(6시간)에 속한다. ① 3-1(고전 공상과학소설 속의 과학기술, 미래 과학기술의 바람직한 모습), ③ 3-3(스마트 라이프 혁명의 실제와 스마트폰 중독 등), ④⑤는 2단원의 중단원이다.","source":{"page":21,"section":"내용 체계 예시","quote":"3 - 2 - 1 . 로봇이 인간에게 미치는 사회적 영향 / 3 - 2 - 2 . 인간과 로봇의 융합 / 3 - 2 .로봇문화와 융합적 사고(6 시간) / 3 - 2 - 3 . 로봇 과학기술의 미래"}},{"id":"36-32","type":"옳지 않은 것","q":"토의·토론 교수학습 방법 중 '소집단 토의'에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["리더가 사회를 본다.","모두 한마디씩 하도록 한다.","리더는 발표된 내용의 요점을 정리한다.","교사가 사회를 보고 리더는 발언 순서만 기록한다.","토의 진행에서 리더는 학습자 전원의 참여를 유도한다."],"answer":4,"explain":"교안의 소집단 토의는 리더가 사회를 보고, 모두 한마디씩 하도록 하며, 리더가 발표된 내용의 요점을 정리한다. ④는 교안과 반대이다. ⑤ 학습자 전원의 참여 유도는 리더의 역할로 제시되어 있다.","source":{"page":23,"section":"토의·토론 방법 - 소집단 토의","quote":"리더가 사회를 봄 • 모두 한마디씩 하도록 함 • 리더는 발표된 내용의 요점을 정리함"}},{"id":"36-33","type":"옳지 않은 것","q":"토의·토론에서 '리더의 역할'로 옳지 않은 것은?","box":null,"choices":["자신의 견해를 적극 주장하여 결론 유도","토의 목표와 절차 안내","토의 시간 분배","토의를 위한 여건 조성","주제에 대한 흥미 유도"],"answer":1,"explain":"교안은 리더가 '타인 의견 존중, 자신의 견해 억제'를 해야 한다고 제시한다. 따라서 ①은 틀렸다. 그 밖에 토의 시작과 흐름 유지, 학습자 전원의 참여 유도, 토의 요약, 적극적이고 개방적인 질문 등도 리더의 역할이다.","source":{"page":24,"section":"토의·토론 방법 - 리더의 역할","quote":"주제에 대한 흥미 유도 • 타인 의견 존중, 자신의 견해 억제 • 성급하게 판단하지 않고 수용과 격려의 자세를 가져야 함"}},{"id":"36-34","type":"빈칸","q":"토의·토론에서 리더의 역할에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"성급하게 판단하지 않고 (   )의 자세를 가져야 함","choices":["수용과 격려","비판과 검증","중립과 침묵","통제와 관리","평가와 판단"],"answer":1,"explain":"교안: '성급하게 판단하지 않고 수용과 격려의 자세를 가져야 함'. 또한 발표 내용에서 거짓 또는 잘못된 내용은 객관적이고 합리적으로 중재한다.","source":{"page":24,"section":"토의·토론 방법 - 리더의 역할","quote":"성급하게 판단하지 않고 수용과 격려의 자세를 가져야 함"}},{"id":"36-35","type":"빈칸","q":"교수학습상의 유의점에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"이 과목은 ( ㄱ )이 아닌 ( ㄴ )을 하도록 권장","choices":["ㄱ: 심화학습, ㄴ: 속진","ㄱ: 속진, ㄴ: 심화학습","ㄱ: 개별학습, ㄴ: 협동학습","ㄱ: 강의식 수업, ㄴ: 토론식 수업","ㄱ: 지필평가, ㄴ: 수행평가"],"answer":2,"explain":"교안: '이 과목은 속진이 아닌 심화학습을 하도록 권장'. ①은 반대로 바뀌었고 ③④⑤는 교안에 없는 내용이다.","source":{"page":25,"section":"교수학습상의 유의점","quote":"이 과목은 속진이 아닌 심화학습을 하도록 권장"}},{"id":"36-36","type":"옳지 않은 것","q":"인문사회 융합영재교육 과목의 교수학습상의 유의점으로 옳지 않은 것은?","box":null,"choices":["교사는 학생들이 과학뿐 아니라 인문학적 소양을 갖도록 격려한다.","교사는 학생들이 창의적 사고를 하도록 유도한다.","교사는 학생들이 고차원적 사고를 하도록 유도한다.","교사는 학생들이 팀 만들기와 서로 소통하는 활동을 하도록 유도한다.","교사는 교사 주도적으로 수업 활동을 진행한다."],"answer":5,"explain":"교안은 교사가 학생들이 '학생 주도적으로' 수업 활동을 하도록 유도해야 한다고 제시한다. 따라서 ⑤는 틀렸다.","source":{"page":26,"section":"교수학습상의 유의점","quote":"이 과목을 진행하는 과정에서 교사는 학생들이 학생 주도적으로 수업 활동을 하도록 유도"}},{"id":"36-37","type":"개념 찾기","q":"인문사회 융합영재교육 과목의 평가 중 다음 설명에 해당하는 것은?","box":"발표 횟수, 질문 횟수, 상호평가 등을 통해 평가함","choices":["산물평가","역량평가","지필평가","태도평가","과정 프로그램 평가"],"answer":4,"explain":"발표 횟수, 질문 횟수, 상호평가 등으로 평가하는 것은 태도평가이다. ① 산물평가는 자료의 충실성·산출물의 참신성·실용성·예술성 등 준거로, ② 역량평가는 리커트 척도나 상중하로, ③ 지필평가는 객관식·단답형·서술형으로 평가한다.","source":{"page":27,"section":"평가","quote":"태도평가: 발표 횟수, 질문 횟수, 상호평가 등을 통해 평가함"}},{"id":"36-38","type":"옳은 것","q":"인문사회 융합영재교육 과목의 평가에 대한 설명으로 옳은 것은?","box":null,"choices":["평가방식은 지필평가로만 이루어진다.","산물평가는 개인 산물만 포함하고 팀 산물은 제외한다.","역량평가는 해당 역량과 관련된 항목을 개발하고 이에 대해 리커트 척도나 상중하로 평가한다.","지필평가는 객관식과 단답형만 포함하고 서술형은 제외한다.","태도평가는 산출물의 참신성, 실용성, 예술성 등을 준거로 평가한다."],"answer":3,"explain":"③은 교안의 역량평가 설명 그대로이다. ① 다양한 형태의 수행평가(산물평가, 태도평가, 역량평가 등)와 지필평가로 이루어짐, ② 개인 산물과 팀 산물 포함, ④ 객관식·단답형·서술형 모두 포함, ⑤ 참신성·실용성·예술성은 산물평가의 준거이다.","source":{"page":27,"section":"평가","quote":"역량평가: 해당 역량과 관련된 항목을 개발하고 이에 대해 리커트 척도나 상중하로 평가함 ‣ 지필평가: 객관식, 단답형, 서술형을 모두 포함함"}},{"id":"36-39","type":"개념 찾기","q":"다음 평가 항목을 포함하는 프로그램 평가 영역은?","box":"· 충분히 추상적인가?\n· 복잡한 내용을 다루고 있는가?\n· 관련 분야의 인물 연구를 포함하고 있는가?\n· 관련 분야의 방법 연구를 포함하고 있는가?","choices":["내용 프로그램 평가","과정 프로그램 평가","산출 프로그램 평가","태도평가","역량평가"],"answer":1,"explain":"제시된 항목(추상성, 복잡성, 다양성, 인물 연구, 방법 연구)은 내용 프로그램 평가 항목이다. ② 과정 프로그램 평가는 학생 선택, 열린 문제 등, ③ 산출 프로그램 평가는 실제 문제, 실제 대중 발표 등을 묻는다.","source":{"page":28,"section":"내용 프로그램 평가","quote":"충분히 추상적인가? ‣ 복잡한 내용을 다루고 있는가? ‣ 다양한 내용을 다루고 있는가? ‣ 관련 분야의 인물 연구를 포함하고 있는가? ‣ 관련 분야의 방법 연구를 포함하고 있는가?"}},{"id":"36-40","type":"옳지 않은 것","q":"'과정 프로그램 평가'의 항목으로 옳지 않은 것은?","box":null,"choices":["학생이 선택할 수 있는가?","열린 문제(open-ended problem)인가?","실제 대중에게 발표되었는가?","결과와 함께 과정이 중시되는가?","소그룹 활동이 효과적으로 이루어지는가?"],"answer":3,"explain":"'실제 대중에게 발표되었는가?'는 산출 프로그램 평가 항목이다. 과정 프로그램 평가에는 이 밖에 상위 사고력 및 창의성 개발, 개인 프로젝트, 문제 중심 학습, 자기주도적 학습자, 실생활 연계, 개인차 고려, 관찰과 발견 등이 있다.","source":{"page":29,"section":"과정 프로그램 평가","quote":"결과와 함께 과정이 중시되는가? ‣ 문제 중심 학습이 되는가? ... ‣ 열린 문제(open-ended problem)인가? ‣ 관찰과 발견을 중시하는가? ‣ 소그룹 활동이 효과적으로 이루어지는가?"}},{"id":"36-41","type":"보기 조합","q":"\u003c보기\u003e에서 '산출 프로그램 평가'의 항목을 모두 고른 것은?","box":"ㄱ. 실제 문제를 다루었는가?\nㄴ. 실제 대중에게 발표되었는가?\nㄷ. 충분히 추상적인가?\nㄹ. 적절한 평가가 이루어졌는가?","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"산출 프로그램 평가 항목: 실제 문제를 다루었는가?, 실생활로의 적용이 용이한가?, 실제 대중에게 발표되었는가?, 적절한 평가가 이루어졌는가?. ㄷ '충분히 추상적인가?'는 내용 프로그램 평가 항목이다.","source":{"page":30,"section":"산출 프로그램 평가","quote":"실제 문제를 다루었는가? ‣ 실생활로의 적용이 용이한가? ‣ 실제 대중에게 발표되었는가? ‣ 적절한 평가가 이루어졌는가?"}}]},{"lesson":37,"title":"수·과학 융합영재교육 프로그램","file":"4. 교안 (31~60)[1] (1)/37.pdf","summary":["수학영재 6대 핵심역량: 창의적 문제해결능력, 고등 수학적 추론능력, 융합 및 응용 능력, 수학적 의사소통 및 협업 능력, 정보처리 및 도구 활용능력, 수학적 태도와 실천 의지력","창의적 문제해결능력 하위요소: 직관적 통찰, 창의적 전략, 반성(과정·결과 점검·비평·검토), 재구성 및 재창조","고등 수학적 추론능력 하위요소: 분석 및 종합, 추리(귀납·유추·가추 등 개연적 추론 + 형식적 증명의 연역적 사고), 논리적 절차 수행, 정당화","융합 및 응용 능력: 융복합, 모델링(실생활 문제상황을 수학적으로 나타내고 분석·해석·적용), 응용 / 의사소통 및 협업: 이해, 표현 및 변환, 협업 / 정보처리 및 도구 활용: 정보처리, 도구의 활용","수학적 태도와 실천 의지력: 가치 인식과 수학에 대한 태도(Attitude to Mathematics), 수학적 태도(Mathematical Attitude), 시민의식과 실천 의지","역량중심 프로그램 4가지 기본방향(한국교육개발원, 2020): 실제 세계 탐구에서 출발 / 전문가 수행경험·사고활동과정·실제 기능 체험 / 대주제(테마, Big Idea)에 따른 핵심질문 도출 / 자신의 삶과 관련지어 지식의 의미 통찰","'대수+기하+조합 문제해결을 통한 삶의 질 향상'(한국교육개발원, 울산광역시교육청, 2020): 암호/보안·공정/경제생활·공학/감정전달 3개 프로그램, 모두 초등, 영재학급/영재교육원, 내용 40:30:30, 합계 30 시수(135시간)","1주제 '내가 누구인지 무엇이 말해줄 수 있는가?': 보안의 역사(1-2, 2시수 80분) → 디지털 보안의 시작(3-5, 3시수 120분) → 생체인증 속 수학(6-8, 3시수 120분, 델로네 삼각형) → 완벽한 보안을 찾아서(9-10, 2시수 80분)","1주제 핵심역량: 창의적 문제해결력·융합 및 응용능력·수학적 태도 및 실천 의지력 ●, 수학적 의사소통능력 ◐","1-2차시 정규과정 연계: [6수01-01] 혼합계산, [6수05-06] 가능성 / 수업흐름: 도입 5분, 주민등록번호 25분, 열쇠 35분, 마무리 15분","2주제 '공정한 통계자료 활용 생활': 음원산업 공정한 수익분배율 → 최저임금 → 초콜릿 이익배분과 가격 → 경제지수 활용·공정지수 만들기","3주제 '온택트 시대의 공학적 감정표현': 언어에서 수학 찾기(아이콘·이모티콘, 수어와 점자) → 의사결정트리 → 픽셀(네모네모로직) → 매스티콘"],"questions":[{"id":"37-01","type":"옳지 않은 것","q":"수학영재의 6대 핵심역량에 해당하지 않는 것은?","box":null,"choices":["창의적 문제해결능력","수학적 계산 및 암기 능력","융합 및 응용 능력","정보처리 및 도구 활용능력","수학적 태도와 실천 의지력"],"answer":2,"explain":"6대 핵심역량은 창의적 문제해결능력, 고등 수학적 추론능력, 융합 및 응용 능력, 수학적 의사소통 및 협업 능력, 정보처리 및 도구 활용능력, 수학적 태도와 실천 의지력이다. ② '수학적 계산 및 암기 능력'은 교안에 없는 역량이다.","source":{"page":3,"section":"6대 핵심역량","quote":"창의적문제해결능력 고등수학적추론능력 융합및응용 능력 수학적의사소통및협업능력 정보처리및도구 활용능력 수학적태도와실천의지력"}},{"id":"37-02","type":"개념 찾기","q":"창의적 문제해결능력의 하위요소 중 다음 설명에 해당하는 것은?","box":"기존에 알려져 있던 개념이나 문제, 정리 등을 새로운 방식으로 추측, 개선, 변형하여 재구성하거나 새롭게 제기하고 만들어낼 수 있는 능력","choices":["직관적 통찰","창의적 전략","반성","재구성 및 재창조","정당화"],"answer":4,"explain":"제시문은 '재구성 및 재창조'의 의미이다. ① 직관적 통찰 = 과제에 대한 비범한 감수성·이해력·직관·통찰력, ② 창의적 전략 = 틀에 박히지 않은 풀이·비정형적 전략, ③ 반성 = 과정·결과를 점검·비평·검토, ⑤ 정당화는 고등 수학적 추론능력의 하위요소이다.","source":{"page":4,"section":"창의적 문제해결능력","quote":"재구성및재창조 기존에알려져있던개념이나문제, 정리 등을새로운방식으로추측, 개선 , 변형하여 재구성하거나새롭게제기하고만들어낼수있는 능력"}},{"id":"37-03","type":"빈칸","q":"창의적 문제해결능력의 하위요소에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   ): 문제해결의 과정이나 결과를 점검, 비평, 검토하는 능력","choices":["반성","직관적 통찰","분석 및 종합","추리","표현 및 변환"],"answer":1,"explain":"문제해결의 과정이나 결과를 점검·비평·검토하는 능력은 '반성'이다. ② 직관적 통찰은 비범한 감수성·이해력·직관·통찰력, ③ 분석 및 종합과 ④ 추리는 고등 수학적 추론능력, ⑤ 표현 및 변환은 수학적 의사소통 및 협업 능력의 하위요소이다.","source":{"page":4,"section":"창의적 문제해결능력","quote":"반성문제해결의과정이나결과를점검, 비평 , 검토하는 능력"}},{"id":"37-04","type":"옳지 않은 것","q":"고등 수학적 추론능력의 하위요소가 아닌 것은?","box":null,"choices":["분석 및 종합","추리","논리적 절차 수행","정당화","모델링"],"answer":5,"explain":"고등 수학적 추론능력의 하위요소는 분석 및 종합, 추리, 논리적 절차 수행, 정당화이다. ⑤ 모델링은 융합 및 응용 능력의 하위요소이다.","source":{"page":5,"section":"고등 수학적 추론능력","quote":"분석및종합 ... 추리 ... 논리적절차수행 ... 정당화수학적사실이참임을보이기위해증거를제시하고이유를논리적으로설명하는능력"}},{"id":"37-05","type":"빈칸","q":"고등 수학적 추론능력의 하위요소 '추리'에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"관찰과 탐구 상황에서 귀납, 유추, (   ) 등의 개연적 추론과 형식적 증명의 연역적 사고를 통해 참임을 밝힐 수 있는 능력","choices":["연역","가추","증명","직관","정당화"],"answer":2,"explain":"교안은 개연적 추론으로 '귀납, 유추, 가추'를 든다. ① 연역은 형식적 증명의 사고로 따로 제시되며 개연적 추론이 아니다. ③④⑤는 해당 문장에 개연적 추론으로 제시되지 않았다.","source":{"page":5,"section":"고등 수학적 추론능력","quote":"추리관찰과탐구상황에서귀납, 유추 , 가추 등의개연적추론과형식적증명의연역적사고를통해참임을밝힐수있는 능력"}},{"id":"37-06","type":"개념 찾기","q":"융합 및 응용 능력의 하위요소 중 다음 설명에 해당하는 것은?","box":"실생활 문제 상황을 수학적으로 나타내고 분석하여 결론을 도출하고 이를 상황에 맞게 해석하고 적용하는 능력","choices":["융복합","응용","모델링","정보처리","표현 및 변환"],"answer":3,"explain":"제시문은 '모델링'이다. ① 융복합 = 개념 간·영역 간·교과 간·일상생활과의 내용 또는 방법을 결합·통합·융합·복합하는 능력, ② 응용 = 습득한 지식과 사고방법을 타 교과나 일상생활에 활용·응용하는 능력, ④ 정보처리는 정보처리 및 도구 활용능력, ⑤ 표현 및 변환은 의사소통 및 협업 능력의 하위요소이다.","source":{"page":6,"section":"융합 및 응용 능력","quote":"모델링실생활문제상황을수학적으로나타내고분석하여결론을도출하고이를상황에맞게해석하고적용하는능력"}},{"id":"37-07","type":"옳은 것","q":"수학적 의사소통 및 협업 능력의 하위요소로만 바르게 묶인 것은?","box":null,"choices":["이해, 반성, 협업","정보처리, 도구의 활용, 협업","표현 및 변환, 응용, 융복합","이해, 표현 및 변환, 협업","분석 및 종합, 추리, 정당화"],"answer":4,"explain":"수학적 의사소통 및 협업 능력의 하위요소는 이해, 표현 및 변환, 협업이다. ① 반성은 창의적 문제해결능력, ② 정보처리·도구의 활용은 정보처리 및 도구 활용능력, ③ 응용·융복합은 융합 및 응용 능력, ⑤는 고등 수학적 추론능력의 하위요소이다.","source":{"page":7,"section":"수학적 의사소통 및 협업 능력","quote":"이해수학적표현의의미, 문제의 조건이나과제의목적, 타인의생각을명확히이해하고재현, 평가하는 능력 / 표현및변환 ... / 협업책임분담과상호작용을통해집단적으로협력하여수행하는능력"}},{"id":"37-08","type":"개념 찾기","q":"다음 설명에 해당하는 수학영재 핵심역량의 하위요소는?","box":"조건의 부족 또는 과잉의 정보를 판단하고 필요한 정보를 수집, 분석, 활용하면서 습득한 정보를 기록, 처리, 활용하고 핵심적인 정보를 오랫동안 기억하는 능력","choices":["도구의 활용","분석 및 종합","정보처리","이해","응용"],"answer":3,"explain":"제시문은 정보처리 및 도구 활용능력의 하위요소 '정보처리'이다. ① 도구의 활용 = 적절한 공학적 도구나 교구를 선택·활용하여 자료와 정보를 효과적으로 처리하는 능력, ② 분석 및 종합은 고등 수학적 추론능력, ④ 이해는 의사소통 및 협업 능력, ⑤ 응용은 융합 및 응용 능력의 하위요소이다.","source":{"page":8,"section":"정보처리 및 도구 활용능력","quote":"정보처리조건의부족또는과잉의정보를판단하고필요한정보를수집, 분석 , 활용하면서 습득한정보를기록, 처리 , 활용하고핵심적인정보를오랫동안기억하는능력"}},{"id":"37-09","type":"옳지 않은 것","q":"수학적 태도와 실천 의지력의 하위요소에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["'가치 인식과 수학에 대한 태도'는 개인적인 흥미, 호기심, 자신감, 도전감 등을 바탕으로 수학의 가치와 유용성을 인식하는 태도이다.","'수학적 태도'는 수식이나 기호로 간결/명확히 표현하면서 보다 나은 풀이를 찾아 일반화, 확장, 통합하려는 태도를 포함한다.","'가치 인식과 수학에 대한 태도'는 영문으로 Mathematical Attitude라고 표기된다.","'시민의식과 실천 의지'에는 정직, 공정, 책임감 있는 도전, 배려와 존중, 합리적 의사결정 등 민주 시민으로서의 의식이 포함된다.","'시민의식과 실천 의지'에는 진로나 직업/생활과 관련지어 보려는 마음가짐이 포함된다."],"answer":3,"explain":"③ '가치 인식과 수학에 대한 태도'는 Attitude to Mathematics이고, Mathematical Attitude는 '수학적 태도'의 영문 표기이다. 나머지는 교안 내용과 일치한다.","source":{"page":9,"section":"수학적 태도와 실천 의지력","quote":"가치인식과수학에 대한태도 ... ( Attitude to Mathematics ) / 수학적태도 ... 수학적으로사고하려는태도(Mathematical Attitude)"}},{"id":"37-10","type":"옳지 않은 것","q":"역량중심 프로그램의 4가지 기본방향(한국교육개발원, 2020)에 해당하지 않는 것은?","box":null,"choices":["학생들이 실제로 당면할 수 있는 장면이나 실제 세계에 대한 탐구에서 출발함","해당 분야 전문가들의 수행 경험과 사고 활동 과정 및 실제 기능을 체험할 수 있도록 함","인식론적 문제의 탐색을 위해 대주제에 따른 핵심질문들을 도출함","학습자가 자신의 삶과 관련지어 지식의 의미를 통찰해 보는 경험을 제공함","교과 지식을 위계에 따라 순서대로 빠르게 선행 학습하도록 함"],"answer":5,"explain":"4가지 기본방향은 ①~④이다. ⑤ 위계에 따른 순서대로의 학습·선행 학습은 교안의 기본방향에 없다.","source":{"page":11,"section":"역량중심 프로그램의 4가지 기본방향","quote":"학생들이실제로당면할수있는 장면이나실제세계에대한탐구에서출발함해당분야전문가들의수행경험과사고활동과정및실제 기능을체험할수있도록 함"}},{"id":"37-11","type":"빈칸","q":"역량중심 프로그램의 기본방향에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"인식론적 문제의 탐색을 위해 대주제(테마, (   ))에 따른 핵심질문들을 도출함","choices":["Key Concept","Big Idea","STEAM","Core Value","Essential Skill"],"answer":2,"explain":"교안은 대주제를 '테마, Big Idea'로 표기한다. 나머지는 교안에 제시되지 않은 표현이다.","source":{"page":11,"section":"역량중심 프로그램의 4가지 기본방향","quote":"인식론적문제의탐색을위해대주제( 테마, Big Idea) 에따른핵심질문들을도출함"}},{"id":"37-12","type":"옳은 것","q":"'대수+기하+조합 문제해결을 통한 삶의 질 향상' 프로그램(한국교육개발원, 울산광역시교육청, 2020)에 대한 설명으로 옳은 것은?","box":null,"choices":["세 프로그램은 모두 중등 학교급을 대상으로 한다.","프로그램 전체 합계는 20 시수이다.","'공정/경제생활' 구분의 프로그램명은 '공정한 통계자료 활용 생활'이다.","'암호/보안' 프로그램의 1-2차시 제목은 '디지털 보안의 시작'이다.","'공학/감정전달' 프로그램의 9-10차시는 '공정과 수학 사이'이다."],"answer":3,"explain":"③이 옳다. ① 세 프로그램 모두 초등, ② 합계 30 시수(135시간), ④ 1-2차시는 '보안의 역사'(디지털 보안의 시작은 3-4차시), ⑤ 공학/감정전달 9-10차시는 '감정과 수학을 결합한 나만의 매스티콘 만들기'이며 '공정과 수학 사이'는 공정/경제생활의 9-10차시이다.","source":{"page":12,"section":"문제 해결을 통한 삶의 질 향상","quote":"공정/경제생활공정한통계자료활용생활초등 / 9 - 10 공정과수학사이 ... 감정과수학을결합한나만의매스티콘만들기합계30 시수 (135시간)"}},{"id":"37-13","type":"개념 찾기","q":"'수학의 이름으로 감정을 말하다'(공학/감정전달) 프로그램의 차시별 주요 핵심역량 표에서 모든 차시(1-3, 4-6, 7-8, 9-10)에 ●로 표시된 역량을 바르게 짝지은 것은?","box":null,"choices":["창의해결, 융합응용","고등추론, 소통협력","정보도구, 태도의지","고등추론, 정보도구","소통협력, 태도의지"],"answer":1,"explain":"표에서 공학/감정전달 프로그램은 모든 차시가 창의해결 ●, 고등추론 ○, 융합응용 ●, 소통협력 ○, 정보도구 ○, 태도의지 ◐이다. 따라서 ●는 창의해결과 융합응용이다.","source":{"page":13,"section":"문제 해결을 통한 삶의 질 향상","quote":"1 - 3 ● ○ ● ○ ○ ◐ / 4 - 6 ● ○ ● ○ ○ ◐ / 7 - 8 ● ○ ● ○ ○ ◐ / 공학/감정전달수학의이름으로감정을말하다 / 9 - 10 ● ○ ● ○ ○ ◐"}},{"id":"37-14","type":"옳지 않은 것","q":"'문제 해결을 통한 삶의 질 향상' 프로그램의 핵심어와 수준에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["암호/보안 프로그램의 문제해결 핵심어는 '보안·인증 방식의 불안전성'이다.","공정/경제생활 프로그램의 삶의 질 향상 핵심어는 '수리적 분석과 가치 판단을 통한 합리적 의사결정'이다.","공학/감정전달 프로그램의 삶의 질 향상 핵심어는 '언택트 시대 감정표현'이다.","세 프로그램의 수준(기관)은 모두 '영재학교'로 제시되어 있다.","세 프로그램의 수준(내용)은 모두 40:30:30이다."],"answer":4,"explain":"④ 세 프로그램의 기관 수준은 모두 '영재학급/영재교육원'이다. 나머지는 표와 일치한다. 공정/경제생활의 문제해결 핵심어는 '수익 분배의 불공정함', 공학/감정전달은 '감정과 수학을 결합한 매스티콘 제작'이다.","source":{"page":14,"section":"문제 해결을 통한 삶의 질 향상","quote":"보안· 인증 방식의불안전성기존의것에더하여더나은 보안방식을고안영재학급/영재교육원40:30:30"}},{"id":"37-15","type":"옳은 것","q":"1주제 '내가 누구인지 무엇이 말해줄 수 있는가?'의 차시 흐름을 순서대로 바르게 나열한 것은?","box":null,"choices":["디지털 보안의 시작 → 보안의 역사 → 생체인증 속 수학 → 완벽한 보안을 찾아서","보안의 역사 → 생체인증 속 수학 → 디지털 보안의 시작 → 완벽한 보안을 찾아서","보안의 역사 → 디지털 보안의 시작 → 완벽한 보안을 찾아서 → 생체인증 속 수학","생체인증 속 수학 → 보안의 역사 → 디지털 보안의 시작 → 완벽한 보안을 찾아서","보안의 역사 → 디지털 보안의 시작 → 생체인증 속 수학 → 완벽한 보안을 찾아서"],"answer":5,"explain":"①② 보안의 역사 → ③④⑤ 디지털 보안의 시작 → ⑥⑦⑧ 생체인증 속 수학 → ⑨⑩ 완벽한 보안을 찾아서(다중보안 탐색하기, 차세대 인증·보안 고안하기) 순이다.","source":{"page":15,"section":"1주제: 내가 누구인지 무엇이 말해줄 수 있는가?","quote":"다중보안탐색하기완벽한보안을찾아서 차세대인증 · 보안 고안하기 / ③④⑤ ⑥⑦⑧ / 디지털보안의시작생체인증속수학"}},{"id":"37-16","type":"보기 조합","q":"1주제 '내가 누구인지 무엇이 말해줄 수 있는가?'의 목표로 \u003c보기\u003e에서 옳은 것을 모두 고른 것은?","box":"ㄱ. (태도) 인증, 보안이 가지는 사회적 의미와 수학적 의미를 통해 수학적 아름다움을 느낄 수 있음\nㄴ. (과정) 미래의 인증, 보안 수단들을 예상할 수 있음\nㄷ. (내용) 인증, 보안 프로그램을 코딩하여 직접 상용화할 수 있음\nㄹ. (내용) 현재 인증, 보안 방법의 부족한 부분을 이해하여 개선방법을 생각해볼 수 있음","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ(태도), ㄴ(과정), ㄹ(내용)은 교안의 목표이다. ㄷ 코딩·상용화는 목표에 없다.","source":{"page":16,"section":"1주제: 내가 누구인지 무엇이 말해줄 수 있는가? - 목표","quote":"•미래의 인증, 보안 수단들을예상할수있음 / 태도 / •인증 , 보안의 중요성을이해할수있음 •인증 , 보안이 가지는사회적의미와수학적의미를통해수학적아름다움을느낄수있음"}},{"id":"37-17","type":"개념 찾기","q":"1주제 '내가 누구인지 무엇이 말해줄 수 있는가?'의 핵심역량 표시에서 ◐로 표시된 역량은?","box":null,"choices":["창의적 문제해결력","수학적 의사소통능력","융합 및 응용능력","고등 수학적 추론능력","수학적 태도 및 실천 의지력"],"answer":2,"explain":"표시 순서(창의·고등추론·융합응용·의사소통·정보처리·태도)가 ● ○ ● ◐ ○ ●이므로 ◐는 수학적 의사소통능력이다. ①③⑤는 ●, ④ 고등 수학적 추론능력은 ○이다.","source":{"page":17,"section":"1주제 핵심역량","quote":"창의적문제해결력 고등수학적추론능력 융합및응용능력수학적의사소통능력 정보처리및도구활용능력수학적태도및실천의지력 / ● ○ ● ◐ ○ ●"}},{"id":"37-18","type":"옳지 않은 것","q":"1주제 '내가 누구인지 무엇이 말해줄 수 있는가?'의 주요 핵심질문에 해당하지 않는 것은?","box":null,"choices":["인증, 보안의 목적은 무엇일까?","열쇠의 한계는 무엇인가?","암호화폐 속에는 어떤 수학적 요소가 있나?","생체인식 기술의 한계는 무엇인가?","완벽한 보안은 존재할까?"],"answer":3,"explain":"교안의 핵심질문은 인증·보안의 목적, 열쇠·패턴과 비밀번호·생체인식 속 수학적 요소와 한계, 완벽한 보안의 존재 여부이다. ③ 암호화폐는 제시되지 않았다.","source":{"page":18,"section":"주요 핵심질문","quote":"‣ 인증 , 보안의 목적은무엇일까?‣ 열쇠 속에는어떤수학적요소가있나?‣ 열쇠의 한계는무엇인가? ... ‣ 완벽한 보안은존재할까?"}},{"id":"37-19","type":"빈칸","q":"1주제 '생체인증 속 수학' 차시의 주요 활동이다. (   )에 들어갈 말로 알맞은 것은?","box":"얼굴인식에서 사용되는 (   ) 삼각형 그려보기: 3D 일러스트레이션 그려보기","choices":["델로네","파스칼","보로노이","시에르핀스키","펜로즈"],"answer":1,"explain":"교안은 얼굴인식에서 사용되는 '델로네 삼각형' 그려보기를 제시한다. 나머지는 교안에 없다.","source":{"page":19,"section":"1주제 차시 구성","quote":"얼굴인식에서 사용되는델로네삼각형그려보기: 3D 일러스트레이션 그려보기"}},{"id":"37-20","type":"옳지 않은 것","q":"1주제 차시 구성에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["'보안의 역사'는 2시수(80분)로 운영된다.","'디지털 보안의 시작'에서는 패턴, 비밀번호에서 수학을 찾는다.","'생체인증 속 수학'은 3시수(120분)이며 지문분류체계를 알아본다.","'완벽한 보안을 찾아서'는 3시수(120분)로 운영된다.","모든 차시의 준비물은 활동지이며, 산출물 또는 평가방법은 활동지와 자기평가지이다."],"answer":4,"explain":"④ '완벽한 보안을 찾아서'(9-10차시)는 2시수(80분)로, 다중보안 이슈 알아보기·새로운 보안 방식 구상하기를 한다. 나머지는 교안과 일치한다.","source":{"page":19,"section":"1주제 차시 구성","quote":"• 다중보안 이슈알아보기• 새로운 보안방식구상하기2 시수(80 분) 활동지 활동지자기평가지"}},{"id":"37-21","type":"옳은 것","q":"1주제 1-2차시 '보안의 역사'의 정규과정과의 연계로 제시된 성취기준은?","box":null,"choices":["[6수05-06] 가능성을 수나 말로 나타낸 예를 찾아보고, 가능성을 비교할 수 있음","[6수02-03] 원의 넓이를 구하는 방법을 이해할 수 있음","[6수03-01] 비와 비율을 이해할 수 있음","[6수04-02] 직육면체의 부피를 구할 수 있음","[6수05-01] 평균의 의미를 알 수 있음"],"answer":1,"explain":"교안의 연계 성취기준은 [6수01-01] 혼합계산 순서와 [6수05-06] 가능성 비교이다. ②~⑤는 교안에 제시되지 않았다. 이 차시 목표는 디지털 시대 이전부터 사용한 보안 기술에서 수학을 알아보고 허점을 찾아 보완하는 것이다.","source":{"page":21,"section":"1-2차시: 보안의 역사 - 목표","quote":"•[6 수05 - 06] 가능성을수나말로나타낸예를찾아보고, 가능성을비교할수있음"}},{"id":"37-22","type":"옳지 않은 것","q":"1-2차시 '보안의 역사' 수업의 흐름에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["도입 단계에서는 누가 누구인지 알아야 하는 상황을 이해한다.","전개 단계의 주민등록번호 활동에서는 새로 도입되는 주민등록번호 구성원리와 기존 원리를 비교한다.","열쇠에서 수학 찾기 활동에서는 열쇠 종류별로 가질 수 있는 경우의 수를 찾는다.","도입 단계에 가장 많은 35분이 배정되어 있다.","마무리 단계에서는 식별정보와 잠금장치의 발전단계를 파악한다."],"answer":4,"explain":"④ 도입은 5분이다. 주민등록번호에서 수학 찾기 25분, 열쇠에서 수학 찾기 35분, 마무리 15분이다.","source":{"page":22,"section":"1-2차시: 보안의 역사 - 수업의 흐름","quote":"도입생각하기문제상황이해하기5활동지• 누가 누구인지알아야하는상황이해하기 ... 열쇠에서수학찾기35• 열쇠 종류별로가질수있는 경우의수찾기"}},{"id":"37-23","type":"개념 찾기","q":"2주제 '공정한 통계자료 활용 생활'에서 첫 차시(①~③)의 문제상황으로 제시된 것은?","box":null,"choices":["초콜릿 생산지의 최저임금 정해보기","음원산업에서의 공정한 수익분배율 정하기","경제지수를 활용하여 공정지수 만들기","최저임금은 어떻게 정해질까?","주민등록번호의 허점 찾기"],"answer":2,"explain":"2주제는 음원산업에서의 공정한 수익분배율 정하기(문제상황, ①~③) → 최저임금은 어떻게 정해질까?(④⑤⑥) → 초콜릿 이익배분과 가격 정하기(⑦⑧) → 다양한 통계자료 활용하기(경제지수 활용, 공정지수 만들기, ⑨⑩)로 진행된다. ⑤는 1주제 활동이다.","source":{"page":23,"section":"2주제: 공정한 통계자료 활용 생활","quote":"음원산업에서의공정한수익분배율정하기 / ②③ / •음원 산업의수익분배율살펴보기•다른 상품유통업계의수수료율과비교하기"}},{"id":"37-24","type":"개념 찾기","q":"3주제 '온택트 시대의 공학적 감정표현'에서 컴퓨터가 감정을 받아들이는 방법으로 알아보고 '네모네모로직'을 통해 구현하는 것은?","box":null,"choices":["의사결정 트리","점자","델로네 삼각형","매스티콘","픽셀"],"answer":5,"explain":"'픽셀을 통한 컴퓨터의 감정인식' 차시에서 컴퓨터가 감정을 받아들이는 방법인 픽셀에 대해 알아보고 네모네모로직으로 픽셀을 구현한다. ① 의사결정 트리는 로봇의 의사결정방법 탐구, ② 점자는 언어에서 수학 찾기(수어와 점자), ③은 1주제 활동, ④ 매스티콘은 마지막 개념과 정의를 이미지화하는 활동이다.","source":{"page":24,"section":"3주제: 온택트 시대의 공학적 감정표현","quote":"•컴퓨터가 감정을받아들이는방법인픽셀에대해알아보기•네모네모로직을 통해픽셀구현하기"}}]},{"lesson":38,"title":"영재교육원, 영재학급 운영의 실제","file":"4. 교안 (31~60)[1] (1)/38.pdf","summary":["선발 시기: 교육지원청·단위학교 직속기관 영재교육원 9월~4월(GED 활용), 대학부설 영재교육원 9월~4월, 영재학급 2월~4월 — 모두 교사 관찰·추천에 의한 선발","영재학급과 예술 분야 단위학교 영재교육원은 GED 활용 여부 자율 선택","선발 단계: 자기추천(GED 회원가입·서류 작성) → 담임(교과 교사) 체크리스트 2종 + 학교추천위원회 최종추천 → 창의적 문제해결력 평가 → 면접평가(응시자 전원) → 체크리스트·창의적 문제해결력·면접 점수 합산","선발도구: 전문 기관이 창의적 문제해결력 선발도구·면접 도구 개발 → 교육지원청 영재교육원(협력학교) 적용 / 단위학교 영재교육원·영재학급은 자체 개발","연간 운영 시수: 초등 영재교육원 90시간·영재학급 72시간 이상, 중등 영재교육원 100시간·영재학급 80시간 이상 / 1교시 50분 기준, 부득이한 경우 5시간 감축 가능 / 1년 단위 수료, 매년 선발 원칙(연계 교육과정 제외)","선행학습형·사교육 유발형 영재교육과정 운영 금지 / 인성·리더십·진로교육 총 수업 시수의 10% 이상, AI 연계·STEAM·메이커교육 10% 이상","AI 연계 영재교육 온라인 콘텐츠 출처: 서울시교육청 뉴쌤 공개콘텐츠(1~20 주제)","체험학습·캠프 1회 운영 시수는 연간 시수의 20% 미만, 사전 예고 / 합숙 여부 관계없이 실제 운영시간으로 1일 최대 8시간","운영 사례: 총 90시수, 참여학생 20명, 교원 8명(내부강사 3, 외부강사 5) / 1학기 15주·2학기 14주(목 14:40~16:20), 여름캠프 1주(2023.08.07~08.11), 캠프 수업시수 총계 32","수료조건 80% 이상 출석 → 학교생활기록부 해당 학년 관련 교과 '세부능력 및 특기사항'란에 이수과정·이수영역·이수시간 기재(기관명 기재 금지)","영재교육기관 수상경력은 학생부 기재 불가 / 영재성 발달기록부 시스템(KEDI 제공): 영재교육원(협력학교) 필수, 영재학급 권장"],"questions":[{"id":"38-01","type":"옳은 것","q":"영재교육대상자 선발 시기에 대한 설명으로 옳은 것은?","box":null,"choices":["대학부설 영재교육원은 2월~4월에 선발한다.","영재학급은 9월~4월에 선발한다.","교육지원청, 단위학교 직속기관 영재교육원은 GED를 활용한 교사 관찰·추천에 의해 9월~4월에 선발한다.","대학부설 영재교육원은 지필시험만으로 선발한다.","모든 기관은 반드시 GED를 활용해야 한다."],"answer":3,"explain":"③이 옳다. ① 대학부설 영재교육원은 9월~4월, ② 영재학급은 2월~4월, ④ 모든 기관이 교사 관찰·추천에 의한 선발, ⑤ 영재학급과 예술 분야 단위학교 영재교육원은 GED 활용 여부를 자율 선택한다.","source":{"page":3,"section":"영재교육대상자 선발 시기","quote":"교육지원청, 단위학교 직속기관영재교육원교사관찰· 추천에 의한선발(GED 활용)9 월~4 월대학부설영재교육원교사관찰· 추천에 의한선발9 월~4 월영재학급교사관찰· 추천에 의한선발2 월~4 월"}},{"id":"38-02","type":"옳은 것","q":"GED 활용 여부를 자율 선택할 수 있는 기관으로 교안에 제시된 것은?","box":null,"choices":["영재학급과 예술 분야 단위학교 영재교육원","대학부설 영재교육원과 영재학교","교육지원청 영재교육원과 영재학급","과학고등학교와 예술 분야 단위학교 영재교육원","교육지원청 직속기관 영재교육원과 대학부설 영재교육원"],"answer":1,"explain":"Tip에 따르면 영재학급과 예술 분야 단위학교 영재교육원의 경우 GED 활용 여부를 자율 선택한다. 교육지원청·단위학교 직속기관 영재교육원은 GED 활용으로 선발한다.","source":{"page":3,"section":"영재교육대상자 선발 시기","quote":"Tip! 영재학급과 예술분야단위학교영재교육원의경우GED 활용여부를자율선택함"}},{"id":"38-03","type":"빈칸","q":"선발 단계 중 '담임 및 학교추천위원회 추천'에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"담임 교사(교과 교사)는 GED에서 지원자를 대상으로 모집요강에 제시된 체크리스트 (   )을 작성하고, 학교추천위원회는 담임 체크리스트 등을 참고하여 최종추천","choices":["1종","3종","4종","2종","5종"],"answer":4,"explain":"담임 교사(교과 교사)는 체크리스트 2종을 작성한다. 이에 앞서 자기추천 단계에서 학생은 GED 추천시스템에 회원가입 후 로그인하여 지원 기관별 지정서류를 작성한다.","source":{"page":4,"section":"선발 단계별 내용","quote":"담임 교사( 교과 교사) 는GED 에서지원자를대상으로모집요강에제시된체크리스트2 종을 작성하고, 학교추천위원회는담임체크리스트등을참고하여최종추천"}},{"id":"38-04","type":"옳은 것","q":"GED 추천시스템에 의한 영재교육대상자 선발 단계를 순서대로 바르게 나열한 것은?","box":null,"choices":["담임 및 학교추천위원회 추천 → 자기추천 → 면접평가 → 창의적 문제해결력 평가","자기추천 → 담임 및 학교추천위원회 추천 → 창의적 문제해결력 평가 → 면접평가","자기추천 → 창의적 문제해결력 평가 → 담임 및 학교추천위원회 추천 → 면접평가","창의적 문제해결력 평가 → 자기추천 → 면접평가 → 담임 및 학교추천위원회 추천","자기추천 → 면접평가 → 창의적 문제해결력 평가 → 담임 및 학교추천위원회 추천"],"answer":2,"explain":"자기추천 → 담임 및 학교추천위원회 추천 → (학교추천위원회 추천자 대상) 창의적 문제해결력 평가 → (응시자 전원) 면접평가 순이다.","source":{"page":5,"section":"선발 단계별 내용","quote":"학교추천위원회 추천자를대상으로창의적문제해결력평가를실시면접평가 / ‣ 창의적 문제해결력평가응시자전원에대하여면접평가를실시"}},{"id":"38-05","type":"옳은 것","q":"영재교육대상자 최종합격자 선발 방법에 대한 설명으로 옳은 것은?","box":null,"choices":["면접평가는 창의적 문제해결력 평가 상위 50%에게만 실시한다.","면접 평가점수만으로 최종합격자를 선발한다.","창의적 문제해결력 평가는 GED 회원가입자 전원을 대상으로 실시한다.","체크리스트 점수는 최종 합산에 포함되지 않는다.","체크리스트, 창의적 문제해결력, 면접 평가점수를 합산하여 최종합격자를 선발한다."],"answer":5,"explain":"⑤가 옳다. ① 면접은 창의적 문제해결력 평가 응시자 전원 대상, ② 면접 점수만이 아니라 세 점수 합산, ③ 창의적 문제해결력 평가는 학교추천위원회 추천자 대상, ④ 체크리스트 점수도 합산에 포함된다.","source":{"page":5,"section":"선발 단계별 내용","quote":"창의적 문제해결력평가응시자전원에대하여면접평가를실시한후체크리스트 , 창의적 문제해결력, 면접 평가점수를합산하여최종합격자선발"}},{"id":"38-06","type":"옳지 않은 것","q":"영재교육대상자 선발도구 개발에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["선발도구는 전문 기관에서 개발한다.","단위학교에 설치된 영재교육원 및 영재학급도 전문 기관이 개발한 선발도구를 반드시 사용해야 한다.","개발 도구는 창의적 문제해결력 선발도구와 면접 도구이다.","개발된 선발도구는 교육지원청 영재교육원(협력학교)에 적용된다.","단위학교에 설치된 영재교육원 및 영재학급은 선발도구를 자체 개발한다."],"answer":2,"explain":"② 단위학교에 설치된 영재교육원 및 영재학급은 선발도구를 자체 개발한다(Tip). 나머지는 교안과 일치한다.","source":{"page":6,"section":"선발도구 개발","quote":"교육지원청 영재교육원(협력학교 )Tip!단위학교에설치된영재교육원및영재학급은 선발도구자체개발"}},{"id":"38-07","type":"개념 찾기","q":"중등 영재학급의 연간 운영 시수 기준으로 옳은 것은?","box":null,"choices":["72시간 이상","90시간 이상","100시간 이상","80시간 이상","120시간 이상"],"answer":4,"explain":"연간 운영 시수는 초등 영재교육원 90시간 이상, 초등 영재학급 72시간 이상, 중등 영재교육원 100시간 이상, 중등 영재학급 80시간 이상이다.","source":{"page":8,"section":"운영 시기 및 시간","quote":"시간학교급초등중등유형영재교육원영재학급영재교육원영재학급연간운영 시수90 시간 이상72 시간 이상100시간이상80 시간 이상"}},{"id":"38-08","type":"옳지 않은 것","q":"영재교육기관의 운영 시기 및 시간에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["방과 후, 주말, 방학 기간을 활용한다.","1교시 수업시간은 50분을 기준으로 운영한다.","1년 단위로 교육과정을 수료하도록 한다.","매년 선발을 원칙으로 한다(연계 교육과정 제외).","부득이한 경우 전체 운영 시간 중 10시간까지 감축 운영할 수 있다."],"answer":5,"explain":"⑤ 부득이한 경우 감축 가능한 시간은 전체 운영 시간 중 5시간이다. 나머지는 교안과 일치한다.","source":{"page":8,"section":"운영 시기 및 시간","quote":"영재교육기관의 1 교시 수업시간은50 분을 기준으로운영하며, 부득이한경우전체운영시간중5 시간 감축운영가능"}},{"id":"38-09","type":"보기 조합","q":"영재교육 프로그램 구성에 대한 설명으로 \u003c보기\u003e에서 옳은 것을 모두 고른 것은?","box":"ㄱ. 영재교육진흥종합계획, 영재교육 세부추진계획, 영재교육 실무편람, 교육청 개발 영재교육과정을 참조하여 편성한다.\nㄴ. 영역별, 급별 강사협의회를 활성화하여 일관된 영재교육과정을 운영한다.\nㄷ. 잠재능력과 창의성을 계발할 수 있는 학생활동 위주의 영재교육과정을 운영한다.\nㄹ. 학업 성취를 높이기 위해 선행학습형 영재교육과정을 적극 운영한다.","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"explain":"ㄱ, ㄴ, ㄷ은 교안 내용이다. ㄹ 선행학습형, 사교육 유발형 영재교육과정 운영은 금지된다.","source":{"page":9,"section":"영재교육 프로그램 구성","quote":"잠재능력과창의성을계발할수있는 학생활동위주의영재교육과정운영선행학습형, 사교육 유발형영재교육과정운영금지"}},{"id":"38-10","type":"빈칸","q":"영재교육 프로그램 구성 기준이다. (   )에 공통으로 들어갈 말로 알맞은 것은?","box":"인성∙리더십∙진로교육: 총 수업 시수의 (   ) 이상 운영\nAI 연계 영재교육∙STEAM∙메이커교육: 총 수업 시수의 (   ) 이상 운영","choices":["5%","20%","10%","15%","30%"],"answer":3,"explain":"인성·리더십·진로교육과 AI 연계 영재교육·STEAM·메이커교육은 각각 총 수업 시수의 10% 이상 운영한다. 20%는 캠프 1회 운영 시수 기준(연간 시수의 20% 미만)과 혼동하기 쉽다.","source":{"page":10,"section":"영재교육 프로그램 구성","quote":"인성∙리더십 ∙진로교육 영재교육프로그램구성 / ‣ 총수업 시수의10% 이상운영 / AI 연계 영재교육∙STEAM ∙메이커교육 / ‣ 총수업 시수의10% 이상운영"}},{"id":"38-11","type":"옳은 것","q":"교안에 제시된 AI 연계 영재교육 온라인 콘텐츠 목록에 대한 설명으로 옳은 것은?","box":null,"choices":["출처는 한국교육개발원 영재교육종합데이터베이스이다.","서울시교육청 뉴쌤 공개콘텐츠가 출처이다.","6번 주제는 '피지컬 교구(아두이노)를 활용한 자료수집'이다.","1번 주제는 '딥러닝을 이용한 자연어처리'이다.","모든 주제는 엔트리 없이 텍스트 코딩으로만 진행된다."],"answer":2,"explain":"②가 옳다. ① 출처는 서울시교육청 뉴쌤 공개콘텐츠, ③ 6번은 피지컬 교구(마이크로비트), ④ 1번은 '인공지능이란'(딥러닝을 이용한 자연어처리는 20번), ⑤ 3번 '엔트리를 이용하여 해결하기', 16번 '엔트리 인공지능 블록 경험하기' 등 엔트리 활용 주제가 있다.","source":{"page":11,"section":"AI 연계 영재교육 온라인 콘텐츠 목록","quote":"1인공지능이란 ... 6피지컬교구(마이크로비트 ) 를활용한 자료수집 ... 출처: 서울시교육청뉴쌤공개콘텐츠"}},{"id":"38-12","type":"옳지 않은 것","q":"AI 연계 영재교육 온라인 콘텐츠 목록(11~20번)에 포함되지 않은 주제는?","box":null,"choices":["안전을 지켜주는 AI 화재감지 시스템","수어통역기","오픈API 활용하기","자율주행 자동차 만들기","딥러닝을 이용한 자연어처리"],"answer":4,"explain":"11~20번은 세상을 따뜻하게 하는 기술, 안전을 지켜주는 AI 화재감지 시스템, 머신러닝 모델 활용하기, 오픈API 활용하기, 수어통역기, 엔트리 인공지능 블록 경험하기, 음성인식 마이크로비트(1)(2), 데이터 속성 및 시각화, 딥러닝을 이용한 자연어처리이다. ④는 목록에 없다.","source":{"page":12,"section":"AI 연계 영재교육 온라인 콘텐츠 목록","quote":"순주제11세상을따뜻하게하는기술12안전을지켜주는AI 화재감지 시스템13머신러닝모델활용하기14오픈API 활용하기15수어통역기"}},{"id":"38-13","type":"빈칸","q":"영재교육 프로그램 구성 중 집중탐구활동에 대한 기준이다. (   )에 들어갈 말로 알맞은 것은?","box":"체험학습 또는 캠프의 1회 운영 시수는 연간 시수의 (   ) 미만 편성, 사전 예고","choices":["20%","10%","30%","50%","15%"],"answer":1,"explain":"체험학습 또는 캠프의 1회 운영 시수는 연간 시수의 20% 미만으로 편성하고 사전 예고한다. 10%는 인성·리더십·진로교육 및 AI·STEAM·메이커교육의 최소 비율이다.","source":{"page":13,"section":"영재교육 프로그램 구성","quote":"체험학습 또는캠프의1 회운영 시수는연간시수의20% 미만편성, 사전 예고"}},{"id":"38-14","type":"사례","q":"다음 사례 중 교안의 영재교육 프로그램 구성 기준에 어긋나는 것은?","box":null,"choices":["학부모를 대상으로 한 설명회를 교육과정에 포함하였다.","창의적 산출물 발표회(전시회)를 운영하였다.","온오프라인 연계 교육과정을 운영하였다.","영재교육대상자 및 학부모를 대상으로 상담을 실시하였다.","합숙 캠프이므로 실제 운영시간과 관계없이 1일 10시간으로 시수를 인정하였다."],"answer":5,"explain":"캠프 시수는 합숙 여부에 관계없이 실제 운영시간으로 1일 최대 8시간까지 인정한다. 따라서 ⑤는 기준에 어긋난다. ①~④는 교안에서 권장·운영하도록 제시된 내용이다.","source":{"page":13,"section":"영재교육 프로그램 구성","quote":"합숙 여부에관계없이실제운영시간으로1 일최대 8 시간"}},{"id":"38-15","type":"옳지 않은 것","q":"교안의 영재교육 프로그램 실제 운영 사례(연간 교육과정)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["총 시수는 90시간이다.","참여 학생 수는 20명이다.","참여 교원은 내부강사 5명, 외부강사 3명이다.","모든 영역의 주당 시수는 2이다.","AI 교육과 STEAM 및 메이커교육의 총 시수는 각각 8시간이다."],"answer":3,"explain":"③ 참여 교원은 내부강사 3명, 외부강사 5명으로 총 8명이다. 수와 연산·도형·측정 각 12, 규칙성·자료와 가능성·인성·리더십·진로교육 각 10, 창의성·AI 교육·STEAM 및 메이커교육 각 8, 계 90시간이다.","source":{"page":14,"section":"영재교육 프로그램 실제 운영 사례 - 연간 교육과정","quote":"20내부강사3외부강사5 ... AI 교육 28STEAM 및메이커교육 28계90208"}},{"id":"38-16","type":"옳은 것","q":"교안의 영재교육 프로그램 실제 운영 사례(연간 일정)에 대한 설명으로 옳은 것은?","box":null,"choices":["1학기는 14주, 2학기는 15주 운영하였다.","1학기와 2학기 모두 목요일 14:40~16:20에 운영하였다.","여름캠프는 2주간 운영하였다.","1학기는 토요일에 운영하였다.","여름캠프는 2023년 7월에 운영하였다."],"answer":2,"explain":"②가 옳다. ① 1학기 15주, 2학기 14주, ③ 여름캠프 1주, ④ 목요일, ⑤ 여름캠프는 2023. 08. 07 ~ 08. 11(월~금)이다.","source":{"page":15,"section":"영재교육 프로그램 실제 운영 사례 - 연간 일정","quote":"1 학기 15주2023. 03. 30 ~ 07. 13목14:40~16:20 / 여름캠프1 주 2023. 08. 07 ~ 08. 11 ... 2 학기 14주2023. 08. 31 ~ 12. 07목14:40~16:20"}},{"id":"38-17","type":"옳지 않은 것","q":"교안의 영재캠프 운영 예시에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["8.7에는 수와 연산 영역으로 Thinking Math(싱가포르 영재수학)를 운영하였다.","GSP(Geometer’s Sketchpad)는 측정 영역 주제로 운영되었다.","8.11 체험학습에서 STEAM 및 메이커교육으로 과학전시관 수학체험관을 4시간 운영하였다.","AI 교육은 교수님 특강으로 인공지능 특강을 운영하였다.","캠프 수업시수 총계는 40시간이다."],"answer":5,"explain":"⑤ 캠프 수업시수 총계는 32시간이다. ④ 교안에서 AI 교육 '인공지능특강'의 담당은 교수님 특강으로 제시되어 있다(8.9에는 서울수학학습메타버스 개발자특강도 있음).","source":{"page":16,"section":"영재캠프 운영 예시","quote":"STEAM 및메이커교육 과학전시관수학체험관4캠프수업시수총계32"}},{"id":"38-18","type":"빈칸","q":"영재교육 이수관리 중 수료조건이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   ) 이상 출석 → 학교생활기록부에 영재교육 이수 사실 기재","choices":["80%","70%","90%","2/3","75%"],"answer":1,"explain":"수료조건은 80% 이상 출석이며, 이때 학교생활기록부에 영재교육 이수 사실을 기재한다.","source":{"page":17,"section":"영재교육 이수관리 - 수료조건","quote":"80% 이상출석학교생활기록부에영재교육이수사실기재"}},{"id":"38-19","type":"옳지 않은 것","q":"영재교육 이수 사실의 학교생활기록부 기재에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["해당 학년 관련 교과의 '세부능력 및 특기사항'란에 기재한다.","이수과정을 기재한다.","이수영역과 이수시간을 기재한다.","어느 기관에서 이수했는지 알 수 있도록 기관명을 함께 기재한다.","'영재교육원에서 5학년 과정 수학영역(90시간) 84시간을 이수함'과 같이 기재한다."],"answer":4,"explain":"④ 기관명 기재는 금지된다. 기재 내용은 이수과정, 이수영역, 이수시간이다.","source":{"page":17,"section":"영재교육 이수관리 - 수료조건","quote":"기재 내용: 이수과정 , 이수영역 , 이수시간 기재( 기관명 기재금지)‣ 예 : 영재교육원에서 5 학년 과정수학영역(90시간) 84 시간을 이수함"}},{"id":"38-20","type":"옳은 것","q":"영재교육 이수관리(수상기록 기재 여부 등)에 대한 설명으로 옳은 것은?","box":null,"choices":["영재교육기관으로부터 받은 수상경력은 학교생활기록부 수상경력란에 기재한다.","영재성 발달기록부 시스템은 교육부가 제공한다.","영재성 발달기록부 시스템은 영재학급에서 필수로 사용해야 한다.","영재성 발달기록부 시스템은 영재교육원(협력학교)은 필수, 영재학급은 권장이다.","영재교육기관은 법령상 운영학교와 같은 기관으로 본다."],"answer":4,"explain":"④가 옳다. ① 영재교육기관의 수상경력은 학교생활기록부에 기재할 수 없음, ② 시스템은 KEDI 제공, ③ 영재학급은 권장, ⑤ 운영학교와는 별개로 법령상 외부기관으로 보아야 한다. 이 시스템은 전국 표준 생활기록부 양식 제공 및 기록물 보존, 기관 간 연계를 위해 구축되었다.","source":{"page":18,"section":"영재교육 이수관리 - 수상기록 기재 여부","quote":"영재성발달기록부시스템활용(KEDI 제공) / ‣ 영재교육원 (협력학교 ) 는필수 , 영재학급 권장"}}]},{"lesson":39,"title":"영재교육에서 창의융합교육이란?","file":"4. 교안 (31~60)[1] (1)/39.pdf","summary":["세계경제포럼 의장 클라우스 슈밥(Klaus Schwab): 국가경쟁력의 원천은 혁신역량 = 창의성(새롭고 가치 있는 산물을 만들어내는 능력) + 융합력(융합적 포괄적 이해능력이 성공의 전제조건)","교육부 창의융합인재육성: 창의적 아이디어와 과학기술 경쟁력 = 국가 경쟁력, 기존 기술을 새롭고 조화롭게 융합 → '융합적 사고' 필수","미국 STEM → 우리나라 STEAM(예술 추가), '창의융합교육'으로 명명 / 미국: STEM 교사 10만 명, STEM 중점학교 1000개, PLTW(50개 주 4000여 개 중학교), NASA, STC\u0026STC/MS","STEAM 개념: 흥미와 이해를 높이고 과학기술 기반의 융합적 사고(STEAM Literacy)와 문제해결능력 배양 / S·M 이론·개념적, E·T 실생활 연계 활용·적용, A 감성적","제5차 영재교육진흥종합계획: 지식 중심 분절적 교과교육 → 주제 중심 교과융합 및 역량교육 / 자기주도성 기반 '변혁적 역량'","제2차 융합교육종합계획(2020-2024) 필요성: 4차 산업혁명, 인생 100세 시대 평생학습, 지식·정보 폭발적 증가, 융합형 프로젝트 기반 학생중심 교육, 미래형 교육혁신 도약기반","한국교육개발원 정의: 두 개 이상의 교과(학문)의 지식·테크닉·도구·연구 방법·통찰력·관점 활용","하버트 사이먼(심리학+컴퓨터 과학+비즈니스), 로저 스페리(신경과학+전통적 인지심리학) 노벨상 → 융합교육 최종목표 '혁신적 리더 육성'","영재학교 융합교과: 융합과학, 과학의 역사와 철학, 사회문제와 인문학적 상상력, 바이오화학융합수학 / 한계: 과학을 잘하는 특정 학생들만 모여 있음","한국과학영재학교: '인류 사회에 공헌할 창의적 글로벌 리더 육성', 5차 교육과정, 신규 융합과목 8학점, KAIST 연수","서울과학고: '세계에 공헌할 창의적 융합인재 육성', 일반·전문·융합 교과, 교원 직무연수 30시간","인천대 과학영재교육원: 초등심화과정(소집단 토론·탐구, 확산적·종합적 사고) / 초등사사프로젝트과정(생활환경 속 친근한 주제, 소그룹 장기프로젝트, 과학자로서의 자질)"],"questions":[{"id":"39-01","type":"개념 찾기","q":"세계경제포럼 의장 클라우스 슈밥(Klaus Schwab)이 국가경쟁력의 원천인 혁신역량으로 제시한 두 가지는?","box":null,"choices":["창의성, 융합력","지능, 학력","창의성, 과제집착력","융합력, 자기주도성","협업능력, 의사소통능력"],"answer":1,"explain":"클라우스 슈밥은 국가경쟁력의 원천을 혁신역량으로 보고, 그 요소로 창의성과 융합력을 제시하였다. 나머지 조합은 교안의 이 쪽에 제시되지 않았다.","source":{"page":3,"section":"세계경제포럼 의장 클라우스 슈밥","quote":"국가경쟁력의원천혁신역량 / ‣ 창의성 / • 새롭고 가치있는산물을만들어내는능력 / ‣ 융합력"}},{"id":"39-02","type":"빈칸","q":"클라우스 슈밥이 제시한 혁신역량에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"융합력: 특정 지식 차원의 접근이 아닌 (   ) 이해능력이 성공의 전제조건","choices":["분석적 논리적","전문적 심층적","융합적 포괄적","직관적 감성적","단계적 위계적"],"answer":3,"explain":"융합력은 특정 지식 차원의 접근이 아닌 '융합적 포괄적' 이해능력이 성공의 전제조건이라는 것이다. 창의성은 '새롭고 가치 있는 산물을 만들어내는 능력'이다.","source":{"page":3,"section":"세계경제포럼 의장 클라우스 슈밥","quote":"• 특정 지식차원의접근이아닌융합적포괄적이해능력이성공의전제조건"}},{"id":"39-03","type":"빈칸","q":"교육부 창의융합인재육성에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"창의적 아이디어와 과학기술 경쟁력이 곧 국가 경쟁력. 미래의 기술혁신은 기존의 기술을 새롭고 조화롭게 융합하는 것이 중요하므로, “(   )”가 필수임","choices":["비판적 사고","컴퓨팅 사고","확산적 사고","융합적 사고","수렴적 사고"],"answer":4,"explain":"교안은 미래의 기술혁신을 위해 '융합적 사고'가 필수라고 제시한다(기술혁신 → 과학기술 경쟁력 → 국가 경쟁력).","source":{"page":4,"section":"교육부 창의융합인재육성","quote":"미래의 기술혁신은기존의 기술을새롭고조화롭게융합하는것이중요하므로, “ 융합적 사고”가필수임"}},{"id":"39-04","type":"옳은 것","q":"교육부 창의융합(STEAM) 인재육성에 대한 설명으로 옳은 것은?","box":null,"choices":["우리나라는 미국의 STEAM 교육을 STEM 교육으로 바꾸어 도입하였다.","과학기술 지식만을 집중적으로 갖춘 사람을 길러내는 것을 목표로 한다.","미국의 STEM 교육을 우리나라는 STEAM 교육으로 하면서 '창의융합교육'으로 명명하였다.","STEAM의 A는 Algorithm(알고리즘)을 의미한다.","예술적 감성은 STEAM 교육의 범위에서 제외된다."],"answer":3,"explain":"③이 옳다. ① 미국 STEM → 우리나라 STEAM, ② 과학기술 지식뿐 아니라 상상력과 예술적 감성까지 아우르는 능력을 겸비한 사람, ④ A는 예술(Arts), ⑤ 예술적 감성이 포함된다.","source":{"page":5,"section":"교육부 창의융합(STEAM) 인재육성","quote":"과학기술지식뿐아니라 , 상상력과 예술적감성까지아우를수있는 능력을겸비한사람미국의STEM 교육을우리나라는STEAM 교육으로하면서 / “창의융합교육”으로 명명"}},{"id":"39-05","type":"옳지 않은 것","q":"미국의 국가경쟁력 강화를 위한 수학, 과학, 기술 교육 강화 정책에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["STEM 교사 10만 명을 육성한다.","STEM 중점학교 1000개를 조성한다.","Project Lead The Way(PLTW)는 공학에 대한 흥미·이해 제고를 위한 것이다.","PLTW는 미국 50개 주 400여 개 고등학교에 보급되었다.","STC\u0026STC/MS는 실생활 주제 중심의 과학교육 프로그램이다."],"answer":4,"explain":"④ PLTW는 미국 50개 주 4000여 개 중학교에 보급되었다. 그 밖에 NASA 과학교육표준, NASA 우주공학교육과정도 제시되어 있다.","source":{"page":6,"section":"미국: 수학, 과학, 기술 교육 강화","quote":"STEM 교사10 만명 육성, STEM 중점학교1000개조성 ‣ Project Lead The Way(PLTW) / • 공학에 대한흥미이해제고• 미국 50개주4000 여개중학교에보급"}},{"id":"39-06","type":"빈칸","q":"융합인재교육(STEAM)의 개념이다. (   )에 들어갈 말로 알맞은 것은?","box":"흥미와 이해를 높이고, 과학기술 기반의 융합적 사고((   ))와 문제해결능력을 배양하는 교육","choices":["Digital Literacy","STEAM Literacy","Data Literacy","AI Literacy","Science Literacy"],"answer":2,"explain":"교안은 과학기술 기반의 융합적 사고를 'STEAM Literacy'로 표기한다. STEAM = Science, Technology, Engineering, Arts, Mathematics.","source":{"page":7,"section":"융합인재교육(STEAM)의 개념","quote":"흥미와이해를높이고, 과학기술 기반의융합적사고(STEAM Literacy)와문제해결능력을 배양하는교육"}},{"id":"39-07","type":"옳지 않은 것","q":"융합인재교육(STEAM)의 개념과 기존의 과학교육 비교에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["과학(S), 수학(M)은 이론·개념적 영역이다.","공학(E), 기술(T)은 실생활 연계 활용·적용 영역이다.","예술(A)은 감성적 영역이다.","STEAM 교육은 누군가 정립해 놓은 지식과 개념, 이론을 위계에 따라 순서대로 배우는 것이다.","STEAM 교육은 지식을 왜 배우는지, 어디에 사용되는지 이해하고 실생활 문제해결력을 배양한다."],"answer":4,"explain":"④ 정립된 지식과 개념, 이론을 위계에 따라 순서대로 배우는 것은 '기존의 과학교육'의 특징이다. STEAM 교육은 ⑤처럼 지식을 왜 배우는지, 어디에 사용되는지 이해하고 실생활 문제해결력을 배양한다.","source":{"page":8,"section":"융합인재교육(STEAM)의 개념","quote":"누군가정립해놓은지식과개념, 이론을위계에따라순서대로배움 / •지식을 왜배우는지 , 어디에 사용되는지이해•실생활 문제해결력배양"}},{"id":"39-08","type":"빈칸","q":"교육부의 제5차 영재교육진흥종합계획에 제시된 인재상의 변화이다. (   )에 들어갈 말로 알맞은 것은?","box":"변화하는 시대의 다양한 문제를 해결할 수 있는 자기주도성에 기반한 ‘(   )’을 갖춘 인재 필요성 증가","choices":["변혁적 역량","디지털 역량","핵심 역량","창의적 역량","융합 역량"],"answer":1,"explain":"제5차 영재교육진흥종합계획은 자기주도성에 기반한 '변혁적 역량'을 갖춘 인재를 제시한다. 또한 교육패러다임은 지식 중심의 분절적 교과교육에서 주제 중심의 교과융합 및 역량교육으로 변화한다.","source":{"page":9,"section":"교육부의 제5차 영재교육진흥종합계획","quote":"변화하는 시대의다양한문제를해결할수있는 자기주도성에기반한’변혁적역량’을갖춘인재필요성증가"}},{"id":"39-09","type":"옳은 것","q":"교육부의 제2차 융합교육종합계획의 계획 기간으로 옳은 것은?","box":null,"choices":["2018-2022","2019-2023","2021-2025","2023-2027","2020-2024"],"answer":5,"explain":"교안의 출처 표기는 교육부(2020), '제2차 융합교육종합계획(2020-2024)'이다.","source":{"page":10,"section":"교육부의 제2차 융합교육종합계획","quote":"출처: 교육부(2020), “제2차융합교육종합계획(2020-2024)“"}},{"id":"39-10","type":"보기 조합","q":"교육부의 제2차 융합교육종합계획의 필요성으로 \u003c보기\u003e에서 옳은 것을 모두 고른 것은?","box":"ㄱ. 4차 산업혁명 시대의 사회적 변화에 따라 새로운 인재상이 요구되고 있음\nㄴ. 인생 100세 시대에 따라 평생학습의 중요성이 부각됨\nㄷ. 지식·정보의 폭발적 증가에 따라 삶 속에서의 문제해결보다 단편적 지식 습득이 더 중요해짐\nㄹ. 융합형 프로젝트 기반의 학생중심 교육활동을 통해 미래세대에 요구되는 핵심역량 함양 촉진","choices":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"ㄱ, ㄴ, ㄹ은 교안 내용이다. ㄷ 교안은 지식·정보의 폭발적 증가에 따라 단편적 지식보다 삶 속에서 창의·융합적 사고를 바탕으로 문제를 발굴하고 해결하는 역량이 중요하다고 했다. 또한 이 계획은 미래사회를 대비한 교육의 청사진이자 미래형 교육혁신을 촉진할 수 있는 도약기반이다.","source":{"page":12,"section":"교육부의 제2차 융합교육종합계획의 필요성","quote":"지식· 정보의 폭발적증가에따라단편적지식보다삶속에서창의· 융합적 사고를바탕으로문제를발굴하고해결하는역량중요"}},{"id":"39-11","type":"옳은 것","q":"제2차 융합교육종합계획의 필요성 중 '인생 100세 시대'와 관련하여 교안이 강조한 학교의 역할은?","box":null,"choices":["대학 입시 경쟁력을 높이는 역할","배움에 대한 중요성과 흥미를 키워주는 역할","직업 기능을 조기에 습득시키는 역할","단편적 지식을 빠르게 전달하는 역할","평가와 선발 중심의 역할"],"answer":2,"explain":"교안은 인생 100세 시대에 따라 평생학습의 중요성이 부각되고, 배움에 대한 중요성과 흥미를 키워주는 학교의 역할이 강조된다고 했다. 나머지는 교안에 없는 내용이다.","source":{"page":11,"section":"교육부의 제2차 융합교육종합계획의 필요성","quote":"인생100세시대에 따라평생학습의중요성이부각되고있으며, 배움에 대한중요성과흥미를키워주는학교의역할강조"}},{"id":"39-12","type":"빈칸","q":"한국교육개발원의 융합교육 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   )의 교과(학문)의 지식, 테크닉, 도구, 연구 방법, 통찰력, 관점을 활용 개인 혹은 집단으로, 현상을 더 깊이 이해하거나 새로운 연관성을 찾아 문제를 해결하거나 창의적인 산출물을 만들어내는 교육","choices":["두 개 이상","하나의 심화된","세 개 이상","모든","인접한 두 개"],"answer":1,"explain":"한국교육개발원은 '두 개 이상의 교과(학문)'의 지식, 테크닉, 도구, 연구 방법, 통찰력, 관점을 활용하는 교육으로 정의한다.","source":{"page":13,"section":"한국교육개발원","quote":"두개이상의 교과( 학문 ) 의지식 , 테크닉 , 도구 , 연구 방법, 통찰력, 관점을 활용개인혹은집단으로"}},{"id":"39-13","type":"옳은 것","q":"영재교육과 융합교육(혁신적 리더 육성)에서 제시된 노벨상 수상자 사례로 옳은 것은?","box":null,"choices":["하버트 사이먼의 노벨상은 심리학, 컴퓨터 과학 및 비즈니스를 결합한 것이었다.","하버트 사이먼의 노벨상은 신경과학과 전통적인 인지심리학을 결합한 결과였다.","로저 스페리는 미국의 경제학자로 컴퓨터 과학과 비즈니스를 결합하였다.","로저 스페리의 노벨상은 물리학과 화학을 결합한 결과였다.","두 사람 모두 단일 학문을 깊이 파고든 결과 노벨상을 받았다."],"answer":1,"explain":"①이 옳다. ② 신경과학과 전통적인 인지심리학의 결합은 로저 스페리(미국의 신경심리학자/신경과학자)의 뇌에 대한 노벨상, ③ 하버트 사이먼이 인지심리학자/경제학자/컴퓨터과학자, ④ 물리학·화학은 교안에 없음, ⑤ 두 사례 모두 융합의 결과이다. 교안은 '최고의 아이디어는 융합의 결과'라고 한다.","source":{"page":14,"section":"영재교육과 융합교육, 혁신적 리더 육성","quote":"미국의 인지심리학자/ 경제학자 / 컴퓨터과학자 하버트사이먼의노벨상은심리학, 컴퓨터 과학및비즈니스를 결합한것이었음"}},{"id":"39-14","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"융합교육은 영재(리더) 교육과 불가분의 관계로 융합교육의 최종목표를 “(   )”이라고 함","choices":["창의적 글로벌 리더 육성","혁신적 리더 육성","창의융합인재 육성","노벨상 수상자 육성","변혁적 역량 함양"],"answer":2,"explain":"교안은 융합교육의 최종목표를 '혁신적 리더 육성'이라고 한다. ① '창의적 글로벌 리더 육성'은 한국과학영재학교의 교육목표 표현이다.","source":{"page":15,"section":"영재교육과 융합교육, 혁신적 리더 육성","quote":"융합교육은영재( 리더 ) 교육과 불가분의관계로융합교육의최종목표를“혁신적리더육성”이라고함"}},{"id":"39-15","type":"옳지 않은 것","q":"영재학교의 융합교육에서 예로 든 융합교과에 해당하지 않는 것은?","box":null,"choices":["융합과학","과학의 역사와 철학","사회문제와 인문학적 상상력","바이오화학융합수학","인공지능 윤리와 법"],"answer":5,"explain":"교안의 융합교과 예시는 융합과학, 과학의 역사와 철학, 사회문제와 인문학적 상상력, 바이오화학융합수학이다. ⑤는 제시되지 않았다. 다수 영재학교에서는 융합교과를 필수와 선택과목으로 개설·운영한다.","source":{"page":17,"section":"영재학교의 융합교육","quote":"융합과학, 과학의 역사와철학, 사회문제와 인문학적상상력, 바이오화학융합수학등융합교과를통해"}},{"id":"39-16","type":"옳은 것","q":"영재학교 융합교육의 결과와 한계에 대한 설명으로 옳은 것은?","box":null,"choices":["융합교육의 결과 교과의 이해가 오히려 모호해졌다.","영재학교에는 인문학, 예술, 수·과학 재능을 지닌 다양한 학생이 고르게 모여 있어 융합에 유리하다.","융합교육은 소통과 협업 역량에는 영향을 주지 못했다.","영재학교는 모두 과학을 잘하는 특정 학생들만 모여 있어서 인문학, 예술, 수·과학적 재능을 바탕으로 한 융합을 하기에는 한계가 있다.","영재학교는 융합교과를 선택과목으로만 개설한다."],"answer":4,"explain":"④가 옳다. ① 교과의 이해가 명확해지고 융합 마인드를 갖게 됨, ② 과학을 잘하는 특정 학생들만 모여 있어 한계, ③ 새로운 관점으로 생각하고 소통·협업하는 역량이 높아짐, ⑤ 필수와 선택과목으로 개설·운영한다.","source":{"page":18,"section":"영재학교의 융합교육","quote":"다만영재학교는모두과학을잘하는특정학생들만모여있어서학생들의인문학, 예술 , 수 · 과학적 재능을바탕으로한융합을 하기에는한계가있음"}},{"id":"39-17","type":"옳지 않은 것","q":"한국과학영재학교의 창의융합교육에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["교육목표는 “인류 사회에 공헌할 창의적 글로벌 리더 육성”이다.","5차 교육과정 편제를 통해 수학·과학 심화교육을 한다.","융합교육의 내실화를 위해 신규 융합과목(12학점)을 개설하여 운영한다.","교직원들은 창의융합교육 교원연수와 수업컨설팅을 통해 전문성을 신장한다.","교직원들은 KAIST에서 영재교육에 관한 연수를 이수한다."],"answer":3,"explain":"③ 신규 융합과목은 8학점이다. 나머지는 교안과 일치한다.","source":{"page":19,"section":"한국과학영재학교","quote":"융합교육의내실화를위해신규융합과목(8 학점 ) 을개설하여 운영"}},{"id":"39-18","type":"개념 찾기","q":"다음 설명에 해당하는 학교는?","box":"• 교육목표: “세계에 공헌할 창의적 융합인재 육성”\n• 학교 3대 운영 방침으로 ‘융합인재 육성을 위한 교육과정 운영’을 선정\n• 교육영역을 일반교과, 전문교과, 융합교과로 구분","choices":["한국과학영재학교","대구과학고등학교","인천과학예술영재학교","서울과학고등학교","민족사관고등학교"],"answer":4,"explain":"제시된 교육목표와 운영 방침, 교육영역 구분은 서울과학고등학교의 사례이다. 한국과학영재학교의 교육목표는 '인류 사회에 공헌할 창의적 글로벌 리더 육성'이다.","source":{"page":20,"section":"서울과학고등학교","quote":"교육목표: “세계에 공헌할창의적융합인재육성”학교3 대운영 방침‘융합인재육성을위한교육과정운영’을선정"}},{"id":"39-19","type":"옳지 않은 것","q":"서울과학고등학교의 창의융합교육에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["12개 노력 중점 중에 “창의적 융합인재 육성을 위한 교육활동 내실화”를 선정하였다.","“융합적, 창의적 사고력을 기르는 독서·토론 교육”을 노력 중점으로 선정하였다.","융합교육을 위해 융합과목 탐구, 수리 정보 탐구, 창의융합 특강, 창의융합 대상 대회 등을 운영한다.","“교원의 영재교육 전문성 신장을 위한 연수 강화”를 노력 중점으로 선정하였다.","교원의 영재교육 전문성 신장을 위한 직무연수(60시간)를 운영한다."],"answer":5,"explain":"⑤ 직무연수는 30시간이다. 나머지는 교안과 일치한다.","source":{"page":21,"section":"서울과학고등학교","quote":"교원의영재교육전문성신장을위한직무연수(30시간) 및연구 활동프로그램"}},{"id":"39-20","type":"사례","q":"다음 운영 특징을 가진 인천대학교 과학영재교육원의 과정은?","box":"• 생활환경 속 친근한 주제로 연구 활동과 세부 내용 구성\n• 소그룹 중심의 장기 프로젝트를 통한 협동심 증진, 친밀한 교우관계\n• 과학자로서의 자질 함양","choices":["초등심화과정","초등사사프로젝트과정","중등심화과정","초등기초과정","중등사사과정"],"answer":2,"explain":"제시된 특징은 초등사사프로젝트과정이다(연구 과제 수행을 통한 실천적 문제해결능력 증진 포함). 초등심화과정은 창의적·논리적 사고능력 신장, 통합·융합된 주제의 수업 구성, 소집단별 토론과 탐구활동 중심, 분야별 응용력과 확산적·종합적 사고능력 배양이 특징이다.","source":{"page":23,"section":"초등사사프로젝트과정 인천대학교 과학영재교육원","quote":"생활환경 속친근한 주제로연구활동과세부내용구성‣ 연구 과제수행을통한실천적문제해결능력증진‣ 소그룹 중심의장기프로젝트를통한협동심증진, 친밀한 교우관계‣ 과학자로서의 자질함양"}},{"id":"39-21","type":"옳은 것","q":"인천대학교 과학영재교육원 초등심화과정에 대한 설명으로 옳은 것은?","box":null,"choices":["강의식 설명 중심의 수업 방식을 취한다.","단일 교과 중심의 주제로 수업을 구성한다.","개인별 장기 연구 프로젝트를 필수로 수행한다.","수렴적 사고능력 배양에만 초점을 둔다.","소집단별 토론과 탐구활동에 중심을 둔 수업 방식을 취한다."],"answer":5,"explain":"⑤가 옳다. ① 소집단별 토론·탐구 중심이지 강의식이 아님, ② 통합, 융합된 주제의 수업 구성, ③ 장기 프로젝트(소그룹 중심)는 초등사사프로젝트과정의 특징, ④ 분야별 응용력과 확산적, 종합적 사고능력을 배양한다.","source":{"page":22,"section":"초등심화과정 인천대학교 과학영재교육원","quote":"‣ 창의적 , 논리적 사고능력을신장하기위한교육운영‣ 통합 , 융합된 주제의수업구성‣ 소집단별 토론과탐구활동에중심을둔수업방식 ‣ 분야별 응용력과확산적, 종합적 사고능력배양"}}]},{"lesson":40,"title":"세계적인 슈퍼리치들에게 영재교육의 길을 묻다","file":"4. 교안 (31~60)[1] (1)/40.pdf","summary":["미국 경제 유력지 Forbes: 세계에서 가장 돈을 많이 벌고 있는 사람들의 순위 발표, 재산의 규모와 다양한 업계에서의 활동이 기준 / 억만장자 순위 2023. 12 기준","10대 슈퍼리치 대부분은 지금까지 없었던 혁신적 테크기업의 창업자나 CEO(일론 머스크, 제프 베이조스, 빌 게이츠, 래리 페이지, 세르게이 브린) / 버나드 아르노, 워런 버핏 등은 부동산·석유·금융·명품 등","슈퍼리치 분석 이유: 공통점·특징 분석 → 교육적 시사점, 미래사회 변화·발전 방향 예측, 영재학생에게 필요한 영재교육 방향","공통점: 시대를 앞서가는 비전과 도전, 혁신적 사업 창업, 과제집착력, 기술에 대한 높은 이해도·지식·추진력, 독서력과 멘토-멘티 관계","일론 머스크(1971년생): 17살까지 남아프리카공화국, 12세 프로그램 제작, 대학 물리학 전공, 1990년대 중반 인터넷상 전화번호부, 엑스탓컴→이베이 paypal, 2004년 TESLA·space-X","제프 베조스(1964년생): 아버지 부동산 사업·어머니 교사, 고교 과학 경시대회 우승, 로켓 취미, 프린스턴대 컴퓨터공학·전기공학 / 1994년 인터넷 상품거래 1년 사이 2천 배 이상 기사 → 차고에서 아마존 창업","빌 게이츠(1955년생): 아버지 변호사·어머니 교사, 8살 프로그래밍, 13살 고등학교 수학 교과서 섭렵, 하버드 휴학 창업 시 심리적 지원, 노블레스 오블리주, 세계 부자 2위","마윈(1964년생): 세계 부자 20위, 알리바바 창시자, 독학 영어, 1999년 알리바바 창립, 손정희 회장 6분 만에 투자, 2천만 달러 → 578억 달러(3,000배)","시련과 실패: 월트 디즈니(세계 최대 애니메이션 엔터테인먼트 제작사), 스티브 잡스(추방 후 애플 창립), 마윈(30대 초반까지 아르바이트마저 성공한 적 없음)","영재교육의 미래: 3차 산업혁명 인터넷 성공을 4차 산업혁명으로 확대재생산, 대부분 1990년대 창업, 인문학적 소양 + 첨단 디지털 융합","교육 방향: 창의융합교육, 도전정신과 모험, 과제집착력, 프로젝트 수업, 다방면의 독서와 경험 축적"],"questions":[{"id":"40-01","type":"옳은 것","q":"미국 경제 유력지 Forbes가 발표하는 슈퍼리치 순위의 기준으로 교안에 제시된 것은?","box":null,"choices":["학력과 지능지수","기부 금액과 사회공헌 활동","재산의 규모와 다양한 업계에서의 활동","보유 특허 수와 기술력","기업의 직원 수와 매출액"],"answer":3,"explain":"Forbes는 세계에서 가장 돈을 많이 벌고 있는 사람들의 순위를 발표하며, 재산의 규모와 다양한 업계에서의 활동이 기준이다. 나머지는 교안에 없는 기준이다.","source":{"page":3,"section":"미국 경제 유력지 Forbes가 발표하는 슈퍼리치는?","quote":"미국경제유력지Forbes는세계에서 가장돈을많이벌고있는사람들의순위를발표함재산의규모와다양한업계에서의활동이기준"}},{"id":"40-02","type":"옳지 않은 것","q":"교안의 10대 슈퍼리치(억만장자 순위, 2023. 12 기준)의 이름과 기업의 연결로 옳지 않은 것은?","box":null,"choices":["일론 머스크 – 테슬라, 스페이스 X","래리 엘리슨 – 아마존","버나드 아르노 – 루이비통 모에헤네시","워런 버핏 – 버크셔해서웨이","스티브 발머 – 마이크로소프트"],"answer":2,"explain":"② 래리 엘리슨은 오라클이다. 아마존은 제프 베이조스이다. 그 밖에 빌 게이츠–마이크로소프트, 래리 페이지와 세르게이 브린–구글의 공동창업자 등이 제시되어 있다.","source":{"page":4,"section":"10대 슈퍼리치","quote":"제프베이조스• 아마존 래리엘리슨• 오라클 / 버나드아르노• 루이비통 모에헤네시"}},{"id":"40-03","type":"옳은 것","q":"10대 슈퍼리치의 특징에 대한 설명으로 옳은 것은?","box":null,"choices":["대부분 부동산과 석유 사업으로 부를 축적하였다.","대부분 지금까지 없었던 혁신적 테크기업의 창업자나 CEO이다.","모두 기존 대기업을 물려받아 성장시켰다.","버나드 아르노와 워런 버핏은 기술기업을 창업하여 big Tech 회사로 성장시켰다.","래리 페이지와 세르게이 브린은 명품 브랜드 사업으로 성공하였다."],"answer":2,"explain":"②가 옳다. 일론 머스크, 제프 베이조스, 빌 게이츠, 래리 페이지, 세르게이 브린 등은 모두 기술기업을 창업하여 big Tech 회사로 성장시켰다. ④ 버나드 아르노, 워런 버핏 등은 부동산, 석유, 금융, 명품 브랜드 등 다양한 분야에서 사업을 성공시킨 경우이다.","source":{"page":5,"section":"10대 슈퍼리치","quote":"대부분지금까지없었던혁신적테크기업의창업자나CEO"}},{"id":"40-04","type":"옳지 않은 것","q":"교안에서 세계적인 슈퍼리치들을 분석하는 이유로 제시하지 않은 것은?","box":null,"choices":["슈퍼리치들의 공통점 및 특징을 분석하여 교육적 시사점을 찾기 위해","미래사회의 변화와 발전 방향을 예측하기 위해","영재학생들에게 필요한 영재교육 방향을 찾기 위해","영재학생들의 투자 및 재테크 교육 방법을 마련하기 위해","세계경제를 주도하고 있는 인물들의 특징을 살펴보기 위해"],"answer":4,"explain":"교안은 세계경제를 주도하는 슈퍼리치들의 공통점과 특징을 분석해 교육적 시사점을 찾고, 미래사회의 변화와 발전 방향을 예측하며, 영재학생들에게 필요한 영재교육 방향을 찾는다고 했다. ④는 교안에 없다.","source":{"page":6,"section":"왜 슈퍼리치들을 분석하는가?","quote":"세계경제를주도하고있는슈퍼리치들의공통점및특징을분석해보고, 교육적 시사점을찾아봄미래사회의변화와발전방향을예측가능"}},{"id":"40-05","type":"보기 조합","q":"슈퍼리치들의 공통점으로 \u003c보기\u003e에서 옳은 것을 모두 고른 것은?","box":"ㄱ. 시대를 앞서가는 비전을 가지고 이를 현실로 만들기 위해 도전하는 것을 두려워하지 않음\nㄴ. 창업에 많은 실패가 있어도 시장의 흐름을 읽어 도전하고 노력으로 결국 극복해 나가는 과제집착력\nㄷ. 검증된 기존 방식을 고수하여 위험을 최소화함\nㄹ. 새로운 다방면의 지식 탐구를 위한 독서력과 주변에 멘토-멘티 관계가 많음","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"answer":5,"explain":"ㄱ, ㄴ, ㄹ은 교안 내용이다. ㄷ 교안은 오히려 '기존의 방식에 얽매이지 않고 지금까지 없었던 혁신적인 사업을 창업하는 데 주저하지 않음'이라고 했다. 또한 기술에 대한 높은 이해도와 지식 및 추진력이 성공의 비결이다.","source":{"page":7,"section":"슈퍼리치들의 공통점","quote":"기존의방식에얽매이지않고지금까지없었던혁신적인사업을창업하는데주저하지 않음창업에많은실패가있어도시장의흐름을읽어도전하고노력으로결국극복해나가는과제집착력"}},{"id":"40-06","type":"옳지 않은 것","q":"일론 머스크의 유년 및 학교생활에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["17살 때까지 남아프리카공화국에 거주하였다.","독서를 좋아하고 궁금한 것이 많아서 선생님조차 귀찮아했다.","급우들로부터 따돌림을 당하며 외톨이 생활을 하였다.","8세 때 컴퓨터 프로그램을 만들기 시작하였다.","대학에서 물리학을 전공하였다."],"answer":4,"explain":"④ 일론 머스크는 12세 때 컴퓨터 프로그램을 만들기 시작하였다. 8살에 컴퓨터 프로그래밍을 배우기 시작한 사람은 빌 게이츠이다.","source":{"page":8,"section":"일론 머스크(1971년생)","quote":"12 세때컴퓨터 프로그램을만들기시작‣ 대학에서 물리학전공"}},{"id":"40-07","type":"사례","q":"다음 사례에 해당하는 슈퍼리치는?","box":"급우들로부터 따돌림을 당하며 외톨이 생활을 했고, 책에서 위로를 얻으며 힘겨운 학창생활을 견뎌 나갔다. 초등학교에 들어가자마자 컴퓨터 관련 책을 두루 섭렵하였다.","choices":["일론 머스크","제프 베조스","빌 게이츠","마윈","워런 버핏"],"answer":1,"explain":"제시문은 일론 머스크(1971년생)의 유년 및 학교생활이다. 제프 베조스는 고등학교 때 과학 경시대회 우승, 빌 게이츠는 8살 때 프로그래밍 시작, 마윈은 독학으로 영어에 능숙했다.","source":{"page":8,"section":"일론 머스크(1971년생)","quote":"급우들로부터 따돌림을당하며외톨이생활을함‣ 책에서 위로를얻으며힘겨운학창생활을견뎌나갔다고함‣ 초등학교에 들어가자마자컴퓨터관련책을두루섭렵"}},{"id":"40-08","type":"옳은 것","q":"일론 머스크의 성공 신화에 대한 설명으로 옳은 것은?","box":null,"choices":["1980년대 중반 뉴욕에서 온라인 서점 사업을 시작하였다.","1999년 TESLA와 space-X를 시작하였다.","1990년대 중반 실리콘밸리에서 인터넷상 전화번호부 서비스 사업을 시작하였다.","온라인 결제 서비스 사업은 아마존에 매각되었다.","교안에서 세계 2위의 슈퍼리치로 소개되었다."],"answer":3,"explain":"③이 옳다. ① 온라인 서점은 제프 베조스의 아마존, ② TESLA·space-X는 2004년, ④ 온라인 결제 서비스 사업은 엑스탓컴 → 이베이 paypal, ⑤ 세계 1위의 슈퍼리치로 소개되었다.","source":{"page":9,"section":"일론 머스크(1971년생)","quote":"1990 년대중반실리콘밸리에서 인터넷상전화번호부서비스사업을시작‣ 온라인 결제서비스사업(엑스탓컴 →이베이 paypal)‣ 2004 년TESLA, space - X ‣ 세계 1 위의 슈퍼리치"}},{"id":"40-09","type":"개념 찾기","q":"다음 설명에 해당하는 슈퍼리치는?","box":"• 아버지는 부동산 사업, 어머니는 교사\n• 고등학교 때 과학 경시대회에서 우승\n• 로켓을 만드는 취미가 우주개발에 관심 갖는 계기가 됨\n• 프린스턴 대학교에서 컴퓨터공학과 전기공학을 전공","choices":["빌 게이츠","일론 머스크","마윈","제프 베조스","래리 페이지"],"answer":4,"explain":"제시문은 제프 베조스(1964년생)이다. 빌 게이츠는 아버지가 변호사, 어머니가 교사였고, 일론 머스크는 대학에서 물리학을 전공했다.","source":{"page":10,"section":"제프 베조스(1964년생)","quote":"아버지는 부동산사업, 어머니는 교사로어린시절부터책을좋아하고과학과기술에관심이많았음‣ 고등학교 때과학 경시대회에서우승을차지함"}},{"id":"40-10","type":"빈칸","q":"제프 베조스의 성공 신화이다. (   )에 들어갈 말로 알맞은 것은?","box":"월스트리트 해지펀드 부사장으로 근무 중, 우연히 1994년 인터넷 상품거래가 1년 사이 (   ) 이상 커졌다는 신문기사를 보고 난 후 퇴사를 하고 차고(garage)에서 on-line 서점 아마존 창업","choices":["2백 배","2천 배","3천 배","1만 배","20배"],"answer":2,"explain":"교안은 1994년 인터넷 상품거래가 1년 사이 2천 배 이상 커졌다는 기사를 제시한다. ③ 3,000배는 알리바바의 성장(2천만 달러 → 578억 달러)과 관련된 수치이다.","source":{"page":11,"section":"제프 베조스(1964년생)","quote":"우연히 1994년인터넷 상품거래가1 년사이 2 천 배이상 커졌다는신문기사를보고난후퇴사를 하고차고(garage) 에서on- line 서점아마존창업"}},{"id":"40-11","type":"옳지 않은 것","q":"제프 베조스와 아마존의 성공에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["아마존은 종합 인터넷 쇼핑몰로 성장하였다.","3차 산업혁명의 인터넷의 성공을 4차 산업혁명에도 확대 재생산하였다.","인공지능이 소비자 구매 빅데이터를 분석하여 개별화 맞춤형 서비스를 제공한다.","소비자가 필요로 하는 물건을 가까운 물류창고에 보관하여 최단 시간 배달한다.","물류비용을 줄이기 위해 배송 속도보다 대량 일괄 배송을 우선하였다."],"answer":5,"explain":"⑤ 교안은 최단 시간 배달 물류시스템으로 비용 절감과 소비자 만족 최대화를 이루었다고 했다. 나머지는 교안 내용이다(인공지능, 빅데이터, 클라우드 컴퓨터 등으로 성공).","source":{"page":11,"section":"제프 베조스(1964년생)","quote":"인공지능이 소비자구매빅데이터를분석‣ 개별화 맞춤형서비스를제공‣ 소비자가 필요로하는시간과물건을가까운물류창고에보관‣ 최단 시간배달물류시스템으로비용절감과소비자만족최대화"}},{"id":"40-12","type":"옳은 것","q":"빌 게이츠의 유년 및 학교생활에 대한 설명으로 옳은 것은?","box":null,"choices":["8살 때에는 컴퓨터 프로그래밍을 배우기 시작하였다.","아버지는 부동산 사업가, 어머니는 교사였다.","12세 때 컴퓨터 프로그램을 만들기 시작하였다.","17살 때까지 남아프리카공화국에 거주하였다.","1964년생이다."],"answer":1,"explain":"①이 옳다. ② 아버지는 변호사(부동산 사업은 제프 베조스의 아버지), ③ 12세 프로그램 제작·④ 남아공 거주는 일론 머스크, ⑤ 빌 게이츠는 1955년생이다. 빌 게이츠는 13살 때 고등학교 수학 교과서를 모두 섭렵하였다.","source":{"page":12,"section":"빌 게이츠(1955년생)","quote":"아버지는 변호사, 어머니는 교사로어릴때부터수학과과학에뛰어난재능을보였음‣ 8 살때에는 컴퓨터프로그래밍을배우기시작‣ 13 살때에는 고등학교수학교과서를모두섭렵"}},{"id":"40-13","type":"사례","q":"다음 사례에 해당하는 슈퍼리치는?","box":"하버드대학교를 휴학하고 창업할 때도 물리적 지원보다, 창업에 대한 꿈과 의지 및 준비와 계획에 관한 질문을 주고받으며 심리적 지원을 받았다. 기부와 교육봉사로 ‘노블레스 오블리주’를 실천하고 있다.","choices":["제프 베조스","일론 머스크","빌 게이츠","마윈","스티브 잡스"],"answer":3,"explain":"제시문은 빌 게이츠의 성공 신화이다. 교안은 그를 '노블레스 오블리주'를 실천하는 세계 부자 2위로 소개한다.","source":{"page":13,"section":"빌 게이츠(1955년생)","quote":"하버드대학교를 휴학하고창업할때도물리적으로지원보다, 창업에대한꿈과의지및준비와 계획에관한질문을주고받으며심리적지원을받음‣ 기부와 교육봉사로‘노블레스 오블리주’를실천하는세계부자2 위"}},{"id":"40-14","type":"옳지 않은 것","q":"마윈의 유년 및 학교생활에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["1964년생이다.","알리바바 그룹의 창시자이다.","중국 거대 시장에서 인터넷 발달 과정을 압축 성장시킨 장본인이다.","미국 유학을 통해 영어를 익혔다.","만나는 외국인마다 말을 걸 정도였다."],"answer":4,"explain":"④ 마윈은 고등학교를 다닐 때부터 독학을 한 덕에 영어가 능숙했다. 교안은 마윈을 세계 부자 20위로 등장한 알리바바 그룹의 창시자로 소개한다.","source":{"page":14,"section":"마윈(1964년생)","quote":"고등학교를 다닐때부터독학을한덕에 영어가능숙했음‣ 만나는 외국인마다말을걸정도였음"}},{"id":"40-15","type":"빈칸","q":"마윈의 성공 신화이다. (   )에 들어갈 말로 알맞은 것은?","box":"소프트뱅크 손정희 회장을 만난 지 (   ) 만에 투자할 정도로 창업 열망이 대단함","choices":["6분","10분","30분","1시간","6일"],"answer":1,"explain":"교안은 손정희 회장이 만난 지 6분 만에 투자했다고 한다. 마윈은 20대에 실패를 거듭한 뒤 1999년 알리바바를 창립했고, 2천만 달러의 투자금을 받은 알리바바는 상장되면서 578억 달러가 되어 3,000배의 성장을 이루었다.","source":{"page":15,"section":"마윈(1964년생)","quote":"소프트뱅크 손정희회장을만난지6 분만에 투자할정도로창업열망이대단함‣ 2 천만 달러의투자금을받은알리바바가상장되면서578억달러가되어3,000배의성장을이룸"}},{"id":"40-16","type":"옳은 것","q":"마윈과 알리바바에 대한 설명으로 옳은 것은?","box":null,"choices":["마윈은 1994년 알리바바를 창립하였다.","알리바바는 2억 달러의 투자금을 받았다.","마윈은 과거의 실패는 아무런 도움이 되지 않았다고 했다.","마윈은 20대에 창업에 성공한 뒤 실패를 겪지 않았다.","알리바바는 상장되면서 578억 달러가 되어 3,000배의 성장을 이루었다."],"answer":5,"explain":"⑤가 옳다. ① 1999년, ② 2천만 달러, ③ 오히려 과거의 실패를 통해 배웠다고 함, ④ 20대에 실패를 거듭하였다.","source":{"page":15,"section":"마윈(1964년생)","quote":"20 대에 실패를거듭한마윈은1999년알리바바를 창립‣ 오히려 과거의실패를통해배웠다고함"}},{"id":"40-17","type":"옳은 것","q":"'시련과 실패가 사람을 더 강하게 만든다'에서 제시된 인물과 내용의 연결로 옳은 것은?","box":null,"choices":["월트 디즈니 – 추방된 후 애플을 창립","스티브 잡스 – 실패한 회사를 거쳐 세계 최대의 애니메이션 엔터테인먼트 제작사 창립","마윈 – 30대 초반까지 아르바이트마저 성공한 적 없음에도 알리바바 창업","빌 게이츠 – 하버드대학교에서 퇴학당한 후 마이크로소프트 창업","일론 머스크 – 추방된 후 테슬라 창립"],"answer":3,"explain":"③이 옳다. ① 추방된 후 애플을 창립한 것은 스티브 잡스, ② 애니메이션 엔터테인먼트 제작사 창립은 월트 디즈니, ④⑤는 이 쪽에 제시되지 않은 내용이다(빌 게이츠는 하버드 '휴학').","source":{"page":16,"section":"시련과 실패가 사람을 더 강하게 만든다","quote":"추방된 후애플을 창립하여혁신적인기술제품으로스마트세상을만듦마윈 / ‣ 30 대초반까지 아르바이트마저성공한적없음에도 , 알리바바창업"}},{"id":"40-18","type":"옳지 않은 것","q":"'미래사회를 선도할 영재를 위한 교육을 어떻게 할 것인가?'에서 분석한 슈퍼리치들의 특징으로 옳지 않은 것은?","box":null,"choices":["3차 산업혁명의 인터넷의 성공을 4차 산업혁명으로 확대 재생산하였다.","인공지능, 빅데이터 등을 활용하여 사람과 사물, 사물과 사물의 창의융합으로 새로운 기업가치를 만들었다.","대부분 2010년대에 창업하였다.","창업 전에 철저한 준비와 실패를 통해 끝까지 해결해내는 과제집착력이 뛰어났다.","창업의 열망이 뛰어났다."],"answer":3,"explain":"③ 교안은 대부분 1990년대에 창업하였다고 했다. 나머지는 교안 내용이다.","source":{"page":18,"section":"미래사회를 선도할 영재를 위한 교육을 어떻게 할 것인가?","quote":"대부분1990년대에창업하였고, 창업 전에철저한준비와실패를통해끝까지해결해내는과제집착력과창업의열망이뛰어남"}},{"id":"40-19","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"젊은 시절 남들이 다 이루어 놓은 기존 분야에서 안정된 만족을 누리는 것이 아닌, 오히려 누구도 생각하지 못했던 전혀 새로운 분야를 창의융합력으로 개척함. (   )을 바탕으로 첨단 디지털과 융합하여 세계의 부자로 등장한 것","choices":["수학적 재능","과학적 탐구력","경영학 지식","인문학적 소양","막대한 자본"],"answer":4,"explain":"교안은 슈퍼리치들이 '인문학적 소양'을 바탕으로 첨단 디지털과 융합하여 세계의 부자로 등장했다고 분석한다.","source":{"page":19,"section":"미래사회를 선도할 영재를 위한 교육을 어떻게 할 것인가?","quote":"인문학적소양을바탕으로첨단디지털과융합하여세계의부자로등장한것"}},{"id":"40-20","type":"옳지 않은 것","q":"슈퍼리치 분석을 통해 교안이 제시한, 미래를 살아갈 영재학생들에게 필요한 교육 방향이 아닌 것은?","box":null,"choices":["창의융합교육","도전정신과 모험","과제집착력","프로젝트 수업","선행학습 중심의 입시 교육"],"answer":5,"explain":"교안은 창의융합교육, 도전정신과 모험, 과제집착력, 프로젝트 수업, 다방면의 독서와 경험 축적 등을 제시한다. ⑤는 없다. 교안은 '새로운 시대를 이끌어갈 다음 세대에게 무궁한 기회와 적합한 교육을 제공하는 것'이 우리의 역할이라고 한다.","source":{"page":20,"section":"미래사회를 선도할 영재를 위한 교육을 어떻게 할 것인가?","quote":"창의융합교육, 도전정신과 모험, 과제집착력 , 프로젝트수업, 다방면의 독서와경험축적등"}}]},{"lesson":41,"title":"영재교육에서 속진학습이란?","file":"4. 교안 (31~60)[1] (1)/41.pdf","summary":["영재교육에서 자주 듣는 개념: 속진(acceleration), 심화(enrichment), 집단화(grouping) → 동일 연령 학생들 간 개인적 차이 문제 해결","속진: 또래보다 조기에 상위 교과과정 배치 / 상급 학생 교과 내용을 어린 영재학생에게 허용 / 학습내용·수준은 정규교육과정과 같으나 학습 속도를 매우 빠르게","심화: 좀 더 풍부하고 다양한 교육적 경험에 노출 / 표준 학년 수준을 넘어서는 다른 교수전략 / 일반학급보다 더 넓고 깊게","속진학습의 필요: 영재의 미성취 방지(미성취영재는 학습기술·조직기술 발전에 어려움, 잠재된 영재성 최대 발현 못함)","속진이 필요한 영재 특성: 높은 인지능력, 우수한 학업성취, 도전적 수업 열망, 속진에 대한 긍정적 반응, 특별한 상징체계 지식, 높은 흥미와 관심, 낮은 불안","속진 혜택: 학업적 성취도 향상, 흥미와 동기부여 증진, 지적 성장과 발달, 자기주도적 학습능력 향상, 학교생활에서 지루함을 덜 느낌","오해: 사회적·정서적 문제 발생, 번-아웃 → 로저스: 314개 연구 메타분석, 부정적 영향 없음 / 콜란젤로: 거부감은 개인적 선호·평등에 대한 정치적 편견, IQ 140 이상 상위 영재에게 필요","부작용: 사회성 발달 저해, 심리적 부담(스트레스·불안·우울) → 교사·학부모·영재학생이 신중하게 결정","교사의 역할: 형식적 측정과 비형식적 관찰, 교실 내외 새로운 도전, 학부모에게 속진 옵션 설명, 단기간 속진 성패 판단 보류 / 부모의 역할: 교사와 원만한 의사소통, 적응기간 추가적 지원과 격려 준비, 성패 판단 보류","우리나라: 영재학생뿐 아니라 일반학생에게도 속진 교육과정 제도적 시행(조기입학, 조기졸업)","과학고(20교, 공립) 조기졸업 제도 개선: 공동 연구(2023) → 공동방안 마련 → 해당 신입생부터 적용(2025~), 2027년까지 학습·기숙공간 준비 / 과학고를 '자율학교'로 지정(제5차 영재교육진흥종합계획)"],"questions":[{"id":"41-01","type":"빈칸","q":"영재교육에서 자주 듣는 개념에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"속진(acceleration), 심화(enrichment), (   )의 교육방식은 동일 연령의 학생들 간에 존재하는 개인적 차이의 문제를 해결하기 위해 필요함","choices":["개별화(individualization)","집단화(grouping)","차별화(differentiation)","압축(compacting)","멘토링(mentoring)"],"answer":2,"explain":"교안은 속진, 심화, 집단화(grouping)를 영재교육에서 자주 듣는 개념으로 제시한다. 이 교육방식들은 동일 연령 학생들 간의 개인적 차이 문제를 해결하기 위해 필요하다.","source":{"page":3,"section":"영재교육에서 자주 듣는 개념","quote":"속진(acceleration), 심화(enrichment), 집단화(grouping)속진, 심화 , 집단화의 교육방식은동일연령의학생들간에존재하는개인적차이의문제를해결하기위해필요함"}},{"id":"41-02","type":"사례","q":"다음 사례에 대해 교안의 설명으로 가장 적절한 것은?","box":"수학 과목의 속진을 위해 시간제 혹은 전일제 영재학급에서 공부하는 어떤 학생이 과학이나 예술 교과의 심화수업에도 참여하고 있다.","choices":["속진과 심화는 동시에 적용할 수 없으므로 잘못된 사례이다.","한 학생에게 속진, 심화 등의 교육방식이 함께 적용될 수 있음을 보여 주는 예이다.","집단화만 적용된 사례이다.","속진을 받은 학생은 다른 교과의 심화수업에 참여할 수 없다.","심화는 예술 교과에만 적용되는 방식임을 보여 준다."],"answer":2,"explain":"교안은 예를 들어 수학 과목의 속진을 위해 영재학급에서 공부하는 학생이 과학이나 예술 교과의 심화수업에도 참여할 수 있다고 제시한다. ①④는 반대 서술, ③⑤는 교안에 없는 해석이다.","source":{"page":3,"section":"영재교육에서 자주 듣는 개념","quote":"예를 들어, 수학 과목의속진을위해시간제혹은전일제영재학급에서공부하는어떤학생은과학이나예술교과의심화수업에도참여할수있음"}},{"id":"41-03","type":"보기 조합","q":"\u003c보기\u003e에서 '속진'에 해당하는 설명을 모두 고른 것은?","box":"ㄱ. 동일 연령의 또래보다 조기에 상위 교과과정 배치하는 것\nㄴ. 영재학생들을 좀 더 풍부하고 다양한 교육적 경험에 노출시키는 것\nㄷ. 상급 학생들에게 배정된 교과 내용을 나이 어린 영재학생들에게도 허용하는 것\nㄹ. 일반학급보다 더 넓고 깊게 가르치는 것\nㅁ. 학습내용과 수준에 있어서는 정규교육과정과 같으나 학습 속도에 있어서 매우 빠르게 나아갈 수 있도록 교육적 제도나 장치를 마련해 주는 것","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㅁ","ㄴ, ㄹ, ㅁ","ㄷ, ㄹ, ㅁ","ㄱ, ㄹ, ㅁ"],"answer":2,"explain":"속진 = ㄱ, ㄷ, ㅁ. ㄴ과 ㄹ은 심화(enrichment)의 설명이다. 심화에는 '표준 학년 수준의 활동을 넘어서는 다른 교수전략'도 포함된다.","source":{"page":4,"section":"속진(acceleration)과 심화(enrichment)이란?","quote":"• 동일 연령의또래보다조기에상위교과과정배치하는것 ... • 상급 학생들에게배정된교과내용을나이어린영재학생들에게도 허용하는것"}},{"id":"41-04","type":"옳지 않은 것","q":"속진과 심화에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["심화는 표준 학년 수준의 활동을 넘어서는 다른 교수전략이다.","심화는 일반학급보다 더 넓고 깊게 가르치는 것이다.","속진은 동일 연령의 또래보다 조기에 상위 교과과정에 배치하는 것이다.","속진은 정규교육과정보다 학습내용과 수준을 높여 더 깊이 가르치는 것이다.","속진과 심화 모두 창의적인 사고 및 고차원적 사고 기술을 발달시키는 데 도움이 된다."],"answer":4,"explain":"④ 속진은 학습내용과 수준에 있어서는 정규교육과정과 같으나 학습 속도에 있어서 매우 빠르게 나아갈 수 있도록 하는 것이다. 더 넓고 깊게 가르치는 것은 심화이다. 속진과 심화 모두 영재학생들의 교육적 욕구와 능력을 수용한다.","source":{"page":4,"section":"속진(acceleration)과 심화(enrichment)이란?","quote":"속진과심화모두영재학생들의교육적욕구와능력을수용하고,창의적인사고및고차원적 사고기술을발달시키는데도움이 됨"}},{"id":"41-05","type":"빈칸","q":"속진학습이 필요한 이유에 대한 설명이다. (   )에 공통으로 들어갈 말로 알맞은 것은?","box":"영재의 (   )을/를 방지할 수 있음\n(   ) 영재들은 학습기술이나 조직기술을 발전시키는 데 어려움을 느끼고, 자신의 잠재된 영재성을 최대로 발현하지 못함","choices":["번아웃","사회적 고립","미성취","과잉행동","완벽주의"],"answer":3,"explain":"교안은 속진학습이 영재의 미성취를 방지할 수 있다고 하며, 미성취 영재들은 학습기술이나 조직기술 발전에 어려움을 느끼고 잠재된 영재성을 최대로 발현하지 못한다고 설명한다.","source":{"page":5,"section":"속진학습은 왜 필요한가?","quote":"영재의미성취를방지할수있음 미성취영재들은학습기술이나조직기술을발전시키는데어려움을느낌자신의잠재된영재성을최대로발현하지못함"}},{"id":"41-06","type":"옳지 않은 것","q":"속진학습이 필요한 영재의 특성으로 옳지 않은 것은?","box":null,"choices":["높은 인지능력","하나 혹은 이상의 교과 영역에서 보이는 우수한 학업성취","도전적인 수업에 대한 열망","특별한 상징체계(예: 수학, 언어)에 대한 지식","높은 흥미와 관심, 높은 불안"],"answer":5,"explain":"⑤ 교안은 '높은 흥미와 관심, 낮은 불안'을 제시한다. 그 밖에 속진에 대한 긍정적인 반응(학부모, 교사, 학생), 수업을 이해하는 능력도 포함된다.","source":{"page":6,"section":"속진학습이 필요한 영재의 특성","quote":"특별한상징체계( 예 : 수학 , 언어 ) 에대한 지식높은흥미와관심, 낮은 불안"}},{"id":"41-07","type":"옳지 않은 것","q":"교안에 제시된 속진학습의 혜택이 아닌 것은?","box":null,"choices":["학업적 성취도 향상","같은 또래와의 교류 증가","흥미와 동기부여 증진","자기주도적 학습능력 향상","학교생활에서 흥미와 지루함을 덜 느낌"],"answer":2,"explain":"속진학습의 혜택은 학업적 성취도 향상, 흥미와 동기부여 증진, 지적 성장과 발달, 자기주도적 학습능력 향상, 학교생활에서 흥미와 지루함을 덜 느낌이다. ② 오히려 교안은 속진학습의 부작용으로 같은 또래와의 교류가 줄어드는 점을 든다.","source":{"page":7,"section":"속진학습의 혜택","quote":"학업적성취도향상흥미와동기부여증진지적성장과발달자기주도적학습능력향상학교생활에서흥미와지루함을덜느낌"}},{"id":"41-08","type":"옳은 것","q":"교안에 제시된 '속진학습에 대한 오해'에 해당하는 것은?","box":null,"choices":["속진을 한 학생들은 학업적 잠재력을 소진하게 된다(번-아웃).","속진은 영재의 미성취를 방지할 수 있다.","속진은 학업적 성취도를 향상시킨다.","속진과 심화는 동일 연령 학생들 간의 개인차 문제를 해결하는 데 필요하다.","속진은 자기주도적 학습능력을 향상시킨다."],"answer":1,"explain":"교안의 속진학습에 대한 오해는 ① 번-아웃, 영재학생들에게 사회적·정서적 문제를 발생시킨다, 나이 많은 학생들과 함께 있게 하여 어린 학생들에게 사회적·정서적 부적응을 유발한다는 것이다. ②~⑤는 속진학습의 필요성과 혜택이다.","source":{"page":9,"section":"속진학습에 대한 오해","quote":"속진은영재학생들에게사회적· 정서적 문제를발생시킨다?나이많은학생들과함께있게함으로써어린학생들에게사회적· 정서적 부적응을유발한다?속진을한학생들은 학업적잠재력을소진하게된다? / ( 번 - 아웃 )"}},{"id":"41-09","type":"빈칸","q":"로저스의 연구에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"속진 학생들에 대한 (   )개의 연구 결과를 메타분석한 결과, 속진을 선택하는 것은 정신적 건강, 사회적 적응, 학업적 자존감, 혹은 학업적 성취에 부정적 영향을 미치지 않는다는 결론","choices":["140","214","413","314","341"],"answer":4,"explain":"로저스는 속진 학생들에 대한 314개의 연구 결과를 메타분석하였다. ① 140은 콜란젤로가 제시한 IQ 기준이다.","source":{"page":10,"section":"로저스의 연구","quote":"속진학생들에대한314개의연구결과를메타분석한결과로저스의연구 / ‣ 속진을 선택하는것은정신적건강, 사회적 적응, 학업적 자존감, 혹은학업적성취에부정적영향을미치지않는다는결론"}},{"id":"41-10","type":"개념 찾기","q":"다음 주장을 한 학자는?","box":"속진에 대한 거부감은 교육감, 교장, 혹은 교사의 개인적 선호 혹은 평등에 대한 정치적 편견에서 비롯될 수 있다고 지적하였으며, 속진은 적어도 IQ 140 이상의 상위 영재학생들에게 필요하다고 하였다.","choices":["로저스","렌줄리","가드너","스턴버그","콜란젤로"],"answer":5,"explain":"제시문은 콜란젤로의 연구이다. ① 로저스는 314개 연구의 메타분석으로 속진이 부정적 영향을 미치지 않는다고 결론지었다. ②③④는 이 차시에 제시되지 않았다.","source":{"page":11,"section":"콜란젤로의 연구","quote":"속진에대한거부감은교육감, 교장 , 혹은 교사의개인적선호혹은평등에대한정치적편견에서비롯될수있다고 지적속진은학생들의지적수준에맞게학습하게도와주어야하고, 적어도 IQ 140 이상의상위영재학생들에게 필요"}},{"id":"41-11","type":"옳지 않은 것","q":"속진학습의 부작용에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["같은 또래와의 교류가 줄어들면서 사회적 관계 형성 및 사회성 발달이 저해될 수 있다.","학업적 부담이 커지면서 스트레스, 불안, 우울 등의 심리적 문제가 발생할 수 있다.","속진학습 실시 여부는 영재학생의 학업적 잠재력만을 기준으로 교사가 단독 결정한다.","속진학습을 실시할 때는 사회성, 심리적 건강 등 전반적인 발달을 고려해야 한다.","교사, 학부모, 영재학생이 신중하게 결정해야 한다."],"answer":3,"explain":"③ 교안은 학업적 잠재력뿐만 아니라 사회성, 심리적 건강 등 전반적인 발달을 고려하여 교사·학부모·영재학생이 신중하게 결정해야 한다고 했다.","source":{"page":12,"section":"속진학습의 부작용","quote":"속진학습을실시할때는영재학생의학업적잠재력뿐만아니라사회성, 심리적 건강등전반적인 발달을고려하여교사학부모영재학생이신중하게결정"}},{"id":"41-12","type":"옳은 것","q":"속진학습 대상 학생 선발 시 고려사항으로 옳은 것은?","box":null,"choices":["속진학습 대상 영재학생은 학업 능력만 확인하면 되고 정서적 성숙도는 검증할 필요가 없다.","같은 학교 안에 형제자매가 있을 경우 부모의 의견·지원, 교육적 경험을 고려해야 한다.","사회적 준비는 속진 이후에 자연스럽게 이루어지므로 고려하지 않는다.","학교 혹은 학업에 부정적 태도를 보이는 학생은 고려 대상에서 언급되지 않는다.","형제자매의 존재는 선발 시 고려사항이 아니다."],"answer":2,"explain":"②가 옳다. 교안은 사회적 준비를 도와야 하고, 정서적 성숙도를 검증해야 하며, 동기가 낮은 학생·사회적으로 위축되거나 고립된 학생·학교 혹은 학업에 부정적 태도를 보이는 학생은 속진을 고려해야 한다고 했다. 따라서 ①③④⑤는 틀리다.","source":{"page":13,"section":"속진학습 대상 학생 선발 시 고려사항","quote":"같은학교안에형제자매가있을경우부모의의견· 지원 , 교육적 경험을고려해야함"}},{"id":"41-13","type":"옳지 않은 것","q":"속진학습을 위한 교사의 역할로 옳지 않은 것은?","box":null,"choices":["형식적 측정(평가)과 비형식적 관찰을 통해 영재성을 확인","교실 내와 교실 외에서 새로운 도전을 제공","학부모에게 속진 옵션에 대한 설명을 제공","단기간 속진의 성패 여부를 신속히 판단하여 지속 여부를 결정","형식적 평가와 비형식적 관찰을 함께 활용"],"answer":4,"explain":"④ 교사는 단기간 속진의 성패 여부에 대한 판단을 보류해야 한다. 나머지는 교안 내용이다.","source":{"page":14,"section":"속진학습을 위한 교사의 역할","quote":"형식적측정( 평가 ) 과비형식적 관찰을통해영재성을확인교실내와교실외에서새로운도전을제공학부모에게속진옵션에대한설명을제공단기간속진의성패여부에대한판단을보류"}},{"id":"41-14","type":"개념 찾기","q":"교안에서 '속진학습을 위한 부모의 역할'로 제시된 것은?","box":null,"choices":["적응기간 동안 필요한 추가적 지원과 격려에 대해 준비","형식적 측정(평가)과 비형식적 관찰을 통해 영재성을 확인","교실 내와 교실 외에서 새로운 도전을 제공","학부모에게 속진 옵션에 대한 설명을 제공","적응기간 초기에 속진의 성패 여부를 즉시 판단"],"answer":1,"explain":"부모의 역할: 자녀의 능력 인지 및 교사와의 지속적이고 원만한 의사소통 유지, 속진이 가져올 새로운 사회적·학업적 도전 이해, 적응기간 동안 추가적 지원과 격려 준비, 적응기간 동안 속진 성패 판단 보류. ②③④는 교사의 역할, ⑤는 판단을 '보류'해야 하므로 틀리다.","source":{"page":15,"section":"속진학습을 위한 부모의 역할","quote":"자녀의능력에대해인지하고교사와의지속적이고원만한의사소통을유지속진이가져올수있는 새로운사회적, 학업적 도전에대해이해적응기간동안필요한추가적지원과격려에대해준비적응기간동안속진의성패여부에대한판단을보류"}},{"id":"41-15","type":"옳은 것","q":"우리나라 속진학습의 확대에 대한 설명으로 옳은 것은?","box":null,"choices":["속진 교육과정은 영재학생에게만 제도적으로 시행된다.","속진 교육과정은 사교육 기관에서만 운영된다.","수월성 교육 및 영재교육 진흥을 위해 영재학생뿐 아니라 일반학생에게도 속진 교육과정을 제도적으로 시행하고 있다.","조기입학은 시행하지만 조기졸업은 시행하지 않는다.","과학고에서는 조기졸업이 금지되어 있다."],"answer":3,"explain":"③이 옳다. 일반학교 및 과학고 등에서 조기입학, 조기졸업을 시행하고 있으므로 ①②④⑤는 틀리다.","source":{"page":16,"section":"속진학습의 확대","quote":"현재우리나라에서는 수월성교육및영재교육 진흥을위해영재학생뿐아니라 일반학생에게도속진교육과정을제도적으로시행하고있음일반학교및과학고 등에서조기입학, 조기졸업 시행"}},{"id":"41-16","type":"옳지 않은 것","q":"제5차 영재교육진흥종합계획의 과학고 조기졸업 제도 개선에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["과학고(20교, 공립)가 공동으로 조기졸업 제도 개선 방안을 마련·적용한다.","개선 방안은 2025년부터 적용된다.","3학년 재학생 증가에 대비해 2027년까지 단계적으로 추가적인 학습·기숙공간 및 시설·기자재를 준비한다.","조기졸업 제도 개선을 위한 공동 연구는 2030년에 수행된다.","조기이수 인정평가 시 3학년 교육과정 평가를 내실화한다."],"answer":4,"explain":"④ 공동 연구 수행은 2023년이다. 추진 절차: 공동 연구 수행(2023) → 조기졸업 제도개선 공동방안 마련(시·도 지침, 학칙 개정) → 신입생 모집공고 시 사전 안내 및 해당 신입생부터 적용(2025~).","source":{"page":17,"section":"과학고 조기졸업 제도 개선 및 교육과정 자율성 확대","quote":"추진 절차: 공동 연구수행(2023) →조기졸업 제도개선공동방안마련( 시 · 도지침 학칙개정) →신입생 모집공고시개선 방안사전안내및해당 신입생부터적용(2025~)"}},{"id":"41-17","type":"옳은 것","q":"과학고 공통 조기졸업 제도 개선 방안의 '개선 방향'으로 교안에 제시된 것은?","box":null,"choices":["조기졸업 제도의 전면 폐지","학업성취도·지능검사 결과 등 대상자 선정기준 및 규모(비율) 적정화","조기졸업 대상자 선정 시 면접만으로 선발","조기이수 인정평가에서 3학년 교육과정 평가 생략","조기졸업 대상자 비율의 무제한 확대"],"answer":2,"explain":"개선 방향은 학업성취도·지능검사 결과 등 대상자 선정기준 및 규모(비율) 적정화, 조기이수 인정평가 시 3학년 교육과정 평가 내실화 등이다. 이는 설립 목적에 따른 교육과정 운영을 위한 것이다.","source":{"page":17,"section":"과학고 조기졸업 제도 개선 및 교육과정 자율성 확대","quote":"개선 방향: 학업성취도 · 지능검사 결과등대상자 선정기준및규모 ( 비율 ) 적정화, 조기이수 인정평가시3 학년 교육과정평가내실화등"}},{"id":"41-18","type":"빈칸","q":"과학고 교육과정 자율성 제고에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"시·도별로 과학고를 ‘(   )’로 지정하여 과학인재 양성을 위한 탄력적인 교육과정 편성·운영 여건 제공","choices":["영재학교","특성화학교","자율학교","혁신학교","연구학교"],"answer":3,"explain":"교안은 시·도별로 과학고를 '자율학교'로 지정한다고 했다. 자율학교 지정 시 시·도가 공동으로 '과학고 교육과정 편성의 자율성 범위'를 마련한다(출처: 교육부, 제5차 영재교육진흥종합계획).","source":{"page":18,"section":"과학고 조기졸업 제도 개선 및 교육과정 자율성 확대","quote":"교육과정 자율성제고: 시 · 도별로 과학고를‘자율학교’ 로지정하여과학인재양성을위한탄력적인교육과정편성· 운영 여건제공"}}]},{"lesson":42,"title":"속진학습은 어떻게 진행되는가?","file":"4. 교안 (31~60)[1] (1)/42.pdf","summary":["속진학습 유형: 조기입학, 학년 월반, 과목 월반, 압축프로그램, 시험을 통한 학점부여, 고교-대학의 이중등록","조기입학 우려: 학교 적응 문제, 어린 시절 경험의 부재, 학업적 부담은 우울·반항·스트레스 유발, 일부 부모는 자녀의 준비 정도와 관계없이 조기입학시키려 함","초등학교 조기입학 기준: 지적 우수성(130 이상의 지능지수), 눈-손 협응 능력, 높은 독해력과 산수 추리력, 적절한 사회·정서적 적응력, 학교와 교사들의 우호적 자세, 가족들의 적극적인 지원","중·고등학교 조기입학: 학습내용이 구체화되고 학과가 세분화되는 상급 학년에서 공부 희망, 새로운 교우관계 형성 → 속진에 적절한 시기 / 영재학교 지원(중1~중3)","학년 월반: 상급학년으로 건너뛰는 전통적 방법, 특별한 자료나 시설 불필요·비용 측면 매우 효과적, 2~3학년 월반도 가능, 대부분 학교는 부정적으로 생각하는 경우도 많음","학년 월반 가능: 1~2년 정도 앞서고, 심하게 지루함, 나이 많은 정신적 동료와 편안함, 사회적·정서적 문제를 거의 보이지 않는 경우 / 월반된 영재: 학업동기 매우 높음, 도전감, 자존감 높아짐","과목 월반 = 부분적 속진(학년 월반은 전체적 속진), 특정 과목만 상급생과 학습, 한 분야에 특별한 능력을 가진 학생에게 적합","압축프로그램: 중학교 3년 수학·과학 → 1~2년, 고등학교 3년 → 2년 또는 1년(남은 2년 창의적 연구활동), 과학고 3년 → 2년 조기졸업","시험을 통한 학점부여: 미국 CLEP(College Level Examination Program, 30개 영역) / 우리나라 대학생 외국어 능력 탁월 시 학기 초 특별시험으로 교양영어·교양외국어 학점","고교-대학 이중등록: KSA-KAIST, 영재교육진흥법 시행령 제35조의 2(동일계열 진학 시 학칙에 따라 학점 인정 가능), 고등교육법 제23조(학점의 인정 등)","AP(Advanced Placement, 대학학점선이수): 대학 재학기간 1년 이상 단축 가능, 학점인정시험 매년 5월 초, 국제적 AP 가장 많은 학교 민족사관고등학교","우리나라 2007년 대학과목이수제 추진계획 발표 → 아직 활성화 안 됨, 입시과열·사교육 우려, 과학영재학교 전문교과 교육과정과 연계 부분 시행, 대학에서 AP 인정 안 함"],"questions":[{"id":"42-01","type":"옳지 않은 것","q":"조기입학에 대한 일반적인 우려사항으로 옳지 않은 것은?","box":null,"choices":["학교 적응 문제","어린 시절 경험의 부재가 우려","학업적 부담은 우울, 반항, 스트레스 유발","일부 부모는 자녀의 준비 정도와 관계없이 조기입학시키려 함","조기입학 아동은 또래보다 학업 동기가 지나치게 높아짐"],"answer":5,"explain":"교안의 조기입학 우려사항은 학교 적응 문제, 어린 시절 경험의 부재, 학업적 부담으로 인한 우울·반항·스트레스, 자녀 준비 정도와 관계없이 조기입학시키려는 일부 부모이다. ⑤는 교안에 우려사항으로 제시되지 않았다.","source":{"page":3,"section":"조기입학제 - 조기입학에 대
