"산만하다고 생각됨","소극적이라고 생각됨","게으르다고 생각됨","건방지다고 생각되곤 함","우울하다고 생각됨"],"answer":4,"explain":"교안: 교육자로 하여금 건방지다고 생각되곤 함. 나머지는 교안 표현이 아님.","source":{"page":17,"section":"부모님이 이야기하는 자녀의 학교수업은?","quote":"선생님께서 이미 학습이 된 상황을 반복하므로 다른 일(책이나, 잠, 다른 공부)을 해서 교육자로 하여금 건방지다고 생각되곤 함"}},{"id":"57-20","type":"옳지 않은 것","q":"부모님이 이야기하는 자녀의 학교수업에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["학교수업은 편파적이고 학생 개인의 특성은 계발되는 경우가 적다.","수업시간에 깊이 있게 수업받지 못하는 걸 싫어한다.","수업시간에 할 일이 없어 앉아 있는 것을 매우 싫어한다.","암기 위주의 주입식 교육과 과로한 입시 위주의 교육으로 힘들어한다.","고집이 약하고 순종적이어서 교사에게 반항하지 않는다."],"answer":5,"explain":"고집이 세고 자기주장이 강하여 교사에게 반항이 심함. ①~④는 교안과 일치.","source":{"page":18,"section":"부모님이 이야기하는 자녀의 학교수업은?","quote":"암기 위주의 주입식 교육과 과로한 입시 위주의 교육으로 힘들어함 고집이 세고 자기주장이 강하여 교사에게 반항이 심함"}},{"id":"57-21","type":"개념 찾기","q":"교안에서 '우리나라 영재들'의 부모·선생님 존경 이유, 독서 이유, 학창시절, 친구관계 자료의 출처로 제시된 것은?","box":null,"choices":["이정규. 성공하는 미래교육전략. 자음과모음","이신동, 이정규, 박춘성(2020). 최신영재교육학개론(3판). 학지사","Michael Sandel. 공정하다는 착각","Carol Ann Strip, Gretchen Hirsh(2000). Helping gifted children soar","위키백과"],"answer":2,"explain":"57차시 해당 쪽 출처는 이신동, 이정규, 박춘성(2020). 최신영재교육학개론(3판). 학지사. ①③⑤는 58차시, ④는 59차시 자료의 출처.","source":{"page":5,"section":"우리나라 영재들이 부모님을 존경하는 이유는?","quote":"출처: 이신동, 이정규, 박춘성(2020). 최신영재교육학개론(3판). 학지사"}}]},{"lesson":58,"title":"영재를 자녀로 둔 부모교육은 어떻게 하나?","file":"4. 교안 (31~60)[1] (1)/58.pdf","summary":["\"오늘의 학생들을 어제의 방식으로 가르치는 것은 그들의 내일을 빼앗는 것이다.\" - 미국의 교육학자 존 듀이","교육은 부모로부터 시작, 아이와 함께하는 모든 언행이 교육의 시작 / 더 큰 교육은 스스로 인생을 책임지고 살아가야 하는 지혜와 지식","부부간 갈등 원인 중 하나 = 자녀의 성적과 사교육 문제 / \"엔젤 산업과 사교육\" 호황 / 과도한 양육비·사교육비 → 저출산 현상의 큰 원인","3無(무판단, 무동기, 무책임)로 키우고 있는 건 아닌지 점검 (출처: 이정규, 성공하는 미래교육전략, 자음과모음)","고통의 부메랑: 청소년기 자아정체성 유보·회피 증가, 사소한 실패마저 부모에게 원인을 돌림","미국: 헬리콥터맘(빙빙 돌며 관리·감시) → 아이비리그 1, 2학년 자살률 급증으로 밝혀진 '잔디깎기맘' (EBS1, 2022)","Michael Sandel '공정하다는 착각': 과잉부모의 간섭 → \"유리처럼 쉽게 깨져버리기 쉬운 인간\"","타이거맘: 철저히 관리 통제, 이민 온 아시아계 부모가 더 심함 → SAT 역차별 / 소수인종우대정책(affirmative action) 위헌 결정(2023.6)","중국 소황제 신드롬: 1979년 독생자녀제(1가구 1자녀 원칙)에 의해 1980년대에 태어난 독생자층","우리나라: 헬리콥터맘(스카이 캐슬), 타이거맘, 잔디깎기맘(꽃잔디), 세상에서 가장 긴 탯줄 = 스마트폰","영재들이 말하는 집안 분위기: TV보다 책, 메뉴도 의견 존중, 부모 사이 화목 / 부모의 교육관: 스스로 찾아 문제해결, 자기 일 스스로 책임, 과외에 의존하지 않음"],"questions":[{"id":"58-01","type":"개념 찾기","q":"\"오늘의 학생들을 어제의 방식으로 가르치는 것은 그들의 내일을 빼앗는 것이다.\"라고 말한 인물로 교안에 제시된 것은?","box":null,"choices":["마이클 샌델","존 듀이","칙센트미하이","스턴버그","칼 로저스"],"answer":2,"explain":"교안: 미국의 교육학자 존 듀이. ① 마이클 샌델은 '공정하다는 착각'의 저자로 인용됨.","source":{"page":3,"section":"교육의 시작은 가정으로부터","quote":"오늘의 학생들을 어제의 방식으로 가르치는 것은 그들의 내일을 빼앗는 것이다. 미국의 교육학자 존 듀이"}},{"id":"58-02","type":"옳은 것","q":"'교육의 시작은 가정으로부터'에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["교육은 학교에서부터 시작된다.","학교에서 교과의 지식과 기술을 가르치는 것은 중요하지 않다.","교육은 부모로부터 시작되고 아이와 함께하는 모든 언행이 교육의 시작이다.","더 큰 교육은 입시에서 성공하는 기술을 가르치는 교육이다.","부모는 교과 지식 전달에만 집중해야 한다."],"answer":3,"explain":"교육은 부모로부터 시작, 모든 언행이 교육의 시작. ② 교과 지식과 기술을 가르치는 것도 중요한 교육. ④ 더 큰 교육은 스스로 인생을 책임지고 살아가야 하는 지혜와 지식을 가르치는 교육.","source":{"page":3,"section":"교육의 시작은 가정으로부터","quote":"그 교육은 부모로부터 시작되고 아이와 함께하는 모든 언행이 교육의 시작이다."}},{"id":"58-03","type":"옳지 않은 것","q":"'교육의 시작은 부모로부터'에서 교안이 진단한 오늘날 부모의 상황으로 옳지 않은 것은?","box":null,"choices":["사전에 부모가 될 아무 준비나 특별한 교육도 받은 바 없이 학부모가 되었다.","급속도로 변화하는 고도의 지능정보화 사회에 살고 있다.","너무나 다르게 변해버린 학교와 교육과정, 복잡한 대학입시제도가 있다.","각종 정보가 난무하는 교육환경이다.","대학입시제도가 단순해져 정보 수집이 쉬워졌다."],"answer":5,"explain":"교안은 '복잡한 대학입시제도와 각종 정보가 난무하는 교육환경'이라고 함. ①~④는 교안과 일치.","source":{"page":4,"section":"교육의 시작은 부모로부터","quote":"너무나 다르게 변해버린 학교와 교육과정, 복잡한 대학입시제도와 각종 정보가 난무하는 교육환경임"}},{"id":"58-04","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"자녀교육에 대한 부부간의 갈등 원인 중 하나는 자녀의 성적과 사교육 문제임. \"(   )과 사교육\"이 고가임에도 불구하고 호황을 누리는 사회현상만 보아도 자녀 교육이 얼마나 힘든지를 알 수 있음","choices":["엔젤 산업","실버 산업","에듀테크 산업","콘텐츠 산업","돌봄 산업"],"answer":1,"explain":"교안: \"엔젤 산업과 사교육\". 나머지는 교안에 없는 용어.","source":{"page":5,"section":"교육의 시작은 부모로부터","quote":"\"엔젤 산업과 사교육\"이 고가임에도 불구하고 호황을 누리는 사회현상만 보아도 자녀 교육이 얼마나 힘든지를 알 수 있음"}},{"id":"58-05","type":"옳은 것","q":"과도한 양육비와 사교육비 지출에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["가계비용에 거의 부담을 주지 않는다.","사회적으로 저출산 현상의 큰 원인이자 악순환의 고리로 작용한다.","사회적으로 고령화 현상의 주된 원인이다.","부부간 갈등과는 관련이 없다.","부모의 역할을 쉽게 만든다."],"answer":2,"explain":"과도한 양육비와 사교육비 지출 → 가계비용에 큰 부담, 저출산 현상의 큰 원인이자 악순환의 고리. ④ 부부간 갈등 원인 중 하나가 성적과 사교육 문제. ⑤ 부모도 힘든 세대가 됨.","source":{"page":5,"section":"교육의 시작은 부모로부터","quote":"과도한 양육비와 사교육비의 지출은 가계비용에 큰 부담이 되어, 사회적으로는 저출산 현상의 큰 원인이자 악순환의 고리로 작용함"}},{"id":"58-06","type":"보기 조합","q":"\u003c보기\u003e 중 교안에서 영재 아이들을 키울 때 점검해야 한다고 한 '3無'에 해당하는 것을 모두 고른 것은?","box":"ㄱ. 무판단\nㄴ. 무동기\nㄷ. 무관심\nㄹ. 무책임","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"3無 = 무판단, 무동기, 무책임. ㄷ 무관심은 해당 없음. 출처: 이정규, '성공하는 미래교육전략', 자음과모음.","source":{"page":6,"section":"무판단, 무동기, 무책임","quote":"영재 아이들을 3無(무판단, 무동기, 무책임)로 키우고 있는 건 아닌지 점검해야 함"}},{"id":"58-07","type":"옳은 것","q":"3無(무판단, 무동기, 무책임)와 관련하여, 가족 상담을 하다 보면 나타나는 영재 아이들의 생각으로 교안에 제시된 것은?","box":null,"choices":["\"나는 공부만 잘하면 된다고 했어.\"","\"내가 선택했으니 결과도 내가 책임질게.\"","\"하고 싶은 게 너무 많아서 고르기 힘들어.\"","\"부모님 말씀보다 내 생각이 더 중요해.\"","\"친구들이 하니까 나도 할래.\""],"answer":1,"explain":"교안의 영재 아이들의 생각: \"나는 몰라. 우리 부모님이 다 알아서 잘해주겠지.\", \"나는 공부만 잘하면 된다고 했어.\", \"내가 괜히 했다가 부모님께 혼만 나.\" ②③④⑤는 교안에 없는 문장(②은 오히려 판단·책임을 갖춘 생각).","source":{"page":6,"section":"무판단, 무동기, 무책임","quote":"\"나는 몰라. 우리 부모님이 다 알아서 잘해주겠지.\" \"나는 공부만 잘하면 된다고 했어.\" \"내가 괜히 했다가 부모님께 혼만 나.\""}},{"id":"58-08","type":"옳은 것","q":"교안의 '고통의 부메랑'에 대한 설명으로 옳은 것은?","box":null,"choices":["자아정체성을 유보하거나 회피하는 청소년이 매년 감소 추세이다.","자아정체성을 확립해야 할 중요한 시기는 아동기이다.","자녀들이 인생의 사소한 자신의 실패마저도 부모에게 원인을 돌리게 된다.","자녀들이 성공과 실패에 대한 결과에 스스로 책임지게 된다.","부모의 과잉 개입은 자녀의 자율적 선택을 늘린다."],"answer":3,"explain":"사소한 실패마저도 부모에게 원인을 돌리게 됨. ① 매년 증가 추세. ② 청소년기. ④⑤ 자율적 선택·책임지는 인생을 살기보다는 부모 탓을 함.","source":{"page":7,"section":"고통의 부메랑","quote":"자녀들이 인생을 자율적으로 선택하고 노력하며 성공과 실패에 대한 결과에 책임지는 인생을 살기보다는, 인생의 사소한 자신의 실패마저도 부모에게 원인을 돌리게 됨"}},{"id":"58-09","type":"개념 찾기","q":"다음 설명에 해당하는 사회병리현상은?","box":"미국에서 유명한 아이비리그 사립대학의 1, 2학년 학생들의 자살률이 급증한 사실이 기사화되면서 밝혀진 사회병리현상으로, 헬리콥터맘에서 한 단계 더 나아간 것","choices":["헬리콥터맘","타이거맘","엔젤 산업","소황제 신드롬","잔디깎기맘"],"answer":5,"explain":"잔디깎기맘. ① 헬리콥터맘은 어릴 때부터 헬리콥터처럼 빙빙 돌며 관리와 감시하는 현상. ② 타이거맘은 높은 성적을 위해 철저히 관리 통제. ④ 중국 독생자층. 출처: EBS1, 2022.","source":{"page":8,"section":"미국의 교육현실","quote":"그리고 한 단계 더 나아가 유명한 아이비리그 사립대학의 1, 2학년 학생들의 자살률이 급증한 사실이 기사화되면서, 밝혀진 사회병리현상을 \"잔디깎기맘\"이라 부른다."}},{"id":"58-10","type":"옳지 않은 것","q":"교안의 '미국의 교육현실'에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["금융위기, 쌍둥이 적자 등 경제 상황이 안 좋아졌다.","쌍둥이 적자는 무역적자와 재정적자를 말한다.","좋은 대학을 나와 안정된 고연봉의 직장에 들어가기를 희망하는 부모가 많이 늘어났다.","헬리콥터처럼 빙빙 돌며 관리와 감시를 하는 현상을 '헬리콥터맘'이라 하였다.","IVY리그 대학 신입생 자살은 감소 추세이다."],"answer":5,"explain":"교안: IVY리그 대학 신입생 자살 증가(출처 EBS1, 2022). ①~④는 교안과 일치.","source":{"page":8,"section":"미국의 교육현실","quote":"IVY리그 대학 신입생 자살 증가 출처- EBS1, 2022"}},{"id":"58-11","type":"빈칸","q":"Michael Sandel의 '공정하다는 착각'을 인용한 교안 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"부유하고 잘 교육받은 아이들이 과잉부모의 간섭으로 \"(   ) 쉽게 깨져버리기 쉬운 인간\"이 되고 있음","choices":["도자기처럼","유리처럼","얼음처럼","모래성처럼","비눗방울처럼"],"answer":2,"explain":"교안: \"유리처럼 쉽게 깨져버리기 쉬운 인간\". 슬라이드 제목도 '유리처럼 깨지기 쉬운 아이'.","source":{"page":10,"section":"유리처럼 깨지기 쉬운 아이","quote":"부유하고 잘 교육받은 아이들이 과잉부모의 간섭으로 \"유리처럼 쉽게 깨져버리기 쉬운 인간\"이 되고 있음"}},{"id":"58-12","type":"옳지 않은 것","q":"'유리처럼 깨지기 쉬운 아이'에 대한 교안(Michael Sandel 인용)의 설명으로 옳지 않은 것은?","box":null,"choices":["부모와 교사의 말에 지나치게 반항적이며 남의 말을 따르지 않는다.","통제적인 육아방식은 불평등이 증가하고 교육으로 인한 보상이 커진 데 따른 합리적 대응이다.","겉으로는 성공적인 유복한 가정의 10대들이 불행감, 고립감, 무력감에 시달리고 있다.","\"우리는 아이들의 성공에 너무 집착하게 되었다.\"","사소한 문제에 흥분하며, 우울하고 불안하며 분노에 차 있다."],"answer":1,"explain":"교안: 부모와 교사의 말에 지나치게 복종적이며 일상적인 문제까지 남의 말에 구조적으로 따름. ④②③⑤는 교안과 일치.","source":{"page":10,"section":"유리처럼 깨지기 쉬운 아이","quote":"부모와 교사의 말에 지나치게 복종적이며 일상적인 문제까지 남의 말에 구조적으로 따름"}},{"id":"58-13","type":"옳은 것","q":"교안의 '타이거맘'에 대한 설명으로 옳은 것은?","box":null,"choices":["아이 주위를 빙빙 돌며 감시하는 부모를 말한다.","미국에서는 아시아권 학생들의 SAT 점수를 미국 학생보다 높게 평가하였다.","이민 온 아시아계 부모들이 더욱 심한 것으로 밝혀졌다.","미국 연방헌법재판소는 소수인종우대정책을 합헌으로 결정하였다.","중국의 독생자녀제에서 유래하였다."],"answer":3,"explain":"이민 온 아시아계 부모들이 더욱 심함. ① 헬리콥터맘. ② 낮게 평가하는 역차별. ④ 위헌 결정(2023.6). ⑤ 소황제 신드롬.","source":{"page":11,"section":"타이거맘","quote":"부모들이 높은 성적을 내기 위해 철저히 아이를 관리 통제하는 것을 무서운 \"타이거 맘\"이라고 부르고 있음 이민 온 아시아계 부모들이 더욱 심한 것으로 밝혀짐"}},{"id":"58-14","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"미국 연방헌법재판소 \"소수인종우대정책(affirmative action)\" 위헌 결정((   ))","choices":["2020.6","2021.6","2022.6","2023.6","2024.6"],"answer":4,"explain":"교안: 위헌 결정(2023.6). 나머지는 연도를 바꾼 오답.","source":{"page":11,"section":"타이거맘","quote":"미국 연방헌법재판소 \"소수인종우대정책(affirmative action)\" 위헌 결정(2023.6)"}},{"id":"58-15","type":"옳은 것","q":"교안의 '중국의 소황제 신드롬'에 대한 설명으로 옳은 것은?","box":null,"choices":["1989년 중국에서 시작한 독생자녀제에 의해 1990년대에 태어난 독생자층을 이르는 말","1979년 중국에서 시작한 독생자녀제(1가구 1자녀 원칙)에 의해 1980년대에 태어난 독생자층을 이르는 말","1979년 중국에서 시작한 1가구 2자녀 원칙에 의해 태어난 세대","1970년대에 태어난 중국의 장남들을 이르는 말","중국에서 사교육을 받는 아동을 이르는 말"],"answer":2,"explain":"교안: 1979년 시작한 독생자녀제(1가구 1자녀 원칙)에 의해 1980년대에 태어난 독생자층. 나머지는 연도·원칙을 바꾼 오답.","source":{"page":12,"section":"중국의 소황제 신드럼","quote":"1979년 중국에서 시작한 독생자녀제(1가구 1자녀 원칙)에 의해 1980년대에 태어난 독생자층을 이르는 말"}},{"id":"58-16","type":"개념 찾기","q":"우리나라 교육의 현실에 대한 교안 설명 중, 다음에 해당하는 것은?","box":"아이가 오로지 공부에만 집중할 수 있도록 모든 일은 엄마가 다 알아서 해주고, 아이는 엄마가 깎아놓은 꽃잔디 위만 걸어갈 수 있도록 함","choices":["헬리콥터맘","타이거맘","잔디깎기맘","세상에서 가장 긴 탯줄","소황제"],"answer":3,"explain":"잔디깎기맘. ① 스카이 캐슬처럼 아이 주위를 뱅뱅 돌며 학교·학원을 관리. ② 성적을 위해 혼을 내서라도 엄격하게 관리. ④ 스마트폰으로 출결·성적 관리.","source":{"page":15,"section":"우리나라 교육의 현실 - 잔디깎기맘","quote":"아이가 오로지 공부에만 집중할 수 있도록 모든 일은 엄마가 다 알아서 해주고, 아이는 엄마가 깎아놓은 꽃잔디 위만 걸어갈 수 있도록 '잔디 깎기맘'이 됨"}},{"id":"58-17","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"세상에서 가장 긴 탯줄이라 불리는 '(   )'(으)로 아이들의 출결과 학교, 학원 성적 등을 체계적으로 잘 관리해 줌","choices":["스마트폰","학원 셔틀","학부모 단체 대화방","가정통신문","인터넷 강의"],"answer":1,"explain":"세상에서 가장 긴 탯줄 = 스마트폰.","source":{"page":15,"section":"우리나라 교육의 현실 - 세상에서 가장 긴 탯줄 스마트폰","quote":"세상에서 가장 긴 탯줄이라 불리는 '스마트폰'으로 아이들의 출결과 학교, 학원 성적 등을 체계적으로 잘 관리해 줌"}},{"id":"58-18","type":"사례","q":"다음 사례의 부모 유형으로 교안에 제시된 것은?","box":"스카이 캐슬의 드라마처럼 아이의 주위에서 항상 뱅뱅 도는 엄마가 되어 학교와 학원을 관리해 준다.","choices":["타이거맘","소황제맘","잔디깎기맘","헬리콥터맘","엔젤맘"],"answer":4,"explain":"헬리콥터맘. ① 타이거맘 = 성적을 위해 혼을 내서라도 시간과 공부를 엄격하게 관리. ③ 잔디깎기맘 = 모든 일을 엄마가 알아서. ②⑤ 교안에 없음.","source":{"page":14,"section":"우리나라 교육의 현실 - 헬리콥터맘","quote":"스카이 캐슬의 드라마처럼 아이의 주위에서 항상 뱅뱅 도는 '헬리콥터 맘'이 되어 학교와 학원을 관리해줌"}},{"id":"58-19","type":"옳지 않은 것","q":"우리나라 영재들이 이야기하는 집안 분위기로 옳지 않은 것은?","box":null,"choices":["집에서 TV보다는 책을 함께 보는 분위기를 조성하려 노력","외식을 하더라도 메뉴를 일방적으로 결정하지 않고 내 의견도 존중해 줌","곳곳에 책이 많았고 테이블과 책장이 있어서 자유롭게 책을 볼 수 있는 분위기","부모님과 함께 책을 보는 시간이 가장 행복했음","부모님이 자주 큰소리로 엄하게 꾸짖는 분위기였음"],"answer":5,"explain":"교안: 부모님 사이가 화목하며, 큰소리를 내지 않았음. ①~④는 교안과 일치.","source":{"page":16,"section":"우리나라 영재들이 이야기하는 집안 분위기는?","quote":"부모님과 함께 책을 보는 시간이 가장 행복했음 부모님 사이가 화목하며, 큰소리를 내지 않았음"}},{"id":"58-20","type":"옳지 않은 것","q":"영재가 이야기하는 부모의 교육관으로 옳지 않은 것은?","box":null,"choices":["흥미를 느끼는 분야를 본인 스스로 찾아서 문제해결을 하게 해 줌","자기 일을 스스로 책임지게 함","스스로 학습할 수 있는 능력을 배양하는 데 중점을 둠","학습에 관해 과외에 크게 의존함","무엇이든 끝까지 하도록 하였음"],"answer":4,"explain":"교안: 학습에 관해 과외에 의존하지 않음. ①②③⑤는 교안과 일치(타인에게 피해를 주지 말라고 강조 등).","source":{"page":17,"section":"영재가 이야기하는 부모의 교육관","quote":"스스로 학습할 수 있는 능력을 배양하는 데 중점을 둠 무엇이든 끝까지 하도록 하였음 학습에 관해 과외에 의존하지 않음"}},{"id":"58-21","type":"보기 조합","q":"\u003c보기\u003e 중 영재가 이야기하는 부모의 교육관으로 교안에 제시된 것을 모두 고른 것은?","box":"ㄱ. 잘못한 일은 야단맞더라도 솔직히 고백하고 용서를 구하라고 교육함\nㄴ. 남에게 즐거움을 주며 공감할 수 있고 봉사하는 연주가가 되라고 함\nㄷ. 학습하는 분위기 조성(집에서 책보기 솔선수범)\nㄹ. 공부 외의 예의범절, 돈 관리 등은 자율에 맡김","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ·ㄴ·ㄷ은 교안과 일치. ㄹ은 틀림 → 매우 엄격하게 교육했으며 공부뿐 아니라 예의범절, 돈 관리 등 모든 부분을 철저히 함.","source":{"page":18,"section":"영재가 이야기하는 부모의 교육관","quote":"매우 엄격하게 교육했으며, 공부뿐 아니라 예의범절 돈 관리 등 모든 부분을 철저히 함"}}]},{"lesson":59,"title":"영재 학부모들의 상담 실제와 Tip (1)","file":"4. 교안 (31~60)[1] (1)/59.pdf","summary":["자녀가 영재로 판별되면 대개 흥분과 자부심 → 이후 두려움이 다가옴","영재 아이들은 자신이 영재라는 것을 받아들여 줄 때 자신감, 동료들과 더 잘 어울림, 더 강한 리더십 / 신뢰하고 의지할 수 있는 성인이 적어도 두세 명","인생에 큰 영향을 주는 사람: 영재성이 아니라 인간으로 자신을 사랑해주는 사람, 시간을 함께 보내는 사람, 꿈을 추구하도록 용기를 북돋는 사람 등","신뢰하는 관계 만들기: 집중적 관심, 말과 행동 일치, 사생활·비밀 존중, 부모의 한계 존중 강조, 행동은 제약하되 기분은 존중, 의견 수렴, 진실을 말해주기 (Carol Ann Strip, Gretchen Hirsh, 2000)","수용적인 부모: 귀 기울이기, 적절한 칭찬, 폄하하지 말기, 지적 능력에 대한 공포 배제 → 멘토 찾아주기, 사회적 기술(겸손함), 함께 웃어주기","영재 아이들이 직면한 정서적 문제: 스트레스, 우울증, 완벽주의, 교우관계, 자아존중감","스트레스 원인: 지나친 기대, 세계에 관한 우려, 지나치게 열정적인 부모, 부모와의 단절, 과도한 활동들, 배치의 부적합, 지루함, 불필요한 엄격함, 외로움 / 지원: 결과가 아닌 노력 칭찬, 이타심, 학습습관, 한 가지 일을 완벽하게 숙달","우울증 원인: 완벽주의, 분노의 감정, 스트레스 요인 / 지원: 인지적 재평가, 필요시 상담·치료","완벽주의 원인: 비동시적 발달 / 지원: 실패는 성공의 어머니, 첫 시도에서 완벽 기대는 불가능, 건강 유지·시간 관리·목표와 우선순위","교우관계 지원: 다른 영재 만날 기회(프로그램 참여), 모든 사람 존경 → 으스댐은 리더십으로 변화","자아존중감: 다른 원인들에 기인 / 교육과정에 의존하지 말고 근본적 문제 다루기 / 조건 없는 사랑과 수용, 적절한 훈육","교사-학부모 협력 상담 Tip: '당신'이 아닌 '우리' 강조, 예의, 감사, 감정 조절, 오픈마인드, 더 많은 면담 필요 / 팀워크: 경청, 타인의 관점, 존중과 이해, 감사 표시"],"questions":[{"id":"59-01","type":"옳은 것","q":"자녀가 영재로 판별되었을 때 부모가 보이는 반응에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["대개 무관심하다가 이후 기쁨이 찾아온다.","대개 흥분과 자부심에 사로잡히고, 이후 두려움이 다가온다.","처음부터 두려움에 사로잡힌다.","대개 분노를 느끼고 이후 수용한다.","부모의 반응은 대체로 담담하다."],"answer":2,"explain":"대개 흥분과 자부심에 사로잡힘 → 이후 두려움이 다가옴(예: 제가 아이에게 뒤지지 않을 만큼 똑똑할까요?). 나머지는 교안에 없음.","source":{"page":3,"section":"자녀가 영재로 판별되면","quote":"대개 흥분과 자부심에 사로잡힘 이후 두려움이 다가옴"}},{"id":"59-02","type":"옳지 않은 것","q":"자녀가 영재로 판별된 후 부모에게 다가오는 두려움의 예로 교안에 제시되지 않은 것은?","box":null,"choices":["아이가 영재교육원에 떨어지면 어쩌죠?","분발하라고 해야 하나요, 그냥 잠자코 있어야 하나요?","아이에게 모든 것을 해줄 만한 시간적, 경제적 여건이 허락되지 않으면 어쩌죠?","아이에게 무슨 문제가 있는 건 아닐까요?","제가 아이에게 뒤지지 않을 만큼 똑똑할까요?"],"answer":1,"explain":"①는 교안에 없음. 교안의 예: ⑤~④와 '제가 무엇을 해야 할까요?'.","source":{"page":3,"section":"자녀가 영재로 판별되면","quote":"제가 아이에게 뒤지지 않을 만큼 똑똑할까요? 분발하라고 해야 하나요, 그냥 잠자코 있어야 하나요? 아이에게 모든 것을 해줄 만한 시간적, 경제적 여건이 허락되지 않으면 어쩌죠? 아이에게 무슨 문제가 있는 건 아닐까요? 제가 무엇을 해야 할까요?"}},{"id":"59-03","type":"옳은 것","q":"교안의 '영재 아이들은'에 대한 설명으로 옳은 것은?","box":null,"choices":["평범한 아이들처럼 만들기 위해 도움을 줄 때 자신감을 얻는다.","자신이 영재라는 것을 인정받으면 정규 교과 이외의 활동에는 소극적이 된다.","자신이 영재라는 것을 받아들여 줄 때 자신감을 얻고 동료들과 더 잘 어울린다.","신뢰하고 의지할 수 있는 성인이 한 명이면 충분하다.","영재라는 것을 받아들여 주면 리더십이 약해진다."],"answer":3,"explain":"자신이 영재라는 것을 받아들여 줄 때 자신감, 동료와 더 잘 어울림, 정규 교과 이외 활동에 더욱 적극적, 더 강한 리더십. ① 반대. ④ 적어도 두세 명.","source":{"page":4,"section":"영재 아이들은","quote":"자신이 영재라는 것을 받아들여 줄 때 자신감을 얻게 되고, 동료들과 더 잘 어울리며, 정규 교과 이외의 활동에도 더욱 적극적으로 참여하고, 더 강한 리더십을 발휘함"}},{"id":"59-04","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재 아이들은 신뢰하고 의지할 수 있는 성인이 적어도 (   )은/는 있어야 함","choices":["한 명","열 명","네다섯 명","두세 명","부모 두 명"],"answer":4,"explain":"교안: 신뢰하고 의지할 수 있는 성인이 적어도 두세 명은 있어야 함.","source":{"page":4,"section":"영재 아이들은","quote":"신뢰하고 의지할 수 있는 성인이 적어도 두세 명은 있어야 함"}},{"id":"59-05","type":"옳지 않은 것","q":"영재 아이들의 인생에 큰 영향을 주는 사람으로 교안에 제시되지 않은 것은?","box":null,"choices":["자신의 기분을 이해하는 사람","자신의 영재성이나 재능을 사랑해 주는 사람","자신과 시간을 함께 보내는 사람","학습이 중요하다는 것을 믿는 사람","자신의 꿈을 추구하도록 용기를 북돋는 사람"],"answer":2,"explain":"교안: 자신의 영재성이나 재능을 사랑하는 것이 아니라, 인간으로 자신을 사랑해주는 사람. ①③④⑤는 교안과 일치.","source":{"page":5,"section":"영재 아이들의 인생에 큰 영향을 주는 사람","quote":"자신의 영재성이나 재능을 사랑하는 것이 아니라, 인간으로 자신을 사랑해주는 사람"}},{"id":"59-06","type":"옳지 않은 것","q":"영재 아이와 '신뢰하는 관계 만들기'에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["아이가 부모의 한계를 존중할 필요는 없음을 알려주기","아이와 함께 있어주지 못할 때 대화할 수 있는 방법들을 제공하기","말과 행동을 일치시키기","아이의 사생활이나 비밀을 존중해 주기","영재 아이에게 집중적인 관심 주기"],"answer":1,"explain":"교안: 아이도 부모의 한계(합당한 제약과 제재)를 존중해야 한다는 것을 강조하기. ⑤~④는 교안과 일치.","source":{"page":6,"section":"신뢰하는 관계 만들기","quote":"아이도 부모의 한계(합당한 제약과 제재)를 존중해야 한다는 것을 강조하기 규칙과 허용범위를 설명할 준비하기"}},{"id":"59-07","type":"빈칸","q":"'신뢰하는 관계 만들기'에 대한 교안 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"아이의 행동은 (   ) 기분은 존중해 주기","choices":["허용하되","칭찬하되","제약하되","무시하되","기록하되"],"answer":3,"explain":"교안: 아이의 행동은 제약하되 기분은 존중해 주기. 이 밖에 의견 수렴, 진실을 말해주기.","source":{"page":7,"section":"신뢰하는 관계 만들기","quote":"아이의 행동은 제약하되 기분은 존중해 주기 아이의 생활에 영향을 끼치는 어떤 결정이든 아이의 의견을 수렴해 주기 진실을 말해주기"}},{"id":"59-08","type":"개념 찾기","q":"교안에서 '신뢰하는 관계 만들기', '수용적인 부모 되기' 내용의 출처로 제시된 것은?","box":null,"choices":["성공하는 미래교육전략 (이정규)","공정하다는 착각 (Michael Sandel)","최신영재교육학개론(3판) (이신동, 이정규, 박춘성, 2020)","Helping gifted children soar (Carol Ann Strip, Gretchen Hirsh, 2000)","The Battle of Midway (Craig L. Symonds)"],"answer":4,"explain":"출처: Helping gifted children soar _ by Carol Ann Strip, Gretchen Hirsh, 2000. ②① 58차시, ③ 57차시, ⑤ 56차시 학습계약서 사례의 도서.","source":{"page":6,"section":"신뢰하는 관계 만들기","quote":"출처: Helping gifted children soar _ by Carol Ann Strip, Gretchen Hirsh, 2000"}},{"id":"59-09","type":"옳은 것","q":"'수용적인 부모 되기'에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["자녀의 지적 능력을 경계하여 지나친 학습을 막기","자녀의 지적 능력에 대한 공포를 배제하고, 그것을 존중하여 멘토를 찾아주기","자녀에게 칭찬은 가급적 하지 않기","자녀의 사회적 기술보다는 학업에 집중하기","자녀의 자존심을 위해 겸손함은 가르치지 않기"],"answer":2,"explain":"지적 능력에 대한 공포를 배제하고 존중하여 멘토를 찾아주기. ③ 적절한 칭찬을 하기. ④⑤ 사회적 기술 개발(겸손함을 가르치고 타인의 재능도 훌륭한 특성임을 깨닫게).","source":{"page":8,"section":"수용적인 부모 되기","quote":"자녀의 지적 능력에 대한 공포를 배제하고, 그것을 존중하여 멘토를 찾아주기 자녀의 사회적 기술을 개발해주기(겸손함을 가르치고, 타인이 가진 재능도 훌륭한 특성임을 깨닫게 해주기)"}},{"id":"59-10","type":"보기 조합","q":"\u003c보기\u003e 중 교안에 제시된 '영재 아이들이 직면한 정서적 문제'에 해당하는 것을 모두 고른 것은?","box":"ㄱ. 스트레스\nㄴ. 완벽주의\nㄷ. 교우관계\nㄹ. 자아존중감","choices":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":5,"explain":"정서적 문제: 스트레스, 우울증, 완벽주의, 교우관계, 자아존중감. ㄱ~ㄹ 모두 해당.","source":{"page":10,"section":"영재 아이들이 직면한 정서적 문제","quote":"스트레스 우울증 완벽주의 교우관계 자아존중감"}},{"id":"59-11","type":"옳지 않은 것","q":"영재 아이들의 스트레스 원인으로 교안에 제시되지 않은 것은?","box":null,"choices":["지나친 기대","세계에 관한 우려","부모와의 단절","배치의 부적합","비동시적 발달"],"answer":5,"explain":"비동시적 발달은 '완벽주의'의 원인. 스트레스 원인: 지나친 기대, 세계에 관한 우려, 지나치게 열정적인 부모, 부모와의 단절, 과도한 활동들, 배치의 부적합, 지루함, 불필요한 엄격함, 외로움.","source":{"page":11,"section":"원인 - 영재 아이들의 스트레스","quote":"지나친 기대 세계에 관한 우려 지나치게 열정적인 부모 부모와의 단절 과도한 활동들 배치의 부적합 지루함 불필요한 엄격함 외로움"}},{"id":"59-12","type":"옳은 것","q":"스트레스 문제에 대한 부모의 지원 Tip으로 옳은 것은?","box":null,"choices":["남보다 뛰어나야 한다는 압박감을 주고 결과를 칭찬해 주기","노력이 아닌 결과를 칭찬해 주기","학업 성취를 강조하기","여러 일을 재미 삼아 하기보다 한 가지 일을 완벽하게 숙달하도록 유도","또래 친구들보다는 혼자 활동하도록 하기"],"answer":4,"explain":"자녀의 활동을 관찰하여 한 가지 일을 완벽하게 숙달하도록 유도. ①② 압박감과 부담을 덜어주고 결과가 아닌 노력을 칭찬. ③ 학업 성취를 너무 강조하지 말고 학습습관 기르기. ⑤ 또래 친구들과 함께해야 하며 다양한 그룹 필요.","source":{"page":12,"section":"스트레스 문제에 대한 부모의 지원 Tip","quote":"자녀의 활동을 관찰하기 / 여러 일을 재미 삼아 하기보다 한 가지 일을 완벽하게 숙달하도록 유도"}},{"id":"59-13","type":"빈칸","q":"우울증 문제에 대한 부모의 지원 Tip이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   ): 부정적 감정에서 벗어나 보다 유익한 태도를 개발하도록 하기","choices":["인지적 재평가","행동 계약","스캐폴딩","가치의 조건화","공감적 이해"],"answer":1,"explain":"인지적 재평가. 무언가 실제로 잘못된 것보다 생각하는 방법에서 비롯된 문제들인 경우가 많으므로 유익하게 극복하도록, 필요시 상담·치료.","source":{"page":13,"section":"우울증 문제에 대한 부모의 지원 Tip","quote":"인지적 재평가 / 부정적 감정에서 벗어나 보다 유익한 태도를 개발하도록 하기"}},{"id":"59-14","type":"옳은 것","q":"영재 아이들의 우울증에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["원인은 비동시적 발달이다.","대부분 무언가 실제로 잘못된 것에서 비롯된다.","원인으로 완벽주의, 분노의 감정, 스트레스 요인들이 제시된다.","상담이나 치료는 필요하지 않다.","부정적 감정을 그대로 유지하도록 돕는다."],"answer":3,"explain":"우울증 원인: 완벽주의, 분노의 감정, 스트레스 요인들. ① 완벽주의의 원인. ② 생각하는 방법에서 비롯된 경우가 많음. ④ 필요시 상담, 치료. ⑤ 부정적 감정에서 벗어나도록.","source":{"page":13,"section":"원인 - 영재 아이들의 우울증","quote":"완벽주의, 분노의 감정, 스트레스 요인들"}},{"id":"59-15","type":"개념 찾기","q":"교안에서 영재 아이들의 '완벽주의'의 원인으로 제시된 것은?","box":null,"choices":["지나치게 열정적인 부모","비동시적 발달","분노의 감정","배치의 부적합","외로움"],"answer":2,"explain":"완벽주의 원인 = 비동시적 발달. ①④⑤ 스트레스 원인. ③ 우울증 원인.","source":{"page":14,"section":"원인 - 영재 아이들의 완벽주의","quote":"비동시적 발달"}},{"id":"59-16","type":"옳지 않은 것","q":"완벽주의 문제에 대한 부모의 지원 Tip으로 옳지 않은 것은?","box":null,"choices":["높은 기준을 세우는 것은 훌륭한 자질이고 우수함을 추구하는 것은 좋은 일이라는 것을 깨닫도록 해주기","'실패는 성공의 어머니'라는 말을 덧붙여 격려하기","첫 번째 시도에서 완벽하기를 기대하도록 격려하기","성공한 사람들도 그랬다는 실례를 들어 격려하기","건강 유지하기, 시간 관리 연습하기, 목표와 우선순위 정하기 등 전략 안내하기"],"answer":3,"explain":"첫 번째 시도에서 완벽하기를 기대하는 것은 불가능하다는 사실을 알려주기. ①②④⑤는 교안과 일치.","source":{"page":14,"section":"완벽주의 문제에 대한 부모의 지원 Tip","quote":"첫 번째 시도에서 완벽하기를 기대하는 것은 불가능하다는 사실을 알려주기 / 성공한 사람들도 그랬다는 실례를 들어 격려하기"}},{"id":"59-17","type":"옳지 않은 것","q":"영재 아이들의 교우관계 문제의 원인으로 교안에 제시되지 않은 것은?","box":null,"choices":["뜻이 잘 맞는 친구에게 집착할 때","친구들에게도 자신의 높은 기준을 요구할 때","친구들이 영재 아이를 잘난 체하고 거만하게 볼 때","나이가 어릴수록 두목 행세를 하려는 영재 아이를 친구들이 피할 때","또래보다 신체 발달이 늦어 운동을 못할 때"],"answer":5,"explain":"⑤는 교안에 없음. ①~④는 교우관계 원인으로 교안에 제시됨.","source":{"page":15,"section":"원인 - 영재 아이들의 교우관계","quote":"뜻이 잘 맞는 친구에게 집착할 때 친구들에게도 자신의 높은 기준을 요구할 때 친구들이 영재아이를 잘난 체하고 거만하게 볼 때"}},{"id":"59-18","type":"옳은 것","q":"교우관계 문제에 대한 부모의 지원 Tip으로 옳은 것은?","box":null,"choices":["다른 영재 아이들을 만날 수 있는 기회(프로그램 참여)를 만들어 주기","우수한 능력을 가진 사람만 존경하도록 가르치기","다른 영재 아이들과의 만남은 피하게 하기","상대방의 마음을 읽는 능력은 후천적으로만 길러짐을 알려주기","교우관계에서도 완벽하려는 욕구를 키워주기"],"answer":1,"explain":"다른 영재 아이들을 만날 수 있는 기회(프로그램 참여). ② 모든 사람들을 존경해야 함. ④ 선천적으로 가진 공감하는 마음을 키워주기. ⑤ 완벽하려는 욕구 감소.","source":{"page":16,"section":"교우관계 문제에 대한 부모의 지원 Tip","quote":"다른 영재아이들을 만날 수 있는 기회를 만들어주기 / 프로그램 참여"}},{"id":"59-19","type":"빈칸","q":"교우관계 문제에 대한 부모의 지원 Tip이다. (   )에 들어갈 말로 알맞은 것은?","box":"우수한 능력을 가진 사람뿐만 아니라 모든 사람들을 존경해야 한다는 것을 배우게 해주기 → 으스댐은 (   )(으)로 변화, 교우관계에서도 완벽하려는 욕구 감소","choices":["자존감","협동심","겸손함","리더십","창의성"],"answer":4,"explain":"교안: 으스댐은 리더십으로 변화.","source":{"page":16,"section":"교우관계 문제에 대한 부모의 지원 Tip","quote":"으스댐은 리더십으로 변화, 교우관계에서도 완벽하려는 욕구 감소"}},{"id":"59-20","type":"옳지 않은 것","q":"영재 아이들의 자아존중감 문제와 부모의 지원 Tip에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["자아존중감 문제는 그 자체로 나타나는 것이 아니라 앞서 언급된 많은 다른 원인들에 기인한다.","스트레스가 쌓일 때, 친구를 만들지 못할 때 등에 나타난다.","자아존중감 교육과정에 의존하여 해결하는 것이 가장 효과적이다.","자아존중감은 자신이 가치 있고, 관심을 받고, 이해받는 것에서 만들어진다.","부모는 조건 없는 사랑과 수용, 적절한 훈육을 제공하는 원천이다."],"answer":3,"explain":"교안: 자아존중감 교육과정에 의존하지 말고 근본적인 문제를 함께 다루어 주기. ①②④⑤는 교안과 일치.","source":{"page":18,"section":"자아존중감 문제에 대한 부모의 지원 Tip","quote":"자아존중감 교육과정에 의존하지 말고 근본적인 문제를 함께 다루어주기"}},{"id":"59-21","type":"사례","q":"다음 상황 중 교안에서 영재 아이의 '자아존중감' 문제의 원인으로 제시된 것은?","box":null,"choices":["비판을 당하거나 완벽주의와 씨름하는 경우 자신의 생각이 반복적으로 실패하는 상황일 때","도전적인 일을 숙달하고 재능을 맘껏 발휘할 때","부모가 조건 없는 사랑과 수용을 제공할 때","다른 영재 아이들과 프로그램에 참여할 때","결과가 아닌 노력을 칭찬받을 때"],"answer":1,"explain":"자아존중감 원인: 비판을 당하거나 완벽주의와 씨름하는 경우 반복적 실패, 스트레스가 쌓일 때, 친구를 만들지 못할 때 등. ②③ 오히려 자아존중감이 생기거나 성장하는 상황. ④⑤ 교우관계·스트레스 지원 Tip.","source":{"page":17,"section":"원인 - 영재 아이들의 자아존중감","quote":"비판을 당하거나 완벽주의와 씨름하는 경우 자신의 생각이 반복적으로 실패하는 상황일 때 스트레스가 쌓일 때 친구를 만들지 못할 때 등"}},{"id":"59-22","type":"빈칸","q":"교사와 학부모의 협력을 위한 상담 Tip이다. (   )에 들어갈 말로 알맞은 것은?","box":"'(   )'이/가 아닌 '(   )'을/를 강조하기","choices":["우리 - 당신","당신 - 우리","아이 - 부모","학교 - 가정","결과 - 노력"],"answer":2,"explain":"교안: '당신'이 아닌 '우리'를 강조하기. ① 순서가 반대.","source":{"page":19,"section":"교사와 학부모의 협력을 위한 상담 Tip","quote":"'당신'이 아닌 '우리'를 강조하기"}},{"id":"59-23","type":"옳지 않은 것","q":"교사와 학부모의 협력을 위한 상담 Tip으로 옳지 않은 것은?","box":null,"choices":["예의를 갖추기","서로가 시간을 할애해 준 것에 감사하기","감정을 조절하기","오픈마인드(배울 점이 있다는)를 가지기","한 번의 면담으로 반드시 결론을 내기"],"answer":5,"explain":"교안: 더 많은 면담이 필요할 수 있음을 알아주기(한 번의 면담으로 해결되지 않는 경우도 많고, 관점이 다를 수도 있음). ①~④는 교안과 일치.","source":{"page":19,"section":"교사와 학부모의 협력을 위한 상담 Tip","quote":"더 많은 면담이 필요할 수 있음을 알아주기 / 한 번의 면담으로 해결되지 않는 경우도 많고, 관점이 다를 수도 있음"}},{"id":"59-24","type":"보기 조합","q":"\u003c보기\u003e 중 교사와 학부모의 협력을 위한 '팀워크'의 요소로 교안에 제시된 것을 모두 고른 것은?","box":"ㄱ. 경청하는 것\nㄴ. 타인의 관점에서 바라보는 것\nㄷ. 서로를 존중하고 이해하는 것\nㄹ. 감사를 표시하는 것","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":5,"explain":"팀워크: 경청하는 것, 타인의 관점에서 바라보는 것, 서로를 존중하고 이해하는 것, 감사를 표시하는 것 → 모두 해당.","source":{"page":20,"section":"팀워크 - 교사와 학부모의 협력을 위한 상담 Tip","quote":"경청하는 것 타인의 관점에서 바라보는 것 서로를 존중하고 이해하는 것 감사를 표시하는 것"}}]},{"lesson":60,"title":"영재 학부모들의 상담 실제와 Tip (2)","file":"4. 교안 (31~60)[1] (1)/60.pdf","summary":["영재는 타고나는 것이나 계발되지 않으면 능력 발휘 불가 / 선천적 영재성 없으면 후천적 교육으로도 어려움 / 적절한 환경 없으면 발현되지 않음","검사 전에 준비시키지 마세요(불필요한 스트레스), 영재 범위에 들었어도 자랑으로 내세우지 마세요","영재성 = 영재가 될 수 있는 능력, 뛰어난 성취를 할 수 있는 가능성 / 어릴 때 영재였더라도 계발되지 않으면 '성장하지 못한 영재'","영재 분야: 수학, 과학, 예술(음악, 미술), 체육, 정보, 언어 영재 등 + 장애영재 같은 특수영재","영재도 지적 호기심 충족 환경 없으면 어려움 → 부모·교사의 지속적이고 면밀한 관심과 지원 필요 (\"영재아이도 아이입니다\")","어린 아이: 영재 유무보다 다양한 경험 환경 조성, 현재 시점에서 가장 중요한 적절한 자극","입시: 간접적으로는 도움, 직접적으로는 도움 안 됨 (장기적 창의성 계발, 자기주도적 학습태도 함양 목표) / 목적: 자아실현 + 국가·사회 발전","판별검사 연습 불가·무의미, 맞춤형 교육이 가장 좋음, 영재교육원 선발 검사지는 매년 바뀜","소외계층 자녀 영재성 발굴·무료 영재교육 기회 → 계층 간 위화감 심화로 보기 어려움, 교육기회는 모두에게 공정하게","제퍼슨 초등학교 팔쿠지(Palcuzzi) 교장: 영재교육 계획 5가지(능력별 반 편성, 특별수업, 다른 학교 영재와 특별활동, 능력별 진급제도, 특수교사·특별수당) → 학부모 반대 → 농구부 비유로 설득","동물학교: 모든 동물이 똑같은 과목(달리기, 오르기, 날기, 수영) → 오리 수영 평균으로 하락, 토끼 신경쇠약, 다람쥐 좌절, 독수리 문제학생, 뱀장어 졸업생 대표"],"questions":[{"id":"60-01","type":"옳은 것","q":"'영재교육을 받으면 누구나 영재가 될 수 있나요?'에 대한 교안의 답변으로 옳은 것은?","box":null,"choices":["영재는 전적으로 후천적 교육으로 만들어진다.","선천적인 영재성이 없어도 후천적인 교육을 통하면 누구나 영재로 키울 수 있다.","선천적으로 뛰어난 영재성을 지니고 태어났다면 환경과 무관하게 영재성이 발현된다.","영재는 타고나는 것이나 계발되지 않으면 그 능력을 발휘할 수 없다.","영재인가 아닌가에 민감하게 반응해야 한다."],"answer":4,"explain":"영재는 타고나는 것이나 계발되지 않으면 그 능력을 발휘할 수 없음. ①② 선천적 영재성이 없다면 후천적 교육으로도 영재로 키우기 어려움. ③ 적절한 환경이 없으면 발현되지 않음. ⑤ 민감할 필요가 없음.","source":{"page":3,"section":"영재교육을 받으면 누구나 영재가 될 수 있나요?","quote":"영재는 타고나는 것이나 계발되지 않으면 그 능력을 발휘할 수 없음 선천적인 영재성이 없다면 후천적인 교육을 통한다 해도 영재로 키우기는 어려움"}},{"id":"60-02","type":"옳지 않은 것","q":"영재 판별과 관련하여 교안이 학부모에게 당부한 내용으로 옳지 않은 것은?","box":null,"choices":["자녀가 영재의 범위에 들었다면 자랑으로 내세우세요.","검사 전 준비는 아이에게 불필요한 스트레스가 됩니다.","자녀가 영재의 범위에 들었다면 좋은 일입니다.","검사 전에 준비시키지 마세요.","아이에게 필요하고 적절한 교육이 이루어져야 합니다."],"answer":1,"explain":"교안: 영재 범위에 들었다면 좋은 일이지만, 자랑으로 내세우지 마세요. ④②③⑤는 교안과 일치.","source":{"page":4,"section":"영재교육을 받으면 누구나 영재가 될 수 있나요?","quote":"검사 전에 준비시키지 마세요. (아이에게 불필요한 스트레스가 됨) 자녀가 영재의 범위에 들었다면 좋은 일이지만, 자랑으로 내세우지 마세요."}},{"id":"60-03","type":"빈칸","q":"'어릴 때 영재이면 커서도 영재인가요?'에 대한 교안의 답변이다. (   )에 들어갈 말로 알맞은 것은?","box":"어릴 때 영재였더라도 성장하면서 영재 능력이 계발되지 않았다면 발달수준에 맞는 영재라고 볼 수 없음. (   )(이)라고 표현됨","choices":["잠재된 영재","성장하지 못한 영재","미성취 영재","소외된 영재","조숙한 영재"],"answer":2,"explain":"교안 표현: '성장하지 못한 영재'. 나머지는 교안 해당 쪽 표현이 아님.","source":{"page":5,"section":"어릴 때 영재이면 커서도 영재인가요?","quote":"어릴 때 영재였더라도 성장하면서 영재능력이 계발되지 않았다면 발달수준에 맞는 영재라고 볼 수 없음 성장하지 못한 영재라고 표현됨"}},{"id":"60-04","type":"개념 찾기","q":"교안에서 '영재가 될 수 있는 능력, 뛰어난 성취를 할 수 있는 가능성'으로 정의한 것은?","box":null,"choices":["영재성","창의성","지능","잠재력","자기주도성"],"answer":1,"explain":"영재성 = 영재가 될 수 있는 능력, 뛰어난 성취를 할 수 있는 가능성. 따라서 영재성은 있지만 계발하지 않았다면 영재가 될 수 없음.","source":{"page":5,"section":"어릴 때 영재이면 커서도 영재인가요?","quote":"영재성이란 영재가 될 수 있는 능력, 뛰어난 성취를 할 수 있는 가능성"}},{"id":"60-05","type":"옳지 않은 것","q":"'영재는 수학, 과학 분야에서만 출현하나요?'에 대한 교안의 답변으로 옳지 않은 것은?","box":null,"choices":["영재는 다양한 분야에 다 있다.","예술영재(음악, 미술), 체육영재, 정보영재, 언어영재 등이 있다.","장애영재와 같이 특수영재도 있다.","운동능력에 탁월한 학생이 별도 교육을 받는 것처럼 다른 영역의 학생도 별도 교육을 받는 것이 당연하다.","영재교육은 수학·과학 분야에 한정하는 것이 바람직하다."],"answer":5,"explain":"영재는 다양한 분야에 다 있으며 다른 영역 학생의 별도 교육도 당연. ①~④는 교안과 일치.","source":{"page":6,"section":"영재는 수학, 과학 분야에서만 출현하나요?","quote":"재능을 보이는 영역에 따라 수학영재, 과학영재, 예술영재(음악, 미술), 체육영재, 정보영재, 언어영재 등 매우 다양함 장애영재와 같이 특수영재도 있음"}},{"id":"60-06","type":"옳은 것","q":"'영재는 다른 사람의 도움 없이도 혼자서 잘하지 않나요?'에 대한 교안의 답변으로 옳은 것은?","box":null,"choices":["영재는 지적 호기심이 강해 혼자서도 충분하므로 지원이 필요 없다.","영재는 지적 호기심이 약해 외부 자극이 필요하다.","지적 호기심을 충족시켜 줄 환경이 제공되지 않으면 어려움을 겪을 수 있으므로 지속적이고 면밀한 관심과 지원이 필요하다.","영재는 교사의 지원만 있으면 부모의 관심은 필요 없다.","영재는 성인과 같으므로 독립적으로 대해야 한다."],"answer":3,"explain":"영재도 부모와 교사로부터 지속적이고 면밀한 관심과 지원 필요(\"영재아이도 아이입니다\"). ①② 지적 호기심이 강해 혼자서도 배우려 하지만 환경이 없으면 어려움. ④ 부모와 교사 모두. ⑤ 영재아이도 아이.","source":{"page":7,"section":"영재는 다른 사람의 도움 없이도 혼자서 잘하지 않나요?","quote":"주변에서 그 지적 호기심을 충족시켜 줄 수 있는 환경이 제공되지 않는다면 어려움을 겪을 수 있음 따라서 영재도 부모와 교사로부터 지속적이고 면밀한 관심과 지원을 필요로 함 영재아이도 아이입니다."}},{"id":"60-07","type":"옳은 것","q":"'아직 너무 어린 우리 아이, 영재인지 어떻게 알 수 있나요?'에 대한 교안의 답변으로 옳은 것은?","box":null,"choices":["너무 어린 아이도 영재성을 쉽게 판별할 수 있다.","유년기에는 영재 유무를 빨리 확인하는 것이 가장 중요하다.","매우 빠른 발달만으로 영재성을 확정할 수 있다.","유년기에는 영재 유무에 대한 관심보다 다양한 경험을 할 수 있도록 환경을 조성해 주는 것이 중요하다.","부모는 아이의 관심 분야를 관찰해도 영재성을 판단할 수 없다."],"answer":4,"explain":"영재 유무보다 다양한 경험 환경 조성이 중요, 현재 시점에서 가장 중요한 적절한 자극을 주세요. ①③ 너무 어린 아이는 판별이 어려울 수 있음. ⑤ 관심 분야의 호기심·집중력·경험적 지식을 보면 판단할 수도 있음.","source":{"page":8,"section":"아직 너무 어린 우리 아이, 영재인지 어떻게 알 수 있나요?","quote":"유년기에는 모든 아이들이 주변 상황에 대해 경험하는 것이 중요하기 때문에 영재 유무에 대한 관심보다는 아이가 다양한 경험을 할 수 있도록 환경을 조성해주는 것이 중요함"}},{"id":"60-08","type":"빈칸","q":"어린 아이의 영재성에 대한 교안의 답변이다. (   )에 들어갈 말로 알맞은 것은?","box":"현재 시점에서 가장 중요한 (   )을/를 주세요.","choices":["선행학습","적절한 자극","영재 판별검사","경쟁 경험","칭찬 스티커"],"answer":2,"explain":"교안: '현재 시점에서 가장 중요한 적절한 자극을 주세요.'","source":{"page":8,"section":"아직 너무 어린 우리 아이, 영재인지 어떻게 알 수 있나요?","quote":"현재 시점에서 가장 중요한 적절한 자극을 주세요."}},{"id":"60-09","type":"옳은 것","q":"'영재교육을 받으면 입시에 도움이 되나요?'에 대한 교안의 답변으로 옳은 것은?","box":null,"choices":["간접적으로는 도움이 되지만 직접적으로 도움이 되지는 않는다.","직접적으로 큰 도움이 된다.","간접적으로도, 직접적으로도 전혀 도움이 되지 않는다.","영재교육은 단기적인 입시 대비를 목표로 한다.","영재교육 이수 실적은 대학 입시에 직접 반영된다."],"answer":1,"explain":"간접적으로는 도움, 직접적으로는 도움이 되지 않음. 이유: 영재교육은 장기적인 차원의 창의성 계발과 자기주도적 학습태도 함양을 목표로 함. ④ 장기적 차원.","source":{"page":9,"section":"영재교육을 받으면 입시에 도움이 되나요?","quote":"입시제도의 특성을 고려해 볼 때, 간접적으로는 도움이 되지만 직접적으로 도움이 되지는 않음"}},{"id":"60-10","type":"빈칸","q":"교안에 제시된 우리나라 영재교육의 목적이다. (   )에 들어갈 말로 알맞은 것은?","box":"타고난 잠재력을 계발하여 학생의 (   )을/를 도모하고, 국가·사회의 발전에 이바지하도록 하는 것","choices":["입시 성공","사회적 지위 향상","자아실현","조기 진학","학업 성취"],"answer":3,"explain":"우리나라 영재교육의 목적 = 타고난 잠재력 계발 → 학생의 자아실현 도모, 국가·사회의 발전에 이바지.","source":{"page":9,"section":"영재교육을 받으면 입시에 도움이 되나요?","quote":"타고난 잠재력을 계발하여 학생의 자아실현을 도모하고, 국가·사회의 발전에 이바지하도록 하는 것이 우리나라 영재교육의 목적입니다."}},{"id":"60-11","type":"옳지 않은 것","q":"'영재판별검사에서 떨어졌어요. 검사를 구해서 연습할 수 있을까요?'에 대한 교안의 답변으로 옳지 않은 것은?","box":null,"choices":["검사지를 구해서 연습하기는 어렵다.","연습을 통해 좋은 점수를 얻더라도 그것으로 영재성을 증명할 수는 없다.","학생의 능력수준과 특성에 가장 적합한 맞춤형 교육이 가장 좋은 교육이다.","영재교육원 선발에 사용되는 검사지는 매년 바뀌어 같은 문제가 나오지 않는다.","연습을 통해 영재교육 프로그램에 참여하면 학생 본인에게 큰 도움이 된다."],"answer":5,"explain":"그런 노력을 통해 영재교육 프로그램에 참여한다고 해도 학생 본인에게 도움이 되지 않음. ①~④는 교안과 일치.","source":{"page":10,"section":"영재판별검사에서 떨어졌어요. 영재판별검사를 구해서 연습을 할 수 있을까요?","quote":"그런 노력을 통해 영재교육 프로그램에 참여한다고 해도 학생 본인에게 도움이 되지 않음"}},{"id":"60-12","type":"옳은 것","q":"'영재교육이 계층 간의 위화감을 심화시키는 건 아닐까요?'에 대한 교안의 답변으로 옳은 것은?","box":null,"choices":["영재는 주로 부유한 가정에서 태어난다.","영재교육으로 인해 계층 간 위화감이 심해졌다고 볼 수 있다.","소외계층 자녀들에게는 유료로 영재교육 기회를 제공하고 있다.","현재까지 대부분 사회경제적으로 더 나은 가정의 아이들이 영재성 계발 환경을 더 잘 제공받아 왔다.","교육기회는 능력에 따라 차등적으로 주어져야 한다."],"answer":4,"explain":"현재까지 대부분 사회경제적으로 더 나은 가정의 아이들이 환경을 더 잘 제공받아 왔음. ① 부유한 가정에서만 태어나는 것이 아님. ③ 무료로 제공. ② 볼 수 없음. ⑤ 모두에게 공정하게.","source":{"page":11,"section":"영재교육이 계층 간의 위화감을 심화시키는 건 아닐까요?","quote":"우리나라의 영재교육에서는 소외계층 자녀들의 영재성도 발굴하여 무료로 영재교육의 기회를 제공하고 있기 때문에 영재교육으로 인해 계층 간의 위화감이 심해진다고 볼 수는 없음"}},{"id":"60-13","type":"개념 찾기","q":"교안의 '영재교육 관련 에피소드1'에서 영재교육에 큰 뜻을 품고 학부모를 설득한 제퍼슨 초등학교 교장선생님은?","box":null,"choices":["렌줄리(Renzulli)","팔쿠지(Palcuzzi)","터먼(Terman)","스턴버그(Sternberg)","칙센트미하이(Csikszentmihalyi)"],"answer":2,"explain":"제퍼슨 초등학교의 팔쿠지(Palcuzzi) 교장선생님. 그는 학부모 중 비교적 온건한 사람들만 따로 초청해 계획을 설명하고 동의를 구하는 방책을 씀.","source":{"page":13,"section":"영재교육 관련 에피소드1 - 제퍼슨 초등학교 에피소드","quote":"제퍼슨 초등학교의 팔쿠지(Palcuzzi) 교장선생님은 영재교육에 큰 뜻을 품고 있는 분이었다."}},{"id":"60-14","type":"보기 조합","q":"\u003c보기\u003e 중 팔쿠지 교장선생님의 영재교육 계획에 포함된 것을 모두 고른 것은?","box":"ㄱ. 어린이들을 능력별로 반을 편성한다.\nㄴ. 하루 일과 중의 일부를 영재들을 위한 특별수업에 할애한다.\nㄷ. 능력별 진급제도를 도입한다.\nㄹ. 영재반 학부모에게 별도의 수업료를 징수한다.","choices":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"계획: ①능력별 반 편성 ②특별수업 할애 ③다른 학교 영재들과 특별활동 ④능력별 진급제도 ⑤전문훈련 받은 특수교사·특별수당. ㄹ 수업료 징수는 계획에 없음.","source":{"page":14,"section":"영재교육 관련 에피소드1 - 제퍼슨 초등학교 에피소드","quote":"①어린이들을 능력별로 반을 편성한다. ②하루 일과 중의 일부를 영재들을 위한 특별수업에 할애한다. ③영재반 어린이들에게는 다른 학교 영재들과 함께 특별활동에 참여할 기회를 준다. ④능력별 진급제도를 도입한다. ⑤영재들을 지도할 전문훈련을 받은 특수교사를 두고 이들에게 특별수당을 지급한다."}},{"id":"60-15","type":"옳지 않은 것","q":"팔쿠지 교장의 영재교육 계획 발표 후 학부모들이 제기한 질문(우려)으로 교안에 제시되지 않은 것은?","box":null,"choices":["영재반에 들어가지 못하는 사람은 열등감에 빠지지 않을까?","많은 돈이 들어갈 것 같은데 재원은 어떻게 확보할 것인가?","영재반 담당 선생님에게 특별수당을 주면 다른 선생님들이 불평하지 않겠는가?","능력별 반 편성과 진급은 교육평등주의에 어긋나는 것 아닌가?","영재반 학생들이 입시에서 불리해지지 않겠는가?"],"answer":5,"explain":"⑤는 교안에 없음. ①~④는 학부모들의 질문으로 교안에 제시됨(그 외 '웬만한 아이들은 기가 죽어 겁을 먹지 않을까', '왜 하필 우리 학교에서 모험적인 일을').","source":{"page":15,"section":"영재교육 관련 에피소드1 - 제퍼슨 초등학교 에피소드","quote":"\"영재반에 들어가지 못하는 사람은 어떻게 되는 것입니까? 그들은 열등감에 빠지지 않을까요?\""}},{"id":"60-16","type":"빈칸","q":"제퍼슨 초등학교 에피소드에서 학부모들이 제기한 우려이다. (   )에 들어갈 말로 알맞은 것은?","box":"\"우리가 알고 있기로는 능력별로 반을 편성하고 능력에 따라 진급을 시킨다는 것은 어린이들을 차별하는 것인데 이는 우리가 신봉하고 있는 (   )에 어긋나는 것은 아닌지요?\"","choices":["교육평등주의","교육수월성","능력주의","자유주의","민주주의"],"answer":1,"explain":"교안: '교육평등주의'. 팔쿠지 교장은 농구부도 교육평등주의에 어긋난다고 믿는 사람이 아무도 없다고 답함.","source":{"page":16,"section":"영재교육 관련 에피소드1 - 제퍼슨 초등학교 에피소드","quote":"이는 우리가 신봉하고 있는 교육평등주의에 어긋나는 것은 아닌지요?"}},{"id":"60-17","type":"사례","q":"제퍼슨 초등학교 에피소드에서 팔쿠지 교장선생님이 학부모들의 반대에 대응하기 위해 비유로 든 것은?","box":"팔쿠지 교장선생님은 학부형들의 기세가 다소 수그러질 때까지 끈기 있게 기다린 후에 침착한 어조로 입을 열었다.","choices":["학교 합창단","학교 축구부","학교 농구부","동물학교","학교 과학반"],"answer":3,"explain":"오랜 전통을 가진 농구부(학부모 성금으로 운영, 고장 전체의 자랑)를 예로 듦. ④ 동물학교는 에피소드2.","source":{"page":17,"section":"영재교육 관련 에피소드1 - 제퍼슨 초등학교 에피소드","quote":"여러분들이 잘 알고 계시다시피 우리 학교에는 오랜 전통을 가진 농구부가 있습니다."}},{"id":"60-18","type":"옳지 않은 것","q":"팔쿠지 교장선생님이 설명한 학교 농구부에 대한 내용으로 옳지 않은 것은?","box":null,"choices":["학부모들이 내주는 성금으로 운영된다.","신체조건이나 농구에 소질이 있는 학생들로 구성된다.","방과 후에 특수훈련을 받으며 다른 학교 선수들과 훈련·시합도 한다.","주전선수와 후보선수 선발 시 학년과 나이를 우선 고려한다.","교장 자신이 오래전에 창설하였다."],"answer":4,"explain":"선발 시 기량이나 장래성만을 참작하며 학년이나 나이를 따지는 일이 없음. ①②③⑤는 교안과 일치.","source":{"page":18,"section":"영재교육 관련 에피소드1 - 제퍼슨 초등학교 에피소드","quote":"이때에는 기량이나 장래성만을 참작하며 학년이나 나이를 따지는 일이라고는 없습니다."}},{"id":"60-19","type":"옳은 것","q":"영재교육 관련 에피소드2 '동물학교'에 대한 설명으로 옳은 것은?","box":null,"choices":["동물마다 다른 과목을 선택해 수강하도록 했다.","행정을 쉽게 하기 위해 모든 동물이 똑같은 과목을 수강하도록 했다.","교과목은 달리기, 오르기, 날기, 사냥으로 짜였다.","오리는 달리기 과외 덕분에 수영 점수도 올랐다.","오리는 수영을 선생님보다 못했다."],"answer":2,"explain":"행정을 쉽게 하기 위해 모든 동물이 똑같은 과목 수강. ③ 달리기, 오르기, 날기, 수영. ④ 물갈퀴가 닳아 수영 점수가 평균으로 떨어짐. ⑤ 선생님보다 수영을 잘함.","source":{"page":19,"section":"영재교육 관련 에피소드2 - 동물학교","quote":"동물학교는 행정을 쉽게 하기 위해 모든 동물이 똑같은 과목을 수강하도록 했다."}},{"id":"60-20","type":"개념 찾기","q":"동물학교 에피소드에서 '수영 때문에 신경쇠약에 걸린' 동물은?","box":null,"choices":["오리","토끼","다람쥐","독수리","뱀장어"],"answer":2,"explain":"토끼는 달리기를 가장 잘했지만 수영 때문에 신경쇠약. ① 오리: 달리기 낙제·수영 평균 하락. ③ 다람쥐: 날기 문제로 좌절. ④ 독수리: 문제학생 전락. ⑤ 뱀장어: 졸업생 대표.","source":{"page":20,"section":"영재교육 관련 에피소드2 - 동물학교","quote":"토끼는 달리기를 가장 잘했지만, 수영 때문에 신경쇠약에 걸렸다."}},{"id":"60-21","type":"사례","q":"동물학교 에피소드에서 다음 동물에 대한 설명이 바르게 연결된 것은?","box":null,"choices":["다람쥐 - 날기반 선생님이 땅에서 위로 날아오르도록 하는 바람에 좌절감에 빠졌다.","오리 - 오르기에서 탁월했지만 날기가 문제였다.","독수리 - 달리기 과외를 받다가 물갈퀴가 닳았다.","토끼 - 다른 수업은 참석하지 않아 문제학생으로 전락했다.","뱀장어 - 날기에서 타의 추종을 불허하는 솜씨를 보였다."],"answer":1,"explain":"다람쥐 설명이 맞음. ② 다람쥐의 특징. ③ 오리의 특징. ④ 독수리의 특징. ⑤ 독수리의 특징.","source":{"page":20,"section":"영재교육 관련 에피소드2 - 동물학교","quote":"다람쥐는 오르기에서 탁월한 성적을 냈지만 날기가 문제였다. 날기반 선생님이 땅에서 위로 날아오르도록 하는 바람에 다람쥐는 좌절감에 빠졌다."}},{"id":"60-22","type":"개념 찾기","q":"동물학교 에피소드에서 가장 높은 평균점수를 받아 학기말에 졸업생 대표가 된 동물은?","box":null,"choices":["오리","토끼","다람쥐","독수리","뱀장어"],"answer":5,"explain":"수영을 잘하고 달리기·오르기·날기는 약간 할 줄 알았던 뱀장어가 가장 높은 평균점수로 졸업생 대표가 됨.","source":{"page":21,"section":"영재교육 관련 에피소드2 - 동물학교","quote":"결국 수영을 잘하고, 달리기와 오르기, 날기는 약간 할 줄 알았던 뱀장어가 가장 높은 평균점수를 받아 학기말에 졸업생 대표가 되었다."}}]}]};

const MOCK_RANGES = [['all','전범위',1,60],['r1','1~15차시',1,15],['r2','16~30차시',16,30],['r3','31~45차시',31,45],['r4','46~60차시',46,60]];

/* ---------- storage ---------- */
function blank(){ return { ans:{}, wrong:{}, bm:{}, ui:{ autoResolve:true, group:0, mockRange:'all', mockCount:20, mockExam:true } }; }
function load(){
  const b = blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && typeof o === 'object') {
      b.ans = o.ans || {}; b.wrong = o.wrong || {}; b.bm = o.bm || {}; Object.assign(b.ui, o.ui || {});
    } }
  } catch (e) {}
  return b;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function pct(a,b){ return b ? Math.round(a/b*1000)/10 : 0; }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clip(s,n){ s = String(s||'').replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n)+'…' : s; }
function hl(text, kw){
  const t = esc(text); if (!kw) return t;
  const k = esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return t.replace(new RegExp(k,'gi'), m => '<mark>'+m+'</mark>');
}
function lessonStats(L){
  let done=0, ok=0; const n = L ? L.questions.length : 0;
  if (L) L.questions.forEach(q => { const a = S.ans[q.id]; if (a){ done++; if (a.c) ok++; } });
  return { n, done, ok, rate: pct(ok,done) };
}
function globalStats(){
  let done=0, ok=0; ALLQ.forEach(q => { const a = S.ans[q.id]; if (a){ done++; if (a.c) ok++; } });
  const wrongOpen = Object.keys(S.wrong).filter(id => QMAP[id] && !S.wrong[id].r).length;
  const bm = Object.keys(S.bm).filter(id => QMAP[id] && S.bm[id]).length;
  return { n: ALLQ.length, done, ok, rate: pct(ok,done), wrongOpen, bm };
}
function record(id, pick){
  const q = QMAP[id]; const c = pick === q.answer; const prev = S.ans[id] || {};
  S.ans[id] = { p: pick, c, n: (prev.n||0)+1, t: Date.now() };
  let note = '';
  if (!c){ S.wrong[id] = { r:false, t: Date.now(), k: ((S.wrong[id]||{}).k||0)+1 }; note = 'saved'; }
  else if (S.wrong[id] && !S.wrong[id].r && S.ui.autoResolve !== false){ S.wrong[id].r = true; S.wrong[id].rt = Date.now(); note = 'resolved'; }
  save();
  return { c, note };
}
function splitFile(f){
  const parts = String(f||'').split(/[\\/]/);
  return { name: parts.pop() || '', folder: parts.join('/') };
}

/* ---------- view state ---------- */
let V = { screen:'home' };
let SES = null; // quiz session
let resetArm = false, resetTimer = null;

function go(screen, extra){

    (back ? '<button class="hdr-back" id="btn-back" data-act="back" type="button">← 홈</button>' : '') +
    '<div class="hdr-title">' + esc(title) + (sub ? '<span class="hdr-sub">' + esc(sub) + '</span>' : '') + '</div>';
}

  lessonsWith.forEach(n => { h += '<option value="' + n + '"' + (String(n)===String(f) ? ' selected' : '') + '>' + n + '차시 · ' + esc(clip(LMAP[n].title,24)) + '</option>'; });
  h += '</select></div>';
  h += '<label class="check" for="wrong-showres"><input type="checkbox" id="wrong-showres" data-act="wrong-showres"' + (showAll ? ' checked' : '') + '> 해결된 문항도 보기</label>';
  h += '<label class="check" for="wrong-auto"><input type="checkbox" id="wrong-auto" data-act="wrong-auto"' + (S.ui.autoResolve !== false ? ' checked' : '') + '> 다시 풀어 맞히면 \'해결됨\' 처리</label>';

function renderSearch(){
  header('검색', '문항·보기·해설·근거', true);
  return '<div class="stack"><div class="field"><label for="search-input">키워드</label><input class="input" id="search-input" type="search" inputmode="search" autocomplete="off" placeholder="예: 렌줄리, 세 고리, 2000년" value="' + esc(V.kw || '') + '"></div><div id="search-results" aria-live="polite">' + searchResults() + '</div></div>';
}
function searchResults(){
  const kw = (V.kw || '').trim();
  if (kw.length < 1) { V._list = []; return '<p class="muted small">한 글자 이상 입력하세요.</p>'; }
  const k = kw.toLowerCase();
  const hits = ALLQ.filter(q => {
    const s = q.source || {};
    return [q.q, q.box, (q.choices||[]).join(' '), q.explain, s.quote, s.section].join('\n').toLowerCase().indexOf(k) >= 0;
  }).map(q => q.id);
  V._list = hits;
  if (!hits.length) return '<div class="empty">검색 결과가 없습니다.</div>';
  const shown = hits.slice(0, 150);
  return '<p class="muted small">' + hits.length + '건' + (hits.length > 150 ? ' (상위 150건 표시)' : '') + ' · 누르면 해당 문항부터 풀기</p>' + qList(shown, 'search-item', () => '', kw);
}

/* ---------- quiz ---------- */
function startSession(ids, opts){
  if (!ids.length) return;
  SES = Object.assign({ list: ids.slice(), i: 0, mode: 'learn', title: '', picks: {}, rec: {}, submitted: false, armSubmit: false, grid: false }, opts || {});
  go('quiz');
}
function renderQuiz(){
  const s = SES; const id = s.list[s.i]; const q = QMAP[id]; const N = s.list.length;
  const exam = s.mode === 'exam';
  header(s.title, exam ? '시험 모드' : '학습 모드', true);
  const pick = s.picks[id];
  const graded = !exam && pick != null;
  let h = '<div class="qhead"><div class="qcount">' + (s.i+1) + ' <span>/ ' + N + '</span></div><div class="qbar" aria-hidden="true"><span style="width:' + ((s.i+1)/N*100) + '%"></span></div></div>';
  h += '<div class="qchips"><span class="chip chip-navy">' + q._l + '차시</span><span class="chip">' + esc(q.type || '') + '</span><span class="sp"></span>' +
       '<button type="button" class="gridbtn" id="btn-grid" data-act="grid" aria-expanded="' + !!s.grid + '">문항표</button>' +
       '<button type="button" class="bm" id="btn-bm" data-act="bm" aria-pressed="' + !!S.bm[id] + '">' + (S.bm[id] ? '★ 북마크됨' : '☆ 북마크') + '</button></div>';
  if (s.grid){
    h += '<div class="qgrid" id="qgrid">';
    s.list.forEach((qid, i) => {
      const p = s.picks[qid]; let cls = '';
      if (p != null) cls = exam ? 'done' : (p === QMAP[qid].answer ? 'ok' : 'ng');
      if (i === s.i) cls += ' cur';
      h += '<button type="button" id="jump-' + i + '" data-act="jump" data-i="' + i + '" class="' + cls + '" aria-label="' + (i+1) + '번 문항">' + (i+1) + '</button>';
    });
    h += '</div>';
  }
  h += '<p class="stem"><span class="qn">' + (s.i+1) + '.</span>' + esc(q.q) + '</p>';
  if (q.box) h += '<div class="box"><div class="box-label">보 기</div><div class="box-body">' + esc(q.box) + '</div></div>';
  h += '<ol class="choices" aria-label="선지">';
  q.choices.forEach((c, k) => {
    const n = k + 1; let cls = 'choice'; let mark = '';
    if (graded){
      if (n === q.answer){ cls += ' correct'; mark = '정답'; }
      else if (n === pick){ cls += ' wrong'; mark = '내 선택'; }
      else cls += ' dim';
    } else if (pick === n) cls += ' picked';
    h += '<li><button type="button" class="' + cls + '" id="choice-' + n + '" data-act="pick" data-n="' + n + '"' + (graded ? ' aria-disabled="true"' : '') + ' aria-pressed="' + (pick === n) + '">' +
      '<span class="cn">' + NUMS[k] + '</span><span class="ct">' + esc(c) + '</span>' + (mark ? '<span class="cm">' + mark + '</span>' : '') + '</button></li>';
  });
  h += '</ol>';
  if (graded) h += explainPanel(q, pick, s.rec[id]);

  // bottom bar
  const last = s.i === N - 1;
  let next;
  if (exam){
    if (last){
      const un = s.list.filter(x => s.picks[x] == null).length;
      next = s.armSubmit
        ? '<button type="button" class="btn btn-danger wide" id="btn-submit-yes" data-act="submit-yes">' + (un ? '미응답 ' + un + '개 · ' : '') + '제출 확정</button>'
        : '<button type="button" class="btn btn-primary wide" id="btn-submit" data-act="submit">제출하기</button>';
    } else next = '<button type="button" class="btn btn-primary wide" id="btn-next" data-act="next">다음 →</button>';
  } else {
    next = last ? '<button type="button" class="btn btn-primary wide" id="btn-finish" data-act="finish">끝내기</button>'
                : '<button type="button" class="btn btn-primary wide" id="btn-next" data-act="next">다음 →</button>';
  }
  $('bar-slot').innerHTML = '<nav class="bbar" aria-label="문항 이동"><div class="bbar-in"><button type="button" class="btn" id="btn-prev" data-act="prev"' + (s.i === 0 ? ' disabled' : '') + '>← 이전</button>' + next + '</div></nav>';
  return h;
}
function explainPanel(q, pick, rec){
  const ok = pick === q.answer;
  let vcls = pick == null ? 'na' : (ok ? 'ok' : 'ng');
  let vt = pick == null ? '미응답 · 정답 ' + NUMS[q.answer-1] : (ok ? '정답입니다 · ' + NUMS[q.answer-1] : '오답 · 정답은 ' + NUMS[q.answer-1]);
  let note = '';
  if (rec === 'saved') note = '오답노트에 저장됨';
  else if (rec === 'resolved') note = '오답노트 해결됨';
  let h = '<section class="explain" aria-label="해설"><div class="verdict ' + vcls + '"><span>' + vt + '</span>' + (note ? '<span class="note">' + note + '</span>' : '') + '</div>';
  h += '<div class="ex-body">' + esc(q.explain || '') + '</div>';
  const src = q.source || {}; const L = LMAP[q._l]; const f = splitFile(L && L.file);
  h += '<div class="src"><div class="src-h">📄 <b>' + esc(f.name || (pad(q._l) + '.pdf')) + '</b>' + (f.folder ? ' (' + esc(f.folder) + ')' : '') +
       (src.page != null ? ' · p.' + esc(src.page) : '') + (src.section ? ' · ' + esc(src.section) : '') + '</div>' +
       (src.quote ? '<blockquote>' + esc(src.quote) + '</blockquote>' : '') + '</div>';
  return h + '</section>';
}

function renderResult(){
  const r = V.result;
  header(r.title, r.exam ? '시험 결과' : '학습 결과', true);
  const pass = r.score >= 96;
  let h = '<section class="card score"><div class="muted small">' + (r.exam ? '100점 환산 점수' : '이번 학습 정답률') + '</div>' +
    '<div class="num ' + (pass ? 'pass' : 'fail') + '">' + r.score + '</div>' +
    '<div class="muted" style="margin-top:6px">' + r.ok + ' / ' + r.n + ' 정답' + (r.un ? ' · 미응답 ' + r.un : '') + '</div>' +
    '<div class="scale" aria-hidden="true"><span class="fill" style="width:' + r.score + '%"></span><span class="line" style="left:96%"></span><span class="lbl" style="left:96%">96</span></div>' +
    '<div style="font-weight:700;color:var(--' + (pass ? 'green' : 'red') + ')">' + (pass ? '96점 기준 통과' : '96점 기준 미달 · ' + (Math.ceil(r.n * 0.96) - r.ok) + '문항 더 맞혀야 함') + '</div></section>';
  h += '<div class="row" style="margin-top:12px">' +
    (r.wrong.length ? '<button type="button" class="btn btn-primary" style="flex:1" id="btn-retry-wrong" data-act="retry-wrong">틀린 ' + r.wrong.length + '문항 다시 풀기</button>' : '') +
    '<button type="button" class="btn" style="flex:1" id="btn-home" data-act="back">홈으로</button></div>';
  h += '<h2 class="sec">' + (r.wrong.length ? '틀린 문항 · 눌러서 해설 보기' : '모두 맞혔습니다') + '</h2>';
  r.wrong.forEach((w, i) => {
    const q = QMAP[w.id];
    h += '<details class="item" id="res-' + i + '"><summary><span class="chip chip-red">' + (w.idx+1) + '번</span><span class="sum-t">' + esc(clip(q.q, 70)) + '</span><span class="car">' + q._l + '차시</span></summary><div class="inner">';
    h += '<p class="stem" style="font-size:16px;margin-top:12px">' + esc(q.q) + '</p>';
    if (q.box) h += '<div class="box"><div class="box-label">보 기</div><div class="box-body">' + esc(q.box) + '</div></div>';
    h += '<ol class="choices">' + q.choices.map((c, k) => {
      const n = k+1; let cls = 'choice'; let m = '';
      if (n === q.answer){ cls += ' correct'; m = '정답'; } else if (n === w.pick){ cls += ' wrong'; m = '내 선택'; } else cls += ' dim';
      return '<li><div class="' + cls + '"><span class="cn">' + NUMS[k] + '</span><span class="ct">' + esc(c) + '</span>' + (m ? '<span class="cm">' + m + '</span>' : '') + '</div></li>';
    }).join('') + '</ol>';
    h += explainPanel(q, w.pick, null) + '</div></details>';
  });
  return h;
}

function finishSession(){
  const s = SES; const exam = s.mode === 'exam';
  let ok = 0, un = 0; const wrong = [];
  s.list.forEach((id, idx) => {
    const p = s.picks[id]; const q = QMAP[id];
    if (p == null){ un++; if (exam) wrong.push({ id, idx, pick: null }); return; }
    if (exam) record(id, p);
    if (p === q.answer) ok++; else wrong.push({ id, idx, pick: p });
  });
  const n = exam ? s.list.length : (s.list.length - un);
  V = { screen: 'result', result: { title: s.title, exam, ok, n: n, un: exam ? un : 0, score: pct(ok, n), wrong } };
  if (!exam && !n){ go('home'); return; }
  SES = null; render(); try { window.scrollTo(0,0); } catch(e){}
}

/* ---------- render ---------- */
function render(){
  $('bar-slot').innerHTML = '';
  let h;
  switch (V.screen){
    case 'mock': h = renderMock(); break;
    case 'wrong': h = renderWrong(); break;
    case 'bm': h = renderBm(); break;
    case 'sum': h = renderSum(); break;
    case 'search': h = renderSearch(); break;
    case 'quiz': h = SES ? renderQuiz() : renderHome(); break;
    case 'result': h = renderResult(); break;
    default: h = renderHome();
  }
  const app = $('app');
  app.className = 'wrap' + (V.screen === 'quiz' ? ' has-bar' : '');
  app.innerHTML = h;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.getAttribute('data-act');
  const num = k => +b.getAttribute(k);
  switch (act){
    case 'back': SES = null; resetArm = false; go('home'); break;
    case 'go-lessons': { const el = $('lessons-h'); if (el) el.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); break; }
    case 'go-mock': go('mock'); break;
    case 'go-wrong': go('wrong', { filter: 'all', showResolved: false }); break;
    case 'go-bm': go('bm'); break;
    case 'go-sum': go('sum'); break;
    case 'go-search': go('search', { kw: '' }); setTimeout(() => { const i = $('search-input'); if (i) i.focus(); }, 0); break;
    case 'group': S.ui.group = num('data-g'); save(); { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'lesson': {
      const L = LMAP[num('data-l')]; if (!L) break;
      const ids = L.questions.map(q => q.id);
      let start = ids.findIndex(id => !S.ans[id]); if (start < 0) start = 0;
      startSession(ids, { title: L.lesson + '차시 · ' + L.title, i: start });
      break;
    }
    case 'reset': resetArm = true; render(); clearTimeout(resetTimer); resetTimer = setTimeout(() => { resetArm = false; if (V.screen === 'home') { const y = window.scrollY; render(); window.scrollTo(0,y); } }, 6000); { const n = $('btn-reset-no'); if (n) n.focus(); } break;
    case 'reset-no': resetArm = false; clearTimeout(resetTimer); { const y = window.scrollY; render(); window.scrollTo(0,y); } break;
    case 'reset-yes': { resetArm = false; clearTimeout(resetTimer); const ui = S.ui; S = blank(); S.ui.group = ui.group; save(); go('home'); break; }
    case 'mock-range': S.ui.mockRange = b.getAttribute('data-v'); save(); render(); break;
    case 'mock-count': S.ui.mockCount = num('data-v'); save(); render(); break;
    case 'mock-start': {
      const rng = MOCK_RANGES.find(r => r[0] === S.ui.mockRange) || MOCK_RANGES[0];
      let pool = shuffle(ALLQ.filter(q => q._l >= rng[2] && q._l <= rng[3]).map(q => q.id));
      if (S.ui.mockCount) pool = pool.slice(0, S.ui.mockCount);
      startSession(pool, { title: '모의고사 · ' + rng[1] + ' ' + pool.length + '문항', mode: S.ui.mockExam ? 'exam' : 'learn' });
      break;
    }
    case 'wrong-start': { const ids = V._list.filter(id => !S.wrong[id].r); startSession(ids, { title: '오답노트 다시 풀기' }); break; }
    case 'wrong-item': startSession(V._list, { title: '오답노트', i: num('data-i') }); break;
    case 'bm-start': startSession(V._list, { title: '북마크' }); break;
    case 'bm-item': startSession(V._list, { title: '북마크', i: num('data-i') }); break;
    case 'search-item': startSession(V._list.slice(0, 150), { title: '검색: ' + V.kw, i: num('data-i') }); break;
    case 'pick': {
      const s = SES; const id = s.list[s.i]; const n = num('data-n');
      if (s.mode === 'exam'){ s.picks[id] = n; s.armSubmit = false; const y = window.scrollY; render(); window.scrollTo(0,y); }
      else if (s.picks[id] == null){
        s.picks[id] = n; s.rec[id] = record(id, n).note;
        const y = window.scrollY; render(); window.scrollTo(0,y);
        const ex = document.querySelector('.explain');
        if (ex && ex.getBoundingClientRect().top > window.innerHeight - 120) ex.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      }
      break;
    }
    case 'bm': { const id = SES.list[SES.i]; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save(); const y = window.scrollY; render(); window.scrollTo(0,y); break; }
    case 'grid': { SES.grid = !SES.grid; const y = window.scrollY; render(); window.scrollTo(0,y); break; }
    case 'jump': SES.i = num('data-i'); SES.armSubmit = false; render(); window.scrollTo(0,0); break;
    case 'prev': if (SES.i > 0){ SES.i--; SES.armSubmit = false; render(); window.scrollTo(0,0); } break;
    case 'next': if (SES.i < SES.list.length - 1){ SES.i++; render(); window.scrollTo(0,0); } break;
    case 'submit': SES.armSubmit = true; render(); { const x = $('btn-submit-yes'); if (x) x.focus(); } break;
    case 'submit-yes': case 'finish': finishSession(); break;
    case 'retry-wrong': { const r = V.result; startSession(r.wrong.map(w => w.id), { title: '틀린 문항 다시 풀기' }); break; }
  }
});
document.addEventListener('change', e => {
  const t = e.target; const act = t.getAttribute && t.getAttribute('data-act');
  if (act === 'mock-exam'){ S.ui.mockExam = t.checked; save(); }
  else if (act === 'wrong-filter'){ V.filter = t.value; render(); }
  else if (act === 'wrong-showres'){ V.showResolved = t.checked; render(); }
  else if (act === 'wrong-auto'){ S.ui.autoResolve = t.checked; save(); }
});
let sTimer = null;
document.addEventListener('input', e => {
  if (e.target.id !== 'search-input') return;
  V.kw = e.target.value;
  clearTimeout(sTimer);
  sTimer = setTimeout(() => { const r = $('search-results'); if (r) r.innerHTML = searchResults(); }, 180);
});
document.addEventListener('keydown', e => {
  if (V.screen !== 'quiz' || !SES) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.key >= '1' && e.key <= '5'){ const c = $('choice-' + e.key); if (c) c.click(); }
  else if (e.key === 'ArrowRight'){ const n = $('btn-next'); if (n) n.click(); }
  else if (e.key === 'ArrowLeft'){ const p = $('btn-prev'); if (p && !p.disabled) p.click(); }
});

render();
})();
</script>
</body>
</html>
