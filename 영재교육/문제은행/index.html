 선발에 관한 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"• GED 추천시스템에 의한 교사관찰추천제에 의한 선발\n• 영재학급과 (   ) 단위학교 영재교육원의 경우 GED 활용 여부 자율선택","choices":["과학분야","수학분야","정보분야","인문사회분야","예술분야"],"answer":5,"explain":"영재학급과 '예술분야' 단위학교 영재교육원은 GED 활용 여부를 자율선택한다.","source":{"page":21,"section":"서울특별시교육청 영재선발 - 나. 영재교육 대상자 선발","quote":"영재학급과 예술분야 단위학교 영재교육원의 경우 GED 활용 여부 자율선택"}},{"id":"30-24","type":"옳은 것","q":"서울특별시교육청 영재교육대상자 선발 전형 단계의 순서로 옳은 것은?","box":null,"choices":["안내 → 공고 → 자기추천 → 학교추천 → 창의적 문제해결력 및 면접 평가 → 최종 합격자 발표","안내 → 공고 → 학교추천 → 자기추천 → 창의적 문제해결력 및 면접 평가 → 최종 합격자 발표","공고 → 안내 → 자기추천 → 학교추천 → 창의적 문제해결력 및 면접 평가 → 최종 합격자 발표","안내 → 공고 → 자기추천 → 창의적 문제해결력 및 면접 평가 → 학교추천 → 최종 합격자 발표","안내 → 자기추천 → 공고 → 학교추천 → 창의적 문제해결력 및 면접 평가 → 최종 합격자 발표"],"answer":1,"explain":"선발 전형 단계: 안내(선발 세부 추진 계획) → 공고(공문, 홈페이지; 지원서 접수 시작일 1개월 전) → 자기추천(GED 추천시스템 서류 작성) → 학교추천(담임 및 학교추천위원회) → 창의적 문제해결력 및 면접 평가 → 최종 합격자 발표(점수 합산 및 선정심사위원회 심의).","source":{"page":22,"section":"서울특별시교육청 영재선발 - 선발 전형 단계별 추진 내용","quote":"안내 선발 세부 추진 계획 / 공고 공문, 홈페이지 / 자기추천 / 학교추천 담임 및 학교추천위원회 추천 / 창의적 문제해결력 및 면접 평가 / 최종 합격자 발표 점수 합산 및 선정심사위원회 심의"}},{"id":"30-25","type":"옳지 않은 것","q":"서울특별시교육청 영재교육대상자 선발의 자기추천 및 학교추천에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재교육을 희망하는 학생이 GED 추천시스템에 회원가입 후 지원하는 기관별 지정 서류를 작성한다.","서울시 교육청 소속 학교의 재학생에 한해 지원 가능하다.","담임교사가 작성한 체크리스트는 추천 참고자료일 뿐 점수로 반영되지 않는다.","담임(교과 교사)은 GED에서 지원자를 대상으로 모집요강에 제시된 체크리스트 2종을 작성한다.","학교추천위원회는 담임 체크리스트 등을 참고하여 최종 추천한다."],"answer":3,"explain":"교안은 '체크리스트는 점수로 반영됨'이라고 명시하며, 최종 합격자도 체크리스트, 창의적 문제해결력, 면접 점수를 합산해 선발한다. ①②④⑤는 교안과 일치한다.","source":{"page":22,"section":"서울특별시교육청 영재선발 - 선발 전형 단계별 추진 내용","quote":"담임교사는 체크리스트를 작성하고, 학교추진위원회에서 최종추천(체크리스트는 점수로 반영됨)"}},{"id":"30-26","type":"사례","q":"다음 사례의 학생 A에게 적용될 선발 결과로 옳은 것은?","box":"서울특별시교육청 소속 학교에 재학 중인 학생 A는 교육지원청 영재교육원에 지원하여 학교추천위원회의 추천을 받았고, 창의적 문제해결력 평가에서 높은 점수를 받았다. 그러나 개인 사정으로 면접 평가에 응시하지 않았다.","choices":["창의적 문제해결력 점수와 체크리스트 점수만 합산하여 선발 여부를 결정한다.","추가 모집 기간에 면접을 다시 볼 수 있다.","체크리스트 점수가 높으면 면접을 면제받는다.","소외계층 우선 선발 대상으로 전환된다.","면접 미응시자로 불합격 처리된다."],"answer":5,"explain":"면접 평가는 창의적 문제해결력 평가 응시자 전원에 대하여 실시하며, '면접 미응시자는 불합격 처리'된다. ①~④는 교안에 없는 내용이다.","source":{"page":24,"section":"서울특별시교육청 영재선발 - 면접 평가","quote":"창의적 문제해결력 평가 응시자 전원에 대하여 면접 평가를 실시 • 체크리스트, 창의적 문제해결력, 면접 평가 점수를 합산하여 최종합격자 선발 • 최종 합격자 선정 시 학교별 인원 제한 • 면접 미응시자는 불합격 처리"}},{"id":"30-27","type":"옳은 것","q":"서울특별시교육청 영재교육대상자 선발의 창의적 문제해결력 평가 및 면접 평가에 대한 설명으로 옳은 것은?","box":null,"choices":["창의적 문제해결력 평가는 지원자 전원을 대상으로 실시한다.","면접 평가는 창의적 문제해결력 평가 상위자만을 대상으로 실시한다.","최종 합격자 선정 시 학교별 인원 제한을 두지 않는다.","최종 합격자는 면접 평가 점수만으로 선발한다.","체크리스트, 창의적 문제해결력, 면접 평가 점수를 합산하여 최종합격자를 선발한다."],"answer":5,"explain":"최종합격자는 체크리스트, 창의적 문제해결력, 면접 평가 점수를 합산하여 선발한다. ① 학교추천위원회 추천자를 대상으로 실시 ② 창의적 문제해결력 평가 응시자 전원 면접 ③ 학교별 인원 제한 있음 ④ 세 점수 합산.","source":{"page":24,"section":"서울특별시교육청 영재선발 - 창의적 문제해결력 평가","quote":"학교추천위원회 추천자를 대상으로 창의적 문제해결력 평가를 실시"}},{"id":"30-28","type":"보기 조합","q":"서울특별시교육청 영재교육대상자 선발 시 유의사항으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 영재교육진흥법 시행령에 의거 원서 접수일 1개월 전에 공고한다.\nㄴ. 추가 모집의 경우 7일 전에 공고한다.\nㄷ. 소외계층은 정원의 20%까지 우선 선발한다.\nㄹ. 영재교육 소외계층 범위는 최종 합격자 발표 후 별도로 공지한다.","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ·ㄴ·ㄷ은 교안 그대로이다. ㄹ: 영재교육 소외계층 범위는 '선발요강 공고 시 포함하여 발표'한다. 참고로 교육지원형 및 단위학교, 대학 부설(일부) 영재교육원 선발 요강 공고는 2023. 9월 예정이었다.","source":{"page":25,"section":"서울특별시교육청 영재선발 - 선발 시 유의사항","quote":"원서 접수일 1개월 전 공고 • 추가 모집의 경우 7일 전 공고 ... • 정원의 20%까지 우선 선발 • 영재교육 소외계층 범위: 선발요강 공고 시 포함하여 발표"}},{"id":"30-29","type":"사례","q":"다음 사례에 대한 판단으로 옳은 것은? (서울특별시교육청 선발 시 유의사항 기준)","box":"학생 B는 교육지원청 영재교육원에 합격하였다. 이후 선발이 진행되는 다른 학교의 영재학급에도 지원하여 두 곳에서 동시에 영재교육을 받으려고 한다.","choices":["영재교육원에 합격한 경우 추후에 선발이 진행되는 타 영재교육원, 영재학급에 지원할 수 없다.","영재학급은 영재교육원과 별개 기관이므로 지원할 수 있다.","학교추천위원회의 승인을 받으면 두 기관에 등록할 수 있다.","영재학급은 GED를 활용하지 않으므로 중복 등록 제한이 없다.","협력학교 소속 학생은 2곳까지 등록할 수 있다."],"answer":1,"explain":"영재교육기관 중복등록 불가: 학생은 1곳의 영재교육기관만 등록 가능하며, 영재교육원에 합격한 경우 추후에 선발이 진행되는 타 영재교육원, 영재학급 지원이 불가하다. ②~⑤는 교안에 없는 예외이다.","source":{"page":26,"section":"서울특별시교육청 영재선발 - 영재교육기관 중복등록 불가","quote":"학생은 1곳의 영재교육기관만 등록 가능함 • 영재교육원에 합격한 경우 추후에 선발이 진행되는 타 영재교육원, 영재학급 지원 불가"}},{"id":"30-30","type":"빈칸","q":"다음은 서울특별시교육청 영재교육대상자 선발 시 유의사항(정원)이다. (   )에 들어갈 말로 알맞은 것은?","box":"교육지원청 영재교육원 협력학교는 해당 학교 소속 학생을 선발 인원의 (   ) 이내 정원 내에서 선발할 수 있음","choices":["5%","10%","15%","20%","30%"],"answer":4,"explain":"협력학교는 해당 학교 소속 학생을 선발 인원의 20% 이내 정원 내에서 선발할 수 있다. (소외계층 우선 선발도 '정원의 20%까지'이므로 함께 기억)","source":{"page":26,"section":"서울특별시교육청 영재선발 - 선발 시 유의사항: 정원","quote":"교육지원청 영재교육원 협력학교는 해당 학교 소속 학생을 선발 인원의 20% 이내 정원 내에서 선발할 수 있음"}},{"id":"30-31","type":"옳지 않은 것","q":"서울특별시교육청의 선발과정 운영 지원(선발도구 개발, 학교추천위원회 구성)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["선발도구는 전문기관에서 개발한다.","개발 도구에는 창의적 문제해결력 선별도구, 면접 도구 등이 있다.","개발된 선발도구는 교육지원청 영재교육원(협력학교)에 적용한다.","단위학교에 설치된 영재교육원 및 영재학급도 전문기관이 개발한 선발도구를 의무적으로 적용한다.","학교별 학교추천위원회는 4인 내외로 구성하며 위원장은 교감이 맡는다."],"answer":4,"explain":"단위학교에 설치된 영재교육원 및 영재학급은 선발도구를 '자체 개발'한다. ①②③⑤는 교안과 일치한다(학교추천위원회: 4인 내외, 위원장 교감, 간사 선임, 외부위원 포함 가능).","source":{"page":27,"section":"서울특별시교육청 영재선발 - 선발과정 운영지원","quote":"개발된 선발도구 적용 기관: 교육지원청 영재교육원(협력학교) • 단위학교에 설치된 영재교육원 및 영재학급은 선발도구 자체 개발"}},{"id":"30-32","type":"빈칸","q":"다음은 서울특별시교육청 영재교육대상자 선발의 '담임 및 학교추천위원회 추천'에 관한 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"• 담임(교과 교사)는 GED에서 지원자를 대상으로 모집요강에 제시된 체크리스트 (   )을 작성\n• 학교추천위원회는 담임 체크리스트 등을 참고하여 최종 추진","choices":["1종","2종","3종","4종","5종"],"answer":2,"explain":"담임(교과 교사)은 GED에서 모집요강에 제시된 체크리스트 2종을 작성한다. 자기추천은 영재교육을 희망하는 학생이 GED 추천시스템에 회원가입 후 지원 기관별 지정 서류를 작성하며, 서울시 교육청 소속 학교의 재학생에 한해 지원 가능하다.","source":{"page":23,"section":"서울특별시교육청 영재선발 - 담임 및 학교추천위원회 추천","quote":"담임( 교과 교사)는 GED에서 지원자를 대상으로 모집요강에 제시된 체크리스트 2종을 작성 • 학교추천위원회는 담임 체크리스트 등을 참고하여 최종 추진"}},{"id":"30-33","type":"개념 찾기","q":"교안에서 홈페이지 주소 https://kofac.re.kr 과 함께 소개되었으며, 대학부설 과학영재교육원에 예산을 지원하는 기관은?","box":null,"choices":["한국교육개발원(KEDI)","대학부설 과학영재교육원 공동홈페이지","한국과학기술원(KAIST)","한국과학창의재단","서울특별시교육청"],"answer":4,"explain":"한국과학창의재단(https://kofac.re.kr)이다. 대학부설 과학영재교육원은 과학기술부 → 한국과학창의재단 예산 지원을 받는다(14쪽). ① 영재교육종합데이터베이스 https://ged.kedi.re.kr 운영, 시도교육청 영재교육원 연구지원 ② https://seit.kr ③ 12개 사이버영재교육원 소속 기관 ⑤ 영재선발 사례 기관.","source":{"page":18,"section":"한국과학창의재단","quote":"https://kofac.re.kr 한국과학창의재단 / 출처: 한국과학창의재단 홈페이지"}}]},{"lesson":31,"title":"우리나라 영재교육 20년 연구동향","file":"4. 교안 (31~60)[1] (1)/31.pdf","summary":["영재교육진흥종합계획: 1차(03~07) 도입기 – 「영재교육진흥법」 제정·시행('02~)에 따라 영재학교·영재교육원·영재학급 통한 영재발굴·육성 체계구축 / 2차(08~12) 도약기 – 영재교육 수혜학생 1만 명(전체 1%)까지 확대 목표","3차(13~17) 발전기 – 교육내용·방법 개선, 기관 운영 고도화, 교원 전문성 강화 / 4차(18~22) 정체기 – 희망하는 모든 학생에게 기회, '선발'에서 '교육'으로 패러다임 전환 시도 / 5차(23~27) 현재 – 고도영재 맞춤형 지원, 숨은 인재 성장지원체계, 디지털 분야 등 영역 확대, 성과관리","영재교육 대상자: 2003년 19,974명 → 2013년 121,421명(최다) → 2022년 72,518명(1.37%) / 비율 최고 2017년 1.91% (출처: 2022 영재교육통계연보)","기관(2022): 영재학교 8, 과학고 20, 교육청 영재교육원 250, 대학부설 90, 영재학급 1,118, 합계 1,486 → 초등에서 중고등으로 갈수록 줄어드는 피라미드식 구조 / 기관 수 2003년 400 → 2013년 3,011(정점) → 2022년 1,486 / 교·강사 2014년 27,263명(최다) → 2022년 18,340명","정점: 2차 계획 끝나던 2012년 ~ 3차 초반부(13~14). 이후 정체기·쇠퇴기. 장애요인: 학령인구 감소, '소수엘리트교육' 부정적 인식, 상급학교 진학 시 이력 미반영, 일반교육과의 차별성 부족, 기관 내실화·특성화 한계","순기능: 미래사회 경쟁력 높이는 우수한 인재 배출 / 역기능: 엘리트 중심 교육, 지나친 경쟁, 사교육 열풍 → 역기능 극소화·순기능 극대화","학술대회 주요 이슈: 도입기 – 영재성 개념·판별·교육·프로그램 개발 등 도입 안착 / 도약기 – 한 차원 업그레이드 / 발전기 – 영재교육법 제정 10년 넘기는 시점 패러다임 전환 논의 / 정체기 – 미래사회 역량과 방안 모색, 사회적 분위기 계몽","학술지 논문 276편: ① 방향·정책(31)·성과관리(2)=33 / ② 개념(10)·판별(23)=33 / ③ 교육과정(14)·교수학습(18)·프로그램(50)=82 / ④ 교사(21)·학부모(6)=27 / ⑤ 심리적 요인 88(최다) / ⑥ 다문화·소외·미성취 13","범주 내용: 세종시대 개별화 교육·토의식 교수법 / 초·중·고·대학 간 수직적 연계, 거점센터 통한 수평적 연계 / 터먼·골턴·스피어만 지능위주, 미연방정부 다영역, 렌줄리 지능·창의성·과제집착력 다차원 / 호모엠파티쿠스(공감) / 교사 = 안내자·촉진자·멘토, 공동 학습자 / 소외계층 귀인 오류(사회문화적 귀인), 브릿지 프로그램","과제: 환경자극 반드시 80%가 아니라 30% 또는 20%일 수 있음, 이론성–현장성 부조화 극복(전문성과 집행성 간극 축소), 고도(진성) 영재교육 도입(상·중·하 중 극단적 상), 소외계층·다문화 연구, 심리사회적 건강(웰빙) 프로그램, 영재 부모 연구"],"questions":[{"id":"31-01","type":"옳은 것","q":"영재교육진흥종합계획의 차수와 교안의 시기 구분이 바르게 연결된 것은?","box":null,"choices":["1차 종합계획(03~07) – 도약기","2차 종합계획(08~12) – 발전기","3차 종합계획(13~17) – 발전기","4차 종합계획(18~22) – 도입기","5차 종합계획(23~27) – 정체기"],"answer":3,"explain":"교안: 1차 도입기, 2차 도약기, 3차 발전기, 4차 정체기, 5차 현재. 1차는 도입기, 2차는 도약기, 4차는 정체기, 5차는 '현재'로 구분되므로 나머지는 틀림.","source":{"page":3,"section":"01. 한국영재교육의 도입기, 도약기, 발전기, 정체기 그리고 현재 – 영재교육진흥종합계획","quote":"3차 종합계획(13~17) 발전기 영재교육의 질적 수준 제고를 위해 교육내용‧방법 개선, 기관 운영 고도화, 교원 전문성 강화 등 추진"}},{"id":"31-02","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"2차 종합계획(08~12) 도약기: 개인의 잠재력 발견을 통한 국가경쟁력 강화를 위해 영재교육 수혜학생을 (   )까지 확대하는 목표를 설정","choices":["1만 명(전체 1%)","5만 명(전체 0.5%)","10만 명(전체 2%)","1만 명(전체 0.1%)","20만 명(전체 3%)"],"answer":1,"explain":"교안 표기 그대로 '1만 명(전체 1%)'. 나머지 수치·비율은 교안에 없음.","source":{"page":3,"section":"영재교육진흥종합계획","quote":"2차 종합계획(08~12) 도약기 개인의 잠재력 발견을 통한 국가경쟁력 강화를 위해 영재교육 수혜학생을 1만 명(전체 1%)까지 확대하는 목표를 설정"}},{"id":"31-03","type":"개념 찾기","q":"다음 설명에 해당하는 영재교육진흥종합계획은?","box":"희망하는 모든 학생에게 영재교육 기회를 제공하는 등 '선발'에서 '교육'으로의 영재교육 패러다임 전환 시도","choices":["1차 종합계획","2차 종합계획","3차 종합계획","4차 종합계획","5차 종합계획"],"answer":4,"explain":"4차 종합계획(18~22, 정체기)의 내용. 1차는 체계구축, 2차는 수혜학생 1만 명 확대, 3차는 질적 수준 제고, 5차는 고도영재 맞춤형 지원·숨은 인재 성장지원.","source":{"page":3,"section":"영재교육진흥종합계획","quote":"4차 종합계획(18~22) 정체기 희망하는 모든 학생에게 영재교육 기회를 제공하는 등 '선발'에서 '교육'으로의 영재교육 패러다임 전환 시도"}},{"id":"31-04","type":"옳은 것","q":"5차 영재교육진흥종합계획(23~27)에 대한 설명으로 옳은 것은?","box":null,"choices":["영재교육 수혜학생을 1만 명(전체 1%)까지 확대하는 목표를 설정하였다.","고도영재 맞춤형 지원과 숨은 인재 성장지원체계 구축, 디지털 분야 등의 영역 확대와 성과관리를 중점과제로 제시하였다.","「영재교육진흥법」 제정·시행에 따라 영재발굴·육성 체계구축에 중점을 두었다.","교육내용·방법 개선, 기관 운영 고도화, 교원 전문성 강화를 추진하였다.","'선발'에서 '교육'으로의 패러다임 전환을 시도하였다."],"answer":2,"explain":"5차는 '사회 각 분야에서 혁신을 주도하는 창의적인 인재 양성' 비전 아래 고도영재 맞춤형 지원 등을 제시. 수혜학생 1만 명 확대는 2차, 체계구축은 1차, 질적 수준 제고는 3차, '선발'→'교육' 전환은 4차.","source":{"page":3,"section":"영재교육진흥종합계획","quote":"5차 종합계획(23~27) 현재 사회 각 분야에서 혁신을 주도하는 창의적인 인재 양성을 비전으로 고도영재 맞춤형 지원과 숨은 인재 성장지원체계 구축, 디지털 분야 등의 영역 확대와 성과관리를 중점과제로 제시"}},{"id":"31-05","type":"옳은 것","q":"2022 영재교육통계연보에 제시된 영재교육 대상자 현황에 대한 설명으로 옳은 것은?","box":null,"choices":["2022년 영재교육 대상자 비율은 1.91%였다.","2007년 영재교육 대상자 수는 72,518명이었다.","영재교육 대상자 비율이 가장 높았던 해는 2014년(1.88%)이다.","2020년에 대상자 수가 처음으로 10만 명 아래인 99,998명이 되었다.","영재교육 대상자 수는 2013년 121,421명으로 가장 많았다."],"answer":5,"explain":"2013년 121,421명이 최다. 2022년 비율은 1.37%(1.91%는 2017년), 2007년은 46,006명(72,518명은 2022년), 비율 최고는 2017년 1.91%, 99,998명은 2019년(2020년은 82,012명).","source":{"page":4,"section":"영재교육 대상자 현황","quote":"2013 121,421 … 비율 … 1.87% … 2017 109,266 … 1.91% … 2022 72,518 … 1.37%"}},{"id":"31-06","type":"개념 찾기","q":"영재교육 대상자 수 추이 그래프(2003~2022)에서 2003년의 영재교육 대상자 수는?","box":null,"choices":["46,006명","31,100명","72,518명","19,974명","121,421명"],"answer":4,"explain":"그래프 시작점 2003년은 19,974명(PDF 그래프 확인). 46,006명은 2007년, 31,100명은 2005년, 72,518명은 2022년, 121,421명은 2013년(최고점).","source":{"page":5,"section":"영재교육 대상자 현황 – 영재교육 대상자 수 추이","quote":"영재교육대상자수추이 영재교육대상자현황"}},{"id":"31-07","type":"옳은 것","q":"2022년 영재교육기관 현황에 대한 설명으로 옳은 것은?","box":null,"choices":["영재학급이 1,118개로 가장 많고, 초등학교에서 중고등학교로 갈수록 줄어드는 피라미드식 구조이다.","영재학교는 20개, 과학고는 8개이다.","대학부설 영재교육원은 250개로 교육청 영재교육원보다 많다.","영재교육기관 합계는 3,011개이다.","중고등학교로 갈수록 기관 수가 늘어나는 역피라미드 구조이다."],"answer":1,"explain":"영재학교 8, 과학고 20, 교육청 영재교육원 250, 대학부설 90, 영재학급 1,118, 합계 1,486. 영재학교·과학고 수가 뒤바뀌었고, 250개는 교육청 영재교육원, 3,011개는 2013년 기관 수, 구조는 피라미드식.","source":{"page":6,"section":"영재교육기관 현황","quote":"초등학교에서 중고등학교로 갈수록 줄어드는 피라미드식 구조 / 기관유형 영재학교 과학고 영재교육원 영재학급 합계 교육청 대학부설 영재교육기관수 8 20 250 90 1,118 1,486"}},{"id":"31-08","type":"옳은 것","q":"영재교육기관 수 추이(2003~2022)에 대한 설명으로 옳은 것은?","box":null,"choices":["2003년 1,486개에서 2022년 3,011개로 꾸준히 증가하였다.","기관 수는 2018년에 정점을 찍었다.","2003년 400개 이후 한 번도 증가하지 않고 계속 감소하였다.","2022년 기관 수는 2,920개이다.","2013년 3,011개로 정점을 찍은 뒤 감소하여 2022년 1,486개가 되었다."],"answer":5,"explain":"그래프(PDF 확인): 2003년 400개 → 2013년 3,011개(정점) → 2022년 1,486개. 2,920개는 2014년 수치.","source":{"page":7,"section":"영재교육기관 현황 – 영재교육기관 수 추이","quote":"영재교육기관수추이 영재교육기관현황"}},{"id":"31-09","type":"옳은 것","q":"영재교육 담당 교·강사 수 추이(2011~2022)에 대한 설명으로 옳은 것은?","box":null,"choices":["2011년 27,263명으로 가장 많았다.","2014년 27,263명으로 가장 많았고, 2022년에는 18,340명이었다.","2022년 교·강사 수는 25,489명으로 증가하였다.","2020년 이후 교·강사 수는 꾸준히 증가하였다.","교·강사 수는 2019년 처음 3만 명을 넘었다."],"answer":2,"explain":"그래프(PDF 확인): 2011년 23,013명 → 2014년 27,263명(최다) → 2022년 18,340명. 25,489명은 2017년, 2020년 이후는 감소 추세, 3만 명을 넘은 해 없음.","source":{"page":8,"section":"영재교육 담당 교·강사 현황","quote":"영재교육담당교•강사현황 / 영재교육담당교· 강사 수추이"}},{"id":"31-10","type":"보기 조합","q":"교안에서 영재교육 발전의 장애요인으로 제기된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 학령인구 감소\nㄴ. '소수엘리트교육'이라는 부정적 인식\nㄷ. 상급학교 진학 시 영재교육 이력 반영 확대\nㄹ. 일반교육과의 차별성 부족","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"장애요인은 학령인구 감소, '소수엘리트교육' 부정적 인식, 상급학교 진학 시 영재교육 이력 '미반영', 일반교육과의 차별성 부족, 기관 내실화·특성화 한계. ㄷ은 '반영 확대'로 반대 서술.","source":{"page":9,"section":"영재교육 현황","quote":"학령인구감소와 '소수엘리트교육'이라는 부정적 인식, 상급학교 진학 시 영재교육 이력 미반영과 일반교육과의 차별성 부족, 영재교육기관의 내실화와 특성화 한계 등이 영재교육 발전의 장애요인으로 제기"}},{"id":"31-11","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재교육의 정점은 2차 영재교육진흥종합계획이 끝나던 (   )부터 3차 영재교육진흥종합계획이 시작되던 초반부(13~14)라 할 수 있음","choices":["2007년","2010년","2012년","2017년","2022년"],"answer":3,"explain":"2차 계획(08~12)이 끝나던 2012년. 그 후 영재교육은 정체기와 쇠퇴기를 겪고 있음.","source":{"page":9,"section":"영재교육 현황","quote":"영재교육의 정점은 2차 영재교육진흥종합계획이 끝나던 2012년부터 3차 영재교육진흥종합계획이 시작되던 초반부(13~14)라 할 수 있음"}},{"id":"31-12","type":"옳지 않은 것","q":"영재교육의 순기능과 역기능에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["역기능을 줄이기 위해 영재교육 대상을 소수 엘리트로 제한해야 한다.","순기능은 미래사회 경쟁력을 높이는 데 우수한 인재를 배출하는 것이다.","역기능으로 엘리트 중심 교육이 제시되었다.","역기능으로 지나친 경쟁과 사교육 열풍이 제시되었다.","국가경쟁력 확보를 위해 역기능을 극소화하고 순기능을 극대화하도록 영재교육 모델을 정립해야 한다."],"answer":1,"explain":"교안은 엘리트 중심 교육 자체를 역기능으로 보며, 역기능 극소화·순기능 극대화 모델 정립을 제시. '소수 엘리트로 제한'은 교안과 반대.","source":{"page":10,"section":"영재교육의 순기능과 역기능","quote":"엘리트 중심교육 ‣ 지나친 경쟁 ‣ 사교육 열풍 미래사회 세계 속의 국가경쟁력을 확보하기 위해서는 역기능을 극소화하고 순기능을 극대화하도록 영재교육모델을 정립해야 함"}},{"id":"31-13","type":"옳지 않은 것","q":"2002~2012년(1·2차 영재교육진흥종합계획 시기) 영재교육학회 학술대회 주요 주제로 교안에 제시되지 않은 것은?","box":null,"choices":["인문사회 영재교육","창조경제와 영재교육의 역할","21세기 영재교육 프로그램 방향","관찰추천 영재선발 방식의 과제와 발전방향","영재교육의 새 접근: 융합형 영재교육"],"answer":2,"explain":"'창조경제와 영재교육의 역할'은 2013~2022년(3·4차 시기) 학술대회 주제. 나머지는 02~12년 주제.","source":{"page":12,"section":"02. 영재교육의 주요 이슈와 연구동향 – 영재교육학회 학술대회 주제 분석","quote":"인문사회 영재교육 • 21세기 영재교육 프로그램 방향 • 관찰추천 영재선발 방식의 과제와 발전방향 • 영재교육의 새 접근: 융합형 영재교육"}},{"id":"31-14","type":"옳은 것","q":"영재교육학회 학술대회 주제 분석에서 시기별 주요 이슈가 바르게 연결된 것은?","box":null,"choices":["도입기 – 영재교육을 한 차원 업그레이드하는 노력","도약기 – 미래사회 역량과 영재교육의 방안 모색 및 사회적 분위기 계몽","정체기 – 영재성 개념, 판별, 교육, 프로그램 개발 등 영재교육 도입 안착 노력","도약기 – 영재교육법 제정 10년을 넘기는 시점에서 패러다임 전환 논의","발전기 – 영재교육법 제정 10년을 넘기는 시점에서 영재교육 패러다임의 전환에 대한 논의"],"answer":5,"explain":"도입기: 개념·판별·교육·프로그램 개발 등 도입 안착 / 도약기: 한 차원 업그레이드 / 발전기: 법 제정 10년 넘기는 시점 패러다임 전환 논의 / 정체기: 미래사회 역량과 방안 모색 및 사회적 분위기 계몽.","source":{"page":13,"section":"영재교육학회 학술대회 주제 분석(2013~2022)","quote":"미래사회 역량과 영재교육의 방안모색 및 사회적 분위기 계몽 • 정체기 / • 영재교육법 제정 10년을 넘기는 시점에서 영재교육 패러다임의 전환에 대한 논의 • 발전기"}},{"id":"31-15","type":"옳은 것","q":"영재교육 주요 이슈에 대한 설명으로 옳은 것은?","box":null,"choices":["교육의 방향은 시대적 요구와 무관하게 일정하게 유지된다.","영재성의 개념화는 영재교육의 최종 도달점이다.","영재성의 개념화는 영재교육의 출발점이며, 개념 정의는 학자마다 다른 다양한 시각이 존재한다.","영재성의 개념 정의는 학자 간 단일한 합의가 이루어져 있다.","지난 20년 동안의 영재교육 방향 분석은 더 이상 필요하지 않다."],"answer":3,"explain":"교안: 교육의 방향은 시대적 요구와 패러다임 변화에 따라 변하며, 20년 방향 분석과 미래 방향 제시가 필요. 영재성 개념화는 '출발점'이고 학자마다 다양한 시각이 존재.","source":{"page":14,"section":"영재교육 주요 이슈 – 영재성의 개념화와 판별 및 선발","quote":"영재성의 개념화는 영재교육의 출발점. 영재성의 개념 정의는 학자마다 다른 다양한 시각이 존재함"}},{"id":"31-16","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재교육자료는 (   ) 자료가 가장 많고 정보, 예술, 발명, 인문·사회, 창의성과 리더십, 융합 등과 관련된 영재교육자료도 지속적으로 개발‧보급되고 있음","choices":["인문·사회","정보","발명","예술","수‧과학"],"answer":5,"explain":"영재교육자료는 수‧과학 자료가 가장 많음. 나머지는 지속적으로 개발·보급되는 기타 분야.","source":{"page":15,"section":"영재교육 주요 이슈 – 영재교육을 위한 교육과정, 교수학습, 프로그램","quote":"영재교육자료는 수‧과학 자료가 가장 많고 정보, 예술, 발명, 인문·사회, 창의성과 리더십, 융합 등과 관련된 영재교육자료도 지속적으로 개발‧보급되고 있음"}},{"id":"31-17","type":"옳지 않은 것","q":"교안의 '영재의 심리적 구인' 이슈에서 제시된 심리적 요인이 아닌 것은?","box":null,"choices":["동기","지능지수(IQ)","자기조절 학습","완벽주의","진로발달"],"answer":2,"explain":"제시된 요인: 동기, 자기조절 학습, 효능감, 완벽주의, 스트레스, 진로발달, 상담 등. 지능지수(IQ) 의 내용분석 – ④ 교사의 인식","quote":"영재 교사는 안내자 촉진자, 멘토의 역할 • 업무 경감, 영재 교원연수 확대 • 전담교사 배치 필요, 행·재정적 지원 필요 • 영재 교육은 협력과 인성적 측면 지향 필요"}},{"id":"31-27","type":"보기 조합","q":"'교사의 전문성' 소범주 연구 내용으로 제시된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 영재교육 담당 교원 자격증 제도\nㄴ. 공동 학습자로서의 교사 역할\nㄷ. 학습 공동체 구성\nㄹ. 영재교원 연수 축소 및 일반교원 대체","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"교안: 전문성 향상을 위한 연수 '확대' 및 재편성, 학습 공동체 구성, 교원 자격증 제도, 공동 학습자로서의 교사 역할, 박사급 전문교원의 역할 등. ㄹ은 반대.","source":{"page":26,"section":"범주별 연구의 내용분석 – 교사의 전문성","quote":"전문성 향상을 위한 연수 확대 및 재편성 • 학습 공동체 구성 … • 영재교육담당 교원자격증 제도 • 공동 학습자로서의 교사역할 • 영재교사의 핵심역량과 측정 • 박사급 전문교원의 역할"}},{"id":"31-28","type":"옳은 것","q":"⑤ 영재의 심리특성 범주 중 영재특성·완벽주의 연구 내용으로 옳은 것은?","box":null,"choices":["자기지향 완벽주의는 연주불안을 증가시킨다.","영재의 자아개념이 평재보다 높고 직관적이다.","완벽주의 측정도구의 타당성은 이미 충분히 검증되었다.","영재의 완벽주의는 부적응적 완벽주의만 존재한다.","사회적 지지는 영재의 불안을 증가시킨다."],"answer":2,"explain":"교안: 자아개념이 평재보다 높고 직관적. 자기지향 완벽주의는 연주불안 '감소', 측정도구의 타당성 '문제', 적응적·부적응적 완벽주의 모두, 사회적 지지는 불안감소 효과.","source":{"page":27,"section":"범주별 연구의 내용분석 – ⑤ 영재특성, 완벽주의","quote":"자아개념이 평재보다 높고 직관적임 … 완벽주의 측정도구의 타당성 문제 • 영재의 적응적, 부적응적 완벽주의 • 자기지향 완벽주의 연주불안 감소 • 사회적 지지 불안감소 효과"}},{"id":"31-29","type":"옳지 않은 것","q":"영재의 웰빙·진로발달·상담 관련 연구 내용으로 옳지 않은 것은?","box":null,"choices":["영재는 높은 행복감, 높은 심리적 안녕감을 보인다.","진로 결정 효능감이 높다.","영재상담 경험이 풍부하여 차별화된 상담지원 요구는 낮다.","직업의 지향성(행복, 열정, 사회 변화 등)이 중요하다.","발달 단계별 진로성숙 차이가 있다."],"answer":3,"explain":"교안: 전문상담 요구, 차별화된 상담지원, '영재상담 경험 적음'. 경험 풍부·요구 낮음은 반대.","source":{"page":28,"section":"범주별 연구의 내용분석 – 정서 및 심리적 문제와 상담","quote":"스트레스 대처행동, 전문상담 요구, 차별화된 상담지원, 영재상담 경험 적음, 영재의 정체성과 환경적응 문제"}},{"id":"31-30","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"소외계층 영재: 교사 역량, 과소선발의 원인, 귀인 오류(능력귀인이 아닌 사회문화적 귀인) • 맞춤형 선발도구 필요, 선발에 창의성과 문제해결력 사용 • 소외계층 영재의 사회정서적 특성 • (   ) 프로그램 필요","choices":["브릿지","풀아웃","R\u0026E","속진","AP"],"answer":1,"explain":"소외계층 영재를 위한 '브릿지 프로그램 필요'. 다문화가정 항목에도 '글로벌 브릿지 심화단계'가 제시됨.","source":{"page":29,"section":"범주별 연구의 내용분석 – ⑥ 소외계층","quote":"맞춤형 선발도구 필요, 선발에 창의성과 문제해결력 사용, • 소외계층 영재의 사회정서적 특성 • 브릿지 프로그램 필요"}},{"id":"31-31","type":"옳은 것","q":"다문화가정·미성취 영재 관련 연구 내용으로 옳은 것은?","box":null,"choices":["미성취 영재는 긍정적 학업적 자아개념을 보인다.","다문화가정 유아영재교육은 연구 주제에서 제외된다.","미성취 영재 연구에서 부모양육형태는 다루지 않는다.","다문화 영재는 사회적 기회 평등이 이미 확보되었다.","다문화가정 영재를 위해 선발도구의 공정성과 평등성, 창의력·사고력 검사 등 선발과 판별도구 연구가 필요하다."],"answer":5,"explain":"다문화가정: 자아정체감 혼란, 사회적 기회 '불평등', 선발도구 공정성·평등성 연구, 다문화 가정 유아영재교육 등. 미성취: '부정적' 학업적 자아개념, 부모양육형태·기대와 압력 등.","source":{"page":30,"section":"범주별 연구의 내용분석 – 다문화가정, 미성취","quote":"문화적 차이로 인한 자아정체감 혼란 • 사회적 기회 불평등 • 선발도구의 공정성과 평등성, 창의력, 사고력 검사 등 선발과 판별도구 연구 필요 … • 부정적 학업적 자아개념"}},{"id":"31-32","type":"빈칸","q":"다음 (가), (나)에 들어갈 말로 알맞은 것은?","box":"영재들에게 필요한 환경적인 자극은 반드시 (가)가 아니라 (나)일 수 있고, 아니면 그 이하일 수도 있음","choices":["(가) 50%, (나) 10%","(가) 80%, (나) 30% 또는 20%","(가) 100%, (나) 50%","(가) 30%, (나) 80% 또는 90%","(가) 20%, (나) 80%"],"answer":2,"explain":"교안: 반드시 80%가 아니라 30% 또는 20%. 그런데 무조건 80% 이상의 환경적 자극을 투입하려 하기 때문에 영재들이 특성을 발휘하지 못하고 이탈행위를 하게 됨.","source":{"page":32,"section":"03. 영재교육의 과제 – 영재성 정도에 따른 교육환경 자극의 차별화 필요","quote":"영재들에게 필요한 환경적인 자극은 반드시 80%가 아니라 30% 또는 20%일 수 있고, 아니면 그 이하일 수도 있음"}},{"id":"31-33","type":"옳지 않은 것","q":"'영재성 정도에 따른 교육환경 자극의 차별화 필요'에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재 집단은 최소의 환경적인 자극과 자생적인 사고를 하는 특성이 있다.","무조건 80% 이상의 환경적 자극을 투입하면 영재들이 이탈행위를 하게 된다.","통합되고 일반화된 프로그램에 영재를 맞추는 방식이 영재교육의 본질에 부합한다.","영재 학생의 특성에 대한 충분한 정보를 얻은 후 단계적이고 개별적인 프로그램을 제시해야 한다.","영재는 누구인가에 대한 질문이 선행되어야 한다."],"answer":3,"explain":"교안: 영재는 누구인가에 대한 질문 없이 통합·일반화된 프로그램에 맞추는 식의 영재교육은 본질의 문제를 '오도'함.","source":{"page":32,"section":"영재교육의 과제","quote":"영재는 누구인가에 대한 질문 없이, 통합되고 일반화된 프로그램이라는 형식을 만들어 놓고 그에 맞추는 식의 영재교육은 영재교육이라는 본질의 문제를 오도"}},{"id":"31-34","type":"옳은 것","q":"'영재교육의 이론성과 현장성 간의 극단적인 부조화 현상 극복'에 대한 설명으로 옳은 것은?","box":null,"choices":["영재교육학은 철학적 사변을 통해 인간의 행동 변화를 추구한다.","이론을 위한 이론을 강조할수록 현장성이 확대된다.","현장성을 강조하면 오차를 진실로 받아들이는 일은 발생하지 않는다.","전문성과 집행성 간의 괴리와 간극을 줄일 필요가 있다.","이론성과 현장성은 이미 조화를 이루고 있다."],"answer":4,"explain":"영재교육학은 '과학적인 방법'을 통해 행동 변화를 추구. 이론을 위한 이론은 현장성을 막을 수 있고, 현장성 강조 시 잘못하면 오차에 대한 해석을 진실로 받아들일 수 있음.","source":{"page":33,"section":"영재교육의 이론성과 현장성 간의 극단적인 부조화 현상을 극복할 필요","quote":"이론을 위한 이론만을 강조할 때, 때로는 우리의 현장성을 막을 수 있음 ‣ 전문성과 집행성 간의 괴리와 간극을 줄일 필요 있음"}},{"id":"31-35","type":"사례","q":"다음 사례의 학생을 교안에서 지칭하는 용어는?","box":"영재 학생의 특성을 상, 중, 하로 나눌 때 극단적인 상에 속한 영재성을 가진 학생으로, 현재 다수를 대상으로 하는 집단화 속의 영재교육 방법과는 다른 방법을 시도해야 하는 극소수의 영재","choices":["미성취 영재","소외계층 영재","고도(진성) 영재","잠재 영재","일반 영재"],"answer":3,"explain":"고도(진성) 영재. 교안은 이들에게 차별적인 영재교육을 실시해야 하며, 이는 현재의 영재교육을 부정하는 것이 아니라 더 발전적인 개념을 논의하는 것이라 설명.","source":{"page":34,"section":"고도(진성) 영재교육의 도입 필요","quote":"극단적인 상에 속한 영재성을 가지고 있는 학생을 '고도(진성) 영재'라 지칭함. 이들은 현재 다수를 대상으로 하는 집단화 속에서 이루어지고 있는 영재교육 방법과는 다른 방법을 시도해야 하는 극소수의 영재를 의미함"}},{"id":"31-36","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"소외계층과 다문화가정의 영재들에게 불리한 현재 영재교육대상자 판별과 교육방법은 (   )를 만들기 위해 반드시 해결해야 하는 과제임","choices":["경쟁력 있는 사회","공평한 사회","지식기반 사회","엘리트 사회","다문화 사회"],"answer":2,"explain":"교안 표현 그대로 '공평한 사회'.","source":{"page":35,"section":"소외계층 및 다문화 영재교육과 관련된 연구 필요","quote":"소외계층과 다문화가정의 영재들에게 불리한 현재 영재교육대상자 판별과 교육방법은 공평한 사회를 만들기 위해 반드시 해결해야 하는 과제임"}},{"id":"31-37","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"미래사회에 필요한 역량으로 감성, 인간성 회복이 강조됨을 고려할 때 영재의 심리적 측면을 소재로 하여 (   )을 추구하는 영재교육 프로그램 연구의 활성화가 필요함","choices":["속진","수월성","경쟁력","성취","웰빙"],"answer":5,"explain":"영재의 심리사회적 건강을 소재로 한 프로그램 연구 → '웰빙'을 추구.","source":{"page":36,"section":"영재의 심리사회적 건강을 소재로 한 프로그램 연구의 활성화 필요","quote":"영재의 심리적 측면을 소재로 하여 웰빙을 추구하는 영재교육 프로그램 연구의 활성화가 필요함"}},{"id":"31-38","type":"옳지 않은 것","q":"'영재 부모를 대상으로 하는 연구 필요'에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재 부모의 역할, 영재교육과 가정의 연계, 부모 자원 활용 등에 대한 연구는 이미 충분히 많이 이루어졌다.","영재 학부모들은 자녀의 영재교육에 가장 관심이 많다.","영재 학부모는 교사와 협력적 역할을 수행해야 할 동반자이다.","영재 부모 관련 연구는 앞으로 연구자들이 수행해야 할 과제이다.","영재교육과 가정의 연계는 연구 주제로 제시되었다."],"answer":1,"explain":"교안: 영재 부모 관련 연구는 '상대적으로 많지 않아' 앞으로 수행해야 할 과제.","source":{"page":37,"section":"영재 부모를 대상으로 하는 연구 필요","quote":"영재 부모의 역할, 영재교육과 가정의 연계, 부모 자원 활용 등에 대한 연구는 상대적으로 많지 않아 앞으로 연구자들이 수행해야 할 과제임"}}]},{"lesson":32,"title":"영재교육과정은 어떻게 설계하는가?","file":"4. 교안 (31~60)[1] (1)/32.pdf","summary":["영재교육과정: 영재의 심리적 특성(영재성)과 교육적 요구에 적합해야 함 / 철학 - 설계 - 구성 - 실행 - 평가","과정-산출 접근: 영재뿐 아니라 일반 학생 교육과정에도 적용, 수업의 과정이 직접 산출에 영향을 주어 그 수준을 결정(창의적 산출물대회) / 교수기술 = 주의집중, 동기화, 학습전략 / 내용설계기술 = 내용의 구조화, 시각화, 자료의 반복(미국의 영재교실)","풀아웃(pull-out): 일반 수업을 하다가 특별한 시간을 정하여 영재학생들만 대상으로 심화학습 (예: 방과 후 프로그램, 여름캠프, 토요일 특별프로그램)","4가지 기본가정: 독특한 심리적 특성·학습요구에 맞춤 / 속진학습(acceleration)+심화학습(enrichment) 통합 / 인지적 능력뿐 아니라 사회적·정서적 특성 고려 / 설계·구성·실행·평가·수정 반복하는 순환과정","NAGC 철학: 인지기술(정보처리과정 근간, 비판적·창의적 사고, 문제해결) / 공학적 접근(수행목표 진술 → 검사, 표준교육과정) / 영재 개인(아동중심, 현재 선호, 렌줄리 학교 전체 심화학습모형·퍼듀 3단계·베츠 자율학습자 모형) / 학문적 합리주의('지식의 구조', AP·IB) → 통합적 구성 바람직","국가영재교육프로그램 기준(한국교육개발원): 국가수준의 최소한의 기준 마련 → 지역과 교사 등 변인에 따른 수준·질 차이 극복 / 수요자 중심 학생맞춤식, 미래형 콘텐츠, 교수학습 개선, 질 관리 체제, 일반교육과의 차별성 / 기관 특성·여건 고려한 국가 수준 공통 지침과 안내","수학 영재 핵심역량: 창의적 문제해결능력(직관적 통찰, 창의적 전략, 반성, 재구성 및 재창조) / 고등수학적 추론능력(분석 및 종합, 추리, 논리적 절차 수행, 정당화) / 융합 및 응용(융·복합, 모델링, 응용) / 수학적 의사소통 및 협업(이해, 표현 및 변환, 협업) / 정보처리 및 도구 활용 / 수학적 태도와 실천의지력","NAGC 7가지 기준: 프로그램 설계, 운영 및 관리, 사회-정서적 지도 및 상담, 학생판별 및 선발, 교육과정·교수 지도, 교원 전문성 계발, 프로그램 평가","융합교육 비율: 영재학급·시도 영재교육원 20-30%, 대학부설 30-40%(한국교육개발원, 2021), 영재학교 별도 융합과목 5-10%","융합교육 유형: 교과병렬식(지구과학·물리·화학 주제 번갈아, 캠프·산출물 대회·STEAM 특강) / 주제중심 프로젝트(3~4주 장기, '에너지의 탄생' 등) / 주제 및 내용 융합(수학과 체육 등, 주제별 담당교사 1명)"],"questions":[{"id":"32-01","type":"빈칸","q":"교안에 제시된 영재교육과정의 흐름으로 (   )에 들어갈 순서가 알맞은 것은?","box":"영재의 심리적 특성(영재성)과 교육적 요구에 적합한 영재교육과정: (   )","choices":["설계 - 철학 - 구성 - 평가 - 실행","철학 - 설계 - 구성 - 실행 - 평가","철학 - 구성 - 설계 - 평가 - 실행","구성 - 설계 - 철학 - 실행 - 평가","설계 - 구성 - 실행 - 평가 - 철학"],"answer":2,"explain":"교안: 철학 - 설계 - 구성 - 실행 - 평가.","source":{"page":4,"section":"01. 영재교육과정의 기본가정과 철학 – 영재를 위한 영재교육과정이란?","quote":"철학 - 설계 - 구성 - 실행 - 평가 영재교육과정은 영재들에게 적합한 내용이 포함된 제반활동을 구체적으로 설계할 수 있도록 다양한 정보들을 제공"}},{"id":"32-02","type":"옳은 것","q":"과정-산출 접근에 대한 설명으로 옳은 것은?","box":null,"choices":["영재를 위한 교육과정에만 적용되는 접근법이다.","산출물의 수준이 수업의 과정을 결정한다는 의미이다.","주의집중, 동기화, 학습전략은 내용설계기술에 해당한다.","영재를 위한 교육과정뿐 아니라 일반 학생을 위한 교육과정에도 적용되는 접근법이다.","내용의 구조화, 시각화, 자료의 반복은 교수기술에 해당한다."],"answer":4,"explain":"과정-산출 접근은 일반 학생에게도 적용되며, 수업의 과정이 직접 산출에 영향을 주어 그 수준을 결정. 주의집중·동기화·학습전략 = 교수기술, 내용의 구조화·시각화·자료의 반복 = 내용설계기술.","source":{"page":5,"section":"과정-산출 접근","quote":"영재를 위한 교육과정뿐 아니라, 일반 학생을 위한 교육과정에도 적용되는 접근법 수업의 과정이 직접 산출에 영향을 주어 그 수준을 결정한다는 것을 의미(창의적 산출물대회)"}},{"id":"32-03","type":"보기 조합","q":"과정-산출 접근에서 '내용설계기술'에 해당하는 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 내용의 구조화\nㄴ. 시각화\nㄷ. 동기화\nㄹ. 자료의 반복","choices":["ㄱ, ㄴ, ㄹ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":1,"explain":"내용설계기술 = 내용의 구조화, 시각화, 자료의 반복. 동기화는 주의집중·학습전략과 함께 '교수기술'.","source":{"page":5,"section":"과정-산출 접근","quote":"수업의 과정과 관련된 다양한 교수기술들 즉, 주의집중, 동기화, 학습전략 등과 내용설계기술인 내용의 구조화, 시각화, 자료의 반복 등을 효과적으로 설계하여 제시하면 높은 산출을 기대할 수 있다는 의미(미국의 영재교실)"}},{"id":"32-04","type":"개념 찾기","q":"다음 설명에 해당하는 것은?","box":"일반 수업을 하다가 특별한 시간을 정하여 영재학생들만을 대상으로 심화학습을 실시하는 형태","choices":["속진학습","AP(advanced program)","주제중심 프로젝트","교과병렬식","풀아웃(pull-out)"],"answer":5,"explain":"풀아웃(pull-out)의 정의. 과정-산출 접근의 영재교육은 다양한 자료가 구비된 풀아웃 등 심화학습으로 진행.","source":{"page":6,"section":"과정-산출 접근","quote":"풀아웃(pull-out)은 일반 수업을 하다가 특별한 시간을 정하여 영재학생들만을 대상으로 심화학습을 실시하는 형태"}},{"id":"32-05","type":"사례","q":"다음 사례에 해당하는 영재교육 운영 형태로 가장 알맞은 것은?","box":"A초등학교는 정규 수업은 일반 학생과 함께 진행하고, 영재학생들만을 대상으로 방과 후 프로그램, 여름캠프, 토요일 특별프로그램을 열어 다양한 자료를 활용한 심화학습을 실시한다.","choices":["학문적 합리주의의 AP 과정","공학적 접근의 표준교육과정","과정-산출 접근의 풀아웃 심화학습","속진학습(월반)","주제 및 내용 융합 유형"],"answer":3,"explain":"과정-산출 접근의 영재교육은 풀아웃 등 심화학습으로 진행되며, 예로 방과 후 프로그램/여름캠프/토요일 특별프로그램이 제시됨.","source":{"page":6,"section":"과정-산출 접근","quote":"과정-산출 접근의 영재교육은 다양한 자료가 구비되어 있는 풀아웃 등 심화학습으로 진행 … 예) 방과 후 프로그램 / 여름캠프 / 토요일 특별프로그램 등"}},{"id":"32-06","type":"빈칸","q":"다음 (가), (나)에 들어갈 말로 알맞은 것은?","box":"영재교육과정은 통합적 접근으로, 동일 연령의 학생들보다 학습내용을 빠르게 배우게 하는 (가)과, 다양하고 풍부한 경험을 제공하는 (나)을 적절하게 통합하여 적절한 교육과정을 구성하여야 함","choices":["(가) 속진학습(acceleration), (나) 심화학습(enrichment)","(가) 심화학습(enrichment), (나) 속진학습(acceleration)","(가) 풀아웃, (나) 속진학습","(가) 속진학습, (나) 풀아웃","(가) 개별화학습, (나) 협동학습"],"answer":1,"explain":"빠르게 배우게 함 = 속진학습(acceleration), 다양하고 풍부한 경험 = 심화학습(enrichment).","source":{"page":7,"section":"영재교육과정에 필요한 4가지의 기본가정","quote":"동일 연령의 학생들보다 학습내용을 빠르게 배우게 하는 속진학습(acceleration)과, 다양하고 풍부한 경험을 제공하는 심화학습(enrichment)을 적절하게 통합하여"}},{"id":"32-07","type":"옳지 않은 것","q":"영재교육과정에 필요한 4가지 기본가정에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재들의 독특한 심리적 특성과 학습요구에 맞추어 설계되어야 한다.","속진학습과 심화학습을 적절하게 통합해야 한다.","영재의 인지적 능력뿐만 아니라 사회적, 정서적 특성까지 고려해야 한다.","교육과정 개발은 설계에서 평가로 끝나는 일회적인 직선형 과정이어야 한다.","교육과정 개발은 설계, 구성, 실행, 평가, 수정의 단계를 반복한다."],"answer":4,"explain":"교안: 교육과정의 개발은 설계, 구성, 실행, 평가, 수정의 단계를 계속적으로 반복하는 '순환과정'이어야 함.","source":{"page":8,"section":"영재교육과정에 필요한 4가지의 기본가정","quote":"영재교육과정은 영재의 인지적 능력뿐만 아니라 사회적, 정서적 특성까지 고려해야 함 교육과정의 개발은 교육과정의 설계, 구성, 실행, 평가, 수정의 단계를 계속적으로 반복하는 순환과정이어야 함"}},{"id":"32-08","type":"개념 찾기","q":"미국영재교육학회(NAGC)의 영재교육과정 철학 중 다음 설명에 해당하는 것은?","box":"인간의 정보처리과정을 영재교육과정의 근간으로 삼자는 견해로, 비판적 사고, 창의적 사고, 문제 해결 등을 교육과정의 핵심내용으로 해야 한다는 견해","choices":["공학적 접근에 초점을 둔 영재교육과정","인지기술에 초점을 둔 영재교육과정","영재 개인에 초점을 둔 영재교육과정","학문적 합리주의에 초점을 둔 영재교육과정","과정-산출 접근의 영재교육과정"],"answer":2,"explain":"인지기술(cognitive skill) 발달이 목표이며 정보처리과정을 근간으로 하는 것은 '인지기술에 초점을 둔 영재교육과정'.","source":{"page":9,"section":"미국영재교육학회 NAGC의 영재교육과정의 철학 – 인지기술에 초점","quote":"인간의 정보처리과정을 영재교육과정의 근간으로 삼자는 견해로, 영재교육과정은 비판적 사고, 창의적 사고, 문제 해결 등을 교육과정의 핵심내용으로 해야 한다는 견해"}},{"id":"32-09","type":"개념 찾기","q":"NAGC의 영재교육과정 철학 중 다음 설명에 해당하는 것은?","box":"학습 과정을 강조하여 먼저 수행목표를 진술하고, 교육적 성취를 결정하기 위한 검사를 수행하며, 표준교육과정이 제시되어 학교에서는 그 교육과정에 의해 학생들을 가르침","choices":["인지기술에 초점을 둔 영재교육과정","영재 개인에 초점을 둔 영재교육과정","공학적 접근에 초점을 둔 영재교육과정","학문적 합리주의에 초점을 둔 영재교육과정","아동중심 교육과정"],"answer":3,"explain":"수행목표 진술 → 검사 → 개인적·국가적 수준의 학업성취 결정 → 표준교육과정 제시 = 공학적 접근.","source":{"page":10,"section":"NAGC의 영재교육과정의 철학 – 공학적 접근에 초점","quote":"학습 과정을 강조하여, 영재교육과정은 먼저 수행목표를 진술 ‣ 그에 따른 교육적 성취를 결정하기 위한 검사를 수행 … 따라서 표준교육과정이 제시되고, 학교에서는 그 교육과정에 의해 학생들을 가르치게 됨"}},{"id":"32-10","type":"개념 찾기","q":"다음 모형들이 예로 제시된 NAGC의 영재교육과정 철학은?","box":"렌줄리(Renzulli)의 학교 전체 심화학습모형, 퍼듀 3단계 심화학습모형, 베츠(Betts)의 자율학습자 모형","choices":["인지기술에 초점을 둔 영재교육과정","공학적 접근에 초점을 둔 영재교육과정","학문적 합리주의에 초점을 둔 영재교육과정","영재 개인에 초점을 둔 영재교육과정","과정-산출 접근의 영재교육과정"],"answer":4,"explain":"영재 개인에 초점(아동중심 교육과정): 학생의 경험을 토대로 개인적인 참여를 높이는 방향 중시. 현재 적용되는 영재교육과정들이 이 접근을 선호.","source":{"page":11,"section":"NAGC의 영재교육과정의 철학 – 영재 개인에 초점","quote":"렌줄리(Renzulli)의 학교 전체 심화학습모형, 퍼듀 3단계 심화학습모형, 베츠(Betts)의 자율학습자 모형 등은 학생의 경험을 토대로 개인적인 참여를 높이는 방향을 중시"}},{"id":"32-11","type":"옳은 것","q":"'영재 개인에 초점을 둔 영재교육과정'에 대한 설명으로 옳은 것은?","box":null,"choices":["'지식의 구조'를 교육과정의 목표로 강조한다.","표준교육과정에 의해 학생들을 가르친다.","AP와 IB가 대표적인 예이다.","인간의 정보처리과정을 근간으로 삼는다.","아동중심 교육과정으로, 구체적인 영역에 대한 영재의 관심이 교육과정 구성의 핵심이며 현재 적용되는 영재교육과정들이 선호한다."],"answer":5,"explain":"'지식의 구조'·AP·IB = 학문적 합리주의, 표준교육과정 = 공학적 접근, 정보처리과정 = 인지기술.","source":{"page":11,"section":"NAGC의 영재교육과정의 철학 – 영재 개인에 초점","quote":"개인의 요구에 맞추어진 영재교육과정(아동중심 교육과정)으로, 구체적인 영역에 대한 영재의 관심이 교육과정을 구성하는 핵심 … 현재 적용되고 있는 영재교육과정들은 이 접근을 선호함"}},{"id":"32-12","type":"옳지 않은 것","q":"'학문적 합리주의에 초점을 둔 영재교육과정' 및 철학적 접근에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["바람직한 영재교육과정은 다양한 철학적 접근 중 하나만을 일관되게 고수하는 것이다.","영재교육과정의 목표로 '지식의 구조'를 강조한다.","AP(advanced program)는 학문중심적이거나 내용중심적이다.","IB(international baccalaureate)는 학문중심적이거나 내용중심적이다.","영재들이 지식의 구조를 갖게 하기 위해 학문적 합리주의의 교육과정이 필요하다고 본다."],"answer":1,"explain":"Tips: 다양한 철학적 접근들 중에서 어느 하나만을 고수하기보다는 통합적으로 구성하는 것이 바람직함.","source":{"page":12,"section":"NAGC의 영재교육과정의 철학 – 학문적 합리주의에 초점","quote":"Tips! 다양한 철학적 접근들 중에서 어느 하나만을 고수하기보다는 통합적으로 구성하는 것이 바람직함"}},{"id":"32-13","type":"빈칸","q":"국가영재교육프로그램 기준 개발 배경에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재교육의 양적 확대와 함께 프로그램의 질에 대한 제고 또한 강조되어 국가수준의 (   ) 영재교육프로그램(교육과정) 및 운영에 대한 기준을 마련하여 지역과 교사 등의 변인에 따른 프로그램의 수준과 질 차이를 극복하고자 함","choices":["최고 수준의","최소한의","획일적인","선택적인","최대한의"],"answer":2,"explain":"교안: 국가수준의 '최소한의' 영재교육프로그램 기준 → 지역과 교사 등 변인에 따른 수준·질 차이 극복.","source":{"page":14,"section":"02. 영재교육과정의 기준 – 국가영재교육프로그램 기준 개발 배경 및 목적","quote":"국가수준의 최소한의 영재교육프로그램(교육과정) 및 운영에 대한 기준을 마련하여 지역과 교사 등의 변인에 따른 프로그램의 수준과 질 차이를 극복하고자 함"}},{"id":"32-14","type":"보기 조합","q":"국가영재교육프로그램 기준을 기반으로 영역별 표준교육과정 개발 및 보급을 확대하는 목적으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 수요자 중심의 학생맞춤식 영재교육과정 제공\nㄴ. 미래형 영재교육 콘텐츠 개발\nㄷ. 영재교육 프로그램 질 관리 체제 정립\nㄹ. 일반교육과의 동일성 확보","choices":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"answer":5,"explain":"목적: 수요자 중심 학생맞춤식, 미래형 콘텐츠 개발, 교수학습 개선, 질 관리 체제 정립, 일반교육과의 '차별성' 확보. ㄹ은 반대.","source":{"page":15,"section":"국가영재교육프로그램 기준 개발 배경 및 목적","quote":"수요자 중심의 학생맞춤식 영재교육과정 제공 • 미래형 영재교육콘텐츠 개발 • 영재교육 교수학습 개선 • 영재교육 프로그램 질관리 체제 정립 • 일반교육과의 차별성을 확보하고자 함"}},{"id":"32-15","type":"옳지 않은 것","q":"국가영재교육프로그램 기준 개발의 목적에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["기관 간 프로그램 연계성 확충에 기여한다.","체계적인 영재육성 강화에 기여한다.","모든 영재교육기관이 기관의 특성과 관계없이 동일한 프로그램을 운영하도록 하는 것이다.","기관의 특성 및 여건을 고려한 프로그램 개발·운영에 필요한 국가 수준의 공통적인 지침과 안내를 제공한다.","영재교육기관 여건 및 특성에 적합한 프로그램 개발 운영의 환경을 조성한다."],"answer":3,"explain":"교안은 각 기관의 특성 및 여건을 고려한 프로그램 개발·운영을 위한 공통 지침과 안내 제공이 목적. 동일 프로그램 강제는 교안과 반대.","source":{"page":16,"section":"국가영재교육프로그램 기준 개발 배경 및 목적","quote":"각 영재교육 기관에서 기관의 특성 및 여건을 고려한 영재교육프로그램을 개발하고 운영하는데 필요한 국가수준에서의 공통적인 지침과 안내 제공을 목적으로 함"}},{"id":"32-16","type":"옳지 않은 것","q":"국가영재교육프로그램 기준(초·중학교 수학)의 개발 목적으로 옳지 않은 것은?","box":null,"choices":["영재교육 수학분야에 공통적으로 제시할 수 있는 목표 및 방향성 제시","수학 정규교육과정과 완전히 분리된 독립적 프로그램 기준 제공","체계적인 수학 영재교육 프로그램 조직 및 상호 프로그램 간 연계성 구축","수학 영재교육 프로그램의 질 관리를 위한 평가준거 제공","수학 정규교육과정과의 차별성을 지닌 프로그램 기준 제공"],"answer":2,"explain":"교안: 수학 정규교육과정과의 '연계성 및 차별성'을 지닌 프로그램 기준 제공. 완전 분리는 틀림.","source":{"page":17,"section":"국가영재교육프로그램 기준: 초·중학교 수학 – 개발 목적","quote":"수학 정규교육과정과의 연계성 및 차별성을 지닌 영재교육프로그램 기준 제공"}},{"id":"32-17","type":"개념 찾기","q":"수학 영재의 핵심역량 중 하위요소가 '직관적 통찰, 창의적 전략, 반성, 재구성 및 재창조'인 것은?","box":null,"choices":["창의적 문제해결능력","고등수학적 추론능력","융합 및 응용 능력","수학적 의사소통 및 협업능력","정보처리 및 도구 활용능력"],"answer":1,"explain":"창의적 문제해결능력의 하위요소. 고등수학적 추론능력 = 분석 및 종합·추리·논리적 절차 수행·정당화, 융합 및 응용 = 융·복합·모델링·응용, 의사소통 및 협업 = 이해·표현 및 변환·협업, 정보처리 및 도구 활용 = 정보처리·도구의 활용.","source":{"page":18,"section":"국가영재교육프로그램 기준: 초·중학교 수학 – 수학 영재의 핵심역량","quote":"창의적 문제해결능력 직관적 통찰, 창의적 전략, 반성, 재구성 및 재창조"}},{"id":"32-18","type":"옳은 것","q":"수학 영재의 핵심역량과 하위요소의 연결로 옳은 것은?","box":null,"choices":["융합 및 응용 능력 – 이해, 표현 및 변환, 협업","수학적 의사소통 및 협업능력 – 융·복합, 모델링, 응용","정보처리 및 도구 활용능력 – 가치인식과 수학에 대한 태도","고등수학적 추론능력 – 분석 및 종합, 추리, 논리적 절차 수행, 정당화","수학적 태도와 실천의지력 – 정보처리, 도구의 활용"],"answer":4,"explain":"고등수학적 추론능력 = 분석 및 종합, 추리, 논리적 절차 수행, 정당화. 수학적 태도와 실천의지력 = 가치인식과 수학에 대한 태도, 수학적 태도, 시민 의식과 실천의지. 나머지는 하위요소가 서로 뒤바뀜.","source":{"page":18,"section":"수학 영재의 핵심역량","quote":"고등수학적 추론능력 분석 및 종합, 추리, 논리적 절차수행, 정당화 융합 및 응용 능력 융·복합, 모델링, 응용 수학적 의사소통 및 협업능력 이해, 표현 및 변환, 협업"}},{"id":"32-19","type":"옳지 않은 것","q":"미국영재교육학회(NAGC)의 영재교육 프로그램의 7가지 중요하고 본질적인 기준에 해당하지 않는 것은?","box":null,"choices":["프로그램 설계","사회-정서적 지도 및 상담","학부모 만족도 조사","학생판별 및 선발","교원 전문성 계발"],"answer":3,"explain":"7가지: 프로그램 설계, 프로그램 운영 및 관리, 사회-정서적 지도 및 상담, 학생판별 및 선발, 교육과정·교수 지도, 교원 전문성 계발, 프로그램 평가.","source":{"page":19,"section":"미국영재교육학회 영재교육 프로그램 – 7가지 기준","quote":"프로그램 설계 ‣ 프로그램 운영 및 관리 ‣ 사회-정서적 지도 및 상담 ‣ 학생판별 및 선발 ‣ 교육과정, 교수 지도 ‣ 교원 전문성 계발 ‣ 프로그램 평가"}},{"id":"32-20","type":"옳은 것","q":"영재교육 프로그램에서 융합교육 형태로 운영하는 비율에 대한 설명으로 옳은 것은?","box":null,"choices":["영재학급 및 시도 영재교육원은 30-40%를 반영한다.","영재학급 및 시도 영재교육원은 20-30%, 대학부설 영재교육원은 30-40%를 반영한다.","대학부설 영재교육원은 5-10%를 반영한다.","영재학교는 별도의 융합과목을 전체 교육과정의 20-30% 비중으로 개설한다.","영재학교는 융합과목을 개설하지 않고 연구활동만 운영한다."],"answer":2,"explain":"영재학급·시도 영재교육원 20-30%, 대학부설 30-40%(한국교육개발원, 2021, 영재교육통계연보), 영재학교는 별도 융합과목 5-10% 비중 개설·운영 및 보통교과·연구활동에서 융합적 요소 강화.","source":{"page":20,"section":"융합교육과정 강조","quote":"영재학급 및 시도 영재교육원은 20-30%, 대학부설 영재교육원은 30-40%의 비율을 반영(한국교육개발원, 2021, \"영재교육통계연보\") 영재학교의 경우 별도의 융합과목을 전체 교육과정에서 5-10% 비중으로 개설, 운영하고 있으며"}},{"id":"32-21","type":"개념 찾기","q":"영재교육의 융합교육 유형 중 다음 설명에 해당하는 것은?","box":"지구과학, 물리, 화학 등 각 교과의 주제를 번갈아 운영하는 형태로, 캠프, 산출물 대회, STEAM 특강, 축전, 체험활동 등의 유형","choices":["주제중심 프로젝트 유형","주제 및 내용 융합 유형","간학문적 유형","교과병렬식 유형","풀아웃 유형"],"answer":4,"explain":"각 교과 주제를 번갈아 운영 = 교과병렬식 유형.","source":{"page":21,"section":"영재교육의 융합교육의 유형 – 교과병렬식 유형","quote":"지구과학, 물리, 화학 등 각 교과의 주제를 번갈아 운영하는 형태, 캠프, 산출물 대회, STEAM 특강 등의 유형"}},{"id":"32-22","type":"빈칸","q":"주제중심 프로젝트 유형에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"각각의 프로젝트 주제별로 (   )간의 장기 프로젝트 형식으로 운영 / 예: '에너지의 탄생', '수묵화의 하모니', '빛, 눈과 뇌의 하모니', '생각의 탄생'","choices":["1~2일","1주","1~2주","5~6주","3~4주"],"answer":5,"explain":"주제중심 프로젝트 유형은 3~4주간의 장기 프로젝트 형식.","source":{"page":22,"section":"영재교육의 융합교육의 유형 – 주제중심 프로젝트 유형","quote":"각각의 프로젝트 주제별로 3~4주간의 장기프로젝트 형식으로 운영"}},{"id":"32-23","type":"사례","q":"다음 사례에 해당하는 융합교육 유형은?","box":"B영재교육원은 '비율'이라는 한 주제에 대해 수학과 미술을 결합한 교과 간 융합교육과정을 운영하며, 주제별로 담당교사 1명이 수업을 운영한다.","choices":["주제 및 내용 융합 유형","교과병렬식 유형","주제중심 프로젝트 유형","풀아웃 유형","속진 유형"],"answer":1,"explain":"한 주제에 대해 수학과 체육·미술·음악, 과학과 음악·미술 형태의 교과 간 융합, 각 주제별 담당교사 1명 = 주제 및 내용 융합 유형.","source":{"page":23,"section":"영재교육의 융합교육의 유형 – 주제 및 내용 융합 유형","quote":"한 주제에 대해 수학과 체육, 수학과 미술, 수학과 음악, 과학과 음악, 과학과 미술의 형태로 교과간 융합교육과정을 운영 ‣ 각 주제별 담당교사는 1명이 운영"}}]},{"lesson":33,"title":"영재 차별화 교육과정(1)","file":"4. 교안 (31~60)[1] (1)/33.pdf","summary":["영재의 특성: 터만(Terman) – 지적 소질이 우수하고 신체적인 소질이 약간 우수한 가족 출신 / 홀링워스(Hollingworth) – 일반 지능 상위 1% 아동, 추상적 사고력과 상징을 다루고 학문을 성취할 수 있는 능력","렌줄리(Renzulli) – 평균 이상의 지적 능력, 과제집착력, 창의성 세 요소 모두 상위 15% 이내 + 그중 한 가지 상위 2% 안 → 영재, 공통부분이 클수록 영재성도 큼","스턴버그(Sternberg) – 수월성, 희귀성, 검증 가능성, 생산성, 가치 기준에 부합성 / 패소우(A. Harry Passow) – 영재란 빨리 학습하는 사람(수월성)","교육과정의 차별화: 수업의 목표, 학업성취, 학생 참여 프로젝트, 교수 전략, 교육자료, 학습 평가 등 모든 수준의 설계에서 필요 / 교수학습의 차별화와 연계 / 예) 초등 언어학습: 기능적 읽기보다 깊은 의미를 파악하는 도전적인 책","영재교육 목표: 고등 수준의 전문능력, 사회적 책무와 윤리적 인간·훌륭한 시민, 비판적 사고와 과학적 사고, 사회의 기대를 충족시키기 위해 동기화, 독립·자기주도·학습에 대한 열망, 나라·세계·문화에 대한 이해","Pull-out 프로그램: 미국에서 가장 보편적인 방법, 정규수업시간에 Resource Room에서 수업 / 교육과정 = 교육내용(지식)과 과정(교수방법), 유치원에서부터 12학년 전체 틀","속진학습: 상급학년 교과내용, 대상 상위 1~2%, 능력 개발과 성취도(수행) 초점, 선발: 뛰어난 능력·성취도·적성·인지·신체·사회성·정서발달 / 심화학습: 정규교육과정에서 경험하기 어려운 내용, 대상 상위 15~20%, 흥미와 관심 초점, 목표: 창의성·문제해결 과정·탐구(발견학습) / 수업형태 둘 다 수요자 중심 교육(맞춤식)","'영재를 위해 너무 많이 가르치는 것은 그를 모욕하는 것이다' – 미국의 철학자 모티머 J. 애들러","A모형(교사주도): 학생 = 만들어진 내용과 과정의 소비자, 순차적 계열처리, 미래에 사용할 지식 저장, 상황적 창의성, 미리 결정된 발견, 교사 = 교육과정 관리자·준전문가 / B모형(학생주도): 주제 선택, 체험하는 탐구자, 지식과 기술의 생산자, 순환처리와 동시처리, 실제 창의성·실제 발견, 교사 = 방법론적 보조자·관리 보조자·전문가","차별화 영역: 복잡성(고차원적 사고기술에 의해 결정, 추상화 방향) / 깊이(개념 이해 → 논쟁 → 해결책안 공고화) / 도전성(추론의 양 많게, 구두·서술 설명) / 창의적 산출(유형적: 보고서·포트폴리오, 무형적: 발표회·정의적 태도) / 내용의 추상성(학문 내·학문 간 개념적 사고)"],"questions":[{"id":"33-01","type":"빈칸","q":"렌줄리(Renzulli)의 영재 정의에 대한 다음 (가), (나)에 들어갈 말로 알맞은 것은?","box":"평균 이상의 지적 능력, 과제집착력, 창의성의 세 가지 특성 요소가 모두 상위 (가) 이내에 들면서 그중 한 가지 요소는 상위 (나) 안에 들면 영재","choices":["(가) 10%, (나) 1%","(가) 20%, (나) 5%","(가) 15%, (나) 2%","(가) 2%, (나) 15%","(가) 15%, (나) 1%"],"answer":3,"explain":"렌줄리: 세 요소 모두 상위 15% 이내 + 한 가지는 상위 2% 안 → 영재. 세 요소 간의 공통부분이 클수록 영재성도 큼.","source":{"page":3,"section":"01. 차별화 교육과정의 개념 – 영재의 특성","quote":"평균 이상의 지적능력, 과제집착력, 창의성의 세 가지 특성요소가 모두 상위 15% 이내에 들면서 그중 한 가지 요소는 상위 2% 안에 들면 영재, 세 요소 간의 공통부분이 클수록 영재성도 큼"}},{"id":"33-02","type":"옳은 것","q":"학자와 영재의 특성(정의)의 연결로 옳은 것은?","box":null,"choices":["홀링워스 – 일반 지능에 대한 상위 1%의 아동으로, 추상적 사고력과 상징을 다루고 학문을 성취할 수 있는 능력","터만 – 일반 지능에 대한 상위 2%의 아동","렌줄리 – 지적 소질이 우수하고 신체적인 소질이 약간 우수한 가족 출신","스턴버그 – 빨리 학습하는 사람(수월성)","패소우 – 수월성, 희귀성, 검증 가능성, 생산성, 가치 기준에 부합성"],"answer":1,"explain":"터만 = 지적 소질 우수·신체적 소질 약간 우수한 가족 출신, 렌줄리 = 세 요소(지적 능력·과제집착력·창의성), 스턴버그 = 수월성·희귀성·검증 가능성·생산성·가치, 패소우 = 빨리 학습하는 사람(수월성).","source":{"page":3,"section":"영재의 특성","quote":"홀링워스(Hollingworth) ‣ 일반 지능에 대한 상위 1%의 아동으로, 추상적 사고력과 상징을 다루고 학문을 성취할 수 있는 능력"}},{"id":"33-03","type":"개념 찾기","q":"'영재아는 지적 소질이 우수하고 신체적인 소질이 약간 우수한 가족 출신'이라고 본 학자는?","box":null,"choices":["홀링워스(Hollingworth)","렌줄리(Renzulli)","스턴버그(Sternberg)","터만(Terman)","패소우(A. Harry Passow)"],"answer":4,"explain":"터만(Terman)의 영재 특성 설명.","source":{"page":3,"section":"영재의 특성","quote":"터만(Terman) ‣ 영재아는 지적소질이 우수하고 신체적인 소질이 약간 우수한 가족 출신"}},{"id":"33-04","type":"옳지 않은 것","q":"스턴버그(Sternberg)가 제시한 영재의 특성(기준)에 해당하지 않는 것은?","box":null,"choices":["수월성","과제집착력","희귀성","검증 가능성","생산성"],"answer":2,"explain":"스턴버그: 수월성, 희귀성, 검증 가능성, 생산성, 가치 기준에 부합성. 과제집착력은 렌줄리의 세 요소 중 하나.","source":{"page":4,"section":"영재의 특성 – 스턴버그","quote":"수월성, 희귀성, 검증 가능성, 생산성, 가치 기준에 부합성"}},{"id":"33-05","type":"개념 찾기","q":"'영재란? 빨리 학습하는 사람(수월성)'으로 교안에 제시된 학자는?","box":null,"choices":["터만(Terman)","홀링워스(Hollingworth)","렌줄리(Renzulli)","스턴버그(Sternberg)","패소우(A. Harry Passow)"],"answer":5,"explain":"PDF 4쪽 그림에서 패소우(A. Harry Passow)의 영재 정의로 '빨리 학습하는 사람(수월성)'이 제시됨.","source":{"page":4,"section":"영재의 특성 – 패소우","quote":"패소우(A. Harry Passow)"}},{"id":"33-06","type":"사례","q":"교안의 '교육과정의 차별화' 예시에 비추어 볼 때, 초등 영재의 언어학습을 지도하는 교사의 행동으로 가장 적절한 것은?","box":null,"choices":["일반 학생과 동일한 기능적 읽기 교재를 반복 제공한다.","읽기 속도를 높이는 훈련에만 집중한다.","상위의 지적 능력을 가진 영재에게 적합하도록 깊은 의미를 파악하는 도전적인 책을 제공한다.","학년 수준보다 쉬운 책을 주어 성취감을 높인다.","언어학습은 차별화 대상에서 제외한다."],"answer":3,"explain":"교안 예: 초등 언어학습의 경우 기능적 읽기보다는 깊은 의미를 파악하는 도전적인 책을 제공해야 함(영재교육과정은 영재의 특성을 반영해야 함).","source":{"page":5,"section":"교육과정의 차별화","quote":"초등 언어학습의 경우 기능적 읽기보다는 상위의 지적능력을 가진 영재에게 적합하도록 깊은 의미를 파악하는 도전적인 책을 제공해야 함"}},{"id":"33-07","type":"옳지 않은 것","q":"교육과정의 차별화에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["수업의 목표, 학업성취, 학생 참여 프로젝트 수준에서 차별화가 필요하다.","차별화는 교육자료 수준에서만 필요하며 교수학습의 차별화와는 별개이다.","교수 전략, 교육자료, 학습 평가 등 모든 수준의 설계에서 차별화가 필요하다.","학생의 능력을 진단하고 그에 맞는 교수적 처방을 내리는 것은 영재교육의 효과를 극대화하는 방법이다.","영재교육과정은 영재의 특성을 반영해야 한다."],"answer":2,"explain":"교안: 모든 수준의 설계에서 차별화가 필요하며 '교수학습의 차별화와 연계됨'.","source":{"page":6,"section":"교육과정의 차별화","quote":"수업의 목표, 학업성취, 학생 참여 프로젝트, 교수 전략, 교육자료, 학습 평가 등 모든 수준의 설계에서 차별화가 필요함 교수학습의 차별화와 연계됨"}},{"id":"33-08","type":"옳지 않은 것","q":"교안에 제시된 '영재교육 목표'에 해당하지 않는 것은?","box":null,"choices":["고등 수준의 전문능력","사회적 책무와 윤리적 인간, 훌륭한 시민","비판적 사고와 과학적 사고","또래와의 경쟁에서 우위 확보","나라, 세계, 문화에 대한 이해"],"answer":4,"explain":"영재교육 목표 6가지: 고등 수준의 전문능력 / 사회적 책무와 윤리적 인간, 훌륭한 시민 / 비판적 사고와 과학적 사고 / 자신에 대한 사회의 기대를 충족시키기 위해 동기화 / 독립, 자기주도, 학습에 대한 열망 / 나라, 세계, 문화에 대한 이해.","source":{"page":7,"section":"교육과정의 차별화 – 영재교육 목표","quote":"고등수준의 전문능력 / 사회적 책무와 윤리적 인간, 훌륭한 시민 / 비판적 사고와 과학적 사고 자신에 대한 사회의 기대를 충족시키기 위해 동기화 / 영재교육목표 / 독립, 자기주도, 학습에 대한 열망 / 나라, 세계, 문화에 대한 이해"}},{"id":"33-09","type":"빈칸","q":"영재교육 프로그램의 운영에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"Pull-out 프로그램: 미국에서 가장 보편적인 방법, 정규수업시간에 (   )에서 수업","choices":["Resource Room","방과 후 교실","대학 연구실","일반 교실","온라인 가상교실"],"answer":1,"explain":"Pull-out 프로그램은 미국에서 가장 보편적인 방법으로 정규수업시간에 Resource Room에서 수업.","source":{"page":8,"section":"교육과정의 차별화 – 영재교육 프로그램의 운영","quote":"Pull-out 프로그램 / 미국에서 가장 보편적인 방법 정규수업시간에 Resource Room에서 수업"}},{"id":"33-10","type":"옳은 것","q":"교안의 '교육과정: 교육내용(지식)과 과정(교수방법)' 도식에 대한 설명으로 옳은 것은?","box":null,"choices":["교육과정은 교육내용만을 의미하며 교수방법은 포함하지 않는다.","연계 측면에서 유치원에서부터 6학년까지의 틀이 제시되었다.","영재 특성 육성 요소로 암기력과 계산 속도가 제시되었다.","학교 밖 교육 자원 활용은 배제하도록 제시되었다.","속진·심화, 집단·개별, 우등반, AP 과정 제공, 학생주도적 교수학습 등이 제시되었다."],"answer":5,"explain":"교육과정 = 교육내용(지식)과 과정(교수방법). 연계는 유치원에서부터 '12학년' 전체 틀, 영재 특성 육성 요소는 지능·주도성, 창의성, 비판적 사고력, 고등분석력, 종합능력, 학교 밖 교육 자원 활용이 포함됨.","source":{"page":9,"section":"교육과정의 차별화 – 교육과정: 교육내용(지식)과 과정(교수방법)","quote":"속진, 심화 •집단, 개별 •우등반 •프로그램제공 • AP 과정 제공 •학생주도적 교수학습 … •유치원에서부터 12학년 - 전체 틀 •과목간의 연계 •학년간의 연계 •정규과목과 병행한 교육과정 •학교 밖 교육 자원활용"}},{"id":"33-11","type":"개념 찾기","q":"다음 설명에 해당하는 것은?","box":"교육과정을 심층적으로 확장시켜 정규교육과정을 통해 경험하기 어려운 학습내용을 제공하며, 영재 학생들의 창의적 사고력을 증진시키고 특수 재능과 잠재능력을 계발하고 신장시킴","choices":["속진학습","심화학습","Pull-out 프로그램","교사주도수업","AP 과정"],"answer":2,"explain":"심화학습의 특징. 속진학습은 학습 속도가 빠른 영재에게 수준 높은 상급학년 교과내용을 학습하게 하는 운영방식.","source":{"page":11,"section":"02. 차별화 교육과정의 적용 – 속진학습과 심화학습","quote":"심화학습 • 교육과정을 심층적으로 확장시켜 정규교육과정을 통해 경험하기 어려운 학습내용을 제공 • 영재 학생들의 창의적 사고력을 증진시킴 • 특수 재능과 잠재능력을 계발하고 신장시킴"}},{"id":"33-12","type":"옳은 것","q":"심화학습과 속진학습의 비교로 옳은 것은?","box":null,"choices":["심화학습의 대상은 상위 1~2%이다.","심화학습의 선발방법은 뛰어난 능력, 성취도, 적성, 인지발달 등이다.","속진학습의 대상은 상위 1~2%이다.","속진학습의 진행방식은 흥미와 관심에 초점을 둔다.","심화학습의 수업형태는 교사 중심 교육이다."],"answer":3,"explain":"대상: 심화 상위 15~20%, 속진 상위 1~2%. 뛰어난 능력·성취도 등 선발은 속진, 흥미와 관심 초점은 심화, 수업형태는 둘 다 수요자 중심 교육(맞춤식 교육).","source":{"page":12,"section":"교육과정의 차별화 – 심화학습/속진학습 비교","quote":"심화학습 속진학습 대상 상위15~20% 상위1~2%"}},{"id":"33-13","type":"옳은 것","q":"속진학습의 특징으로 옳은 것은?","box":null,"choices":["교수학습 프로그램 목표는 창의성, 문제해결 과정, 탐구(발견학습)이다.","선발방법은 흥미와 관심이다.","대상은 상위 15~20%이다.","진행방식은 능력 개발과 성취도(수행)에 초점을 둔다.","수업형태는 공급자 중심 교육이다."],"answer":4,"explain":"속진학습: 목표 = 과정 중심(지식 습득, 개념 습득, 창의성 개발), 진행방식 = 능력 개발과 성취도(수행) 초점, 선발 = 뛰어난 능력·성취도·적성·인지·신체·사회성·정서발달, 대상 1~2%, 수업형태 = 수요자 중심 교육(맞춤식 교육). 창의성·문제해결 과정·탐구 목표와 흥미·관심 선발은 심화학습.","source":{"page":12,"section":"교육과정의 차별화 – 심화학습/속진학습 비교","quote":"진행방식 흥미와 관심 초점 능력개발과 성취도(수행) 초점 선발방법 흥미와 관심 뛰어난 능력, 성취도, 적성, 인지발달, 신체발달, 사회성발달, 정서발달"}},{"id":"33-14","type":"개념 찾기","q":"'영재를 위해 너무 많이 가르치는 것은 그를 모욕하는 것이다'라고 말한 인물은?","box":null,"choices":["렌줄리(Renzulli)","터만(Terman)","스턴버그(Sternberg)","홀링워스(Hollingworth)","모티머 J. 애들러"],"answer":5,"explain":"교수학습방법 비교(A모형: 교사주도수업 / B모형: 학생주도수업) 쪽에 미국의 철학자 모티머 J. 애들러의 말로 제시됨.","source":{"page":13,"section":"교수학습방법 비교","quote":"영재를 위해 너무 많이 가르치는 것은 그를 모욕하는 것이다 / 미국의 철학자 모티머 J. 애들러"}},{"id":"33-15","type":"개념 찾기","q":"다음은 교수학습모형 중 어느 모형의 어떤 요소에 대한 설명인가?","box":"• 교육과정 관리자 • 연습지도 • 준전문가(역사교사와 사학자, 물리교사와 물리학자) • 학교에서 내린 평가를 제공","choices":["A모형(교사주도수업)의 교사","B모형(학생주도수업)의 교사","A모형(교사주도수업)의 학생","B모형(학생주도수업)의 학생","B모형(학생주도수업)의 지식"],"answer":1,"explain":"A모형의 교사. B모형의 교사는 방법론적 보조자, 관리 보조자, 전문가, 학생들이 실세계의 사람들로부터 직접 평가를 구할 수 있도록 도와줌.","source":{"page":14,"section":"교수학습모형 A","quote":"교사 / •교육과정 관리자 •연습지도 • 준전문가(역사교사와 사학자, 물리교사와 물리학자) •학교에서 내린 평가를 제공"}},{"id":"33-16","type":"옳지 않은 것","q":"교수학습모형 B(학생주도수업)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["학생이 주제를 선택하도록 하며 학생은 체험하는 탐구자이다.","학생은 지식과 기술의 생산자이다.","정보의 순환처리와 동시처리가 이루어진다.","교사와 교과서가 문제 해결에 어떤 지식을 사용할지를 미리 결정한다.","실제 상황에서의 예측 불가능한 실제 창의성을 추구한다."],"answer":4,"explain":"교사와 교과서가 사용할 지식을 미리 결정하는 것은 A모형(교사주도수업). B모형에서는 어떤 정보가 필요할지 전개될 문제에 따라 결정됨.","source":{"page":15,"section":"교수학습모형 B","quote":"정보의 순환처리와 동시처리(미리 결정된 순서를 따른다고 하기보다 그때그때 필요한 정보를 처리) • 현재 사용할 지식을 구함 • 어떤 정보가 필요할지 전개될 문제에 따라 결정됨"}},{"id":"33-17","type":"보기 조합","q":"\u003c보기\u003e에서 교수학습모형 B(학생주도수업)에 해당하는 것만을 모두 고른 것은?","box":"ㄱ. 실제 발견(실제 상황에서의 발견으로 모두에게 새로움)\nㄴ. 미래에 사용할 지식 저장\nㄷ. 학생이 주제를 선택하도록 함\nㄹ. 상황적 창의성(만들어진 상황에서의 예측 가능한 창의성)","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],"answer":2,"explain":"ㄴ 미래에 사용할 지식 저장, ㄹ 상황적 창의성은 A모형(교사주도수업). A모형의 발견은 '미리 결정된 발견(학생에게는 새롭지만 다른 사람에게는 새롭지 않음)'.","source":{"page":14,"section":"교수학습모형 A","quote":"미래에 사용할 지식저장 … •상황적 창의성(만들어진 상황에서의 예측가능한 창의성) •미리 결정된 발견(학생에게는 새롭지만 다른 사람에게는 새롭지 않음)"}},{"id":"33-18","type":"개념 찾기","q":"영재교육과정의 차별화 요소 중 다음 설명에 해당하는 것은?","box":"학생의 고차원적 사고기술에 의해 결정되며, 과제가 복잡하게 제시되고 어려운 질문을 포함하며, 과제의 내용을 추상화하는 방향으로 전개","choices":["깊이(depth)","도전성","창의적 산출","내용의 추상성(abstractness)","복잡성(complexity)"],"answer":5,"explain":"복잡성(complexity)의 설명. 영재교육과정은 복잡성, 깊이, 도전성, 창의성, 추상성 등과 같은 부분에서 차별화됨.","source":{"page":16,"section":"영재교육과정의 차별화 – 복잡성(complexity)","quote":"과제의 복잡성은 학생의 고차원적 사고기술에 의해 결정됨 ‣ 과제가 복잡하게 제시되고 어려운 질문 포함 ‣ 과제의 내용을 추상화하는 방향으로 전개"}},{"id":"33-19","type":"옳은 것","q":"차별화 요소 '깊이(depth)'에서 개별 연구 수행의 순서로 옳은 것은?","box":null,"choices":["논쟁(찬반 의견에 대한 이해) → 과제의 개념 이해 → 자신의 해결책안 공고화","과제의 개념 이해 → 논쟁(찬반 의견에 대한 이해) → 자신의 해결책안 공고화","자신의 해결책안 공고화 → 논쟁 → 과제의 개념 이해","과제의 개념 이해 → 자신의 해결책안 공고화 → 논쟁","논쟁 → 자신의 해결책안 공고화 → 과제의 개념 이해"],"answer":2,"explain":"개념 이해 → 논쟁(찬반 의견에 대한 이해) → 자신의 해결책안 공고화(설문조사, 인터뷰를 통해 수집된 자료 기반).","source":{"page":17,"section":"영재교육과정의 차별화 – 깊이(depth)","quote":"개별 연구수행은 수행할 과제의 개념이해 -\u003e 논쟁(찬반 의견에 대한 이해) -\u003e 자신의 해결책안 공고화(설문조사, 인터뷰를 통해 수집된 자료기반)"}},{"id":"33-20","type":"옳지 않은 것","q":"차별화 요소 '도전성'에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재는 반복적인 내용에 대해 흥미를 가지지 못한다.","도전적인 과제가 필요하다.","일반학생의 과제에 비하여 추론의 양을 줄이고 선택형으로 답하게 한다.","구두 및 서술형식으로 자신들의 추론을 설명할 것을 요구한다.","일반학생의 과제에 비하여 추론의 양이 많아야 한다."],"answer":3,"explain":"교안: 일반학생 과제에 비하여 추론의 양이 '많아야' 하며, 구두 및 서술형식으로 추론 설명 요구.","source":{"page":18,"section":"영재교육과정의 차별화 – 도전성","quote":"반복적인 내용에 대해 흥미를 가지지 못하기 때문에 도전적인 과제 필요 ‣ 일반학생의 과제에 비하여 추론의 양이 많아야 하며, 구두 및 서술형식으로 자신들의 추론을 설명할 것 요구"}},{"id":"33-21","type":"옳은 것","q":"차별화 요소 '창의적 산출'에 대한 설명으로 옳은 것은?","box":null,"choices":["활동 결과물로 유형적인 것(보고서, 포트폴리오 등)과 무형적인 것(발표회, 정의적 태도 등)을 모두 포함한다.","활동 결과물은 보고서, 포트폴리오 등 유형적인 것만 인정한다.","발표회는 유형적 결과물에 해당한다.","산출물은 기존 학습을 그대로 재현하는 것이면 충분하다.","학생에게 대안적 과제를 선택할 기회는 주지 않는다."],"answer":1,"explain":"유형적(보고서, 포트폴리오)·무형적(발표회, 정의적 태도) 모두 포함. 학생은 대안적 과제나 산출물을 완성할 기회를 가져야 하며, 산출물은 학습이나 상황을 새롭게 향상시켜야 함 → 창의성 교육 도입.","source":{"page":19,"section":"영재교육과정의 차별화 – 창의적 산출","quote":"영재교육과정의 활동결과물로서 유형적인 것(보고서, 포트폴리오 등)과 무형적인 것(발표회, 정의적 태도 등) 모두를 포함함"}},{"id":"33-22","type":"빈칸","q":"다음 (   )에 들어갈 차별화 요소로 알맞은 것은?","box":"내용의 (   ): 차별화란 학문 내 혹은 학문 간 개념적 사고에 초점을 둠. 학생들이 복잡한 개념을 일반화하거나 자신이 발견한 새로운 현상을 구체화함으로써 개념이나 지식체계가 추상적인 사고방식으로 전이되는 것","choices":["복잡성(complexity)","깊이(depth)","도전성","추상성(abstractness)","다양성"],"answer":4,"explain":"내용의 추상성(abstractness)의 설명.","source":{"page":20,"section":"영재교육과정의 차별화 – 내용의 추상성(abstractness)","quote":"차별화란 학문 내 혹은 학문 간 개념적 사고에 초점을 둠 ‣ 학생들이 복잡한 개념을 일반화하거나 자신이 발견한 새로운 현상을 구체화함으로써 개념이나 지식체계가 추상적인 사고방식으로 전이되는 것"}}]},{"lesson":34,"title":"영재 차별화 교육과정(2)","file":"4. 교안 (31~60)[1] (1)/34.pdf","summary":["집단편성: 전체 학급그룹 = 혼합능력집단(이질적) 또는 비슷한 능력집단(동질적) / 프로젝트·피어튜터링 2~4명, 학급 내 학업성취/능력에 따른 차별화 5명~8명, 풀아웃 또는 학급 내 심화학습 8명~12명, 특정 영역 수행수준 기준 집단화","집단편성 장점: 작고 동질적 → 다양한 재료·교수전략 제공 쉬움, 학구적 분위기, 지적 동료일 때 사회적 상호작용·우정형성 쉬움, '톡톡 튀는' 생각 반사·스파크","소집단활동 지원자 특성: 인지 기능(IQ 130 이상, 학년에 비해 학업적 성취능력 높음, 느린 속도·시간 부족에 좌절) / 성격(학문적으로 동기화, 학교생활 즐김, 학문적 기술 있음에도 생산성 떨어지는 학생) / 학습 선호(빠른 속도, 융통성 있는 스케줄, 비슷한 능력 소집단) / 흥미(광범위, 학교 밖 활동 적극)","렌줄리 다중메뉴모형: 지식 + 교수기법 = 교육과정 / 지식메뉴, 수업목표와 학생활동메뉴, 수업전략메뉴, 수업계열성메뉴, 예술적 수정 → 수업생산성 메뉴(구체적 생산성: 지식·글로·말로 표현된 생산물·예술적 수행 / 추상적 생산성: 인지구조·문제해결·전략/가치/평가·자아실현)","지식메뉴: ①개념과 정의 ②원리와 기능 ③특수성(사실, 관습, 경향, 분류, 준거) ④방법론(표준적인 연구절차)","수업목표 및 학생활동메뉴: ①동화와 파지(듣기, 관찰, 읽기, 조작, 노트 정리 = 정보투입) ②정보분석(분류, 서열, 자료 수집, 해석, 대안 탐색, 결론, 설명) ③정보의 종합과 응용(쓰기, 말하기, 구성하기, 수행하기) ④가치관·전통적 표준에 따라 재고·판단","수업전략메뉴: 연습과 암기, 강의, 토의, 동료 지도, 학습센터 활동, 모의수업과 역할놀이, 학습 게임 / 수업계열메뉴: 주의 집중 유도, 목표 제시, 선수 학습과 관련, 자료 제시, 수행평가, 피드백 제공, 전이 기회 설명 / 예술적 수정메뉴: 교사의 개인적 경험·관심·취미·가치관 공유, 관련 책·영화, 논란성","반타셀바스카(J. Van Tassel-Baska): 과정 산출(주제 선택·탐구, 단일 주제 높은 관심, 과학·문제해결중심 수학) / 내용 숙련(진단-처방, 학습 속도 단축, 2년 정도 선행, 설득문, 성취동기 높을 때, 외국어·영어 문법·읽기) / 인식론적(전체 구조 속 특정 개념, 토론과 논쟁, 반성적 사고, 교사 = 논쟁 유도 질문자, 인문학·역사·경제)","렌쥴리 심화 3단계: 1단계 초청강연 등 정규과정에 없는 기회로 다양한 주제 발견 / 2단계 집단단위 학습활동, 정의적·인지적 훈련, 학습방법 학습 / 3단계 독자적인 연구, 예술, 작문 등 산출물","간학문적 교수학습: 창의적·생산적 사람 육성 위해 사고촉진활동 필요 / 1. 적절한 범위의 주제 선정 2. 브레인스토밍(각 영역별 질문) 3. 탐구를 위한 4~5개 간학문적 질문 구성 4. 교수활동 설계와 실행(내용, 과정, 교수 및 평가)"],"questions":[{"id":"34-01","type":"옳은 것","q":"집단편성의 종류와 구성 인원의 연결로 옳은 것은?","box":null,"choices":["프로젝트나 피어튜터링을 위한 그룹 – 5명~8명","학급 내에서 학업성취/능력에 따라 교육과정 차별화를 목적으로 한 그룹 – 2~4명","풀아웃 또는 학급 내 심화학습 그룹 – 8명~12명","풀아웃 심화학습 그룹 – 12명~15명","피어튜터링 그룹 – 8명~12명"],"answer":3,"explain":"프로젝트·피어튜터링 2~4명, 학급 내 학업성취/능력에 따른 차별화 5명~8명, 풀아웃 또는 학급 내 심화학습 8명~12명.","source":{"page":3,"section":"01. 차별화 교육과정의 개념 – 집단편성의 종류","quote":"프로젝트나 피어튜터링을 위해 2~4명으로 구성된 그룹 • 보통 한 학급 내에서 학업성취/능력에 따라 교육과정의 차별화를 목적으로 5명~8명으로 구성된 그룹 • 풀아웃 또는 학급 내에서 8명~12명으로 구성된 심화학습 그룹"}},{"id":"34-02","type":"빈칸","q":"다음 (가), (나)에 들어갈 말로 알맞은 것은?","box":"전체 학급그룹은 전형적으로 혼합능력집단(가) 또는 비슷한 능력집단(나)의 두 가지 성격을 지닌다.","choices":["(가) 이질적인 집단, (나) 동질적인 그룹","(가) 동질적인 그룹, (나) 이질적인 집단","(가) 심화학습 그룹, (나) 속진학습 그룹","(가) 소집단, (나) 대집단","(가) 협력 집단, (나) 경쟁 집단"],"answer":1,"explain":"혼합능력집단 = 이질적인 집단, 비슷한 능력집단 = 동질적인 그룹.","source":{"page":3,"section":"집단편성의 종류","quote":"전체 학급그룹은 전형적으로 혼합능력집단(이질적인 집단) 또는 비슷한 능력집단(동질적인 그룹)의 두 가지 성격을 지닌다"}},{"id":"34-03","type":"옳지 않은 것","q":"집단편성의 장점으로 옳지 않은 것은?","box":null,"choices":["학습 분위기가 지적 노력을 지지하고 학구적이다.","다른 학생들이 지적 동료일 때 사회적 상호작용과 우정 형성이 더 쉬워진다.","총명한 아이들이 서로 '톡톡 튀는' 생각을 반사하고 스파크를 일으켜 인지적·사회적으로 더욱 발달할 수 있다.","유사한 능력과 흥미를 가진 동료와 함께 있을 때 더욱 발달할 수 있다.","학습 집단이 크고 이질적이기 때문에 다양한 재료와 교수전략을 제공하기 쉽다."],"answer":5,"explain":"교안: 학습 집단의 크기가 '작고 동질적'이기 때문에 다양한 재료와 교수전략을 제공하기 쉬움.","source":{"page":4,"section":"집단편성의 장점","quote":"학습 집단의 크기가 작고 동질적이기 때문에 다양한 재료와 교수전략을 제공하기 쉬움"}},{"id":"34-04","type":"빈칸","q":"소집단활동 지원자의 특성(인지 기능)에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"인지 기능: 현재 학년의 다른 학생들보다 성취를 잘하고 있음 • IQ (   ) 이상","choices":["110","120","130","140","150"],"answer":3,"explain":"교안: IQ 130 이상.","source":{"page":5,"section":"소집단활동 지원자의 특성 – 인지 기능","quote":"IQ 130 이상 • 학년에 비해 학업적 성취능력이 높음"}},{"id":"34-05","type":"보기 조합","q":"소집단활동 지원자의 특성 중 '인지 기능'에 해당하는 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 학년에 비해 학업적 성취능력이 높음\nㄴ. 현재 학년의 일반교실 장면에서의 느린 속도에 좌절하고 있는 학생\nㄷ. 깊이 있는 학습을 위해 시간이 부족하여 좌절하는 학생\nㄹ. 현재 학년의 다른 학생들보다 성취가 낮음","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"인지 기능은 '현재 학년의 다른 학생들보다 성취를 잘하고 있음'. ㄹ은 반대. (학문적 기술이 있음에도 학교에서 생산성이 떨어지는 학생은 '개인의 성격 특성'에 포함.)","source":{"page":5,"section":"소집단활동 지원자의 특성","quote":"인지 기능: 현재 학년의 다른 학생들보다 성취를 잘하고 있음 / • IQ 130 이상 • 학년에 비해 학업적 성취능력이 높음 • 현재 학년의 일반교실 장면에서의 느린 속도에 좌절하고 있는 학생 • 배운 것에 대한 깊이 있는 생각 또는 깊이 있는 학습을 위해 시간이 부족하여 좌절하는 학생"}},{"id":"34-06","type":"옳지 않은 것","q":"소집단활동 지원자의 학습 선호 및 흥미 특성으로 옳지 않은 것은?","box":null,"choices":["빠른 속도와 도전적인 학습경험을 선호한다.","학습에 고정된 스케줄을 선호한다.","비슷한 능력을 가진 소집단 활동을 즐긴다.","광범위한 흥미를 가진다.","학교 밖에서의 다양한 활동과 취미생활에 적극적으로 참여한다."],"answer":2,"explain":"교안: 학습에 '융통성 있는' 스케줄을 선호함.","source":{"page":6,"section":"소집단활동 지원자의 특성 – 학습 선호, 흥미","quote":"빠른 속도와 도전적인 학습경험을 선호함 • 학습에 융통성 있는 스케줄을 선호함 • 비슷한 능력을 가진 소집단 활동을 즐김"}},{"id":"34-07","type":"옳은 것","q":"렌줄리 다중메뉴모형(multiple menu model)의 구조에 대한 설명으로 옳은 것은?","box":null,"choices":["교육과정은 지식과 평가의 합으로 구성된다.","자아실현은 구체적 생산성에 해당한다.","인지구조와 문제해결은 구체적 생산성에 해당한다.","구체적 생산성에는 지식, 글로 표현된 생산물, 말로 표현된 생산물, 예술적 수행이 포함된다.","수업전략메뉴와 수업계열성메뉴는 '지식'에서 파생된다."],"answer":4,"explain":"지식 + 교수기법 = 교육과정. 교수기법에서 수업목표와 학생활동메뉴·수업전략메뉴·수업계열성메뉴·예술적 수정이 파생. 수업생산성 메뉴: 구체적 생산성(지식, 글로·말로 표현된 생산물, 예술적 수행) / 추상적 생산성(인지구조, 문제해결, 전략/가치/평가, 자아실현). (PDF 8쪽 도식 확인)","source":{"page":8,"section":"02. 차별화 교육과정의 모형 – 렌줄리 다중메뉴모형","quote":"지식 글로 표현된 생산물 말로 표현된 생산물 예술적 수행 / 수업생산성메뉴 구체적 생산성 추상적 생산성 인지구조 문제해결 전략 / 가치 / 평가 자아실현"}},{"id":"34-08","type":"개념 찾기","q":"렌줄리 다중메뉴모형의 지식메뉴 중 '해당 분야의 중요한 사실, 관습, 경향, 분류, 준거'와 관련된 것은?","box":null,"choices":["특수성에 대한 지식","개념과 정의에 관한 지식","원리와 기능에 관한 지식","방법론에 관한 지식","가치에 관한 지식"],"answer":1,"explain":"셋째 '특수성에 대한 지식'의 내용. 방법론에 관한 지식은 특정 영역에서의 표준적인 연구절차와 관련된 지식.","source":{"page":9,"section":"렌줄리 다중메뉴모형 – 지식메뉴","quote":"셋째는 특수성에 대한 지식 / • 해당 분야의 중요한 사실, 관습, 경향, 분류, 준거"}},{"id":"34-09","type":"옳은 것","q":"렌줄리 다중메뉴모형의 지식메뉴를 첫째부터 넷째까지 순서대로 바르게 나열한 것은?","box":null,"choices":["원리와 기능 → 개념과 정의 → 특수성 → 방법론","개념과 정의 → 특수성 → 원리와 기능 → 방법론","방법론 → 개념과 정의 → 원리와 기능 → 특수성","개념과 정의 → 방법론 → 특수성 → 원리와 기능","개념과 정의 → 원리와 기능 → 특수성 → 방법론"],"answer":5,"explain":"첫째 개념과 정의, 둘째 원리와 기능, 셋째 특수성, 넷째 방법론(특정 영역의 표준적인 연구절차).","source":{"page":9,"section":"렌줄리 다중메뉴모형 – 지식메뉴","quote":"첫째는 개념과 정의에 관한 지식 ‣ 둘째는 원리와 기능에 관한 지식 ‣ 셋째는 특수성에 대한 지식 … ‣ 넷째는 방법론에 관한 지식 / • 특정 영역에서의 표준적인 연구절차와 관련된 지식"}},{"id":"34-10","type":"개념 찾기","q":"수업목표 및 학생활동메뉴 중 '분류, 서열, 자료 수집, 해석, 대안 탐색, 결론, 설명 등 상위 수준의 이해'에 해당하는 것은?","box":null,"choices":["동화와 파지","정보분석","정보의 종합과 응용","가치에 따른 재고와 판단","주의 집중 유도"],"answer":2,"explain":"둘째 '정보분석'. 첫째 동화와 파지(듣기·관찰·읽기·조작·노트 정리 = 정보투입), 셋째 정보의 종합과 응용(쓰기·말하기·구성하기·수행하기), 넷째 개인의 가치관·전통적 표준에 따라 정보를 재고하고 판단.","source":{"page":10,"section":"렌줄리 다중메뉴모형 – 수업목표 및 학생 활동메뉴","quote":"둘째는 정보분석 / • 분류, 서열, 자료 수집, 해석, 대안 탐색, 결론, 설명 등 상위 수준의 이해"}},{"id":"34-11","type":"사례","q":"다음 사례의 학생 활동은 렌줄리 다중메뉴모형의 수업목표 및 학생활동메뉴 중 어느 단계에 해당하는가?","box":"학생들이 강의를 듣고, 실험 장면을 관찰하며, 관련 자료를 읽고 노트 정리를 하면서 정보를 받아들이고 있다.","choices":["정보분석","정보의 종합과 응용","동화와 파지","가치에 따른 재고와 판단","방법론에 관한 지식"],"answer":3,"explain":"듣기, 관찰, 읽기, 조작, 노트 정리 등과 같은 정보투입 과정 = 첫째 '동화와 파지'.","source":{"page":10,"section":"렌줄리 다중메뉴모형 – 수업목표 및 학생 활동메뉴","quote":"첫째는 동화와 파지 / • 듣기, 관찰, 읽기, 조작, 노트 정리 등과 같은 정보투입과정"}},{"id":"34-12","type":"옳지 않은 것","q":"렌줄리 다중메뉴모형의 '수업전략메뉴'에 해당하지 않는 것은?","box":null,"choices":["연습과 암기","토의","모의수업과 역할놀이","피드백 제공","학습 게임"],"answer":4,"explain":"수업전략메뉴: 연습과 암기, 강의, 토의, 동료 지도, 학습센터 활동, 모의수업과 역할놀이, 학습 게임. '피드백 제공'은 수업계열메뉴.","source":{"page":11,"section":"렌줄리 다중메뉴모형 – 수업전략메뉴","quote":"연습과 암기 ‣ 강의 ‣ 토의 ‣ 동료 지도 ‣ 학습센터 활동(학습 또는 흥미위주 활동) ‣ 모의수업과 역할놀이 ‣ 학습 게임"}},{"id":"34-13","type":"개념 찾기","q":"렌줄리 다중메뉴모형에서 다음 항목들로 구성된 메뉴는?","box":"주의 집중 유도 → 목표 제시 → 선수 학습과 관련시키기 → 자료 제시 → 수행평가 → 피드백 제공 → 전이 기회와 적용 잠재성에 대한 설명","choices":["지식메뉴","수업전략메뉴","예술적 수정메뉴","수업목표 및 학생활동메뉴","수업계열메뉴"],"answer":5,"explain":"수업계열(성)메뉴의 항목.","source":{"page":12,"section":"렌줄리 다중메뉴모형 – 수업계열메뉴","quote":"주의 집중 유도 ‣ 목표 제시 ‣ 선수 학습과 관련시키기 ‣ 자료 제시 ‣ 수행평가 ‣ 피드백 제공 ‣ 전이 기회와 적용 잠재성에 대한 설명 등"}},{"id":"34-14","type":"사례","q":"다음 사례의 교사 행동은 렌줄리 다중메뉴모형의 어느 메뉴에 해당하는가?","box":"교사가 학습 주제와 관련된 자신의 개인적 경험과 취미를 학생들과 나누고, 주제와 관련된 영화를 소개하며 신문 기사가 가질 수 있는 논란성을 보여주었다.","choices":["예술적 수정메뉴","수업계열메뉴","수업전략메뉴","지식메뉴","수업생산성 메뉴"],"answer":1,"explain":"예술적 수정메뉴: 학습내용과 연관 있는 개인적 경험 공유, 개인적 관심·취미 소개, 가치관과 신념 공유, 관련 책·영화, 책·신문 등의 논란성.","source":{"page":13,"section":"렌줄리 다중메뉴모형 – 예술적 수정메뉴","quote":"학습내용과 직간접적으로 연관 있는 개인적 경험을 학생과 공유 ‣ 개인적 관심, 취미 등 소개 ‣ 개인적 가치관과 신념 공유 ‣ 학습 주제와 관련된 책, 영화 등 ‣ 책, 신문 등이 가질 수 있는 논란성들을 보여줌"}},{"id":"34-15","type":"옳은 것","q":"반타셀바스카(J. Van Tassel-Baska)가 제안한 교육과정 모형과 적용 과목의 연결로 옳은 것은?","box":null,"choices":["과정 산출 연구 모형 – 외국어, 문법, 읽기","과정 산출 연구 모형 – 과학, 문제해결중심 수학","내용 숙련 모형 – 인문학, 역사, 경제","인식론적 개념 모형 – 과학, 문제해결중심 수학","인식론적 개념 모형 – 외국어, 문법, 읽기"],"answer":2,"explain":"과정 산출 = 과학, 문제해결중심 수학 / 내용 숙련 = 외국어(영어) 문법, 읽기 / 인식론적 개념 = 인문학, 역사, 경제.","source":{"page":14,"section":"반타셀바스카(J. Van Tassel-Baska)가 제안한 모형","quote":"과정산출연구모형 과학, 문제해결중심 수학 / 내용숙련모형 외국어, 문법, 읽기 / 인식론적개념모형 인문학, 역사, 경제"}},{"id":"34-16","type":"개념 찾기","q":"반타셀바스카의 교육과정 모형 중 다음 설명에 해당하는 차원은?","box":"• 진단-처방 • 학습 속도 단축 • 영재들의 고차원적 내용에 대한 욕구 충족 • 2년 정도 선행된 개념을 이해하고 상대방을 설득하는 설득문 작성 • 학생: 학습 성취동기가 높을 때 효과","choices":["과정 산출 차원","인식론적 차원","내용 숙련 차원","간학문적 차원","심화 3단계 차원"],"answer":3,"explain":"내용 숙련 차원의 특징(외국어, 영어 문법, 읽기 과목에 효과).","source":{"page":15,"section":"반타셀바스카가 제안한 모형 – 교육과정 모형","quote":"내용숙련차원 •진단-처방 •학습 속도단축 •영재들의 고차원적 내용에 대한 욕구를 충족시키기 위한 것 • 2년 정도 선행된 개념을 이해하고, 상대방을 설득하는 설득문 작성 •학생: 학습 성취동기가 높을 때 효과"}},{"id":"34-17","type":"옳지 않은 것","q":"반타셀바스카의 교육과정 모형에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["과정 산출 차원은 학생이 단일 주제에 높은 관심을 가질 때 적합하다.","과정 산출 차원은 사고와 추리가 강조되며 영재들이 독창적인 산출물을 생산하도록 돕는다.","인식론적 차원은 토론과 논쟁을 통해 공감, 감정 이해 등 정의적·지적 목표를 통합한다.","인식론적 차원은 높은 언어 추리력과 광범위한 흥미를 지니고 읽기를 좋아하는 학생에게 적합하다.","인식론적 차원에서 교사의 역할은 진단-처방을 내리는 관리자이다."],"answer":5,"explain":"인식론적 차원에서 교사의 역할은 '적절한 논쟁을 유도하는 질문자'. 진단-처방은 내용 숙련 차원의 특징.","source":{"page":15,"section":"반타셀바스카가 제안한 모형 – 인식론적 차원","quote":"문학작품, 글짓기 과정 등을 통해서 영재들의 반성적 사고를 촉진하고, 그 결과로 어떤 변화가 일어나는지에 관심 •교사의 역할: 적절한 논쟁을 유도하는 질문자"}},{"id":"34-18","type":"사례","q":"렌쥴리 심화 3단계 모형에 비추어 볼 때, 다음 사례에 해당하는 단계는?","box":"앞 단계 활동으로 흥미를 갖게 된 학생이 스스로 주제를 정해 독자적인 연구를 수행하고, 그 결과를 작품과 보고서 등 산출물로 만들고 있다.","choices":["1단계","2단계","1단계와 2단계의 중간","3단계","사전 단계(판별 단계)"],"answer":4,"explain":"3단계: 독자적인 연구, 예술, 작문 등 산출물을 만드는 단계. 1단계는 초청강연 등으로 다양한 주제 발견, 2단계는 집단단위 학습활동·훈련.","source":{"page":16,"section":"렌쥴리 심화 3단계 모형","quote":"3단계 독자적인 연구, 예술, 작문 등 산출물을 만드는 단계"}},{"id":"34-19","type":"옳은 것","q":"렌쥴리 심화 3단계 모형에 대한 설명으로 옳은 것은?","box":null,"choices":["2단계는 집단단위의 학습활동으로, 정의적 훈련, 인지적 훈련(비판적·창의적 사고기술), 학습방법 학습(듣기, 관찰, 노트 정리 등) 등을 포함한다.","1단계는 독자적인 연구를 통해 산출물을 만드는 단계이다.","3단계는 초청강연 등 정규과정에 없는 기회를 제공하는 단계이다.","1단계는 비판적 사고기술 등 인지적 훈련을 하는 단계이다.","2단계는 개인별 독자적인 예술 작품을 완성하는 단계이다."],"answer":1,"explain":"1단계 = 초청강연 등 정규과정에 없는 기회 제공 → 다양한 주제·흥미·원리·사건 발견, 2단계 = 집단단위 학습활동·정의적/인지적 훈련·학습방법 학습·참고문헌 이용·쓰기·언어적 의사소통, 3단계 = 독자적 연구·예술·작문 등 산출물.","source":{"page":16,"section":"렌쥴리 심화 3단계 모형","quote":"2단계 집단단위의 학습활동, 정의적 훈련(대인 간 기술 등), 인지적 훈련(비판적 사고기술, 창의적 사고기술), 학습방법 학습(듣기, 관찰, 노트 정리 등), 참고문헌 이용, 쓰기, 언어적 의사소통능력"}},{"id":"34-20","type":"빈칸","q":"간학문적 교수학습(간학문적 교육과정)에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"1. 적절한 범위의 주제 선정 → 2. 브레인스토밍: 문제에 대한 각 영역별 질문 → 3. 탐구를 위한 (   )개 간학문적 질문 구성 → 4. 교수활동 설계와 실행: 내용, 과정, 교수 및 평가","choices":["2~3","4~5","6~7","8~10","10~12"],"answer":2,"explain":"탐구를 위한 4~5개 간학문적 질문 구성. (PDF 17쪽 도식 확인)","source":{"page":17,"section":"간학문적 교수학습","quote":"탐구를 위한 4~5개 간학문적 질문 구성"}},{"id":"34-21","type":"옳은 것","q":"간학문적 교수학습에 대한 설명으로 옳은 것은?","box":null,"choices":["간학문적 교육과정은 교수활동 설계와 실행으로 시작한다.","브레인스토밍은 주제 선정 이전 단계에서 실시한다.","창의적, 생산적 사람 육성을 위해 사고촉진활동이 필요하며, 질문에 기초한 활동으로 '이 분야에서 목적 또는 사명은?', '하위 분야의 질문은?' 등을 다룬다.","간학문적 질문은 1개로 한정한다.","교수활동 설계와 실행에서 평가는 제외한다."],"answer":3,"explain":"도식(PDF 확인): 창의적·생산적 사람 육성을 위해 사고촉진활동 필요. 질문에 기초한 활동 = 이 분야에서 목적 또는 사명은? / 하위 분야의 핵심 영역은? / 하위 분야의 질문은?. 간학문적 교육과정은 주제 선정 → 브레인스토밍 → 4~5개 질문 구성 → 교수활동 설계와 실행(내용, 과정, 교수 및 평가).","source":{"page":17,"section":"간학문적 교수학습","quote":"이 분야에서 목적 또는 사명은? / 창의적, 생산적 사람 육성을 위해 사고촉진활동 필요 / 하위 분야의 질문은?"}}]},{"lesson":35,"title":"인문사회 융합 영재교육 개발(1)","file":"4. 교안 (31~60)[1] (1)/35.pdf","summary":["융합교육 프로그램 개발의 핵심적 요소 6가지: 학문의 본질적 것(지식, 개념, 원리)에 초점 / 영재학생의 개인차 고려 / 평가와 수업을 별개로 보지 않으며 다양한 평가방식 사용 / 영재학생이 원하는 학습과제에 참여 / 비판적이고 창의적인 사고 강조 / 내용, 과정, 산출물의 개별화 추구","융합 영재교육과정 개발 시 고려할 점: 기초사고기능과 고등사고기능을 통합, 학문 분야를 통합한 광범위한 이슈 또는 주제, 학생이 주제를 선택해 자기주도적 학습, 주제·학습 과정·활동 중심, 도전과 실험정신, 계열성과 통합성, 팀의 협동정신","융합교육의 유형: 교과병렬식 유형(지구과학, 물리, 화학 등 각 교과의 주제를 번갈아 운영, 캠프·산출물 대회 유형) / 주제중심 프로젝트 유형(3~4주간 장기 프로젝트, 예: '에너지의 탄생', '수묵화의 하모니', '빛, 눈과 뇌의 하모니', '생각의 탄생') / 주제 및 내용 융합 유형(수학과 체육 등, 각 주제별 담당교사 1명)","Tip: 교과기반 융합과 실생활기반 융합, 체험활동중심 융합과 이해중심 융합으로 나눌 수도 있음(김주아 외(2016), 이정규 외(2022)에서 재인용)","개발 절차: 인재상 및 핵심역량 정립 → 교육목표 및 내용체계 모형도 작성 → 차시별 소주제 선정 → 세부 내용 선정 및 조직 → 교수학습활동 구안 → 성취기준, 평가방법 작성 → 교수학습 시 유의점 제시 → 타당성 검토 후 수정 완성","인문학(humanities): 자연과학(natural science)의 상대적 개념, 인간과 관련된 근원적인 문제나 사상, 문화 등을 연구 / 미국 국회법: 언어·언어학·문학·역사·법률·철학·고고학·예술사·비평·예술의 이론과 실천 / 고대 그리스·로마 → 서양 중세 주요 교육과목 → 르네상스 시대 역사와 문학 추가","김대식 '빅퀘스쳔': 인문학은 인간의 천성을 스스로 반성하고 미래를 만들어가는 학문 / 국가과학기술표준분류체계(2023년 개정, 한국과학기술기획평가원) 인문학 분류","인문학의 중요성: 인문학은 끊임없는 질문, 기계와 인간을 구분해주는 척도 / 메리 올리버(플리처상 수상 미국 생태시인): 사랑하는 힘과 질문하는 능력 / 스티브 잡스: Think Different! / 빌 게이츠: 인문학이 없다면 나도 없고 컴퓨터도 없었을 것","영화: 바이센테니얼맨(1999), 메트로폴리스(1927년 독일 흑백무성영화, 독일 표현주의, 감독 프리츠 랑) / AI 그림 미술대회 우승(콜로라도 주립박람회 디지털아트 부문, '스페이스 오페라 극장', 서울신문 2022. 09. 04)","캔터베리 대성당 장서 2천 권, 구글북스 라이브러리 프로젝트 3000만 권, 미 의회도서관 3300만 권 / 미셸 세르: 호미네상스(Hominescence), “아는 것이 힘”이 아닌 “창조만이 유일하고 진정한 지적 행위”, 신인류(엄지 세대, 클라우드 세대)","미래사회 역량: 가드너(2007) 5 minds, 송인섭 등(2008) 통찰력·융합·창의·리더십, 성은현 등(2010) 통찰력·통합·소통·창의, 이정규(2020) 창의력·융합력·자기주도력·공감협업력, 김주아(2021) 회복탄력성 등 → 공통: 불확실성에 대처하는 역량(변혁적 역량) - 창의성, 협업, 소통, 책임감","OECD 학습나침반 2030 변혁적 역량: 새로운 가치 창조하기, 긴장과 딜레마 조정하기, 책임감 갖기 / 클라우스 슈밥(2017) 세 가지 도전과제 / 2022 개정 교육과정 인간상: 자기주도성, 창의와 혁신, 포용성과 시민성"],"questions":[{"id":"35-01","type":"옳은 것","q":"교안에서 인문사회 융합 영재교육 자료로 소개된 영화에 대한 설명으로 옳은 것은?","box":null,"choices":["'바이센테니얼맨'은 1927년에 제작된 영화이다.","'메트로폴리스'는 1999년 미국의 컬러 영화이다.","'메트로폴리스'는 1927년 독일의 흑백 무성영화로 감독은 프리츠 랑이다.","'메트로폴리스'는 프랑스 인상주의를 대표하는 영화이다.","'바이센테니얼맨'의 감독은 프리츠 랑이다."],"answer":3,"explain":"메트로폴리스(Metropolis): 1927년 독일의 흑백 무성영화, 독일 표현주의 대표적 영화, 감독 프리츠 랑. 바이센테니얼맨은 1999년 작품이다. ①② 연도 바꿔치기 ④ 독일 표현주의 ⑤ 프리츠 랑은 메트로폴리스의 감독.","source":{"page":18,"section":"메트로폴리스(Metropolis)","quote":"1927년 독일의 흑백 무성영화 독일 표현주의 대표적 영화 감독: 프리츠 랑"}},{"id":"35-02","type":"옳지 않은 것","q":"융합교육 프로그램 개발의 핵심적 요소로 옳지 않은 것은?","box":null,"choices":["학문의 본질적 것(지식, 개념, 원리)에 초점을 맞춘다.","영재학생의 개인차를 고려한다.","영재학생이 원하는 학습과제에 참여한다.","평가와 수업을 별개로 보고 표준화된 단일 평가방식을 사용한다.","비판적이고 창의적인 사고를 강조한다."],"answer":4,"explain":"교안은 '평가와 수업을 별개로 보지 않으며 다양한 평가방식을 사용'이라고 한다. 핵심적 요소 6가지: 학문의 본질적 것에 초점, 개인차 고려, 평가와 수업 통합·다양한 평가, 원하는 학습과제 참여, 비판적·창의적 사고 강조, 내용·과정·산출물의 개별화.","source":{"page":4,"section":"융합교육 프로그램 개발의 핵심적 요소","quote":"셋째, 평가와 수업을 별개로 보지 않으며 다양한 평가방식을 사용"}},{"id":"35-03","type":"빈칸","q":"다음은 융합교육 프로그램 개발의 핵심적 요소 중 일부이다. (   )에 들어갈 말로 알맞은 것은?","box":"여섯째, 내용, 과정, (   )의 개별화를 추구","choices":["평가","산출물","목표","환경","교재"],"answer":2,"explain":"여섯째 요소는 '내용, 과정, 산출물의 개별화를 추구'이다.","source":{"page":4,"section":"융합교육 프로그램 개발의 핵심적 요소","quote":"여섯째, 내용, 과정, 산출물의 개별화를 추구"}},{"id":"35-04","type":"옳지 않은 것","q":"융합 영재교육과정 개발 시 고려할 점으로 옳지 않은 것은?","box":null,"choices":["교사가 주제를 지정하여 교사 주도적 학습이 되게 한다.","학문 분야를 통합한 광범위한 이슈 또는 주제와 관련된 내용을 제시한다.","기초사고기능과 고등사고기능을 통합한다.","주제 중심, 학습 과정 중심, 활동 중심의 교육과정을 구성한다.","계열성과 통합성을 가지며 팀의 협동정신을 길러야 한다."],"answer":1,"explain":"교안은 '학생들이 주제를 선택하여 자기주도적 학습이 되게 함'이다. 그 외 도전과 실험정신 함양도 고려할 점이다.","source":{"page":5,"section":"융합 영재교육과정 개발 시 고려할 점","quote":"학생들이 주제를 선택하여 자기주도적 학습이 되게 함"}},{"id":"35-05","type":"개념 찾기","q":"영재학교 및 영재교육원에서 운영하는 융합교육의 유형 중 다음 설명에 해당하는 것은?","box":"지구과학, 물리, 화학 등 각 교과의 주제를 번갈아서 운영하는 형태이며, 캠프, 산출물 대회 유형이 이에 해당한다.","choices":["주제중심 프로젝트 유형","주제 및 내용 융합 유형","실생활기반 융합 유형","이해중심 융합 유형","교과병렬식 유형"],"answer":5,"explain":"교과병렬식 유형의 설명이다. ① 주제 중심으로 3~4주간 장기 프로젝트 ② 한 주제에 대해 수학과 체육 등 교과 간 융합, 담당교사 1명 ③④ Tip에 제시된 다른 분류 방식이다.","source":{"page":6,"section":"영재학교 및 영재교육원에서 운영하는 융합교육의 유형 - 교과병렬식 유형","quote":"지구과학, 물리, 화학 등 각 교과의 주제를 번갈아서 운영하는 형태 캠프, 산출물 대회 유형"}},{"id":"35-06","type":"빈칸","q":"다음은 주제중심 프로젝트 유형에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"• 개별 교과보다는 각각의 주제 중심으로 개념, 기능 등에 초점을 둠\n• 프로젝트 주제별로 (   )간의 장기 프로젝트 형식으로 운영\n• 주제의 예: '에너지의 탄생', '수묵화의 하모니', '빛, 눈과 뇌의 하모니', '생각의 탄생'","choices":["1~2주","3~4주","5~6주","한 학기","1년"],"answer":2,"explain":"주제중심 프로젝트 유형은 프로젝트 주제별로 3~4주간의 장기 프로젝트 형식으로 운영한다.","source":{"page":7,"section":"주제중심 프로젝트 유형","quote":"프로젝트 주제별로 3~4주간의 장기 프로젝트 형식으로 운영"}},{"id":"35-07","type":"사례","q":"다음 사례의 영재교육원이 운영하는 융합교육의 유형으로 알맞은 것은?","box":"○○영재교육원은 '황금비'라는 한 주제에 대해 수학과 미술을 융합한 교육과정을 운영한다. 이 주제는 담당교사 1명이 맡아 운영한다.","choices":["교과병렬식 유형","주제중심 프로젝트 유형","캠프 유형","주제 및 내용 융합 유형","산출물 대회 유형"],"answer":4,"explain":"주제 및 내용 융합 유형: 한 주제에 대해 수학과 체육, 수학과 미술, 수학과 음악, 과학과 음악, 과학과 미술의 형태로 교과 간 융합 교육과정을 운영하며, 각 주제별 담당교사는 1명이 운영한다. ①③⑤ 각 교과 주제를 번갈아 운영(교과병렬식) ② 3~4주간 장기 프로젝트.","source":{"page":8,"section":"주제 및 내용 융합 유형","quote":"한 주제에 대해 수학과 체육, 수학과 미술, 수학과 음악, 과학과 음악, 과학과 미술의 형태로 교과 간 융합 교육과정을 운영 ‣ 각 주제별 담당교사는 1명이 운영"}},{"id":"35-08","type":"옳은 것","q":"융합교육 유형의 분류에 관한 교안의 'Tip' 내용으로 옳은 것은?","box":null,"choices":["교과기반 융합과 실생활기반 융합, 체험활동중심 융합과 이해중심 융합으로 나눌 수도 있다.","교과기반 융합과 이해중심 융합, 실생활기반 융합과 평가중심 융합으로 나눌 수도 있다.","단일교과 융합과 다교과 융합, 온라인 융합과 오프라인 융합으로 나눌 수도 있다.","교사중심 융합과 학생중심 융합으로만 나눈다.","이 분류는 클라우스 슈밥(2017)에서 재인용한 것이다."],"answer":1,"explain":"Tip: 교과기반 융합과 실생활기반 융합, 체험활동중심 융합과 이해중심 융합으로 나눌 수도 있음. 출처는 김주아 외(2016), 이정규 외(2022)에서 재인용. ②③④ 교안에 없는 분류 ⑤ 출처 틀림.","source":{"page":8,"section":"영재학교 및 영재교육원에서 운영하는 융합교육의 유형 - Tip","quote":"Tip! 교과기반 융합과 실생활기반 융합, 체험활동중심 융합과 이해중심 융합으로 나눌 수도 있음"}},{"id":"35-09","type":"옳은 것","q":"교안에 제시된 융합 영재교육과정 개발 절차에 대한 설명으로 옳은 것은?","box":null,"choices":["첫 단계는 '타당성 검토 후 수정 완성'이다.","'교수학습활동 구안'은 '인재상 및 핵심역량 정립'보다 먼저 이루어진다.","첫 단계는 '인재상 및 핵심역량 정립'이고 마지막 단계는 '타당성 검토 후 수정 완성'이다.","'성취기준, 평가방법 작성'이 마지막 단계이다.","'차시별 소주제 선정'은 '교수학습 시 유의점 제시' 다음에 이루어진다."],"answer":3,"explain":"절차: 인재상 및 핵심역량 정립 → 교육목표 및 내용체계 모형도 작성 → 차시별 소주제 선정 → 세부 내용 선정 및 조직 → 교수학습활동 구안 → 성취기준, 평가방법 작성 → 교수학습 시 유의점 제시 → 타당성 검토 후 수정 완성. 이 절차의 기반에는 '인문학에 대한 이해'가 제시되어 있다.","source":{"page":9,"section":"융합 영재교육과정 개발 절차","quote":"인재상 및 핵심역량 정립 / 교육목표 및 내용체계 모형도 작성 / 세부 내용 선정 및 조직 / 차시별 소주제 선정 / 교수학습활동 구안 / 성취기준, 평가방법 작성 / 타당성 검토 후 수정 완성 / 교수학습 시 유의점 제시"}},{"id":"35-10","type":"옳지 않은 것","q":"인문학의 개념 및 정의에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["인문학은 객관적인 자연현상을 연구의 영역으로 삼는다.","주로 인간과 관련된 근원적인 문제나 사상, 문화 등을 중심적으로 연구하는 학문을 지칭한다.","인문학(humanities)은 자연과학(natural science)의 상대적인 개념이다.","인문학은 인간의 가치와 관련된 제반 문제를 연구의 영역으로 삼는다.","네이버 국어사전은 인문학을 '언어, 문학, 역사, 철학 따위를 연구하는 학문'으로 정의한다."],"answer":1,"explain":"객관적인 자연현상을 다루는 것은 자연과학이고, 인문학은 인간의 가치와 관련된 제반 문제를 연구 영역으로 삼는다. ⑤는 13쪽 네이버 국어사전 정의이다.","source":{"page":10,"section":"개념 및 정의 - 인문학이란 무엇인가?","quote":"자연과학이 객관적인 자연현상을 다루는 학문인 것에 반해 인문학은 인간의 가치와 관련된 제반 문제를 연구의 영역으로 삼음"}},{"id":"35-11","type":"옳지 않은 것","q":"미국 국회법에 규정된 내용을 중심으로 한 인문학의 정의에 포함된 학문으로 옳지 않은 것은?","box":null,"choices":["언어학(linguistics)","문학(literature)","고고학","예술사","경제학"],"answer":5,"explain":"미국 국회법 기준 인문학: 언어·언어학·문학·역사·법률·철학·고고학·예술사·비평·예술의 이론과 실천, 그리고 인간을 내용으로 하는 학문. 경제학은 제시되지 않았다.","source":{"page":11,"section":"개념 및 정의 - 인문학이란 무엇인가?","quote":"인문학이란 언어· 언어학( 言語學, linguistics)· 문학( 文學, literature)·역사· 법률 · 철학 · 고고학 · 예술사 · 비평 · 예술의 이론과 실천, 그리고 인간을 내용으로 하는 학문을 포함하는 것으로 정의"}},{"id":"35-12","type":"빈칸","q":"다음은 인문학의 역사와 발전 단계에 관한 설명이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"• 인문학의 발전 역사를 보면 철학사상이 발달했던 ( ㉠ ) 시대까지 올라갈 수 있음\n• 이러한 인문학은 서양 중세시대에 주요한 교육과목이었음\n• ( ㉡ ) 시대를 거치면서 역사와 문학 등이 인문학의 주요 영역으로 추가됨","choices":["㉠ 고대 이집트, ㉡ 르네상스","㉠ 고대 그리스, 로마, ㉡ 르네상스","㉠ 고대 그리스, 로마, ㉡ 계몽주의","㉠ 고대 중국, ㉡ 산업혁명","㉠ 중세 유럽, ㉡ 르네상스"],"answer":2,"explain":"인문학은 철학사상이 발달했던 고대 그리스, 로마시대까지 올라가며, 르네상스 시대를 거치면서 역사와 문학 등이 주요 영역으로 추가되었다. 음악, 기하학, 산술, 천문학, 문법, 수사학, 논리학 등이 주요 범주였다.","source":{"page":12,"section":"역사와 발전단계 - 인문학이란 무엇인가?","quote":"인문학의 발전 역사를 보면 철학사상이 발달했던 고대 그리스, 로마시대까지 올라갈 수 있음 ... 르네상스 시대를 거치면서 역사와 문학 등이 인문학의 주요 영역으로 추가됨"}},{"id":"35-13","type":"옳지 않은 것","q":"교안에서 고대~중세 인문학의 주요 범주를 이루었던 것으로 제시된 것이 아닌 것은?","box":null,"choices":["생물학(biology)","기하학(geometry)","수사학(rhetoric)","음악(musicology)","논리학(logic)"],"answer":1,"explain":"음악, 기하학, 산술, 천문학, 문법, 수사학, 논리학 등이 인문학의 주요 범주를 이루었다. 생물학은 제시되지 않았다.","source":{"page":12,"section":"역사와 발전단계 - 인문학이란 무엇인가?","quote":"음악( 音樂, musicology)이나 기하학( 幾何學, geometry), 산술( 算術, arithmetic)과 천문학( 天文學, astronomy) 문법( 文法, grammar)과 수사학( 修辭學, rhetoric), 논리학( 論理學, logic) 등이 인문학의 주요 범주를 이루고 있었음"}},{"id":"35-14","type":"개념 찾기","q":"다음 인문학의 정의를 제시한 출처로 교안에 제시된 것은?","box":"인문학은 인간의 천성을 스스로 반성하고 미래를 만들어가는 학문. 스스로 질문하게 하는 학문, 과학, 철학, 윤리학, 미래학은 연결되어 있으며 소통 필요","choices":["네이버 국어사전","미국 국회법","OECD Learning Compass 2030","한국과학기술기획평가원(2023)","김대식, '빅퀘스쳔'"],"answer":5,"explain":"김대식의 '빅퀘스쳔'에 제시된 정의이다. ① '언어, 문학, 역사, 철학 따위를 연구하는 학문' ② 언어·언어학·문학 등을 포함하는 정의 ④ 국가과학기술표준분류체계 ③ OECD 미래사회 역량.","source":{"page":13,"section":"인문학이란 무엇인가?","quote":"인문학은 인간의 천성을 스스로 반성하고 미래를 만들어가는 학문. 스스로 질문하게 하는 학문, 과학, 철학, 윤리학, 미래학은 연결되어 있으며 소통 필요 / 출처: 김대식, “빅퀘스쳔”"}},{"id":"35-15","type":"빈칸","q":"다음은 교안의 인문학 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"인문학은 인간과 관련된 근원적인 문제나 사상, 문화 등을 중심적으로 연구하여 (   )에 대한 고민의 답을 제시하는 학문","choices":["자연현상이 어떻게 일어나는가","우리가 무엇을 해야 하고, 어떻게 해야 하는가","기술이 어떻게 발전할 것인가","사회가 어떻게 구조화되어 있는가","언어가 어떻게 형성되었는가"],"answer":2,"explain":"교안은 인문학을 '우리가 무엇을 해야 하고, 어떻게 해야 하는가에 대한 고민의 답을 제시하는 학문'으로 정리한다.","source":{"page":14,"section":"인문학이란 무엇인가?","quote":"인문학은 인간과 관련된 근원적인 문제나 사상, 문화 등을 중심적으로 연구하여 우리가 무엇을 해야 하고, 어떻게 해야 하는가에 대한 고민의 답을 제시하는 학문"}},{"id":"35-16","type":"옳지 않은 것","q":"국가과학기술표준분류체계(2023년 개정)의 '인문학' 분류에 포함된 것으로 옳지 않은 것은?","box":null,"choices":["심리학","통역번역학","사전학","종교학","유교학"],"answer":1,"explain":"인문학 분류: 역사학, 철학, 종교학, 기독교 신학, 가톨릭 신학, 유교학, 불교학, 언어학, 사전학, 통역번역학, 문학, 각 언어와 문학, 서양 고전어와 문학, 기타 인문학 등. 심리학은 제시되지 않았다. 출처는 한국과학기술기획평가원(2023).","source":{"page":15,"section":"인문학이란 무엇인가? - 국가과학기술표준분류체계(2023년 개정)","quote":"역사학 • 철학 • 종교학 • 기독교 신학 • 가톨릭 신학 • 유교학 • 불교학 / • 언어학 • 사전학 • 통역번역학 • 문학"}},{"id":"35-17","type":"옳은 것","q":"'인문학의 중요성 - 인문학은 끊임없는 질문'에 제시된 인물과 내용의 연결로 옳은 것은?","box":null,"choices":["메리 올리버 - Think Different!","스티브 잡스 - 이 우주에서 우리에게 주어진 두 가지 선물은 사랑하는 힘과 질문하는 능력","메리 올리버 - 플리처상을 수상한 미국 생태시인, 사랑하는 힘과 질문하는 능력","빌 게이츠 - 인문학적 사유와 상상력, Think Different!","스티브 잡스 - 플리처상을 수상한 미국 생태시인"],"answer":3,"explain":"메리 올리버(플리처상을 수상한 미국 생태시인): 이 우주에서 우리에게 두 가지 선물이 주어지는데 사랑하는 힘과 질문하는 능력. 스티브 잡스(애플의 혁신): 인문학적 사유와 상상력, Think Different! 또한 교안은 '인문학은 기계와 인간을 구분해주는 척도'라고 한다.","source":{"page":16,"section":"인문학의 중요성","quote":"이 우주에서 우리에게 두 가지 선물이 주어지는데 사랑하는 힘과 질문하는 능력 플리처상을 수상한 미국 생태시인 메리 올리버"}},{"id":"35-18","type":"옳지 않은 것","q":"교안에 제시된 인문학의 중요성으로 옳지 않은 것은?","box":null,"choices":["인간에 대한 이해","가치와 윤리의식","고난과 성찰의 기회","표준화된 정답의 신속한 암기","무궁무진한 콘텐츠(유전적 진화/문화적 진화)"],"answer":4,"explain":"인문학의 중요성: 인간에 대한 이해, 상상력·사고력·다양성, 가치와 윤리의식, 고난과 성찰의 기회, 심미적 표현과 경험, 자존감, 지혜와 통찰력, 무궁무진한 콘텐츠(유전적 진화/문화적 진화). ④는 교안에 없다.","source":{"page":17,"section":"인문학의 중요성","quote":"인간에 대한 이해 상상력, 사고력, 다양성 가치와 윤리의식 고난과 성찰의 기회 심미적 표현과 경험 자존감 지혜와 통찰력 무궁무진한 콘텐츠( 유전적 진화/ 문화적 진화)"}},{"id":"35-19","type":"빈칸","q":"다음은 인문사회 융합 영재교육 프로그램 개발의 필요성이다. (   )에 들어갈 말로 알맞은 것은?","box":"예측할 수 없는 미래사회 문제해결에 가장 핵심적인 질문과 답은 (   )에 있음\n‣ 상상력, 질문, 사고력, 경험 ‣ 가치와 윤리의식 ‣ 지혜와 통찰력, 성찰 ‣ 무궁무진한 콘텐츠(유전적 진화/문화적 진화)","choices":["자연과학","인공지능","빅데이터","공학기술","인문학"],"answer":5,"explain":"교안은 예측할 수 없는 미래사회 문제해결에 가장 핵심적인 질문과 답은 '인문학'에 있다고 한다.","source":{"page":19,"section":"인문사회 융합 영재교육 프로그램 개발의 필요성","quote":"예측할 수 없는 미래사회 문제해결에 가장 핵심적인 질문과 답은 인문학에 있음"}},{"id":"35-20","type":"개념 찾기","q":"'과학영재에게는 과학만 가르쳐야 한다?'에서 다음 말을 한 인물로 교안에 제시된 것은?","box":"인문학이 없다면 나도 없고 컴퓨터도 없었을 것!","choices":["미국의 마이크로소프트 설립자 빌 게이츠","애플의 전 CEO 스티브 잡스","생태시인 메리 올리버","철학자 미셸 세르","클라우스 슈밥"],"answer":1,"explain":"빌 게이츠(미국의 마이크로소프트 설립자)의 말이다. 스티브 잡스(애플의 전 CEO이자 공동창립자)는 '기술만으로는 충분하지 않다... 가슴을 울리는 결과를 내는 것은 인문학과 결합된 기술'이라고 했다.","source":{"page":21,"section":"과학영재에게는 과학만 가르쳐야 한다? 미래사회에서 필요한 능력과 인재상","quote":"인문학이 없다면 나도 없고 컴퓨터도 없었을 것! 미국의 마이크로소프트 설립자 빌 게이츠"}},{"id":"35-21","type":"빈칸","q":"다음은 스티브 잡스의 말이다. (   )에 들어갈 말로 알맞은 것은?","box":"기술만으로는 충분하지 않다는 것, 그 철학은 애플의 DNA에 내재되어 있습니다. 가슴을 울리는 결과를 내는 것은 (   )과 결합된 기술임을 우리는 믿습니다.","choices":["자본","디자인","데이터","인문학","마케팅"],"answer":4,"explain":"스티브 잡스는 가슴을 울리는 결과를 내는 것은 '인문학과 결합된 기술'이라고 했다. 교안은 '인문학과 예술은 상상력과 인간정신을 일깨워주었음'이라고 정리한다.","source":{"page":21,"section":"과학영재에게는 과학만 가르쳐야 한다? 미래사회에서 필요한 능력과 인재상","quote":"가슴을 울리는 결과를 내는 것은 인문학과 결합된 기술임을 우리는 믿습니다. 애플의 전 CEO이자 공동창립자 스티브 잡스"}},{"id":"35-22","type":"옳은 것","q":"'AI로 그린 그림으로 미술대회 우승…표절일까 예술일까'(서울신문, 2022. 09. 04) 사례에 대한 설명으로 옳은 것은?","box":null,"choices":["영국에서 열린 미술전에서 AI 그림이 우승하였다.","콜로라도 주립박람회 미술대회 디지털아트 부문에서 '스페이스 오페라 극장'이 우승하였다.","AI 그림의 우승에 대해 모두가 기술 발전의 성과로 환영하였다.","우승작은 '모나리자의 재탄생'이다.","회화 부문에서 AI 그림이 우승하였다."],"answer":2,"explain":"미국 콜로라도 주립박람회 미술대회 디지털아트 부문(2022.09.03)에서 '스페이스 오페라 극장'이 우승해 갑론을박이 벌어졌다. '로봇이 올림픽에 나가 우승한 꼴'이라는 비난과 '기술을 도구로 사용한 것은 문제가 없다'는 옹호론이 맞섰다. ① 미국 ③ 갑론을박 ④ 작품명 틀림 ⑤ 디지털아트 부문.","source":{"page":22,"section":"디지털 옹호론·반박론 갑론을박","quote":"콜로라도 주립박람회 미술대회 디지털아트 부문 2022.09.03 ‘스페이스 오페라 극장’"}},{"id":"35-23","type":"빈칸","q":"다음은 교안의 '인간과 기계의 협력' 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"21세기 인공지능 등장과 미래에 대한 전망은 '(   )'(2022.12 광고)","choices":["기계에 의한 인간의 대체로","인간과 기계의 협력으로","인간과 기계의 경쟁으로","기계로부터 인간의 독립으로","인간에 의한 기계의 통제로"],"answer":2,"explain":"교안은 21세기 인공지능 등장과 미래에 대한 전망을 '인간과 기계의 협력으로'라고 제시한다(출처: 신한금융지주회사 홈페이지).","source":{"page":23,"section":"인간과 기계의 협력","quote":"21세기 인공지능 등장과 미래에 대한 전망은 ‘인간과 기계의 협력으로’(2022.12 광고)"}},{"id":"35-24","type":"옳은 것","q":"교안의 '미래사회'에 제시된 장서 규모로 옳은 것은?","box":null,"choices":["캔터베리 대성당의 장서는 2만 권이다.","구글북스 라이브러리 프로젝트는 3300만 권이다.","미 의회도서관은 3000만 권이다.","캔터베리 대성당의 장서는 2천 권, 구글북스 라이브러리 프로젝트는 3000만 권이다.","미 의회도서관은 2천 권이다."],"answer":4,"explain":"캔터베리 대성당 장서 2천 권, 현재 구글북스 라이브러리 프로젝트 3000만 권, 미 의회도서관 3300만 권. ①②③⑤는 숫자를 바꿔 놓았다.","source":{"page":24,"section":"미래사회","quote":"캔터베리 대성당의 장서는 2천 권 현재 구글북스 라이브러리 프로젝트 3000만 권 미 의회도서관 3300만 권"}},{"id":"35-25","type":"개념 찾기","q":"프랑스 과학자·철학자 미셸 세르가 제시한, 다음 설명에 해당하는 개념은?","box":"디지털을 도구로 사용하며, 스마트 미디어를 신체의 일부로 여기며 사는 호모 사피엔스의 진화된 신인류","choices":["르네상스(Renaissance)","호모 루덴스(Homo Ludens)","호미네상스(Hominescence)","디지털 네이티브","포노 사피엔스"],"answer":3,"explain":"미셸 세르는 이러한 신인류를 호미네상스(Hominescence)라 하였다. 신인류는 엄지 세대, 클라우드 세대로도 불린다. 나머지는 교안에 제시되지 않은 용어이거나(②④⑤) 단순히 '다시 태어난다'는 의미로 언급된 것(①)이다.","source":{"page":25,"section":"프랑스 과학자, 철학자 미셸 세르 - 미래사회 역량","quote":"디지털을 도구로 사용하며, 스마트 미디어를 신체의 일부로 여기며 사는 호모 사피엔스의 진화된 신인류 - 호미네상스 (Hominescence) 탄생"}},{"id":"35-26","type":"옳지 않은 것","q":"미셸 세르가 말한 신인류(호미네상스)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["신인류는 엄지 세대, 클라우드 세대로 불린다.","신인류는 세상을 이해하는 방식과 뇌의 사고체계가 다르다.","신인류에게 읽기, 쓰기, 책, 콘텐츠는 우리가 알고 있는 것과 전혀 다른 방식을 사용한다.","다시 태어난다는 것은 신인류의 콘텐츠 창작과 소비 행위에 가장 잘 어울리는 표현이다.","신인류의 힘은 “아는 것이 힘”이라는 명제로 요약된다."],"answer":5,"explain":"교안은 신인류의 힘을 “아는 것이 힘”이 아닌 “창조만이 유일하고 진정한 지적 행위”라고 한다. ①~④는 교안과 일치한다(클라우드 활용 신인류: 호미네상스).","source":{"page":26,"section":"Renaissance - 미래사회 역량","quote":"“아는 것이 힘”이 아닌 “창조만이 유일하고 진정한 지적 행위”"}},{"id":"35-27","type":"옳지 않은 것","q":"가드너(2007)가 제시한 미래사회 역량(Five Minds for the Future)에 해당하지 않는 것은?","box":null,"choices":["Creating mind","Respectful mind","Ethical mind","Disciplined mind","Emotional mind"],"answer":5,"explain":"가드너(2007): Creating mind, Respectful mind, Synthesizing mind, Disciplined mind, Ethical mind. Emotional mind는 제시되지 않았다.","source":{"page":29,"section":"미래사회 역량","quote":"가드너(2007) Creating mind, Respectful mind, Synthesizing mind, Disciplined mind, Ethical mind"}},{"id":"35-28","type":"옳은 것","q":"교안에 제시된 미래사회 역량의 출처와 역량의 연결로 옳은 것은?","box":null,"choices":["송인섭 등(2008) - 통찰력, 통합, 소통, 창의","성은현 등(2010) - 통찰력, 융합, 창의, 리더십","미래부의 4차산업 인재 역량(2017) - 협업, 유연·민첩·창의·혁신, 비판적 사고, 문제해결 능력","과학기술정보통신부(2017) - 자기주도적 학습역량, 협업 및 의사소통역량","성은현 등(2014) - 윤리의식과 책무의식, 회복탄력성"],"answer":3,"explain":"미래부의 4차산업 인재 역량(2017): 협업, 유연·민첩·창의·혁신, 비판적 사고, 문제해결 능력. ① 송인섭 등(2008)은 통찰력, 융합, 창의, 리더십 ② 성은현 등(2010)은 통찰력, 통합, 소통, 창의 ④ 과학기술정보통신부(2017)는 획일적이지 않은 문제 인식 역량, 다양성의 가치를 강조하는 대안도출역량, 기계와의 협력적 소통역량(④의 내용은 박현주(2019)) ⑤ 성은현 등(2014)은 융합과 창의, 소통, 통찰(⑤는 김주아(2021)).","source":{"page":29,"section":"미래사회 역량","quote":"미래부의 4차산업 인재역량(2017) 협업, 유연 · 민첩 · 창의 · 혁신, 비판적 사고, 문제해결능력"}},{"id":"35-29","type":"보기 조합","q":"교안에서 여러 연구의 미래사회 역량을 종합한 '공통적인 미래사회역량', 즉 불확실성에 대처하는 역량(변혁적 역량)에 해당하는 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 창의성\nㄴ. 협업\nㄷ. 소통\nㄹ. 책임감\nㅁ. 경쟁력","choices":["ㄱ, ㄴ","ㄱ, ㄷ, ㅁ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],"answer":4,"explain":"공통적인 미래사회역량은 불확실성에 대처하는 역량(변혁적 역량)으로 창의성, 협업, 소통, 책임감이다. 경쟁력은 제시되지 않았다.","source":{"page":30,"section":"미래사회 역량","quote":"불확실성에 대처하는 역량( 변혁적 역량) / ∙창의성, / ∙협업, / ∙소통, / ∙책임감"}},{"id":"35-30","type":"옳은 것","q":"OECD 학습나침반 2030에서 제시한 변혁적 역량(Transformative competencies)을 옳게 나열한 것은?","box":null,"choices":["새로운 가치 창조하기, 경쟁력 강화하기, 책임감 갖기","협력, 감정관리, 타인관계","긴장과 딜레마 회피하기, 새로운 가치 창조하기, 책임감 갖기","디지털 기술 숙달하기, 긴장과 딜레마 조정하기, 책임감 갖기","새로운 가치 창조하기, 긴장과 딜레마 조정하기, 책임감 갖기"],"answer":5,"explain":"OECD 학습나침반 2030의 변혁적 역량: 새로운 가치 창조하기(Creating new value), 긴장과 딜레마 조정하기(Reconciling tensions \u0026 dilemmas), 책임감 갖기(Taking responsibility). ① 경쟁력 강화하기 없음 ② OECD 사회정서역량조사 국제공동연구 항목 일부 ③ '회피하기'가 아니라 '조정하기' ④ 디지털 기술 숙달하기 없음.","source":{"page":30,"section":"미래사회 역량","quote":"OECD 학습나침반 2030 / 변혁적 역량(Transformative competencies), 새로운 가치 창조하기(Creating new value), 긴장과 딜레마 조정하기(Reconciling tensions \u0026 dilemmas), 책임감 갖기(Taking responsibility)"}},{"id":"35-31","type":"개념 찾기","q":"'창의력, 융합력, 자기주도력, 공감협업력'을 미래사회 역량으로 제시한 출처로 교안에 제시된 것은?","box":null,"choices":["박현주(2019)","김주아(2021)","이정규(2020)","OECD 사회정서역량조사 국제공동연구","가드너(2007)"],"answer":3,"explain":"이정규(2020): 창의력, 융합력, 자기주도력, 공감협업력. ① 자기주도적 학습역량, 협업 및 의사소통역량, 창의·융합역량, 문제해결역량, 적응과 대처하는 능력 ② 윤리의식과 책무의식, 소통협업능력, 회복탄력성, 창의성 ④ 협력, 감정관리, 타인관계, 개방성, 성실성, 책임감 ⑤ Five minds.","source":{"page":30,"section":"미래사회 역량","quote":"이정규(2020) 창의력, 융합력, 자기주도력, 공감협업력"}},{"id":"35-32","type":"빈칸","q":"이정규 외(2022)는 다보스포럼, 맥킨지, 미래부 미래준비위원회의 미래사회 역량을 종합하여 다음과 같이 제시하였다. (   )에 들어갈 말로 알맞은 것은?","box":"'협업' 중심의 '유연하고 창의적인 생각'과 '(   )'를 통해 '문제를 해결'하는 지능정보사회 핵심인재 육성 필요","choices":["비판적 사고","시스템적 사고","네트워킹","고도의 기술력","글로벌 역량"],"answer":1,"explain":"종합 결과는 협업, 유연·민첩·창의·혁신, 비판적 사고, 문제해결 능력이며, '협업' 중심의 '유연하고 창의적인 생각'과 '비판적 사고'를 통해 '문제를 해결'하는 지능정보사회 핵심인재 육성이 필요하다고 정리한다. ②③④⑤는 개별 기관 역량 항목이지만 종합 결론의 빈칸에는 해당하지 않는다.","source":{"page":31,"section":"미래사회 역량 (출처: 이정규 외(2022))","quote":"'협업' 중심의 '유연하고 창의적인 생각'과 '비판적 사고'를 통해 '문제를 해결'하는 지능정보사회 핵심인재 육성 필요"}},{"id":"35-33","type":"옳지 않은 것","q":"클라우스 슈밥(2017)이 제시한, 신기술이 가져올 혜택을 누리기 위해 해결해야 할 도전과제에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["4차 산업혁명의 혜택이 공정하게 배분되도록 보장","4차 산업혁명의 외부효과가 초래할 수 있는 의도하지 않은 위험과 피해를 관리","4차 산업혁명 시대 인간이 중심이 되고 인간이 주도하도록 보장하는 것","4차 산업혁명 시대 기계가 인간의 의사결정을 전면 대체하도록 지원","클라우스 슈밥(2017)은 해결해야 할 도전과제를 세 가지로 제시하였다."],"answer":4,"explain":"세 가지 도전과제: 혜택의 공정한 배분 보장, 외부효과로 인한 의도하지 않은 위험과 피해 관리, 인간이 중심이 되고 인간이 주도하도록 보장. ④는 정반대 내용이다. 교안은 미래사회 핵심역량으로 불확실성에 대처하는 변혁적 역량(transformative competencies)이 필요하다고 한다.","source":{"page":32,"section":"미래사회 역량","quote":"4차 산업혁명의 혜택이 공정하게 배분되도록 보장 ‣ 4차 산업혁명의 외부효과가 초래할 수 있는 의도하지 않은 위험과 피해를 관리 ‣ 4차 산업혁명 시대 인간이 중심이 되고 인간이 주도하도록 보장하는 것"}},{"id":"35-34","type":"빈칸","q":"다음은 OECD Learning Compass 2030에 따른 교육 패러다임 변화이다. (   )에 들어갈 말로 알맞은 것은?","box":"미래사회의 불확실성과 복잡성을 극복하기 위해 (   )을 증진하고, 다양한 교과를 넘나들며 새로운 부가가치를 창출하는 창의적 아이디어와 산물을 만드는 것이 필요함","choices":["기초 문해력","변혁적 역량","디지털 리터러시","교과 지식","경쟁력"],"answer":2,"explain":"교육 패러다임 변화: 미래사회의 불확실성과 복잡성을 극복하기 위해 '변혁적 역량'을 증진하고, 다양한 교과를 넘나들며 새로운 부가가치를 창출하는 창의적 아이디어와 산물을 만드는 것이 필요하다.","source":{"page":35,"section":"OECD 미래사회 역량 - 교육 패러다임 변화","quote":"미래사회의 불확실성과 복잡성을 극복하기 위해 변혁적 역량을 증진하고, 다양한 교과를 넘나들며 새로운 부가가치를 창출하는 창의적 아이디어와 산물을 만드는 것이 필요함"}},{"id":"35-35","type":"옳지 않은 것","q":"2022 개정 교육과정의 '인간상 설정 시 고려사항'과 그 세부 내용의 연결로 옳지 않은 것은?","box":null,"choices":["자기주도성 - 주체성, 책임감, 적극적 태도","창의와 혁신 - 문제해결, 융합적 사고, 도전","포용성과 시민성 - 배려, 소통, 협력, 공감, 공동체의식","창의와 혁신 - 배려, 공감, 공동체의식","인간상 설정 시 고려사항은 자기주도성, 창의와 혁신, 포용성과 시민성이다."],"answer":4,"explain":"창의와 혁신의 세부 내용은 문제해결, 융합적 사고, 도전이다. 배려, 공감, 공동체의식은 포용성과 시민성에 해당한다.","source":{"page":36,"section":"미래사회 역량과 2022 개정 교육과정","quote":"•자기주도성( 주체성, 책임감, 적극적 태도) •창의와 혁신( 문제해결, 융합적 사고, 도전) •포용성과 시민성( 배려, 소통, 협력, 공감, 공동체의식)"}},{"id":"35-36","type":"옳은 것","q":"2022 개정 교육과정의 지향점에 대한 설명으로 옳은 것은?","box":null,"choices":["미래 전망으로 4차 산업혁명 도래, 인구 급감, 학습자 성향 변화, 기후환경 변화 등 불확실성 심화를 제시하였다.","국민 의견은 OECD 설문조사를 통해 수집하였다.","글로벌 동향으로 교사 행위 주체성(Teacher agency)을 강조하였다.","포용성은 사회 구성원 간 차이를 최소화하고 획일성을 추구하는 태도이다.","국민 의견으로 개인의 경쟁력 강화와 상급학교 진학을 우선시하였다."],"answer":1,"explain":"미래 전망: 4차 산업혁명 도래, 인구 급감, 학습자 성향 변화, 기후환경 변화 등 불확실성 심화. ② 국가교육회의 설문조사(21.5.17~6.17) ③ 학생 행위 주체성(Student agency), 변혁적 역량, 세계 시민 역량 등 강조 ④ 포용성은 차이와 다양성에 대한 상호 이해와 존중을 바탕으로 개개인의 교육적 성장과 공정하고 지속 가능한 사회를 함께 실현해 나가고자 하는 태도 및 소양 ⑤ 개인과 사회 공동의 행복 추구, 자기 정체성을 바탕으로 한 자기 주도적 학습, 책임 있는 시민으로 성장.","source":{"page":36,"section":"미래사회 역량과 2022 개정 교육과정","quote":"4차 산업혁명 도래, 인구 급감, 학습자 성향 변화, 기후환경 변화 등 불확실성 심화"}},{"id":"35-37","type":"개념 찾기","q":"2022 개정 교육과정에서 다음과 같이 정의된 개념은?","box":"사회 구성원들 사이의 차이와 다양성에 대한 상호 이해와 존중을 바탕으로, 개개인의 교육적 성장과 공정하고 지속 가능한 사회를 함께 실현해 나가고자 하는 태도 및 소양","choices":["자기주도성","창의와 혁신","학생 행위 주체성","변혁적 역량","포용성"],"answer":5,"explain":"교안의 '(포용성)' 정의이다. ① 주체성, 책임감, 적극적 태도 ② 문제해결, 융합적 사고, 도전 ③④ 글로벌 동향에서 강조된 개념이다.","source":{"page":36,"section":"미래사회 역량과 2022 개정 교육과정","quote":"( 포용성) 사회 구성원들 사이의 차이와 다양성에 대한 상호 이해와 존중을 바탕으로, 개개인의 교육적 성장과 공정하고 지속 가능한 사회를 함께 실현해 나가고자 하는 태도 및 소양"}}
