 두꺼운 안경, 신체적으로 병약, 친구도 없는 외톨이’로 묘사 → 조화 연구들이 이런 잘못된 신화를 불식","조화 주장의 부정적 영향: 영재교육·상담·정서함양·리더십 프로그램 제공 필요 없다는 인식 → 우리나라 1980년 후반 흑역사, 미국 영재교육법(조기발견, 조기교육, 조기 사장)","비조화 주장: 홀링워스(지적 발달이 신체적 발달보다 먼저 일어나 정서적·사회적 어려움 → 정서적 측면 교육 절대 필요), 나이퀴스트(뉴욕 자퇴 고교생 중 19%는 영재, 홀링워스 연구 지지)","터만 연구 대상: 1920~1930년대, 캘리포니아, 교사 추천, 중상류층 이상, 사회에 잘 적응하는 아이들만 표집","홀링워스 연구 대상: 1930년대, 뉴욕, 임상적인 상담이 요구되는 영재들 → 상반된 연구결과. 우리나라에도 유사한 연구결과 존재"],"questions":[{"id":"24-01","type":"옳은 것","q":"행동과학자(교육과 심리학자)의 영재 연구에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["영재성을 인지적 능력 한 가지 영역으로만 설명한다.","영재의 영역을 인지적 능력과 신체적 능력 2가지로 구분한다.","영재의 3가지 영역은 지능, 창의성, 동기이다.","인지적 능력/정의적 특성/사회적 특성으로 구분하고, 영재의 3가지 영역을 영재성(giftedness)으로 설명한다.","영재성은 사회적 특성만으로 판별한다."],"answer":4,"explain":"교안 p3: 인지적 능력/정의적 특성/사회적 특성으로 구분, 영재의 3가지 영역을 영재성(giftedness)으로 설명.","source":{"page":3,"section":"행동과학자(교육과 심리학자)의 영재연구","quote":"인지적 능력/ 정의적 특성/ 사회적 특성으로 구분 영재의 3가지 영역을 영재성(giftedness)로 설명"}},{"id":"24-02","type":"빈칸","q":"다음 (가), (나)에 들어갈 말로 알맞은 것은?","box":"3가지가 조화/(가) 발달을 하는 것인가? 아니면, 비조화/(나) 발달을 하는 것인가?","choices":["(가) 비동시적 (나) 동시적","(가) 동시적 (나) 비동시적","(가) 연속적 (나) 불연속적","(가) 선천적 (나) 후천적","(가) 단계적 (나) 비단계적"],"answer":2,"explain":"조화 = 동시적 발달, 비조화 = 비동시적 발달. 교안은 또 상호 어떤 긍정적/부정적 영향을 주며 성장하는지, 영재교육·상담과 심리치료에서 어느 영역을 강조해야 하는지 질문한다.","source":{"page":4,"section":"행동과학자(교육과 심리학자)의 영재연구","quote":"3가지가 조화/ 동시적 발달을 하는 것인가? 아니면, 비조화 / 비동시적 발달을 하는 것인가?"}},{"id":"24-03","type":"옳지 않은 것","q":"영재의 3가지 영역에 대한 연구에서 영재의 인지적 능력이 탁월하다고 일관되게 보고된 요소로 교안에 제시되지 않은 것은?","box":null,"choices":["지능","창의성","상위 인지","고차원적 추론능력","정서적 안정성"],"answer":5,"explain":"교안: 지능, 창의성, 상위 인지, 고차원적 추론능력 등이 탁월하다고 일관되게 보고. 정서적 안정성은 정의적 특성으로, 연구 결과가 상반되게 보고된다.","source":{"page":5,"section":"영재의 3가지 영역에 대한 연구","quote":"영재의 인지적 능력에 대한 연구들은 지능, 창의성, 상위 인지, 고차원적 추론능력 등이 탁월하다고 일관되게 보고되고 있음"}},{"id":"24-04","type":"보기 조합","q":"영재의 정의적·사회적 특성에 대한 연구 결과들이 상반되게 보고되는 이유로 교안에 제시된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 연구자들 간에 영재성에 대한 정의의 차이\nㄴ. 연구 대상자의 선정에 있어서의 표집의 차이\nㄷ. 연구 방법의 차이\nㄹ. 영재의 인지적 능력 수준의 차이","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"explain":"교안 p5·p15: 영재성 정의의 차이, 표집의 차이, 연구 방법의 차이. 인지적 능력은 탁월하다고 일관되게 보고되므로 ㄹ은 이유가 아니다.","source":{"page":15,"section":"영재성의 조화/비조화의 연구결과가 다른 이유","quote":"연구자들 간에 영재성에 대한 정의의 차이, 연구 대상자의 선정에 있어서의 표집의 차이, 연구 방법의 차이 등으로 인해 연구결과들이 상반됨"}},{"id":"24-05","type":"옳은 것","q":"교안의 ‘영재의 3가지 영역에 대한 연구’에서 대비되어 제시된 두 주장으로 옳은 것은?","box":null,"choices":["영재들은 인지적 능력이 일반인보다 낮다 vs 높다","영재성은 유전된다 vs 환경으로 결정된다","영재들은 인지적 능력 못지않게 정의적으로나 신체적으로 건강하다 vs 인지적 능력에 비해 정의적으로나 신체적으로 문제가 있다","영재는 내적 동기가 높다 vs 외적 동기가 높다","영재는 리더십이 타고난다 vs 학습된다"],"answer":3,"explain":"교안 p6의 두 주장. 이후 ‘조화’(터만과 오든 등)와 ‘비조화’(홀링워스, 나이퀴스트) 연구로 이어진다.","source":{"page":6,"section":"영재의 3가지 영역에 대한 연구","quote":"영재들은 인지적 능력 못지않게 정의적으로나 신체적으로 건강하다! 영재들은 인지적 능력에 비해 정의적으로나 신체적으로 문제가 있다!"}},{"id":"24-06","type":"개념 찾기","q":"영재아의 사회, 정서, 도덕 및 신체 발달에 대한 종단연구를 수행하고, 다음과 같이 진술한 연구자는?","box":"“지적으로 우수한 아동에 대하여 잘못된 신화(myth)가 이 연구가 제시하는 실증적인 자료에 의하여 사라지기를 기대한다. … 정서적으로 불안정하고 사회적으로 부적응하며 정신병자이고 도덕적으로 신뢰할 수 없다는 것은 사실이 아니다.”","choices":["홀링워스(Hollingworth)","나이퀴스트(Nyquist)","터만과 오든(Terman \u0026 Oden)","롬브로소(Lombroso)","세일러와 브룩샤이(Sayler \u0026 Brookshire)"],"answer":3,"explain":"터만과 오든의 종단연구. ①② 비조화 주장 ④ 영재를 병약한 외톨이로 묘사 ⑤ 중학교 2학년 영재학급·일반학급 비교 연구.","source":{"page":7,"section":"인지적 능력, 사회정의적 특성 모두 건강하다 – 터만과 오든","quote":"영재아의 사회, 정서, 도덕 및 신체 발달에 대한 종단연구 / “지적으로 우수한 아동에 대하여 잘못된 신화(myth)가 이 연구가 제시하는 실증적인 자료에 의하여 사라지기를 기대한다."}},{"id":"24-07","type":"옳은 것","q":"골루시, 미들턴, 클라인(Gallucci \u0026 Middleton \u0026 Kline)의 연구에 대한 설명으로 옳은 것은?","box":null,"choices":["영재교육을 받는 영재학생, 일반학급의 영재학생, 일반학급의 일반학생의 3집단을 비교하였다.","세 집단의 심리사회적 적응에 큰 차이가 있었다.","영재학생 집단의 창의성과 정신병리적 행동특성 간에 높은 상관이 있었다.","중학교 2학년 영재학급과 일반학급만 비교하였다.","영재의 비조화를 주장한 대표 연구이다."],"answer":1,"explain":"3집단 비교 결과 심리사회적 적응에 차이가 없었고, 창의성과 정신병리적 행동특성 간에도 상관이 없었다(조화 주장). ④는 세일러와 브룩샤이.","source":{"page":8,"section":"인지적 능력, 사회정의적 특성 모두 건강하다 – 골루시, 미들턴, 클라인","quote":"영재교육을 받는 영재학생, 일반학급의 영재학생, 일반학급의 일반학생의 3집단 비교 / “세 집단의 심리사회적 적응에 있어서 차이가 없었으며, 영재학생 집단의 창의성과 정신병리적 행동특성 간에도 상관이 없다.”"}},{"id":"24-08","type":"빈칸","q":"세일러와 브룩샤이(Sayler \u0026 Brookshire)의 연구 대상으로 교안에 제시된 학년은?","box":"(   ) 영재학급과 일반학급의 학생들의 사회적, 정서적, 행동적 적응에 있어서의 차이 연구","choices":["초등학교 6학년","중학교 1학년","고등학교 2학년","중학교 2학년","중학교 3학년"],"answer":4,"explain":"교안 p9: 중학교 2학년 영재학급과 일반학급.","source":{"page":9,"section":"세일러와 브룩샤이(Sayler \u0026 Brookshire)","quote":"중학교 2학년 영재학급과 일반학급의 학생들의 사회적, 정서적, 행동적 적응에 있어서의 차이 연구"}},{"id":"24-09","type":"옳지 않은 것","q":"세일러와 브룩샤이(Sayler \u0026 Brookshire)의 연구 결과로 옳지 않은 것은?","box":null,"choices":["사회적 관계와 정서발달의 지각에서 영재학급 학생이 일반학급 학생보다 좋은 것으로 나타났다.","영재학급 학생의 학교 행동문제는 일반학급 학생에 비해 덜 심각했다.","조기입학하거나 월반한 영재학생의 대부분은 특별한 사회적 고립을 보고하지 않았다.","심각한 행동문제에서 영재학생은 정규학급 학생에 비해 오히려 덜했다.","조기입학하거나 월반한 영재학생의 대부분이 심각한 정서적 어려움을 경험하였다."],"answer":5,"explain":"교안: 조기입학·월반 영재학생의 대부분은 특별한 사회적 고립을 보고하지 않았거나 심각한 정서적 어려움을 경험하지 ‘않았다’. ⑤는 반대.","source":{"page":9,"section":"세일러와 브룩샤이(Sayler \u0026 Brookshire)","quote":"조기입학하거나 또는 초등학교 어느 학년을 건너뛰어 진급한 영재학생의 대부분은 특별한 사회적 고립을 보고하지 않았거나 또는 심각한 정서적 어려움을 경험하지 않았다."}},{"id":"24-10","type":"개념 찾기","q":"영재를 ‘머리는 뛰어나나 꼽추이며 두꺼운 안경을 쓰고, 신체적으로 병약, 친구도 없는 외톨이’ 등으로 묘사한 인물은?","box":null,"choices":["터만(Terman)","롬브로소(Lombroso)","홀링워스(Hollingworth)","나이퀴스트(Nyquist)","골루시(Gallucci)"],"answer":2,"explain":"롬브로소의 묘사. 영재의 인지적·정의적·사회적 특성과 신체적 조건이 우수하다는 연구결과들은 이러한 과거의 잘못된 신화를 불식시키는 긍정적 영향을 주었다.","source":{"page":10,"section":"인지적 능력, 사회정의적 특성 모두 건강하다","quote":"롬브로소(Lombroso) / 영재를 ‘머리는 뛰어나나 꼽추이며 두꺼운 안경을 쓰고, 신체적으로 병약, 친구도 없는 외톨이’ 등으로 묘사"}},{"id":"24-11","type":"옳지 않은 것","q":"‘영재는 인지적 능력, 사회정의적 특성 모두 건강하다’는 연구 결과가 미친 영향에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["과거의 영재에 대한 잘못된 신화를 불식시키는 긍정적 영향이 있었다.","가정이나 학교, 정부가 영재와 영재교육에 대한 오해를 가질 수 있다.","정부 예산을 들여 영재교육 프로그램이나 상담적 처치, 정서함양, 리더십 프로그램을 제공할 필요가 없다는 인식을 심어주기도 했다.","영재교육에 부정적인 영향을 미치기도 했다.","영재를 위한 정서함양 및 상담 프로그램 예산이 크게 늘어나는 계기가 되었다."],"answer":5,"explain":"교안은 오히려 프로그램 제공이 필요 없다는 인식을 심어 영재교육에 부정적 영향을 미쳤다고 설명한다(1980년 후반 흑역사 등). ⑤는 반대.","source":{"page":11,"section":"인지적 능력, 사회정의적 특성 모두 건강하다","quote":"특별히 정부예산을 들여 영재교육 프로그램을 제공하거나 상담적 처치, 정서함양이나 리더십 프로그램 등을 제공해 줄 필요가 없다는 인식을 심어주어 영재교육에 부정적인 영향을 미치기도 함"}},{"id":"24-12","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"우리나라 영재교육의 1980년 후반의 흑역사, 정치 성향에 따른 정책, 미국의 영재교육법(조기발견, 조기교육, (   )) 등","choices":["조기졸업","조기입학","조기 사장","조기 상담","조기 진로"],"answer":3,"explain":"교안 p11: 미국의 영재교육법(조기발견, 조기교육, 조기 사장). 영재가 건강하다는 인식이 영재교육에 부정적 영향을 준 예로 제시된다.","source":{"page":11,"section":"인지적 능력, 사회정의적 특성 모두 건강하다","quote":"우리나라 영재교육의 1980년 후반의 흑역사, 정치 성향에 따른 정책, 미국의 영재교육법(조기발견, 조기교육, 조기 사장) 등"}},{"id":"24-13","type":"옳은 것","q":"홀링워스(Hollingworth)의 영재성 비조화 주장으로 옳은 것은?","box":null,"choices":["영재아의 신체적 발달이 지적 발달보다 먼저 일어난다.","지능이 높은 영재들은 지적 발달이 신체적 발달보다 먼저 일어나기 때문에 정서적, 사회적으로 어려움을 겪으므로 정서적 측면의 교육이 절대적으로 필요하다.","성인들은 아동의 지적 조숙을 잘 이해하고 격려하므로 영재아는 사회적으로 긍정적인 태도를 기른다.","영재아는 정서적 측면의 교육이 필요하지 않다.","영재는 인지적 능력 못지않게 정의적·신체적으로 건강하다."],"answer":2,"explain":"홀링워스: 지적 발달이 신체적 발달보다 먼저 → 정서적·사회적 어려움 → 정서적 교육 절대 필요. 성인들이 지적 조숙을 이해하지 못하고 조롱하기 때문에 사회적으로 부정적인 태도가 길러진다. ⑤는 조화 주장.","source":{"page":13,"section":"영재성의 비조화 주장 – 홀링워스","quote":"지능이 높은 영재들은 지적 발달이 아동의 신체적 발달보다 먼저 일어나기 때문에 정서적, 사회적으로 어려움을 겪으므로 정서적 측면에서의 교육이 절대적으로 필요하다."}},{"id":"24-14","type":"빈칸","q":"나이퀴스트(Nyquist)의 주장에 대한 다음 설명에서 (   )에 들어갈 수치로 알맞은 것은?","box":"“뉴욕에서 스스로 자퇴한 고교생 중 (   )는 영재로 분류될 수 있을 것이다.”","choices":["9%","25%","12%","19%","29%"],"answer":4,"explain":"교안 p14: 19%. 영재학생 중 학교를 자퇴한 학생들은 학습부진아였거나 적절한 지도나 상담 혹은 도전감을 경험하지 못했다. 나이퀴스트는 홀링워스의 연구를 지지한다.","source":{"page":14,"section":"영재성의 비조화 주장 – 나이퀴스트","quote":"뉴욕에서 스스로 자퇴한 고교생 중 19%는 영재로 분류될 수 있을 것이다."}},{"id":"24-15","type":"옳은 것","q":"나이퀴스트(Nyquist)의 주장에 대한 설명으로 옳은 것은?","box":null,"choices":["홀링워스(Hollingworth)의 연구를 지지한다.","터만과 오든의 연구를 지지한다.","영재학생 중 자퇴한 학생들은 대부분 학업 성적이 매우 우수하였다.","자퇴한 영재학생들은 학교에서 충분한 지도와 상담을 받았다.","캘리포니아의 자퇴 고교생을 대상으로 하였다."],"answer":1,"explain":"나이퀴스트는 홀링워스의 연구를 지지(비조화). ③ 학습부진아였거나 ④ 적절한 지도나 상담 혹은 도전감을 경험하지 못함 ⑤ 뉴욕.","source":{"page":14,"section":"영재성의 비조화 주장 – 나이퀴스트","quote":"영재학생 중에서 학교를 자퇴한 학생들은 학습부진아였거나 학교에서 적절한 지도나 상담 혹은 도전감을 경험하지 못했다.” / ‣ 홀링워스(Hollingworth)의 연구를 지지"}},{"id":"24-16","type":"옳지 않은 것","q":"터만의 연구에 참여한 영재들의 특징으로 옳지 않은 것은?","box":null,"choices":["임상적인 상담이 요구되는 영재들이 대상이었다.","1920~1930년대 캘리포니아의 학생들이었다.","학교에서 교사의 추천에 의해 영재교육을 받고 있는 중상류층 이상의 학생들이었다.","옷차림이 말끔하고 예의도 발랐다.","어느 정도 사회에 잘 적응하는 아이들만 표집되었다."],"answer":1,"explain":"임상적인 상담이 요구되는 영재들은 홀링워스 연구(1930년대, 뉴욕)의 대상. ②~⑤는 터만 연구 대상 특징.","source":{"page":15,"section":"영재성의 조화/비조화의 연구결과가 다른 이유","quote":"1920~1930년대 ‣ 캘리포니아 ‣ 학교에서 교사의 추천에 의해 영재교육을 받고 있는 중상류층 이상의 학생들이 대상 ‣ 옷차림이 말끔하고 예의도 발랐음 ‣ 어느 정도 사회에 잘 적응하는 아이들만 표집"}},{"id":"24-17","type":"옳은 것","q":"홀링워스의 연구에 참여한 영재들에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["1920~1930년대 캘리포니아의 학생들이었다.","교사의 추천을 받은 중상류층 학생들만 표집하였다.","사회에 잘 적응하는 아이들만 표집하였다.","1930년대 뉴욕의 영재들로, 영재임에도 불구하고 임상적인 상담이 요구되는 영재들이 대상이었다.","우리나라에는 유사한 연구결과가 존재하지 않는다."],"answer":4,"explain":"홀링워스 연구: 1930년대, 뉴욕, 임상적인 상담이 요구되는 영재 대상. 이런 차이가 상반된 연구결과를 낳았다. ①②③ 터만 연구 대상 ⑤ 우리나라에도 유사한 연구결과 존재.","source":{"page":16,"section":"영재성의 조화/비조화의 연구결과가 다른 이유","quote":"1930년대 ‣ 뉴욕 ‣ 영재임에도 불구하고 임상적인 상담이 요구되는 영재들이 대상 이런 차이가 영재의 정의적, 사회적 특성에 대한 상반된 연구결과를 제시했다고 할 수 있음"}},{"id":"24-18","type":"보기 조합","q":"\u003c보기\u003e의 연구자 중 영재의 인지적 능력과 사회정의적 특성이 ‘모두 건강하다(조화)’는 입장의 연구로 교안에 제시된 것을 모두 고른 것은?","box":"ㄱ. 터만과 오든(Terman \u0026 Oden)\nㄴ. 골루시, 미들턴, 클라인(Gallucci \u0026 Middleton \u0026 Kline)\nㄷ. 세일러와 브룩샤이(Sayler \u0026 Brookshire)\nㄹ. 홀링워스(Hollingworth)\nㅁ. 나이퀴스트(Nyquist)","choices":["ㄱ, ㄹ","ㄹ, ㅁ","ㄱ, ㄴ, ㅁ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"answer":5,"explain":"조화: 터만과 오든, 골루시·미들턴·클라인, 세일러와 브룩샤이. 비조화: 홀링워스, 나이퀴스트(홀링워스 연구 지지).","source":{"page":7,"section":"인지적 능력, 사회정의적 특성 모두 건강하다","quote":"인지적 능력, 사회정의적 특성 모두 건강하다 / 터만과 오든(Terman \u0026 Oden)"}},{"id":"24-19","type":"사례","q":"다음 교사의 판단과 가장 가까운 입장을 보인 연구자로 교안에 제시된 사람은?","box":"영재반 담당 박 교사: “지능이 매우 높은 아이들은 지적 발달이 신체적 발달보다 앞서다 보니, 주변 어른들이 이를 이해하지 못하고 조롱하기도 해요. 그래서 이 아이들에게는 정서적 측면의 교육이 절대적으로 필요합니다.”","choices":["터만과 오든","세일러와 브룩샤이","홀링워스","골루시, 미들턴, 클라인","롬브로소"],"answer":3,"explain":"홀링워스의 비조화 주장(지적 발달이 신체 발달보다 먼저, 성인들이 지적 조숙을 이해하지 못하고 조롱 → 정서적 교육 절대 필요). ①②④는 조화 주장.","source":{"page":13,"section":"영재성의 비조화 주장 – 홀링워스","quote":"심지어 성인들은 아동의 지적 조숙을 이해하지 못하고 조롱하기 때문에 영재아들은 자라면서 사회적으로 부정적인 태도가 길러진다."}},{"id":"24-20","type":"옳지 않은 것","q":"교안에서 행동과학자들이 영재의 3가지 영역과 관련해 제기한 질문으로 제시되지 않은 것은?","box":null,"choices":["상호 어떤 긍정적/부정적 영향을 주면서 성장하는가?","영재의 3가지 영역 중 어느 것이 유전되는가?","영재교육에서 어느 영역을 강조해야 하는가?","상담과 심리치료에서는 어떤 영역을 강조하는가?","3가지가 조화/동시적 발달을 하는 것인가? 아니면 비조화/비동시적 발달을 하는 것인가?"],"answer":2,"explain":"교안 p4의 질문: 조화/동시적 vs 비조화/비동시적 발달, 상호 긍정적/부정적 영향, 영재교육에서 강조할 영역, 상담과 심리치료에서 강조할 영역. ②는 제시되지 않았다.","source":{"page":4,"section":"행동과학자(교육과 심리학자)의 영재연구","quote":"상호 어떤 긍정적/ 부정적 영향을 주면서 성장하는가? 영재교육에서 어느 영역을 강조해야 하는가? 상담과 심리치료에서는 어떤 영역을 강조하는가?"}}]},{"lesson":25,"title":"영재성이 조화로운 영재교육을 위하여","file":"4. 교안 (1~30)/25.pdf","summary":["비동시적 발달: 모든 아이의 발달 과정은 똑같지 않음 — 신체 부위가 다른 속도로 발달하듯 인지적·사회정의적 특성의 발달에서도 나타남(예: 먼저 걷지만 언어 발달이 늦을 수 있음)","교육학·심리학은 인간 발달의 보편타당한 현상을 이론으로 설명(피아제 인지발달이론, 콜버그 도덕성발달이론) / 영재연구는 일반학생과의 비교분석(집단 간 차이)이 주 → 영재 집단 내 차이, 개인 내 차이 연구도 증가","비동시적 발달은 정상적 발달 — 아이마다 발달에 최적의 시기가 다름 / 영재성의 비동시성 발달 역시 정상, 적절한 교육과 지원 → 잠재된 영재성 더욱 발현","인지적 특징: 언어 발달이 빠름(→인지 발달로 연계), 어려운 개념 쉽게 이해, 새 정보 빠르게 습득, 종합·학습전이 능력 탁월 / 그러나 모든 영역에서 고르게 진행되지 않음 → 영역성 논쟁(영역 일반성/특수성)","정의적 특징: 정서적 발달은 인지적 발달에 비해 상대적으로 느림 / 자부심·회의감·소외감 등 정서적 갈등 / 도덕성 높음, 정서적으로 민감·강렬 / 완벽주의 경향(교사·부모의 '뛰어나야 한다' 피드백도 원인)","사회적 특징: 또래와 공통 관심사 찾기 어려움, 따돌림·소외감, 동조의 압박감 vs 자기 욕구 충족 사이의 갈등","영재성이 조화로운 영재교육: 각 영역 발달 수준 인식, 강점과 약점 이해 → 적절한 지원 / 스스로 발달하는 것이 아님 / 정서적 지원, 정보·금전·사회적 지원","과거 이성과 감정은 상호배치 개념 → 1990년 이후 EQ 등장, 이성과 감정은 시너지 효과 / EQ = 나·타인·조직을 대상으로 관찰·이해·예측·통제할 수 있는 감정의 힘","테일러 윌슨: 14살에 핵융합 성공, 지구에서 32번째, 오바마 전 대통령이 백악관 초대, 최고의 조력자였던 부모님과 멘토","영재교육진흥법 시행령 제29조: 영재학교 — 교장 및 교감 각 1인, 학생 10인당 교사 1인 이상, 전문상담교사 및 사서교사 각 1인"],"questions":[{"id":"25-01","type":"옳은 것","q":"비동시적 발달에 대한 설명으로 옳은 것은?","box":null,"choices":["모든 아이의 발달 과정은 동일한 속도로 진행된다.","비동시적 발달은 신체 발달에서만 나타나고 인지적 특성에서는 나타나지 않는다.","다양한 기관과 신체 부위가 다른 속도로 발달하듯 인지적, 사회정의적 특성의 발달에서도 나타난다.","비동시적 발달은 영재아에게서만 나타나는 비정상적 발달이다.","먼저 걷기 시작한 아동은 언어 발달도 반드시 빠르다."],"answer":3,"explain":"교안: 아이가 성장하면서 다양한 기관과 신체 부위가 다른 속도로 발달하듯 인지적, 사회정의적 특성의 발달에서도 비동시적 발달이 나타남. ① 모든 아이의 발달 과정은 똑같지 않음. ② 인지적·사회정의적 특성에서도 나타남. ④ 비동시적 발달은 정상적 발달이며 모든 아이가 경험함. ⑤ 먼저 걷기 시작해도 언어 발달이 늦을 수 있음.","source":{"page":3,"section":"비동시적 발달이란?","quote":"모든 아이의 발달 과정은 똑같지 않음 아이가 성장하면서 다양한 기관과 신체 부위가 다른 속도로 발달하듯 인지적, 사회정의적 특성의 발달에서도 나타남"}},{"id":"25-02","type":"빈칸","q":"다음은 비동시적 발달의 예이다. (   )에 들어갈 말로 알맞은 것은?","box":"한 아동은 다른 아이보다 먼저 걷기 시작할 수 있지만, (   ) 발달이 늦을 수 있음","choices":["언어","운동","신체","도덕성","시각"],"answer":1,"explain":"교안 예시: 한 아동은 다른 아이보다 먼저 걷기 시작할 수 있지만 '언어' 발달이 늦을 수 있음. 나머지 선지는 교안 예시와 다름.","source":{"page":3,"section":"비동시적 발달이란?","quote":"예를 들어, 한 아동은 다른 아이보다 먼저 걷기 시작할 수 있지만, 언어 발달이 늦을 수 있음"}},{"id":"25-03","type":"옳지 않은 것","q":"인간 발달 연구 및 영재 연구의 흐름에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["교육학과 심리학은 인간 발달의 보편타당한 현상을 이론으로 설명하려고 했다.","피아제의 인지발달이론, 콜버그의 도덕성발달이론이 그 예이다.","영재연구에서도 일반학생과의 비교분석 연구(집단 간 차이 연구)가 주를 이루었다.","영재연구에서 개인 내에서의 차이를 밝히려는 연구는 감소하고 있다.","영재 집단 내의 차이 연구도 이루어지고 있다."],"answer":4,"explain":"④ 교안은 개인 내에서의 차이를 밝히려는 연구도 '증가함'이라고 함. ①②③⑤는 교안 내용 그대로.","source":{"page":4,"section":"01. 영재성의 비동시성 발달","quote":"영재연구에서도 일반학생과의 비교분석 연구(ex. 집단 간의 차이 연구)가 주를 이루었고, 영재 집단 내의 차이 연구도 이루어지고 있음 개인 내에서의 차이를 밝히려는 연구도 증가함"}},{"id":"25-04","type":"옳지 않은 것","q":"'비동시적 발달은 정상적 발달'이라는 내용에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["모든 아이는 고유한 속도로 성장하고 성숙한다.","모든 아이는 발달에 최적의 시기가 같다.","비동시적 발달은 학습과 행동에 영향을 미친다.","언어 발달이 늦은 아이는 가정이나 학교에서 어려움을 겪는다.","정서적으로 불안감을 느끼는 아동은 학업, 사회관계 및 행동에 어려움을 겪을 수 있다."],"answer":2,"explain":"② 교안은 '아이마다 발달에 최적의 시기가 다름'이라고 함. 나머지는 교안 내용 그대로.","source":{"page":5,"section":"비동시적 발달은 정상적 발달!","quote":"모든 아이는 고유한 속도로 성장하고 성숙하며, 아이마다 발달에 최적의 시기가 다름"}},{"id":"25-05","type":"개념 찾기","q":"교안에서 '정서적으로 불안감을 느끼는 아동은 학업, 사회관계 및 행동에 어려움을 겪을 수 있음'과 함께 관련 이론으로 제시된 것은?","box":null,"choices":["피아제의 인지발달이론","콜버그의 도덕성발달이론","렌줄리의 세 고리 이론","영역 일반성 이론","애착이론"],"answer":5,"explain":"교안 5쪽 '비동시적 발달은 정상적 발달!'에서 정서적 불안감과 관련해 '애착이론'이 제시됨. ①② 피아제·콜버그 이론은 인간 발달의 보편타당한 현상을 설명하는 이론의 예(4쪽). ③ 렌줄리 세 고리 이론은 영재성 정의. ④ 영역 일반성/특수성은 영역성 논쟁(8쪽).","source":{"page":5,"section":"비동시적 발달은 정상적 발달!","quote":"정서적으로 불안감을 느끼는 아동은 학업, 사회관계 및 행동에 어려움을 겪을 수 있음 / ‣ 애착이론"}},{"id":"25-06","type":"옳은 것","q":"영재성의 비동시성 발달에 대한 설명으로 옳은 것은?","box":null,"choices":["영재의 비동시적 발달은 치료가 필요한 비정상적 현상이다.","영재들의 비동시적 발달은 영재들이 특별한 영재성을 가지고 있음을 나타내는 것이다.","비동시적 발달은 영재아에게서만 나타난다.","영재아는 교육과 지원이 없어도 영재성이 저절로 발현된다.","영재의 비동시적 발달은 영재성이 없다는 증거이다."],"answer":2,"explain":"교안: 영재성의 비동시성 발달 역시 정상이며, 영재들의 비동시적 발달은 영재들이 특별한 영재성을 가지고 있음을 나타냄. ① 정상임. ③ 모든 아이들이 비동시적 발달을 경험함. ④ 적절한 교육과 지원을 받으면 잠재된 영재성이 더욱 발현될 수 있음. ⑤ 반대 서술.","source":{"page":6,"section":"영재성의 비동시성 발달 역시 정상!","quote":"모든 아이들이 비동시적 발달을 경험함 영재들의 비동시적 발달 역시 영재들이 특별한 영재성을 가지고 있음을 나타나는 것임 영재 아이들은 적절한 교육과 지원을 받으면 잠재된 영재성이 더욱 발현될 수 있음"}},{"id":"25-07","type":"옳지 않은 것","q":"영재학생의 인지적 능력의 비동시적 발달의 특징으로 옳지 않은 것은?","box":null,"choices":["언어 발달이 빠르다.","언어 발달은 인지 발달로 연계된다.","어려운 개념을 쉽게 이해한다.","학습한 내용의 학습전이 능력이 부족하다.","새로운 정보를 빠르게 습득한다."],"answer":4,"explain":"④ 교안은 '학습한 내용을 종합하고 학습전이 능력이 탁월함'이라고 함. 나머지는 교안 내용 그대로.","source":{"page":7,"section":"인지적 능력의 비동시적 발달의 특징","quote":"영재학생은 언어발달이 빠름 언어발달은 인지발달로 연계됨 어려운 개념을 쉽게 이해함 새로운 정보를 빠르게 습득함 학습한 내용을 종합하고 학습전이 능력이 탁월함"}},{"id":"25-08","type":"사례","q":"다음 사례와 가장 관련 깊은 논쟁은?","box":"A 학생은 언어 능력이 매우 뛰어나지만 수학 능력은 또래보다 떨어진다. B 학생은 과학 분야에서 뛰어난 능력을 보이지만 예술 분야에서는 어려움을 겪는다.","choices":["영역성의 논쟁(영역의 일반성/특수성)","본성과 양육 논쟁","선교육·후선발 논쟁","이성과 감정의 상호배치 논쟁","집단 간 차이 연구 논쟁"],"answer":1,"explain":"교안: 인지적 발달은 모든 영역에서 고르게 진행되는 것은 아님 → 영역성의 논쟁(영역의 일반성/특수성). 사례(언어↑ 수학↓, 과학↑ 예술↓)는 교안 예시 그대로. ②③④⑤는 이 쪽에서 제시된 논쟁이 아님.","source":{"page":8,"section":"인지적 능력의 비동시적 발달의 특징","quote":"인지적 발달은 모든 영역에서 고르게 진행되는 것은 아님 영역성의 논쟁 / ‣ 영역의 일반성/ 특수성 ‣ 어떤 영재는 언어능력이 뛰어나지만, 수학 능력이 떨어짐"}},{"id":"25-09","type":"보기 조합","q":"인지적 능력의 비동시적 발달의 특징에 대한 교안 내용으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 인지적 발달은 모든 영역에서 고르게 진행된다.\nㄴ. 영역의 일반성/특수성에 대한 영역성의 논쟁이 있다.\nㄷ. 동양의 집단주의/서양의 개인주의 문화의 차이 논쟁이 제시된다.\nㄹ. 과학 분야에서 뛰어난 능력을 보이지만 예술 분야에서는 어려움을 겪을 수 있다.","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":5,"explain":"ㄴ·ㄷ·ㄹ은 교안 8쪽 내용 그대로. ㄱ은 틀림 → 교안은 '인지적 발달은 모든 영역에서 고르게 진행되는 것은 아님'.","source":{"page":8,"section":"인지적 능력의 비동시적 발달의 특징","quote":"‣ 과학 분야에서 뛰어난 능력을 보이지만, 예술 분야에서는 어려움을 겪을 수 있음 ‣ 동양의 집단주의/ 서양의 개인주의 문화의 차이 논쟁"}},{"id":"25-10","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재의 정서적 발달은 (   )에 비해 상대적으로 느리게 진행","choices":["신체적 발달","사회적 발달","인지적 발달","도덕적 발달","언어적 발달"],"answer":3,"explain":"교안: 영재의 정서적 발달은 '인지적 발달'에 비해 상대적으로 느리게 진행됨. 나머지는 교안 서술과 다름.","source":{"page":9,"section":"정의적 특성의 비동시적 발달의 특징","quote":"영재의 정서적 발달은 인지적 발달에 비해 상대적으로 느리게 진행"}},{"id":"25-11","type":"옳지 않은 것","q":"영재의 정의적 특성의 비동시적 발달의 특징으로 옳지 않은 것은?","box":null,"choices":["자신의 뛰어난 능력에 대한 자부심, 회의감, 소외감 등 다양한 정서적 갈등을 경험한다.","도덕성이 높은 경향이 있다.","정서적으로 민감하며 강렬함을 지니고 있다.","어린 시절부터 우수한 성적을 기록하여 왔기에 완벽주의 경향이 있다.","정서적으로 둔감하여 정서적 갈등을 거의 경험하지 않는다."],"answer":5,"explain":"⑤ 교안은 영재가 정서적으로 민감하며 강렬하고, 다양한 정서적 갈등을 경험한다고 함. ①②③④는 교안 9~10쪽 내용 그대로.","source":{"page":9,"section":"정의적 특성의 비동시적 발달의 특징","quote":"영재는 자신의 뛰어난 능력에 대한 자부심, 회의감, 소외감 등 다양한 정서적 갈등을 경험 영재들은 도덕성이 높은 경향이 있으며, 정서적으로 민감하며 강렬함을 지니고 있음"}},{"id":"25-12","type":"사례","q":"다음 사례의 학생에게서 나타나는 정의적 특성과 교안에서 제시한 그 원인으로 가장 적절한 것은?","box":"초등학교 때부터 늘 최상위 성적을 받아 온 C 학생은 과제에서 작은 실수 하나만 있어도 견디지 못한다. C 학생은 어릴 때부터 부모와 교사에게 '너는 항상 뛰어나야 한다'는 말을 계속 들어 왔다.","choices":["동조의 압박감 — 또래와 공통 관심사가 부족하기 때문","완벽주의 경향 — 교사나 부모로부터 뛰어나야 한다는 피드백을 끊임없이 받았기 때문","소외감 — 또래보다 지식이 많기 때문","회의감 — 언어 발달이 빠르기 때문","학습전이 능력 — 새로운 정보를 빠르게 습득하기 때문"],"answer":2,"explain":"교안: 어린 시절부터 우수한 성적을 기록하여 왔기에 완벽주의 경향이 있으며, 교사나 부모로부터 뛰어나야 한다는 피드백을 끊임없이 받은 것도 완벽주의의 원인으로 작용. ①③은 사회적 특성(11쪽) 내용으로 사례와 무관, ④⑤는 인과가 교안에 없음.","source":{"page":10,"section":"정의적 특성의 비동시적 발달의 특징","quote":"어린 시절부터 우수한 성적을 기록하여 왔기에 완벽주의 경향이 있음 교사나 부모로부터 뛰어나야 한다는 피드백을 끊임없이 받은 것도 완벽주의의 원인으로 작용"}},{"id":"25-13","type":"옳지 않은 것","q":"영재학생의 사회적 특성의 비동시적 발달의 특징으로 옳지 않은 것은?","box":null,"choices":["자신의 뛰어난 능력으로 인해 또래와의 관계에서 어려움을 겪을 수 있다.","또래보다 지식이 많고 사고가 깊기 때문에 또래와 공통의 관심사를 찾기 어려울 수 있다.","또래와 다른 생각을 가지고 있기 때문에 따돌림을 당하거나 소외감을 느낄 수 있다.","또래 집단에 맞추어 행동해야 한다는 압박을 거의 느끼지 않아 갈등이 적다.","자신의 욕구를 충족하고자 하는 것과 또래 동조 사이에서 갈등을 겪는다."],"answer":4,"explain":"④ 교안은 '동조의 압박감과 자기의 욕구를 충족하고자 하는 것 사이의 갈등이 많음'이라고 함. ①②③⑤는 교안 내용 그대로.","source":{"page":11,"section":"사회적 특성의 비동시적 발달의 특징","quote":"영재학생은 또래 집단에 맞추어 행동해야 한다는 동조의 압박감과 자기의 욕구를 충족하고자 하는 것 사이의 갈등이 많음"}},{"id":"25-14","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재학생은 또래보다 지식이 많고, 사고가 깊기 때문에 또래와 (   )를 찾기 어려울 수 있음","choices":["학습 방법","진로 목표","공통의 관심사","역할 모델","정서적 안정"],"answer":3,"explain":"교안: 영재학생은 또래보다 지식이 많고 사고가 깊기 때문에 또래와 '공통의 관심사'를 찾기 어려울 수 있음. 나머지는 교안에 없는 표현.","source":{"page":11,"section":"사회적 특성의 비동시적 발달의 특징","quote":"영재학생은 또래보다 지식이 많고, 사고가 깊기 때문에 또래와 공통의 관심사를 찾기 어려울 수 있음"}},{"id":"25-15","type":"옳은 것","q":"영재성이 조화로운 영재교육을 위한 '영재의 비동시적 발달 이해'에 대한 설명으로 옳은 것은?","box":null,"choices":["영재는 스스로 발달하므로 부모와 교사의 지원은 필요하지 않다.","영재의 강점만 파악하고 약점은 고려하지 않는다.","부모는 자녀에게 정서적 지원보다 학업 성취만 요구해야 한다.","영재의 발달을 관찰하고 각 영역의 발달 수준을 인식해야 한다.","부모가 제공하는 지원은 금전적 지원으로 한정된다."],"answer":4,"explain":"교안: 영재의 발달을 관찰하고 각 영역의 발달 수준을 인식, 강점과 약점을 이해하고 적절한 지원 제공. ① 스스로 발달하는 것이 아님. ② 강점과 약점을 모두 이해. ③ 자녀의 정서적 지원을 제공. ⑤ 정보, 금전, 사회적 지원.","source":{"page":13,"section":"영재의 비동시적 발달 이해","quote":"영재의 발달을 관찰하고, 각 영역의 발달수준을 인식 영재의 강점과 약점을 이해하고, 발달을 촉진하기 위한 적절한 지원을 제공 / ‣ 스스로 발달하는 것이 아님"}},{"id":"25-16","type":"보기 조합","q":"교안에서 부모가 영재 자녀에게 제공하는 지원으로 제시한 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 정서적 지원\nㄴ. 정보 지원\nㄷ. 금전 지원\nㄹ. 사회적 지원","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":5,"explain":"교안 13쪽: 자녀의 정서적 지원을 제공, 그리고 정보, 금전, 사회적 지원이 제시됨 → ㄱ~ㄹ 모두 해당. 부모와 교사의 이해와 지원을 통해 영재아동은 자신의 잠재력을 최대한 발휘할 수 있음.","source":{"page":13,"section":"영재의 비동시적 발달 이해","quote":"자녀의 정서적 지원을 제공 / ‣ 정보 , 금전 , 사회적 지원 / 부모와 교사의 이해와 지원을 통해 영재아동은 자신의 잠재력을 최대한 발휘할 수 있음"}},{"id":"25-17","type":"빈칸","q":"다음은 정서지능(EQ) 교육의 중요성에 대한 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"과거에는 이성과 감정은 상호배치되는 개념 → (   )년 이후 EQ 등장 → 이성과 감정은 시너지 효과를 낼 수 있으므로 EQ가 중요","choices":["1970","1980","1990","2000","2010"],"answer":3,"explain":"교안: 1990년 이후 EQ 등장. 다른 연도는 교안과 다름.","source":{"page":14,"section":"정서지능(EQ) 교육의 중요성","quote":"1990년 이후 EQ 등장 이성과 감정은 시너지 효과를 낼 수 있으므로 EQ가 중요"}},{"id":"25-18","type":"개념 찾기","q":"다음 설명에 해당하는 것은?","box":"나/타인/조직을 대상으로 관찰/이해/예측/통제할 수 있는 감정의 힘","choices":["정서지능(EQ)","지능지수(IQ)","과제집착력","학습전이 능력","창의성"],"answer":1,"explain":"교안 14쪽에서 EQ를 '나/타인/조직을 대상으로 관찰/이해/예측/통제할 수 있는 감정의 힘'으로 제시하며 사회적/정서적 능력도 필요하다고 함. 나머지는 이 정의에 해당하지 않음.","source":{"page":14,"section":"정서지능(EQ) 교육의 중요성","quote":"나/ 타인 / 조직을 대상으로 관찰/ 이해 / 예측 / 통제할 수 있는 감정의 힘 사회적/ 정서적 능력도 필요"}},{"id":"25-19","type":"옳은 것","q":"정서지능(EQ) 교육의 중요성에 대한 설명으로 옳은 것은?","box":null,"choices":["이성과 감정은 시너지 효과를 낼 수 있으므로 EQ가 중요하다.","'이성적으로 생각해라, 감정에 치우치지 마라'는 이성과 감정을 시너지로 보는 관점의 예이다.","과거부터 이성과 감정은 상호보완적인 개념으로 여겨졌다.","EQ는 1990년 이전에 이미 널리 확산된 개념이다.","영재에게는 인지적 능력만 필요하고 사회적/정서적 능력은 필요하지 않다."],"answer":1,"explain":"교안: 이성과 감정은 시너지 효과를 낼 수 있으므로 EQ가 중요. ③ 과거에는 이성과 감정은 상호배치되는 개념. ② 이 말은 과거 상호배치 관점의 예. ④ 1990년 이후 EQ 등장. ⑤ 사회적/정서적 능력도 필요.","source":{"page":14,"section":"정서지능(EQ) 교육의 중요성","quote":"과거에는 이성과 감정은 상호배치되는 개념 정서지능(EQ) 교육의 중요성 / ‣ 예 : 이성적으로 생각해라, 감정에 치우치지 마라 등"}},{"id":"25-20","type":"옳지 않은 것","q":"정서지능(EQ) 교육의 중요성 사례로 제시된 테일러 윌슨에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["14살에 핵융합에 성공하였다.","지구에서 23번째로 핵융합 반응을 일으켰다.","오바마 전 대통령이 백악관에 초대하기도 하였다.","최고의 조력자였던 부모님이 있었다.","학습을 도울 멘토가 있었다."],"answer":2,"explain":"② 교안은 '지구에서 32번째로 핵융합 반응을 일으킴'. 나머지는 교안 내용 그대로.","source":{"page":15,"section":"정서지능(EQ) 교육의 중요성","quote":"14 살에 핵융합에 성공한 테일러 윌슨 / ‣ 지구에서 32 번째로 핵융합 반응을 일으킴‣ 오바마 전 대통령이 백악관에 초대하기도 하였음‣ 최고의 조력자였던 부모님과 학습을 도울 멘토가 있었음"}},{"id":"25-21","type":"빈칸","q":"다음은 영재교육진흥법 시행령 제29조(영재교육기관에 두는 교원의 배치기준)의 일부이다. (   )에 들어갈 숫자로 알맞은 것은?","box":"①영재학교에는 다음 각 호의 기준에 따라 교원을 배치하여야 한다.\n1. 교장 및 교감 각 1인\n2. 학생 (   )인당 교사 1인 이상\n3. 전문상담교사 및 사서교사 각 1인","choices":["5","8","12","10","15"],"answer":4,"explain":"교안: 학생 10인당 교사 1인 이상. 다른 숫자는 교안과 다름.","source":{"page":16,"section":"영재교육기관에 영재전문상담교사 배치","quote":"1. 교장 및 교감 각 1인 2. 학생 10 인당 교사 1인 이상 3. 전문상담교사 및 사서교사 각 1인"}},{"id":"25-22","type":"옳은 것","q":"영재교육기관에 영재전문상담교사 배치와 관련된 법령 내용으로 옳은 것은?","box":null,"choices":["근거는 영재교육진흥법 시행령 제5조이다.","영재학교에는 교장 및 교감을 각 2인 배치한다.","영재학교에는 전문상담교사 및 사서교사를 각 1인 배치한다.","전문상담교사 배치는 영재학급에만 해당한다.","영재학교에는 학생 20인당 교사 1인 이상을 배치한다."],"answer":3,"explain":"교안: 영재교육진흥법 시행령 제29조 ①영재학교 — 3. 전문상담교사 및 사서교사 각 1인. ① 제29조. ② 교장 및 교감 각 1인. ④ 조문은 영재학교에 대한 기준. ⑤ 학생 10인당 교사 1인 이상.","source":{"page":16,"section":"영재교육기관에 영재전문상담교사 배치","quote":"제29 조(영재교육기관에 두는 교원의 배치기준)①영재학교에는 다음 각 호의 기준에 따라 교원을 배치하여야 한다."}}]},{"lesson":26,"title":"영재를 어떻게 판별하고 선발할 것인가?","file":"4. 교안 (1~30)/26.pdf","summary":["영재판별: 1. 영재성의 정의 → 2. 정의된 영재성에 맞는 영재를 판별하고 선발 → 3. 영재교육기관 프로그램에 배치","4단계: 1단계 선별(screening) → 2단계 판별(identification) → 3단계 사정(assessment) → 4단계 선발(selection) / 선별=일차적으로 골라 추려냄, 판별=일정한 준거에 따라 확인·검증, 사정=프로그램에서 성공적일 학생 최종 의사결정, 선발=영재교육기관에 배치","영재교육진흥법의 영재판별 목적: 첫째 영재성의 정의에 합당한 영재판별 / 둘째 영재 프로그램에 적격인 학생 선발·투입(수학, 과학, 발명, 예술, 인문사회 영역별) / 셋째 '영재 프로그램에 적격인 자' 규정 = 행정적인 목적","렌줄리 세 고리 이론: 평균 이상의 지적 능력, 높은 과제집착력, 높은 창의성의 상호작용 / 세 요인 모두 구성이 중요 / 각 영역 85%ile 이상이면서 적어도 한 특성에서는 98%ile","미국의 영재판별 원칙: 지지성(advocacy), 대응가능성(defensible), 공정성(equity), 다원주의(pluralism), 포괄성(comprehensiveness) — 다원주의·다민족 사회의 특성에 맞는 원리 구현","영재판별 비율은 국가·연구자마다 다름 — 정책(관심과 여론, 지지)에 따라 행·재정적 지원이 달라지기 때문 / 미국 3~16%, 영국 5%, 싱가포르 1%","우리나라 영재교육 수혜학생 수는 2013년에 최고점(121,421명) 도달 후 지속 감소(교육부, 2022 영재교육통계연보)","볼랜드(Borland): 잘못된 판별 → 비영재가 영재로 분류(miss-matching) 시 실망·부적응, 영재학생 탈락 / 영재가 분류되지 못하면 기회 상실 / 1종 오류 = 음성인데 양성 판정, 2종 오류 = 양성인데 음성 판정","잘못된 판별 → 신뢰도 하락, 도구·절차 효용성 저하, 판별자의 편견 개입 가능, 비용과 시간의 낭비","볼랜드의 개선방안: 영재성의 정의에 대한 합의 도출, 영재판별의 기준 다양화, 결과 지속적 모니터링과 평가, 영재판별 전문가 양성"],"questions":[{"id":"26-01","type":"옳은 것","q":"교안에서 제시한 영재판별의 과정을 순서대로 바르게 나열한 것은?","box":null,"choices":["영재 판별·선발 → 영재성의 정의 → 영재교육기관 프로그램에 배치","영재성의 정의 → 정의된 영재성에 맞는 영재를 판별·선발 → 영재교육기관 프로그램에 배치","영재교육기관 프로그램에 배치 → 영재성의 정의 → 영재 판별·선발","영재성의 정의 → 영재교육기관 프로그램에 배치 → 영재 판별·선발","영재 판별·선발 → 영재교육기관 프로그램에 배치 → 영재성의 정의"],"answer":2,"explain":"교안: 1. 영재성의 정의 2. 정의된 영재성에 맞는 영재를 판별하고 선발하여 3. 영재교육기관 프로그램에 배치. 나머지는 순서가 뒤바뀜.","source":{"page":3,"section":"영재판별이란?","quote":"1. 영재성의 정의 2. 정의된 영재성에 맞는 영재를 판별하고 선발하여 3. 영재교육기관 프로그램에 배치"}},{"id":"26-02","type":"옳은 것","q":"영재판별의 4단계를 순서대로 바르게 나열한 것은?","box":null,"choices":["판별 → 선별 → 사정 → 선발","선별 → 사정 → 판별 → 선발","선발 → 선별 → 판별 → 사정","선별 → 판별 → 사정 → 선발","사정 → 선별 → 판별 → 선발"],"answer":4,"explain":"교안: 1단계 선별(screening) → 2단계 판별(identification) → 3단계 사정(assessment) → 4단계 선발(selection). 나머지는 순서가 틀림.","source":{"page":4,"section":"영재판별이란?","quote":"1 단계 선별(screening) / 2 단계 판별(identification) / 3 단계 사정(assessment) / 4 단계 선발(selection)"}},{"id":"26-03","type":"개념 찾기","q":"다음 설명에 해당하는 영재판별의 단계는?","box":"선별에서 일차 걸러진 아동들을 다시 일정한 준거에 따라 누가 영재인지를 확인하고 검증하여 영재로 정하는 것","choices":["판별(identification)","선별(screening)","사정(assessment)","선발(selection)","배치(placement)"],"answer":1,"explain":"제시문은 교안의 '판별' 정의. ② 선별 = 영재로 선발될 가능성이 있는 아동들을 일차적으로 골라서 추려내는 것. ③ 사정 = 영재교육 프로그램에서 성공적일 학생들을 최종적으로 의사결정. ④ 선발 = 영재교육기관에 배치하는 것. ⑤ 교안의 4단계에 없음.","source":{"page":4,"section":"영재판별이란?","quote":"판별: 선별에서 일차 걸러진 아동들을 다시 일정한 준거에 따라 누가 영재인지를 확인하고 검증하여 영재로 정하는 것"}},{"id":"26-04","type":"옳지 않은 것","q":"영재판별 4단계의 명칭과 의미를 연결한 것으로 옳지 않은 것은?","box":null,"choices":["선별(screening) – 영재로 선발될 가능성이 있는 아동들을 일차적으로 골라서 추려내는 것","판별(identification) – 일정한 준거에 따라 누가 영재인지를 확인하고 검증하는 것","선발(selection) – 영재교육기관에 배치하는 것","사정(assessment) – 영재교육 프로그램에서 성공적일 학생들을 최종적으로 의사결정하는 것","선별(screening) – 영재교육 프로그램 종료 후 성과를 평가하는 것"],"answer":5,"explain":"⑤ 선별은 영재로 선발될 가능성이 있는 아동들을 일차적으로 골라서 추려내는 것이며, 프로그램 종료 후 성과 평가는 교안에 없는 내용. ①~④는 교안 정의 그대로.","source":{"page":4,"section":"영재판별이란?","quote":"선별: 영재로 선발될 가능성이 있는 아동들을 일차적으로 골라서 추려내는 것 … 사정: 영재교육 프로그램에서 성공적일 학생들을 최종적으로 의사결정하는 것 선발: 영재교육기관에 배치하는 것"}},{"id":"26-05","type":"옳은 것","q":"영재교육진흥법의 영재판별 목적에 대한 설명으로 옳은 것은?","box":null,"choices":["영재 교육프로그램은 판별을 먼저 한 뒤 영재성의 정의를 마련하는 것이 논리적으로 타당한 순서이다.","영재판별의 첫째 목적은 영재교육 예산 확보이다.","수학, 과학, 발명, 예술, 인문사회로 영역별 영재를 선발할 때 어떤 판별 준거와 절차가 필요한지를 결정한다.","영재판별은 행정적인 목적과는 관련이 없다.","영재판별 결과는 교육프로그램 구성에 참고하지 않는다."],"answer":3,"explain":"교안 둘째 목적: 영재 프로그램에 적격인 학생을 선발하여 투입 — 수학, 과학, 발명, 예술, 인문사회로 영역별 영재를 선발할 때 판별 준거와 절차 결정. ① 정의된 영재성에 근거하여 판별 과정을 거치는 것이 논리적 순서. ② 첫째 목적은 영재성의 정의에 합당한 영재판별. ④ 셋째 목적이 행정적인 목적. ⑤ 판별 결과는 교육프로그램 구성에 참고자료가 됨.","source":{"page":5,"section":"영재교육진흥법의 영재판별 목적","quote":"둘째, 영재 프로그램에 적격인 학생을 선발하여 프로그램에 투입하려는 목적임 / ‣ 수학 , 과학 , 발명 , 예술 , 인문사회로 영역별 영재를 선발할 때 어떤 판별준거와 절차가 필요한지를 결정"}},{"id":"26-06","type":"빈칸","q":"다음은 영재교육진흥법의 영재판별 목적 중 셋째 목적이다. (   )에 들어갈 말로 알맞은 것은?","box":"셋째, 영재교육진흥법에는 \"영재 프로그램에 적격인 자\"로 규정\n‣ 영재교육 프로그램 투입의 요건으로서 영재판별을 하는 (   ) 목적을 의미","choices":["교육적인","행정적인","재정적인","연구적인","사회적인"],"answer":2,"explain":"교안: 영재교육 프로그램 투입의 요건으로서 영재판별을 하는 '행정적인' 목적. 영재가 판별되어 선발되어야 영재프로그램을 투입할 수 있기 때문.","source":{"page":6,"section":"영재교육진흥법의 영재판별 목적","quote":"‣ 영재교육 프로그램 투입의 요건으로서 영재판별을 하는 행정적인 목적을 의미‣ 영재가 판별되어 선발되어야 영재프로그램을 투입할 수 있기 때문임"}},{"id":"26-07","type":"옳지 않은 것","q":"렌줄리의 영재판별에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["세계적으로 영재판별에 렌줄리의 영재성의 정의에 따른 판별 개념이 널리 쓰인다.","우리나라 영재판별에도 많은 영향을 주었다.","세 고리 이론에서 영재는 평균 이상의 지적 능력, 높은 과제집착력, 높은 창의성이 상호작용한다.","세 요인 중 어느 한 요인만 매우 우수하면 영재성을 구성한다.","세 요인을 모두 구성하는 것이 중요하다."],"answer":4,"explain":"④ 교안: 세 요인 중 어느 한 요인만이 우수성을 구성하지 않고, 세 요인을 모두 구성하는 것이 중요함. ①②③⑤는 교안 내용 그대로.","source":{"page":8,"section":"렌줄리의 영재판별","quote":"세 요인 중 어느 한 요인만이 우수성을 구성하지 않고, 세 요인을 모두 구성하는 것이 중요함"}},{"id":"26-08","type":"보기 조합","q":"렌줄리의 세 고리 이론에서 영재성을 구성하는 요인을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 평균 이상의 지적 능력\nㄴ. 높은 과제집착력\nㄷ. 높은 창의성\nㄹ. 높은 정서지능","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"교안: 렌줄리의 세 고리 이론에 따르면 영재는 평균 이상의 지적 능력, 높은 과제집착력, 높은 창의성의 상호작용. ㄹ 정서지능은 세 고리에 포함되지 않음.","source":{"page":7,"section":"렌줄리의 영재판별","quote":"렌줄리의 세 고리 이론에 따르면, 영재는 평균 이상의 지적 능력, 높은 과제집착력, 높은 창의성의 상호작용함"}},{"id":"26-09","type":"빈칸","q":"다음은 렌줄리의 영재판별 기준이다. (   ), (   )에 들어갈 말로 알맞은 것은?","box":"각 영역에서 (   ) 이상이면서 적어도 한 특성에서는 (   )","choices":["75%ile, 95%ile","80%ile, 98%ile","85%ile, 95%ile","90%ile, 99%ile","85%ile, 98%ile"],"answer":5,"explain":"교안: 각 영역에서 85%ile 이상이면서 적어도 한 특성에서는 98%ile. 나머지 수치 조합은 교안과 다름.","source":{"page":8,"section":"렌줄리의 영재판별","quote":"‣ 각 영역에서 85%ile 이상이면서 적어도 한 특성에서는 98%ile"}},{"id":"26-10","type":"개념 찾기","q":"다음 설명에 해당하는 미국의 영재판별 원칙은?","box":"영재판별 절차에는 특정 집단의 아동을 제외하여서는 안 됨","choices":["지지성(advocacy)","대응가능성(defensible)","공정성(equity)","다원주의(pluralism)","포괄성(comprehensiveness)"],"answer":3,"explain":"공정성(equity): 특정 집단의 아동을 제외하여서는 안 됨. ① 지지성 = 모든 학생들에게 받아들여질 수 있도록 고안. ② 대응가능성 = 가장 유용한 연구결과와 권고사항을 기초로. ④ 다원주의 = 영재성의 정의는 가장 광범위하고 대응할 수 있는 것 채택. ⑤ 포괄성 = 영재일 가능성이 있는 경우도 판별·서비스.","source":{"page":9,"section":"미국의 영재판별 원칙","quote":"공정성(equity) / ‣ 영재판별 절차에는 특정 집단의 아동을 제외하여서는 안 됨"}},{"id":"26-11","type":"옳지 않은 것","q":"미국의 영재판별 원칙과 그 내용을 연결한 것으로 옳지 않은 것은?","box":null,"choices":["지지성(advocacy) – 영재판별은 모든 학생들에게 받아들여질 수 있도록 고안되어야 함","대응가능성(defensible) – 영재판별 절차에는 특정 집단의 아동을 제외하여서는 안 됨","다원주의(pluralism) – 영재성의 정의는 가장 광범위하고 대응할 수 있는 것이 채택되어야 함","포괄성(comprehensiveness) – 영재뿐 아니라 영재일 가능성이 있는 경우도 판별되고 서비스받아야 함","공정성(equity) – 영재판별 절차에는 특정 집단의 아동을 제외하여서는 안 됨"],"answer":2,"explain":"② 대응가능성(defensible)은 '영재판별 절차는 가장 유용한 연구결과와 권고사항을 기초로 해야 함'. 제시된 내용은 공정성(equity)에 해당. 나머지는 교안 연결 그대로.","source":{"page":9,"section":"미국의 영재판별 원칙","quote":"대응가능성(defensible) / ‣ 영재판별 절차는 가장 유용한 연구결과와 권고사항을 기초로 해야 함"}},{"id":"26-12","type":"사례","q":"다음 사례의 교육청이 따른 미국의 영재판별 원칙으로 가장 적절한 것은?","box":"D 교육청은 현재 영재로 판별된 학생뿐 아니라, 아직 뚜렷한 성취를 보이지는 않지만 영재일 가능성이 있는 학생도 판별하여 영재교육 서비스를 받을 수 있도록 하였다.","choices":["지지성(advocacy)","대응가능성(defensible)","공정성(equity)","다원주의(pluralism)","포괄성(comprehensiveness)"],"answer":5,"explain":"포괄성(comprehensiveness): 영재뿐 아니라 영재일 가능성이 있는 경우도 판별되고 서비스받아야 함. 나머지 원칙의 내용은 26-11 해설 참조.","source":{"page":10,"section":"미국의 영재판별 원칙","quote":"포괄성(comprehensiveness) / ‣ 영재뿐 아니라 영재일 가능성이 있는 경우도 판별되고 서비스 받아야 함"}},{"id":"26-13","type":"빈칸","q":"다음은 미국의 영재판별 원칙에 대한 Tips이다. (   )에 들어갈 말로 알맞은 것은?","box":"미국의 영재판별의 원칙은 (   ), 다민족 사회의 특성에 맞는 원리들을 구현하기 위하여 제정된 것임","choices":["다원주의","개인주의","집단주의","능력주의","평등주의"],"answer":1,"explain":"교안 Tips: 미국의 영재판별의 원칙은 '다원주의', 다민족 사회의 특성에 맞는 원리들을 구현하기 위하여 제정된 것임. 나머지는 교안 표현과 다름.","source":{"page":10,"section":"미국의 영재판별 원칙","quote":"Tips! 미국의 영재판별의 원칙은 다원주의, 다민족 사회의 특성에 맞는 원리들을 구현하기 위하여 제정된 것임"}},{"id":"26-14","type":"옳은 것","q":"영재판별의 비율에 대한 설명으로 옳은 것은?","box":null,"choices":["영재판별 비율은 국제적으로 통일되어 있다.","국가마다 차이가 발생하는 이유는 정책(영재교육에 대한 관심과 여론, 지지)에 따라 행·재정적 지원이 달라지기 때문이다.","영재판별 비율은 연구자에 관계없이 동일하다.","국가별 차이는 학생들의 평균 지능 차이 때문이다.","영재교육 담당교원 수는 영재판별 비율과 무관한 고려사항이다."],"answer":2,"explain":"교안: 영재판별 비율은 매우 다양하고 국가마다 연구자마다 다르며, 차이는 정책에 따라 행·재정적 지원이 달라지기 때문. ①③ 다양하고 다름. ④ 교안에 없는 원인. ⑤ 교안은 '영재교육 담당교원을 증가할 것인가?' 등을 정책적 고려사항으로 제시.","source":{"page":11,"section":"영재판별의 비율","quote":"국가마다 차이가 발생하는 이유는 정책(영재교육에 대한 관심과 여론, 지지 )에 따라 행∙재정적 지원이 달라지기 때문"}},{"id":"26-15","type":"옳지 않은 것","q":"전체 학생 수 대비 영재교육 수혜자의 비율에 대한 교안 내용으로 옳지 않은 것은?","box":null,"choices":["미국은 3~16%이다.","영국은 5%이다.","싱가포르는 5%이다.","우리나라 영재교육 수혜학생 수는 2013년에 최고점에 도달하였다.","우리나라 영재교육 수혜학생 수는 최고점 이후 지속 감소하였다."],"answer":3,"explain":"③ 교안: 싱가포르(1%). 5%는 영국. 나머지는 교안 내용 그대로.","source":{"page":12,"section":"영재판별의 비율","quote":"‣ 미국 (3~16%), 영국(5%), 싱가포르(1%)"}},{"id":"26-16","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"우리나라 교육부 발표에 따르면 영재교육 수혜학생 수는 (   )년에 최고점(121,421명)에 도달 후 지속 감소","choices":["2013","2010","2008","2015","2018"],"answer":1,"explain":"교안: 영재교육 수혜학생 수는 2013년에 최고점(121,421명)에 도달 후 지속 감소. 나머지 연도는 교안과 다름.","source":{"page":12,"section":"영재판별의 비율","quote":"‣ 영재교육 수혜학생 수는 2013년에 최고점(121,421명)에 도달 후 지속 감소"}},{"id":"26-17","type":"옳은 것","q":"교안의 '감소하는 영재교육대상자' 자료에 대한 설명으로 옳은 것은?","box":null,"choices":["출처는 교육부, 2022 영재교육통계연보이다.","출처는 한국교육개발원, 2013 영재교육백서이다.","영재교육대상자는 2013년 이후 지속 증가하고 있다.","영재교육 수혜학생 수의 최고점은 112,421명이다.","출처는 서울특별시교육청 보도자료이다."],"answer":1,"explain":"교안 13쪽 '감소하는 영재교육대상자' 출처: 교육부, 2022 영재교육통계연보. ②⑤ 출처가 다름. ③ 2013년 최고점 후 지속 감소. ④ 최고점은 121,421명.","source":{"page":13,"section":"영재판별의 비율","quote":"감소하는 영재교육대상자 / 출처: 교육부, 2022 영재교육통계연보"}},{"id":"26-18","type":"사례","q":"볼랜드(Borland)가 지적한 '영재판별이 잘못될 경우'에 해당하는 다음 사례에 대한 설명으로 가장 적절한 것은?","box":"영재가 아닌 E 학생이 영재로 분류되어 영재 프로그램에 참여하였다. E 학생은 프로그램에 적응하지 못해 어려움을 겪었고, 그로 인해 실제 영재인 F 학생은 선발에서 탈락하였다.","choices":["영재판별 기준이 다양화되어 나타난 바람직한 결과이다.","잘못된 영재판별로 인한 miss-matching의 문제이다.","포괄성 원칙이 적용된 사례이다.","선교육·후선발 방식의 장점을 보여 준다.","사정(assessment) 단계가 정확히 이루어진 사례이다."],"answer":2,"explain":"교안: 잘못된 영재판별로 인해 영재가 아닌 학생이 영재로 분류되면(miss-matching) 실망하거나 적응하지 못해 어려움을 겪을 수 있으며, 비영재학생의 선발로 인해 영재학생이 탈락될 수 있음. 나머지는 사례와 무관하거나 반대.","source":{"page":15,"section":"볼랜드 Borland의 영재판별이 잘못될 경우","quote":"잘못된 영재판별로 인해 영재가 아닌 학생이 영재로 분류되면(miss- matching), 영재프로그램에 참여하는 학생 중 일부는 영재가 아니라는 것을 알게 되어 실망하거나 영재프로그램에 적응하지 못해 어려움을 겪을 수 있음 / ‣ 비영재학생의 선발로 인해 영재학생이 탈락될 수 있음"}},{"id":"26-19","type":"빈칸","q":"다음은 영재판별 오류에 대한 교안 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"‣ 1종 오류 – 음성인데 양성으로 판정하는 경우\n‣ 2종 오류 – (   )","choices":["음성인데 음성으로 판정하는 경우","양성인데 양성으로 판정하는 경우","판정을 보류하는 경우","양성인데 음성으로 판정하는 경우","판별자의 편견이 개입되는 경우"],"answer":4,"explain":"교안: 2종 오류 – 양성인데 음성으로 판정하는 경우. 1종 오류는 음성인데 양성으로 판정하는 경우. ①② 올바른 판정. ③⑤ 오류 정의가 아님.","source":{"page":16,"section":"볼랜드 Borland의 영재판별이 잘못될 경우","quote":"‣ 1 종오류 – 음성인데 양성으로 판정하는 경우‣ 2 종오류 – 양성인데 음성으로 판정하는 경우"}},{"id":"26-20","type":"옳은 것","q":"볼랜드(Borland)가 제시한 '영재가 영재로 분류되지 못할 경우'의 결과로 옳은 것은?","box":null,"choices":["영재 프로그램 비용이 절감된다.","영재판별의 신뢰도가 높아진다.","영재프로그램에 참여할 기회를 놓치게 되어 잠재력을 발휘하지 못할 수 있다.","판별자의 편견이 제거된다.","일반학생이 영재 프로그램에 적응하지 못하게 된다."],"answer":3,"explain":"교안: 잘못된 영재판별로 인해 영재가 영재로 분류되지 못할 경우 영재프로그램에 참여할 기회를 놓치게 되어 잠재력을 발휘하지 못할 수 있음. ①②④ 교안 내용과 반대·무관. ⑤는 비영재가 영재로 분류된 경우(miss-matching)의 문제.","source":{"page":16,"section":"볼랜드 Borland의 영재판별이 잘못될 경우","quote":"잘못된 영재판별로 인해 영재가 영재로 분류되지 못할 경우 영재프로그램에 참여할 기회를 놓치게 되어 잠재력을 발휘하지 못할 수 있음"}},{"id":"26-21","type":"옳지 않은 것","q":"볼랜드(Borland)가 제시한 영재판별이 잘못될 경우의 문제점으로 옳지 않은 것은?","box":null,"choices":["영재판별에 대한 신뢰도가 떨어진다.","영재판별 도구와 절차의 효용성을 떨어뜨린다.","영재교육의 발전에 부정적인 영향을 미칠 수 있다.","영재판별은 객관적이므로 판별자의 편견이 영향을 미치지 않는다.","대상 부적합에 따른 영재교육프로그램의 비용과 시간의 낭비를 초래한다."],"answer":4,"explain":"④ 교안: 영재판별은 주관적인 요소가 개입될 수 있으며 판별자의 편견이 영재판정에 영향을 미칠 수 있음. ①②③⑤는 교안 내용 그대로.","source":{"page":17,"section":"볼랜드 Borland의 영재판별이 잘못될 경우","quote":"영재판별은 주관적인 요소가 개입될 수 있으며 따라서 판별자의 편견이 영재판정에 영향을 미칠 수 있음"}},{"id":"26-22","type":"보기 조합","q":"볼랜드(Borland)의 영재판별 개선방안으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 영재성의 정의에 대한 합의 도출\nㄴ. 영재판별의 기준 단일화\nㄷ. 영재판별의 결과 지속적 모니터링과 평가\nㄹ. 영재판별 전문가 양성","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"볼랜드의 개선방안: 영재성의 정의에 대한 합의 도출, 영재판별의 기준 다양화, 결과 지속적 모니터링과 평가, 영재판별 전문가 양성. ㄴ은 틀림 → 단일한 기준이 아닌 '기준 다양화'.","source":{"page":18,"section":"볼랜드 Borland의 영재판별 개선방안","quote":"영재성의 정의에 대한 합의 도출 … 영재판별의 기준 다양화 / ‣ 영재판별은 단일한 기준에 기반하여 이루어지기보다는, 다양한 기준을 종합적으로 고려하여 이루어져야 영재판정에 대한 오류를 줄일 수 있음"}},{"id":"26-23","type":"옳은 것","q":"볼랜드(Borland)의 영재판별 개선방안에 대한 설명으로 옳은 것은?","box":null,"choices":["영재성의 정의는 기관마다 자율적으로 다르게 두어 판별 기준을 유연하게 해야 한다.","영재판별 결과는 한 번 확정되면 다시 평가할 필요가 없다.","영재판별은 담임교사 누구나 할 수 있으므로 별도의 전문가 양성은 불필요하다.","단일한 기준에 기반한 판별이 오류를 가장 줄일 수 있다.","영재판별은 전문적인 지식과 경험이 필요하기 때문에 영재판별 전문가를 양성하여 판별의 질을 향상시켜야 한다."],"answer":5,"explain":"교안: 영재판별은 전문적인 지식과 경험이 필요하기 때문에 영재판별 전문가를 양성하여 판별의 질을 향상시켜야 함. ① 영재성의 정의에 대한 합의를 도출하여 기준을 명확히. ② 결과는 지속적으로 모니터링하고 평가. ③ 전문가 양성 필요. ④ 다양한 기준을 종합적으로 고려해야 오류를 줄임.","source":{"page":19,"section":"볼랜드 Borland의 영재판별 개선방안","quote":"영재판별 전문가 양성 / ‣ 영재판별은 전문적인 지식과 경험이 필요하기 때문에, 영재판별 전문가를 양성하여 판별의 질을 향상시켜야 함"}}]},{"lesson":27,"title":"영재판별의 다양한 방식","file":"4. 교안 (1~30)/27.pdf","summary":["관찰 및 추천: 교사·학교장·카운슬러·심리학자·기타 관련인의 추천 / 학생 기능에 대한 교사 보고(지능, 운동성, 사회성, 정서(학습 스타일, 동기)) / 가족역사와 학생 배경(부모에게서 병기록, 부모 학력수준과 직업, 과외활동 흥미 등)","영재판별 도구: 추천(교사·부모·본인·동료), 학생생활기록부(자아감, 가치관, 흥미, 태도), 학생성취(성취도 검사, 포트폴리오, 수상 실적), 표준화된 심리검사(지능검사, 창의성 검사, 적성검사)","교사관찰추천: 사교육에 의해 만들어진 영재보다 잠재성을 중요한 관찰 대상으로 / 단점: 비교적 정확하지 않고 모범적이며 공부를 잘하면 영재라고 판별 / 교사는 학생과 가장 많은 시간 → 특성 파악 유리","교사 추천서(일반적 지적 능력, 창의성, 자기주도적 학습능력, 호기심, 학습기술), 특성 체크리스트, 학생생활기록부(과목 동기화, 과제집착력, 창의성, 인성, 호기심), 자기소개서(자아개념, 흥미, 가치, 활동과 성취 — 학생 자신이 설명)","서울시교육청: 종전 = 지필검사 중심 다단계 전형(학교장 추천, 영재성 검사, 학문적성검사, 심층면접) → 현재 = 교사관찰·추천제(개별추천인 추천, 학교 집중관찰위원 및 추천위원회, 영재교육대상자 선정심사위원회 심의)","선발도구 활용(2022): 교사관찰추천 체크리스트 61.7%(900기관), KEDI 심층면접도구 등 36.2%(528기관), KEDI 영재성 검사 35.4%(516기관), 기타 지필평가 24.1%, 교사추천서 23.9%, 창의적문제해결력 검사 13.9% / 코로나19로 비대면 전환 / KEDI 검사도구는 15개 교육청(서울, 인천 제외)","미국 국립영재교육연구소: 자동선발 = 회전문효과(1단계 표준화검사, 2단계 교사추천) / 3단계 대안적 선발(사례연구, 판별위원회 심의 반드시) / 4단계 특별추천 / 5단계 부모의 영재추천 / 6단계 탁월한 학생행동정보 추천 / 주마다 3~16%","이스라엘: 쫄드연구소(Henrietta Szold Institute) 개발 / 2·3·4학년 중 한 학년 전원 검사 → 상위 15% 재검사 → 상위 1.5% 영재학급·영재교육센터, 상위 3% 이내 방과후 심화학습","싱가포르: 초3 말 전학생 대상, 1차(영어·수학 선별검사)·2차(영어·수학 등 학력검사) → 상위 1% 약 500명 → 초4~6학년 상설영재학급(self-contained classes)","우리나라: 사교육·선행학습 효과 최소화, 소외계층 영재성 발굴 위해 교사관찰추천제 도입 / 교사 관찰추천 평가요소 반영 기관 2022년 기준 77.4% / KEDI 영재성검사·창의적문제해결력 수행관찰도구 등 객관적 검사 포함 종합평가","해외 경향: 습득한 지식을 활용할 수 있는 능력, 새로운 자료 조작 능력 중점 / 다양한 준거·방법, 다단계 선발절차 증가 / 산출물·수행과정 직접 관찰, 교육 장면 태도·능력 관찰, 정의적 특성까지 평가"],"questions":[{"id":"27-01","type":"옳지 않은 것","q":"영재판별을 위한 '가족역사와 학생의 배경' 조사에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["부모에게서 학생의 발달과정에 대한 자료를 얻는다.","학생과 가족의 병기록을 조사한다.","부모의 학력수준과 직업을 조사한다.","아동의 과외활동에 대한 흥미를 조사한다.","동료 학생에게서 학생의 발달과정에 대한 자료를 얻는다."],"answer":5,"explain":"⑤ 교안: 가족역사와 학생의 배경은 '부모에게서' 학생의 발달과정에 대한 자료를 얻음. ①~④는 교안 내용 그대로.","source":{"page":3,"section":"관찰 및 추천","quote":"가족역사와 학생의 배경 / ‣ 부모에게서 학생의 발달과정에 대한 자료를 얻어 학생과 가족의 병기록 , 부모의 학력수준과 직업, 아동의 과외활동에 대한 흥미 등을 조사"}},{"id":"27-02","type":"보기 조합","q":"관찰 및 추천에서 '학생의 기능에 대한 교사 보고'에 포함되는 내용을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 지능\nㄴ. 운동성\nㄷ. 사회성\nㄹ. 정서(학습 스타일, 동기)","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],"answer":3,"explain":"교안: 학생의 기능에 대한 교사 보고 → 지능, 운동성, 사회성, 정서(학습 스타일, 동기) 등. ㄱ~ㄹ 모두 해당.","source":{"page":3,"section":"관찰 및 추천","quote":"학생의 기능에 대한 교사 보고 / ‣ 지능 , 운동성 , 사회성 , 국립영재교육연구소의 영재판별체계","quote":"주마다 영재선발은 3~16%까지 다양함 주마다 판별기준도 다양함 / ‣ 학업성적 , 지능검사 , 창의성 검사, 교사나 영재교육장학사 추천, 포트폴리오 등의 단일 또는 다중 근거"}},{"id":"27-19","type":"옳지 않은 것","q":"이스라엘의 영재판별체계에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["매년 교육부 주관으로 영재판별시험을 실시한다.","시험은 쫄드연구소(Henrietta Szold Institute)가 개발하여 전국에서 공동으로 실시한다.","첫 번째 단계는 2, 3, 4학년 중 한 학년의 모든 학생을 검사한다.","두 번째 단계에서는 첫 시험에서 상위 10% 이내에 든 학생들에 대한 재검사를 실시한다.","재검사 결과 상위 1.5%에 해당하는 학생들은 영재학급과 영재교육센터에서 영재교육을 받는다."],"answer":4,"explain":"④ 교안: 첫 시험에서 '상위 15%' 이내에 든 학생들에 대한 재검사. ①②③⑤는 교안 내용 그대로.","source":{"page":14,"section":"이스라엘의 영재판별체계","quote":"두 번째 단계에서는 첫 시험에서 상위 15% 이내에 든 학생들에 대한 재검사를 실시 재검사 결과 상위 1.5%에 해당하는 학생들은 영재학급과 영재교육센터에서 영재교육을 받음"}},{"id":"27-20","type":"사례","q":"이스라엘의 영재판별체계에서 재검사 결과 상위 1.5% 이내에는 들지 못했지만 상위 3% 이내에 해당하는 학생이 받게 되는 교육은?","box":null,"choices":["영재학급 교육","방과후 심화학습 프로그램","영재교육센터 교육","상설영재학급(self-contained classes) 교육","대학부설 영재교육원 교육"],"answer":2,"explain":"교안: 상위 1.5% 이내에 해당하지는 않지만 상위 3% 이내에 해당하는 학생들은 방과후 심화학습 프로그램에 참가. ①③ 상위 1.5% 학생이 받는 교육. ④ 싱가포르. ⑤ 교안의 이스라엘 체계에 없음.","source":{"page":15,"section":"이스라엘의 영재판별체계","quote":"상위 1.5% 이내에 해당하지는 않지만 상위 3% 이내에 해당하는 학생들은 방과후 심화학습 프로그램에 참가함"}},{"id":"27-21","type":"보기 조합","q":"이스라엘의 영재판별에서 활용하는 '질적 자료'에 해당하는 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 국가 교육과정 평가시험\nㄴ. 교수의 수행평가\nㄷ. 학생 관찰\nㄹ. 공개시험\nㅁ. 학생의 작업결과 조사","choices":["ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄷ, ㄹ, ㅁ","ㄴ, ㄷ, ㅁ"],"answer":5,"explain":"교안: 질적 자료 = 교수의 수행평가, 학생 관찰, 학생의 작업결과 조사 등. 양적 자료 = 국가 교육과정 평가시험, 교사평가의 결과, 공개시험, 예능 평가결과 등 → ㄱ, ㄹ은 양적 자료.","source":{"page":15,"section":"이스라엘의 영재판별체계","quote":"양적 자료: 국가 교육과정 평가시험, 교사평가의 결과, 공개시험, 예능 평가결과 등 질적 자료: 교수의 수행평가, 학생관찰 , 학생의 작업결과 조사 등"}},{"id":"27-22","type":"옳지 않은 것","q":"싱가포르의 영재판별체계에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["교육부에서 초등학교 3학년 말에 전 학생을 대상으로 선발시험을 실시한다.","1차는 영어 및 수학의 선별검사, 2차는 영어, 수학 등의 학력검사이다.","제1, 2차 점수를 종합하여 상위 1%의 '지능이 뛰어난 학생'을 최종 선발한다.","최종 선발 인원은 약 5,000명 정도이다.","초등학교 4~6학년까지 일반학교에 설치된 상설영재학급(self-contained classes)에서 영재교육을 한다."],"answer":4,"explain":"④ 교안: 약 500명 정도. ①②③⑤는 교안 내용 그대로.","source":{"page":16,"section":"싱가포르의 영재판별체계","quote":"제1, 2 차의 점수를 종합하여 상위 1%의 ‘지능이 뛰어난 학생’을 영재교육대상자로 최종선발( 약 500 명 정도 ) 초등학교 4~6 학년까지 일반학교에 설치된 상설영재학급(self-contained classes)에서 영재교육"}},{"id":"27-23","type":"옳은 것","q":"우리나라 영재교육원 및 영재학급이 교사관찰추천제를 도입한 이유로 옳은 것은?","box":null,"choices":["사교육 및 선행학습의 효과를 최소화하고 소외계층의 영재성 발굴 기회를 높이기 위해","지필검사 위주의 선발을 강화하기 위해","선발 인원을 상위 1%로 제한하기 위해","영재교육 대상자 수를 줄이기 위해","부모 추천을 의무화하기 위해"],"answer":1,"explain":"교안: 영재교육원 및 영재학급은 사교육 및 선행학습의 효과를 최소화하고 소외계층의 영재성 발굴 기회를 높이기 위해 교사관찰추천제를 도입. 나머지는 교안에 없는 내용.","source":{"page":17,"section":"우리나라의 영재판별체계","quote":"영재교육원 및 영재학급은 사교육 및 선행학습의 효과를 최소화하고 소외계층의 영재성 발굴 기회를 높이기 위해 교사관찰추천제를 도입하여 영재교육대상자를 선발"}},{"id":"27-24","type":"빈칸","q":"다음 (   )에 들어갈 수치로 알맞은 것은?","box":"실제 전국 영재교육원 및 영재학급 중에서 교사추천 체크리스트 평가, 수행 관찰형 평가, 면접 평가 등 교사 관찰추천 평가요소를 반영하여 영재교육대상자를 선발한 기관은 2022년 기준 (   )","choices":["61.7%","35.4%","88.6%","56.2%","77.4%"],"answer":5,"explain":"교안: 2022년 기준 77.4%. ① 61.7%는 교사관찰추천 체크리스트 활용 비율. ② 35.4%는 KEDI 영재성 검사 활용 비율. ③④ 교안에 없는 수치.","source":{"page":18,"section":"우리나라의 영재판별체계","quote":"교사 관찰추천 평가요소를 반영하여 영재교육대상자를 선발한 기관은 2022년 기준 77.4%"}},{"id":"27-25","type":"옳은 것","q":"시도교육청 영재교육원 및 영재학급이 교사관찰추천제의 실효성을 높이고 내실화하기 위해 하는 일로 옳은 것은?","box":null,"choices":["교사관찰추천만으로 선발하고 객관적 검사는 폐지한다.","KEDI 영재성검사 및 KEDI 창의적 문제해결력 수행관찰도구 등 객관적인 검사를 포함하여 다양한 정보원을 통한 종합적인 평가를 실시한다.","학부모 면담만으로 최종 선발한다.","지필검사 점수 단일 기준으로 선발한다.","선발 과정에서 교사 추천을 제외한다."],"answer":2,"explain":"교안 18쪽 내용 그대로 ②. 나머지는 '다양한 정보원을 통한 종합적인 평가'와 반대되는 서술.","source":{"page":18,"section":"우리나라의 영재판별체계","quote":"교사관찰추천제의 실효성을 높이고 내실화하기 위하여 KEDI 영재성검사 및 KEDI 창의적 문제해결력 수행관찰도구 등 객관적인 검사를 포함하여 다양한 정보원을 통한 종합적인 평가를 실시"}},{"id":"27-26","type":"옳지 않은 것","q":"해외의 영재판별의 경향과 시사점으로 옳지 않은 것은?","box":null,"choices":["이미 습득된 지식보다는 습득한 지식을 활용할 수 있는 능력에 중점을 둔다.","새로운 자료를 조작하는 능력에 중점을 둔다.","단일 준거와 1회 선발 절차를 사용하는 경향이 많아졌다.","지필검사보다 산출물과 수행과정을 직접 관찰을 통해 평가하려는 경향이 증가한다.","인지적 능력뿐 아니라 정의적 특성까지 평가의 대상으로 삼는 경향이 증가한다."],"answer":3,"explain":"③ 교안: 다양한 준거와 방법을 활용하는 경향이 증가하고, 다단계 선발절차를 사용하는 경향이 많아짐. ①②④⑤는 교안 내용 그대로.","source":{"page":19,"section":"해외의 영재판별의 경향과 시사점","quote":"다양한 준거와 방법을 활용하는 경향이 증가함 다단계 선발절차를 사용하는 경향이 많아짐"}},{"id":"27-27","type":"보기 조합","q":"해외의 영재판별 경향으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 검사에만 그치지 않고, 교육 장면에서의 태도와 능력을 관찰평가하는 경향이 증가\nㄴ. 산출물과 수행과정보다 지필검사를 중시하는 경향이 증가\nㄷ. 인지적 능력뿐 아니라 정의적 특성까지 평가의 대상으로 삼는 경향이 증가\nㄹ. 이미 습득된 지식의 양을 측정하는 데 중점","choices":["ㄱ, ㄷ","ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],"answer":1,"explain":"ㄱ, ㄷ은 교안 20쪽 내용 그대로. ㄴ 지필검사보다 산출물과 수행과정을 직접 관찰을 통해 평가하려는 경향이 증가. ㄹ 이미 습득된 지식보다는 습득한 지식을 활용할 수 있는 능력에 중점.","source":{"page":20,"section":"해외의 영재판별의 경향과 시사점","quote":"지필검사보다 산출물과 수행과정을 직접 관찰을 통해 평가하려는 경향이 증가 검사에만 그치지 않고, 교육 장면에서의 태도와 능력을 관찰평가하는 경향이 증가 인지적 능력뿐 아니라 정의적 특성까지 평가의 대상으로 삼는 경향이 증가"}}]},{"lesson":28,"title":"대표적 지능검사: Wechsler 지능검사","file":"4. 교안 (1~30)/28.pdf","summary":["지능: 특정 문화 혹은 사회에서 생존하고 적응하기 위해 필요한 여러 가지 기능의 혼합물 — 지능에 포함된 특정 능력은 시간과 장소에 따라 변함","데이비드 웩슬러(1939): 지능은 목표 달성, 합리적 사고, 환경에 효과적 대처를 할 수 있는 '전반적(global)'이고 '총체적(aggregate)'인 능력 / 지능검사로 측정할 수 없는 심리학적 과정 多(기계적성, 사회성, 동기 및 태도)","지능지수(IQ): 특정한 지능검사 결과에서 도출된 개인의 지적 능력 지수, 연령 고려 표준점수 / 어떤 지능검사로 얻었는지 분명히 / 서로 다른 검사의 IQ는 내용·해석방법이 다름","지능의 정규분포: 85~115 68.2%, 70~85·115~130 각 13.6%, 55~70·130~145 각 2.1%, 양 끝 각 0.1%","지능검사의 기능: 심리진단, 치료계획, 인지능력 결함·손상 평가, 특수영역 인지능력 평가, 일반적인 지적 능력 평가","WISC-V 전체 IQ(FSIQ): 40-160, 6세 0개월~16세 11개월, 평균 100·표준편차 15, 규준표 나이 구획 4개월, 연령 간격당 사례 수 200 / 한국판 지역 6개(서울, 경기, 충청, 강원, 전라, 경상) / 원판 인구통계학적 변인 지역 4개+인종","16개 소검사(10개 기본 소검사), 소검사 평균 10, 표준편차 3 / 5개 지표: VCI 언어이해(결정지능), VSI 시공간, FRI 유동추론(유동지능), WMI 작업기억(단기기억), PSI 처리속도","주검사: 언어이해(공통성, 어휘), 시공간(토막 짜기, 퍼즐), 유동추론(행렬 추리, 무게 비교), 작업기억(숫자, 그림 기억), 처리속도(기호 쓰기, 동형 찾기) / 추가: 상식·이해, 공통 그림찾기·산수, 순차 연결, 선택","해석(프로파일 분석): 일반적 1~6단계(전체 검사지능 → 언어이해 → 시공간 → 유동추론 → 작업기억 → 처리속도 지표), 임상적 필요시 7단계 지표 강점/약점, 8단계 소검사 강점/약점, 9단계 추가 지표(비언어, 일반능력, 인지효율 등), 10단계 차이 비교","토막 짜기(BD)·공통성(SI)은 4판보다 난이도 상향 조정 / 순차 연결(LN): 숫자 오름차순, 글자 가나다순 / 산수(AR): 암산 / 퍼즐(VP): 3개의 조각 선택","대체 소검사: 공통성·어휘→상식, 이해 / 토막 짜기→퍼즐 / 행렬 추리→공통 그림 찾기 / 무게 비교→공통 그림 찾기, 산수 / 숫자→그림 기억, 순차 연결 / 기호 쓰기→동형 찾기, 선택"],"questions":[{"id":"28-01","type":"옳은 것","q":"교안에서 제시한 지능에 대한 일반적인 개념으로 옳은 것은?","box":null,"choices":["지능은 문화와 관계없이 동일한 단일 능력이다.","지능에 포함된 특정 능력은 시간과 장소에 관계없이 변하지 않는다.","지능이란 특정 문화 혹은 사회에서 생존하고 적응하기 위해 필요한 여러 가지 기능의 혼합물이다.","지능은 학업성취만을 의미한다.","지능은 유전적으로 고정되어 측정이 불가능하다."],"answer":3,"explain":"교안: 지능이란 특정 문화 혹은 사회에서 생존하고 적응하기 위해 필요한 여러 가지 기능의 혼합물이며, 지능에 포함된 특정 능력은 시간과 장소에 따라 변함. ①② 반대 서술. ④⑤ 교안에 없는 내용.","source":{"page":3,"section":"지능에 대한 일반적인 개념","quote":"특정 문화 혹은 사회에서 생존하고 적응하기 위해 필요한 여러 가지 기능의 혼합물 ▶ / ‣ 지능에 포함된 특정 능력은 시간과 장소에 따라 변함"}},{"id":"28-02","type":"빈칸","q":"다음은 미국의 심리학자 데이비드 웩슬러(1939)의 지능 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"지능은 개인이 목표를 달성하기 위해 실행할 수 있고, 합리적으로 사고할 수 있으며, 환경에 효과적으로 대처할 수 있는 '전반적(global)'이고 '(   )'인 능력","choices":["독립적(independent)","총체적(aggregate)","선천적(innate)","특수적(specific)","학문적(academic)"],"answer":2,"explain":"교안: '전반적(global)'이고 '총체적(aggregate)'인 능력. 나머지는 교안 표현과 다름.","source":{"page":4,"section":"지능에 대한 일반적인 개념","quote":"지능은 개인이 목표를 달성하기 위해 실행할 수 있고, 합리적으로 사고할 수 있으며, 환경에 효과적으로 대처할 수 있는 ‘전반적(global)’이고 ‘총체적(aggregate)’인 능력"}},{"id":"28-03","type":"옳지 않은 것","q":"지능검사의 측정 범위에 대한 교안 내용으로 옳지 않은 것은?","box":null,"choices":["대부분의 지능검사는 주로 언어능력을 측정한다.","대부분의 지능검사는 추론 능력을 측정한다.","대부분의 지능검사는 학업성취 및 학문적 지능을 측정한다.","지능검사로 측정할 수 없는 많은 심리학적 과정이 있다.","지능검사는 기계적성, 사회성, 동기 및 태도까지 정확히 측정한다."],"answer":5,"explain":"⑤ 교안은 기계적성, 사회성, 동기 및 태도 등을 '지능검사로 측정할 수 없는' 심리학적 과정의 예로 제시. ①~④는 교안 내용 그대로.","source":{"page":4,"section":"지능에 대한 일반적인 개념","quote":"대부분의 지능검사는 주로 언어능력, 추론 능력, 학업성취 및 학문적 지능을 측정함 지능검사로 측정할 수 없는 많은 심리학적 과정이 있음 / ‣ 예 : 기계적성 , 사회성 , 동기 및 태도 등"}},{"id":"28-04","type":"옳지 않은 것","q":"지능지수(IQ)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["특정한 지능검사 결과에서 도출된 개인의 지적 능력을 나타내는 지수이다.","일반적으로 연령을 고려해 표준점수로 산출된다.","IQ를 말할 때에는 항상 어떤 지능검사를 사용하여 IQ 정보를 얻었는지를 분명히 해야 한다.","서로 다른 지능검사를 통해서 산출한 IQ는 내용과 해석방법이 동일하다.","서로 다른 지능검사의 IQ는 내용과 해석방법이 서로 다를 수밖에 없다."],"answer":4,"explain":"④ 교안: 서로 다른 지능검사를 통해서 산출한 IQ는 내용과 해석방법이 서로 다를 수밖에 없음. ①②③⑤는 교안 내용 그대로.","source":{"page":5,"section":"지능지수의 개념","quote":"‣ IQ를 말할 때에는 항상 어떤 지능검사를 사용하여 IQ 정보를 얻었는지를 분명히 해야 함‣ 서로 다른 지능검사를 통해서 산출한 IQ는 내용과 해석방법이 서로 다를 수밖에 없음"}},{"id":"28-05","type":"빈칸","q":"교안의 '지능의 정규분포'에서 지능지수 85~115 구간에 해당하는 비율로 알맞은 것은?","box":null,"choices":["68.2%","13.6%","95.4%","50.0%","2.1%"],"answer":1,"explain":"교안 정규분포: 85~100, 100~115 구간을 합친 85~115가 68.2%. ② 13.6%는 70~85 또는 115~130 구간. ⑤ 2.1%는 55~70 또는 130~145 구간. ③④ 교안에 제시되지 않은 수치.","source":{"page":6,"section":"지능의 정규분포","quote":"55 70 85 100 115 130 145 0.1% 2.1% 13.6% 68.2% 13.6% 2.1% 0.1%"}},{"id":"28-06","type":"옳은 것","q":"교안의 '지능의 정규분포' 그림에 대한 설명으로 옳은 것은?","box":null,"choices":["평균은 115이다.","115~130 구간은 2.1%이다.","130~145 구간은 2.1%이다.","70~85 구간은 68.2%이다.","145 이상 구간은 13.6%이다."],"answer":3,"explain":"교안 분포: 55~70 2.1%, 70~85 13.6%, 85~115 68.2%, 115~130 13.6%, 130~145 2.1%, 양 끝 0.1%. ① 평균 100. ② 115~130은 13.6%. ④ 70~85는 13.6%. ⑤ 145 이상은 0.1%.","source":{"page":6,"section":"지능의 정규분포","quote":"55 70 85 100 115 130 145 0.1% 2.1% 13.6% 68.2% 13.6% 2.1% 0.1%"}},{"id":"28-07","type":"보기 조합","q":"교안에서 제시한 지능검사의 기능을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 심리진단\nㄴ. 치료계획\nㄷ. 인지능력 결함, 손상 평가\nㄹ. 특수영역 인지능력 평가\nㅁ. 일반적인 지적 능력 평가","choices":["ㄱ, ㄴ","ㄷ, ㄹ, ㅁ","ㄱ, ㄷ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"교안 7쪽 지능검사의 기능: 심리진단, 치료계획, 인지능력 결함·손상 평가, 특수영역 인지능력 평가, 일반적인 지적 능력 평가 → 모두 해당.","source":{"page":7,"section":"지능검사의 기능","quote":"심리진단 치료계획 / 인지능력 결함 , 손상 평가 / 특수영역 인지능력 평가 일반적인 지적 능력 평가"}},{"id":"28-08","type":"옳지 않은 것","q":"WISC-V의 전체 지능지수(FSIQ)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["점수 범위는 40-160이다.","적용 연령은 6세 0개월 - 16세 11개월이다.","표준점수는 평균 100, 표준편차 15이다.","규준표 나이 구획은 4개월이다.","연령 간격당 사례 수는 100이다."],"answer":5,"explain":"⑤ 교안: 연령 간격당 사례 수 200. ①~④는 교안 내용 그대로.","source":{"page":9,"section":"전체 지능 지수 FSIQ","quote":"40- 160 (6 세 0 개월 - 16 세 11 개월 ) 표준점수: 평균 100, 표준편차 15 / 전체 IQ / 규준표 나이 구획: 4 개월 / 연령 간격당 사례 수: 200"}},{"id":"28-09","type":"옳은 것","q":"WISC-V 전체 지능지수(FSIQ)의 표본 변인에 대한 설명으로 옳은 것은?","box":null,"choices":["한국판은 나이, 성별(남/여), 지역(4개)을 변인으로 한다.","한국판의 지역은 서울, 경기, 충청, 강원, 전라, 경상의 6개이다.","한국판은 인종(백인, 아프리카계 미국인 등)을 변인으로 포함한다.","원판의 인구통계학적 변인에는 지역(6개)이 포함된다.","원판의 인구통계학적 변인에는 성별이 포함되지 않는다."],"answer":2,"explain":"교안: 한국판 — 나이, 성별(남/여), 지역(6개) 서울, 경기, 충청, 강원, 전라, 경상. 인구통계학적 변인 — 나이, 성별(남/여), 지역(4개), 인종(백인, 아프리카계 미국인, 히스패닉, 아시아계, 기타). ① 한국판은 6개. ③ 인종은 인구통계학적 변인(원판). ④ 지역 4개. ⑤ 성별 포함.","source":{"page":9,"section":"전체 지능 지수 FSIQ","quote":"한국판: 나이, 성별 ( 남 / 여 ), 지역 (6 개 ) 서울, 경기 , 충청 , 강원 , 전라, 경상 / 인구통계학적 변인: 나이, 성별 ( 남 / 여 ), 지역 (4 개 ), 인종( 백인 , 아프리카계 미국인, 히스패닉, 아시아계 , 기타 )"}},{"id":"28-10","type":"빈칸","q":"다음은 WISC-V 소검사에 대한 설명이다. (   )에 들어갈 숫자를 순서대로 바르게 나열한 것은?","box":"(   )개 소검사((   )개 기본 소검사), 평균 (   ), 표준편차 (   )","choices":["16, 10, 100, 15","15, 10, 10, 3","16, 10, 10, 3","16, 7, 10, 3","10, 7, 100, 15"],"answer":3,"explain":"교안: 16개 소검사(10개 기본 소검사), 평균 10, 표준편차 3. ① 평균 100, 표준편차 15는 전체 IQ(FSIQ)의 표준점수. ②④⑤ 개수가 틀림.","source":{"page":10,"section":"검사의 Scaled","quote":"16개 소검사 (10개 기본 소검사), 평균 10, 표준편차 3"}},{"id":"28-11","type":"옳지 않은 것","q":"WISC-V의 지표 약자와 명칭을 연결한 것으로 옳지 않은 것은?","box":null,"choices":["VCI – 언어이해지표","VSI – 시공간지표","FRI – 유동추론지표","WMI – 처리속도지표","PSI – 처리속도지표"],"answer":4,"explain":"④ WMI는 작업기억지표. 처리속도지표는 PSI. 나머지는 교안 연결 그대로.","source":{"page":10,"section":"검사의 Scaled","quote":"VCI VSI FRI WMI PSI / 언어이해지표 • 결정지능 시공간지표 유동추론지표 • 유동지능 작업기억지표 • 단기기억 처리속도지표"}},{"id":"28-12","type":"개념 찾기","q":"교안에서 WISC-V의 지표 중 '결정지능'과 연결하여 제시한 지표는?","box":null,"choices":["언어이해지표(VCI)","시공간지표(VSI)","유동추론지표(FRI)","작업기억지표(WMI)","처리속도지표(PSI)"],"answer":1,"explain":"교안: 언어이해지표 • 결정지능, 유동추론지표 • 유동지능, 작업기억지표 • 단기기억. 시공간지표와 처리속도지표에는 별도 표기가 없음.","source":{"page":10,"section":"검사의 Scaled","quote":"언어이해지표 • 결정지능 시공간지표 유동추론지표 • 유동지능 작업기억지표 • 단기기억 처리속도지표"}},{"id":"28-13","type":"옳지 않은 것","q":"WISC-V 검사의 구조에서 지표와 주검사를 연결한 것으로 옳지 않은 것은?","box":null,"choices":["언어이해 – 공통성, 어휘","시공간 – 토막 짜기, 퍼즐","유동추론 – 행렬 추리, 무게 비교","작업기억 – 기호 쓰기, 동형 찾기","처리속도 – 기호 쓰기, 동형 찾기"],"answer":4,"explain":"④ 작업기억의 주검사는 숫자, 그림 기억. 기호 쓰기, 동형 찾기는 처리속도의 주검사. 나머지는 교안 연결 그대로.","source":{"page":11,"section":"검사의 구조","quote":"주검사 • 숫자 • 그림 기억 추가소검사 • 순차 연결 / 주검사 • 기호 쓰기 • 동형 찾기 추가소검사 • 선택"}},{"id":"28-14","type":"보기 조합","q":"WISC-V 검사의 구조에서 유동추론 지표의 '추가 소검사'에 해당하는 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 공통 그림찾기\nㄴ. 산수\nㄷ. 상식\nㄹ. 순차 연결","choices":["ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ"],"answer":5,"explain":"교안: 유동추론 — 주검사 행렬 추리, 무게 비교 / 추가 소검사 공통 그림찾기, 산수. ㄷ 상식은 언어이해 추가 소검사, ㄹ 순차 연결은 작업기억 추가 소검사.","source":{"page":11,"section":"검사의 구조","quote":"주검사 • 행렬 추리 • 무게 비교 추가소검사 • 공통 그림찾기 • 산수"}},{"id":"28-15","type":"개념 찾기","q":"WISC-V에서 처리속도 지표의 추가 소검사는?","box":null,"choices":["순차 연결","이해","선택","산수","상식"],"answer":3,"explain":"교안: 처리속도 — 주검사 기호 쓰기, 동형 찾기 / 추가 소검사 선택. ① 작업기억 추가. ②⑤ 언어이해 추가. ④ 유동추론 추가.","source":{"page":11,"section":"검사의 구조","quote":"주검사 • 기호 쓰기 • 동형 찾기 추가소검사 • 선택"}},{"id":"28-16","type":"옳지 않은 것","q":"WISC-V의 일반적인 해석(프로파일 분석) 단계에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["1단계는 전체 검사 지능이다.","2단계는 언어이해 지표이다.","6단계는 처리속도 지표이다.","7단계 지표 강점/약점부터는 임상적 필요시 실시한다.","10단계는 소검사 강점/약점이다."],"answer":5,"explain":"⑤ 교안: 10단계는 차이 비교. 소검사 강점/약점은 8단계. ①~④는 교안 내용 그대로(일반적 1~6단계, 임상적 필요시 7~10단계).","source":{"page":12,"section":"일반적인 해석","quote":"1 단계 : 전체 검사지능 / 7 단계 : 지표 강점/ 약점 8 단계 : 소검사 강점/ 약점 / 2 단계 : 언어이해 지표 / 9 단계 : 추가 지표 / … 10 단계 : 차이 비교"}},{"id":"28-17","type":"빈칸","q":"다음은 WISC-V 해석 단계 중 임상적 필요시 실시하는 단계이다. (   )에 들어갈 말로 알맞은 것은?","box":"9단계: (   ) (비언어 지표, 일반능력 지표, 인지효율 지표 등)","choices":["지표 강점/약점","추가 지표","차이 비교","소검사 강점/약점","전체 검사 지능"],"answer":2,"explain":"교안: 9단계 추가 지표(비언어 지표, 일반능력 지표, 인지효율 지표 등). ① 7단계. ③ 10단계. ④ 8단계. ⑤ 1단계.","source":{"page":12,"section":"일반적인 해석","quote":"9 단계 : 추가 지표 / ( 비언어 지표, 일반능력지표, 인지효율지표 등) 10 단계 : 차이 비교"}},{"id":"28-18","type":"개념 찾기","q":"다음 설명에 해당하는 WISC-V 소검사는?","box":"아동이 제한시간 내에 주어진 두 가지 색으로 이루어진 토막을 사용하여 제시된 모형이나 그림과 똑같은 모양을 만들어야 한다. (4판보다 난이도 상향 조정)","choices":["퍼즐(VP)","행렬 추리(MR)","무게 비교(FW)","토막 짜기(BD)","기호 쓰기(CD)"],"answer":4,"explain":"제시문은 토막 짜기(Block Design, BD) 설명. ① 퍼즐 = 완성된 퍼즐을 보고 구성할 수 있는 3개의 조각 선택. ② 행렬 추리 = 행렬이나 연속의 일부를 보고 완성하는 보기 찾기. ③ 무게 비교 = 균형을 유지할 수 있는 보기 찾기. ⑤ 기호 쓰기 = 기호표를 사용하여 모양·숫자에 상응하는 기호를 따라 그림.","source":{"page":13,"section":"소검사별 약자 및 설명","quote":"토막짜기 Block Design BD 아동이 제한시간 내에 주어진 두 가지 색으로 이루어진 토막을 사용하여 제시된 모형이나 그림과 똑같은 모양을 만들어야 한다. ( 4 판보다 난이도 상향조정)"}},{"id":"28-19","type":"보기 조합","q":"교안의 소검사별 설명에서 '4판보다 난이도 상향 조정'으로 표시된 소검사를 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 토막 짜기(BD)\nㄴ. 공통성(SI)\nㄷ. 행렬 추리(MR)\nㄹ. 숫자(DS)","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"explain":"교안 13쪽 표에서 토막 짜기와 공통성에 '(4판보다 난이도 상향 조정)'이 표시됨(PDF 확인). 행렬 추리, 숫자에는 해당 표기 없음.","source":{"page":13,"section":"소검사별 약자 및 설명","quote":"( 4 판보다 난이도 상향조정) 공통성 Similarities SI 아동이 공통적인 사물이나 개념을 나타내는 두 개의 단어를 듣고, 두 단어가 어떻게 유사한지를 말해야 한다. / ( 4 판보다 난이도 상향조정)"}},{"id":"28-20","type":"옳지 않은 것","q":"WISC-V 소검사와 그 설명을 연결한 것으로 옳지 않은 것은?","box":null,"choices":["숫자(DS) – 수열을 듣고 기억하여 숫자를 바로 따라하고, 거꾸로 따라하고, 순서대로 따라해야 한다.","어휘(VC) – 그림 문항에서는 사물의 이름을 말하고, 말하기 문항에서는 검사자가 읽어주는 단어의 뜻을 말해야 한다.","퍼즐(VP) – 제한시간 내에 완성된 퍼즐을 보고 퍼즐을 구성할 수 있는 5개의 조각을 선택해야 한다.","무게 비교(FW) – 양쪽 무게가 달라 균형이 맞지 않는 저울 그림을 보고 균형을 유지할 수 있는 보기를 찾아야 한다.","기호 쓰기(CD) – 기호표를 사용하여 간단한 기하학적 모양이나 숫자와 상응하는 기호를 따라 그려야 한다."],"answer":3,"explain":"③ 교안: 퍼즐은 퍼즐을 구성할 수 있는 '3개'의 조각을 선택. ①②④⑤는 교안 설명 그대로.","source":{"page":14,"section":"소검사별 약자 및 설명","quote":"퍼즐 Visual Puzzles VP 아동은 제한시간 내에 완성된 퍼즐을 보고 퍼즐을 구성할 수 있는 3 개의 조각을 선택해야 한다."}},{"id":"28-21","type":"개념 찾기","q":"다음 설명에 해당하는 WISC-V 소검사는?","box":"아동은 두 줄 혹은 세 줄로 이루어진 그림들을 보고 각 줄에서 공통된 특성으로 묶을 수 있는 그림들을 하나씩 골라야 한다.","choices":["그림 기억(PS)","동형 찾기(SS)","선택(CA)","상식(IN)","공통 그림 찾기(PC)"],"answer":5,"explain":"제시문은 공통 그림 찾기(Picture Concepts, PC). ① 그림 기억 = 자극 페이지를 본 후 반응 페이지에서 해당 그림을 (가능한 순서대로) 찾기. ② 동형 찾기 = 반응 부분을 훑어보고 표적 모양과 동일한 것 찾기. ③ 선택 = 무선·일렬 배열 그림을 훑어보고 표적 그림에 표시. ④ 상식 = 일반적 지식에 관한 질문에 답변.","source":{"page":15,"section":"소검사별 약자 및 설명","quote":"공통그림찾기 Picture Concepts PC 아동은 두 줄 혹은 세 줄로 이루어진 그림들을 보고 각 줄에서 공통된 특성으로 묶을 수 있는 그림들을 하나씩 골라야 한다."}},{"id":"28-22","type":"옳은 것","q":"WISC-V 소검사 중 그림 기억(PS)과 동형 찾기(SS)에 대한 설명으로 옳은 것은?","box":null,"choices":["그림 기억은 제한시간 없이 수열을 듣고 따라 말하는 검사이다.","그림 기억은 1개 이상의 그림이 있는 자극 페이지를 본 후, 반응 페이지의 보기에서 해당 그림을 (가능한 순서대로) 찾아야 한다.","동형 찾기는 일반적 지식에 관한 질문에 답변하는 검사이다.","동형 찾기의 약자는 PS이다.","그림 기억의 약자는 SS이다."],"answer":2,"explain":"교안 15쪽 그림 기억(Picture Span, PS) 설명 그대로 ②. ① 숫자(DS)에 가까운 설명. ③ 상식(IN). ④⑤ 동형 찾기 = SS, 그림 기억 = PS로 뒤바뀜.","source":{"page":15,"section":"소검사별 약자 및 설명","quote":"그림기억 Picture Span PS 아동은 제한시간 내에 1 개 이상의 그림이 있는 자극 페이지를 본 후, 반응 페이지에 있는 보기에서 해당 그림을 ( 가능한 순서대로) 찾아야 한다. 동형찾기 Symbol Search SS 아동은 제한시간 내에 반응부분을 훑어보고 표적모양과 동일한 것을 찾아야 한다."}},{"id":"28-23","type":"빈칸","q":"다음은 WISC-V 순차 연결(Letter-Number Sequencing, LN) 소검사의 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"아동은 연속되는 숫자와 글자를 듣고, 숫자가 (   )으로, 글자는 (   )으로 암기해야 한다.","choices":["내림차순, 가나다순","오름차순, 가나다순","오름차순, 역순","들은 순서, 가나다순","내림차순, 들은 순서"],"answer":2,"explain":"교안: 숫자가 오름차순으로, 글자는 가나다순으로 암기. 나머지 조합은 교안과 다름.","source":{"page":16,"section":"소검사별 약자 및 설명","quote":"순차연결 Letter- Number Sequencing LN 아동은 연속되는 숫자와 글자를 듣고, 숫자가 오름차순으로, 글자는 가나다순으로 암기해야 한다."}},{"id":"28-24","type":"사례","q":"다음은 WISC-V 검사 장면이다. 검사자가 실시하고 있는 소검사는?","box":"검사자: \"'시작하세요.'라고 하면, 동물들을 표시하세요. 동물이 아닌 다른 그림은 표시하지 마세요. 그만하라고 할 때까지 실수하지 말고 최대한 빨리 해보세요. 준비됐어요? 시작하세요.\"","choices":["이해(CO)","산수(AR)","공통 그림 찾기(PC)","선택(CA)","그림 기억(PS)"],"answer":4,"explain":"교안 16쪽 선택(Cancellation, CA)의 지시문 예시. 선택은 제한시간 내에 무선으로 배열된 그림과 일렬로 배열된 그림을 훑어보고 표적 그림에 표시해야 함. ① 이해 예시는 '사람들이 양치질을 해야 하는 이유가 무엇일까요?'. ② 산수 = 암산. ③⑤ 다른 소검사.","source":{"page":16,"section":"소검사별 약자 및 설명","quote":"아동은 제한시간 내에 무선으로 배열된 그림과 일렬로 배열된 그림을 훑어보고 표적그림에 표시해야 한다. / 선택 Cancellation CA"}},{"id":"28-25","type":"옳은 것","q":"WISC-V 소검사 중 이해(CO)와 산수(AR)에 대한 설명으로 옳은 것은?","box":null,"choices":["이해는 일반적인 원칙과 사회적 상황에 대한 이해에 근거하여 질문에 답해야 한다.","이해의 예시 문항은 '두 단어가 어떻게 유사한가요?'이다.","산수는 종이와 연필을 사용하여 계산한다.","산수는 그림 문항 없이 말하기 문항으로만 구성된다.","산수는 제한시간이 없다."],"answer":1,"explain":"교안: 이해 = 일반적인 원칙과 사회적 상황에 대한 이해에 근거하여 질문에 답함(예. 1번: 사람들이 양치질을 해야 하는 이유가 무엇일까요?). ② 공통성에 가까운 설명. ③④⑤ 산수 = 제한시간 내에 그림 문항과 말하기 문항으로 구성된 산수 문제를 암산으로 풂.","source":{"page":16,"section":"소검사별 약자 및 설명","quote":"이해 Comprehension CO 아동은 일반적인 원칙과 사회적 상황에 대한 이해에 근거하여 질문에 답해야 한다. … 산수 Arithmetic AR 아동은 제한시간 내에 그림문항과 말하기문항으로 구성된 산수문제를 암산으로 풀어야 한다."}},{"id":"28-26","type":"옳지 않은 것","q":"WISC-V의 주요 소검사별 가능한 대체 소검사를 연결한 것으로 옳지 않은 것은?","box":null,"choices":["공통성 – 상식, 이해","토막 짜기 – 퍼즐","무게 비교 – 공통 그림 찾기, 산수","숫자 – 동형 찾기, 선택","어휘 – 상식, 이해"],"answer":4,"explain":"④ 교안: 숫자의 대체 소검사는 그림 기억, 순차 연결. 동형 찾기, 선택은 기호 쓰기의 대체 소검사. 나머지는 교안 연결 그대로.","source":{"page":17,"section":"주요 소검사별 가능한 대체 소검사","quote":"숫자 그림기억, 순차 연결 기호쓰기 동형찾기, 선택"}},{"id":"28-27","type":"빈칸","q":"다음은 WISC-V 주요 소검사별 가능한 대체 소검사이다. (   )에 들어갈 말로 알맞은 것은?","box":"주요 소검사: 행렬 추리 → 가능한 대체 소검사: (   )","choices":["퍼즐","산수","순차 연결","상식","공통 그림 찾기"],"answer":5,"explain":"교안: 행렬 추리 → 공통 그림 찾기. (무게 비교 → 공통 그림 찾기, 산수) ① 퍼즐은 토막 짜기의 대체. ② 산수는 무게 비교의 대체에 포함. ③ 숫자의 대체. ④ 공통성·어휘의 대체.","source":{"page":17,"section":"주요 소검사별 가능한 대체 소검사","quote":"토막짜기 퍼즐 행렬추리 공통그림찾기 무게비교 공통그림찾기, 산수"}}]},{"lesson":29,"title":"대표적 창의력검사: TTCT","file":"4. 교안 (1~30)/29.pdf","summary":["길포드(Guilford)의 창의성: 새롭고 신기한 것을 만들어 내는 능력 / 토랜스(Torrance)의 창의성: 새롭고 독특한 아이디어, 다른 관점, 문제를 새로운 시각으로 보는 것","창의성의 요소: 유창성, 융통성, 정교성, 독창성, 성향(민감성 등)","창의력 검사도구: 형용사 체크리스트, 전경원의 유아용 창의성검사, Guilford 창의성검사도구, TTCT(Torrance Tests of Creative Thinking), 캘리포니아심리검사(CPI), 기타","TTCT: 언어검사(Verbal) A형/B형, 도형검사(Figural) A형/B형 / 요인분석 결과 언어·도형 과제 상이 → 사고의 양식이 다르기 때문(언어적 vs 시각적) → 동형검사가 아닌 비교적 독립적인 검사","활동1 그림 구성하기(곡선 모양 형태 하나), 활동2 그림 완성하기(10개의 불완전 도형), 활동3 '원'을 사용하여 그림 그리기(36개의 '원') — 각 제한시간 10분, 제목 붙이기","유의사항: 제한시간을 지키지 않으면 신뢰도·타당도 영향, 시간을 더 주면 표준화된 규준 적용 불가 / 보기를 들거나 모범반응 예시 절대 금지 → 독창성 감소, 반응 수 감소","5개 요소 능력(규준관련척도): 유창성(적절한 반응의 총수), 독창성(통계적으로 드물고 독특), 제목의 추상성(종합·조직화 사고과정), 정교성(세부 내용 상상·제시), 성급한 종결에 대한 저항","독창성 채점: 흔한 것 0점, 드문 반응 1점, 두 개 이상 도형을 하나의 이미지로 조합 시 보너스 점수","제목의 추상성 채점: 일반적 제목 0점(사람), 구체적 수준 간단한 기술적 제목 1점(큰 귀를 가진 사람), 상상적·기술적 제목 2점(아저씨의 얼어버린 귀), 추상적이지만 적절한 제목 3점(여보세요, 인생의 시간)","정교성 채점: 본질적인 세부내용(장식, 색칠, 명암, 디자인의 큰 변형 등) 추가될 때마다 각각 1점, 엄밀하게 계산할 필요 없음, 6개 단계","13개 창의적 강점(준거관련척도): 내적인 시각화, 경계의 확대 또는 파괴, 유머, 심상의 풍부함, 심상의 다채로움, 환상, 정서적 표현, 이야기의 명료성, 운동 또는 행위, 제목의 표현성, 불완전도형들의 종합, 선들의 종합, 독특한 시각화"],"questions":[{"id":"29-01","type":"옳은 것","q":"교안에서 제시한 길포드(Guilford)와 토랜스(Torrance)의 창의성에 대한 설명으로 옳은 것은?","box":null,"choices":["길포드는 창의성을 '문제를 새로운 시각으로 보는 것'으로 보았다.","토랜스는 창의성을 '새롭고 신기한 것을 만들어 내는 능력'으로만 정의하였다.","길포드는 창의성을 '새롭고 신기한 것을 만들어 내는 능력'으로 보았다.","토랜스는 창의성을 '평균 이상의 지적 능력'으로 보았다.","길포드와 토랜스는 창의성을 '과제집착력'으로 정의하였다."],"answer":3,"explain":"교안: 길포드의 창의성 = 새롭고 신기한 것을 만들어 내는 능력 / 토랜스의 창의성 = 새롭고 독특한 아이디어, 다른 관점, 문제를 새로운 시각으로 보는 것. ①② 두 학자의 내용이 뒤섞임. ④⑤ 렌줄리 세 고리 요소로 무관.","source":{"page":3,"section":"창의성의 요소","quote":"길포드(Guilford)의 창의성 … ‣ 새롭고 신기한 것을 만들어 내는 능력 / 토랜스(Torrance)의 창의성 / ‣ 새롭고 독특한 아이디어 ‣ 다른 관점 ‣ 문제를 새로운 시각으로 보는 것"}},{"id":"29-02","type":"보기 조합","q":"교안에서 제시한 창의성의 요소를 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 유창성\nㄴ. 융통성\nㄷ. 정교성\nㄹ. 독창성\nㅁ. 성향(민감성 등)","choices":["ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"explain":"교안 3쪽 창의성의 요소: 유창성, 융통성, 정교성, 독창성, 성향(민감성 등) → 모두 해당(PDF 그림 확인).","source":{"page":3,"section":"창의성의 요소","quote":"유창성 융통성 … 정교성 / 독창성 / 성향( 민감성 등)"}},{"id":"29-03","type":"옳지 않은 것","q":"교안에서 창의력 검사도구로 제시한 것이 아닌 것은?","box":null,"choices":["형용사 체크리스트","전경원의 유아용 창의성검사","Guilford 창의성검사도구","WISC-V","캘리포니아심리검사(CPI)"],"answer":4,"explain":"④ WISC-V는 웩슬러 지능검사(28차시). 교안의 창의력 검사도구: 형용사 체크리스트, 전경원의 유아용 창의성검사, Guilford 창의성검사도구, TTCT, 캘리포니아심리검사(CPI), 기타 검사도구.","source":{"page":4,"section":"창의력 검사도구","quote":"형용사 체크리스트 / 전경원의 유아용 창의성검사 Guilford 창의성검사도구 TTCT 캘리포니아심리검사(CPI) 기타검사도구"}},{"id":"29-04","type":"빈칸","q":"TTCT의 원어로 알맞은 것은?","box":"TTCT : (   )","choices":["Test of Thinking and Creative Talent","Torrance Tests of Creative Thinking","Torrance Test of Cognitive Talent","Total Test of Creative Thinking","Tests of Torrance Creative Traits"],"answer":2,"explain":"교안: TTCT : Torrance Tests of Creative Thinking. 나머지는 교안 표기와 다름.","source":{"page":4,"section":"창의력 검사도구","quote":"TTCT : Torrance Tests of Creative Thinking"}},{"id":"29-05","type":"옳지 않은 것","q":"TTCT에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["언어검사(Verbal)는 A형/B형이 있다.","도형검사(Figural)는 A형/B형이 있다.","요인분석 결과, 언어 과제와 도형 과제에서 상이하게 나왔다.","언어검사와 도형검사는 같은 능력을 측정하는 동형검사이다.","언어검사와 도형검사는 서로 상이한 영역에서의 창의력을 측정하는 비교적 독립적인 검사이다."],"answer":4,"explain":"④ 교안: 언어검사와 도형검사는 동형검사가 '아닌', 서로 상이한 영역에서의 창의력을 측정하는 비교적 독립적인 검사. ①②③⑤는 교안 내용 그대로.","source":{"page":6,"section":"TTCT란?","quote":"언어검사와 도형검사는 동형검사가 아닌, 서로 상이한 영역에서의 창의력을 측정하는 비교적 독립적인 검사"}},{"id":"29-06","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"TTCT의 요인분석 결과, 언어 과제와 도형 과제에서 상이하게 나옴\n→ (   )이 다르기 때문(언어적 vs 시각적)","choices":["검사 시간","채점 방식","사고의 양식","검사 대상 연령","문항 수"],"answer":3,"explain":"교안: 요인분석 결과 언어 과제와 도형 과제에서 상이하게 나온 것은 '사고의 양식'이 다르기 때문(언어적 vs 시각적).","source":{"page":6,"section":"TTCT란?","quote":"요인분석 결과, 언어 과제와 도형 과제에서 상이하게 나옴 / → 사고의 양식이 다르기 때문( 언어적 vs 시각적 )"}},{"id":"29-07","type":"개념 찾기","q":"다음 설명에 해당하는 TTCT 도형검사 활동은?","box":"곡선 모양의 형태 하나를 제시하고 이것이 일부가 되는 어떤 그림이나 물건을 생각해 보게 함. 아이디어를 계속 더하기 하여 재미있는 이야기의 내용이 되게 하고, 그림을 완성하면 그럴듯한 제목을 붙이게 함","choices":["활동1: 그림 구성하기","활동2: 그림 완성하기","활동3: '원'을 사용하여 그림 그리기","활동4: 선 사용하여 그림 그리기","활동5: 이야기 만들기"],"answer":1,"explain":"제시문은 활동1 그림 구성하기(제한시간 10분). ② 활동2는 10개의 불완전 도형 제시. ③ 활동3은 36개의 '원' 제시. ④⑤ 교안에 없는 활동.","source":{"page":7,"section":"활동1 : 그림 구성하기(제한시간 10분)","quote":"곡선 모양의 형태 하나를 제시하고 이것이 일부가 되는 어떤 그림이나 물건을 생각해 보게 함 아이디어를 계속 더하기 하여 재미있는 이야기의 내용이 되게 함 그림을 완성하면 그럴듯한 제목을 붙이게 함"}},{"id":"29-08","type":"빈칸","q":"다음은 TTCT 활동2: 그림 완성하기에 대한 설명이다. (   )에 들어갈 숫자로 알맞은 것은?","box":"(   )개의 불완전 도형을 제시하고 될 수 있는 대로 이야기가 완전하고, 재미있는 물건이나 그림을 그리게 함. 빈칸에다 제목을 적어 넣게 함","choices":["5","8","12","36","10"],"answer":5,"explain":"교안: 활동2 그림 완성하기는 10개의 불완전 도형 제시(제한시간 10분). ④ 36은 활동3의 '원' 개수. 나머지는 교안에 없는 수치.","source":{"page":8,"section":"활동2 : 그림 완성하기(제한시간 10분)","quote":"10 개의 불완전 도형을 제시하고 될 수 있는 대로 이야기가 완전하고, 재미있는 물건이나 그림을 그리게 함 빈칸에다 제목을 적어 넣게 함"}},{"id":"29-09","type":"옳은 것","q":"TTCT 활동3: '원'을 사용하여 그림 그리기에 대한 설명으로 옳은 것은?","box":null,"choices":["10개의 '원'을 제시한다.","곡선만 더 그려 넣을 수 있고 직선은 사용할 수 없다.","제한시간은 20분이다.","36개의 '원'을 제시하고, 직선이든 곡선이든 관계없이 선을 더 그려 넣어 어떤 물건이나 그림을 될 수 있는 대로 많이 생각해 보게 한다.","그림에 제목을 붙이지 않는다."],"answer":4,"explain":"교안: 36개의 '원'을 제시하고 원하는 대로 선을(직선이든, 곡선이든 관계없이) 더 그려 넣어 어떤 물건이나 그림을 될 수 있는 대로 많이 생각해 보게 함, 각각에 이름이나 제목을 적어 넣도록 함, 제한시간 10분. ① 36개. ② 직선·곡선 관계없음. ③ 10분. ⑤ 제목을 적어 넣음.","source":{"page":9,"section":"활동3 : ‘원’을 사용하여 그림 그리기(제한시간 10분)","quote":"36 개의 ‘원’을 제시하고 원하는 대로 선을( 직선이든 , 곡선이든 관계없이) 더 그려 넣어 어떤 물건이나 그림을 될 수 있는 대로 많이 생각해 보게 함 … 각각에 대하여 이름이나 제목을 적어 넣도록 함"}},{"id":"29-10","type":"사례","q":"다음 사례의 검사자 행동에 대한 교안 기준의 평가로 가장 적절한 것은?","box":"TTCT 도형검사를 실시하던 검사자 G는 초등학생들이 그림 그리기 능력이 부족하여 아이디어를 기록하는 데 지장이 있다고 판단하고, 각 활동의 제한시간을 5분씩 더 주었다.","choices":["학생의 특성을 배려한 바람직한 조치이다.","독창성 점수를 높이기 위해 권장되는 방법이다.","표준화된 규준을 적용할 수 없게 되므로 해서는 안 된다.","초등학생에게만 허용되는 예외 규정이다.","신뢰도는 높아지지만 타당도만 낮아진다."],"answer":3,"explain":"교안: 다른 표준화검사와 마찬가지로 제한시간을 지키지 않으면 검사 결과의 신뢰도와 타당도가 영향을 받을 수 있으며, 시간을 더 여유롭게 주면 표준화된 규준을 적용할 수 없음. ①②④ 교안과 반대. ⑤ 신뢰도와 타당도 모두 영향을 받을 수 있음.","source":{"page":10,"section":"유의사항","quote":"초등학생의 경우 그림 그리기 능력이 부족하여 아이디어를 기록하는 데 지장이 있다고 판단해 시간을 좀 더 여유롭게 주고 싶어 하는 검사자도 있을 것이나, 그렇게 하면 표준화된 규준을 적용할 수 없음"}},{"id":"29-11","type":"옳지 않은 것","q":"TTCT 실시 유의사항에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["제한시간을 지키지 않으면 검사 결과의 신뢰도와 타당도가 영향을 받을 수 있다.","보기를 들거나 모범반응을 예시하는 일은 절대로 하지 말아야 한다.","모범반응을 예시하면 독창성이 감소할 수 있다.","모범반응을 예시하면 생성해 내는 반응의 수가 줄어들기도 한다.","모범반응을 예시하면 반응의 수가 늘어나므로 저학년에게는 권장된다."],"answer":5,"explain":"⑤ 교안: 보기를 들거나 모범반응을 예시하면 독창성이 감소하고 어떤 경우는 생성해 내는 반응의 수가 줄어들기도 하므로 절대로 하지 말아야 함. ①~④는 교안 내용 그대로.","source":{"page":10,"section":"유의사항","quote":"보기를 들거나 모범반응을 예시하는 일은 절대로 하지 말아야 함 상위와 같은 이유로 독창성이 감소하고 어떤 경우는 생성해 내는 반응의 수가 줄어들기도 함"}},{"id":"29-12","type":"개념 찾기","q":"다음 설명에 해당하는 TTCT 5개 요소 능력(규준관련척도)은?","box":"통계적으로 보아 반응이 얼마나 드물게 일어나며 독특한 것인지","choices":["유창성","정교성","독창성","제목의 추상성","성급한 종결에 대한 저항"],"answer":3,"explain":"교안: 독창성 = 통계적으로 보아 반응이 얼마나 드물게 일어나며 독특한 것인지. ① 유창성 = 적절한 반응의 총수. ② 정교성 = 세부 내용을 상상하고 제시할 줄 아는 것. ④ 제목의 추상성 = 종합하고 조직화할 줄 아는 사고과정. ⑤ 성급하게 반응을 폐쇄·종결시키는 것을 지연시킬 줄 아는 능력.","source":{"page":11,"section":"5개 요소 능력 : 규준관련척도","quote":"독창성 / ‣ 통계적으로 보아 반응이 얼마나 드물게 일어나며 독특한 것인지"}},{"id":"29-13","type":"옳지 않은 것","q":"TTCT 5개 요소 능력(규준관련척도)과 그 의미를 연결한 것으로 옳지 않은 것은?","box":null,"choices":["유창성 – 적절한 반응의 총수","정교성 – 세부 내용을 상상하고 제시할 줄 아는 것","제목의 추상성 – 세부 내용을 상상하고 제시할 줄 아는 것","독창성 – 통계적으로 보아 반응이 얼마나 드물게 일어나며 독특한 것인지","성급한 종결에 대한 저항 – 성급하게 반응을 폐쇄하고 종결시키는 것을 지연시킬 줄 아는 능력"],"answer":3,"explain":"③ 제목의 추상성은 '종합하고 조직화할 줄 아는 사고과정'. 세부 내용을 상상하고 제시할 줄 아는 것은 정교성. 나머지는 교안 연결 그대로.","source":{"page":11,"section":"5개 요소 능력 : 규준관련척도","quote":"제목의 추상성 / ‣ 종합하고 조직화할 줄 아는 사고과정 정교성 / ‣ 세부 내용을 상상하고 제시할 줄 아는 것"}},{"id":"29-14","type":"빈칸","q":"다음 (   )에 들어갈 TTCT 요소 능력으로 알맞은 것은?","box":"(   ): 독창적인 아이디어를 가능하게 하는 정신적 비약을 할 수 있을 만큼 충분히 긴 시간 동안 마음을 열고 있어야 하며, 따라서 성급하게 반응을 폐쇄하고 종결시키는 것을 지연시킬 줄 아는 능력이 필요","choices":["유창성","제목의 추상성","정교성","융통성","성급한 종결에 대한 저항"],"answer":5,"explain":"교안 12쪽 '성급한 종결에 대한 저항'의 설명. ④ 융통성은 창의성의 요소(3쪽)이나 TTCT 5개 요소 능력에는 포함되지 않음. ①②③ 의미가 다름.","source":{"page":12,"section":"5개 요소 능력 : 규준관련척도","quote":"성급한 종결에 대한 저항 / ‣ 독창적인 아이디어를 가능하게 하는 정신적 비약을 할 수 있을 만큼 충분히 긴 시간 동안 마음을 열고 있어야 하며, 따라서 성급하게 반응을 폐쇄하고 종결시키는 것을 지연시킬 줄 아는 능력이 필요"}},{"id":"29-15","type":"보기 조합","q":"TTCT의 5개 요소 능력(규준관련척도)에 해당하는 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 유창성\nㄴ. 융통성\nㄷ. 제목의 추상성\nㄹ. 성급한 종결에 대한 저항\nㅁ. 유머","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄹ, ㅁ","ㄱ, ㄴ, ㄹ","ㄷ, ㄹ, ㅁ"],"answer":2,"explain":"TTCT 5개 요소 능력: 유창성, 독창성, 제목의 추상성, 정교성, 성급한 종결에 대한 저항. ㄴ 융통성은 포함되지 않음. ㅁ 유머는 13개 창의적 강점(준거관련척도).","source":{"page":11,"section":"5개 요소 능력 : 규준관련척도","quote":"유창성 / ‣ 적절한 반응의 총수 독창성 / … 제목의 추상성 / … 정교성 / ‣ 세부 내용을 상상하고 제시할 줄 아는 것"}},{"id":"29-16","type":"옳지 않은 것","q":"TTCT 독창성 채점에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["흔히 일어나는 것은 0점이다.","드물게 일어나는 기타의 반응에는 1점을 준다.","두 개 또는 그 이상의 도형을 하나의 이미지로 조합한 반응에는 보너스 점수를 준다.","흔히 일어나는 반응에도 기본 1점을 준다.","반응이 얼마나 드물게 일어나는지가 채점 기준이 된다."],"answer":4,"explain":"④ 교안: 흔히 일어나는 것은 0점. ①②③⑤는 교안 내용 그대로.","source":{"page":13,"section":"채점 예시 : 독창성","quote":"흔히 일어나는 것은 0 점 드물게 일어나는 기타의 반응에는 1 점 두 개 또는 그 이상의 도형을 하나의 이미지로 조합한 반응에 보너스 점수"}},{"id":"29-17","type":"사례","q":"TTCT 제목의 추상성 채점에서 학생이 그림에 '아저씨의 얼어버린 귀'라는 제목을 붙였다. 교안 예시에 따른 점수로 알맞은 것은?","box":null,"choices":["0점","1점","2점","3점","보너스 점수"],"answer":3,"explain":"교안: 상상적이고 기술적인 제목 2점(예: 아저씨의 얼어버린 귀). 일반적인 제목 0점(사람), 구체적 수준의 간단한 기술적 제목 1점(큰 귀를 가진 사람), 추상적이지만 적절한 제목 3점(여보세요, 인생의 시간). ⑤ 보너스 점수는 독창성 채점.","source":{"page":14,"section":"채점 예시 : 제목의 추상성","quote":"상상적이고 기술적인 제목 2 점 / ‣ 예 : 아저씨의 얼어버린 귀"}},{"id":"29-18","type":"옳은 것","q":"TTCT 제목의 추상성 채점 예시에 대한 설명으로 옳은 것은?","box":null,"choices":["'사람'은 구체적 수준의 간단한 기술적 제목으로 1점이다.","'큰 귀를 가진 사람'은 일반적인 제목으로 0점이다.","'여보세요, 인생의 시간'은 추상적이지만 적절한 제목으로 3점이다.","'아저씨의 얼어버린 귀'는 추상적이지만 적절한 제목으로 3점이다.","제목의 추상성 최고 점수는 2점이다."],"answer":3,"explain":"교안: 추상적이지만 적절한 제목 3점(여보세요, 인생의 시간). ① '사람'은 일반적인 제목 0점. ② '큰 귀를 가진 사람'은 1점. ④ 2점(상상적이고 기술적인 제목). ⑤ 최고 3점.","source":{"page":14,"section":"채점 예시 : 제목의 추상성","quote":"일반적인 제목 0 점 / ‣ 예 : 사람 구체적 수준의 간단한 기술적 제목 1 점 / ‣ 예 : 큰 귀를 가진 사람 … 추상적이지만 적절한 제목 3 점 / ‣ 예 : 여보세요 , 인생의 시간"}},{"id":"29-19","type":"옳지 않은 것","q":"TTCT 정교성 채점에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["원래의 자극 도형 경계선에 그림을 그리고 주변 공간에 적절한 세부적인 내용을 추가시킬 때마다 각각의 내용에 대하여 점수를 준다.","장식, 색칠, 명암, 디자인의 큰 변형 등이 해당한다.","본질적인 세부내용이 추가될 때마다 각각 1점씩 부여한다.","점수는 한 점의 오차도 없이 엄밀하게 계산해야 한다.","6개 단계가 있다."],"answer":4,"explain":"④ 교안: 엄밀하게 계산할 필요는 없음. ①②③⑤는 교안 내용 그대로.","source":{"page":15,"section":"채점 예시 : 정교성","quote":"본질적인 세부내용이 추가될 때마다 각각 1 점씩 부여 엄밀하게 계산할 필요는 없음 / 6 개 단계가 있음"}},{"id":"29-20","type":"옳지 않은 것","q":"TTCT의 13개 창의적 강점(준거관련척도)에 해당하지 않는 것은?","box":null,"choices":["내적인 시각화","경계의 확대 또는 파괴","유창성","심상의 다채로움","제목의 표현성"],"answer":3,"explain":"③ 유창성은 5개 요소 능력(규준관련척도). 13개 창의적 강점: 내적인 시각화, 경계의 확대 또는 파괴, 유머, 심상의 풍부함, 심상의 다채로움, 환상, 정서적 표현, 이야기의 명료성, 운동 또는 행위, 제목의 표현성, 불완전도형들의 종합, 선들의 종합, 독특한 시각화.","source":{"page":16,"section":"13개 창의적 강점 : 준거관련척도","quote":"내적인 시각화 경계의 확대 또는 파괴 유머 심상의 풍부함 심상의 다채로움 환상 / 정서적 표현 이야기의 명료성 운동 또는 행위 제목의 표현성 불완전도형들의 종합 선들의 종합 독특한 시각화"}},{"id":"29-21","type":"옳은 것","q":"TTCT의 척도 구분에 대한 설명으로 옳은 것은?","box":null,"choices":["5개 요소 능력은 준거관련척도이다.","13개 창의적 강점은 규준관련척도이다.","유머와 환상은 5개 요소 능력에 속한다.","5개 요소 능력은 규준관련척도이고, 13개 창의적 강점은 준거관련척도이다.","정교성은 13개 창의적 강점에 속한다."],"answer":4,"explain":"교안: 5개 요소 능력 = 규준관련척도, 13개 창의적 강점 = 준거관련척도. ①② 뒤바뀜. ③ 유머·환상은 13개 창의적 강점. ⑤ 정교성은 5개 요소 능력.","source":{"page":16,"section":"13개 창의적 강점 : 준거관련척도","quote":"13개 창의적 강점 : 준거관련척도"}},{"id":"29-22","type":"보기 조합","q":"TTCT 채점예시(13개 창의적 강점)로 교안에 제시된 항목을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 정서적 표현\nㄴ. 이야기의 명료성\nㄷ. 운동 또는 행위\nㄹ. 학습전이 능력","choices":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":2,"explain":"교안 17~18쪽 채점예시: 성급한 종결에 대한 저항·정서적 표현, 이야기의 명료성·운동 또는 행위. ㄹ 학습전이 능력은 영재의 인지적 특징(25차시)으로 TTCT 척도가 아님.","source":{"page":18,"section":"채점 예시","quote":"이야기의 명료성 운동 또는 행위 / 출처: 토란스창의력한국FPSP, “검사요강 TORRANCE TTCT(도형)”"}},{"id":"29-23","type":"옳은 것","q":"교안의 TTCT 채점예시 자료에 대한 설명으로 옳은 것은?","box":null,"choices":["출처는 토란스창의력한국FPSP, \"검사요강 TORRANCE TTCT(도형)\"이다.","출처는 한국교육개발원 영재교육센터이다.","채점예시는 언어검사(Verbal) 자료만 제시하였다.","'경계의 확대 또는 파괴'와 '유머'는 5개 요소 능력의 채점예시이다.","'심상의 풍부함'과 '심상의 다채로움'은 규준관련척도이다."],"answer":1,"explain":"교안 17~22쪽 채점예시 출처: 토란스창의력한국FPSP, \"검사요강 TORRANCE TTCT(도형)\". ② 출처 다름. ③ 도형 검사요강. ④⑤ 해당 항목은 13개 창의적 강점(준거관련척도).","source":{"page":21,"section":"채점 예시","quote":"경계의 확대 또는 파괴 유머 / 출처: 토란스창의력한국FPSP, “검사요강 TORRANCE TTCT(도형)”"}},{"id":"29-24","type":"개념 찾기","q":"교안 채점예시에서 '독특한 시각화'와 함께 제시된 13개 창의적 강점 항목은?","box":null,"choices":["유창성","독창성","제목의 추상성","정교성","내적인 시각화"],"answer":5,"explain":"교안 20쪽 채점예시: 독특한 시각화, 내적인 시각화. ①~④는 5개 요소 능력(규준관련척도). 그 외 채점예시: 불완전도형들의 종합·원들의 종합(19쪽), 심상의 풍부함·심상의 다채로움(22쪽).","source":{"page":20,"section":"채점 예시","quote":"독특한 시각화 내적인 시각화"}}]},{"lesson":30,"title":"영재교육기관의 최신 선발방식","file":"4. 교안 (1~30)/30.pdf","summary":["영재교육진흥법 제5조(영재교육대상자의 선정): 1. 일반 지능, 2. 특수 학문 적성, 3. 창의적 사고능력, 4. 예술적 재능, 5. 신체적 재능, 6. 그 밖의 특별한 재능 / 저소득층 자녀, 사회적 취약지역 거주자 등을 위해 별도의 선발절차 마련 가능","제6조 영재학교 지정·설립(국가, 고등학교 과정 이하) / 제7조 영재학급 설치·운영(국가나 지방자치단체, 교과영역 전부 또는 일부) / 제8조 영재교육원 설치·운영(시·도교육청, 대학, 국공립 연구소, 정부출연기관, 과학·기술·예술·체육 등 관련 공익법인)","제5차 영재교육진흥종합계획(2023~2027): 숨은 인재 성장과 지원 체계를 구축 — 현재 1회의 선발로 판별 한계 → 선교육·후선발을 통해 '교육 중심'의 영재교육으로 실질적 패러다임 전환, 일반학교 학생에게 심화 교육 기회 제공","시행령 개정(교육부 보도자료, 2023. 12. 5): 학교밖 청소년은 '소속학교의 장이나 지도교사의 추천서' 대신 '영재교육기관의 장이 정하는 서류' 첨부 가능 / 학급당 학생수 20명 이하 → 원격 '선교육·후선발' 운영 시 예외적으로 20명 초과 허용","경기도교육청(2023. 11. 30): 그동안 추첨 방식 → 선교육·후선발, 온라인 1∼2월 과제·활동 중심 선교육 수료 → 선발 → 3월 정규과정 / 고양, 김포, 부천, 이천, 파주 5개 교육지원청 우선 적용, 2025년 전 지역 확대","원격 형태 선교육 후선발: 교육과정 일부 온라인 교육 → 태도·행동 및 산출물 평가로 선발 → 나머지 교육과정, 수료자 선정, 이수증 발급 / 한국과학기술원(KAIST) 소속 12개 사이버영재교육원(대구, 대전, 광주, 울산, 세종, 충북, 충남, 전북, 전남, 경북, 경남, 제주)","서울과학고: 1단계 관찰소견서 A, B·자기소개서·학교생활기록부II → 2단계 영재성 및 사고력 검사, 창의력·문제해결력 검사 → 3단계 과학영재 캠프","한국과학영재학교: 1단계 학생기록물평가 → 2단계 창의적문제해결력평가 → 3단계 영재성다면평가(글로벌 과학자로서의 자질 및 잠재성, 정원 120명의 80% 내외 선발)","시도교육청 영재교육원: 교육청 예산 지원, 한국교육개발원(KEDI) 연구지원 / 대학부설 과학영재교육원: 과학기술부 → 한국과학창의재단 예산 지원","GED(https://ged.kedi.re.kr): 영재지원(학생)·영재추천(교사)·추천심사(학교)·선발심사(기관)·선발현황(교육청) / 선발 = 지원-추천-심사-선발의 교사추천선발 / 한국과학창의재단 https://kofac.re.kr, 대학부설과학영재교육원 공동홈페이지 https://seit.kr","서울시교육청: 교육지원청·단위학교 직속기관 영재교육원·대학부설 영재교육원 9월~4월, 영재학급 2월~4월 / 영재학급과 예술분야 단위학교 영재교육원은 GED 활용 여부 자율선택","선발 단계: 안내 → 공고 → 자기추천 → 학교추천(체크리스트 2종, 점수로 반영) → 창의적 문제해결력 및 면접 평가(응시자 전원 면접, 미응시자 불합격) → 최종 합격자 발표(점수 합산, 학교별 인원 제한)","유의사항: 원서 접수일 1개월 전 공고, 추가 모집 7일 전 공고, 소외계층 정원의 20%까지 우선 선발, 협력학교 소속 학생 선발인원의 20% 이내, 1곳의 영재교육기관만 등록 가능 / 학교추천위원회 4인 내외(위원장 교감)"],"questions":[{"id":"30-01","type":"옳지 않은 것","q":"「영재교육진흥법」 제5조에 따라 영재교육기관의 장이 영재교육대상자를 선발할 때 고려하는 사항으로 옳지 않은 것은?","box":null,"choices":["정서적 안정성","특수 학문 적성","창의적 사고능력","예술적 재능","신체적 재능"],"answer":1,"explain":"제5조는 1. 일반 지능, 2. 특수 학문 적성, 3. 창의적 사고능력, 4. 예술적 재능, 5. 신체적 재능, 6. 그 밖의 특별한 재능 중 어느 하나에 뛰어나거나 잠재력이 우수한 사람을 선발하도록 한다. '정서적 안정성'은 교안에 제시된 선발 사항이 아니다. ②③④⑤는 모두 제5조에 명시된 사항이다.","source":{"page":3,"section":"영재교육진흥법 제5조(영재교육대상자의 선정)","quote":"1. 일반 지능, 2. 특수 학문 적성, 3. 창의적 사고능력, 4. 예술적 재능, 5. 신체적 재능, 6. 그 밖의 특별한 재능"}},{"id":"30-02","type":"빈칸","q":"다음은 「영재교육진흥법」 제5조의 일부이다. (   )에 들어갈 말로 알맞은 것은?","box":"영재교육기관의 장은 제1항에 따른 영재교육대상자를 선발할 때 저소득층 자녀, 사회적 취약지역 거주자 등 사회적·경제적 이유로 잠재력이 충분히 발현되지 못한 영재를 선발하기 위하여 (   )를 마련하는 등의 조치를 할 수 있다.","choices":["우선 입학 정원","별도의 선발절차","특별 장학 제도","전용 영재학급","추첨 선발제도"],"answer":2,"explain":"교안 원문은 '별도의 선발절차를 마련하는 등의 조치를 할 수 있다'이다. 사회적·경제적 이유로 잠재력이 충분히 발현되지 못한 영재를 위한 조치이다. ①③④⑤는 교안에 없는 표현이다.","source":{"page":3,"section":"영재교육진흥법 제5조(영재교육대상자의 선정)","quote":"사회적 · 경제적 이유로 잠재력이 충분히 발현되지 못한 영재를 선발하기 위하여 별도의 선발절차를 마련하는 등의 조치를 할 수 있다"}},{"id":"30-03","type":"옳은 것","q":"「영재교육진흥법」 제6조와 제7조에 대한 설명으로 옳은 것은?","box":null,"choices":["제6조에 따라 지방자치단체는 대학 과정의 학교를 영재학교로 지정할 수 있다.","제7조는 영재교육원의 설치·운영에 관한 조항이다.","영재학급은 교과영역의 전부에 대해서만 설치·운영할 수 있다.","국가나 지방자치단체는 고등학교 과정 이하의 각급 학교에 영재학급을 설치·운영할 수 있다.","제6조는 영재교육대상자의 선정에 관한 조항이다."],"answer":4,"explain":"제7조(영재학급의 설치·운영): 국가나 지방자치단체는 고등학교 과정 이하의 각급 학교에 교과영역의 전부 또는 일부에 대하여 영재학급을 설치·운영할 수 있다. ① 제6조의 주체는 '국가', 대상은 '고등학교 과정 이하'의 각급 학교 ② 제7조는 영재학급, 영재교육원은 제8조 ③ '전부 또는 일부' ⑤ 제6조는 영재학교의 지정·설립과 운영, 영재교육대상자의 선정은 제5조.","source":{"page":4,"section":"영재교육진흥법 제6조·제7조","quote":"제7조 (영재학급의 설치· 운영) 국가나 지방자치단체는 영재교육을 실시하기 위하여 고등학교 과정 이하의 각급 학교에 교과영역의 전부 또는 일부에 대하여 영재학급을 설치· 운영할 수 있다."}},{"id":"30-04","type":"옳지 않은 것","q":"「영재교육진흥법」 제8조에 따라 영재교육원을 설치·운영할 수 있는 주체로 옳지 않은 것은?","box":null,"choices":["시·도교육청","대학","국공립 연구소","정부출연기관","민간 사교육 업체"],"answer":5,"explain":"제8조 ①: 시·도교육청, 대학, 국공립 연구소, 정부출연기관 및 과학·기술·예술·체육 등과 관련 있는 공익법인은 영재교육원을 설치·운영할 수 있다. 민간 사교육 업체는 교안에 제시된 주체가 아니다.","source":{"page":5,"section":"영재교육진흥법 제8조(영재교육원의 설치·운영)","quote":"시· 도교육청, 대학, 국공립 연구소, 정부출연기관 및 과학 · 기술 · 예술 · 체육 등과 관련 있는 공익법인은 영재교육원을 설치· 운영할 수 있다."}},{"id":"30-05","type":"보기 조합","q":"제5차 영재교육진흥종합계획의 '숨은 인재 성장과 지원 체계를 구축'에 대한 설명으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 제5차 영재교육진흥종합계획의 기간은 2023~2027년이다.\nㄴ. 현재는 1회의 선발을 통해 영재교육 대상자의 재능과 잠재력에 대한 판별에 한계가 있다.\nㄷ. 앞으로는 선교육·후선발을 통해 '교육 중심'의 영재교육으로 실질적 패러다임 전환을 꾀한다.\nㄹ. 앞으로는 영재교육기관 재학생에게만 심화 교육 기회를 집중 제공한다.","choices":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"ㄱ·ㄴ·ㄷ은 교안 그대로이다. ㄹ: 교안은 '일반학교 학생에게 자신의 재능을 기르고 관심 분야의 인재로 성장할 수 있도록 심화 교육 기회 제공'이다(현재는 일반학교 학생 대상의 다양한 심화 교육 기회 부족).","source":{"page":6,"section":"제5차 영재교육진흥종합계획(2023~2027)","quote":"선교육 · 후선발을 통해 ‘교육 중심’의 영재교육으로 실질적 패러다임 전환 • 일반학교 학생에게 자신의 재능을 기르고 관심 분야의 인재로 성장할 수 있도록 심화 교육 기회 제공"}},{"id":"30-06","type":"빈칸","q":"다음은 『영재교육진흥법 시행령』 일부개정령안(2023)에 관한 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"소속학교가 없는 학교밖 청소년이 영재교육을 받기 위하여 영재교육기관에 제출하는 선정신청서에 '소속학교의 장이나 지도교사의 추천서' 대신 '(   )'를 첨부할 수 있도록 하여 영재교육을 받을 수 있는 기회가 확대되었다.","choices":["학부모 동의서","영재교육기관의 장이 정하는 서류","교육감이 정하는 서류","거주지 주민센터 확인서","검정고시 합격증명서"],"answer":2,"explain":"개정으로 학교밖 청소년은 추천서 대신 '영재교육기관의 장이 정하는 서류'를 첨부할 수 있게 되었다. ①③④⑤는 교안에 없는 서류이다.","source":{"page":7,"section":"제5차 영재교육진흥종합계획 - 학교밖 청소년의 영재교육 기회 확대","quote":"‘소속학교의 장이나 지도교사의 추천서‘ 대신 ‘영재교육기관의 장이 정하는 서류‘를 첨부할 수 있도록 하여 영재교육을 받을 수 있는 기회가 확대되었다."}},{"id":"30-07","type":"옳지 않은 것","q":"『영재교육진흥법 시행령』 일부개정령안(교육부 보도자료, 2023. 12. 5)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["『영재교육진흥법 시행령』 일부개정령안이 국무회의를 통과하였다.","소속학교가 없는 학교밖 청소년의 영재교육 기회가 확대되었다.","영재학교, 영재학급, 영재교육원의 '학급당 학생수'는 20명 이하로 정해져 있다.","영재학급 또는 영재교육원에서 원격으로 '선교육·후선발 교육과정'을 운영하는 경우 예외적으로 20명을 초과할 수 있다.","영재학교에서 대면으로 정규 교육과정을 운영하는 경우에도 학급당 20명을 초과할 수 있게 되었다."],"answer":5,"explain":"20명 초과 예외는 '영재학급 또는 영재교육원에서 원격으로 선교육·후선발 교육과정을 운영하는 경우'에만 허용되었다. 영재학교의 대면 정규 교육과정에 대한 예외는 교안에 없다. ①~④는 교안 내용과 일치한다.","source":{"page":7,"section":"『영재교육진흥법 시행령』 일부개정령안","quote":"20명 이하로 정해진 영재교육기관(영재학교, 영재학급, 영재교육원)의 ‘학급당 학생수‘를 영재학급 또는 영재교육원에서 원격으로 ‘선교육·후선발 교육과정’을 운영하는 경우 예외적으로 20명을 초과할 수 있도록 허용하였다."}},{"id":"30-08","type":"옳은 것","q":"'학교밖 청소년에 영재교육 기회 넓힌다…시행령 개정'(연합뉴스, 2023. 12. 5) 기사 내용으로 옳은 것은?","box":null,"choices":["교육부는 5일 국무회의에서 '영재교육진흥법 시행령' 일부 개정령안이 심의·의결됐다고 밝혔다.","개정 시행령의 핵심은 영재교육대상자 선정 시 교육감 추천서 제출을 의무화한 것이다.","'선교육 후 학생선발' 영재학교의 학급당 학생 수 상한을 15명으로 낮추었다.","개정 시행령은 학교밖 청소년의 영재교육원 지원을 제한하는 내용이다.","개정 시행령은 경기도교육청이 2023년 11월 30일 발표하였다."],"answer":1,"explain":"기사는 교육부가 5일 국무회의에서 시행령 일부 개정령안이 심의·의결됐다고 밝혔다고 전한다. ② 핵심은 '영재교육기관의 장이 정하는 서류'를 첨부할 수 있도록 한 것 ③ 학급당 학생 20명 초과 허용 ④ 학교밖 청소년의 영재교육 기회 확대 ⑤ 2023. 11. 30 경기도교육청 기사는 선교육·후선발 영재 프로그램 확대에 관한 것이다.","source":{"page":8,"section":"원격 형태의 선교육 후선발 교육과정 (연합뉴스, 2023. 12. 5)","quote":"교육부는 5일 국무회의에서 이러한 내용을 담은 '영재교육진흥법 시행령' 일부 개정령안이 심의·의결됐다고 밝혔다."}},{"id":"30-09","type":"옳은 것","q":"경기도교육청의 '선교육·후선발' 영재 프로그램 확대(연합뉴스, 2023. 11. 30)에 대한 설명으로 옳은 것은?","box":null,"choices":["다음 해부터 경기도 전 지역에 동시에 적용된다.","선교육 프로그램은 주로 오프라인으로 7~8월에 진행된다.","선교육 프로그램을 수료한 뒤 선발과정을 거쳐 3월 시작되는 영재교육 정규과정에 참여하게 된다.","그동안 교육지원청 부설 영재교육원은 지필시험 방식으로 대상자를 선발하였다.","영재교육원 재학 경험이 있는 학생만 신청할 수 있다."],"answer":3,"explain":"주로 온라인에서 1∼2월 진행되는 과제·활동 중심 선교육 프로그램을 수료한 뒤 선발과정을 거쳐 3월 시작되는 정규과정에 참여한다. ① 내년 1월 5개 교육지원청 우선 적용, 2025년 전 지역 확대 ② 주로 온라인, 1∼2월 ④ 그동안은 학생 모집 후 추첨 방식 ⑤ 영재교육을 희망하는 학생 누구나 신청 가능.","source":{"page":9,"section":"'선교육·후선발' 경기교육청, 영재 프로그램 확대","quote":"주로 온라인에서 1∼2월 진행되는 과제·활동 중심 선교육 프로그램을 수료한 뒤 선발과정을 거쳐 3월 시작되는 영재교육 정규과정에 참여하게 된다."}},{"id":"30-10","type":"빈칸","q":"다음은 경기도교육청의 선교육·후선발 방식 적용 계획이다. (   )에 들어갈 말로 알맞게 짝지은 것은?","box":"선교육·후선발 방식은 내년 1월 고양, 김포, 부천, 이천, 파주 등 ( ㉠ )개 교육지원청에 우선 적용되며 ( ㉡ )년에는 전 지역으로 확대된다.","choices":["㉠ 3, ㉡ 2025","㉠ 5, ㉡ 2025","㉠ 5, ㉡ 2026","㉠ 7, ㉡ 2025","㉠ 10, ㉡ 2027"],"answer":2,"explain":"고양, 김포, 부천, 이천, 파주 등 5개 교육지원청에 우선 적용되고 2025년에는 전 지역으로 확대된다. 나머지 숫자·연도는 교안과 다르다.","source":{"page":9,"section":"'선교육·후선발' 경기교육청, 영재 프로그램 확대","quote":"선교육·후선발 방식은 내년 1월 고양, 김포, 부천, 이천, 파주 등 5개 교육지원청에 우선 적용되며 2025년에는 전 지역으로 확대된다."}},{"id":"30-11","type":"개념 찾기","q":"다음 설명에 해당하는 것은?","box":"영재교육 받기를 희망하는 사람을 대상으로 교육과정 일부를 온라인으로 교육한 후, 학생의 태도·행동 및 산출물 평가 등으로 영재교육대상자를 선발하고 나머지 교육과정 운영, 수료자 선정 및 이수증을 발급하는 프로그램",
