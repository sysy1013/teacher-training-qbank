한 일반적인 우려사항","quote":"학교 적응 문제 ‣ 어린 시절 경험의 부재가 우려 ‣ 학업적 부담은 우울, 반항, 스트레스 유발 ‣ 일부 부모는 자녀의 준비 정도와 관계없이 조기입학시키려 함"}},{"id":"42-02","type":"빈칸","q":"초등학교 조기입학을 위한 기준 중 다음 (   )에 들어갈 말로 알맞은 것은?","box":"지적 우수성: (   ) 이상의 지능지수","choices":["110","120","125","130","140"],"answer":4,"explain":"교안: 지적 우수성은 130 이상의 지능지수이다. 나머지 수치는 교안과 다르다.","source":{"page":4,"section":"조기입학제 - 초등학교 조기입학을 위한 기준","quote":"지적 우수성: 130 이상의 지능지수"}},{"id":"42-03","type":"옳지 않은 것","q":"초등학교 조기입학을 위한 기준으로 옳지 않은 것은?","box":null,"choices":["눈-손 협응 능력","높은 독해력과 산수 추리력","적절한 사회, 정서적 적응력","또래보다 뛰어난 신체 발달과 체력","가족들의 적극적인 지원"],"answer":4,"explain":"초등학교 조기입학 기준은 지적 우수성(130 이상의 지능지수), 눈-손 협응 능력, 높은 독해력과 산수 추리력, 적절한 사회·정서적 적응력, 학교와 교사들의 조기입학에 대한 우호적 자세, 가족들의 적극적인 지원이다. ④ 신체 발달과 체력은 기준에 없다.","source":{"page":4,"section":"조기입학제 - 초등학교 조기입학을 위한 기준","quote":"눈 - 손 협응 능력 ‣ 높은 독해력과 산수 추리력 ‣ 적절한 사회, 정서적 적응력 ‣ 학교와 교사들의 조기입학에 대한 우호적 자세 ‣ 가족들의 적극적인 지원"}},{"id":"42-04","type":"옳은 것","q":"중·고등학교 조기입학을 위한 기준에 대한 설명으로 옳은 것은?","box":null,"choices":["영재들은 학과가 통합된 초등학교 저학년에서 공부하기를 희망한다.","기존 교우관계가 그대로 유지되므로 속진에 적절한 시기이다.","여러 초·중학교 출신 영재들이 새로운 학교에서 만나 새로운 교우관계가 형성되므로 속진에 적절한 시기이다.","영재학교 지원은 중3만 가능하다.","영재들은 학습내용이 단순한 하급 학년에서 공부하기를 희망한다."],"answer":3,"explain":"교안: 여러 초·중학교 출신 영재들이 새로운 학교에서 만나 새로운 교우관계가 형성되므로 속진에 적절한 시기. ①⑤ 영재들은 학습내용이 구체화되고 학과가 세분화되는 중·고등학교 상급 학년에서 공부하기를 희망, ② 새로운 교우관계 형성, ④ 영재학교 지원은 중1~중3이다.","source":{"page":5,"section":"조기입학제 - 중·고등학교 조기입학을 위한 기준","quote":"여러 초·중학교 출신 영재들이 새로운 학교에서 만나 새로운 교우관계가 형성되므로 속진에 적절한 시기임 / 영재학교 지원(중1~중3)"}},{"id":"42-05","type":"빈칸","q":"중·고등학교 조기입학을 위한 기준에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재들은 학습내용이 (   )되고 학과가 세분화되는 중·고등학교 상급 학년에서 공부하기를 희망함","choices":["구체화","단순화","통합화","추상화","일반화"],"answer":1,"explain":"교안: '학습내용이 구체화되고 학과가 세분화되는 중·고등학교 상급 학년에서 공부하기를 희망함'. 나머지는 교안 표현이 아니다.","source":{"page":5,"section":"조기입학제 - 중·고등학교 조기입학을 위한 기준","quote":"영재들은 학습내용이 구체화되고 학과가 세분화되는 중·고등학교 상급 학년에서 공부하기를 희망함"}},{"id":"42-06","type":"옳지 않은 것","q":"학년 월반에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["현재 학년에서 상급학년으로 건너뛰는 것으로 학습을 속진시키는 전통적인 방법이다.","특별한 자료나 시설을 필요로 하지 않는다.","비용 측면에서도 매우 효과적이다.","반드시 한 학년만을 월반하여야 한다.","대부분의 학교는 학년 월반을 부정적으로 생각하는 경우도 많다."],"answer":4,"explain":"교안: 월반은 반드시 한 학년만을 월반할 필요는 없으며, 학생에 따라 2~3학년을 월반하기도 한다. 따라서 ④가 틀렸다.","source":{"page":6,"section":"학년 월반","quote":"월반은 반드시 한 학년만을 월반할 필요는 없으며, 학생에 따라 2~3학년을 월반하기도 함"}},{"id":"42-07","type":"빈칸","q":"학년 월반에 대한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"월반은 특별한 자료나 시설을 필요로 하지 않으며 (   ) 측면에서도 매우 효과적","choices":["비용","사회성","정서","학업성취","교우관계"],"answer":1,"explain":"교안: '월반은 특별한 자료나 시설을 필요로 하지 않으며 비용 측면에서도 매우 효과적'. 나머지는 교안 문장과 다르다.","source":{"page":6,"section":"학년 월반","quote":"월반은 특별한 자료나 시설을 필요로 하지 않으며 비용 측면에서도 매우 효과적"}},{"id":"42-08","type":"사례","q":"다음 사례의 학생에게 교안에 따라 적용하기에 가장 적절한 속진 방법은?","box":"초등학생 A는 같은 학년의 학생들보다 전 과목에서 1~2년 정도 앞서가고, 학교에서 심하게 지루함을 느낀다. 학습 수준이 낮은 또래 아이들과 교류가 힘들며, 나이가 많은 학생들과 같은 학급에 배치되기를 원한다. 자신보다 나이가 많은 정신적 동료들과 편안함을 느끼고, 사회적·정서적 문제를 거의 보이지 않는다.","choices":["과목 월반","학년 월반","시험을 통한 학점부여","고교-대학의 이중등록","조기입학"],"answer":2,"explain":"사례는 교안의 학년 월반 가능 조건(1~2년 정도 앞서감, 심한 지루함, 또래와 교류 어려움, 나이 많은 학생들과 같은 학급 배치 희망, 정신적 동료와 편안함, 사회적·정서적 문제 거의 없음)과 그대로 일치한다. ① 과목 월반은 특정 과목만 상급생과 학습하는 부분적 속진으로 한 분야에 특별한 능력을 가진 학생에게 적합(사례는 전 과목에서 앞섬), ③ 시험을 통한 학점부여와 ④ 고교-대학의 이중등록은 학점 취득 제도, ⑤ 조기입학은 학교 입학 시기를 앞당기는 것이다.","source":{"page":7,"section":"학년 월반","quote":"같은 학년의 학생들보다 1~2년 정도 앞서가고, 학교에서 심하게 지루함을 느끼며, 학습 수준이 낮은 또래 아이들과 교류가 힘들 때 가능"}},{"id":"42-09","type":"옳지 않은 것","q":"교안에서 학년 월반이 가능한 경우로 제시한 것으로 옳지 않은 것은?","box":null,"choices":["같은 학년의 학생들보다 1~2년 정도 앞서가는 경우","학교에서 심하게 지루함을 느끼는 경우","나이가 많은 학생들과 같은 학급에 배치되는 것을 원하는 경우","자신보다 나이가 많은 정신적 동료들과 편안함을 느끼는 경우","사회적·정서적 문제를 자주 보이는 경우"],"answer":5,"explain":"교안은 '사회적·정서적 문제를 거의 보이지 않는 경우에 학년 월반 가능'이라고 제시한다. 따라서 ⑤는 반대 서술이다.","source":{"page":7,"section":"학년 월반","quote":"나이가 많은 학생들과 같은 학급에 배치되는 것을 원하고, 자신보다 나이가 많은 정신적 동료들과 편안함을 느끼며, 사회적·정서적 문제를 거의 보이지 않는 경우에 학년 월반 가능"}},{"id":"42-10","type":"옳은 것","q":"선행연구에서 나타난 월반된 영재학생들의 특성으로 옳은 것은?","box":null,"choices":["월반된 영재학생들의 학업 동기는 매우 높은 것으로 나타났다.","월반된 학생들은 학업에서 심한 지루함을 느낀다.","속진되지 않은 영재학생들은 쉬운 학습활동에서 도전감을 느낀다.","월반된 학생들은 도전감을 잃고 학업 동기가 낮아진다.","월반 여부는 영재학생의 학업 동기와 관련이 없다."],"answer":1,"explain":"교안: 월반된 영재학생들의 학업동기는 매우 높게 나타남. ② 월반된 학생들은 도전감을 가지고 지루함을 별로 느끼지 않음, ③ 속진되지 않은 영재학생들은 너무 쉬운 학습활동에 쉽게 지루함을 보임, ④⑤ 교안 내용과 반대이다.","source":{"page":8,"section":"학년 월반","quote":"여러 선행연구에서 나타나듯이, 월반된 영재학생들의 학업동기는 매우 높은 것으로 나타남"}},{"id":"42-11","type":"빈칸","q":"월반된 아동에 대한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"학교가 그들의 능력을 인정하고 관심을 가지기 때문에 월반된 아동들의 (   )은 높아지고, 어려운 과제를 부여받더라도 해결하려고 노력함","choices":["불안감","자존감","경쟁심","의존성","우월감"],"answer":2,"explain":"교안: 학교가 능력을 인정하고 관심을 가지기 때문에 월반된 아동들의 자존감은 높아진다. 나머지는 교안에 없는 표현이다.","source":{"page":9,"section":"학년 월반","quote":"학교가 그들의 능력을 인정하고 관심을 가지기 때문에 월반된 아동들의 자존감은 높아지고, 어려운 과제를 부여받더라도 해결하려고 노력함"}},{"id":"42-12","type":"옳은 것","q":"월반된 아동들의 특성에 대한 설명으로 옳은 것은?","box":null,"choices":["어려운 과제를 부여받으면 해결을 회피한다.","좀 더 낮은 수준의 과제를 원한다.","상급학교 진학에 대한 관심이 낮다.","좀 더 높은 수준의 과제를 원하고 치열하게 고등학교나 대학에 진학하기를 희망한다.","학교의 관심으로 인해 자존감이 낮아진다."],"answer":4,"explain":"교안: 월반된 아동들은 좀 더 높은 수준의 과제를 원하고 치열하게 고등학교나 대학에 진학하기를 희망한다. ① 어려운 과제도 해결하려고 노력, ② 높은 수준의 과제 원함, ③ 진학 희망, ⑤ 자존감이 높아진다.","source":{"page":9,"section":"학년 월반","quote":"좀 더 높은 수준의 과제를 원하고 치열하게 고등학교나 대학에 진학하기를 희망함"}},{"id":"42-13","type":"개념 찾기","q":"다음 설명에 해당하는 속진 방법은?","box":"특정 과목만을 상급생들과 학습하는 것으로, 학생이 특별히 잘하는 분야는 상급학년에 가서 참여하고 나머지 과목은 자신과 같은 학년에서 공부하는 것이다. 한 분야에 특별한 능력을 가진 학생들에게 적합하다.","choices":["학년 월반","압축프로그램","과목 월반","조기입학","고교-대학의 이중등록"],"answer":3,"explain":"제시문은 과목 월반의 정의이다. ① 학년 월반은 상급학년으로 건너뛰는 전체적 속진, ② 압축프로그램은 교육과정을 짧은 기간으로 압축, ⑤ 이중등록은 고등학생이 대학 교과목을 수강하는 제도이다.","source":{"page":10,"section":"과목 월반","quote":"특정 과목만을 상급생들과 학습하는 것 학생이 특별히 잘하는 분야는 상급학년에 가서 참여하고, 나머지 과목은 자신과 같은 학년에서 공부하는 것으로 한 분야에 특별한 능력을 가진 학생들에게 적합함"}},{"id":"42-14","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"과목 월반이란 학년 월반의 ( ㄱ ) 속진과 비교하여 ( ㄴ ) 속진이라 할 수 있음","choices":["ㄱ: 부분적, ㄴ: 전체적","ㄱ: 단기적, ㄴ: 장기적","ㄱ: 수평적, ㄴ: 수직적","ㄱ: 개별적, ㄴ: 집단적","ㄱ: 전체적, ㄴ: 부분적"],"answer":5,"explain":"교안: 과목 월반이란 학년 월반의 전체적 속진과 비교하여 부분적 속진이라 할 수 있다. ①은 반대로 바뀌었고 나머지는 교안에 없는 표현이다.","source":{"page":10,"section":"과목 월반","quote":"과목 월반이란 학년 월반의 전체적 속진과 비교하여 부분적 속진이라 할 수 있음"}},{"id":"42-15","type":"옳지 않은 것","q":"압축프로그램에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["자신의 학년에 해당하는 교과를 충분히 이해할 수 있는 능력을 가진 영재학생이 대상이다.","중학교 3년 과정의 수학 혹은 과학 교육과정을 1~2년 과정으로 압축한다.","고등학교 과정을 3년에서 2년으로 압축하기도 한다.","고등학교 과정을 1년으로 압축하여 공부하고 남은 2년은 창의적 연구활동에 집중하기도 한다.","과학고등학교는 3년 동안 배울 교육과정을 1년에 마칠 수 있도록 압축해서 운영한다."],"answer":5,"explain":"교안: 과학고등학교는 3년 동안 배울 교육과정을 2년에 마칠 수 있도록 압축해서 운영하여 조기졸업한다. 따라서 ⑤의 '1년'이 틀렸다.","source":{"page":11,"section":"압축프로그램","quote":"과학고등학교는 3 년 동안 배울 교육과정을 2 년에 마칠 수 있도록 압축해서 운영하여 조기졸업"}},{"id":"42-16","type":"빈칸","q":"압축프로그램에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"중학교 3년 과정의 수학 혹은 과학 교육과정을 ( ㄱ ) 과정으로 압축","choices":["ㄱ: 6개월","ㄱ: 1~2년","ㄱ: 2~3년","ㄱ: 1학기","ㄱ: 2년 6개월"],"answer":2,"explain":"교안: 중학교 3년 과정의 수학 혹은 과학 교육과정을 1~2년 과정으로 압축한다. 고등학교 과정은 3년에서 2년 또는 1년으로 압축한다.","source":{"page":11,"section":"압축프로그램","quote":"중학교 3 년 과정의 수학 혹은 과학 교육과정을 1~2년 과정으로 압축"}},{"id":"42-17","type":"옳은 것","q":"미국의 '시험을 통한 학점부여'에 대한 설명으로 옳은 것은?","box":null,"choices":["모든 과목에서 평균 성적이 우수한 학생만 대상이다.","수업에 일정 시간 이상 참여해야 시험에 응시할 수 있다.","언어 혹은 수학 등 특정 과목에 탁월한 능력을 가지고 있다고 판단될 경우, 수업 참여 없이 시험만으로도 학점을 얻을 수 있다.","교사가 학생의 학습목표를 설정해 집단적으로 학습을 진행한다.","이미 잘 알고 있는 학습내용을 반복하여 숙달시키는 데 목적이 있다."],"answer":3,"explain":"③은 교안 서술 그대로이다. ①② 특정 과목에 탁월하면 수업 참여 없이 시험만으로 학점 취득, ④ 우수한 학생들이 스스로 학습목표를 설정해 개별적으로 학습, ⑤ 이미 잘 알고 있는 학습내용의 반복에서 오는 지루함을 방지한다.","source":{"page":13,"section":"시험을 통한 학점부여","quote":"미국에서는 언어 혹은 수학 등 특정 과목에 탁월한 능력을 가지고 있다고 판단될 경우, 수업 참여 없이 시험만으로도 학점을 얻을 수 있음"}},{"id":"42-18","type":"빈칸","q":"미국 대학학점 취득시험 CLEP에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"수학, 영작문, 영문학, 경영학, 컴퓨터과학, 간호학, 교육학, 심리학, 외국어 등 (   )개 영역의 과목에서 가능","choices":["10","20","30","40","50"],"answer":3,"explain":"교안: CLEP은 수학, 영작문 등 30개 영역의 과목에서 가능하다. 나머지 수치는 교안과 다르다.","source":{"page":14,"section":"미국 대학학점 취득시험 CLEP","quote":"수학, 영작문, 영문학, 경영학, 컴퓨터과학, 간호학, 교육학, 심리학, 외국어 등 30개 영역의 과목에서 가능"}},{"id":"42-19","type":"개념 찾기","q":"다음 설명에 해당하는 것은?","box":"· College Level Examination Program\n· 강의를 수강하지 않고도 대학 학점을 이수하는 것","choices":["AP","KSA","CLEP","대학과목이수제","이중등록"],"answer":3,"explain":"College Level Examination Program은 CLEP(미국 대학학점 취득시험)이다. ① AP는 Advanced Placement(대학학점선이수) 프로그램, ② KSA는 고교-대학 이중등록 예시(KSA-KAIST)에 나오는 학교, ④ 2007년 발표된 우리나라 계획이다. ⑤ 이중등록은 고등학생이 일정 교과목을 대학에서 수강하는 제도이다.","source":{"page":14,"section":"미국 대학학점 취득시험 CLEP","quote":"College Level Examination Program: CLEP ‣ 강의를 수강하지 않고도 대학 학점을 이수하는 것"}},{"id":"42-20","type":"옳은 것","q":"우리나라의 '시험을 통한 학점부여'에 대한 설명으로 옳은 것은?","box":null,"choices":["고등학생 중 외국어 능력이 탁월한 경우 대학 학점을 미리 받는 제도이다.","대학생 중 외국어 능력이 탁월한 경우 교양영어나 교양외국어 과목을 수강하지 않고 학기 초에 실시되는 특별시험을 통해 학점을 받는 제도이다.","대학생 중 수학 능력이 탁월한 경우 전공과목을 면제받는 제도이다.","학기 말에 실시되는 특별시험을 통해 전공 학점을 받는 제도이다.","외국어 과목을 수강한 후 재시험을 통해 성적을 올리는 제도이다."],"answer":2,"explain":"교안: 대학생 중에서 외국어 능력이 탁월한 경우 교양영어나 교양외국어 과목을 수강하지 않고 학기 초에 실시되는 특별시험을 통해 학점을 받는 제도. ① 고등학생이 아니라 대학생, ③ 수학·전공과목이 아니라 외국어·교양과목, ④ 학기 말이 아니라 학기 초, ⑤ 수강하지 않고 시험으로 학점을 받는다.","source":{"page":15,"section":"시험을 통한 학점부여 - 우리나라의 경우","quote":"대학생 중에서 외국어 능력이 탁월한 경우 교양영어나 교양외국어 과목을 수강하지 않고 학기 초에 실시되는 특별시험을 통해 학점을 받는 제도"}},{"id":"42-21","type":"개념 찾기","q":"다음 설명에 해당하는 속진 방법은?","box":"고등학교 학생들이 대학교 과정을 이수할 수 있는 제도로 고등학교 학생이 일정 교과목을 대학에서 수강할 수 있도록 허용하는 것으로 다른 대학에서도 학점을 인정함 (예: KSA - KAIST)","choices":["고교-대학의 이중등록","과목 월반","압축프로그램","시험을 통한 학점부여","조기입학"],"answer":1,"explain":"제시문은 고교-대학의 이중등록에 대한 설명이며, 교안은 KSA-KAIST를 예로 든다. ② 과목 월반은 특정 과목만 상급생과 학습, ③ 교육과정 기간 압축, ④ 수업 참여 없이 시험으로 학점 취득, ⑤ 상급학교에 일찍 입학하는 것이다.","source":{"page":16,"section":"고교-대학의 이중등록","quote":"고등학교 학생들이 대학교 과정을 이수할 수 있는 제도로 고등학교 학생이 일정 교과목을 대학에서 수강할 수 있도록 허용하는 것으로 다른 대학에서도 학점을 인정함 / ‣ KSA - KAIST"}},{"id":"42-22","type":"옳은 것","q":"고교-대학의 이중등록과 관련된 영재교육진흥법 시행령 규정에 대한 설명으로 옳은 것은?","box":null,"choices":["관련 조항은 영재교육진흥법 시행령 제25조이다.","대학 등의 장은 영재교육과정을 이수한 학생이 동일계열로 진학하는 경우 학칙이 정하는 바에 따라 학점으로 인정할 수 있다.","대학 등의 장은 해당 학점을 반드시 인정하여야 한다.","영재교육과정 이수 학생이 다른 계열로 진학하는 경우에만 학점을 인정한다.","학점 인정 범위는 교육부장관이 정하는 바에 따른다."],"answer":2,"explain":"교안의 영재교육진흥법 시행령 제35조의 2: 대학 등의 장은 영재교육과정을 이수한 학생이 동일계열로 진학하는 경우 학칙이 정하는 바에 따라 학점으로 인정할 수 있다. ① 제35조의 2, ③ '인정할 수 있다'(재량), ④ 동일계열, ⑤ 학칙이 정하는 바에 따른다.","source":{"page":17,"section":"영재교육진흥법 시행령 - 고교-대학의 이중등록","quote":"제35 조의 2 ... 대학 등의 장은 영재교육과정을 이수한 학생이 동일계열로 진학하는 경우 학칙이 정하는 바에 따라 영재교육기관에서 이수한 대학교육과정에 상당하는 교과목을 해당 학교에서 취득한 학점으로 인정할 수 있다."}},{"id":"42-23","type":"빈칸","q":"고등교육법 제23조(학점의 인정 등)의 다음 (   )에 들어갈 말로 알맞은 것은?","box":"학교는 학생이 다음 각 호의 어느 하나에 해당하는 경우(해당 학교에 입학하기 전의 경우를 포함한다.)에 대통령령으로 정하는 범위 안에서 (   )으로 정하는 바에 따라 이를 해당 학교에서 취득한 학점으로 인정할 수 있다.","choices":["교육부령","학칙","조례","시행규칙","교육과정"],"answer":2,"explain":"교안의 고등교육법 제23조: '대통령령으로 정하는 범위 안에서 학칙으로 정하는 바에 따라' 학점으로 인정할 수 있다. 나머지는 교안 조문과 다르다.","source":{"page":17,"section":"영재교육진흥법 시행령 - 고교-대학의 이중등록 (고등교육법)","quote":"대통령령으로 정하는 범위 안에서 학칙으로 정하는 바에 따라 이를 해당 학교에서 취득한 학점으로 인정할 수 있다."}},{"id":"42-24","type":"빈칸","q":"AP 프로그램에 대한 다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재학생들은 AP 프로그램을 통해 대학교 재학기간을 (   ) 단축할 수 있음","choices":["6개월 이상","1학기 이상","1년 이상","2년 이상","3년 이상"],"answer":3,"explain":"교안: 영재학생들은 AP 프로그램을 통해 대학교 재학기간을 1년 이상 단축할 수 있다.","source":{"page":18,"section":"고교-대학의 이중등록","quote":"영재학생들은 AP 프로그램을 통해 대학교 재학기간을 / 1 년 이상 단축할 수 있음"}},{"id":"42-25","type":"옳지 않은 것","q":"AP(Advanced Placement) 프로그램에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["'대학학점선이수' 프로그램으로, 미국의 많은 고등학교에서 대학 수준으로 수업한다.","정부가 제시하는 AP 프로그램의 규정을 따르고, 정해진 교수자료와 교수방법과 평가방식으로 진행한다.","고교와 대학 교육 간 학습의 연계성을 제고하고, 수월성을 추구하는 프로그램이다.","높은 수준의 수업과 많은 양의 과제를 요구하기 때문에 학생들이 힘들어하기도 한다.","AP 프로그램에 대한 학점인정시험은 매년 11월 말에 대학에서 실시된다."],"answer":5,"explain":"교안: AP 프로그램에 대한 학점인정시험은 매년 5월 초에 고등학교에서 실시된다. 따라서 ⑤가 틀렸다.","source":{"page":19,"section":"고교-대학의 이중등록","quote":"AP 프로그램에 대한 학점인정시험이 매년 5 월 초에 고등학교에서 실시"}},{"id":"42-26","type":"개념 찾기","q":"교안에서 '우리나라에서 국제적인 AP 프로그램이 가장 많은 고등학교'로 제시한 학교는?","box":null,"choices":["민족사관고등학교","한국과학영재학교","서울과학고등학교","인천과학예술영재학교","대원외국어고등학교"],"answer":1,"explain":"교안: 우리나라에서 국제적인 AP 프로그램이 가장 많은 고등학교는 민족사관고등학교이다.","source":{"page":19,"section":"고교-대학의 이중등록","quote":"우리나라에서 국제적인 AP 프로그램이 가장 많은 고등학교는 민족사관고등학교"}},{"id":"42-27","type":"옳은 것","q":"우리나라의 대학과목이수제(AP) 현황에 대한 설명으로 옳은 것은?","box":null,"choices":["2017년에 대학과목이수제 추진계획이 발표되었다.","현재 활성화되어 대학 입시에 적극 반영되고 있다.","대부분의 대학에서 AP를 학점으로 인정하고 있다.","모든 일반 고등학교에서 전면 시행되고 있다.","AP 과정의 결과를 입시에 적용하는 것은 입시과열, 사교육을 불러올 우려가 있다."],"answer":5,"explain":"교안: AP 과정의 결과를 입시에 적용하는 것은 입시과열, 사교육을 불러올 우려가 있다. ① 2007년 발표, ② 아직도 활성화되지 않은 상황, ③ 대학에서 AP를 인정하고 있지 않음, ④ 과학영재학교의 전문교과 교육과정과 연계되어 부분적으로 시행 중이다.","source":{"page":20,"section":"고교-대학의 이중등록","quote":"AP 과정의 결과를 입시에 적용하는 것은 입시과열, 사교육을 불러올 우려가 있어, 현재는 과학영재학교의 전문교과 교육과정과 연계되어 부분적으로 시행 중이나, 대학에서 AP를 인정하고 있지 않음"}},{"id":"42-28","type":"보기 조합","q":"속진학습에 대한 설명으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 학년 월반은 특별한 자료나 시설을 필요로 하지 않는다.\nㄴ. 과목 월반은 한 분야에 특별한 능력을 가진 학생들에게 적합하다.\nㄷ. 우리나라는 2007년에 대학과목이수제 추진계획이 발표되었다.\nㄹ. 우리나라 대학은 현재 AP를 학점으로 인정하고 있다.","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ(학년 월반), ㄴ(과목 월반), ㄷ(2007년 대학과목이수제 추진계획)은 교안과 일치한다. ㄹ 교안은 현재 '대학에서 AP를 인정하고 있지 않음'이라고 제시한다.","source":{"page":20,"section":"고교-대학의 이중등록","quote":"우리나라는 2007년에 대학과목이수제 추진계획이 발표되었으나, 아직도 활성화되지 않는 상황임"}}]},{"lesson":43,"title":"영재교육에서 심화학습이란?","file":"4. 교안 (31~60)[1] (1)/43.pdf","summary":["심화학습(enrichment): 더 풍부하고 다양한 교육적 경험들에 노출시킴, 일반학급보다 더 넓고 깊게 가르침, 다양한 수업모형과 매체 활용, 학습내용의 수준을 상향적으로 발전시킨 프로그램","필요성: 단순 반복학습에 지루해함 / 이미 습득한 지식 적용해 창의적 문제해결 도출 / 상급학년으로 보내거나 학점 획득이 아닌, 표준학년 수준을 넘어서는 추가적인 교육경험 필요","정규교육과정만으로는 잠재력을 충분히 발휘할 수 없음 → 심도 있고 폭넓은 학습기회 제공, 창의적 사고 및 고차원적 사고기술 발달","특징: 영재가 스스로 학습 주제 선택·방향 설정 / 학습의 속도와 난이도 스스로 조절 / 창의성과 문제해결력 신장에 초점","사례: 한국과학영재학교 창의·연구활동, 서울과학고등학교 과제연구(스스로 문제 설정, 대학 및 연구소 연구과정 직접 참여), 서울대 과학영재교육원 심화과정(중1~2, 연간 100시간 이상)","심화학습 목표: 찾아보기 어려운 학습경험·높은 학습의욕, 학습내용의 복잡성·일반화 적용, 다양한 학습과 진로 노출, 개인 및 팀별 심층연구, 긍정적 자아개념, 교육적·사회적·심리적 욕구 부응, 고차원적 사고기술, 학습 극대화 및 지루함과 좌절감 최소화","캐플란 교수전략 6가지: ① 책무성 ② 호기심(올바른 질문) ③ 인내심과 기다림(이해·존중) ④ 위험 감수 태도(실수 걱정 않도록 격려) ⑤ 지식에 대한 열망(학습능력에 직접 영향) ⑥ 반성적 사고 혹은 숙고","렌줄리(코네티컷대학교 석좌교수 조지프 렌줄리): 심화·속진 모두 중요, 무슨 내용보다 어떻게 가르치느냐가 더 중요 → 핵심은 교수법","렌줄리: 심화·속진의 틀에 얽매여 정해진 내용만 가르치고 창의적 사고력·문제해결능력을 강조하지 않으면 창의·생산적 영재를 키울 수 없음"],"questions":[{"id":"43-01","type":"빈칸","q":"다음은 심화학습(enrichment)의 개념이다. (   )에 들어갈 말로 알맞은 것은?","box":"더 풍부하고 다양한 교육적 경험들에 노출시킴\n일반학급보다 더 (   ) 가르침","choices":["빠르고 앞서","넓고 깊게","반복하여 정확하게","상위 학년 내용으로","개별화하여 단순하게"],"answer":2,"explain":"교안은 심화학습을 '일반학급보다 더 넓고 깊게 가르침'으로 정의한다. ①④ 앞서 나가거나 상위 학년 내용을 가르치는 것은 선행·속진의 성격 / ③⑤ 교안에 없는 표현.","source":{"page":3,"section":"심화학습(enrichment)이란 무엇인가?","quote":"더 풍부하고 다양한 교육적 경험들에 노출시킴 일반학급보다 더 넓고 깊게 가르침"}},{"id":"43-02","type":"옳지 않은 것","q":"심화학습(enrichment)의 개념에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["더 풍부하고 다양한 교육적 경험들에 노출시킨다.","학습내용에 대하여 다양한 수업모형과 매체를 활용한다.","학습활동에 대한 제시방식을 풍부하게 사용한 학습 프로그램으로 구성된다.","학습내용의 수준을 상향적으로 발전시킨 프로그램으로 구성된다.","상급학년의 교육과정을 미리 이수시켜 조기 진급시키는 프로그램으로 구성된다."],"answer":5,"explain":"⑤ 상급학년 교육과정 조기 이수·진급은 심화학습의 개념이 아님. 교안은 오히려 '상급학년으로 보내거나, 학점 획득이 아닌' 추가적 교육경험이 필요하다고 함. ①~④는 교안의 심화학습 개념 그대로.","source":{"page":3,"section":"심화학습(enrichment)이란 무엇인가?","quote":"학습활동에 대한 제시방식을 풍부하게 사용한 학습 프로그램 또는 학습내용의 수준을 상향적으로 발전시킨 프로그램으로 구성됨"}},{"id":"43-03","type":"보기 조합","q":"영재에게 심화학습이 필요한 이유로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 심화활동이 없는 단순한 내용 중심의 반복 학습활동에 대해 지루해하거나 불만을 가짐\nㄴ. 이미 습득한 지식을 적용하여 새로운 생각이나 창의적 문제해결 방안 등을 도출해 낼 수 있음\nㄷ. 상급학년으로 보내거나 학점을 획득하게 하는 교육경험을 제공할 필요성이 제기됨\nㄹ. 표준학년 수준의 활동을 넘어서는 추가적인 교육경험을 제공할 필요성이 제기됨","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ·ㄴ·ㄹ은 교안 내용 그대로. ㄷ 교안은 '상급학년으로 보내거나, 학점 획득이 아닌' 표준학년 수준을 넘어서는 추가적 교육경험이 필요하다고 함 → 반대 서술.","source":{"page":4,"section":"영재에게 심화학습이 왜 필요한가?","quote":"상급학년으로 보내거나, 학점 획득이 아닌 표준학년 수준의 활동을 넘어서는 추가적인 교육 경험을 제공할 필요성이 제기됨"}},{"id":"43-04","type":"옳은 것","q":"영재에게 심화학습이 필요한 이유에 대한 설명으로 옳은 것은?","box":null,"choices":["일반학생들에 비해 학습능력이 뛰어나고 탐구욕구가 강하기 때문에, 정규교육과정만으로는 그들의 잠재력을 충분히 발휘할 수 없다.","영재는 학습능력은 일반학생과 비슷하지만 탐구욕구가 강하기 때문이다.","정규 교육과정에서 다룬 내용을 반복 숙달시키는 것이 심화학습의 주된 기회이다.","심화학습은 창의적 사고보다 기초 기능의 숙달을 발달시키는 데 도움을 준다.","학부모가 심화학습 프로그램을 제공함으로써 영재의 잠재능력을 향상시킬 수 있다."],"answer":1,"explain":"① 교안 그대로. ② 교안은 '학습능력이 뛰어나고' 탐구욕구가 강하다고 함 / ③ 정규 교육과정에서 다루지 못하는 심도 있고 폭넓은 학습기회 제공 / ④ 창의적 사고 및 고차원적 사고기술 발달에 도움 / ⑤ 교안은 '교사'가 심화학습 프로그램을 제공함으로써 잠재능력 향상.","source":{"page":5,"section":"영재에게 심화학습이 왜 필요한가?","quote":"일반 학생들에 비해 학습능력이 뛰어나고 탐구욕구가 강하기 때문에, 정규교육과정만으로는 그들의 잠재력을 충분히 발휘할 수 없음"}},{"id":"43-05","type":"빈칸","q":"영재를 위한 심화학습의 특징에 관한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"일반 학생들에 비해 학습 속도가 빠르기 때문에, 심화학습은 영재의 수준에 맞게 이루어져야 하며, 영재 스스로 학습의 (   )을/를 조절할 수 있는 기회를 제공해야 함","choices":["주제와 방향","시간과 장소","속도와 난이도","분량과 평가","목표와 동기"],"answer":3,"explain":"교안: '영재 스스로 학습의 속도와 난이도를 조절할 수 있는 기회'. ① 주제와 방향은 '지적 호기심이 많고 특정 분야 관심이 많기 때문에' 스스로 선택·설정하는 것(별도 특징) / ②④⑤ 교안에 없음.","source":{"page":6,"section":"영재를 위한 심화학습의 특징","quote":"심화학습은 영재의 수준에 맞게 이루어져야 하며, 영재 스스로 학습의 속도와 난이도를 조절할 수 있는 기회를 제공해야 함"}},{"id":"43-06","type":"옳지 않은 것","q":"영재를 위한 심화학습의 특징에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재는 지적 호기심이 많고 특정 분야에 대한 관심이 많다.","영재는 특정 분야에 관심이 많으므로 교사가 학습의 주제와 방향을 정해 주어야 한다.","심화학습은 영재의 수준에 맞게 이루어져야 한다.","심화학습은 영재의 창의성과 문제해결력을 신장시키는 데 초점을 맞춘다.","스스로 문제를 탐구하고 해결책을 모색할 수 있는 기회를 제공해야 한다."],"answer":2,"explain":"② 교안은 '영재가 스스로 학습의 주제를 선택하고, 학습의 방향을 설정할 수 있는 기회를 제공해야 함'이라고 함 → 교사가 정해 주는 것이 아님. 나머지는 교안 내용.","source":{"page":6,"section":"영재를 위한 심화학습의 특징","quote":"영재가 스스로 학습의 주제를 선택하고, 학습의 방향을 설정할 수 있는 기회를 제공해야 함"}},{"id":"43-07","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재는 창의적이고, 문제를 해결하는 능력이 뛰어나며, 심화학습은 영재의 (   )을 신장시키는 데 초점을 맞추어 스스로 문제를 탐구하고, 해결책을 모색할 수 있는 기회를 제공해야 함","choices":["기초학력과 성적","사회성과 협동심","암기력과 이해력","자기효능감과 학습동기","창의성과 문제해결력"],"answer":5,"explain":"교안: '심화학습은 영재의 창의성과 문제해결력을 신장시키는 데 초점'. 나머지는 해당 문장에 없는 표현.","source":{"page":7,"section":"영재를 위한 심화학습의 특징","quote":"심화학습은 영재의 창의성과 문제해결력을 신장시키는 데 초점을 맞추어 스스로 문제를 탐구하고, 해결책을 모색할 수 있는 기회를 제공해야 함"}},{"id":"43-08","type":"옳은 것","q":"교안에서 심화학습의 사례로 제시한 기관과 활동(과정)의 연결로 옳은 것은?","box":null,"choices":["한국과학영재학교 – 과제연구","서울과학고등학교 – 창의·연구활동","한국과학영재학교 – 창의·연구활동","서울대학교 과학영재교육원 – 과제연구","서울과학고등학교 – Super Saturday"],"answer":3,"explain":"교안 사례: 한국과학영재학교 창의·연구활동, 서울과학고등학교 과제연구, 서울대학교 과학영재교육원 교육과정(심화과정). ①② 학교가 서로 바뀜 / ④ 서울대 과학영재교육원은 교육과정(심화과정) / ⑤ Super Saturday는 퍼듀대학교 프로그램.","source":{"page":8,"section":"한국과학영재학교 창의·연구활동","quote":"한국과학영재학교 창의·연구활동 / 출처: 한국과학영재학교 홈페이지"}},{"id":"43-09","type":"개념 찾기","q":"다음 설명에 해당하는 심화학습 사례는?","box":"· 자연현상의 관찰을 통해 스스로 문제를 설정하고 탐구활동을 통해 문제를 해결하는 능력을 함양\n· 대학 및 연구소의 연구과정에 직접 참여하여 연구능력을 신장하고 진로를 탐색","choices":["서울과학고등학교 과제연구","서울대학교 과학영재교육원 심화과정","한국과학영재학교 창의·연구활동","퍼듀대학교 Super Saturday","미국영재학회 NAGC 여름방학캠프"],"answer":1,"explain":"제시문은 교안의 '서울과학고등학교 과제연구' 설명. ② 서울대 심화과정은 중1~2, 연간 100시간 이상, 체계적 이론지식 습득 등 / ④⑤는 다른 차시의 해외 프로그램.","source":{"page":9,"section":"서울과학고등학교 과제연구","quote":"자연현상의 관찰을 통해 스스로 문제를 설정하고 탐구활동을 통해 문제를 해결하는 능력을 함양 대학 및 연구소의 연구과정에 직접 참여하여 연구능력을 신장하고 진로를 탐색"}},{"id":"43-10","type":"옳지 않은 것","q":"서울대학교 과학영재교육원 교육과정 중 심화과정에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["대상은 중1~2이다.","수업시간은 연간 80시간 이상이다.","체계적 이론지식 습득 및 활용을 목표로 한다.","자기주도적 학습태도 및 창의적 문제발견 역량 강화를 목표로 한다.","통합·융합적 사고력 고취와 타인을 배려하는 인성 함양을 목표로 한다."],"answer":2,"explain":"② 심화과정 수업시간은 '연간 100시간 이상'. 연간 80시간 이상은 사사과정(중2~3). 나머지는 교안 그대로.","source":{"page":10,"section":"서울대학교 과학영재교육원 교육과정","quote":"심화과정(중1~2) ‣ 수업시간 : 연간 100시간 이상 ‣ 체계적 이론지식 습득 및 활용"}},{"id":"43-11","type":"보기 조합","q":"심화학습의 목표로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 일반 학생들을 위한 교육과정에서는 찾아보기 어려운 학습경험의 제공과 높은 학습의욕 고취\nㄴ. 학습내용의 단순화, 반복 연습 강조\nㄷ. 다양한 학습과 진로에 대한 노출\nㄹ. 영재학생이 선택한 내용을 포함한 개인 및 팀별 심층연구","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"ㄱ·ㄷ·ㄹ은 교안 그대로. ㄴ 교안은 '학습내용의 복잡성, 일반화 적용 강조' → 단순화·반복은 반대 서술.","source":{"page":12,"section":"심화학습의 목표","quote":"학습내용의 복잡성, 일반화 적용 강조 다양한 학습과 진로에 대한 노출 영재학생이 선택한 내용을 포함한 개인 및 팀별 심층연구"}},{"id":"43-12","type":"옳지 않은 것","q":"심화학습의 목표에 해당하지 않는 것은?","box":null,"choices":["영재학생의 긍정적 자아개념 발달을 도움","교육적·사회적·심리적 욕구에 대한 부응","고차원적 사고기술 개발","학습 진도의 최대한 단축과 조기 진급","학습의 극대화 및 지루함과 좌절감의 최소화"],"answer":4,"explain":"④ 진도 단축·조기 진급은 교안의 심화학습 목표에 없음(속진 성격). ①②③⑤는 교안의 심화학습 목표.","source":{"page":13,"section":"심화학습의 목표","quote":"영재학생의 긍정적 자아개념 발달을 돕는 교육적·사회적·심리적 욕구에 대한 부응 고차원적 사고기술 개발 학습의 극대화 및 지루함과 좌절감의 최소화"}},{"id":"43-13","type":"개념 찾기","q":"캐플란의 심화학습 교수전략 중 다음 설명에 해당하는 것은?","box":"교사는 학생에 대한 학습, 성취, 생활에 대한 책임을 져야 함","choices":["호기심","인내심과 기다림","위험 감수 태도","반성적 사고 혹은 숙고","책무성"],"answer":5,"explain":"첫째 '책무성'. ① 호기심: 올바른 질문을 통해 가르침 / ② 인내심과 기다림: 학생을 잘 이해하고 존중 / ③ 위험 감수 태도: 실수를 걱정하지 않도록 격려 / ④ 여섯째 전략(요점, 노력해야 할 것 성찰).","source":{"page":14,"section":"캐플란의 심화학습 교수전략","quote":"첫째, 책무성으로 교사는 학생에 대한 학습, 성취, 생활에 대한 책임을 져야 함"}},{"id":"43-14","type":"사례","q":"다음 사례의 교사에게 적용된 캐플란의 심화학습 교수전략은?","box":"역사 수업에서 김 교사는 학생들에게 \"이런 판단의 배경은 무엇일까?\", \"다른 의도를 가진 사람은 누구일까?\", \"더 좋은 방법은 없었을까?\"와 같은 올바른 질문을 던지며 수업을 이끌었다.","choices":["책무성","호기심","위험 감수 태도","지식에 대한 열망","인내심과 기다림"],"answer":2,"explain":"둘째 '호기심': 교사는 올바른 질문을 통하여 학생들을 가르쳐야 함(예시 질문 그대로). ④ 지식에 대한 열망의 예시는 '대통령 선거에서 무슨 일이 발생했지?' 등 / ⑤ 인내심과 기다림의 예시는 '미국 남북전쟁 이전의 북부와 남부…' 등.","source":{"page":14,"section":"캐플란의 심화학습 교수전략","quote":"둘째, 호기심으로 교사는 올바른 질문을 통하여 학생들을 가르쳐야 함 ‣ 이런 판단의 배경은 무엇일까? ‣ 다른 의도를 가진 사람은 누구일까?"}},{"id":"43-15","type":"빈칸","q":"캐플란의 심화학습 교수전략에 관한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"넷째, (   )(으)로, 교사는 학생들이 실수하거나 틀리는 것에 대해 걱정하지 않도록 격려해야 함","choices":["위험 감수 태도","책무성","반성적 사고","지식에 대한 열망","호기심"],"answer":1,"explain":"넷째 전략은 '위험 감수 태도'. ② 첫째 / ③ 여섯째 / ④ 다섯째 / ⑤ 둘째.","source":{"page":15,"section":"캐플란의 심화학습 교수전략","quote":"넷째, 위험 감수 태도로, 교사는 학생들이 실수하거나 틀리는 것에 대해 걱정하지 않도록 격려해야 함"}},{"id":"43-16","type":"옳지 않은 것","q":"캐플란의 심화학습 교수전략에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["셋째, 인내심과 기다림으로 교사는 학생을 잘 이해하고 존중해야 한다.","인내심과 기다림의 예시 질문으로 '같은 시기에 어떤 일이 발생하였을까?'가 제시되었다.","다섯째, 반성적 사고로 교사는 학생들의 학습능력에 직접적인 영향을 미쳐야 한다.","다섯째 전략의 예시 질문으로 '어떻게 이것을 확인할 수 있었을까?'가 제시되었다.","여섯째 전략은 반성적 사고 혹은 숙고이다."],"answer":3,"explain":"③ 다섯째는 '지식에 대한 열망'으로, 교사는 학생들의 학습능력에 직접적인 영향을 미쳐야 함. 반성적 사고 혹은 숙고는 여섯째. 나머지는 교안 그대로.","source":{"page":16,"section":"캐플란의 심화학습 교수전략","quote":"다섯째, 지식에 대한 열망으로, 교사는 학생들의 학습능력에 직접적인 영향을 미쳐야 함"}},{"id":"43-17","type":"사례","q":"프로젝트를 마친 뒤 교사가 학생들에게 \"요점이 무엇일까?\", \"우리가 노력해야 할 것은 무엇일까?\"라고 물었다. 이에 해당하는 캐플란의 심화학습 교수전략은?","box":null,"choices":["책무성","위험 감수 태도","지식에 대한 열망","반성적 사고 혹은 숙고","인내심과 기다림"],"answer":4,"explain":"여섯째 '반성적 사고 혹은 숙고'의 예시 질문 그대로. ③ 지식에 대한 열망의 예시는 '대통령 선거에서 무슨 일이 발생했지?', '어떻게 이것을 확인할 수 있었을까?'.","source":{"page":16,"section":"캐플란의 심화학습 교수전략","quote":"여섯째, 반성적 사고 혹은 숙고 ‣ 요점이 무엇일까? ‣ 우리가 노력해야 할 것은 무엇일까?"}},{"id":"43-18","type":"빈칸","q":"다음은 렌줄리의 교수법에 관한 말이다. (   )에 들어갈 말로 알맞은 것은?","box":"심화교육과 속진교육 모두 중요합니다. 그러나 무슨 내용을 가르치느냐보다 (   )가 더 중요합니다. 핵심은 교수법입니다.","choices":["누가 가르치느냐","언제 가르치느냐","얼마나 빨리 가르치느냐","어디서 가르치느냐","어떻게 가르치느냐"],"answer":5,"explain":"렌줄리: '무슨 내용을 가르치느냐보다 어떻게 가르치느냐가 더 중요합니다. 핵심은 교수법입니다.'","source":{"page":17,"section":"렌줄리의 교수법","quote":"무슨 내용을 가르치느냐보다 어떻게 가르치느냐가 더 중요합니다. 핵심은 교수법입니다."}},{"id":"43-19","type":"옳은 것","q":"렌줄리의 교수법에 대한 설명으로 옳은 것은?","box":null,"choices":["렌줄리는 하버드대학교 석좌교수이다.","심화교육이 속진교육보다 더 중요하다고 보았다.","심화교육이나 속진교육의 틀에 얽매여 정해진 내용만 가르치고 창의적 사고력과 문제해결능력 등을 강조하지 않는다면 창의·생산적 영재를 키울 수 없다고 하였다.","영재교육의 핵심은 무엇을 가르치느냐, 즉 교육내용이라고 하였다.","속진교육만으로 창의·생산적 영재를 키울 수 있다고 하였다."],"answer":3,"explain":"③ 교안 인용 그대로. ① 코네티컷대학교 석좌교수 조지프 렌줄리 / ② 심화교육과 속진교육 '모두 중요' / ④ 핵심은 '교수법' / ⑤ 교안 내용과 반대.","source":{"page":18,"section":"렌줄리의 교수법","quote":"심화교육이나 속진교육의 틀에 얽매여 정해진 내용만 가르치고, 창의적 사고력과 문제해결능력 등을 강조하지 않는다면 창의·생산적 영재를 키울 수 없습니다."}}]},{"lesson":44,"title":"심화학습은 어떻게 진행되나?","file":"4. 교안 (31~60)[1] (1)/44.pdf","summary":["풀아웃(Pull-out) 프로그램: 영재교육에서 아주 오래된 방법, 1주일에 2-3시간 혹은 하루 정도 정규학급에서 나와 특별 심화학습 (지식과 기술 획득, 창의성과 사고기술, 의사소통 기술, 자아개념 발달, 가치 명료화)","풀아웃 장점: 사회적·지적 자원과 차별화된 심화학습 제공, 고차원적 사고기술 계발 / 단점: 정규학급 교사가 빠지는 수업 책임지지 않음, 특권 선발이 사회적 관계 해침, 분리·특별 취급을 편하게 생각하지 않음","학교 심화 프로젝트: 도서관·인터넷·창의적 글쓰기·미술, 드라마·수학, 과학·발명 프로젝트 / 최종 단계에 산출물·연구보고서 → 전시회·발표회, 동료 상호평가도 효과 높음","토요일 프로젝트: 일부 대학·영재교육기관 제공, 대학 교수진·대학원생·지역사회 전문가가 소규모 진행 / 퍼듀대학교 Super Saturday(유치원~8학년)가 미국 대표 심화 프로그램","Super Saturday 효과: 나쁜 학습습관 개선·미성취 보완, 자신감과 자아개념 대체로 상승, 학업적·사회적 위험 감수, 대학생활·상급교육 가치, 진로 포부 높아짐, 강사가 전문적 모델","NAGC(National Association for Gifted Children, www.nagc.org) 여름방학캠프: 적성검사·지능검사·성취검사 등으로 참가자 선발","멘토십(사사 프로그램): 영향력 있는 전문가의 지도, 영재학생과 전문가 일대일 대면, 지적 활동과 정서적 관계 / 온라인 멘토십 예: 어설린 아카데미(미국 9~12학년 여고생, 졸업생 멘토, 매주 이메일)","연세대 과학영재교육원: 심화 연간 100시간 이상, 사사 80시간 이상 / 서울대 과학영재교육원: 심화과정(중1~2, 100시간 이상), 사사과정(중2~3, 80시간 이상, 지도교수 및 조교 밀착지도)","소셜학습: 학습에 SNS를 결합한 교육방법, 소통과 협업으로 창의성과 문제해결능력","과학올림피아드: 과학기술정보통신부 예산으로 한국과학창의재단에서 지원 / 물리올림피아드위원회는 한국물리학회 산하, 통신교육 → 겨울학교 → 국가대표 선발 → 국가대표 교육 → 국제 참가"],"questions":[{"id":"44-01","type":"개념 찾기","q":"다음 설명에 해당하는 심화학습 프로그램은?","box":"· 영재교육에 있어 아주 오래된 방법임\n· 영재학생들이 1주일에 2-3시간 혹은 하루 정도를 정규학급에서 나와 특별 심화학습을 받음","choices":["토요일 프로젝트","학교 심화 프로젝트","풀아웃(Pull-out) 프로그램","멘토십(Mentorship)","소셜학습"],"answer":3,"explain":"교안의 풀아웃(Pull-out) 프로그램 설명. ① 대학·영재교육기관이 제공하는 소규모 프로그램 / ② 도서관·발명 프로젝트 등 / ④ 전문가의 일대일 지도 / ⑤ 학습에 SNS를 결합.","source":{"page":3,"section":"풀아웃(Pull-out) 프로그램","quote":"영재교육에 있어 아주 오래된 방법임 영재학생들이 1주일에 2-3시간 혹은 하루 정도를 정규학급에서 나와 특별 심화학습을 받음"}},{"id":"44-02","type":"빈칸","q":"풀아웃(Pull-out) 프로그램에 관한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"영재학생들이 1주일에 (   ) 혹은 하루 정도를 정규학급에서 나와 특별 심화학습을 받음","choices":["2-3시간","30분","1시간","5-6시간","10시간"],"answer":1,"explain":"교안: '1주일에 2-3시간 혹은 하루 정도'.","source":{"page":3,"section":"풀아웃(Pull-out) 프로그램","quote":"영재학생들이 1주일에 2-3시간 혹은 하루 정도를 정규학급에서 나와 특별 심화학습을 받음"}},{"id":"44-03","type":"옳지 않은 것","q":"풀아웃(Pull-out) 프로그램에서 영재학생들이 참여하는 학습활동으로 교안에 제시되지 않은 것은?","box":null,"choices":["지식과 기술의 획득","상급학년 교과의 선이수","창의성과 사고기술","자아개념 발달","가치 명료화"],"answer":2,"explain":"교안의 학습활동: 지식과 기술의 획득, 창의성과 사고기술, 의사소통 기술, 자아개념 발달, 가치 명료화. ③ 상급학년 교과 선이수는 없음.","source":{"page":3,"section":"풀아웃(Pull-out) 프로그램","quote":"지식과 기술의 획득, 창의성과 사고기술, 의사소통 기술, 자아개념 발달, 가치 명료화 등의 학습활동에 참여함"}},{"id":"44-04","type":"보기 조합","q":"풀아웃(Pull-out) 프로그램의 장단점에 대한 설명으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 영재학생들에게 사회적, 지적 자원과 차별화된 심화학습을 제공해주는 효과적인 방법이다.\nㄴ. 잘 계획된 풀아웃 프로그램은 학생들의 고차원적 사고기술을 계발시킬 수 있다.\nㄷ. 정규학급의 교사가 영재학생이 정규수업에 빠지는 것을 책임지지 않는다는 단점이 있다.\nㄹ. 영재들은 자신이 소속한 학급에서 분리되어 특별하게 취급받는 것을 편하게 생각하는 경우가 많다.","choices":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":2,"explain":"ㄱ·ㄴ 장점, ㄷ 단점(교안 그대로). ㄹ 교안은 분리되어 특별하게 취급받는 것을 '편하게 생각하지 않는 경우가 많음'(단점) → 반대 서술.","source":{"page":4,"section":"풀아웃(Pull-out) 프로그램의 장단점","quote":"영재들은 자신이 소속한 학급에서 분리되어 특별하게 취급받는 것을 편하게 생각하지 않는 경우가 많음"}},{"id":"44-05","type":"옳지 않은 것","q":"풀아웃(Pull-out) 프로그램에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재교육에 있어 아주 오래된 방법이다.","정규학급에서 나와 특별 심화학습을 받는다.","영재에게 특권을 주어 선발하는 것은 사회적 관계를 해칠 수 있다.","정규학급 교사가 영재학생이 빠진 정규수업을 책임지므로 학습 결손의 우려가 없다.","잘 계획된 풀아웃 프로그램은 고차원적 사고기술을 계발시킬 수 있다."],"answer":4,"explain":"④ 교안의 단점: '정규학급의 교사가 영재학생이 정규수업에 빠지는 것을 책임지지 않음' → 반대 서술. 나머지는 교안 내용.","source":{"page":4,"section":"풀아웃(Pull-out) 프로그램의 장단점","quote":"정규학급의 교사가 영재학생이 정규수업에 빠지는 것을 책임지지 않음 영재에게 특권을 주어 선발하는 것은 사회적 관계를 해칠 수 있음"}},{"id":"44-06","type":"옳지 않은 것","q":"교안에 제시된 학교 심화 프로젝트의 예에 해당하지 않는 것은?","box":null,"choices":["도서관 프로젝트","인터넷 프로젝트","창의적 글쓰기 프로젝트","발명 프로젝트","올림피아드 대비 프로젝트"],"answer":5,"explain":"학교 심화 프로젝트: 도서관, 인터넷, 창의적 글쓰기, 미술·드라마, 수학·과학, 발명 프로젝트 등. ⑤는 제시되지 않음.","source":{"page":5,"section":"학교 심화 프로젝트","quote":"도서관 프로젝트 인터넷 프로젝트 창의적 글쓰기 프로젝트 미술, 드라마 프로젝트 수학, 과학 프로젝트 발명 프로젝트 등"}},{"id":"44-07","type":"옳은 것","q":"학교 심화 프로젝트에 대한 설명으로 옳은 것은?","box":null,"choices":["프로젝트의 중간 단계에서 연구보고서를 제출하면 최종 산출물은 필요하지 않다.","산출물 또는 보고서는 담당 교사에게만 제출하는 것이 좋다.","전문가, 교사 평가도 중요하지만, 동료의 상호평가도 효과가 높은 평가이다.","동료 상호평가는 신뢰도가 낮아 지양해야 한다.","발표회는 학교 관계자를 제외하고 또래와 부모 앞에서만 실시한다."],"answer":3,"explain":"③ 교안 그대로. ① 최종 단계에서 산출물 혹은 연구보고서가 만들어져야 함 / ②⑤ 전시회 혹은 또래, 부모, 교사, 학교 관계자 앞에서 발표회 실시가 좋음 / ④ 동료 상호평가도 효과가 높음.","source":{"page":6,"section":"학교 심화 프로젝트","quote":"전문가, 교사 평가도 중요하지만, 동료의 상호평가도 효과가 높은 평가임"}},{"id":"44-08","type":"옳지 않은 것","q":"토요일 프로젝트에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["대부분 대규모 집단으로 진행된다.","일부 대학들과 영재교육기관들에 의해 제공된다.","대부분 대학 교수진, 대학원생, 혹은 지역사회 전문가들에 의해 진행된다.","퍼듀대학교의 Super Saturday가 대표적인 예이다.","Super Saturday는 미국 영재교육의 대표적인 심화 프로그램이다."],"answer":1,"explain":"① 교안: 대부분 대학 교수진, 대학원생, 혹은 지역사회 전문가들에 의해 '소규모로' 진행.","source":{"page":7,"section":"토요일 프로젝트","quote":"대부분 대학 교수진, 대학원생, 혹은 지역사회 전문가들에 의해 소규모로 진행 퍼듀대학교의 Super Saturday는 미국 영재교육의 대표적인 심화 프로그램"}},{"id":"44-09","type":"빈칸","q":"다음은 Purdue University의 Super Saturday에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   )의 학업적으로, 창의적으로, 예술적으로 재능이 있는 영재들을 위한 프로그램","choices":["유치원부터 8학년까지","1학년부터 6학년까지","유치원부터 12학년까지","9학년부터 12학년까지","중학교 1학년부터 3학년까지"],"answer":1,"explain":"교안: '유치원부터 8학년까지'. ④ 9~12학년은 어설린 아카데미 온라인 멘토십 대상(여고생).","source":{"page":8,"section":"토요일 프로젝트 – Purdue University's Super Saturday","quote":"유치원부터 8학년까지의 학업적으로, 창의적으로, 예술적으로 재능이 있는 영재들을 위한 프로그램"}},{"id":"44-10","type":"옳지 않은 것","q":"Purdue University의 Super Saturday에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["수업은 과학, 수학, 기술, 공학, 예술, 음악, 창의적 글쓰기 등 다양한 주제로 이루어진다.","Purdue University의 교수진과 학생 멘토로부터 지도와 지원을 받는다.","영재학생들은 빠른 속도로 배우기 때문에 내용을 복잡한 수준으로 가르쳐야 한다.","프로그램에서 받는 도전은 영재학생들의 나쁜 학습습관을 개선하고 미성취를 보완한다.","영재학생들은 일반학교 수업에서 다룬 주제를 더 반복적으로 경험한다."],"answer":5,"explain":"⑤ 교안: 영재학생들은 일반학교 수업에서 '다루어보지 못한' 주제들을 경험. 나머지는 교안 그대로.","source":{"page":9,"section":"토요일 프로젝트 – Purdue University's Super Saturday","quote":"영재학생들은 일반학교 수업에서 다루어보지 못한 주제들을 경험"}},{"id":"44-11","type":"보기 조합","q":"Super Saturday에 참여한 영재학생들에게 나타나는 효과로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 자신의 특별한 재능과 능력을 좀 더 깊이 이해함\nㄴ. 다른 유능한 영재학생들과의 작업 때문에 자신감과 자아개념이 대체로 낮아짐\nㄷ. 학업적·사회적 위험을 감수하는 것을 배움\nㄹ. 대학생활과 상급교육의 가치에 관해 배우며, 교육과 진로에 관한 포부 수준도 높아짐","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"ㄴ 교안: 다른 유능한 영재학생들과의 작업이 미치는 약간의 좋지 않은 영향에도 불구하고 자신감과 자아개념은 '대체로 상승함'. ㄱ·ㄷ·ㄹ은 교안 그대로.","source":{"page":10,"section":"토요일 프로젝트 – Purdue University's Super Saturday","quote":"다른 유능한 영재학생들과의 작업이 미치는 약간의 좋지 않은 영향에도 불구하고, 영재학생들의 자신감과 자아개념은 대체로 상승함"}},{"id":"44-12","type":"옳은 것","q":"미국영재학회 NAGC 여름방학캠프에 대한 설명으로 옳은 것은?","box":null,"choices":["NAGC는 National Academy of Gifted Children의 약자이다.","퍼듀대학교 교수진이 직접 운영하는 토요일 프로그램이다.","캠프 참가 대상자는 추첨으로 선발한다.","적성검사, 지능검사, 성취검사 등으로 캠프 참가 대상자를 선발한다.","여름방학 프로그램은 선행학습과 속진의 기회를 제공한다."],"answer":4,"explain":"④ 교안 그대로. ① National Association for Gifted Children / ② NAGC 웹사이트(www.nagc.org)를 통해 여름 프로그램 제공 / ③ 검사로 선발 / ⑤ 심화학습과 창의적 학습의 기회 제공.","source":{"page":11,"section":"미국영재학회 NAGC 여름방학캠프","quote":"여름방학 프로그램은 심화학습과 창의적 학습의 기회 제공 적성검사, 지능검사, 성취검사 등으로 캠프 참가 대상자 선발"}},{"id":"44-13","type":"개념 찾기","q":"다음 설명에 해당하는 심화학습의 현장체험수업 형태는?","box":"진로계획 수립, 지식, 기술, 재능의 향상, 영향력 있는 전문가의 지도를 받는 제도로, 영재학생과 전문가가 일대일로 대면하여 논의하고 문제를 해결하는 등 지적인 활동과 정서적인 관계를 가지게 됨","choices":["소셜학습","멘토십(Mentorship), 사사 프로그램","풀아웃(Pull-out) 프로그램","학교 심화 프로젝트","과학올림피아드"],"answer":2,"explain":"교안의 멘토십(Mentorship), 사사 프로그램 설명. ① 학습에 SNS를 결합 / ③ 정규학급에서 나와 특별 심화학습.","source":{"page":13,"section":"멘토십(Mentorship), 사사 프로그램","quote":"진로계획 수립, 지식, 기술, 재능의 향상, 영향력 있는 전문가의 지도를 받는 제도"}},{"id":"44-14","type":"옳지 않은 것","q":"멘토십(Mentorship), 사사 프로그램에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영향력 있는 전문가의 지도를 받는 제도이다.","전문가의 활동, 책임감, 혜택, 문제, 생활방식 등을 배울 수 있다.","영재학생과 전문가가 일대일로 대면한다.","지적인 활동과 정서적인 관계를 가지게 된다.","다수의 학생이 전문가의 강의를 듣는 형태로 정서적 관계는 배제된다."],"answer":5,"explain":"⑤ 교안: 영재학생과 전문가가 '일대일로 대면'하여 지적인 활동과 '정서적인 관계'를 가지게 됨.","source":{"page":13,"section":"멘토십(Mentorship), 사사 프로그램","quote":"영재학생과 전문가가 일대일로 대면하여 논의하고 문제를 해결하는 등 지적인 활동과 정서적인 관계를 가지게 됨"}},{"id":"44-15","type":"옳은 것","q":"어설린 아카데미(Ursuline Academy)의 온라인 멘토십에 대한 설명으로 옳은 것은?","box":null,"choices":["미국의 9~12학년 여고생들을 위한 멘토를 그 학교 졸업생들로 채용하였다.","미국의 유치원~8학년 학생들을 대상으로 한다.","멘토를 대학 교수진으로 채용하여 매월 화상회의를 실시하였다.","멘토와 매일 전화 통화를 주고받았다.","대학 진학보다는 취업 계획 수립에 초점을 두었다."],"answer":1,"explain":"① 교안 그대로. ② 유치원~8학년은 Super Saturday / ③④ 그 학교 졸업생 멘토와 '매주 이메일'을 주고받음 / ⑤ 상위 교과목 선택과 대학진학 계획 수립 시 도움.","source":{"page":14,"section":"온라인 멘토십(Mentorship)","quote":"미국의 9~12학년 여고생들을 위한 멘토를 그 학교 졸업생들로 채용하여 매주 이메일을 주고받음"}},{"id":"44-16","type":"옳지 않은 것","q":"연세대학교 과학영재교육원 교과과정에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["심화과정의 연간 수업시수는 100시간 이상이다.","사사과정의 연간 수업시수는 80시간 이상이다.","수학 심화2는 전년도 수학심화1 과정 수료자 중 선발한다.","사사 수학은 전년도 수학심화2 과정 수료자 중 소수인원을 선발하여 개별 또는 팀 프로젝트 형태의 연구 중심 교육을 실시한다.","사사 과학(물리·지구과학)은 외부지원자를 제외하고 전년도 심화과정 수료자만 선발한다."],"answer":5,"explain":"⑤ 사사 과학은 '전년도 물리·지구과학심화과정 수료자 및 외부지원자 중' 소수인원을 선발하여 팀 프로젝트 형태로 운영. 나머지는 교안 표 그대로.","source":{"page":15,"section":"연세대학교 과학영재교육원 교과과정","quote":"전년도 물리·지구과학심화과정 수료자 및 외부지원자 중 소수인원을 선발하여 팀 프로젝트 형태의 연구중심교육실시"}},{"id":"44-17","type":"옳은 것","q":"서울대학교 과학영재교육원 교육과정에 대한 설명으로 옳은 것은?","box":null,"choices":["사사과정의 대상은 중1~2이다.","사사과정의 수업시간은 연간 100시간 이상이다.","사사과정은 지도교수 및 조교의 밀착지도 아래 독자적인 탐구를 수행한다.","심화과정의 수업시간은 연간 80시간 이상이다.","심화과정에서는 전국 대학부설 과학영재교육원 사사과정 연구성과 발표대회에 참가한다."],"answer":3,"explain":"③ 교안 그대로. ①④ 심화과정(중1~2, 연간 100시간 이상) / ② 사사과정(중2~3)은 연간 80시간 이상 / ⑤ 연구성과 발표대회는 사사과정 내용.","source":{"page":16,"section":"서울대학교 과학영재교육원 교육과정","quote":"사사과정(중2~3) 지도교수 및 조교의 밀착지도 아래 독자적인 탐구수행"}},{"id":"44-18","type":"개념 찾기","q":"다음 설명에 해당하는 교육방법은?","box":"학습(Learning)에 소셜 네트워킹 서비스(SNS 등)를 결합한 교육방법으로, SNS의 장점인 소통과 협업으로 창의성과 문제해결능력을 키우는 교육방식","choices":["온라인 멘토십","풀아웃 프로그램","토요일 프로젝트","소셜학습","학교 심화 프로젝트"],"answer":4,"explain":"교안의 '소셜학습' 정의. ① 온라인 멘토십은 이메일, SNS 등으로 전문가와 접촉하여 전문가의 지도를 받는 것.","source":{"page":17,"section":"소셜학습","quote":"학습(Learning)에 소셜 네트워킹 서비스(SNS 등)를 결합한 교육방법을 의미함"}},{"id":"44-19","type":"빈칸","q":"소셜학습에 관한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"SNS의 장점인 (   )(으)로 창의성과 문제해결능력을 키우는 교육방식임","choices":["속도와 편리성","익명성과 개방성","소통과 협업","경쟁과 보상","자율과 책임"],"answer":3,"explain":"교안: 'SNS의 장점인 소통과 협업으로'.","source":{"page":17,"section":"소셜학습","quote":"SNS의 장점인 소통과 협업으로 창의성과 문제해결능력을 키우는 교육방식임"}},{"id":"44-20","type":"빈칸","q":"과학올림피아드에 관한 다음 설명의 (가), (나)에 들어갈 말로 알맞은 것은?","box":"과학올림피아드는 (가) 예산으로 (나)에서 지원한다.","choices":["(가) 교육부 – (나) 한국교육개발원","(가) 과학기술정보통신부 – (나) 한국과학창의재단","(가) 교육부 – (나) 한국과학창의재단","(가) 과학기술정보통신부 – (나) 한국물리학회","(가) 산업통상자원부 – (나) 한국과학기술원"],"answer":2,"explain":"교안: '과학기술정보통신부 예산으로 한국과학창의재단에서 지원'. ④ 한국물리학회는 물리올림피아드위원회가 설치된 곳.","source":{"page":18,"section":"과학올림피아드","quote":"과학기술정보통신부 예산으로 한국과학창의재단에서 지원"}},{"id":"44-21","type":"옳지 않은 것","q":"교안에 제시된 과학올림피아드(한국과학올림피아드 조직위원회 및 한국청소년물리토너먼트 조직위원회)에 해당하지 않는 것은?","box":null,"choices":["한국천문올림피아드","한국정보올림피아드","한국중등과학올림피아드","한국로봇올림피아드","한국청소년물리토너먼트"],"answer":4,"explain":"교안 목록: 수학, 물리, 화학, 정보, 생물, 천문, 지구과학, 중등과학 올림피아드와 한국청소년물리토너먼트. ④는 목록에 없음.","source":{"page":18,"section":"과학올림피아드","quote":"한국정보올림피아드 https://koi.or.kr 한국생물올림피아드 https://kbo.bioedu.kr 한국천문올림피아드 http://www.kasolym.org"}},{"id":"44-22","type":"옳지 않은 것","q":"물리올림피아드 교육과정에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["매년 국제물리올림피아드 대회에 파견할 대표학생들을 선발하고 교육을 관장한다.","물리올림피아드위원회가 한국물리학회 산하에 설치되어 있다.","물리올림피아드는 한국과학창의재단의 지원으로 운영된다.","일반물리1 통신교육과 일반물리2 통신교육을 거친다.","국가대표 선발 후에 겨울학교를 거쳐 국가대표 교육을 받는다."],"answer":5,"explain":"⑤ 교육과정 순서: 일반물리 통신교육 지원 및 선발 → 일반물리1 통신교육 → 일반물리2 통신교육 → 겨울학교 지원 및 선발 → 겨울학교 → 국가대표 선발 → 국가대표 교육 → 국제물리올림피아드 참가. 겨울학교는 국가대표 선발 '이전'.","source":{"page":19,"section":"과학올림피아드 – 예시: 물리올림피아드 교육과정","quote":"물리올림피아드위원회가 한국물리학회 산하에 설치되어 있으며, 물리올림피아드는 한국과학창의재단의 지원으로 운영"}}]},{"lesson":45,"title":"선행학습, 속진학습, 심화학습은 어떻게 다를까?","file":"4. 교안 (31~60)[1] (1)/45.pdf","summary":["모든 학생은 똑같은 재능과 똑같은 속도로 학습·성장하지 않음을 먼저 인정 / 형제, 일란성·이란성 쌍둥이도 지능·성격·공부 속도·발달 속도가 다름 (출처: 이정규, 성공하는 미래교육전략)","하워드 가드너 다중지능: ①언어 ②논리수학 ③공간 ④신체운동 ⑤음악 ⑥대인관계 ⑦자기이해 ⑧자연탐구 → 언어·논리수학 지능만 중시한 학교교육 비판","노벨상 수상 연령대: 30대 초반 또는 대부분 60~70대의 두 가지 유형","PISA: 3년마다 만 15세 학생 대상 읽기·수학·과학 평가 / PISA 2006: 과학 흥미도 57개국 중 55위(-0.24점), 과학적 소양 OECD 5~9위·전체 11위, 1위 콜롬비아(1.15점)","PISA 2022: 학습능력은 상위권이나 학습 흥미·즐거움·동기·자기효능감은 최하위 수준","미래사회: 자기주도적으로 평생 끊임없이 공부하는 평생학습의 시대 / 공부의 진정한 목적: 지적 호기심, 새로운 것을 아는 즐거움, 더 높은 수준으로 성취해 가는 기쁨","선행학습: 진단에 앞서 상위학년 과목을 미리 공부, 강도 높은 예습(진단 없는 처방), 반복을 전제 / 학원만 오가는 '학원순례족' 주의","속진학습: 지적 수준에 맞는 맞춤형 수업, 조기입학·학년 월반·과목 월반·압축 프로그램·학점 부여·이중등록 / 반복을 거부하고 반복 없이도 진도를 나갈 수 있음이 증명된 아이","과목 월반(단일 교과 속진): 특정 영역에서 고차원 학습 능력 / 학년 월반(학년 속진): 거의 모든 교과목에서 같은 연령대보다 월등히 우수","심화학습: 해당 학년 교육과정 범위 내에서 넓고 깊게(독립연구, 풀아웃, 학교 프로젝트, 토요 프로그램, 멘토십, 캠프) / 독립적 연구: 자발적·최소 지도·혼자 작업 훈육·선도적 역할과 기지","영재교육은 차별화(Differentiated) 교육과정, 특수교육은 개별화(Individualized) 교육과정","학교 성취도평가·수행평가에서 일정 수준 성적을 못 얻으면 학원 선행 진도 과감히 포기 / 중학생은 절대평가 등급, 초등학생은 담임선생님과 의논 / 부모 욕심이 '학습조로증', '학습 번아웃증'을 만들지 않는지 성찰"],"questions":[{"id":"45-01","type":"옳지 않은 것","q":"교안의 '저마다 다른 아이들'에서 제시한 학부모들의 질문(고민)으로 볼 수 없는 것은?","box":null,"choices":["학원에서 미리 선행학습을 해서 학교 공부가 재미없다고 한다.","5학년인데 수학영재학급에 있는데, 미리 중학교 수학을 시켜도 될까?","누구누구는 00 올림피아드를 준비하고 00 경시대회도 나간다는데 우리 아이만 뒤처지는 것은 아닐까?","선행학습을 하지 않아서 학교 수업 내용이 너무 어렵다고 한다.","주위에서 학원에서 다 선행학습하고 학교에 간다고 한다."],"answer":4,"explain":"④ 교안의 학부모 질문은 오히려 선행학습을 해서 학교 공부가 재미없고 지루하다는 고민. ①②③⑤는 교안의 질문들.","source":{"page":3,"section":"질문들","quote":"학원에서 미리 선행학습을 해서, 학교공부가 재미없다네요"}},{"id":"45-02","type":"옳지 않은 것","q":"교안에 제시된 학부모들의 질문(고민)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["아이의 성적표와 주변 엄마들 얘기를 들으면 우리 아이만 성적이 뒤처진 것 같아 속상해한다.","학교에서 다 아는 공부를 반복하라고 해서 아이가 재미없고 지루하다고 한다.","공부를 잘해도 더 잘하지 못한 것 같아 걱정하고, 못하면 못한 대로 속상해한다.","부모의 걱정과 한숨 속에 아이는 학업 스트레스를 받는다.","부모의 관심 덕분에 아이는 스트레스 없이 성적이 쉽게 오른다."],"answer":5,"explain":"⑤ 교안: 부모의 걱정과 한숨 속에 아이는 학업 스트레스를 받고 '성적은 쉽게 오르지 않아요'.","source":{"page":4,"section":"학부모들의 질문","quote":"부모의 걱정과 한숨 속에 아이는 아이대로 학업 스트레스를 받고 성적은 쉽게 오르지 않아요"}},{"id":"45-03","type":"빈칸","q":"'영재는 모두 똑같지 않다'에 관한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"모든 학생은 똑같은 재능과 똑같은 (   )(으)로 학습하고 성장하지 않음을 먼저 인정해야 함","choices":["속도","방법","목표","환경","동기"],"answer":1,"explain":"교안: '모든 학생은 똑같은 재능과 똑같은 속도로 학습하고 성장하지 않음을 먼저 인정해야 함'.","source":{"page":5,"section":"영재는 모두 똑같지 않다","quote":"모든 학생은 똑같은 재능과 똑같은 속도로 학습하고 성장하지 않음을 먼저 인정해야 함"}},{"id":"45-04","type":"옳지 않은 것","q":"'영재는 모두 똑같지 않다'(출처: 이정규, 「성공하는 미래교육전략」)의 내용으로 옳지 않은 것은?","box":null,"choices":["아이들마다 타고난 지능과 재능의 성장 속도가 개인마다 모두 차이가 있다.","일란성 쌍둥이는 지능과 공부 속도가 같으므로 서로 비교하여 지도하는 것이 효과적이다.","다른 집 아이와, 또는 같은 형제간의 비교에서 부모나 아이나 모두 상대적인 가치박탈감과 불안이 시작된다.","지적 능력이나 노력 및 공부하는 방식은 학생마다 다 다름을 인정해야 한다.","발달 속도가 다름을 인정하여야 스트레스를 받지 않는다."],"answer":2,"explain":"② 교안: 형제간, 일란성 또는 이란성 쌍둥이일지라도 지능과 성격이 다르고 공부 속도도, 발달 속도도 다름. 비교는 상대적 가치박탈감과 불안을 낳음.","source":{"page":6,"section":"영재는 모두 똑같지 않다","quote":"형제간, 일란성 또는 이란성 쌍둥이일지라도 지능과 성격이 다르고 공부 속도도, 발달 속도도 다름을 인정하여야 스트레스를 받지 않음"}},{"id":"45-05","type":"개념 찾기","q":"다음 설명에 해당하는 학자는?","box":"· 미국의 심리학자\n· 서구사회가 오랫동안 합리적이고 똑똑한 지식인을 선호하는 지능중심 사회였다고 함\n· 타고난 지능 영역이 서로 다름에도 불구하고 언어, 논리수학 지능만을 중시한 학교교육을 비판함","choices":["하워드 가드너","조지프 렌줄리","블룸","캐플란","말콤 글래드웰"],"answer":1,"explain":"교안의 하워드 가드너의 다중지능이론. ② 렌줄리: 교수법 강조 / ③ 블룸: 교육목표분류학 / ④ 캐플란: 심화학습 교수전략 / ⑤ 말콤 글래드웰: 만 시간의 법칙(아웃라이어).","source":{"page":7,"section":"하워드 가드너의 다중지능이론","quote":"미국의 심리학자 하워드 가드너는 서구사회가 오랫동안 합리적이고 똑똑한 지식인을 선호하는 지능중심 사회였다고 함"}},{"id":"45-06","type":"옳지 않은 것","q":"하워드 가드너가 제시한 타고난 지능 영역에 해당하지 않는 것은?","box":null,"choices":["공간 지능","대인관계 지능","자기이해 지능","정서 지능","자연탐구 지능"],"answer":4,"explain":"교안의 8가지 지능: ①언어 ②논리수학 ③공간 ④신체운동 ⑤음악 ⑥대인관계 ⑦자기이해 ⑧자연탐구. '정서 지능'은 제시되지 않음.","source":{"page":8,"section":"하워드 가드너의 다중지능이론","quote":"①언어, ②논리 수학, ③공간, ④신체 운동, ⑤음악, ⑥대인 관계, ⑦자기 이해, ⑧자연탐구 지능"}},{"id":"45-07","type":"빈칸","q":"하워드 가드너의 다중지능이론에 관한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"하워드 가드너는 타고난 지능 영역이 서로 다름에도 불구하고 (   ) 지능만을 중시한 학교교육이 계속되었다고 비판함","choices":["공간, 음악","언어, 논리수학","대인관계, 자기이해","신체운동, 자연탐구","논리수학, 공간"],"answer":2,"explain":"교안: '언어, 논리수학 지능만을 중시한 학교교육이 계속되었다고 비판함'. 다른 지능들은 계발되기 전에 조기에 사장되는 경우가 많았음.","source":{"page":8,"section":"하워드 가드너의 다중지능이론","quote":"언어, 논리수학 지능만을 중시한 학교교육이 계속되었다고 비판함"}},{"id":"45-08","type":"옳은 것","q":"교안에서 제시한 노벨상 수상자들의 특징으로 옳은 것은?","box":null,"choices":["노벨상 수상자들은 모두 학교 다닐 때 전교 1등을 하였다.","노벨상 수상자들은 모두 지능이 뛰어났다.","노벨상을 수상하는 연령대는 대부분 40대에 집중된다.","노벨상을 수상하는 연령대는 30대 초반이거나 대부분 60~70대가 되어서야 받는 두 가지 유형이 존재한다.","사람의 발달 수준은 타고나는 것이며 만들어지지 않는다."],"answer":4,"explain":"④ 교안 그대로. ①② 모두 지능이 뛰어나거나 전교 1등만 하였던 사람들이 아님 / ③ 30대 초반 또는 60~70대 / ⑤ 제각각 다르게 타고나기도 하고 '만들어지기도' 함.","source":{"page":9,"section":"노벨상 수상자들의 특징","quote":"노벨상을 수상하는 연령대의 경우 30대 초반이거나 혹은 대부분 60~70대가 되어서야 받는 두 가지 유형이 존재"}},{"id":"45-09","type":"옳은 것","q":"국제학업성취도비교(PISA)에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["3년마다 만 15세 학생을 대상으로 읽기, 수학, 과학 능력을 평가한다.","5년마다 만 12세 학생을 대상으로 한다.","매년 만 15세 학생을 대상으로 수학, 과학 능력만 평가한다.","3년마다 만 18세 학생을 대상으로 읽기, 쓰기, 수학 능력을 평가한다.","참여하는 국가의 수는 매번 동일하다."],"answer":1,"explain":"① 교안 그대로. ⑤ 교안: '세계적으로 참여하는 국가의 수는 다르나'.","source":{"page":10,"section":"자신의 발달수준과 발달과업","quote":"국제학업성취도비교(PISA) : 세계적으로 참여하는 국가의 수는 다르나, 3년마다 만15세 학생을 대상으로 읽기, 수학, 과학능력을 평가함"}},{"id":"45-10","type":"옳지 않은 것","q":"교안에 제시된 신문 기사(2010. 1. 21)의 PISA 2006 결과에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["한국 학생들의 과학 흥미도는 비교대상 57개 국가 중 55위였다.","국립과천과학관이 OECD의 국제학생평가(PISA) 보고서를 분석하였다.","PISA는 OECD가 1998년부터 3년마다 실시한 연구이다.","연구에 참여하는 학생은 약 40만 명에 이른다.","한국 학생들의 과학적 소양은 전체 국가 중 55위였다."],"answer":5,"explain":"⑤ 과학적 소양은 OECD 회원국 중 5~9위, 전체 국가 중 11위. 55위는 '과학 흥미도'.","source":{"page":11,"section":"자신의 발달수준과 발달과업","quote":"우리나라 학생들의 '과학적 소양'은 OECD 회원국 중 5~9위, 전체 국가 중에서는 11위를 기록했다."}},{"id":"45-11","type":"옳은 것","q":"PISA 2006 '과학에 대한 일반적인 흥미' 조사 결과(세계일보 2010. 1. 21)에 대한 설명으로 옳은 것은?","box":null,"choices":["1위는 태국(1.15점)이었다.","OECD 57개 회원국만을 대상으로 하였다.","2위는 콜롬비아(0.91점)였다.","한국은 0.79점으로 3위를 기록했다.","한국은 마이너스 점수대(-0.24점)로 55위를 기록했다."],"answer":5,"explain":"⑤ 교안 그대로. 1위 콜롬비아(1.15점), 2위 키르기스스탄(0.91점), 3위 태국(0.79점) / ② OECD 30개 회원국을 포함한 전체 57개국.","source":{"page":12,"section":"자신의 발달수준과 발달과업","quote":"1위 콜롬비아(1.15점), 2위 키르기스스탄(0.91점), 3위 태국(0.79점) 등에 훨씬 못 미치는 마이너스 점수대(-0.24점)로 55위를 기록했다."}},{"id":"45-12","type":"옳은 것","q":"PISA 2022 결과에 나타난 우리나라 학생의 특징으로 옳은 것은?","box":null,"choices":["학습능력과 학습 흥미 모두 상위권이다.","학습능력은 최하위 수준이나 학습 동기는 상위권이다.","학습능력은 상위권이나, 학습에 대한 흥미와 즐거움, 동기와 자기효능감의 수준이 다른 국가에 비해 최하위 수준이다.","자기효능감은 높으나 학습에 대한 즐거움이 낮다.","학습능력과 자기효능감 모두 중위권이다."],"answer":3,"explain":"③ 교안 그대로(출처: OECD(2023)). 자기 스스로 공부를 잘할 수 있다는 자아효능감도 낮음 → ④ 틀림.","source":{"page":13,"section":"우리나라 학생의 PISA 결과","quote":"PISA 2022 결과에서는 학습능력은 상위권이나, 학습에 대한 흥미와 즐거움, 동기와 자기효능감의 수준이 다른 국가에 비해 최하위 수준"}},{"id":"45-13","type":"빈칸","q":"미래사회 교육에 관한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"미래사회의 공부는 학교 다니는 기간에 일방적으로 주어지는 지식만을 습득하는 시대가 아님. 빠른 변화에 잘 적응하기 위해서는 자기주도적으로 평생을 끊임없이 공부해야 하는 (   )의 시대임","choices":["평생학습","선행학습","속진학습","주입식 학습","경쟁학습"],"answer":1,"explain":"교안: '자기주도적으로 평생을 끊임없이 공부해야 하는 평생학습의 시대임'.","source":{"page":15,"section":"미래사회 교육","quote":"빠른 변화에 잘 적응하기 위해서는 자기주도적으로 평생을 끊임없이 공부해야 하는 평생학습의 시대임"}},{"id":"45-14","type":"옳은 것","q":"교안에서 제시한 '공부의 진정한 목적'으로 옳은 것은?","box":null,"choices":["상급학교 진학에 필요한 좋은 수상 실적을 얻는 것","또래보다 한 학년 이상 앞선 진도를 나가는 것","지적 호기심을 가지고 새로운 지식을 탐구하고, 새로운 것을 아는 게 즐겁고, 자신의 현재 수준보다 더 높은 수준으로 성취해 가는 기쁨을 알게 하는 것","학교 다니는 기간에 주어지는 지식을 빠짐없이 습득하는 것","모든 학생이 같은 속도로 같은 성취 수준에 도달하는 것"],"answer":3,"explain":"③ 교안 그대로. ⑤ 교안은 모든 학생이 재능과 발달 속도에 개인차가 있음을 인정해야 한다고 함.","source":{"page":16,"section":"미래사회 교육","quote":"지적 호기심을 가지고 새로운 지식을 탐구하고, 새로운 것을 아는 게 즐겁고, 자신의 현재 수준보다 더 높은 수준으로 성취해 가는 기쁨을 알게 하는 것이 공부의 진정한 목적"}},{"id":"45-15","type":"옳지 않은 것","q":"교안의 '영재도 자기만의 학습법이 필요하다'에서 선행학습을 하게 되는 이유로 제시되지 않은 것은?","box":null,"choices":["남들도 다 한다고","왠지 뒤처지는 것 같아서","학원에서 선행학습을 추천한다","담임교사가 학습 수준을 진단한 후 권유해서","특목고 진학을 위해 00 올림피아드의 좋은 수상 실적이 필요하다"],"answer":4,"explain":"교안 제시 이유: 남들도 다 한다고 / 왠지 뒤처지는 것 같아서 / 학원에서 선행학습을 추천한다 / 특목고 진학을 위해 00 올림피아드의 좋은 수상 실적이 필요하다. ④는 없음(선행학습은 오히려 '진단 없는 처방').","source":{"page":17,"section":"영재도 자기만의 학습법이 필요하다","quote":"남들도 다 한다고 / 왠지 뒤처지는 것 같아서 / 학원에서 선행학습을 추천한다 / 특목고 진학을 위해 00 올림피아드의 좋은 수상실적이 필요하다"}},{"id":"45-16","type":"옳은 것","q":"선행학습에 대한 교안의 입장으로 옳은 것은?","box":null,"choices":["현재 학교 진도도 따라가기 어렵다면, 선행학습을 억지로 시키면 안 된다.","학교 진도를 따라가기 어려울수록 선행학습으로 보충해야 한다.","선행학습은 학부모의 만족을 위해 시켜도 무방하다.","학원 수업은 대부분의 학생들이 제대로 따라간다.","학원 수업을 따라가지 못해도 공부 흥미는 쉽게 잃지 않는다."],"answer":1,"explain":"① 교안 그대로. ③ 학부모의 자기만족이 돼서도 안 됨 / ④ 학원에서도 소수 상위 학생들만 제대로 따라감 / ⑤ 대부분의 학생들은 쉽게 공부에 흥미를 잃음.","source":{"page":18,"section":"영재도 자기만의 학습법이 필요하다","quote":"현재 학교 진도도 따라가기 어렵다면, 선행학습을 억지로 시키면 안 됨 선행학습을 시키는 것이 학생의 공부 목적보다, 학부모의 자기만족이 돼서도 안 됨"}},{"id":"45-17","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"학원에서도 소수 상위 학생들만 학원 수업을 제대로 따라가게 됨. 수업을 따라가지 못하는 대부분의 많은 학생들은 쉽게 공부에 흥미를 잃음. 학원만 왔다 갔다 하면서 만족하는 \"(   )\"이 될 수 있고, 시간과 비용을 낭비하게 됨","choices":["학습조로족","학원순례족","선행학습족","번아웃족","사교육족"],"answer":2,"explain":"교안: '학원만 왔다 갔다 하면서 만족하는 \"학원순례족\"이 될 수 있고'. ① 교안의 용어는 '학습조로증'(부모 욕심 관련).","source":{"page":19,"section":"영재도 자기만의 학습법이 필요하다","quote":"학원만 왔다 갔다 하면서 만족하는 \"학원순례족\"이 될 수 있고, 시간과 비용을 낭비하게 됨"}},{"id":"45-18","type":"개념 찾기","q":"다음 설명에 해당하는 학습 방식은?","box":"· 공부 수준을 정확히 진단하기에 앞서 현재 학년보다 상위 학년의 과목을 미리 공부하는 것\n· 강도 높은 예습의 개념(진단 없는 처방)\n· 반복을 전제","choices":["속진학습","심화학습","선행학습","독립연구","압축 프로그램"],"answer":3,"explain":"교안의 선행학습 정의. ① 속진학습은 지적 수준에 맞는 맞춤형 수업, '반복을 거부'하는 아이들에 적합 / ② 해당 학년 교육과정 범위 내에서 넓고 깊게.","source":{"page":20,"section":"선행학습","quote":"공부 수준을 정확히 진단하기에 앞서 현재 학년보다 상위학년의 과목을 미리 공부하는 것 강도 높은 예습의 개념(진단 없는 처방) 반복을 전제"}},{"id":"45-19","type":"옳지 않은 것","q":"선행학습에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["강도 높은 예습의 개념이다.","반복을 거부하고 반복 없이 진도를 나간다.","학교 수업에서 흥미를 잃기 쉽다.","해당 학년 공부가 부실해져서 다음 학년 공부에도 나쁜 영향을 미칠 수 있다.","학교 수업에 적극적으로 참여하고, 해당 학년 평가에서 일정 수준의 성적을 거둔다면 여유 있는 학습을 위해 도움이 된다."],"answer":2,"explain":"② 선행학습은 '반복을 전제'. 반복을 거부하고 반복 없이 진도를 나갈 수 있는 아이들은 속진학습에 적합.","source":{"page":20,"section":"선행학습","quote":"학교 수업에서 흥미를 잃기 쉽고, 해당 학년 공부가 부실해져서 다음 학년 공부에도 나쁜 영향을 미침"}},{"id":"45-20","type":"옳지 않은 것","q":"교안에 제시된 속진학습의 형태로 옳지 않은 것은?","box":null,"choices":["조기입학","과목 월반","압축 프로그램","이중등록","풀아웃 프로그램"],"answer":5,"explain":"속진학습: 조기입학, 학년 월반, 과목 월반, 압축 프로그램, 학점 부여, 이중등록 등. ⑤ 풀아웃 프로그램은 심화학습의 형태.","source":{"page":21,"section":"속진학습","quote":"조기입학, 학년 월반, 과목 월반, 압축 프로그램, 학점 부여, 이중등록 등"}},{"id":"45-21","type":"사례","q":"다음 사례의 학생에게 가장 적합한 학습 방식은?","box":"민수는 이미 이해한 내용을 다시 반복하는 것을 거부하며, 실제로 반복 없이도 진도를 나갈 수 있다는 것이 여러 차례 증명되었다. 교사는 민수의 지적 수준에 맞는 맞춤형 수업이 필요하다고 판단하였다.","choices":["선행학습","심화학습 중 풀아웃 프로그램","교육과정 압축에 적합한 속진학습","심화학습 중 독립적 연구","개별화 교육과정"],"answer":3,"explain":"교안: 속진학습은 지적 수준에 맞는 맞춤형 수업, 교육과정 압축에 적합한 경우 = '반복을 거부하고, 반복 없이도 진도를 나갈 수 있다는 것이 증명된 아이들'. ① 선행학습은 반복을 전제 / ⑤ 개별화 교육과정은 특수교육.","source":{"page":21,"section":"속진학습","quote":"교육과정 압축에 적합한 경우 ‣ 반복을 거부하고, 반복 없이도 진도를 나갈 수 있다는 것이 증명된 아이들"}},{"id":"45-22","type":"사례","q":"다음 사례의 학생 (가), (나)에게 적합한 속진학습 형태로 옳게 짝지은 것은?","box":"(가) 수학 영역에서만 고차원적인 수준의 학습을 할 능력을 가진 학생\n(나) 거의 모든 교과목에서 같은 연령대의 친구들에 비해 월등히 우수한 학생","choices":["(가) 학년 월반 – (나) 과목 월반","(가) 조기입학 – (나) 이중등록","(가) 과목 월반 – (나) 압축 프로그램","(가) 과목 월반 – (나) 학년 월반","(가) 학점 부여 – (나) 조기입학"],"answer":4,"explain":"교안: 과목 월반(단일 교과 속진)은 특정 영역에서 고차원적 수준의 학습 능력을 가진 아이들, 학년 월반(학년 속진)은 거의 모든 교과목에서 같은 연령대보다 월등히 우수한 아이들에게 적합. ①은 서로 바뀜.","source":{"page":22,"section":"속진학습","quote":"학년 월반(학년 속진)에 적합한 경우 ‣ 거의 모든 교과목에서 같은 연령대의 친구들에 비해 월등히 우수한 아이들"}},{"id":"45-23","type":"옳지 않은 것","q":"심화학습에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["해당 학년의 교육과정 범위 내에서 학습한다.","실험실습, 탐구활동, 현장체험학습, 진로탐색 및 체험활동 등의 풍부한 교육경험을 할 수 있도록 한다.","보다 넓고 깊게 학습하는 것이다.","독립연구, 풀아웃 프로그램, 학교 프로젝트, 토요 프로그램, 멘토십, 캠프 등의 형태가 있다.","조기입학, 학점 부여, 이중등록 등의 형태로 이루어진다."],"answer":5,"explain":"⑤ 조기입학·학점 부여·이중등록은 속진학습의 형태. ①~④는 교안의 심화학습 내용.","source":{"page":23,"section":"심화학습","quote":"해당 학년의 교육과정 범위 내에서 좀 더 다양하게 실험실습, 탐구활동, 현장체험학습, 진로탐색 및 체험활동 등의 풍부한 교육경험을 할 수 있도록 보다 넓고 깊게 학습하는 것"}},{"id":"45-24","type":"사례","q":"다음 사례의 학생에게 가장 적합한 심화학습 형태는?","box":"지은이는 자발적이며 최소의 지도만을 필요로 하고, 혼자 작업하도록 충분히 훈육되어 있다. 또한 필요한 연구를 하는 데 선도적 역할을 하고 기지를 가지고 있다.","choices":["독립적 연구","풀아웃 프로그램","학년 월반","선행학습","이중등록"],"answer":1,"explain":"교안의 '독립적 연구에 적합한 경우' 그대로. ② 풀아웃 프로그램은 독립 연구가 가능하고, 학습기술들과 일반적 주제에 관한 문제들을 서로 연결시키는 능력을 가진 아이들 / ③⑤ 속진 / ④ 선행.","source":{"page":24,"section":"심화학습","quote":"자발적인 아이들, 최소의 지도를 필요로 하는 아이들, 혼자 작업하도록 충분히 훈육된 아이들, 필요한 연구를 하는 데 선도적 역할을 하고 기지를 가진 아이들"}},{"id":"45-25","type":"옳은 것","q":"심화학습의 적합 대상 및 특징에 대한 설명으로 옳은 것은?","box":null,"choices":["풀아웃 프로그램은 독립 연구가 불가능한 아이들에게 적합하다.","풀아웃 프로그램은 독립 연구가 가능하고, 학습기술들과 일반적 주제에 관한 문제들을 서로 연결시키는 능력을 가진 아이들에게 적합하다.","독립적 연구는 교사의 지속적이고 많은 지도를 필요로 하는 아이들에게 적합하다.","심화학습을 하면 난이도가 더 높은 부분은 전혀 접하지 않는다.","심화학습은 선행으로 나아가는 것을 금지한다."],"answer":2,"explain":"② 교안 그대로. ③ 독립적 연구는 '최소의 지도'를 필요로 하는 아이들 / ④⑤ 심화학습을 하다 보면 자연스럽게 난이도가 더 높은 부분도 접하게 되어 일부 선행으로 나아가기도 함.","source":{"page":24,"section":"심화학습","quote":"풀아웃 프로그램에 적합한 경우 ‣ 독립 연구가 가능하고, 학습기술들과 일반적 주제에 관한 문제들을 서로 연결시키는 능력을 가진 아이들"}},{"id":"45-26","type":"옳은 것","q":"영재를 위한 학습방식에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["영재에게는 속진보다 심화만 필요하다.","영재에게는 심화보다 속진만 필요하다.","속진도 필요하고 심화도 필요하며, 학생에 따라 적합한 방법으로 해야 한다.","모든 영재학생에게 동일한 교육과정 전략을 적용해야 한다.","영재학생들을 위한 차별화는 내용의 속진만을 의미한다."],"answer":3,"explain":"③ 교안 그대로. ④ 영재학생들의 욕구와 학습양식에 맞도록 차별화 교육과정 전략 필요 / ⑤ 차별화는 내용의 속진과 함께 더 깊이 있고, 폭넓고, 복잡하나 특별한 요구에 부합하는 학습 옵션 제공.","source":{"page":25,"section":"영재를 위한 학습방식","quote":"속진도 필요 심화도 필요 학생에 따라 적합한 방법으로 해야 함 영재학생들의 욕구와 학습양식에 맞도록 차별화 교육과정 전략이 필요함"}},{"id":"45-27","type":"빈칸","q":"다음 (가), (나)에 들어갈 말로 알맞은 것은?","box":"· 영재교육 – (가) 교육과정\n· 특수교육 – (나) 교육과정","choices":["(가) 개별화(Individualized) – (나) 차별화(Differentiated)","(가) 통합(Integrated) – (나) 개별화(Individualized)","(가) 차별화(Differentiated) – (나) 통합(Integrated)","(가) 압축(Compacted) – (나) 차별화(Differentiated)","(가) 차별화(Differentiated) – (나) 개별화(Individualized)"],"answer":5,"explain":"교안 참고: 영재교육은 차별화(Differentiated) 교육과정, 특수교육은 개별화(Individualized) 교육과정. ①은 서로 바뀜.","source":{"page":26,"section":"영재를 위한 학습방식","quote":"영재교육 • 차별화(Differentiated) 교육과정 ‣ 특수교육 • 개별화(Individualized) 교육과정"}},{"id":"45-28","type":"옳지 않은 것","q":"사교육과 선행학습에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["선행학습은 사교육을 통해 가장 쉽게 접할 수 있고 많이 사용되는 방법이다.","선행학습이 어떤 학생에게 적합한지 알기 위해서는 학교와 학원의 진도를 모두 소화할 수 있는지를 따져 보아야 한다.","학교 진도와 학원 진도가 다를 경우 우선순위를 어디에 둘 것인가를 생각해 봐야 한다.","학교 성취도평가나 수행평가에서 일정 수준의 성적을 얻지 못하더라도 학원의 선행 진도는 계속 유지해야 한다.","초등학생이라면 담임선생님과 의논할 필요가 있다."],"answer":4,"explain":"④ 교안: 학교 성취도평가나 수행평가 등에서 일정 수준의 성적을 얻지 못한다면 '학원의 선행 진도를 과감히 포기해야 함'.","source":{"page":27,"section":"사교육과 선행학습","quote":"학교 성취도평가나 수행평가 등에서 일정 수준의 성적을 얻지 못한다면 학원의 선행 진도를 과감히 포기해야 함"}},{"id":"45-29","type":"사례","q":"선행학습을 계속할지 고민하는 학부모에게 교안에 근거하여 조언한 내용으로 옳은 것은?","box":null,"choices":["중학생이라면 학원 레벨테스트 결과만 활용하면 된다.","초등학생이라면 수업시간에 수행하는 것을 지속적으로 관찰한 담임선생님과 의논할 필요가 있다.","초등학생이라면 학원 강사의 판단이 가장 객관적이다.","중학생이라면 상대평가 석차만으로 판단한다.","학교 수업 참여와 관계없이 학원 진도를 우선해야 한다."],"answer":2,"explain":"② 교안 그대로. ①④ 중학생이라면 '절대평가 등급'을 활용 / ③ 수업시간 수행을 지속 관찰한 선생님이 보다 객관적인 정보를 줄 수 있음 / ⑤ 학교 수업에 적극 참여하고 해당 학년 평가에서 일정 수준 성적을 거둔다면 선행학습을 계속하는 것도 도움.","source":{"page":28,"section":"사교육과 선행학습","quote":"중학생이라면 절대평가 등급을 활용할 수 있을 것임 초등학생이라면 담임선생님과 의논할 필요가 있음 수업시간에 수행하는 것을 지속적으로 관찰한 선생님이 보다 객관적인 정보를 줄 수 있음"}},{"id":"45-30","type":"옳은 것","q":"교사와 부모가 함께 생각해야 할 부분에 대한 설명으로 옳은 것은?","box":null,"choices":["우리 아이가 남과 똑같은 재능을 타고났다는 점을 전제로 지도해야 한다.","잘하는 과목과 발달 속도는 모든 아이가 같다.","우리 아이가 남과 똑같은 재능을 타고나지 않았다는 점, 잘하는 과목도 발달 속도도 다 다르다는 점을 인정해야 한다.","부모의 만족을 위해 학원을 강요하는 것은 아이의 학습 동기를 높인다.","아이에게 큰 옷을 입혀 억지로 맞추는 것이 학습 사이즈를 키우는 방법이다."],"answer":3,"explain":"③ 교안 그대로. ④⑤ 교안은 부모 욕심·조바심·만족으로 학원을 강요하거나 아이를 억지로 큰 옷에 맞추려다 '학습조로증', '학습 번아웃증'을 만들고 있지 않은지 생각해 봐야 한다고 함.","source":{"page":29,"section":"교사와 부모가 함께 생각해야 할 부분","quote":"우리 아이가 남과 똑같은 재능을 타고나지 않았다는 점, 잘하는 과목도 발달속도도 다 다르다는 점을 인정해야 함"}},{"id":"45-31","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"아이와 상관없이 부모 욕심에, 부모 조바심에, 부모 만족에 돈 들여 학원을 강요하고 있는 건 아닌지? 아이마다 다른 학습 사이즈에 큰 옷을 입혀 놓고, 아이를 억지로 큰 옷에 맞추려다 아이를 \"(   )\", \"학습 번아웃증\"을 만들고 있지는 않은지를 생각해 봐야 함","choices":["학원순례족","학습무기력증","학습조로증","시험불안증","학습장애"],"answer":3,"explain":"교안: '\"학습조로증\", \"학습 번아웃증\"을 만들고 있지는 않은지'. ① 학원순례족은 학원만 오가며 만족하는 학생.","source":{"page":30,"section":"교사와 부모가 함께 생각해야 할 부분","quote":"아이를 억지로 큰 옷에 맞추려다 아이를 \"학습조로증\", \"학습 번아웃증\"을 만들고 있지는 않은지를 생각해봐야 함"}}]},{"lesson":46,"title":"영재교육 담당교원의 전문성과 자질","file":"4. 교안 (31~60)[1] (1)/46.pdf","summary":["교육의 질은 교사의 질을 넘지 못한다 / 전문성과 자질을 갖춘 교사 양성·배치는 영재교육의 성패를 좌우하는 과제 → 1~5차 교육부 영재교육진흥종합계획의 주요 5대 과제 중 하나","블룸(Bloom): 초·중·고 시절 학교·지역사회에서 가장 훌륭한 스승, 20세 이후 국내외 권위자를 찾아 사사, 스승의 가치관과 정신세계 터득(도제교육) / 교육목표분류학: Remember → Understand → Apply → Analyze → Evaluate → Create","우리나라: 미국·이스라엘·싱가포르처럼 영재교육 담당교사 자격증 제도는 운용하지 않음 / 초·중등 교사자격증을 가진 현직교원이 소정의 연수(기초, 심화, 전문 및 관리자 연수) 후 배치","영재교육진흥법 시행령 제25조(영재학교·영재학급 교원): 박사학위 또는 해당 분야 5년 이상 경력 석사학위 취득자, 해당 분야 특수한 능력 보유자 / 교원의 자격을 가진 자를 우선 임용","시행령 제26조(영재교육원): 원장 및 강사, 설치·운영하는 자가 임용(일부 권한 원장에게 위임 가능), 보수·복무·근무조건도 설치·운영하는 자가 정함","미국: 주에 따라 자격 요구 증가, 지역교육청마다 영재교육 전담 지원 교사 / 영재교육전공 석사(현장 실습 필수), 현직교사 복수전공·부전공 프로그램(실습면제), 교육위원회 인정 연수기관 연수","싱가포르: 전인 성장, 잠재능력 최대 계발, 가족·사회·국가에 책임감을 지닌 건전한 시민 육성 / 예비교사 시절부터 국가가 일괄적·조직적으로 양성·임용·배치·연수 및 관리, 전문가 대우","싱가포르 단계: 1단계 예비교사 선정(교사 목록, 대학 교수·영재교육 실시학교·교사 본인 정보) → 2단계 적합성 평가(인터뷰와 수업평가) → 3단계 영재학급 배치(최소 1년 이상) 후 최종 선발 / 양성, 해외연수","영재교육 담당교사: 더 높은 전문성, 열정, 자신감, 창의성, 독특한 반응을 수용하고 인내하는 자질 / 연수를 받은 교사가 인지적·정의적 측면에서 더 깊이 있는 수업","10가지 능력기준: 기초, 학습자의 발달과 특징, 개인 학습의 차이, 수업전략, 학습환경과 사회적 상호작용, 언어 및 의사소통, 수업계획, 평가, 전문적·윤리적 실천, 협력","핵심역량(류지춘, 2014, 메타분석): 인지적 역량(3)(지식과 이해, 전문성과 교육과정 개발, 연구와 교수) + 정의적 역량(3)(열정과 동기, 소통과 실행, 윤리와 도덕)의 유기적·상보적 복합체"],"questions":[{"id":"46-01","type":"빈칸","q":"영재교육의 성패를 좌우하는 중요한 과제와 관련하여 교안에 제시된 다음 문장의 (   )에 들어갈 말로 알맞은 것은?","box":"교육의 질은 (   )을/를 넘지 못한다.","choices":["교육과정의 질","학생의 질","교사의 질","교육예산","교육시설"],"answer":3,"explain":"교안: '교육의 질은 교사의 질을 넘지 못한다.'","source":{"page":3,"section":"영재교육의 성패를 좌우하는 중요한 과제","quote":"교육의 질은 교사의 질을 넘지 못한다."}},{"id":"46-02","type":"옳은 것","q":"영재교육 담당교원의 양성·배치에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["1~5차 교육부 영재교육진흥종합계획의 주요 5대 과제 중 하나로 선정하여 추진하였다.","1~5차 영재교육진흥종합계획의 3대 과제 중 하나로 추진하였다.","제5차 영재교육진흥종합계획에서 처음으로 과제로 선정되었다.","영재교육의 성패와는 관계가 적은 부수적 과제이다.","과학기술정보통신부의 종합계획 과제로 추진되었다."],"answer":1,"explain":"① 교안 그대로. ② 5대 과제 / ③ 1~5차 모두 / ④ 영재교육의 성패를 좌우하는 중요한 과제 / ⑤ 교육부.","source":{"page":4,"section":"영재교육의 성패를 좌우하는 중요한 과제","quote":"1~5차 교육부 영재교육진흥종합계획의 주요 5대 과제 중 하나로 선정하여 추진"}},{"id":"46-03","type":"옳지 않은 것","q":"'영재교육 담당 교원의 질'과 관련하여 교안이 제기한 질문으로 볼 수 없는 것은?","box":null,"choices":["누가 영재학생들의 영재성과 교육적 요구를 이해하고, 영재교육을 담당할 것인가?","영재교육 담당교원의 보수는 일반 교원보다 얼마나 높아야 하는가?","영재교육을 담당할 교사들은 어떤 자격조건과 전문성 및 자질을 갖추어야 하는가?","세계 각국은 영재교육을 담당할 교사를 어떻게 양성하여 임용하고 배치시키며, 연수를 실시하고 있는가?","우리나라는 이것이 어떻게 이루어지고 있는가?"],"answer":2,"explain":"② 보수 수준에 대한 질문은 교안에 없음. ①③④⑤는 교안이 제기한 질문.","source":{"page":6,"section":"영재교육 담당 교원의 질","quote":"영재교육을 담당할 교사들은 어떤 자격조건과 전문성 및 자질을 갖추어야 하는가?"}},{"id":"46-04","type":"옳지 않은 것","q":"영재교육 담당 교원의 질과 관련하여 교안에 제시된 블룸(Bloom)의 견해로 옳지 않은 것은?","box":null,"choices":["초·중·고 시절에는 학교나 지역사회에서 가장 훌륭한 스승을 찾아야 한다.","20세 이후에는 국내외의 권위자를 찾아 사사해야 한다.","스승을 능가할 수 있을 정도의 기능을 배워야 한다.","스승의 가치관과 정신세계를 몸소 터득해야 한다.","초·중·고 시절부터 국내외 권위자를 찾아 사사해야 한다."],"answer":5,"explain":"⑤ 초·중·고 시절에는 학교나 지역사회에서 가장 훌륭한 스승, 국내외 권위자 사사는 '20세 이후'. 출처: 이신동, 이정규, 박춘성(2020). 최신영재교육학개론(3판).","source":{"page":7,"section":"영재교육 담당 교원의 질 – 블룸 Bloom의 교육목표분류학","quote":"20세 이후에는 국내외의 권위자를 찾아 사사하면서 스승을 능가할 수 있을 정도의 기능을 배워야 함"}},{"id":"46-05","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"스승의 가치관과 정신세계를 몸소 터득해야 함 (   )","choices":["도제교육","협동교육","개별화교육","속진교육","통합교육"],"answer":1,"explain":"교안: '스승의 가치관과 정신세계를 몸소 터득해야 함(도제교육)'.","source":{"page":7,"section":"영재교육 담당 교원의 질 – 블룸 Bloom의 교육목표분류학","quote":"스승의 가치관과 정신세계를 몸소 터득해야 함(도제교육)"}},{"id":"46-06","type":"옳은 것","q":"교안에 제시된 블룸(Bloom)의 교육목표분류학 단계를 하위 단계부터 상위 단계 순으로 바르게 나열한 것은?","box":null,"choices":["Understand – Remember – Apply – Evaluate – Analyze – Create","Remember – Understand – Apply – Analyze – Create – Evaluate","Remember – Apply – Understand – Analyze – Evaluate – Create","Remember – Understand – Analyze – Apply – Evaluate – Create","Remember – Understand – Apply – Analyze – Evaluate – Create"],"answer":5,"explain":"교안 피라미드: 맨 아래 Remember → Understand → Apply → Analyze → Evaluate → 맨 위 Create.","source":{"page":8,"section":"영재교육 담당 교원의 질 – 블룸 Bloom의 교육목표분류학","quote":"Remember Understand Apply Analyze Evaluate Create"}},{"id":"46-07","type":"옳은 것","q":"우리나라 영재교육 담당교원 제도에 대한 설명으로 옳은 것은?","box":null,"choices":["미국, 이스라엘, 싱가포르처럼 영재교육 담당교사 자격증 제도를 운용한다.","영재교육 담당교사는 예비교사 시절부터 국가가 별도로 양성한다.","초·중등 교사자격증을 가진 현직교원이 소정의 연수 이후 영재교육 현장에 배치되도록 규정한다.","영재교육 전공 석사학위가 있어야만 영재교육 현장에 배치된다.","현직교사는 영재교사로 배치될 수 없다."],"answer":3,"explain":"③ 교안 그대로. ① 우리나라는 자격증 제도를 운용하지 않음 / ② 예비교사 시절부터 국가 양성은 싱가포르 / ④⑤ 현직교사 중 기초·심화·전문 및 관리자 연수 등을 통해 양성·배치.","source":{"page":9,"section":"우리나라 영재교육 제도","quote":"초·중등 교사자격증을 가진 현직교원이 소정의 연수 이후, 영재교육 현장에 배치되도록 규정함"}},{"id":"46-08","type":"빈칸","q":"우리나라 영재교육 제도에 관한 다음 설명의 (   )에 들어갈 말로 알맞은 것은?","box":"현직교사 중 (   ) 연수 등을 통해 영재교사를 양성, 배치함","choices":["기초, 심화, 전문 및 관리자","초급, 중급, 고급","1급, 2급 정교사","기본, 응용, 실습","직무, 자격, 특별"],"answer":1,"explain":"교안: '현직교사 중 기초, 심화, 전문 및 관리자 연수 등을 통해 영재교사를 양성, 배치함'.","source":{"page":9,"section":"우리나라 영재교육 제도","quote":"현직교사 중 기초, 심화, 전문 및 관리자 연수 등을 통해 영재교사를 양성, 배치함"}},{"id":"46-09","type":"빈칸","q":"영재교육진흥법 시행령 제25조(영재학교 및 영재학급에 두는 교원의 임용)의 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"1. 박사학위를 취득하거나 해당 분야에 (   ) 이상 경력이 있는 석사학위 취득자로 영재교육을 담당할 능력이 있다고 인정되는 자\n2. 해당 분야에 특수한 능력을 보유하고 있어 영재교육을 담당할 능력이 있다고 인정되는 자","choices":["2년","3년","5년","7년","10년"],"answer":3,"explain":"교안(시행령 제25조): '해당 분야에 5년 이상 경력이 있는 석사학위 취득자'.","source":{"page":10,"section":"영재학교 및 영재학급에 두는 교원의 임용 – 영재교육진흥법 시행령","quote":"박사학위를 취득하거나 해당 분야에 5년 이상 경력이 있는 석사학위 취득자로 영재교육을 담당할 능력이 있다고 인정되는 자"}},{"id":"46-10","type":"옳은 것","q":"영재교육진흥법 시행령 제25조에 따른 영재학교 교원 임용에 대한 설명으로 옳은 것은?","box":null,"choices":["영재학교 교원 임용희망자 중 교원의 자격을 가진 자가 있더라도 박사학위 소지자를 우선 임용해야 한다.","영재학교 교원 임용희망자 중 교원의 자격을 가진 자가 있는 경우, 동등한 수준의 학위와 영재교육능력을 보유한 임용희망자가 있어도 교원의 자격을 가진 자를 우선하여 임용하여야 한다.","교원의 자격이 없는 자는 영재학교 교원으로 임용될 수 없다.","석사학위 취득자는 경력과 관계없이 임용될 수 있다.","해당 분야에 특수한 능력을 보유한 자라도 학위가 없으면 임용할 수 없다."],"answer":2,"explain":"② 교안 그대로. ① 교원의 자격을 가진 자 우선 / ③⑤ 해당 분야에 특수한 능력을 보유하여 영재교육 능력이 인정되는 자도 가능 / ④ 해당 분야 5년 이상 경력이 있는 석사학위 취득자.","source":{"page":10,"section":"영재학교 및 영재학급에 두는 교원의 임용 – 영재교육진흥법 시행령","quote":"그와 동등한 수준의 학위와 영재교육능력을 보유한 영재학교 교원 임용희망자가 있는 경우에도 교원의 자격을 가진 자를 우선하여 임용하여야 한다."}},{"id":"46-11","type":"옳지 않은 것","q":"영재교육진흥법 시행령 제26조(영재교육원에 두는 교원의 임용)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재교육원의 교원으로 원장 및 강사를 둔다.","해당 분야에 특수한 능력을 보유하고 있어 영재교육을 담당할 능력이 있다고 인정되는 자를 강사로 임용할 수 있다.","영재교육원의 원장 및 강사는 영재교육원을 설치·운영하는 자가 임용한다.","임용 권한의 일부를 영재교육원의 원장에게 위임할 수 있다.","영재교육원 원장 및 강사의 보수·복무 및 근무조건 등은 교육부장관이 정한다."],"answer":5,"explain":"⑤ 제26조 ④: 보수·복무 및 근무조건 등에 관하여 필요한 사항은 '영재교육원을 설치·운영하는 자'가 정한다.","source":{"page":11,"section":"영재교육원에 두는 교원의 임용 – 영재교육진흥법 시행령","quote":"영재교육원의 원장 및 강사의 보수·복무 및 근무조건 등에 관하여 필요한 사항은 영재교육원을 설치·운영하는 자가 정한다."}},{"id":"46-12","type":"옳은 것","q":"미국 영재교사 자격증 제도에 대한 설명으로 옳은 것은?","box":null,"choices":["연방정부가 모든 주에 동일한 영재교사 자격증을 요구한다.","주에 따라 자격증이나 인정기준과 같은 소정의 자격을 요구하는 주가 증가하고 있다.","자격증 제도를 운용하는 주가 감소하고 있다.","지역교육청에는 영재교육만 전담 지원하는 교사가 없다.","우리나라와 같이 자격증 제도 없이 연수만으로 배치한다."],"answer":2,"explain":"② 교안 그대로. ④ 지역교육청(Educational District)마다 영재교육만 전담 지원하는 교사가 있음 / ⑤ 우리나라는 자격증 제도 미운용, 미국은 운용.","source":{"page":12,"section":"미국 영재교사자격증 제도","quote":"주에 따라 자격증이나 인정기준과 같은 소정의 자격을 요구하는 주가 증가하고 있음 지역교육청(Educational District)마다 영재교육만 전담 지원하는 교사가 있음"}},{"id":"46-13","type":"옳지 않은 것","q":"미국의 영재교사 자격증 취득 경로에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["대학원에서 영재교육 과목을 수강하여 자격증을 취득할 수 있다.","영재교육전공 석사 과정 등록·과목 수강, 현장 실습(필수) 후 영재전공 교사 자격증을 취득한다.","현직교사의 경우 영재교육 복수전공·부전공 자격증 프로그램을 이수하며 현장 실습이 필수이다.","현직교사는 교육위원회가 인정하는 교사 연수기관에서 일정 시간의 연수를 받고 영재교사 자격증을 취득할 수 있다.","석사 과정 경로에서는 현장 실습이 필수이다."],"answer":3,"explain":"③ 현직교사의 영재교육 복수전공·부전공 자격증 프로그램 이수는 '실습면제'. 석사 과정은 현장 실습 필수.","source":{"page":13,"section":"미국 영재교사자격증 제도","quote":"현직 교사의 경우 영재교육 복수전공·부전공 자격증 프로그램 이수(실습면제)"}},{"id":"46-14","type":"빈칸","q":"싱가포르 영재교육의 목표에 관한 다음 문장의 (   )에 들어갈 말로 알맞은 것은?","box":"영재교육의 목표는 전인으로 성장하고 자신의 잠재능력을 최대한 계발하여 가족, 사회, 국가에 대한 책임감을 지니는 (   )의 육성이다.","choices":["창의적 인재","건전한 시민","글로벌 리더","과학기술 인재","융합형 인재"],"answer":2,"explain":"교안: '가족, 사회, 국가에 대한 책임감을 지니는 건전한 시민의 육성이다.'","source":{"page":14,"section":"싱가포르 영재교육 제도","quote":"가족, 사회, 국가에 대한 책임감을 지니는 건전한 시민의 육성이다."}},{"id":"46-15","type":"개념 찾기","q":"다음 설명에 해당하는 국가의 영재교육 담당교원 제도는?","box":"국가에서 일괄적이고 조직적으로 영재교육을 담당할 우수한 교사를 예비교사 시절부터 양성·임용·배치·연수 및 관리하며, 전문가로 대우함","choices":["우리나라","미국","싱가포르","이스라엘","핀란드"],"answer":3,"explain":"교안의 싱가포르 영재교육 제도 설명. ① 우리나라는 현직교원 연수 후 배치 / ② 미국은 주별 자격증·인정기준, 대학원·연수기관을 통한 자격 취득.","source":{"page":15,"section":"싱가포르 영재교육 제도","quote":"국가에서 일괄적이고 조직적으로 영재교육을 담당할 우수한 교사를 예비교사 시절부터 양성·임용·배치·연수 및 관리, 전문가 대우"}},{"id":"46-16","type":"옳지 않은 것","q":"싱가포르 영재교육 제도의 1단계(영재교육 담당 예비교사 선정)에서 정보를 수집하는 방법으로 교안에 제시되지 않은 것은?","box":null,"choices":["영재교육에 적합한 자질과 능력을 갖춘 교사 목록을 작성함","국립대학 및 여러 대학의 교수들로부터 우수한 자질을 갖춘 교사에 관한 정보를 수집함","영재교육 실시학교나 영재교육과에서 정보를 수집함","영재교육에 참여하고 싶은 교사에게서 직접 제공되는 정보를 수집함","영재학생의 학부모로부터 추천을 받아 정보를 수집함"],"answer":5,"explain":"⑤ 학부모 추천은 교안에 없음. ①~④는 1단계 내용.","source":{"page":16,"section":"1단계: 영재교육 담당 예비교사 선정 – 싱가포르 영재교육 제도","quote":"국립대학 및 여러 대학의 교수들로부터 우수한 자질을 갖춘 교사에 관한 정보를 수집함"}},{"id":"46-17","type":"옳은 것","q":"싱가포르 영재교육 담당교원의 선발·양성 단계에 대한 설명으로 옳은 것은?","box":null,"choices":["2단계 적합성 평가는 필기시험으로만 이루어진다.","3단계에서 영재학급에 최소 6개월 이상 배치한 후 최종 선발한다.","2단계 적합성 평가는 인터뷰와 수업평가로 이루어지며, 3단계에서 영재학급에 최소 1년 이상 배치한 후 최종 선발한다.","1단계에서 영재학급에 배치한 후 2단계에서 예비교사를 선정한다.","해외연수는 최종 선발 전 1회에 한하여 실시한다."],"answer":3,"explain":"③ 교안 그대로. ① 인터뷰와 수업평가 / ② 최소 1년 이상 / ④ 1단계 예비교사 선정 → 2단계 적합성 평가 → 3단계 영재학급 배치 후 최종 선발 / ⑤ 해외연수: 해마다 영재교육 프로그램 콘퍼런스에 참여, 해외 프로그램에 참가.","source":{"page":17,"section":"싱가포르 영재교육 제도","quote":"2단계: 적합성 평가 인터뷰와 수업평가 / 3단계: 영재학급 배치(최소 1년 이상) 후 최종 선발"}},{"id":"46-18","type":"옳지 않은 것","q":"영재교육을 담당하는 교사의 중요성에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재교육을 담당하는 교사들은 더 높은 전문성을 가져야 한다.","더 높은 열정, 자신감, 창의성이 필요하다.","학생의 독특한 반응을 수용하고 인내할 수 있는 자질을 필요로 한다.","영재교육 관련 연수를 받은 교사들이 영재학생의 인지적·정의적 측면에서 더 깊이 있는 수업을 수행하고 있음이 밝혀졌다.","영재교육 관련 연수를 받은 교사와 그렇지 않은 교사의 수업에는 차이가 없는 것으로 밝혀졌다."],"answer":5,"explain":"⑤ 교안: 비교연구에서 영재교육 관련 연수를 받은 교사들이 인지적·정의적 측면에서 더 깊이 있는 수업을 수행하고 있음이 밝혀짐.","source":{"page":19,"section":"영재교육을 담당하는 교사의 중요성","quote":"영재교육 관련 연수를 받은 교사들이 영재학생의 인지적·정의적 측면에서 더 깊이 있는 수업을 수행하고 있음이 밝혀짐"}},{"id":"46-19","type":"옳지 않은 것","q":"영재교육 담당교사의 10가지 능력기준에 해당하지 않는 것은?","box":null,"choices":["학습자의 발달과 특징","개인 학습의 차이","학교 행정 및 예산 관리","학습환경과 사회적 상호작용","전문적, 윤리적 실천"],"answer":3,"explain":"10가지 능력기준: 기초, 학습자의 발달과 특징, 개인 학습의 차이, 수업전략, 학습환경과 사회적 상호작용, 언어 및 의사소통, 수업계획, 평가, 전문적·윤리적 실천, 협력. ③은 없음.","source":{"page":20,"section":"10가지 능력기준","quote":"개인 학습의 차이 전문적, 윤리적 실천 / 수업전략 평가 / 학습자의 발달과 특징 협력"}},{"id":"46-20","type":"빈칸","q":"영재교육 담당교원의 핵심역량에 관한 다음 설명의 (가), (나)에 들어갈 말로 알맞은 것은?","box":"영재교육 담당교원에 대한 선행연구들을 (가)을/를 통해 연구한 결과, 영재교육 담당교원의 핵심역량은 인지적 역량(3)과 (나) 역량(3)이 유기적으로 상보적 작용을 하는 복합체 (출처: 류지춘, 2014)","choices":["(가) 메타분석 – (나) 정의적","(가) 델파이 조사 – (나) 정의적","(가) 메타분석 – (나) 사회적","(가) 사례연구 – (나) 행정적","(가) 실험연구 – (나) 신체적"],"answer":1,"explain":"교안: 메타분석을 통해 연구한 결과, 인지적 역량(3)과 정의적 역량(3)이 유기적으로 상보적 작용을 하는 복합체.","source":{"page":21,"section":"영재교육 담당 교원의 핵심역량","quote":"영재교육 담당교원에 대한 선행연구들을 메타분석을 통해 연구한 결과, 영재교육 담당교원의 핵심역량은 인지적 역량(3)과 정의적 역량(3)이 유기적으로 상보적 작용을 하는 복합체"}},{"id":"46-21","type":"보기 조합","q":"영재교육 담당교원의 핵심역량 중 '정의적 역량'에 해당하는 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 영재학생과 영재성에 대한 지식과 이해\nㄴ. 정보공유와 유기적 협력을 위한 소통과 실행\nㄷ. 창의적 연구와 교수\nㄹ. 사회적 가치와 정의를 중시하는 윤리와 도덕\nㅁ. 영재교육에 대한 열정과 동기","choices":["ㄱ, ㄴ, ㄷ","ㄴ, ㄹ, ㅁ","ㄱ, ㄷ, ㅁ","ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄹ"],"answer":2,"explain":"정의적 역량: 영재교육에 대한 열정과 동기, 정보공유와 유기적 협력을 위한 소통과 실행, 사회적 가치와 정의를 중시하는 윤리와 도덕(ㄴ·ㄹ·ㅁ). 인지적 역량: 영재학생과 영재성에 대한 지식과 이해, 해당교과에 대한 전문성과 교육과정 개발, 창의적 연구와 교수(ㄱ·ㄷ).","source":{"page":22,"section":"영재교육 담당 교원의 핵심역량","quote":"영재교육에 대한 열정과 동기 ‣ 정보공유와 유기적 협력을 위한 소통과 실행 ‣ 사회적 가치와 정의를 중시하는 윤리와 도덕"}},{"id":"46-22","type":"옳은 것","q":"영재교육 담당교원의 핵심역량 중 '인지적 역량'에 해당하는 것은?","box":null,"choices":["영재교육에 대한 열정과 동기","사회적 가치와 정의를 중시하는 윤리와 도덕","정보공유와 유기적 협력을 위한 소통과 실행","해당교과에 대한 전문성과 교육과정 개발","학생의 독특한 반응에 대한 인내"],"answer":4,"explain":"④ 인지적 역량(영재학생과 영재성에 대한 지식과 이해, 해당교과에 대한 전문성과 교육과정 개발, 창의적 연구와 교수). ①②③은 정의적 역량 / ⑤ 핵심역량 항목이 아님.","source":{"page":22,"section":"영재교육 담당 교원의 핵심역량","quote":"인지적 역량 ‣ 영재학생과 영재성에 대한 지식과 이해 ‣ 해당교과에 대한 전문성과 교육과정 개발 ‣ 창의적 연구와 교수"}}]},{"lesson":47,"title":"중복 낙인 영재는 어떻게 교육하나?","file":"4. 교안 (31~60)[1] (1)/47.pdf","summary":["6가지 유형의 영재 프로파일: 성공적인(successful), 자율적인 학습자(autonomous learner), 잠복되어 있는(underground), 중도 탈락(dropouts), 중복 낙인(double-labeled), 도전적인(challenging) 영재 (이신동·이정규·박춘성, 2020)","중복낙인영재: 장애를 가진 영재·발달장애·학습장애아로 간주되는 경향 높음 / 우리나라는 판별·선발 여건, 차별화된 교육프로그램 미비 / 전체 학생 중 약 1.5%만 영재교육대상자","학교 시스템은 결점에만 초점 → 영재성 계발 실패 경향 / 낙심·좌절·무기력·고독","데이비스와 림(1998): 미국 1970년대까지 장애와 영재 배타적 → 1995년 이후 교차·중복 영역 인정, 연구 촉발 / 갤러거(Gallagher): 중복 낙인·양면 특수아(twice exceptional) 용어 최초 사용","미국: 법 개정으로 장애를 지닌 영재집단을 특별한 도움이 필요한 집단에 포함","영재발달센터(Gifted Development Center) 5구분: 감각통합장애, ADHD, 청각 및 시각장애, 난독증, 공간지각장애","청각장애 영재 = 얼굴과 입술로 말 이해 / 시각장애 영재 = 높은 언어적인 능력으로 장애 감춤","중복낙인영재는 일반 영재와 달리 학업성취도·지능·창의성·사회성 낮거나 정서적 불안정 경우 많음","학습장애영재: 읽기·쓰기 문제, 낮은 자아존중감, 영재·장애 프로그램 어느 하나에도 포함 못 됨 / '미성취 영재' 용어 선호(미(未)= 잠재력은 있으나 아직 이루어지지 않은 상태)","ADHD 영재 과잉행동 5양태: 정신운동, 감각적 행동, 지적인 행동, 상상력, 감정적인 반응","아스퍼거증후군: 자폐증의 변형, 오스트리아 의사 한스 아스퍼거 1944년 / 감정이입 부족, 단조로운 언어, 융통성 없는 사고","장애가 영재성을, 영재성이 장애를 가릴 수 있음 → 주의 깊은 관찰·판별 필요 / 기관 설립·판별 도구·프로그램 개발이 시급한 과제"],"questions":[{"id":"47-01","type":"사례","q":"다음은 교안의 '영재에 대한 의문'에서 제시된 사례이다. (   )에 들어갈 영화 제목으로 알맞은 것은?","box":"영화 '(   )'처럼 한 번 본 전화번호부는 복사하듯이 말하는데, 공부에는 전혀 흥미가 없는 사람은 왜 그럴까?","choices":["뷰티풀 마인드","굿 윌 헌팅","포레스트 검프","레인맨","이미테이션 게임"],"answer":4,"explain":"④ 교안은 영화 '레인맨'처럼 한 번 본 전화번호부를 복사하듯 말하지만 공부에는 흥미가 없는 사람을 예로 들며, 현재 우리나라 영재 선발방식으로 이런 영재들이 선발·교육될 수 있는지 의문을 제기한다. ①②③⑤는 교안에 제시되지 않은 영화이다.","source":{"page":3,"section":"01. 중복 낙인 영재 - 영재에 대한 의문","quote":"영화 '레인맨'처럼 한 번 본 전화번호부는 복사하듯이 말하는데, 공부에는 전혀 흥미가 없는 사람은 왜 그럴까?"}},{"id":"47-02","type":"옳지 않은 것","q":"교안에 제시된 6가지 유형의 영재 프로파일에 해당하지 않는 것은?","box":null,"choices":["성공적인(successful) 영재","잠복되어 있는(underground) 영재","중도 탈락(dropouts) 영재","도전적인(challenging) 영재","창의적인(creative) 영재"],"answer":5,"explain":"⑤ 6가지 유형은 성공적인(successful), 자율적인 학습자(autonomous learner), 잠복되어 있는(underground), 중도 탈락(dropouts), 중복 낙인(double-labeled), 도전적인(challenging) 영재이다. '창의적인 영재'는 포함되지 않는다. ①②③④는 모두 6가지 유형에 해당한다.","source":{"page":4,"section":"중복 낙인 영재","quote":"6 가지 유형의 영재 프로파일 중 중복 낙인(double-labeled) 영재 / 잠복되어 있는(underground) 영재 / 성공적인(successful) 영재 자율적인 학습자(autonomous learner) 영재 / 중도탈락(dropouts) 영재 중복 낙인(double-labeled) 영재 도전적인(challenging) 영재"}},{"id":"47-03","type":"개념 찾기","q":"6가지 유형의 영재 프로파일 중 영문 'autonomous learner'에 해당하는 유형은?","box":null,"choices":["성공적인 영재","잠복되어 있는 영재","자율적인 학습자 영재","도전적인 영재","중도 탈락 영재"],"answer":3,"explain":"③ autonomous learner = 자율적인 학습자 영재. ① 성공적인 = successful, ② 잠복되어 있는 = underground, ④ 도전적인 = challenging, ⑤ 중도 탈락 = dropouts. 출처는 이신동, 이정규, 박춘성(2020). 최신영재교육학개론(3판).","source":{"page":4,"section":"중복 낙인 영재","quote":"자율적인 학습자(autonomous learner) 영재"}},{"id":"47-04","type":"옳은 것","q":"교안에서 설명한 중복낙인영재에 대한 설명으로 옳은 것은?","box":null,"choices":["우리나라 영재교육기관에는 중복낙인영재의 심리적 특성이나 교육적 욕구를 판별하여 선발하는 여건이 마련되어 있다.","우리나라는 중복낙인영재를 통합하는 차별화된 교육프로그램을 충분히 제공하고 있다.","신체적 또는 정서적 장애를 가진 영재로 간주되거나 발달장애 또는 학습장애아로 간주되는 경향이 높다.","장애가 드러나지 않고 일반 영재로만 간주되는 경향이 높다.","발달장애나 학습장애아로 간주되는 경향은 낮다."],"answer":3,"explain":"③ 교안 그대로이다. ①② 교안은 판별·선발 여건이 마련되어 있지 않고, 차별화된 교육프로그램도 제공하지 못하고 있다고 했다. ④⑤ 중복낙인영재는 장애를 가진 영재로 간주되거나 발달장애·학습장애아로 간주되는 경향이 높다.","source":{"page":5,"section":"중복 낙인 영재는?","quote":"신체적 또는 정서적 장애를 가진 영재로 간주되거나 발달장애 또는 학습장애아로 간주되는 경향이 높음"}},{"id":"47-05","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"현재 우리나라는 전체 학생 중에 약 (   )만이 영재교육대상자로 선정되어 교육받고 있기 때문에, 국가와 지자체가 중복낙인영재에게 제대로 된 영재교육을 제공하기에는 현실적인 어려움이 많이 보임","choices":["0.5%","1%","2.5%","1.5%","3%"],"answer":4,"explain":"④ 교안은 전체 학생 중 약 1.5%만이 영재교육대상자로 선정되어 교육받고 있어 중복낙인영재에게 제대로 된 영재교육을 제공하기 어렵다고 했다. ①②③⑤는 교안 수치(1.5%)와 다르다.","source":{"page":6,"section":"중복 낙인 영재는?","quote":"현재 우리나라는 전체 학생 중에 약 1.5% 만이 영재교육대상자로 선정되어 교육받고 있기 때문에"}},{"id":"47-06","type":"옳지 않은 것","q":"학교에서의 중복낙인영재에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["학교에서 영재로 보이는 행동이 나타나지 않는다.","낙심, 좌절, 무기력, 고독을 느낀다.","영재라기보다는 보통 또는 장애아로 인식되거나 치료를 받아야 하는 대상으로 여겨진다.","학교 시스템은 그들의 영재성에만 초점을 두어 결점을 보완하는 데 실패하는 경향이 높다.","영재교육에서 무시되고 있다."],"answer":4,"explain":"④ 반대 서술이다. 교안은 학교 시스템이 그들의 '결점'에만 초점을 두며 그들이 지닌 '영재성 계발'에 실패하는 경향이 높다고 했다. ①②③⑤는 교안 내용과 일치한다.","source":{"page":7,"section":"중복 낙인 영재는?","quote":"학교 시스템은 그들의 결점에만 초점을 두며 그들이 지닌 영재성 계발에 실패하는 경향이 높음"}},{"id":"47-07","type":"빈칸","q":"데이비스와 림(Davis \u0026 Rimm, 1998)의 연구 내용이다. (가), (나)에 들어갈 말로 알맞은 것은?","box":"미국에서 (가)까지는 장애와 영재를 서로 배타적인 것으로 간주하였지만, (나) 이후에는 장애와 영재성이 교차 또는 중복되는 영역이 있는 것으로 알려지면서 관련 연구가 촉발됨","choices":["(가) 1960년대 (나) 1990년","(가) 1970년대 (나) 1990년","(가) 1980년대 (나) 1995년","(가) 1980년대 (나) 2000년","(가) 1970년대 (나) 1995년"],"answer":5,"explain":"⑤ 교안: 미국에서 1970년대까지는 장애와 영재를 배타적으로 보았으나 1995년 이후 교차·중복 영역이 알려지며 연구가 촉발됨. ① 1960년대·1990년 → X, ② 1990년 → 1995년, ③ 1980년대 → 1970년대, ④ 1980년대·2000년 → X.","source":{"page":8,"section":"중복 낙인 영재에 대한 연구","quote":"미국에서 1970년대까지는 장애와 영재를 서로 배타적인 것으로 간주하였지만, 1995년 이후에는 장애와 영재성이 교차 또는 중복되는 영역이 있는 것으로 알려지면서 관련 연구가 촉발됨"}},{"id":"47-08","type":"개념 찾기","q":"중복 낙인(double-labeled) 또는 양면 특수아(twice exceptional)라는 학술적 용어를 처음으로 사용한 학자는?","box":null,"choices":["데이비스(Davis)","갤러거(Gallagher)","림(Rimm)","한스 아스퍼거(Hans Asperger)","엘빈 토플러"],"answer":2,"explain":"② 교안: 갤러거(Gallagher)가 '중복 낙인(doubl-labeld) 또는 양면 특수아(twice exceptional)'라는 학술적 용어를 처음으로 사용함. ①③ 데이비스와 림(1998)은 1970년대~1995년 이후 연구 흐름을 정리한 연구로 제시됨. ④ 아스퍼거 증후군을 1944년 처음 제기한 의사. ⑤ 무관.","source":{"page":8,"section":"중복 낙인 영재에 대한 연구","quote":"갤러거(Gallagher) ‣ 중복 낙인(doubl-labeld) 또는 양면 특수아(twice exceptional)라는 학술적 용어를 처음으로 사용함"}},{"id":"47-09","type":"옳은 것","q":"미국의 중복낙인영재 관련 동향에 대한 설명으로 옳은 것은?","box":null,"choices":["법 개정을 통하여 장애를 지닌 영재집단을 특별한 도움이 필요한 집단에 포함시켰다.","법 개정을 통하여 장애를 지닌 영재집단을 영재교육 대상에서 제외하였다.","중복낙인영재에 대한 연구는 점차 감소하는 추세에 있다.","법 개정 없이 학교 자율로만 장애를 지닌 영재를 지원하고 있다.","장애와 영재성은 교차하는 영역이 없다는 입장을 현재까지 유지하고 있다."],"answer":1,"explain":"① 교안 그대로이다. ②④ 법 개정을 통해 특별한 도움이 필요한 집단에 '포함'시켰다. ③ 연구도 점차 '증가'하는 추세이다. ⑤ 1995년 이후 장애와 영재성이 교차·중복되는 영역이 있는 것으로 알려졌다.","source":{"page":9,"section":"중복 낙인 영재에 대한 연구","quote":"미국의 경우 법 개정을 통하여 장애를 지닌 영재집단을 특별한 도움이 필요한 집단에 포함시켰고, 연구도 점차 증가하는 추세에 있음"}},{"id":"47-10","type":"옳지 않은 것","q":"미국의 영재발달센터(Gifted Development Center)가 구분한 중복낙인영재집단 다섯 가지에 해당하지 않는 것은?","box":null,"choices":["자폐 스펙트럼장애","감각통합장애","주의력 결핍 과잉행동장애","난독증","공간지각장애"],"answer":1,"explain":"① 영재발달센터의 다섯 가지 구분은 감각통합장애, 주의력 결핍 과잉행동장애, 청각 및 시각장애, 난독증, 공간지각장애이다. 자폐 스펙트럼장애는 이 다섯 가지에 포함되지 않는다(중복낙인영재 특성 설명에는 등장). ②③④⑤는 다섯 가지에 포함된다.","source":{"page":10,"section":"미국의 중복 낙인 영재 교육","quote":"중복 낙인 영재집단을 아래 다섯 가지로 구분 / • 감각통합장애 • 주의력 결핍 과잉행동장애 • 청각 및 시각장애 • 난독증 • 공간지각장애"}},{"id":"47-11","type":"개념 찾기","q":"중복낙인영재집단을 감각통합장애, 주의력 결핍 과잉행동장애, 청각 및 시각장애, 난독증, 공간지각장애의 다섯 가지로 구분한 미국의 전문기관은?","box":null,"choices":["미국 교육부","영재발달센터(Gifted Development Center)","국립영재연구센터","영재교육진흥원","한국교육개발원"],"answer":2,"explain":"② 교안: 미국의 전문기관인 영재발달센터(Gifted Development Center)가 중복 낙인 영재집단을 다섯 가지로 구분. ①③④⑤는 교안에서 이 구분의 주체로 제시되지 않았다.","source":{"page":10,"section":"미국의 중복 낙인 영재 교육","quote":"미국의 전문기관인 영재발달센터 ‣ Gifted Development Center ‣ 중복 낙인 영재집단을 아래 다섯 가지로 구분"}},{"id":"47-12","type":"개념 찾기","q":"다음 설명에 해당하는 중복낙인영재 유형은?","box":"• 글을 쓴다거나 그림을 그릴 때 사용하는 미세한 운동기능\n• 자전거를 타거나 공을 잡을 때 사용하는 대근육의 운동기능\n• 소리, 빛, 냄새, 맛 등에 대한 반응 등의 감각양태장애를 포함함","choices":["난독증","공간지각장애","감각통합장애","주의력 결핍 과잉행동장애","청각 및 시각장애"],"answer":3,"explain":"③ 미세한 운동기능, 대근육의 운동기능, 소리·빛·냄새·맛 등에 대한 감각양태장애를 포함하는 것은 감각통합장애이다. ①②④⑤는 영재발달센터 다섯 구분 중 다른 유형이다.","source":{"page":11,"section":"미국의 중복 낙인 영재 교육 - 감각통합장애","quote":"글을 쓴다거나 그림을 그릴 때 사용하는 미세한 운동기능 • 자전거를 타거나 공을 잡을 때 사용하는 대근육의 운동기능 • 소리, 빛, 냄새, 맛 등에 대한 반응 등의 감각양태장애를 포함함"}},{"id":"47-13","type":"옳은 것","q":"청각 혹은 시각장애 영재에 대한 설명으로 옳은 것은?","box":null,"choices":["신체적인 결함과 영재성이 동시에 나타나는 경우는 드물다.","시각장애는 청각장애와 달리 장애를 감출 수 없다.","청각장애 영재는 높은 언어적인 능력으로 상대방을 보면서 말할 수 있어 장애를 감춘다.","시각장애 영재는 얼굴과 입술을 통하여 상대방의 말을 이해할 수 있어 장애를 감춘다.","영재성은 심각한 청각장애를 감출 수 있다."],"answer":5,"explain":"⑤ 교안 그대로이다. ① 신체적인 결함과 영재성을 '동시에 보임'. ② 시각장애 또한 청각장애와 '마찬가지로' 장애를 감출 수 있다. ③④ 설명이 뒤바뀌었다. 청각장애 → 얼굴과 입술을 통해 상대방의 말을 이해, 시각장애 → 높은 언어적인 능력으로 상대방을 보면서 말함.","source":{"page":12,"section":"미국의 중복 낙인 영재 교육 - 청각 혹은 시각장애 영재","quote":"영재성은 심각한 청각장애를 감출 수 있음"}},{"id":"47-14","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"시각장애 또한 청각장애와 마찬가지로 장애를 감출 수 있는데, 높은 (   )으로 상대방을 보면서 말할 수 있기 때문","choices":["언어적인 능력","공간지각 능력","운동 능력","기억력","청각 능력"],"answer":1,"explain":"① 교안: 시각장애 영재는 높은 언어적인 능력으로 상대방을 보면서 말할 수 있어 장애를 감출 수 있다. ②③④⑤는 교안 표현과 다르다.","source":{"page":12,"section":"미국의 중복 낙인 영재 교육 - 청각 혹은 시각장애 영재","quote":"시각장애 또한 청각장애와 마찬가지로 장애를 감출 수 있는데, 높은 언어적인 능력으로 상대방을 보면서 말할 수 있기 때문"}},{"id":"47-15","type":"옳지 않은 것","q":"중복낙인영재의 특성에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["장애는 반드시 한 가지만 가지고 있는 경우를 말한다.","지능, 창의성, 예술적 재능, 음악적 재능, 운동 능력 등 한 분야에서 뛰어난 영재성을 지니고 있다.","기초학습장애, 언어 장애, 자폐 스펙트럼장애, ADHD, 틱장애 등을 가질 수 있다.","감각 처리장애나 신체적 장애를 가질 수 있다.","특정 영역에서 높은 수준의 수행을 보이는 특별한 잠재력을 지닌 영재를 말한다."],"answer":1,"explain":"① 교안은 여러 장애를 '하나 혹은 중복으로' 가지고 있다고 했다. ②③④⑤는 교안 내용과 일치한다.","source":{"page":13,"section":"중복 낙인 영재의 특성","quote":"기초학습장애, 언어 장애, 자폐 스펙트럼장애, 주의력 결핍 과잉행동장애(ADHD), 틱장애, 감각 처리장애, 신체적 장애 등을 하나 혹은 중복으로 가지고 있음"}},{"id":"47-16","type":"옳은 것","q":"일반 영재와 비교한 중복낙인영재의 특성으로 옳은 것은?","box":null,"choices":["지능이 낮거나 지능의 일부 영역에서 발달이 지연된 경우가 많다.","일반 영재와 마찬가지로 학업성취도가 뛰어난 경우가 많다.","일반 영재보다 창의성이 뛰어난 경우가 많다.","학업부진을 보이는 경우는 거의 없다.","창의적인 표현이 제한되는 경우는 드물다."],"answer":1,"explain":"① 교안 그대로이다. ②④ 중복낙인영재는 학업성취도가 낮거나 학업부진을 보이는 경우가 많다. ③⑤ 창의성이 낮거나 창의적인 표현이 제한된 경우가 많다.","source":{"page":14,"section":"중복 낙인 영재들이 지닌 영재성","quote":"중복 낙인 영재의 경우, 지능이 낮거나 지능의 일부 영역에서 발달이 지연된 경우가 많음"}},{"id":"47-17","type":"옳지 않은 것","q":"중복낙인영재의 사회성 및 정서적 특성에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["사회성이 낮거나 사회성과 학업성취도 사이의 갈등을 경험하는 경우가 많다.","정서적 어려움은 가정환경과는 무관하게 장애 요인만으로 발생한다.","일반 영재는 일반적으로 사회성이 뛰어나다.","일반 영재는 일반적으로 정서적으로 안정적이지만, 중복낙인영재는 정서적으로 불안정한 경우가 많다.","정서적 어려움은 학습장애, 언어 장애, 신체적 장애 등의 요인으로 발생할 수 있다."],"answer":2,"explain":"② 교안은 정서적 어려움이 학습장애, 언어 장애, 신체적 장애, '가정환경' 등의 다양한 요인으로 인해 발생할 수 있다고 했다. ①③④⑤는 교안 내용과 일치한다.","source":{"page":15,"section":"중복 낙인 영재들이 지닌 영재성","quote":"정서적 어려움은 학습장애, 언어 장애, 신체적 장애, 가정환경 등의 다양한 요인으로 인해 발생할 수 있음"}},{"id":"47-18","type":"옳지 않은 것","q":"학습장애영재의 특성으로 옳지 않은 것은?","box":null,"choices":["학습장애와 영재성의 중복 낙인을 보이는 아동을 지칭한다.","높은 자아존중감을 지니고 있다.","학교 수업에 집중하지 못하고, 기본적인 읽기 및 쓰기에 문제를 보인다.","또래관계가 원활하지 못하다.","학교를 싫어하고, 그로 인해 학교에서 실패하는 특성을 보인다."],"answer":2,"explain":"② 교안은 학습장애영재가 '낮은' 자아존중감을 지니고 있다고 했다. ①③④⑤는 교안 내용과 일치한다.","source":{"page":17,"section":"02. 중복 낙인 영재와 영재교육 - 학습장애 영재","quote":"또래관계가 원활하지 못하고, 낮은 자아존중감을 지니고 있으며, 학교를 싫어하고, 그로 인해 학교에서 실패하는 특성을 보임"}},{"id":"47-19","type":"보기 조합","q":"학습장애영재에 대한 설명으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 우수한 어휘력, 문제 해결 기술을 지니고 있다.\nㄴ. 영재 프로그램과 장애 프로그램 모두에 포함되는 경우가 많다.\nㄷ. 자신의 영재성이 있는 분야의 교육을 받게 되면 긍정적인 학습 특성을 보인다.\nㄹ. 학교에서 아무런 교육적 처치를 받지 못해도 문제행동은 거의 보이지 않는다.","choices":["ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄷ"],"answer":5,"explain":"⑤ ㄱ·ㄷ은 교안과 일치. ㄴ: 이러한 특징으로 인해 영재 프로그램과 장애 프로그램 중 '어느 하나에도 포함되지 못함'. ㄹ: 교육적 처치를 받지 못하면 '많은 문제행동을 보임'(Cooper, Baum, \u0026 Neu, 2004). 따라서 ①②③④는 틀리다.","source":{"page":18,"section":"02. 중복 낙인 영재와 영재교육 - 학습장애 영재","quote":"학습장애영재들은 자신의 영재성이 있는 분야의 교육을 받게 되면 긍정적인 학습 특성을 보이지만, 학교에서 아무런 교육적 처치를 받지 못하면 많은 문제행동을 보임(Cooper, Baum, \u0026 Neu, 2004)"}},{"id":"47-20","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재교육에서는 미성취영재라는 용어를 더 많이 사용하는 경향이 있으며, 이때 '미(未)'는 '(   )'를 의미함","choices":["잠재력이 없어 성취가 불가능한 상태","성취하였으나 인정받지 못한 상태","잠재력은 있으나, 아직 일이 이루어지지 않은 상태","장애로 인해 성취가 영구히 제한된 상태","성취 동기가 결여된 상태"],"answer":3,"explain":"③ 교안: '미(未)'는 '잠재력은 있으나, 아직 일이 이루어지지 않은 상태'를 의미하며, 언젠가 성취의 상태로 갈 수 있다는 뜻을 내포한다. ①②④⑤는 교안 정의와 다르다.","source":{"page":19,"section":"02. 중복 낙인 영재와 영재교육 - 학습장애 영재와 미성취 영재","quote":"“미(未)”는 “잠재력은 있으나, 아직 일이 이루어지지 않은 상태”를 의미함"}},{"id":"47-21","type":"옳은 것","q":"학습장애영재와 미성취영재에 대한 설명으로 옳은 것은?","box":null,"choices":["영재교육에서는 '미성취영재'보다 '학습장애영재'라는 용어를 더 많이 사용한다.","학습장애영재는 영문으로 'Gifted and Learning Disability(GLD)'로 표기된다.","'미성취 영재'보다는 '학습장애 영재'라는 용어를 사용하는 것이 바람직하다는 의견이 많다.","두 용어는 영재교육에서 엄격히 구분되어 혼재되어 사용되지 않는다.","'미(未)'는 언젠가 성취의 상태로 갈 수 없다는 뜻을 내포한다."],"answer":2,"explain":"② 교안: 학습장애영재(Gifted and Learning Disability: GLD), 미성취영재(gifted and underachieve). ①③ 반대다. 영재교육에서는 '미성취영재'를 더 많이 사용하며, '미성취 영재'라는 용어가 바람직하다는 의견이 많다. ④ 두 용어는 혼재되어 사용되기도 한다. ⑤ 언젠가 성취의 상태로 갈 수 있다는 뜻을 내포한다.","source":{"page":19,"section":"02. 중복 낙인 영재와 영재교육 - 학습장애 영재와 미성취 영재","quote":"학습장애영재(Gifted and Learning Disability: GLD), 미성취영재(gifted and underachieve)는 영재교육에서 혼재되어 사용되기도 함"}},{"id":"47-22","type":"옳지 않은 것","q":"주의력 결핍 과잉행동장애(ADHD) 영재에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재의 특성과 ADHD의 특성을 동시에 가진 아동이다.","두 특성 외에도 다른 독특한 특성이 있다.","영재들은 심리적 민감성이 높은 수준에 있기 때문에 감성적인 측면에서 ADHD로 보일 수 있다.","정규학교 교육과정의 수준이 높고 진도가 빠를수록 영재 학생의 주의력이 떨어져 ADHD로 보일 수 있다.","특히 좋아하는 일을 만났을 때 지나친 활동성이 나타난다."],"answer":4,"explain":"④ 교안은 지닌 능력 수준에 비하여 '낮은 수준'의 정규학교 교육과정이나 '느린 진도'가 영재 학생의 주의력을 떨어지게 할 수 있다고 했다. ①②③⑤는 교안 내용과 일치한다.","source":{"page":20,"section":"02. 중복 낙인 영재와 영재교육 - 주의력 결핍 과잉행동장애 영재","quote":"지닌 능력 수준에 비하여 낮은 수준의 정규학교 교육과정이나 느린 진도는 영재 학생의 주의력을 떨어지게 할 수 있으며, 자칫 ADHD로 보일 수 있음"}},{"id":"47-23","type":"옳은 것","q":"ADHD 영재에게 나타나는 과잉행동의 다섯 가지 양태와 그 예를 바르게 짝지은 것은?","box":null,"choices":["감각적 행동 - 방임적 행동, 환경 자극에 대한 지나친 반응","정신운동 - 호기심, 열정","지적인 행동 - 빠른 말, 충동적 행동","상상력 - 극단적임, 새로운 환경에 적응하기 어려움","감정적인 반응 - 사실과 공상의 혼동 및 사용"],"answer":1,"explain":"① 교안과 일치. 바른 짝: 정신운동 - 빠른 말, 충동적 행동 / 감각적 행동 - 방임적 행동, 환경 자극에 대한 지나친 반응 / 지적인 행동 - 호기심, 열정 / 상상력 - 감성적으로 과장됨, 사실과 공상의 혼동 및 사용 / 감정적인 반응 - 극단적임, 새로운 환경에 적응하기 어려움. ②③④⑤는 짝이 뒤섞였다.","source":{"page":21,"section":"02. 중복 낙인 영재와 영재교육 - 주의력 결핍 과잉행동장애 영재","quote":"감각적 행동: 방임적 행동, 환경 자극에 대한 지나친 반응"}},{"id":"47-24","type":"사례","q":"다음 사례의 학생에게 나타난 과잉행동의 양태로 가장 알맞은 것은?","box":"또래에 비하여 열정적으로 과제에 임하는 영재 학생 A는 자신의 생각을 감성적으로 과장되게 표현하며, 때때로 사실과 공상을 혼동하여 사용한다.","choices":["정신운동","감각적 행동","지적인 행동","상상력","감정적인 반응"],"answer":4,"explain":"④ 감성적으로 과장됨, 사실과 공상의 혼동 및 사용은 '상상력' 양태이다. ① 정신운동 = 빠른 말, 충동적 행동. ② 감각적 행동 = 방임적 행동, 환경 자극에 대한 지나친 반응. ③ 지적인 행동 = 호기심, 열정. ⑤ 감정적인 반응 = 극단적임, 새로운 환경에 적응하기 어려움.","source":{"page":21,"section":"02. 중복 낙인 영재와 영재교육 - 주의력 결핍 과잉행동장애 영재","quote":"상상력: 감성적으로 과장됨, 사실과 공상의 혼동 및 사용"}},{"id":"47-25","type":"옳은 것","q":"아스퍼거증후군에 대한 설명으로 옳은 것은?","box":null,"choices":["독일의 한스 아스퍼거라는 심리학자가 1954년에 처음으로 제기한 증후군이다.","자폐증과는 관련이 없는 독립적인 증후군이다.","영재 중에서는 거의 발견되지 않는다.","사회적 의사소통이 뛰어나고 행동 또는 흥미가 다양한 것이 특징이다.","오스트리아의 한스 아스퍼거(Hans Asperger)라는 의사가 1944년에 처음으로 제기한 증후군이다."],"answer":5,"explain":"⑤ 교안 그대로이다. ① 독일·심리학자·1954년 → 오스트리아·의사·1944년. ② 아스퍼거증후군은 자폐증의 변형이다. ③ 영재 중에서도 많이 발견된다. ④ 사회적 의사소통의 결함과 행동 또는 흥미의 반복 등을 특징으로 하는 전반적인 발달장애이다.","source":{"page":22,"section":"02. 중복 낙인 영재와 영재교육 - 아스퍼거 영재","quote":"아스퍼거증후군은 자폐증의 변형으로, 오스트리아의 한스 아스퍼거(Hans Asperger)라는 의사가 1944년에 처음으로 제기한 증후군임"}},{"id":"47-26","type":"옳지 않은 것","q":"교안에 제시된 아스퍼거증후군의 특징으로 옳지 않은 것은?","box":null,"choices":["단조로운 언어를 사용함","매우 독특하고 열정적인 흥미를 보임","감정이입이 지나치게 풍부함","부적절한 사회적 의사소통에 따른 고립감이 있음","융통성 없는 사고와 습관이 있음"],"answer":3,"explain":"③ 교안은 '감정이입이 부족함'을 특징으로 제시했다. ①②④⑤는 교안의 아스퍼거증후군 특징과 일치한다.","source":{"page":23,"section":"02. 중복 낙인 영재와 영재교육 - 아스퍼거 영재","quote":"감정이입이 부족함 ‣ 단조로운 언어를 사용함 ‣ 매우 독특하고 열정적인 흥미를 보임 ‣ 부적절한 사회적 의사소통에 따른 고립감이 있음 ‣ 융통성 없는 사고와 습관이 있음"}},{"id":"47-27","type":"보기 조합","q":"아스퍼거 영재의 특성에 대한 설명으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 언어적 유창함과 조숙함, 뛰어난 기억력은 아스퍼거증후군 아동과 영재 모두의 공통점이다.\nㄴ. 감각적 자극에 대해 둔감한 것이 공통적이다.\nㄷ. 영재와 아스퍼거증후군 아동은 어릴 때 인지발달과 사회·정서적 발달 간에 불규칙함을 경험한다.\nㄹ. 자신의 흥미에 대해 끊임없이 이야기하여 또래를 짜증나게 하는 경우가 있다.","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"④ ㄱ·ㄷ·ㄹ은 교안과 일치. ㄴ: 감각적 자극에 대해 '과도한 민감성'을 보이는 것이 공통적이다. ㄴ이 포함된 ①②③⑤는 틀리다.","source":{"page":24,"section":"02. 중복 낙인 영재와 영재교육 - 아스퍼거 영재의 특성","quote":"언어적 유창함과 조숙함, 뛰어난 기억력은 아스퍼거증후군 아동과 영재 모두의 공통점임 ... 감각적 자극에 대해 과도한 민감성을 보이는 것이 공통적임"}},{"id":"47-28","type":"옳은 것","q":"중복낙인영재의 판별에 대한 설명으로 옳은 것은?","box":null,"choices":["장애가 확인되면 영재성 판별은 별도로 필요하지 않다.","영재성은 장애를 가릴 수 있으나, 장애가 영재성을 가리는 경우는 없다.","장애 때문에 영재성이 가려지거나 영재성 때문에 장애가 가려지는 경우가 있어 주의 깊은 관찰과 판별이 필요하다.","기존 영재 판별 도구만으로 충분히 판별할 수 있다.","장애와 영재성을 동시에 지닌 경우 교육적인 필요성은 일반 영재보다 낮다."],"answer":3,"explain":"③ 교안 그대로이다. ①④ 주의 깊은 관찰과 판별이 필요하며, 판별 도구 개발도 미미한 상황이다. ② 장애 때문에 영재성이 가려지는 경우도 있다. ⑤ 독특한 특성과 교육적인 필요성이 '더욱 높은' 영재이다.","source":{"page":25,"section":"02. 중복 낙인 영재와 영재교육 - 중복 낙인 영재를 위한 영재교육","quote":"장애 때문에 영재성이 가려지거나 영재성 때문에 장애가 가려지는 경우가 있으며 주의 깊은 관찰과 판별이 필요하고"}},{"id":"47-29","type":"옳은 것","q":"우리나라 중복낙인영재 교육의 과제에 대한 교안의 설명으로 옳은 것은?","box":nul
