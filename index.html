<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>연수 문제은행</title>
<style>
  /* layout: single centered column of course cards */
  :root { --bg:#f5f6f8; --surface:#ffffff; --ink:#1c2533; --muted:#5b6575; --line:#dde1e7; --accent:#b3261e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#12161d; --surface:#1b212b; --ink:#e7eaf0; --muted:#9aa4b2; --line:#2c3442; --accent:#ff8a80; color-scheme:dark } }
  :root[data-theme="dark"] { --bg:#12161d; --surface:#1b212b; --ink:#e7eaf0; --muted:#9aa4b2; --line:#2c3442; --accent:#ff8a80; color-scheme:dark }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif; }
  main { max-width:640px; margin:0 auto; padding-inline:16px; padding-block:40px 56px; display:grid; gap:20px; }
  h1 { font-size:1.6rem; margin:0; text-wrap:balance; }
  p.lead { margin:0; color:var(--muted); }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  a.card { display:grid; gap:4px; padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; }
  a.card:hover, a.card:focus-visible { border-color:var(--accent); outline:none; }
  .name { font-weight:700; font-size:1.05rem; }
  .meta { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>연수 문제은행</h1>
  <p class="lead">수강 중인 연수별 교안 기반 5지선다 문제은행</p>
  <ul>
    <li><a class="card" href="영재교육/문제은행/">
      <span class="name">AI 시대를 이끄는 창의·융합 영재교육</span>
      <span class="meta">한국교원연수원 · 60차시 · 1,496문항</span>
    </a></li>
  </ul>
</main>
</body>
</html>
