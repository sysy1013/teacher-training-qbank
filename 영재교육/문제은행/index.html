l,"choices":["중복낙인영재 전용 영재교육기관이 이미 충분히 지정되어 있다.","특별한 영재교육기관의 설립 또는 지정 전환, 판별 도구 개발과 영재교육프로그램 개발이 아직 미미하여 시급한 과제이다.","판별 도구 개발은 완료되었고 프로그램 개발만 남아 있다.","중복낙인 장애가 감소하고 있어 우선순위가 낮은 과제이다.","영재교육프로그램은 충분하나 판별 도구 개발이 미미하다."],"answer":2,"explain":"② 교안 그대로이다. ①③⑤ 기관 설립·지정 전환, 판별 도구 개발, 프로그램 개발 모두 아직 미미하다. ④ 중복낙인 장애가 '증가'하고 있는 상황이다.","source":{"page":26,"section":"02. 중복 낙인 영재와 영재교육 - 중복 낙인 영재를 위한 영재교육","quote":"중복낙인영재를 위한 특별한 영재교육기관의 설립 또는 지정 전환, 판별 도구 개발과 영재교육프로그램 개발은 아직 우리나라에는 미미한 상황이기 때문에 중복낙인장애가 증가하고 있는 상황에서 시급한 영재교육의 과제임"}}]},{"lesson":48,"title":"창의성을 높이는 영재교육","file":"4. 교안 (31~60)[1] (1)/48.pdf","summary":["Big-Tech: 스마트폰, 전기자동차, 초거대 AI(Chat-GPT, Bard, Bing), 유전자 편집(암 예방과 치료), SNS(YouTube, Instagram, Facebook), 헬스케어(코로나 진단, 백신)","창의성 정의 = 새롭고 적절한 아이디어를 내는 것 / 1960년대 이후 모든 사람이 창의력의 잠재력 보유 → 확산적 사고 중심 계발 프로그램","미국 교육부: 학교가 변해야 하고, 학교가 변하려면 교사의 신념과 교수학습법이 바뀌어야 → 교사 연수 노력","엘빈 토플러 「부의 미래」: 기업 100, 교육 10, 정부 5 / 기업이 먼저 활용: 오스본의 브레인스토밍, PMI, SCAMPER, TRIZ","10년의 법칙(가드너의 열정과 기질), 만 시간의 법칙(말콤 글래드웰의 아웃라이어) / 노벨상: 박사학위 후 32년, 평균 수상연령 69.1세","WEF·OECD: 가장 필요한 혁신역량 = 창의력과 융합력 / KH, KIM(Creativity Challenge, 2016): 1990년대 이후 미국 창의력 하락, No Child Left Behind 교육개혁법","우리나라: 창의성 중요성 인정 but '본인은 창의적이지 못하다' → 아이러니한 양면성, 양가감정의 사회 (한국대학신문, 이정규, 2018. 6. 6)","'왜' 질문 → 지적 호기심 / 교사 대응이 관건 / 기다려주는 시간 8초(미 교육부 교사지침서) / AI 시대 질문(prompt) 더 중요","다양한 경험: 유창성·융통성(많은 생각), 독창성(나만의 생각), 정교성(가치 있게 발전) / 과학관 인솔·시간계획은 피해야 → 학생 스스로 선택","빌 게이츠: 13세 전 PC·스마트폰 X, 책장·책상, 가족 저녁 식사·대화 / fMRI: 독서 뇌 전 영역 활성화, 게임 일부 과활성 / 원격연합","메모: '기록'은 '기억'을 지배, 미래를 기억·계획하는 수단 / 작업기억 → 장기기억 / 기-승-전-결 / 마인드 맵, 포스트잇","칭찬 → 작은 행동 반복 → 좋은 습관 / 창의성 해치는 말(말도 안 되는 소리…) vs 높이는 말(네가 잘 해낼 것이라고 믿어…)"],"questions":[{"id":"48-01","type":"옳지 않은 것","q":"교안에서 '우리의 일상을 바꾸는 Big-Tech'의 분야와 예를 짝지은 것으로 옳지 않은 것은?","box":null,"choices":["초거대 AI - Chat-GPT, Bard, Bing","유전자 편집 - 암 예방과 치료","SNS - YouTube, Instagram, Facebook","초거대 AI - YouTube, Instagram, Facebook","헬스케어 - 코로나 진단, 백신"],"answer":4,"explain":"④ YouTube, Instagram, Facebook은 SNS의 예이다. 초거대 AI의 예는 Chat-GPT, Bard, Bing. ①②③⑤는 교안과 일치한다(그 밖에 스마트폰, 전기자동차).","source":{"page":3,"section":"01. 창의성의 오해와 진실 - 우리의 일상을 바꾸는 Big-Tech","quote":"초거대AI : Chat-GPT, Bard, Bing 등 유전자 편집: 암 예방과 치료 등 SNS : YouTube, Instagram, Facebook 등 헬스케어: 코로나 진단, 백신 등"}},{"id":"48-02","type":"옳은 것","q":"Big-Tech에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["지금까지 인류 문명에 없었던 창의적이고 융합적인 아이디어가 세상을 바꾸고 있다.","아직 전 세계 사람들의 일상생활에는 널리 활용되지 않고 있다.","기존 인류 문명의 아이디어를 단순히 개량한 것에 불과하다.","Big-Tech 회사의 창립자와 개발자들이 창출한 부는 미미하다.","주로 소수 연구기관 내부에서만 활용되고 있다."],"answer":1,"explain":"① 교안 그대로이다. ②⑤ 이미 전 세계 사람들의 일상생활에 널리 활용되고 있다. ③ 지금까지 인류 문명에 없었던 아이디어이다. ④ 창립자와 개발자들은 막대한 부를 창출하였다.","source":{"page":4,"section":"01. 창의성의 오해와 진실 - 우리의 일상을 바꾸는 Big-Tech","quote":"지금까지 인류 문명에 없었던 창의적이고 융합적인 아이디어가 세상을 바꾸고 있음 이미 전세계 사람들의 일상생활에 널리 활용되고 있음"}},{"id":"48-03","type":"옳지 않은 것","q":"교안에서 제시한 '창의성에 대한 오해'에 해당하지 않는 것은?","box":null,"choices":["창의성은 특별한 사람만이 가지는 능력이다.","창의성은 타고나는 것이지, 계발할 수 없는 능력이다.","창의성이 높으면 공부하는 데 자꾸 딴생각을 하기 때문에 방해된다.","창의성은 새롭고 적절한 아이디어를 내는 것이다.","창의성이 높은 학생은 사회에 진출해도 사회 부적응자가 되거나 환영받지 못한다."],"answer":4,"explain":"④ 이는 오해가 아니라 교안이 제시한 창의성의 정의이다. ①②③⑤는 교안이 열거한 창의성에 대한 오해이다(그 밖에 '엉뚱한 질문이나 답을 해서 수업 진도에 방해됨').","source":{"page":5,"section":"01. 창의성의 오해와 진실 - 창의성에 대한 오해","quote":"창의성은 특별한 사람만이 가지는 능력 창의성은 타고나는 것이지, 계발할 수 없는 능력 창의성이 높으면, 공부하는데 자꾸 딴생각을 하기 때문에 방해됨"}},{"id":"48-04","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"창의성은 (   ) 아이디어를 내는 것임","choices":["빠르고 정확한","새롭고 적절한","많고 다양한","독특하고 기이한","논리적이고 체계적인"],"answer":2,"explain":"② 교안: 창의성은 새롭고 적절한 아이디어를 내는 것. ①③④⑤는 교안의 정의와 다르다. 초기에는 심리학자조차 창의성이 뉴턴이나 아인슈타인 같은 소수의 탁월한 사람에게만 있다고 생각했다.","source":{"page":6,"section":"01. 창의성의 오해와 진실 - 오해1: 창의성은 특별한 사람만이 갖는 능력?","quote":"창의성은 새롭고 적절한 아이디어를 내는 것임"}},{"id":"48-05","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"그러나 (   ) 이후에 창의성을 연구한 심리학자들과 창의적 인재를 육성하려는 미국 교육부는, 창의성은 특별히 탁월한 사람에게만 있는 것만이 아니며, 모든 사람들이 창의력의 잠재력을 가지고 있음이 알려지며 창의성 계발에 관심을 갖게 됨","choices":["1960년대","1940년대","1950년대","1970년대","1980년대"],"answer":1,"explain":"① 교안: 1960년대 이후 모든 사람이 창의력의 잠재력을 가지고 있음이 알려짐. ②③④⑤는 교안 연도와 다르다.","source":{"page":7,"section":"01. 창의성의 오해와 진실 - 오해1: 창의성은 특별한 사람만이 갖는 능력?","quote":"그러나 1960년대 이후에 창의성을 연구한 심리학자들과 창의적 인재를 육성하려는 미국 교육부는, 창의성은 특별히 탁월한 사람에게만 있는 것만이 아니며, 모든 사람들이 창의력의 잠재력을 가지고 있음이 알려지며"}},{"id":"48-06","type":"옳은 것","q":"창의적 인재 육성에 대한 미국 교육부의 주장으로 옳은 것은?","box":null,"choices":["학교보다 가정의 양육 방식이 먼저 바뀌어야 한다.","학생 선발 방식과 시험 제도가 먼저 바뀌어야 한다.","교육과정의 학습 분량을 늘려야 한다.","교사 연수보다는 교육 예산 확대에 노력을 기울여야 한다.","학교가 변해야 하고, 학교가 변하려면 교사의 신념과 교수학습법이 바뀌어야 한다."],"answer":5,"explain":"⑤ 교안 그대로이며, 미국 교육부는 창의성 계발의 교사 연수에 많은 노력을 기울이고 있다. ①②③④는 교안에 없는 주장이며, ④는 교사 연수를 강조한 교안과 반대된다.","source":{"page":8,"section":"01. 창의성의 오해와 진실 - 오해1: 창의성은 특별한 사람만이 갖는 능력?","quote":"미국 교육부는 창의적 인재를 육성하기 위해서는 학교가 변해야 하고, 학교가 변하려면 교사의 신념과 교수학습법이 바뀌어야 한다고 주장함 창의성 계발의 교사 연수에 많은 노력을 기울이고 있음"}},{"id":"48-07","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"1960대 이후부터 창의성은 특별한 사람만이 아닌 누구에게나 잠재되어 있으며 이를 어떻게 계발할 것인가에 관점을 두고, (   )를 중심으로 창의성 계발 프로그램들이 많이 개발됨","choices":["수렴적 사고","비판적 사고","확산적 사고","메타인지","논리적 사고"],"answer":3,"explain":"③ 교안: 확산적 사고를 중심으로 창의성 계발 프로그램이 많이 개발됨. 1960대 이전에는 창의성을 계발할 수 있는가에 대한 논쟁이 있었다. ①②④⑤는 교안 표현이 아니다.","source":{"page":9,"section":"01. 창의성의 오해와 진실 - 오해2: 창의성은 계발되는 것이 아니다?","quote":"확산적 사고를 중심으로 창의성 계발 프로그램들이 많이 개발됨"}},{"id":"48-08","type":"빈칸","q":"엘빈 토플러가 「부의 미래」에서 제시한 변화 속도 비교이다. (가), (나)에 들어갈 수치로 알맞은 것은?","box":"기업의 변화 속도가 100이라면, 교육은 (가), 정부는 (나)","choices":["(가) 50 (나) 10","(가) 5 (나) 10","(가) 20 (나) 5","(가) 10 (나) 1","(가) 10 (나) 5"],"answer":5,"explain":"⑤ 교안: 기업의 변화 속도가 100이라면, 교육은 10, 정부는 5. ①②③④는 교안 수치와 다르다.","source":{"page":10,"section":"01. 창의성의 오해와 진실 - 오해2: 창의성은 계발되는 것이 아니다?","quote":"엘빈 토플러는 “부의 미래”에서 기업의 변화 속도가 100이라면, 교육은 10, 정부는 5라고 하였음"}},{"id":"48-09","type":"옳은 것","q":"창의성 계발에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["기업보다 학교교육이 먼저 창의성 계발을 활용하기 시작하였다.","「부의 미래」는 말콤 글래드웰의 저서로 소개되었다.","학교교육이 머뭇거리는 사이, 기업에서 먼저 창의성 계발을 활용하기 시작하였다.","브레인스토밍 기법은 엘빈 토플러가 고안한 것으로 소개되었다.","정부의 변화 속도는 교육보다 빠르다고 하였다."],"answer":3,"explain":"③ 교안 그대로이다. ① 기업이 먼저 활용. ② 「부의 미래」는 엘빈 토플러. ④ 교안은 '오스본의 브레인스토밍 기법'이라고 했다. ⑤ 교육 10, 정부 5로 정부가 더 느리다.","source":{"page":10,"section":"01. 창의성의 오해와 진실 - 오해2: 창의성은 계발되는 것이 아니다?","quote":"학교교육이 머뭇거리는 사이, 기업에서 먼저 창의성 계발을 활용하기 시작함"}},{"id":"48-10","type":"옳지 않은 것","q":"교안에서 기업이 활용한 창의성 계발 기법의 예로 제시되지 않은 것은?","box":null,"choices":["오스본의 브레인스토밍 기법","델파이 기법","PMI 기법","SCAMPER 기법","TRIZ"],"answer":2,"explain":"② 델파이 기법은 교안에 제시되지 않았다. 교안의 예: 오스본의 브레인스토밍 기법, PMI 기법, SCAMPER 기법, TRIZ 등. ①③④⑤는 교안에 제시된 기법이다.","source":{"page":10,"section":"01. 창의성의 오해와 진실 - 오해2: 창의성은 계발되는 것이 아니다?","quote":"오스본의 브레인스토밍 기법, PMI 기법, SCAMPER 기법, TRIZ 등"}},{"id":"48-11","type":"보기 조합","q":"'창의성이 높으면 공부에 방해된다?'라는 오해와 관련하여 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 초기에는 공부와 창의력과의 관계에 대해 두 가지 관점이 서로 달랐다.\nㄴ. 공부를 많이 해 기존 지식이 많아지면 고정관념이 생겨 독창적 아이디어를 내는 데 방해가 된다는 관점이 있다.\nㄷ. 공부를 많이 하면 기존의 문제점도 잘 알 수 있기에 창의적인 아이디어를 내는 데 도움이 된다는 관점이 있다.\nㄹ. 최근 창의성 연구자들은 전문지식 습득이 창의성 발현에 불필요하다고 본다.","choices":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"③ ㄱ·ㄴ·ㄷ은 교안과 일치. ㄹ: 최근 연구자들은 '10년의 법칙'·'만 시간의 법칙'이 필요하다고 하며, 해당 분야의 전문지식을 습득해야 한다고 본다. ①은 ㄷ 누락, ②④⑤는 ㄹ 포함으로 틀리다.","source":{"page":11,"section":"01. 창의성의 오해와 진실 - 오해3: 창의성이 높으면 공부에 방해된다?","quote":"초기에는 공부와 창의력과의 관계는 두 가지 관점이 서로 달랐음 먼저, 공부를 많이 해 기존 지식이 많아지면 고정관념도 많이 생길 것이고"}},{"id":"48-12","type":"옳은 것","q":"진정한 창의성이 최대한 발현되기 위해 필요하다고 제시된 법칙과 출처를 바르게 짝지은 것은?","box":null,"choices":["10년의 법칙 - 말콤 글래드웰의 아웃라이어 / 만 시간의 법칙 - 가드너의 열정과 기질","10년의 법칙 - 가드너의 열정과 기질 / 만 시간의 법칙 - 말콤 글래드웰의 아웃라이어","10년의 법칙 - 엘빈 토플러의 부의 미래 / 만 시간의 법칙 - 말콤 글래드웰의 아웃라이어","10년의 법칙 - 가드너의 열정과 기질 / 만 시간의 법칙 - 엘빈 토플러의 부의 미래","10년의 법칙 - 오스본의 브레인스토밍 / 만 시간의 법칙 - 가드너의 열정과 기질"],"answer":2,"explain":"② 교안: '10년의 법칙(가드너의 열정과 기질)', '만 시간의 법칙(말콤 글래드웰의 아웃라이어)'. ① 짝이 뒤바뀜. ③④⑤ 엘빈 토플러의 「부의 미래」는 기업·교육·정부 변화 속도, 오스본은 브레인스토밍 기법으로 제시됨.","source":{"page":13,"section":"01. 창의성의 오해와 진실 - 오해3: 창의성이 높으면 공부에 방해된다?","quote":"“10년의 법칙(가드너의 열정과 기질)”, “만 시간의 법칙(말콤 글래드웰의 아웃라이어)”이 필요하다고 함"}},{"id":"48-13","type":"빈칸","q":"다음 (가), (나)에 들어갈 수치로 알맞은 것은?","box":"노벨상 수상자들은 박사학위 이후 노벨상 수상까지 (가)년이 걸렸음(평균 수상연령 (나)세)","choices":["(가) 32 (나) 69.1","(가) 22 (나) 59.1","(가) 32 (나) 59.1","(가) 10 (나) 69.1","(가) 42 (나) 79.1"],"answer":1,"explain":"① 교안: 박사학위 이후 노벨상 수상까지 32년, 평균 수상연령 69.1세. ②③④⑤는 교안 수치와 다르다.","source":{"page":14,"section":"01. 창의성의 오해와 진실 - 오해3: 창의성이 높으면 공부에 방해된다?","quote":"노벨상 수상자들은 박사학위 이후 노벨상 수상까지 32년이 걸렸음(평균 수상연령 69.1세)"}},{"id":"48-14","type":"옳은 것","q":"창의성의 '10년의 법칙'에 대한 설명으로 옳은 것은?","box":null,"choices":["창의적인 도약을 위해서는 10세 이전에 창의성 교육을 시작해야 한다.","창의적인 도약을 위해서는 10개 이상의 다양한 분야를 경험해야 한다.","창의적인 도약은 전문지식 없이도 10년간의 자유로운 경험으로 이루어진다.","창의적인 도약을 위해서는 해당 분야에서 통용되는 전문지식을 습득하고, 최소 10년 정도의 꾸준한 노력이 필요하다.","창의적인 도약을 위해서는 최대 10년 이내에 성과를 내야 한다."],"answer":4,"explain":"④ 교안 정의 그대로이다. ①②③⑤는 교안에 없는 내용으로, 핵심은 '해당 분야 전문지식 습득 + 최소 10년 정도의 꾸준한 노력'이다.","source":{"page":14,"section":"01. 창의성의 오해와 진실 - 오해3: 창의성이 높으면 공부에 방해된다?","quote":"창의성의 “10년의 법칙”은 창의적인 도약을 이루기 위해서는 해당 분야에서 통용되는 전문지식을 습득해야 하고, 최소 10년 정도의 꾸준한 노력이 필요하다는 법칙임"}},{"id":"48-15","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"인공지능, 로봇 등에 공존(또는 대응)해야 하는 우리 인간에게 가장 필요한 혁신역량은, 세계경제포럼(WEF), OECD 등에서 밝힌 바와 같이, '(   )'을 제시한다.","choices":["협업력과 소통력","비판력과 판단력","기억력과 집중력","정보력과 분석력","창의력과 융합력"],"answer":5,"explain":"⑤ 교안(한국대학신문, 이정규, 2018. 6. 6): WEF, OECD 등에서 밝힌 가장 필요한 혁신역량은 '창의력과 융합력'. ①②③④는 교안 표현과 다르다.","source":{"page":15,"section":"01. 창의성의 오해와 진실 - 우리나라의 창의성에 대한 이중시각","quote":"세계경제포럼(WEF), OECD 등에서 밝힌 바와 같이, “창의력과 융합력”을 제시한다"}},{"id":"48-16","type":"개념 찾기","q":"KH, KIM의 연구(Creativity Challenge, 2016)에서 시험과 평가 위주의 교육 시스템을 강화하여 미국의 창의성이 떨어지게 한 원인으로 지목된 교육부의 교육개혁법은?","box":null,"choices":["Every Student Succeeds","No Child Left Behind","Race to the Top","Goals 2000","Head Start"],"answer":2,"explain":"② 교안: 교육부의 'No Child Left Behind' 교육개혁법으로 시험과 평가 위주의 교육 시스템이 강화되면서(성적이 떨어진 학교는 폐교 조치, 시험 점수 조작 만연) 미국의 창의성이 떨어지고 있다. ①③④⑤는 교안에 제시되지 않았다.","source":{"page":15,"section":"01. 창의성의 오해와 진실 - 우리나라의 창의성에 대한 이중시각","quote":"교육부의 “No Child Left Behind” 교육개혁법으로 인해, 시험과 평가 위주의 교육 시스템이 강화되면서"}},{"id":"48-17","type":"옳지 않은 것","q":"교안에 소개된 미국의 창의성 감소에 관한 내용으로 옳지 않은 것은?","box":null,"choices":["1990년대 이후 미국의 창의력은 떨어지고 있다는 메타연구가 발표되었다.","성적이 떨어진 학교는 폐교 조치되었다.","미국의 교실에서는 하나의 정답만이 요구되었다.","창의적인 답은 가산점을 받는 교실 환경이 창의력 계발을 감소시켰다.","점수 경쟁과 비교는 위계적 사고를 낳았다."],"answer":4,"explain":"④ 교안은 창의적인 답이 '틀린 답으로 처리'되는 교실 환경에서 창의력 계발이 더욱 감소되고 있다고 했다. ①②③⑤는 교안 내용과 일치한다.","source":{"page":16,"section":"01. 창의성의 오해와 진실 - 우리나라의 창의성에 대한 이중시각","quote":"점수 경쟁과 비교는 위계적 사고를 낳고, 창의적인 답은 틀린 답으로 처리되는 교실 환경에서 창의력 계발은 더욱 감소되고 있다는 연구 결과"}},{"id":"48-18","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"우리나라 교실 현장에서도 교사와 학생들에게 '창의적인 사람에 대해 떠오르는 이미지는? 그리고 본인은 창의적인 사람인가?'를 조사한 결과에 따르면, 긍정적인 면과 부정적인 면이 동시에 나타나는 아이러니한 (   )의 경향을 보였다.","choices":["일관성","긍정성","양면성","단일성","무관심"],"answer":3,"explain":"③ 교안: 긍정적인 면과 부정적인 면이 동시에 나타나는 아이러니한 양면성의 경향. ①②④⑤는 교안 표현과 다르다. 이는 칼럼 제목 '창의력의 이중시각'과 연결된다.","source":{"page":16,"section":"01. 창의성의 오해와 진실 - 우리나라의 창의성에 대한 이중시각","quote":"긍정적인 면과 부정적인 면이 동시에 나타나는 아이러니한 양면성의 경향을 보였다"}},{"id":"48-19","type":"옳지 않은 것","q":"우리나라의 창의성에 대한 인식으로 교안에 제시된 내용과 다른 것은?","box":null,"choices":["미래사회일수록 창의적인 인재와 아이디어가 매우 중요한 요소라고 인식한다.","대다수의 사람들은 '본인은 창의적이다'라는 긍정적인 반응을 나타냈다.","창의적인 사람을 남과 다른 엉뚱하고 기이한 생각을 하는 사람으로 보는 이미지가 있다.","창의적인 사람을 팀 협조나 화합에 어려움을 주는 사람, 수업 진도에 방해를 주는 학생으로 보는 이미지가 있다.","창의력에 대한 자기인식과 창의적인 사람들에 대한 부정적인 시각이 존재하는 양가감정의 사회이다."],"answer":2,"explain":"② 교안은 대다수의 사람들이 '본인은 창의적이지 못하다'는 아주 부정적인 반응을 나타냈다고 했다. ①③④⑤는 교안 내용과 일치한다.","source":{"page":17,"section":"01. 창의성의 오해와 진실 - 우리나라의 창의성에 대한 이중시각","quote":"대다수의 사람들은 '본인은 창의적이지 못하다'는 아주 부정적인 반응을 나타냈고"}},{"id":"48-20","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"창의적인 인물이 성공하고, 창의력의 중요성과 필요성에 대해서는 긍정적으로 인식하고 있으면서도 창의력에 대한 자기인식과 창의적인 사람들에 대한 부정적인 시각이 여전히 존재하는 (   )의 사회라는 것은 우리에게 많은 교육적 시사점을 제공한다.","choices":["무관심","양가감정","획일주의","경쟁주의","집단주의"],"answer":2,"explain":"② 교안: 긍정적 인식과 부정적 시각이 공존하는 '양가감정'의 사회. ①③④⑤는 교안 표현이 아니다.","source":{"page":17,"section":"01. 창의성의 오해와 진실 - 우리나라의 창의성에 대한 이중시각","quote":"부정적인 시각이 여전히 존재하는 양가감정의 사회라는 것은 우리에게 많은 교육적 시사점을 제공한다"}},{"id":"48-21","type":"옳은 것","q":"질문하고 생각하는 습관과 창의성에 대한 설명으로 옳은 것은?","box":null,"choices":["창의적인 학생일수록 '어떻게'보다 '언제'라는 질문을 많이 한다.","질문이 적은 교실일수록 창의성의 보물이 가득한 교실이다.","학생이 질문했을 때 선생님이 어떻게 대응하느냐에 따라 창의력이 계발되느냐 묻히느냐가 달려 있다.","'왜'라고 자주 질문하는 학생일수록 지적 호기심이 낮다.","학생의 질문은 수업 진도에 방해가 되므로 상호작용을 줄여야 한다."],"answer":3,"explain":"③ 교안 그대로이다. ① 창의적인 학생일수록 '왜'라고 질문함. ② '왜'라고 자주 물어볼 수 있는 교실일수록 창의성의 보물이 가득한 교실. ④ 지적 호기심이 '높음'. ⑤ 질문에 상호작용을 잘해주면 잠재된 창의력이 계발되는 데 큰 힘이 됨.","source":{"page":19,"section":"02. 창의성을 높이는 영재교육 - 질문하고, 생각하는 습관을 길러줌","quote":"문제는 학생이 질문했을 때, 선생님이 어떻게 대응하느냐에 따라 창의력이 계발되느냐 아니면 묻히고 마느냐가 달려있음"}},{"id":"48-22","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"선생님은 질문에 바로 정답을 알려주지 말고, 스스로 답을 찾도록 기다려주는 시간(미 교육부 교사지침서에는 (   ))이 필요함","choices":["3초","5초","10초","15초","8초"],"answer":5,"explain":"⑤ 교안: 미 교육부 교사지침서에는 8초. 영재 학생일수록 스스로 질문하고 답을 찾아가는 과정이 중요하기 때문이다. ①②③④는 교안 수치와 다르다.","source":{"page":20,"section":"02. 창의성을 높이는 영재교육 - 질문하고, 생각하는 습관을 길러줌","quote":"스스로 답을 찾도록 기다려주는 시간(미 교육부 교사지침서에는 8초)이 필요함"}},{"id":"48-23","type":"옳은 것","q":"초거대 AI 시대의 질문에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["생성형 AI는 어떻게 질문(명령어, prompt)하느냐에 따라 질문에 맞추어 답을 생성하는 알고리즘이므로 질문이 더 중요해졌다.","생성형 AI가 답을 주므로 질문의 중요성은 줄어들었다.","선생님은 학생의 질문에 즉시 정답을 알려주는 것이 바람직하다.","생성형 AI는 질문과 무관하게 동일한 답을 생성한다.","영재 학생일수록 스스로 답을 찾는 과정보다 정답 확인이 중요하다."],"answer":1,"explain":"① 교안 그대로이다. ②④ 초거대 AI 시대(ChatGPT, Bard, Bing)일수록 질문이 더 중요한 시대가 되었다. ③ 바로 정답을 알려주지 말고 기다려주어야 한다. ⑤ 스스로 질문하고 답을 찾아가는 과정이 중요하다.","source":{"page":20,"section":"02. 창의성을 높이는 영재교육 - 질문하고, 생각하는 습관을 길러줌","quote":"어떻게 질문(명령어, prompt)하느냐에 따라서 생성형 AI는 질문에 맞추어 답을 생성하도록 되어 있는 알고리즘이기 때문임"}},{"id":"48-24","type":"옳은 것","q":"다양한 경험을 통한 창의성 계발 과정과 창의성 요소를 바르게 짝지은 것은?","box":null,"choices":["다양한 관점에서 많은 생각을 함 - 독창성, 정교성","나만의 생각으로 새롭게 생각함 - 유창성","나만의 생각으로 새롭게 생각함 - 융통성","경험에서 배운 생각을 더욱 가치 있게 발전시켜 나감 - 정교성","경험에서 배운 생각을 더욱 가치 있게 발전시켜 나감 - 유창성"],"answer":4,"explain":"④ 교안: 다양한 관점에서 많은 생각 = 유창성, 융통성 / 나만의 생각으로 새롭게 생각 = 독창성 / 경험에서 배운 생각을 더욱 가치 있게 발전 = 정교성. ①②③⑤는 짝이 잘못되었다.","source":{"page":21,"section":"02. 창의성을 높이는 영재교육 - 다양한 경험을 하도록 격려하고 같이 하려고 함","quote":"나만의 생각으로 새롭게 생각하고(독창성), 경험에서 배운 생각을 더욱 가치 있게 발전시켜 나가면서(정교성) 창의성이 계발됨"}},{"id":"48-25","type":"사례","q":"다음 사례의 교사에 대한 교안의 관점으로 가장 알맞은 것은?","box":"교사 A는 영재 학생들의 과학관 체험학습에서 관람 순서와 시간 계획을 세세하게 세워 주고, 학생들이 많은 체험을 할 수 있도록 직접 인솔하였다.","choices":["많은 체험을 하게 하므로 창의성 계발에 가장 바람직한 방식이다.","학생이 스스로 관심 있는 것을 선택해 체험하도록 뒤에서 지원해야 하므로 피해야 할 방식이다.","과학관 체험은 시간을 낭비하는 것이므로 책상 공부로 대체해야 한다.","교사가 계획을 세워 주어야 학생이 책임감을 가지고 몰두할 수 있다.","체험의 양이 많을수록 독창성이 발달하므로 적절한 방식이다."],"answer":2,"explain":"② 교안: 선생님들이 과학관에서 시간 계획을 세워 주고 인솔하는 경우가 있는데 이것은 피해야 하며, 학생이 스스로 선택하도록 뒤에서 지원해야 흥미·관심·책임을 가지고 몰두할 수 있다. ①④⑤ 교안과 반대. ③ 과학관·박물관·미술관·공연장 경험은 시간 낭비가 아니라 경험을 쌓고 꿈을 찾는 길이다.","source":{"page":22,"section":"02. 창의성을 높이는 영재교육 - 다양한 경험을 하도록 격려하고 같이 하려고 함","quote":"선생님들이 과학관에서 시간계획을 세워주고 학생이 많은 체험을 할 수 있도록 학생들을 인솔하는 경우가 있는데, 이것은 피해야 함"}},{"id":"48-26","type":"옳은 것","q":"다양한 경험에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["과학관, 박물관, 미술관, 공연장을 찾아 다양한 경험을 쌓게 해 주면 공부에 대한 목적도 분명해질 수 있다.","다양한 경험은 공부 시간을 빼앗아 창의력 발달을 늦춘다.","새롭고 다양한 경험을 많이 한 영재 학생일수록 유창성은 발달하나 창의력은 발달하지 않는다.","책상에 앉아서 공부하는 것은 창의성 계발에 중요하지 않다.","다양한 경험은 꿈을 찾는 것과는 관련이 없다."],"answer":1,"explain":"① 교안 그대로이다. ②③ 여러 가지 새롭고 다양한 경험을 많이 한 영재 학생일수록 창의력이 발달한다. ④ 책상에 앉아서 공부하는 것도 중요하다. ⑤ 경험을 쌓고 꿈을 찾는 길이다.","source":{"page":21,"section":"02. 창의성을 높이는 영재교육 - 다양한 경험을 하도록 격려하고 같이 하려고 함","quote":"과학관, 박물관, 미술관, 공연장을 찾아 다양한 경험을 쌓게 해주는 것은 시간을 낭비하는 것이 아닌 경험을 쌓고 꿈을 찾는 길이며 그 꿈을 이루기 위해 공부에 대한 목적도 분명해질 수 있음"}},{"id":"48-27","type":"옳지 않은 것","q":"빌 게이츠가 자녀를 키운 가정환경과 양육방식으로 옳지 않은 것은?","box":null,"choices":["집안 곳곳에 책장과 책상을 만들어 책을 읽었다.","가능한 한 저녁 식사는 가족과 함께하려고 노력했다.","식사 자리에서 피크닉이나 재활용 쓰레기 등 사소한 문제부터 큰 주제까지 다양한 소재로 대화를 나누었다.","첨단 기기가 넘쳐날 것 같다는 예상과 달리 자녀의 디지털 기기 사용을 제한하였다.","자녀들이 16세가 되기 전까지 집안에 PC와 스마트폰을 들이지 않았다."],"answer":5,"explain":"⑤ 교안은 자녀들이 '13세'가 되기 전까지 집안에 PC와 스마트폰을 들이지 않았다고 했다. ①②③④는 교안 내용과 일치한다.","source":{"page":23,"section":"02. 창의성을 높이는 영재교육 - 독서하며 토론하는 습관을 길러줌","quote":"오히려 이들은 자녀들이 13세가 되기 전까지 집안에 PC와 스마트폰을 들이지 않았다고 함"}},{"id":"48-28","type":"옳은 것","q":"독서하는 아이와 게임하는 아이의 뇌를 fMRI로 비교 분석한 결과로 옳은 것은?","box":null,"choices":["독서를 하는 아이의 뇌는 뇌의 다양한 전 영역을 골고루 연결시키며 활성화된다.","독서를 하는 아이의 뇌는 일부분만을 과활성화시킨다.","게임에 몰두하는 뇌는 뇌의 전 영역을 골고루 활성화시킨다.","독서와 게임은 뇌 활성화 양상에 차이가 없다.","게임에 몰두하는 뇌는 전혀 활성화되지 않는다."],"answer":1,"explain":"① 교안 그대로이다. ②③ 설명이 뒤바뀌었다. 게임에 몰두하는 뇌는 일부분만을 과활성화시키는 뇌 영상이 나타났다. ④⑤ 교안 결과와 다르다.","source":{"page":24,"section":"02. 창의성을 높이는 영재교육 - 독서하며 토론하는 습관을 길러줌","quote":"독서를 하는 아이의 뇌는 뇌의 다양한 전 영역을 골고루 연결시키며 활성화됨 • 게임에 몰두하는 뇌는 일부분만을 과활성화시키는 뇌 영상이 나타남"}},{"id":"48-29","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"책을 읽으며 상상하고 생각하는 힘이 뇌의 전혀 다른 영역을 서로 연결시켜 가면서 (   ) 창의성을 계발하는 데 큰 원료가 됨","choices":["근접연합","작업기억","수렴적 사고","원격연합","과활성화"],"answer":4,"explain":"④ 교안: 뇌의 전혀 다른 영역을 서로 연결시켜 가면서(원격연합) 창의성을 계발. 창의성은 전혀 연결되지 않을 것 같은 것을 서로 연결해 새로운 아이디어와 제품으로 만들어 가는 특성이 있다. ①②③⑤는 교안 표현이 아니다.","source":{"page":24,"section":"02. 창의성을 높이는 영재교육 - 독서하며 토론하는 습관을 길러줌","quote":"책을 읽으며 상상하고 생각하는 힘이 뇌의 전혀 다른 영역을 서로 연결시켜 가면서(원격연합) 창의성을 계발하는데 큰 원료가 됨"}},{"id":"48-30","type":"옳지 않은 것","q":"메모하고 기록하는 습관에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["창의적인 영재일수록 순간 떠오르는 좋은 생각을 메모하는 습관을 가진다.","학습 계획 단계부터 실천, 결과에 이르기까지 메모하고 기록하는 습관이 있다.","'기록'은 '기억'을 지배한다.","메모는 과거와 현재, 그리고 미래를 기억하고 계획하는 중요한 수단이다.","메모는 과거의 것을 잊어버리지 않으려고 기억하기 위한 수단에 그친다."],"answer":5,"explain":"⑤ 교안은 흔히 메모를 과거의 것을 잊지 않으려는 것이라고 생각하기 쉽지만, '그러나 메모는 과거와 현재, 그리고 앞으로 어떻게 해야지와 같은 미래를 기억하고 계획하는 중요한 수단'이라고 했다. ①②③④는 교안과 일치한다.","source":{"page":25,"section":"02. 창의성을 높이는 영재교육 - 메모하고 기록하는 습관을 길러줌","quote":"그러나 메모는 과거와 현재, 그리고 앞으로 어떻게 해야지와 같은 미래를 기억하고 계획하는 중요한 수단임"}},{"id":"48-31","type":"빈칸","q":"다음 (가), (나)에 들어갈 말로 알맞은 것은?","box":"여러 생각들을 연결시키고, 순간적인 아이디어를 (가)을 통해 (나)으로 만들기 위한 중요한 작업이 바로 메모하는 습관임","choices":["(가) 장기기억 (나) 작업기억","(가) 단기기억 (나) 작업기억","(가) 작업기억 (나) 장기기억","(가) 감각기억 (나) 단기기억","(가) 원격연합 (나) 장기기억"],"answer":3,"explain":"③ 교안: 순간적인 아이디어를 작업기억을 통해 장기기억으로 만들기 위한 작업이 메모하는 습관. 또한 막연한 생각을 기-승-전-결로 논리적으로 다듬으며, 메모로 정리한 내용은 미래 기억이 된다. ① 순서 뒤바뀜, ②④⑤는 교안 표현과 다르다.","source":{"page":26,"section":"02. 창의성을 높이는 영재교육 - 메모하고 기록하는 습관을 길러줌","quote":"순간적인 아이디어를 작업기억을 통해 장기기억으로 만들기 위한 중요한 작업이 바로 메모하는 습관임"}},{"id":"48-32","type":"개념 찾기","q":"교안에서 제시한 '창의적으로 메모하는 방식' 중 다음 설명에 해당하는 것은?","box":"하나의 주제에서 여러 형태로 가지를 쳐 나가면서 아이디어를 발전시켜 나가는 방법","choices":["SCAMPER 기법","PMI 기법","마인드 맵","TRIZ","포스트잇 붙이기 기법"],"answer":3,"explain":"③ 교안: '마인드 맵'과 같이 하나의 주제에서 여러 형태로 가지를 쳐 나가는 방법. ⑤ 벽면이나 화이트보드에 포스트잇 같은 종이를 계속 붙여 나가며 아이디어를 발전시키는 기법은 또 다른 방식이다. ①②④는 기업이 활용한 창의성 계발 기법의 예로 제시되었다.","source":{"page":27,"section":"02. 창의성을 높이는 영재교육 - 메모하고 기록하는 습관을 길러줌","quote":"“마인드 맵”과 같이 하나의 주제에서 여러 형태로 가지를 쳐 나가면서 아이디어를 발전시켜 나가는 방법"}},{"id":"48-33","type":"옳은 것","q":"창의성을 키우는 칭찬과 격려에 대한 설명으로 옳은 것은?","box":null,"choices":["영재 학생은 주위 사람들에게 인정받고 싶은 욕구가 일반 학생보다 작다.","칭찬을 받으면 만족하여 노력을 줄이게 된다.","칭찬은 가족보다 낯선 사람에게 받을 때 효과가 크다.","작은 행동에 대한 칭찬은 습관 형성과 관련이 없다.","칭찬을 받게 되면 칭찬을 받았던 작은 행동이 반복되어 좋은 습관으로 발전한다."],"answer":5,"explain":"⑤ 교안 그대로이다. ① 영재 학생도 가까운 가족이나 부모, 선생님, 친구들에게 인정받고 칭찬받고 싶어 하는 욕구가 크다. ② 칭찬에 부응하기 위해 더 열심히 노력하게 된다. ③ 교안은 특히 가까운 가족·부모·선생님·친구를 강조했다. ④ 작은 행동이 반복되어 좋은 습관이 된다.","source":{"page":28,"section":"02. 창의성을 높이는 영재교육 - 창의성을 키우는 칭찬과 격려","quote":"칭찬을 받게 되면 칭찬을 받았던 작은 행동이 반복되어 좋은 습관으로 발전하기 때문임"}},{"id":"48-34","type":"옳지 않은 것","q":"교안에 제시된 '창의성을 해치는 교사의 한마디'에 해당하지 않는 것은?","box":null,"choices":["말도 안 되는 소리 하지도 마","그것 봐! 내가 안 된다고 했잖아","시키는 대로, 그냥 해. 다들 그렇게 했어","누구나 실수할 수 있어. 괜찮아","다른 사람들이 어떻게 생각하겠어?"],"answer":4,"explain":"④ '누구나 실수할 수 있어. 괜찮아'는 창의성을 '높이는' 교사의 한마디이다. ①②③⑤는 창의성을 해치는 교사의 한마디이다(그 밖에 '쓸데없는 짓 좀 그만해라', '너는 말이 너무 많아', '선생님이 안 된다고 했을 텐데').","source":{"page":29,"section":"02. 창의성을 높이는 영재교육 - 창의성을 해치는 교사의 한마디","quote":"“말도 안되는 소리하지도마” / “그것 봐! 내가 안된다고 했잖아” / “쓸데없는 짓좀그만해라” / “너는 말이너무많아”"}},{"id":"48-35","type":"보기 조합","q":"\u003c보기\u003e에서 교안에 제시된 '창의성을 높이는 교사의 한마디'를 모두 고른 것은?","box":"ㄱ. 선생님은 네가 잘 해낼 것이라고 믿어\nㄴ. 너는 말이 너무 많아\nㄷ. 어떻게 이런 좋은 아이디어를 낼 수 있니?\nㄹ. 지금은 힘들지만, 반드시 해낼 거야\nㅁ. 선생님이 안 된다고 했을 텐데","choices":["ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄹ, ㅁ","ㄱ, ㄹ, ㅁ","ㄷ, ㄹ, ㅁ"],"answer":1,"explain":"① ㄱ·ㄷ·ㄹ은 창의성을 높이는 한마디(그 밖에 '잘했어, 지금 잘하고 있는 거야', '아주 좋은 생각이야', '그렇게 계속 해내면 성공할 거야', '누구나 실수할 수 있어. 괜찮아'). ㄴ·ㅁ은 창의성을 해치는 한마디. ㄴ 또는 ㅁ이 포함된 ②③④⑤는 틀리다.","source":{"page":30,"section":"02. 창의성을 높이는 영재교육 - 창의성을 높이는 교사의 한마디","quote":"“선생님은 네가잘해낼 것이라고믿어” / “어떻게 이런좋은아이디어를낼수있니?” / “지금은 힘들지만, 반드시 해낼거야”"}}]},{"lesson":49,"title":"자기주도학습과 공감협업력을 키우는 영재교육","file":"4. 교안 (31~60)[1] (1)/49.pdf","summary":["영재학생의 고민: 학업성취도는 높지만 부모님으로부터 만들어진 공부를 한다는 생각에 상실감과 회의감을 느낌(영재학교 1학년 '꼭두각시 인형')","PISA 2022: 한국 학생 수학·읽기·과학 모든 영역 OECD 평균보다 높음, 81개국 중 최고 2~3위 / 최상위 학생 22% \"삶에 불만족\"(한국경제, 2023. 12. 17)","OECD(2000) \"지식기반경제를 위한 교육\", OECD(2019) \"2030년 교육의 미래\" → 평생교육이 더욱 중요해지는 미래사회","평생학습(long life study) 중요 / 영재교육상담가들은 너무 일찍 번아웃(조로(早老) 현상)을 겪을까 우려","자기주도학습: 자신의 학습수준 평가, 자원 분석, 학습 목표 설정 → 자율적으로 학습 / 사회에서 성공적인 삶을 살아가는 데 중요한 혁신역량","자기주도학습력 높이기: 첫째 스캐폴딩 기법(자전거 배우기 비유), 둘째 스스로 인식하도록 지도(작은 기쁨들 → 자기주도력 성장), 셋째 학습과정과 결과를 체크하는 습관(\"하던 일도 멍석 깔아주면 안 한다\")","공감협업력: 자신과 타인의 감정을 잘 인식하고 이해하고 조정하는 능력 / 2000년 이후 과학분야 노벨상 개인수상자는 단 2명","정서지능(EQ): 1990년대 Time지 기자이자 심리학자 다니엘 골만이 TIME지에 소개 / 감정은 생각을 도와 시너지 효과","공감협업력 제1단계: 자신을 이해하라! / 제2단계: 타인을 이해하라!(감정적인 부분을 공감하는 것이 먼저)","유학 간 영재학생: 중퇴율 높음, 이공계일수록 팀프로젝트·공동연구에 공감하고 소통하는 능력 필요","글로벌 기업: 수직적 직급호칭 없애고 수평적·유연한 팀제, 다양한 전공자의 융합형 프로젝트"],"questions":[{"id":"49-01","type":"사례","q":"다음은 '왜 어려운 공부를 하느냐'는 기자의 질문에 대한 학생들의 답변이다. 교안에서 제시한 학생과 답변의 연결로 옳은 것은?","box":null,"choices":["대학부설 영재교육원 학생 – \"지금 내가 하는 전공이 정말 잘 선택한 건지 몰라 상담을 하고 싶어요.\"","하버드대학교 유학 중인 유학생 – \"엄마가 공부를 잘하면 기뻐하니까요.\"","영재학교 1학년 학생 – 부모님이 하라는 대로 공부만 잘해 온 '꼭두각시 인형' 같다는 생각이 많이 들어요.","영재학교 1학년 학생 – \"엄마가 공부를 잘하면 기뻐하니까요.\"","대학부설 영재교육원 학생 – '꼭두각시 인형' 같다는 생각이 많이 들어요."],"answer":3,"explain":"영재학교 1학년 학생이 '꼭두각시 인형' 같다고 답했다. 대학부설 영재교육원 학생은 \"엄마가 공부를 잘하면 기뻐하니까요.\", 하버드대 유학생은 전공·꿈·적성이 맞는지 몰라 상담을 원한다고 답했다. ①②④⑤는 학생과 답변이 뒤바뀌었다.","source":{"page":3,"section":"01. 자기주도학습과 영재교육 - 영재학생이 이야기하는 고민","quote":"영재학교 1 학년 학생 / • “솔직하게 말하면OO 학교를 다니고있지만, 지금까지 부모님이하라는대로공부만잘해온 ‘꼭두각시인형’같다는생각이많이들어요."}},{"id":"49-02","type":"빈칸","q":"다음은 영재학생이 이야기하는 고민을 정리한 것이다. (   )에 들어갈 말로 알맞은 것은?","box":"현재 학업성취도는 높지만, 본인이 진정 원하는 공부를 하는 것이 아니라 (   )(으)로부터 만들어진 공부를 하고 있다는 생각이 들어 상실감과 회의감을 느낌","choices":["부모님","담임교사","또래 친구","사교육 강사","영재교육기관"],"answer":1,"explain":"교안은 '부모님으로부터 만들어진 공부'를 하고 있다는 생각에 상실감과 회의감을 느낀다고 정리했다. 나머지는 교안에 제시되지 않았다.","source":{"page":4,"section":"01. 자기주도학습과 영재교육 - 영재학생이 이야기하는 고민","quote":"현재학업성취도는높지만, 본인이 진정원하는공부를하는것이아니라부모님으로부터만들어진공부를하고있다는생각이들어상실감과회의감을느낌"}},{"id":"49-03","type":"옳은 것","q":"교안에 제시된 국제학업성취도평가(PISA) 2022 결과에 대한 설명으로 옳은 것은?","box":null,"choices":["한국 학생들은 수학 영역에서만 OECD 평균보다 높은 점수를 기록했다.","평균점수 순위로 전체 조사대상국(61개국)에서 최고 1위를 차지했다.","최상위 학생의 42%가 \"삶에 불만족\"이라고 응답했다.","최상위 학생 22%가 \"삶에 불만족\"이라고 응답해 학업성취 부문의 높은 점수와 뚜렷이 대조되었다.","한국 학생들의 점수는 읽기 영역에서 OECD 평균보다 낮았다."],"answer":4,"explain":"\"똑똑하지만 행복하진 않아\" 최상위 학생 22% \"삶에 불만족\"이며, 이는 학업성취 부문의 높은 점수와 뚜렷이 대조된다. ①⑤ 수학·읽기·과학 모든 영역에서 OECD 평균보다 높음. ② 81개국에서 최고 2∼3위. ③ 42% → 교안은 22%.","source":{"page":5,"section":"01. 자기주도학습과 영재교육 - 국제학업성취도평가(PISA) 2022 결과","quote":"“똑똑하지만행복하진않아” 최상위학생22% “삶에불만족” / 조사결과는학업성취부문의높은점수와뚜렷이대조된다."}},{"id":"49-04","type":"빈칸","q":"다음 PISA 2022 관련 기사 내용의 (   )에 들어갈 말로 알맞은 것은?","box":"PISA 2022에서 한국 학생들의 수학, 읽기, 과학 점수는 모든 영역에서 OECD 평균보다 높은 점수를 기록했다. 평균점수로 매긴 순위로 전체 조사대상국((   )개국)에서 최고 2∼3위를 차지하는 등 최상위권에 속했다.","choices":["38","61","72","81","92"],"answer":4,"explain":"전체 조사대상국은 81개국이다. 나머지 숫자는 교안과 다르다.","source":{"page":5,"section":"01. 자기주도학습과 영재교육 - 국제학업성취도평가(PISA) 2022 결과","quote":"평균점수로매긴순위로전체조사대상국(81개국)에서최고 2∼3위를차지하는등최상위권에속했다."}},{"id":"49-05","type":"개념 찾기","q":"평생교육이 더욱 중요해지는 미래사회와 관련하여, 다음 설명에 해당하는 OECD 보고서는?","box":"‣ 지식기반 경제에서 성공하기 위해서는 개인이 평생에 걸쳐 학습하고 적응할 수 있는 역량이 필요함\n‣ 평생교육을 통해 개인은 직업적 능력을 개발하고, 새로운 기술을 습득하며, 사회 참여를 확대할 수 있음","choices":["OECD (2019) \"2030년 교육의 미래\"","OECD (2000) \"지식기반경제를 위한 교육\"","OECD (2000) \"2030년 교육의 미래\"","OECD (2019) \"지식기반경제를 위한 교육\"","OECD (2022) \"국제학업성취도평가\""],"answer":2,"explain":"지식기반 경제와 평생 학습·적응 역량은 OECD(2000) \"지식기반경제를 위한 교육\"의 내용이다. ① OECD(2019) \"2030년 교육의 미래\"는 2030년까지 평생교육 기회 보장, 학교교육과 직업교육 연계를 강조. ③④ 연도와 보고서명이 뒤섞임. ⑤ 교안에 없는 보고서명.","source":{"page":6,"section":"01. 자기주도학습과 영재교육 - 평생교육이 더욱 중요해지는 미래사회","quote":"OECD (2000) “지식기반경제를위한교육”평생교육이더욱중요해지는미래사회 / ‣ 지식기반 경제에서성공하기위해서는개인이평생에걸쳐학습하고적응할수있는 역량이필요함"}},{"id":"49-06","type":"옳은 것","q":"OECD(2019) \"2030년 교육의 미래\"에서 제시한 평생교육에 대한 내용으로 옳은 것은?","box":null,"choices":["국가는 청소년이 사회인이 되는 2050년까지 평생교육 기회를 보장해야 한다.","평생교육은 학교교육과 분리된 별도의 직업교육 체계로 운영되어야 한다.","평생교육은 디지털 기술 활용을 최소화하여 안정적인 교육체계를 구축해야 한다.","평생교육은 일부 우수 인재에게 선택적으로 제공되어야 한다.","평생교육은 학교교육과 직업교육을 연계하고, 디지털 기술을 활용하여 보다 개방적이고 유연한 교육체계를 구축해야 한다."],"answer":5,"explain":"교안은 학교교육과 직업교육을 연계하고 디지털 기술을 활용하여 개방적·유연한 교육체계를 구축해야 한다고 했다. ① 2050년 → 2030년. ② 분리 → 연계. ③ 디지털 기술을 활용. ④ 모든 사람이 평생교육을 받을 수 있는 기회를 보장.","source":{"page":7,"section":"01. 자기주도학습과 영재교육 - OECD (2019) “2030년 교육의 미래”","quote":"국가는 청소년이사회인이되는2030년까지모든사람이평생교육을받을수있는 기회를보장해야함‣ 평생교육은 학교교육과직업교육을연계하고, 디지털 기술을활용하여보다개방적이고유연한교육체계를구축해야함"}},{"id":"49-07","type":"빈칸","q":"다음은 우리나라 영재학생들의 현실에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"영재교육상담가들은 영재학생들이 평생학습과 반대로, 너무 일찍 번아웃( (   ) 현상)을 겪지 않을까 우려함","choices":["조로(早老)","과잉흥분","미성취","가면","완벽주의"],"answer":1,"explain":"교안은 너무 일찍 겪는 번아웃을 '조로(早老) 현상'이라고 표현했다. 나머지는 교안의 해당 문장에 없는 표현이다.","source":{"page":8,"section":"01. 자기주도학습과 영재교육 - 우리나라 영재학생들의 현실","quote":"영재교육상담가들은영재학생들이평생학습과반대로,  너무일찍번아웃( 조로 ( 早老) 현상 ) 을겪지 않을까우려함"}},{"id":"49-08","type":"옳지 않은 것","q":"교안에서 설명한 우리나라 영재학생들의 현실에 대한 내용으로 옳지 않은 것은?","box":null,"choices":["학교에서 공부했던 것으로 평생을 사는 세상이 아닌, 불확실성이 높아지는 미래사회로 진입했다.","빠른 변화에 잘 적응하려면 스스로 공부를 지속 가능하도록 만드는 평생학습(long life study)이 더욱 중요하다.","영재교육기관에 다니는 학생들이 타인의 압력과 강요에 의해서 만들어지고 있지는 않은지 살펴보아야 한다.","평생학습보다는 학교에서 축적한 지식을 빠르게 완성하는 것이 미래사회 적응에 더 중요하다.","영재교육상담가들은 영재학생들이 너무 일찍 번아웃을 겪지 않을까 우려한다."],"answer":4,"explain":"교안은 학교에서 공부했던 것으로 평생을 사는 세상이 아니며, 스스로 공부를 지속 가능하도록 만드는 평생학습이 더욱 중요하다고 했다. 따라서 ④는 반대 서술이다.","source":{"page":8,"section":"01. 자기주도학습과 영재교육 - 우리나라 영재학생들의 현실","quote":"학교에서공부했던것으로평생을사는세상이아닌, 빠르게 변하고어떤상황으로전개될지도모르는불확실성이높아지는미래사회로진입함빠른변화에잘적응하려면 스스로공부를지속가능하도록만드는평생학습(long life study)이더욱 중요"}},{"id":"49-09","type":"개념 찾기","q":"다음 설명에 해당하는 것은?","box":"학습자가 자신의 학습을 주도적으로 이끌어 나갈 수 있는 능력. 현재 자신의 학습수준을 잘 평가하고 자신이 가지고 있고 활용할 수 있는 자원을 잘 분석하여, 학습 목표를 설정하여 자율적으로 학습하는 것. 나아가 사회에 진출하여 성공적인 삶을 살아가는 데 중요한 혁신역량임","choices":["공감협업력","정서지능","자기주도학습","평생교육","스캐폴딩"],"answer":3,"explain":"제시문은 교안의 '자기주도학습' 정의이다. ① 공감협업력은 자신과 타인의 감정을 인식·이해·조정하는 능력. ② 정서지능은 정서를 인식·이해·조절하고 타인과 공감·협업하는 사회적 능력. ④ 평생교육은 OECD 보고서 관련 개념. ⑤ 스캐폴딩은 자기주도학습력을 키우는 기법.","source":{"page":9,"section":"01. 자기주도학습과 영재교육 - 자기주도학습이란?","quote":"학습자가자신의학습을주도적으로이끌어나갈수있는 능력현재자신의학습수준을잘평가하고 자신이가지고있고활용할수있는 자원을잘분석하여 , 학습 목표를설정하여자율적으로학습하는것을말함"}},{"id":"49-10","type":"옳은 것","q":"교안에서 설명한 자기주도학습에 대한 내용으로 옳은 것은?","box":null,"choices":["교사가 설정한 학습 목표를 학습자가 그대로 따르는 학습을 말한다.","학습의 효율성보다 학습 시간의 양을 늘리는 데 초점을 둔다.","학습자의 학습성취도를 향상시키고, 학습의 효율성을 높이는 데 도움이 된다.","학교 학습에 한정되며 사회 진출 이후의 삶과는 관련이 적다.","자원 분석 없이 흥미에 따라 자유롭게 학습하는 것을 의미한다."],"answer":3,"explain":"자기주도학습은 학습성취도 향상과 학습 효율성 제고에 도움이 된다. ① 학습자가 스스로 학습 목표를 설정. ② 효율성을 높임. ④ 사회에 진출하여 자기주도적으로 성공적인 삶을 살아가는 데 중요한 혁신역량. ⑤ 활용할 수 있는 자원을 잘 분석.","source":{"page":9,"section":"01. 자기주도학습과 영재교육 - 자기주도학습이란?","quote":"학습자의학습성취도를향상시키고, 학습의 효율성을높이는데도움이 됨나아가사회에진출하여자기주도적으로성공적인삶을살아가는데중요한혁신역량임"}},{"id":"49-11","type":"빈칸","q":"자기주도학습력을 높이는 영재교육의 첫째 방안이다. (   )에 들어갈 말로 알맞은 것은?","box":"자기주도학습력은 학습을 해 가면서 제공하는 정보와 지원을 점차 감소시키는 (   ) 기법을 통해 성장함. 마치 자전거를 배울 때와 같은 과정을 거쳐 자기주도력이 키워지는 것임","choices":["브레인스토밍","스캐폴딩","멘토링","플립러닝","코칭"],"answer":2,"explain":"정보와 지원을 점차 감소시키는 기법은 '스캐폴딩' 기법이다. 나머지는 교안의 해당 문장에 없는 용어이다.","source":{"page":10,"section":"01. 자기주도학습과 영재교육 - 자기주도학습력을 높이는 영재교육","quote":"첫째, 자기주도학습력은 학습을해가면서제공하는정보와지원을점차감소시키는스캐폴딩기법을통해성장함"}},{"id":"49-12","type":"사례","q":"다음 사례가 비유하고 있는 자기주도학습력 향상 원리에 대한 설명으로 가장 알맞은 것은?","box":"처음에는 부모가 뒤에서 자전거를 힘 있게 잡아 주고 페달을 밟는 법, 핸들을 조정하는 법을 가르쳐 주고, 이윽고 아이가 신나서 자전거를 쭉 타고 나갈 때 아이도 모르게 어른이 자전거를 놓아준다.","choices":["부모가 모든 것을 끝까지 지원해 줄수록 자기주도학습력이 커진다.","학습 초기부터 지원 없이 스스로 해결하게 해야 자기주도력이 생긴다.","학습 결과만 점검하고 학습 과정은 체크할 필요가 없다.","제공하는 정보와 지원을 점차 감소시켜 스스로 학습하도록 이끈다.","다른 사람이 좋다고 권하는 방법을 그대로 따르게 해야 한다."],"answer":4,"explain":"자전거 배우기 비유는 정보와 지원을 점차 감소시키는 스캐폴딩 기법을 설명한다. ① 부모가 모든 것을 다 지원하면 스스로 자기주도적인 학습을 할 필요를 못 느끼게 된다. ② 처음에는 지원을 제공함. ③ 셋째 방안은 학습과정과 결과를 체크하는 습관. ⑤ 남이 강요하는 것을 좋아하지 않음.","source":{"page":10,"section":"01. 자기주도학습과 영재교육 - 자기주도학습력을 높이는 영재교육","quote":"부모가 모든것을다지원해 준다면, 반대로 영재학생은스스로애를써서자기주도적인학습을할필요를 못느끼게되는결과를초래함"}},{"id":"49-13","type":"옳은 것","q":"자기주도학습력을 높이는 영재교육의 둘째 방안에 대한 설명으로 옳은 것은?","box":null,"choices":["영재 담당교사는 학생의 부족한 부분을 대신 판단하여 보완 계획을 세워 주어야 한다.","영재학생이 무엇을 잘 알고, 어떤 과목이 재미있으며, 무엇을 어떻게 보완해야 하는지를 스스로 인식할 수 있도록 지도해야 한다.","새로운 지식을 알아가는 기쁨보다 외적 보상이 자기주도력 성장의 핵심이다.","큰 성공 경험 한 번이 작은 기쁨들보다 자기주도력 성장에 중요하다.","최소의 노력으로 최대의 성적을 내도록 교사가 계획을 세워 주어야 한다."],"answer":2,"explain":"둘째 방안은 학생이 스스로 인식할 수 있도록 지도하는 것이다. ①⑤ 학생이 자기주도적으로 계획을 세우도록 지도. ③④ 새로운 지식을 알아가는 기쁨, 스스로 계획을 세워 실천해서 얻는 기쁨 등 작은 기쁨들이 하나씩 모여서 자기주도력이 성장.","source":{"page":11,"section":"01. 자기주도학습과 영재교육 - 자기주도학습력을 높이는 영재교육","quote":"둘째, 영재 담당교사는영재학생이무엇을잘알고 있고, 어떤과목이재미있으며, 어떤 부분이부족해서무엇을어떻게보완해야하는지를스스로인식할수있도록 지도해주어야함"}},{"id":"49-14","type":"보기 조합","q":"자기주도학습력을 높이는 영재교육의 셋째 방안에 대한 설명으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 스스로 세운 학습목표와 계획이 잘 되었는지 학습과정과 결과를 체크하는 습관을 길러 주어야 한다.\nㄴ. 자기주도력은 처음부터 아이에게 저절로 생기는 것이다.\nㄷ. \"하던 일도 멍석 깔아주면 안 한다.\"고 하듯이, 남이 좋다고 해 보라고 강요하는 것을 좋아하지 않는다.\nㄹ. 영재학생 스스로 선택하고 결정하여 실행한 행동에 대해서 더 많이 책임을 지려 한다.","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"ㄱ·ㄷ·ㄹ은 교안 내용 그대로이다. ㄴ 교안은 '자기주도력은 처음부터 아이에게 저절로 생기는 것이 아님'이라고 했다.","source":{"page":12,"section":"01. 자기주도학습과 영재교육 - 자기주도학습력을 높이는 영재교육","quote":"자기주도력은 처음부터아이에게저절로생기는것이아님‣ “ 하던 일도멍석깔아주면안한다 .” 고하듯이 , 남이 좋다고해보라고강요하는것을좋아하지않음"}},{"id":"49-15","type":"사례","q":"다음은 영재학생이 이야기하는 고민들이다. 이러한 고민을 해결하기 위해 교안에서 강조하는 역량은?","box":"\"그냥 기분이 나빠. 그래서 아무것도 하고 싶지 않아.\"\n\"친구가 왜 저런지 이해할 수가 없어. 나도 힘들어.\"\n\"이번 조 과제에 다 같이 참여해서 즐겁게 할 수 있는 방법은 없을까?\"\n\"어떻게 하면 팀원들에게 잘 이해시키고 동참시킬 수 있을까?\"","choices":["선행학습력","공감협업력","논리적 추론력","기억력","경쟁력"],"answer":2,"explain":"자신과 타인의 감정, 조 과제·팀원과의 협업에 관한 고민은 '02. 공감협업력과 영재교육'에서 다루는 공감협업력과 관련된다. 나머지는 교안에서 이 고민과 연결하지 않았다.","source":{"page":14,"section":"02. 공감협업력과 영재교육 - 영재학생이 이야기하는 고민","quote":"친구가왜저런지 이해할수가없어. 나도 힘들어.이번조과제에 다같이 참여해서즐겁게할수있는 방법은없을까?어떻게하면팀원들에게잘이해시키고 동참시킬수있을까 ?"}},{"id":"49-16","type":"옳은 것","q":"교안에서 설명한 공감협업력에 대한 내용으로 옳은 것은?","box":null,"choices":["공감협업력은 자신의 감정만을 잘 인식하고 통제하는 능력이다.","2000년 이후 과학분야 노벨상 수상자는 대부분 개인 단독수상자이다.","2000년 이후 과학분야 노벨상 개인수상자는 단 2명이고, 대부분 공동수상자들이 많다.","미래사회일수록 다양한 사람의 팀워크보다 개인의 혼자 힘이 더 중요해진다.","2000년 이후 과학분야 노벨상 개인수상자는 단 12명이다."],"answer":3,"explain":"2000년 이후 과학분야 노벨상 개인수상자는 단 2명이고 대부분 공동수상자이다. ① 자신과 타인의 감정을 잘 인식하고 이해하고 조정하는 능력. ② 대부분 공동수상. ④ 개인의 혼자 힘보다는 팀워크를 최대한 발휘해야 함. ⑤ 12명 → 2명.","source":{"page":15,"section":"02. 공감협업력과 영재교육 - 공감협업력을 키우는 영재교육","quote":"2000년이후 과학분야노벨상수상자들을살펴보면, 개인수상자는단2 명이고 대부분공동수상자들이많음"}},{"id":"49-17","type":"옳지 않은 것","q":"그동안 동서양을 막론하고 이루어져 온 교육의 모습으로 교안에 제시된 것이 아닌 것은?","box":null,"choices":["\"감정을 드러내지 마라\"","\"감정의 노예가 되지 마라\"","\"포커페이스를 유지하라\"","\"뜨거운 감정보다 차가운 이성으로 판단하라\"","\"이성보다 감정을 먼저 표현하라\""],"answer":5,"explain":"그동안의 교육은 똑똑하고 합리적이고 논리적인 '이성'을 중요하게 생각하고 '감정'을 배제했다. ①~④는 교안에 제시된 예이며, ⑤는 감정을 배제하는 교육과 반대되는 내용이다.","source":{"page":16,"section":"02. 공감협업력과 영재교육 - 공감협업력을 키우는 영재교육","quote":"그동안동서양을막론하고똑똑하고, 합리적이고 논리적인 / ‘이성’을 중요하게생각했고‘감정’을 배제하는교육을해옴"}},{"id":"49-18","type":"옳은 것","q":"정서지능(EQ; Emotional Quotient)의 등장에 대한 설명으로 옳은 것은?","box":null,"choices":["1990년대를 맞아 Time지 기자이자 심리학자였던 다니엘 골만이 \"EQ\"를 TIME지에 소개하였다.","1970년대 하워드 가드너가 \"EQ\"를 처음 소개하였다.","정서지능에 따르면 감정은 합리적이고 논리적인 생각을 방해한다.","2000년대 이후 OECD 보고서를 통해 처음 소개되었다.","정서지능은 이성을 배제하고 감정만으로 판단하는 능력이다."],"answer":1,"explain":"1990년대 Time지 기자이자 심리학자 다니엘 골만이 EQ를 TIME지에 소개하면서 정서 연구가 활발해졌다. ②④ 연도·인물·출처가 다름. ③ 감정은 생각을 방해하는 것이 아니라 오히려 생각을 도와서 시너지 효과를 냄. ⑤ 교안의 정의와 다름.","source":{"page":17,"section":"02. 공감협업력과 영재교육 - 정서지능의 등장","quote":"1990년대를맞아Time지의기자이자심리학자였던다니엘골만이“ EQ” 를TIME 지에소개되면서정서에대한연구가활발히이루어지기시작"}},{"id":"49-19","type":"빈칸","q":"다음은 정서지능에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"정서지능에 따르면, 감정은 합리적이고 논리적인 생각을 방해하는 것이 아니라, 오히려 감정은 생각을 도와서 (   )를 낼 수 있는 강력한 효과가 있음","choices":["상쇄 효과","후광 효과","시너지 효과","플라시보 효과","피그말리온 효과"],"answer":3,"explain":"감정은 생각을 도와서 '시너지 효과'를 낼 수 있다. 나머지는 교안에 없는 표현이다.","source":{"page":17,"section":"02. 공감협업력과 영재교육 - 정서지능의 등장","quote":"정서지능에따르면, 감정은 합리적이고논리적인생각을방해하는것이아니라, 오히려 감정은생각을도와서시너지효과를낼수있는 강력한효과가있음"}},{"id":"49-20","type":"개념 찾기","q":"다음 설명에 해당하는 개념은?","box":"자신과 타인, 나아가 사회에 대한 정서를 잘 인식하고 이해하며, 정서를 조절하고 통제하며, 타인과 공감하며 협업할 수 있는 사회적 능력","choices":["자기주도학습","평생학습","메타인지","창의적 사고","정서지능"],"answer":5,"explain":"제시문은 교안의 '정서지능' 정의이다. ① 자기주도학습은 학습을 주도적으로 이끌어 나가는 능력. ② 평생학습은 스스로 공부를 지속 가능하도록 만드는 것. ③④ 교안의 해당 정의와 무관.","source":{"page":18,"section":"02. 공감협업력과 영재교육 - 정서지능의 등장","quote":"정서지능이란자신과타인, 나아가 사회에대한정서를잘인식하고이해하며, 정서를 조절하고통제하며, 타인과 공감하며협업할수있는 사회적능력"}},{"id":"49-21","type":"사례","q":"다음 학생의 말과 가장 관련 있는 공감협업력의 단계는?","box":"\"나도 나를 잘 모르겠어.\" \"내가 지금 왜 기분이 안 좋고 화가 나지?\" \"우울하고 불안한 이 감정은 뭐지?\"","choices":["공감협업력 제1단계: 자신을 이해하라!","공감협업력 제2단계: 타인을 이해하라!","공감협업력 제3단계: 팀을 이끌어라!","자기주도학습력 첫째 방안: 스캐폴딩","자기주도학습력 셋째 방안: 과정과 결과 체크"],"answer":1,"explain":"자기 자신의 감정을 잘 인식하고 이해하고 조절하는 것은 제1단계 '자신을 이해하라!'에 해당한다. ② 타인의 감정 이해·경청·공감. ③ 교안에 없는 단계. ④⑤ 자기주도학습력 관련 방안.","source":{"page":19,"section":"02. 공감협업력과 영재교육 - 공감협업력 제1단계: 자신을 이해하라!","quote":"자기자신의감정을잘인식하고 이해하고조절할수있는 능력과태도를키워주어야함 / ‣ “나도 나를잘모르겠어 . ”"}},{"id":"49-22","type":"옳은 것","q":"공감협업력 제2단계 '타인을 이해하라!'에 대한 설명으로 옳은 것은?","box":null,"choices":["화가 나 있는 친구에게는 먼저 합리적으로 설명하여 이해시키는 것이 중요하다.","감정적인 부분을 공감하는 것이 먼저이며, 이후 상황과 말·행동에 대해 같이 생각해 보고 해결 방법을 찾아야 한다.","감정이 폭발하기 직전인 상태에서는 논리적 설명이 가장 잘 들린다.","타인의 감정보다 문제 해결 방법을 먼저 제시해야 한다.","\"나라도 그렇게 했을 거야\"와 같은 말은 감정을 부추기므로 피해야 한다."],"answer":2,"explain":"감정적인 부분을 공감하는 것이 먼저이다. ①③ 감정이 폭발하기 직전에는 말로 아무리 합리적으로 설명해도 들리지 않음. ④ 감정을 먼저 다독거림. ⑤ 교안에서 공감의 예시로 제시된 말.","source":{"page":21,"section":"02. 공감협업력과 영재교육 - 공감협업력 제2단계: 타인을 이해하라!","quote":"감정적인부분을공감하는것이먼저이며,                       화나거나불안한당시의상황및말과 행동에대해서같이생각해보고같이해결할수있는 방법을찾아야함"}},{"id":"49-23","type":"사례","q":"화가 나 있거나 불안해하는 친구를 대할 때, 교안에서 공감협업력 제2단계의 예시로 제시한 말은?","box":null,"choices":["\"그건 네가 감정적으로 판단했기 때문이야\"","\"포커페이스를 유지해\"","\"네 기분 충분히 이해할 수 있어\"","\"뜨거운 감정보다 차가운 이성으로 판단해\"","\"감정은 접어 두고 문제부터 해결하자\""],"answer":3,"explain":"교안은 친구 입장에서 경청하며 공감하는 말로 \"나라도 그렇게 했을 거야\", \"네 기분 충분히 이해할 수 있어\", \"나도 그럴 때, 기분이 참 안 좋은 것 같아\"를 제시했다. ②④는 감정을 배제해 온 기존 교육의 예이고, ①⑤는 감정을 먼저 공감하라는 제2단계와 반대된다.","source":{"page":20,"section":"02. 공감협업력과 영재교육 - 공감협업력 제2단계: 타인을 이해하라!","quote":"‣ “나라도 그렇게했을거야”‣ “네 기분충분히이해할수있어” ‣ “나도 그럴때, 기분이 참안좋은 것같아”"}},{"id":"49-24","type":"옳지 않은 것","q":"영재학생들이 유학 중 어려움을 겪는 이유에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["입학할 때는 똑똑하고 성적도 우수하나 학교 중퇴율이 높다.","입학 초기에는 선행학습으로 축적된 지식이 많다.","창의적으로 생각을 융합하고 새로운 아이디어로 연구논문을 쓰는 데 서툴다.","인문계일수록 팀프로젝트와 공동연구에서 공감하고 소통하는 능력이 필요하다.","우리나라 교육과 시험제도에서 공감협업력을 제대로 교육받지 못했다."],"answer":4,"explain":"교안은 '이공계일수록' 팀프로젝트와 공동연구를 할 때 공감하고 소통하는 능력이 필요하다고 했다. 나머지는 교안 내용과 같다.","source":{"page":22,"section":"02. 공감협업력과 영재교육 - 영재학생에게 필수적인 공감협업력","quote":"이공계일수록 팀프로젝트와 공동연구를할때필요한 것은공감하고소통하는능력임"}},{"id":"49-25","type":"옳은 것","q":"교안에서 제시한 글로벌 기업의 조직문화 변화에 대한 설명으로 옳은 것은?","box":null,"choices":["수직적인 직급호칭을 강화하여 책임 소재를 명확히 한다.","한번 구성된 팀은 해체 없이 장기간 유지하는 고정된 팀제를 운영한다.","동일 전공자 중심의 전문 프로젝트를 진행한다.","수직적인 직급호칭을 없애고, 수시로 구성 및 해체가 가능한 팀프로젝트 중심의 수평적이고 유연한 팀제를 운영한다.","팀의 리더는 공동 목표보다 개인 성과를 우선시하는 역량이 중요하다."],"answer":4,"explain":"글로벌 기업들은 과거의 경직된 조직문화를 탈피해 수평적·유연한 팀제를 운영한다. ① 직급호칭을 없앰. ② 수시로 구성 및 해체 가능. ③ 다양한 전공자들이 모인 융합형 프로젝트. ⑤ 공동의 목표 설정, 상호이해와 공감대 형성 역량이 중요.","source":{"page":23,"section":"02. 공감협업력과 영재교육 - 영재학생에게 필수적인 공감협업력","quote":"수직적인 직급호칭을없애고, 언제 어디서든수시로구성및해체가가능한팀프로젝트 중심의수평적이고유연한팀제를운영함"}}]},{"lesson":50,"title":"노벨상 수상자들에게 영재교육의 길을 묻다","file":"4. 교안 (31~60)[1] (1)/50.pdf","summary":["노벨상 6개 중 과학분야: 물리, 생리의학, 화학","TIME지 선정 세기의 100인(1999. 6. 6): \"20세기 최고의 인물\" 아인슈타인, 2위 뉴턴, 과학자 다음으로 많은 분야는 철학자(프로이트 등)","과학분야 노벨상: 노벨의 사망일인 12월 10일 스웨덴 스톡홀름 시상 / 수상까지 평균 32년 / 수상자 평균연령 69.1세 (YTN Science TV, 2022. 10. 10)","상금 1000만 스웨덴 크로나(약 13억원), 공동수상자에게 동등 지급 / 2000년 이후 개인 단독수상은 단 2건, 창의융합형 연구가 대부분","2009년 노벨 생리학·의학상 엘리자베스 블랙번·캐럴 그라이더(세포노화과정) / 2000년 물리학상 에릭 베르너(핵융합, 태양 에너지원) / 2002년 경제학상 대니얼 카너먼(심리학+경제학, 의사결정) / 2002년 화학상 다나카 고이치(시마즈제작소, 리간드-금속 결합) / 2012년 생리학·의학상 오무라 사토시, 야마나카 신야(유도 만능줄기세포)","딘 사이먼튼(Dean Simonton, 캘리포니아대 심리학 교수) 30년 연구: 4가지 성공비결 \"우연, 논리성과 직관, 영재성, 시대정신\" → 모두 조합·통합","우연과 기회: 뉴턴(사과·중력), 플레밍(푸른곰팡이·페니실린), 가임과 노보셀로프(3M 테이프·흑연) / 심리학자들은 \"No!\"","와이즈버그 \"10년의 법칙\", 말콤 글래드웰 \"아웃라이어\" \"1만 시간의 법칙\"(하루 3시간×10년), 파스퇴르 \"우연은 준비된 마음에만 찾아온다.\"","논리성과 직관: 엄격한 논리성 하나로는 부족 / 히로나가 헤이스케(필즈상 아시아인 최초, 피아노 연주 경험) → \"명쾌하고 직관적인 예술적 상상력\"","영재성: 미국 영재교육법(조기 발견·국가의 특별 지원) / 최근 동향(가정·교육·사회 등 환경에서 잘 교육되어야 발현)","시대정신: 난세에 영웅 / 로버트 오펜하이머(제2차 세계대전, 국방과학산업) / 코로나 백신, 줄기세포, 유전자 조작 가위, 대체에너지, AI, 휴머노이드, 자율주행","정리: 영재성 + 논리적 분석력과 직관·상상력 + 우연(기회) + 시대정신과의 통합으로 노벨상 수상"],"questions":[{"id":"50-01","type":"옳은 것","q":"교안에서 제시한 노벨상 6개 중 과학분야에 해당하는 노벨상으로 옳게 묶인 것은?","box":null,"choices":["물리, 화학, 경제학","물리, 생리의학, 화학","생리의학, 화학, 문학","물리, 생리의학, 경제학","화학, 경제학, 평화"],"answer":2,"explain":"교안은 노벨상 6개 중 과학분야를 물리, 생리의학, 화학으로 제시했다. 경제학·문학·평화는 과학분야에 포함되지 않는다.","source":{"page":3,"section":"01. 노벨상 수상자들의 수상비결 - 노벨상에 관한 질문","quote":"노벨상6 개중에 과학분야( 물리 , 생리의학 , 화학 ) 의 노벨상수상자들은어떤성공과실패의과정이있었을까?"}},{"id":"50-02","type":"옳은 것","q":"TIME지 선정 '세기의 100인(TIME 100 Persons Of The Century)'에 대한 설명으로 옳은 것은?","box":null,"choices":["\"20세기 최고의 인물\"로 뉴턴이 선정되었다.","2위는 프로이트가 차지하였다.","과학자 다음으로 많이 선정된 분야는 정치가였다.","\"20세기 최고의 인물\"로 과학자 아인슈타인이 선정되었다.","2009년 6월 6일 발표되었다."],"answer":4,"explain":"\"20세기 최고의 인물\"로 아인슈타인이 선정되었다. ①② 2위는 뉴턴. ③ 과학자 다음으로 많은 분야는 철학자(프로이트 등). ⑤ 출처는 타임지(1999. 6. 6).","source":{"page":4,"section":"01. 노벨상 수상자들의 수상비결 - TIME지 선정 세기의 100인","quote":"“ 20 세기 최고의인물”로과학자아인슈타인이선정됨 / 2 위를 차지한뉴턴을비롯해다른분야보다과학자들이영향력을끼친인물로많이선정됨과학자다음으로많은분야는철학자( 프로이트 등) 였음"}},{"id":"50-03","type":"빈칸","q":"다음은 2000년 이후 과학분야 노벨상 수상자들에 대한 설명이다. (가), (나)에 들어갈 숫자로 알맞은 것은?","box":"과학분야 노벨상은 노벨의 사망일인 12월 10일 스웨덴 스톡홀름에서 시상식을 개최. 노벨상 수상까지 평균 (가)년 걸림. 수상자의 평균연령은 (나)세였음","choices":["(가) 23, (나) 69.1","(가) 32, (나) 59.1","(가) 32, (나) 69.1","(가) 30, (나) 61.9","(가) 10, (나) 69.1"],"answer":3,"explain":"노벨상 수상까지 평균 32년, 수상자 평균연령 69.1세이다(YTN Science TV, 2022. 10. 10). 나머지는 숫자를 바꾼 오답이다.","source":{"page":5,"section":"01. 노벨상 수상자들의 수상비결 - 2000년 이후 과학분야 노벨상 수상자들","quote":"노벨상수상까지평균32년걸림 수상자의평균연령은69.1세였음"}},{"id":"50-04","type":"옳지 않은 것","q":"2000년 이후 과학분야 노벨상에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["시상식은 노벨의 사망일인 12월 10일에 개최된다.","시상식은 스웨덴 스톡홀름에서 개최된다.","상금은 1000만 스웨덴 크로나(약 13억원)이다.","상금은 수상자 본인과 공동수상자들에게 동등하게 지급된다.","개인 단독수상이 대부분을 차지한다."],"answer":5,"explain":"2000년 이후 개인 단독수상은 단 2건이며, 분야를 달리한 창의융합형 연구가 대부분을 차지한다. ①~④는 교안 내용과 같다.","source":{"page":6,"section":"01. 노벨상 수상자들의 수상비결 - 2000년 이후 과학분야 노벨상 수상자들","quote":"상금은1000만스웨덴 크로나( 약 13억원) 이며 , 상금은 수상자본인과공동수상자들에게동등하게지급개인단독수상은단2 건 분야를달리한창의융합형연구가대부분을차지함"}},{"id":"50-05","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"과학분야 노벨상 상금은 수상자 본인과 공동수상자들에게 동등하게 지급. 개인 단독수상은 단 2건, 분야를 달리한 (   ) 연구가 대부분을 차지함","choices":["단일전공형","창의융합형","응용개발형","국가주도형","기초이론형"],"answer":2,"explain":"분야를 달리한 '창의융합형' 연구가 대부분을 차지한다. 나머지는 교안에 없는 표현이다.","source":{"page":6,"section":"01. 노벨상 수상자들의 수상비결 - 2000년 이후 과학분야 노벨상 수상자들","quote":"개인단독수상은단2 건 분야를달리한창의융합형연구가대부분을차지함"}},{"id":"50-06","type":"개념 찾기","q":"여성 노벨수상자들의 증가 사례로, 2009년 노벨 생리학·의학상을 수상하고 세포노화과정 등을 연구한 인물로 교안에 제시된 것은?","box":null,"choices":["엘리자베스 블랙번, 캐럴 그라이더","오무라 사토시, 야마나카 신야","가임, 노보셀로프","대니얼 카너먼, 다나카 고이치","에릭 베르너, 히로나가 헤이스케"],"answer":1,"explain":"2009년 노벨 생리학·의학상 수상자 엘리자베스 블랙번과 캐럴 그라이더는 세포노화과정 등을 연구했다. ② 2012년 생리학·의학상(유도 만능줄기세포). ③ 3M 테이프로 흑연 구조 발견. ④ 2002년 경제학상·화학상. ⑤ 2000년 물리학상, 필즈상 수상자.","source":{"page":7,"section":"01. 노벨상 수상자들의 수상비결 - 여성 노벨수상자들의 증가","quote":"2009 년노벨 생리학· 의학상 수상자인엘리자베스블랙번과캐럴그라이더는세포노화과정을연구등"}},{"id":"50-07","type":"옳은 것","q":"교안에 제시된 2000년 이후 노벨상 수상자와 그 공로의 연결로 옳은 것은?","box":null,"choices":["2000년 노벨 물리학상 대니얼 카너먼 – 핵융합 반응을 연구하여 태양의 에너지원을 밝혀냄","200 age":11,"section":"02. 노벨상 수상비결과 영재교육 - 과학분야 노벨상 수상자들의 수상비결","quote":"캘리포니아대심리학교수딘사이먼튼 (Dean Simonton)의과학분야노벨상수상자30년연구 결과"}},{"id":"50-11","type":"옳지 않은 것","q":"딘 사이먼튼이 밝힌 노벨상 수상자들의 4가지 성공비결에 해당하지 않는 것은?","box":null,"choices":["우연","논리성과 직관","영재성","시대정신","경제적 지원"],"answer":5,"explain":"4가지 성공비결은 \"우연, 논리성과 직관, 영재성, 시대정신\"이다. 경제적 지원은 포함되지 않는다. 최고의 과학자들은 이 중 어느 하나만이 아닌 4가지가 모두 적절하게 조합·통합되어 있다.","source":{"page":11,"section":"02. 노벨상 수상비결과 영재교육 - 과학분야 노벨상 수상자들의 수상비결","quote":"노벨상 수상자들의4 가지 성공비결은“우연, 논리성과 직관, 영재성 , 시대정신”임을 밝힘"}},{"id":"50-12","type":"옳은 것","q":"딘 사이먼튼의 연구 결과에 대한 설명으로 옳은 것은?","box":null,"choices":["노벨상 수상자들은 4가지 비결 중 하나만 탁월하면 충분하다.","4가지 비결 중 영재성이 가장 결정적인 요인이다.","노벨상을 받은 최고의 과학자들은 4가지 성공비결이 모두 적절하게 잘 조합되고 통합되어 있다.","연구는 과학분야 노벨상 수상자를 10년간 연구한 결과이다.","사이먼튼은 하버드대 경제학 교수이다."],"answer":3,"explain":"어느 하나만이 아닌 4가지 성공비결이 모두 적절하게 조합·통합되어 있다. ①② 어느 하나만이 아님. ④ 30년 연구. ⑤ 캘리포니아대 심리학 교수.","source":{"page":11,"section":"02. 노벨상 수상비결과 영재교육 - 과학분야 노벨상 수상자들의 수상비결","quote":"노벨상을 받은최고의과학자들은이중어느 하나만이아닌4 가지 성공비결이모두적절하게잘조합되고 통합되어있다는것임"}},{"id":"50-13","type":"사례","q":"노벨상 수상자의 4가지 비결 중 '우연과 기회'의 사례로 교안에 제시된 인물과 발견의 연결로 옳지 않은 것은?","box":null,"choices":["뉴턴 – 사과나무에서 우연히 떨어지는 사과를 보고 중력이론 발견","플레밍 – 실험실로 우연히 날아든 푸른곰팡이에서 항생제 페니실린 발견","가임과 노보셀로프 – 3M 테이프로 떼었다 붙였다를 반복하다 흑연 구조 발견","로버트 오펜하이머 – 우연히 실험실에서 원자폭탄 원리 발견","플레밍 – 병원성 세균을 치료하는 항생제 발견"],"answer":4,"explain":"로버트 오펜하이머는 '시대정신'의 사례로, 제2차 세계대전 당시 과학자들이 국방과학산업으로 많이 유입된 예로 제시되었다. ①②③⑤는 '우연과 기회' 사례이다.","source":{"page":12,"section":"02. 노벨상 수상비결과 영재교육 - 우연과 기회","quote":"플레밍 / •어느날실험실로 우연히날아든푸른곰팡이에서병원성세균을치료하는항생제페니실린을발견"}},{"id":"50-14","type":"개념 찾기","q":"다음 설명에 해당하는 '우연과 기회'의 사례 인물은?","box":"연필심의 흑연은 탄소들이 벌집 모양의 육각형 그물처럼 배열된 평면들이 층으로 쌓여 있는 구조인데, 우연히 3M 테이프로 떼었다 붙였다를 반복하다 발견","choices":["뉴턴","플레밍","파스퇴르","다나카 고이치","가임과 노보셀로프"],"answer":5,"explain":"3M 테이프로 흑연 구조를 발견한 사례는 가임과 노보셀로프이다. ① 사과·중력이론. ② 푸른곰팡이·페니실린. ③ \"우연은 준비된 마음에만 찾아온다.\" ④ 리간드-금속 결합.","source":{"page":12,"section":"02. 노벨상 수상비결과 영재교육 - 우연과 기회","quote":"가임과 노보셀로프 / • 연필심의 흑연은탄소들이벌집모양의육각형그물처럼배열된평면들이층으로쌓여있는구조인데, 우연히 3M 테이프로 떼었다붙였다를반복하다발견"}},{"id":"50-15","type":"옳은 것","q":"'유레카'처럼 우연히 발견된 과학 이야기에 대해 교안에서 설명한 내용으로 옳은 것은?","box":null,"choices":["많은 심리학자들은 창의적 아이디어가 전혀 생각하지 못하던 중 우연히 떠오른다고 본다.","많은 심리학자들은 '정말 우연히 그랬을까?'라는 물음에 \"No!\"라고 대답한다.","과학적 발견은 준비와 무관하게 운에 의해 이루어진다.","뉴턴 이후 200년이 넘도록 과학자들은 뉴턴식 과학을 비판하였다.","우연한 발견은 시대정신과 무관하므로 4가지 비결에서 제외된다."],"answer":2,"explain":"많은 심리학자들은 갑자기 우연히 떠올랐는가에 대해 \"No!\"라고 대답한다. ①③ 반대 서술. ④ 200년이 넘자 과학자들이 뉴턴식으로 과학 따라하기를 이야기함. ⑤ 우연은 4가지 비결 중 하나.","source":{"page":13,"section":"02. 노벨상 수상비결과 영재교육 - 우연과 기회","quote":"많은 심리학자들은이점에 대해“ No!” 라고대답함"}},{"id":"50-16","type":"보기 조합","q":"'우연과 기회'와 관련하여 교안에 제시된 내용으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 와이즈버그는 \"10년의 법칙\"을 제시하였다.\nㄴ. 말콤 글래드웰은 '아웃라이어'에서 \"1만 시간의 법칙\"을 제시하였다.\nㄷ. 하루에 3시간씩 10년이면 약 1만 시간이 되어 \"10년의 법칙\"과 비슷하다.\nㄹ. 파스퇴르는 \"우연은 누구에게나 공평하게 찾아온다.\"고 하였다.","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ·ㄴ·ㄷ은 교안 내용이다. ㄹ 파스퇴르는 \"우연은 준비된 마음에만 찾아온다.\"고 하며 철저한 준비와 노력의 중요성을 강조했다.","source":{"page":14,"section":"02. 노벨상 수상비결과 영재교육 - 우연과 기회","quote":"어떤분야에하루에3 시간씩 노력해서10 년이면 약1 만시간이 되는데와이즈버그의“ 10 년의 법칙”과도비슷함 / ‣ 파스퇴르 / • “우연은 준비된마음에만찾아온다.”"}},{"id":"50-17","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"말콤 글래드웰의 \"아웃라이어\": 아웃라이어(월등히 뛰어난 사람)들의 성공비결에서 \"어떤 분야에서든 세계 수준의 전문가가 되려면 (   )이 필요하다\"는 법칙을 제시","choices":["1천 시간","5천 시간","1만 시간","3만 시간","10년 이상의 학위"],"answer":3,"explain":"\"1만 시간의 법칙\"이다. 하루 3시간씩 10년이면 약 1만 시간이 된다. 나머지는 숫자를 바꾼 오답이다.","source":{"page":14,"section":"02. 노벨상 수상비결과 영재교육 - 우연과 기회","quote":"아웃라이어 ( 월등히 뛰어난사람) 들의 성공비결에서“어떤분야에서든세계수준의전문가가되려면1 만시간이 필요하다” 는 “ 1 만시간의 법칙”을제시"}},{"id":"50-18","type":"옳지 않은 것","q":"노벨상 수상자들이 '우연'이라는 기회를 만나게 된 과정에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["지적 호기심으로 문제가 무엇인지를 안다.","문제를 해결하기 위해 수많은 시행착오를 겪는다.","철저하게 연습하고 준비한다.","충분한 시간과 노력을 기울이는 가운데 우연이라는 기회를 만난다.","시행착오를 최소화하고 짧은 시간에 집중하여 우연을 만든다."],"answer":5,"explain":"노벨상 수상자들은 수많은 시행착오를 겪고, 충분한 시간과 노력을 기울이는 가운데 우연을 만나 운 좋은 과학적 발견을 했다. ⑤는 반대 서술이다.","source":{"page":15,"section":"02. 노벨상 수상비결과 영재교육 - 우연과 기회","quote":"문제를 해결하기위해수많은시행착오를겪고철저하게연습하고준비함 / ‣ 충분한 시간과노력을기울이는가운데“ 우연”이라는 기회를만나결과적으로운좋은 과학적발견을할수있었음"}},{"id":"50-19","type":"옳은 것","q":"노벨상 수상자의 4가지 비결 중 '논리성과 직관'에 대한 설명으로 옳은 것은?","box":null,"choices":["과학으로 인정받기 위해 가설 설정이나 경험적 검증 절차는 필요하지 않다.","과학자들이 새로운 문제를 창의적으로 해결하기 위해서는 엄격한 \"논리성\" 하나로는 부족하다.","엄격한 논리성만 갖추면 새로운 문제를 창의적으로 해결할 수 있다.","직관과 상상력은 과학적 연구를 방해한다.","예술적 경험은 수학 난제 해결과 무관하다."],"answer":2,"explain":"과학은 가설·연구문제 설정과 경험적 자료의 과학적 검증이라는 논리적 절차가 필요하지만, 새로운 문제를 창의적으로 해결하려면 엄격한 논리성 하나로는 부족하다. ①③④⑤는 교안과 반대이다.","source":{"page":16,"section":"02. 노벨상 수상비결과 영재교육 - 논리성과 직관","quote":"그러나 과학자들이새로운문제를창의적으로해결하기위해서는엄격한“논리성”하나로는부족"}},{"id":"50-20","type":"개념 찾기","q":"다음 설명에 해당하는 인물은?","box":"• 수학의 노벨상이라고 불리며 4년에 한 번 주는 필즈상을 아시아인으로서 처음으로 받은 일본의 수학자\n• \"전공지식도 중요하지만, 몇 배의 피나는 노력과 어린 시절 피아노 연주를 통해 경험한 무한한 예술의 세계가 수학의 난제를 해결하는 데 많은 도움을 주었다\"고 밝힘","choices":["다나카 고이치","오무라 사토시","히로나가 헤이스케","야마나카 신야","대니얼 카너먼"],"answer":3,"explain":"필즈상을 아시아인 최초로 받은 일본 수학자는 히로나가 헤이스케로, '논리성과 직관'의 사례이다. ① 2002년 노벨 화학상. ②④ 2012년 노벨 생리학·의학상. ⑤ 2002년 노벨 경제학상.","source":{"page":17,"section":"02. 노벨상 수상비결과 영재교육 - 논리성과 직관","quote":"히로나가 헤이스케 / • 수학의 노벨상이라고불리며4 년에 한번주는 필즈상을아시아인으로서처음으로받은일본의수학자"}},{"id":"50-21","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"지금까지의 인류가 만들었던 수학이나 과학 공식만으로 해결하지 못했던 난제를 해결한 창의적인 과학자들은 \"명쾌하고 직관적인 (   )\"을 가져야 한다고 강조함","choices":["논리적 분석력","예술적 상상력","수리적 계산력","비판적 사고력","전공 지식"],"answer":2,"explain":"\"명쾌하고 직관적인 예술적 상상력\"이다. 나머지는 교안의 해당 문장과 다르다.","source":{"page":17,"section":"02. 노벨상 수상비결과 영재교육 - 논리성과 직관","quote":"창의적인과학자들은“명쾌하고직관적인예술적상상력”을가져야한다고강조함"}},{"id":"50-22","type":"옳은 것","q":"노벨상 수상자의 4가지 비결 중 '영재성'과 관련하여 교안에 제시된 내용으로 옳은 것은?","box":null,"choices":["미국 영재교육법은 영재성은 후천적으로만 형성된다고 본다.","미국 영재교육법은 타고난 영재성은 교육하지 않아도 자연히 발현된다고 본다.","최근 동향은 영재성 발현에 환경의 영향이 거의 없다고 본다.","미국 영재교육법은 타고난 영재성을 조기에 발견하여 교육하지 못하면 조기에 사장되므로 국가가 특별한 지원을 통해 특별한 교육을 제공해야 한다고 본다.","최근 동향은 영재는 타고날 필요가 없다고 본다."],"answer":4,"explain":"미국 영재교육법: 영재는 타고나지만 조기에 발견·교육하지 못하면 사장되므로 국가가 특별한 지원을 해야 한다. 최근 동향: 영재는 천부적으로 영재성을 타고나야 하지만 가정, 교육, 사회 등 다양한 환경에서 잘 교육되어야 제대로 발현된다. ①②③⑤는 이와 반대이다.","source":{"page":18,"section":"02. 노벨상 수상비결과 영재교육 - 영재성","quote":"“영재는 타고나지만, 타고난 영재성을조기에발견하여교육하지못하면, 조기에 사장되고말기때문에국가가특별한지원을통해특별한교육을제공해야한다”"}},{"id":"50-23","type":"사례","q":"다음 사례와 가장 관련 있는 노벨상 수상자의 비결은?","box":"제2차 세계대전 당시 로버트 오펜하이머를 비롯한 과학자들이 로켓이나 원자폭탄 개발과 같은 국방과학산업으로 많이 유입됨. 과학자들은 그 시대에 긴급하거나 중요하다고 꼽히는 사회문제에 많은 노력을 기울임","choices":["우연","논리성","직관","영재성","시대정신"],"answer":5,"explain":"그 시대에 긴급하거나 중요한 사회문제에 노력을 기울인 사례로 '시대정신'에 해당한다. 노벨상 수상자와 그들을 필요로 하는 시대정신이 서로 맞아떨어져야 한다(난세에 영웅이 나오듯이).","source":{"page":20,"section":"02. 노벨상 수상비결과 영재교육 - 시대정신","quote":"로버트 오펜하이머 / •제2 차세계대전 당시과학자들이로켓이나원자폭탄개발과같은국방과학산업으로많이유입됨"}},{"id":"50-24","type":"옳지 않은 것","q":"'시대정신'에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["노벨상 수상자와 그들을 필요로 하는 \"시대정신\"이 서로 맞아떨어져야 한다.","과학의 커다란 발견과 발명도 당시 시대와 사회의 필요성과 조화를 이루어 빛이 난다.","시대 상황이 절실히 필요로 하는 연구를 하는 과학자 중에서 노벨상을 받는 사람도 나오기 쉽다.","창의력은 개인이 지닌 특성만으로 발현되며 사회환경과는 무관하다.","코로나 백신, 줄기세포 연구, 자율주행 자동차 등은 시대가 필요로 하는 연구의 예이다."],"answer":4,"explain":"교안은 창의력이 제대로 발현되려면 개인이 지닌 특성뿐 아니라 그 개인을 둘러싼 복합적인 사회환경이 상호작용할 때 가능하다고 했다. ④는 반대 서술이다.","source":{"page":22,"section":"02. 노벨상 수상비결과 영재교육 - 시대정신","quote":"창의력이 제대로발현되려면, 개인이 지닌특성뿐아니라그개인을 둘러싼복합적인사회환경이상호작용할때가능함"}},{"id":"50-25","type":"옳지 않은 것","q":"'시대정신'과 관련하여 현시대가 필요로 하는 연구의 예로 교안에 제시되지 않은 것은?","box":null,"choices":["전 인류가 고통받고 있는 코로나 백신과 치료제 개발","난치병 치료를 위한 줄기세포 연구, 유전자 조작 가위","대체에너지 개발","인간을 닮은 휴머노이드 로봇 개발","로켓과 원자폭탄 개발"],"answer":5,"explain":"로켓·원자폭탄 개발은 제2차 세계대전 당시(로버트 오펜하이머) 사례로 제시된 것이다. 현시대 연구의 예로는 코로나 백신·치료제, 암·바이러스 치료제, 줄기세포·유전자 조작 가위, 대체에너지, 인간에게 도움이 되는 인공지능, 휴머노이드 로봇, 자율주행 자동차 등이 제시되었다.","source":{"page":21,"section":"02. 노벨상 수상비결과 영재교육 - 시대정신","quote":"‣ 대체에너지 개발 / ‣ 인간에게 도움이되는인공지능 / ‣ 인간을 닮은휴머노이드로봇개발 / ‣ 자율주행 자동차등"}},{"id":"50-26","type":"빈칸","q":"다음은 과학분야 노벨상 수상자들의 수상비결을 정리한 것이다. (가), (나)에 들어갈 말로 알맞은 것은?","box":"천부적으로 타고나면서 최대로 잘 발현된 (가), 엄격한 논리적 분석력과 그것을 뛰어넘는 직관과 상상력, 이렇게 잘 준비된 가운데 운 좋게 찾아온 우연(기회), 그리고 과학자를 둘러싼 (나)과의 통합으로 노벨상을 수상함","choices":["(가) 영재성, (나) 시대정신","(가) 창의성, (나) 가정환경","(가) 영재성, (나) 국가지원","(가) 지능, (나) 시대정신","(가) 끈기, (나) 연구공동체"],"answer":1,"explain":"(가) 영재성, (나) 시대정신이다. 이는 딘 사이먼튼의 4가지 비결(우연, 논리성과 직관, 영재성, 시대정신)을 정리한 내용이다.","source":{"page":23,"section":"02. 노벨상 수상비결과 영재교육 - 과학분야 노벨상 수상자들의 수상비결을 정리하면","quote":"천부적으로타고나면서최대로잘발현된 영재성,         엄격한논리적분석력과그것을뛰어넘는직관과상상력, 이렇게잘준비된 가운데운좋게 찾아온우연( 기회 ),  그리고과학자를둘러싼시대정신과의통합으로노벨상을수상함"}}]},{"lesson":51,"title":"우리나라 영재들의 다양한 특성과 환경","file":"4. 교안 (31~60)[1] (1)/51.pdf","summary":["영재의 인지적 능력(지능, 창의성, 상위인지, 고차원적 추론능력)은 탁월하다고 일관되게 보고 / 정의적·사회적 특성은 영재성 정의·표집·연구방법의 차이로 연구결과가 상반","미국 영재교육법: 조기 발견·계발 지원이 없으면 영재성은 조기에 소멸 → 국가는 특별한 교육적 서비스 제공","조석희·안도희·한석실(2003): 1985~1989년 선발된 144명의 어린 신동 연구 → 영재성이 사장된 우리나라 영재교육의 실패사례","탄넨바움(Tannenbaum): 뛰어난 일반지능, 뛰어난 특수적성, 비인지적 촉진제, 환경의 영향과 운","우리나라 영재 특성 연구: 영재학교·과학고·서울예술고·민사고(국제반) 등 졸업생 중 성공한 인재(40대) 문과·이과·예술계열 110명 / 학생용·부모용 설문지, 학생생활기록부로 역추적 (이신동·이정규·박춘성, 2020)","가정환경: 아버지 대학원 졸업 46.5%, 관리직·전문직 85.7% / 어머니 대학 졸업 이상 90.7%, 대학원 14%, 무직 60.5%, 전문직 16.3% → 대체로 고학력, 고연봉, 전문직","지능: 초135, 중139, 고140, 평균138 / 조기입학 초 9명, 고 7명 / 학년월반 초 13명, 중 3명, 고 6명","본인 인지 시기: 4-5세(20.4%), 2-3세(16%), 초 2·3·4학년 각 10.2% / 예체능 51.42% / 근거: 자기추천 31.4%, 경시대회 수상 28.57%, 주변 추천 25.71%","부모 인지 시기: 4-5세(35.4%), 6-7세(29.1), 2-3세(25%) / 분야: 예능(33.3%), 언어논리(28.9%)","학교생활 불만족 이유: 학교 정규수업(너무 쉬움, 암기력 위주 평가, 평균 맞춘 수업레벨), 선생님과 관계, 학교 친구와 관계(피상적 인간관계), 학교행사와 특별활동(형식적)","영재교육기관 만족도 높음: 과학고·영재학교 학생 만족도 현저히 높음, 만개효과(Bloomin effect) – 수준이 같은 또래, 이해·격려하는 선생님, 속진·심화 학습"],"questions":[{"id":"51-01","type":"옳은 것","q":"영재의 심리적 특성에 관한 연구에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["영재의 정의적, 사회적 특성에 대한 연구들은 일관되게 긍정적으로 보고되고 있다.","영재의 인지적 능력에 대한 연구들은 연구자마다 상반되게 보고되고 있다.","영재의 인지적 능력에 대한 연구들은 지능, 창의성, 상위인지, 고차원적 추론능력 등이 탁월하다고 일관되게 보고하고 있다.","정의적 특성 연구결과의 차이는 오직 연구방법의 차이에서 비롯된다.","영재의 정의적 특성은 인지적 능력과 동일한 결과를 보인다는 데 연구자들이 합의하였다."],"answer":3,"explain":"인지적 능력은 탁월하다고 일관되게 보고된다. ①②⑤ 정의적·사회적 특성 연구결과가 상반되게 보고됨. ④ 영재성 정의의 차이, 표집의 차이, 연구방법의 차이 등 때문.","source":{"page":3,"section":"01. 우리나라 영재의 특성 - 영재의 심리적 특성","quote":"영재의인지적능력에대한연구들은지능, 창의성 , 상위인지, 고차원적 추론능력등이탁월하다고일관되게보고되고있음"}},{"id":"51-02","type":"옳지 않은 것","q":"영재의 정의적, 사회적 특성에 대한 연구결과들이 상반되게 보고되는 이유로 교안에 제시되지 않은 것은?","box":null,"choices":["연구자들 간에 영재성에 대한 정의의 차이","연구대상자 선정에 있어서 표집의 차이","연구방법의 차이","영재의 인지적 능력 수준의 차이","(위 ①~③은 모두 교안에 제시된 이유이다)"],"answer":4,"explain":"교안은 영재성 정의의 차이, 표집의 차이, 연구방법의 차이 등을 이유로 제시했다. ④ 인지적 능력은 탁월하다고 일관되게 보고되는 부분으로, 상반된 결과의 이유로 제시되지 않았다.","source":{"page":3,"section":"01. 우리나라 영재의 특성 - 영재의 심리적 특성","quote":"연구자들간에영재성에대한정의의차이, 연구대상자의선정에있어서표집의차이,             연구방법의차이등으로인해연구결과들이상반되게보고되고있음"}},{"id":"51-03","type":"빈칸","q":"다음은 교안에 제시된 미국 영재교육법의 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"타고난 영재성이 조기에 발견하고 계발하기 위한 교육적 지원 및 노력이 이루어지지 않는다면 영재성은 조기에 (   )되기 때문에 국가는 특별한 교육적 서비스를 제공해야 함","choices":["소멸","강화","전이","보존","분화"],"answer":1,"explain":"영재성은 조기에 '소멸'되기 때문에 국가가 특별한 교육적 서비스를 제공해야 한다. 나머지는 교안과 다른 표현이다.","source":{"page":4,"section":"01. 우리나라 영재의 특성 - 영재의 심리적 특성","quote":"타고난 영재성이조기에발견하고계발하기위한교육적지원및노력이 이루어지지않는다면영재성은조기에소멸되기때문에국가는특별한교육적서비스를제공해야함"}},{"id":"51-04","type":"옳은 것","q":"조석희·안도희·한석실(2003)의 연구에 대한 설명으로 옳은 것은?","box":null,"choices":["1995~1999년 사이에 선발된 144명의 어린 신동들을 연구하였다.","1985~1989년 사이에 선발된 114명의 어린 신동들을 연구하였다.","어린 신동들이 성인이 되어 대부분 뛰어난 성취를 보인 성공사례이다.","1985~1989년 사이에 선발된 144명의 어린 신동들을 연구한, 영재성이 사장된 우리나라 영재교육의 실패사례이다.","영재성이 사장된 원인을 유전적 요인에서 찾았다."],"answer":4,"explain":"1985~1989년 사이 선발된 144명의 어린 신동 연구로, 환경적 변인 및 교육의 적절한 조치가 이루어지지 않아 영재성이 사장된 실패사례이다. ① 연도 오류. ② 인원 오류. ③ 실패사례. ⑤ 환경적 변인 및 교육의 적절한 조치 부족.","source":{"page":5,"section":"01. 우리나라 영재의 특성 - 잠재된 영재성의 발현","quote":"1985~1989 년사이에 선발된144명의어린신동들연구‣ 영재성이 있음에도불구하고, 환경적 변인및교육의 적절한조치가이루어지지않아그들의영재성이사장된우리나라영재교육의실패사례"}},{"id":"51-05","type":"옳지 않은 것","q":"탄넨바움(Tannenbaum)이 제시한 '성인으로서 뛰어난 성취를 하는 데 필요한 특성'에 해당하지 않는 것은?","box":null,"choices":["뛰어난 일반지능","뛰어난 특수적성","비인지적 촉진제","환경의 영향과 운","시대정신"],"answer":5,"explain":"탄넨바움의 특성은 뛰어난 일반지능, 뛰어난 특수적성, 비인지적
