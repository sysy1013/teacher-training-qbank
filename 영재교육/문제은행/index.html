"(ㄱ) 창의성 - (ㄴ) 재능","(ㄱ) 영재성 - (ㄴ) 창의성","(ㄱ) 영재성 - (ㄴ) 재능","(ㄱ) 지능 - (ㄴ) 성취"],"answer":4,"explain":"가네 모형에서 '영재성'은 하나 이상의 영역에서 나타나는 평균 이상의 능력, '재능'은 하나 이상의 분야에서 보이는 평균 이상의 뛰어난 수행이다. ①은 순서가 뒤바뀌었고, 창의성·지능·성취는 이 구분에 사용된 용어가 아니다.","source":{"page":10,"section":"가네(Gagné)의 영재성과 재능의 차별화 모형","quote":"‘영재성’은 하나 이상의 영역에서 나타나는 평균 이상의 능력에 해당 ‣ ‘재능’은 하나 이상의 분야에서 보이는 평균 이상의 뛰어난 수행에 해당"}},{"id":"11-11","type":"옳은 것","q":"가네(Gagné)의 영재성과 재능의 차별화 모형의 핵심으로 옳은 것은?","box":null,"choices":["능력의 분야와 수행의 영역을 하나로 통합한 것이다.","능력의 영역과 수행의 분야를 이분법적으로 나눈 것이다.","영재성과 재능을 동일한 개념으로 본 것이다.","지적 능력, 과제 집착력, 창의성의 교집합을 영재성으로 본 것이다.","영재성을 체계적으로 계발된 기술로, 재능을 타고난 능력으로 본 것이다."],"answer":2,"explain":"교안: '가네의 영재성과 재능의 차별화 모형의 핵심은 능력의 영역과 수행의 분야를 이분법적으로 나눈 것'. ① 통합이 아니라 이분법적 구분이다. ③ 영재성과 재능은 구분된다. ④ 렌줄리의 세 고리 모형이다. ⑤ 반대로, 영재성=타고난 능력, 재능=체계적으로 계발된 기술이다.","source":{"page":10,"section":"가네(Gagné)의 영재성과 재능의 차별화 모형","quote":"가네의 영재성과 재능의 차별화 모형의 핵심은 능력의 영역과 수행의 분야를 이분법적으로 나눈 것임"}},{"id":"11-12","type":"옳지 않은 것","q":"가네(Gagné)의 영재성과 재능의 차별화 모형 도식에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["타고난 능력의 영역에는 학문, 예술, 스포츠가 포함된다.","재능은 체계적으로 계발된 기술로, 분야에는 사업, 레져, 사회적 활동, 기술 등이 포함된다.","개인 내적 촉매에는 자기관리(인식: 자아, 타인 / 동기와 의지)가 포함된다.","영재성은 발달과정(비형식적/형식적 학습과 훈련)을 거쳐 재능으로 나타난다.","우연 혹은 기회도 촉매로 작용한다."],"answer":1,"explain":"타고난 능력의 영역은 지적, 창의적, 사회 정서적, 감각 운동적이다. 학문·예술·스포츠는 재능(체계적으로 계발된 기술)의 분야이므로 ①은 틀리다. ②~⑤는 도식 내용과 일치한다.","source":{"page":11,"section":"가네(Gagné)의 영재성과 재능의 차별화 모형","quote":"타고난 능력 영역 • 지적 • 창의적 • 사회 정서적 • 감각 운동적 / 발달과정(비형식적 / 형식적 학습과 훈련)"}},{"id":"11-13","type":"보기 조합","q":"가네(Gagné)의 차별화 모형에서 '환경적' 촉매에 해당하는 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 인간 : 부모, 교사, 또래, 멘토\nㄴ. 규정 : 프로그램, 활동\nㄷ. 동기와 의지\nㄹ. 사건","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"환경적 촉매는 사회문화적 환경, 인간(부모, 교사, 또래, 멘토), 규정(프로그램, 활동), 사건이다. ㄷ '동기와 의지'는 개인 내적 촉매(자기관리)에 속한다.","source":{"page":11,"section":"가네(Gagné)의 영재성과 재능의 차별화 모형","quote":"환경적 • 사회문화적 환경 • 인간 : 부모, 교사, 또래, 멘토 • 규정 : 프로그램, 활동 • 사건"}},{"id":"11-14","type":"옳은 것","q":"터만(Terman)의 영재에 관한 연구에 대한 설명으로 옳은 것은?","box":null,"choices":["1905년 스탠포드-비네 검사를 프랑스판으로 표준화하였다.","IQ 140 이상의 1,000명을 대상으로 연구하였다.","IQ 135 이상의 영재들을 대상으로 10여 년간 단기 추적 연구를 하였다.","영재교육의 어머니로 불린다.","1922년 비네-시몬(Binet-Simon) 지능검사를 미국판으로 표준화하여 스탠포드-비네(Stanford-Binet) 검사를 개발하였다."],"answer":5,"explain":"터만은 1922년 비네-시몬 지능검사를 미국판으로 표준화하여 스탠포드-비네 검사를 개발했고, IQ 135 이상의 1,528명의 영재들에 대해 50여 년간 실증적 종단연구를 했다. ① 연도·방향이 틀리다. ② IQ 135 이상, 1,528명이다. ③ 50여 년간 종단연구이다. ④ 터만은 '영재교육의 아버지', 어머니는 홀링워스이다.","source":{"page":13,"section":"터만(Terman)의 영재에 관한 50년 종단연구","quote":"1922년 비네-시몬(Binet-Simon) 지능검사를 미국판으로 표준화하여 스탠포드-비네(Stanford-Binet) 검사를 개발 ‣ IQ 135 이상의 1,528명의 영재들에 대한 50여 년간의 실증적 종단연구"}},{"id":"11-15","type":"빈칸","q":"다음은 루이스 터만(Terman, 1925-1926)의 글이다. (   )에 들어갈 말로 알맞은 것은?","box":"영재아동의 신체적, 지적, (   ) 자질을 더 잘 이해하면, 더 큰 성공의 확률로 영재아동을 위한 교육을 설계할 수 있을 것이다.","choices":["정서적","사회적","도덕적","성격적","예술적"],"answer":4,"explain":"터만은 '영재아동의 신체적, 지적, 성격적 자질을 더 잘 이해하면, 더 큰 성공의 확률로 영재아동을 위한 교육을 설계할 수 있을 것'이라고 했다. 나머지는 원문에 없는 표현이다.","source":{"page":14,"section":"터만(Terman)의 영재에 관한 50년 종단연구","quote":"영재아동의 신체적, 지적, 성격적 자질을 더 잘 이해하면, 더 큰 성공의 확률로 영재아동을 위한 교육을 설계할 수 있을 것이다."}},{"id":"11-16","type":"옳지 않은 것","q":"터만(Terman)의 연구에서 밝혀진 영재아의 특성으로 옳지 않은 것은?","box":null,"choices":["영재아는 지적 소질이 훨씬 우수하고 신체적인 소질이 약간 우수한 가족 출신이다.","영재아는 감정적으로 불안정하고 사회적 적응력이 부족한 경향이 있다.","영재아는 다른 아동보다 건강과 체격에 있어서 약간 우월하다.","영재아는 우수한 잠재력을 보유하고 있으나, 잠재력의 성공 여부는 양육이라는 요인에 달려 있다.","IQ 140 이상인 어린이들 형제의 평균 IQ는 약 123이다."],"answer":2,"explain":"터만은 '영재아는 감정적으로 불안정하거나 사회성의 부족, 사회적 적응력이 부족하지 않으며 어떤 유형의 부적응도 나타나지 않음'이라고 했으므로 ②는 틀리다. ①③④⑤는 터만의 연구 결과 그대로이다.","source":{"page":15,"section":"터만(Terman)의 영재에 관한 50년 종단연구","quote":"영재아는 감정적으로 불안정하거나 사회성의 부족, 사회적 적응력이 부족하지 않으며 어떤 유형의 부적응도 나타나지 않음"}},{"id":"11-17","type":"빈칸","q":"터만(Terman)의 연구 결과에 대한 다음 문장에서 (   )에 들어갈 숫자로 알맞은 것은?","box":"IQ 140 이상인 어린이들 형제의 평균 IQ는 약 (   )","choices":["103","113","123","133","143"],"answer":3,"explain":"교안: 'IQ 140 이상인 어린이들 형제의 평균 IQ는 약 123'. 참고로 터만 연구 대상은 IQ 135 이상의 1,528명이었다.","source":{"page":15,"section":"터만(Terman)의 영재에 관한 50년 종단연구","quote":"IQ 140 이상인 어린이들 형제의 평균 IQ는 약 123"}},{"id":"11-18","type":"개념 찾기","q":"다음 주장을 한 학자로, 터만(Terman)의 연구에 의해 반증된 인물은?","box":"“영재들은 점차 퇴화되는 조짐을 보이고 있는데, 어눌한 말씨, 작은 키, 쇠약한 몸, 창백한 얼굴색, 구루병, 대머리, 기억상실, 불임, 심각한 두뇌 퇴화 등을 보인다.”","choices":["터만(Terman)","홀링워스(Hollingworth)","렌줄리(Renzulli)","가네(Gagné)","롬브로소(Lombroso)"],"answer":5,"explain":"교안은 이 주장을 '롬브로소(Lombroso)의 연구의 반증'으로 제시한다. 터만의 연구는 영재아가 건강과 체격에서 약간 우월하고 부적응이 없음을 보여 롬브로소의 주장을 반증했다.","source":{"page":16,"section":"터만(Terman)의 영재에 관한 50년 종단연구 - 롬브로소(Lombroso)의 연구의 반증","quote":"영재들은 점차 퇴화되는 조짐을 보이고 있는데, 어눌한 말씨, 작은 키, 쇠약한 몸, 창백한 얼굴색, 구루병, 대머리, 기억상실, 불임, 심각한 두뇌 퇴화 등을 보인다."}},{"id":"11-19","type":"옳은 것","q":"홀링워스(Hollingworth)의 영재에 관한 연구에 대한 설명으로 옳은 것은?","box":null,"choices":["영재를 일반 지능에 대한 상위 1%의 아동으로, 추상적 사고력 및 상징을 다루고 학문을 성취할 수 있는 능력을 가진 아동으로 보았다.","영재교육의 아버지(미국)로 불린다.","영재를 일반 지능에 대한 상위 5%의 아동으로 보았다.","미국 서부에서 자퇴하는 10명 중 1명은 영재라고 하였다.","영재의 인지교육에 주로 공헌하고 정서교육은 강조하지 않았다."],"answer":1,"explain":"홀링워스는 '영재교육의 어머니(미국)'로, 영재를 일반 지능 상위 1%의 아동으로 보았으며 '미국 동부에서 자퇴하는 4명 중 1명은 영재'라고 했다. ② 아버지는 터만이다. ③ 상위 1%이다. ④ 미국 동부, 4명 중 1명이다. ⑤ 정서학습을 절대적으로 강조하고 영재의 정서교육에 공헌했다.","source":{"page":17,"section":"홀링워스(Hollingworth)의 영재에 관한 연구","quote":"일반 지능에 대한 상위 1%의 아동으로, 추상적 사고력 및 상징을 다루고 학문을 성취할 수 있는 능력을 가짐 • 미국 동부에서 자퇴하는 4명 중 1명은 영재"}},{"id":"11-20","type":"개념 찾기","q":"다음 설명에 해당하는 학자는?","box":"• 영재의 인지적 발달은 아동의 연령과 신체발달보다 먼저 이루어지기 때문에 사회적, 정서적 문제가 나타남\n• 생산적 습관, 리더십 관련 태도나 동기를 발달시킬 수 있는 정서학습이 절대적으로 필요하다고 강조\n• 영재의 정서교육에 공헌함","choices":["터만(Terman)","렌줄리(Renzulli)","스턴버그(Sternberg)","홀링워스(Hollingworth)","롬브로소(Lombroso)"],"answer":4,"explain":"제시문은 '영재교육의 어머니(미국)' 홀링워스의 연구 내용이다. 터만은 50년 종단연구, 렌줄리는 세 고리 모형, 스턴버그는 성공지능·오각형의 암묵적 이론, 롬브로소는 영재 퇴화 주장(터만이 반증)이다.","source":{"page":18,"section":"홀링워스(Hollingworth)의 영재에 관한 연구","quote":"영재의 인지적 발달은 아동의 연령과 신체발달보다 먼저 이루어지기 때문에 사회적, 정서적 문제가 나타남 ‣ 생산적 습관, 리더십 관련 태도나 동기를 발달시킬 수 있는 정서학습이 절대적으로 필요하다고 강조 ‣ 영재의 정서교육에 공헌함"}},{"id":"11-21","type":"개념 찾기","q":"다음 설명에 해당하는 학자는?","box":"• “무엇이 영재성을 만드는가?”\n• 창의적이고 생산적인 사람이나 인간 노력의 다양한 영역에서 뛰어난 성취를 이룬 사람들을 대상으로 연구함\n• 탐색적인 변인에 대한 연구로 영재성을 정의함","choices":["터만(Terman)","렌줄리(Renzulli)","가네(Gagné)","스턴버그(Sternberg)","홀링워스(Hollingworth)"],"answer":2,"explain":"제시문은 교안의 '렌줄리(Renzulli)의 정의' 내용이다. 렌줄리는 이를 바탕으로 영재성의 세 고리 모형을 제시했다.","source":{"page":19,"section":"렌줄리(Renzulli)의 정의","quote":"“무엇이 영재성을 만드는가?” ‣ 창의적이고 생산적인 사람이나 인간 노력의 다양한 영역에서 뛰어난 성취를 이룬 사람들을 대상으로 연구함 ‣ 탐색적인 변인에 대한 연구로 영재성을 정의함"}},{"id":"11-22","type":"빈칸","q":"렌줄리(Renzulli)의 영재성의 세 고리 모형에 대한 다음 설명에서 (ㄱ), (ㄴ)에 들어갈 숫자로 바르게 짝지은 것은?","box":"세 가지 특성 요소가 모두 상위 (ㄱ)% 이내에 들면서 그중 한 가지 요소는 상위 (ㄴ)% 안에 들면 영재로 볼 수 있음","choices":["(ㄱ) 15 - (ㄴ) 2","(ㄱ) 10 - (ㄴ) 1","(ㄱ) 15 - (ㄴ) 1","(ㄱ) 20 - (ㄴ) 2","(ㄱ) 25 - (ㄴ) 5"],"answer":1,"explain":"교안: '세 가지 특성 요소가 모두 상위 15% 이내에 들면서 그중 한 가지 요소는 상위 2% 안에 들면 영재로 볼 수 있음'. 상위 1%는 홀링워스의 영재 기준이므로 혼동하지 않는다.","source":{"page":20,"section":"렌줄리(Renzulli)의 영재성의 세 고리 모형(3-ring theory)","quote":"세 가지 특성 요소가 모두 상위 15% 이내에 들면서 그중 한 가지 요소는 상위 2% 안에 들면 영재로 볼 수 있음"}},{"id":"11-23","type":"옳지 않은 것","q":"렌줄리(Renzulli)의 영재성의 세 고리 모형(3-ring theory)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["평균 이상의 지적 능력이 세 고리 중 하나이다.","과제 집착력이 세 고리 중 하나이다.","창의성이 세 고리 중 하나이다.","세 요소 간의 공통부분이 작을수록 영재성이 크다.","세 가지 특성 요소가 모두 상위 15% 이내에 들면서 그중 한 가지는 상위 2% 안에 들면 영재로 볼 수 있다."],"answer":4,"explain":"교안은 '세 요소 간의 공통부분이 클수록 영재성도 큼'이라고 했으므로 ④는 반대 서술이다. ①②③ 세 고리는 평균 이상의 지적 능력, 과제 집착력, 창의성이다. ⑤는 판별 기준 그대로이다.","source":{"page":20,"section":"렌줄리(Renzulli)의 영재성의 세 고리 모형(3-ring theory)","quote":"세 요소 간의 공통부분이 클수록 영재성도 큼 / 평균 이상의 지적 능력 영재성 / 과제 집착력 창의성"}},{"id":"11-24","type":"옳은 것","q":"스턴버그(Sternberg)의 오각형의 암묵적 이론에 대한 설명으로 옳은 것은?","box":null,"choices":["암묵적 이론은 공식적이고 형식적인 검사 체계를 의미한다.","영재는 3가지 기준 중 하나 이상에 적합하면 된다.","오각형의 다섯 기준은 지적 능력, 과제 집착력, 창의성, 동기, 환경이다.","명시적 이론과 같은 의미로 사용된다.","암묵적 이론은 공식적이거나 형식적이지 않고, 오히려 개인들의 마음 안에 존재하는 지적인 구조이다."],"answer":5,"explain":"교안: '암묵적 이론은 공식적이거나 형식적이지 않고, 오히려 개인들의 마음 안에 존재하는 지적인 구조(↔명시적 이론)'. ①④ 반대 서술이다. ② 영재는 5가지 기준에 적합하여야 한다. ③ 다섯 기준은 수월성, 희귀성, 검증 가능성, 생산성, 가치이다(중심: 개별적인 필요와 상호적인 충분 기준).","source":{"page":21,"section":"스턴버그(Sternberg)의 오각형의 암묵적 이론","quote":"암묵적 이론은 공식적이거나 형식적이지 않고, 오히려 개인들의 마음 안에 존재하는 지적인 구조(↔명시적 이론) ‣ 영재는 다음의 5가지 기준에 적합하여야 함"}},{"id":"11-25","type":"개념 찾기","q":"스턴버그(Sternberg)의 오각형의 암묵적 이론에서 다음 설명에 해당하는 기준은?","box":"타당한 하나 이상의 검사를 통해 검증돼야만 한다는 것","choices":["수월성","희귀성","검증 가능성","생산성","가치"],"answer":3,"explain":"검증 가능성은 '타당한 하나 이상의 검사를 통해 검증돼야만 한다는 것'이다. 수월성=동료들과 비교하여 높은 우위, 희귀성=희귀한 기준, 생산성=생산성을 이끌어야 함, 가치=사람들이 가치를 두는 영역에서 최고의 수행.","source":{"page":22,"section":"스턴버그(Sternberg)의 오각형의 암묵적 이론","quote":"검증 가능성: 타당한 하나 이상의 검사를 통해 검증돼야만 한다는 것"}},{"id":"11-26","type":"옳지 않은 것","q":"스턴버그(Sternberg)의 오각형의 암묵적 이론의 5가지 기준에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["수월성: 어떤 영역에서 동료들과 비교하여 높은 우위를 차지하는 것","희귀성: 사회 내에서 사람들이 가치를 두는 영역에서 최고의 수행을 보여주어야 한다는 것","검증 가능성: 타당한 하나 이상의 검사를 통해 검증돼야만 한다는 것","생산성: 반드시 또는 잠재적으로 생산성을 이끌어야만 한다는 것","가치: 사회 내에서 사람들이 가치를 두는 영역에서 최고의 수행을 보여주어야 한다는 것"],"answer":2,"explain":"희귀성은 '동료들과 비교하여 높은 수준이라고 할 수 있는 희귀한 기준을 가지는 것'이다. ②에 적힌 내용은 '가치'의 정의이므로 틀리다. ①③④⑤는 교안 정의 그대로이다.","source":{"page":22,"section":"스턴버그(Sternberg)의 오각형의 암묵적 이론","quote":"희귀성: 동료들과 비교하여 높은 수준이라고 할 수 있는 희귀한 기준을 가지는 것"}}]},{"lesson":12,"title":"궁금한 영재들의 프로파일","file":"4. 교안 (1~30)/12.pdf","summary":["지금까지의 영재성 연구는 주로 영재집단과 일반집단으로 구분하여 두 집단 간의 차이검증으로 영재의 심리적인 특성을 탐색 → 영재 집단 내의 차이, 개인 간의 차이를 밝히면 개별화, 특성화 교육이 가능","베츠와 니하트(Betts \u0026 Neihart, 1988): 수년간의 관찰, 인터뷰, 문헌연구 후 6가지 유형의 영재 프로파일 → 영재의 정의, 판별, 교육계획, 상담을 위한 이론적 기초 / 인지적, 정서적, 사회적 욕구 이해에 유용","6유형: 성공적인(successful), 자율적인 학습자(autonomous learner), 잠복되어 있는(underground), 중도탈락(dropouts), 중복낙인(double-labeled), 도전적인(challenging) 영재","유형1 성공적인 영재: 영재로 판별된 대다수, 모범생, 교사·부모에게 의존적, 성취도·지능검사 고득점 → 창의성과 자율성이 부족할 수도 있음 / 학교 시스템에서 효과적으로 학습하고 가능한 적게 노력","유형2 자율적인 학습자 영재: 스스로 새로운 기회를 창조하기 위해 시스템 학습 사용, 강하고 긍정적인 자아개념, 리더십 능력으로 봉사, 자기 지향적·모험 감수","유형3 잠복되어 있는 영재: 영재성을 숨기거나 나중에 나타남, 소속감 위해 재능 부정, 불안·걱정, 부모 또한 같은 경향 높음, 어른들은 교육 프로그램을 고집·강요","유형4 중도탈락된 영재: 자신과 어른들에게 화가 나 있음, 정규 교육과정 밖에 흥미, 대부분 고등학생, 출석 거의 안 하거나 자퇴, 신체적으로는 아니지만 정서적·정신적으로 '중도탈락'","유형5 중복낙인 영재: 신체적·정서적 장애나 학습장애아로 간주, 낙심·좌절·무기력·고독, 대부분의 영재교육 프로그램은 판별하지 못하거나 차별화된 프로그램 제공 못함","유형6 도전적인 영재: 전통적 시스템에서 판별 어려움, 높은 창의성, 고집스럽고 요령 없고 빈정대는 것처럼 보임, 권위에 의문, 또래집단에 속하지 못하거나 혹은 유머감각으로 인기 많기도 함","허버트(Herbert)의 저명인사의 영재성과 환경에 대한 연구: 정치가 32명, 종교지도자 21명, 군인 17명, 평론가·역사·사회학자 23명, 음악가 21명, 철학가 19명","정치가: 설득력·합리적·잘생김·키가 큼, 성공적인 학교생활 / 종교지도자: 어머니나 다른 어른들의 격려, 유명인사와 만날 기회 / 군인: 외적 보상과 지원 많음, 쓰기 실력은 약했음","평론가·역사·사회학자: 문화적 자극, 다양한 문화와 아이디어에 열린 마음 / 음악가: 아버지와 선생님의 격려, 연설 못하고 도덕성 조금 부족 / 철학가: 부모 기대 높음, 잘생기거나 인기 있지 않았음, 학교에서 성공적이지 않았음"],"questions":[{"id":"12-01","type":"옳은 것","q":"'영재들은 정말 다양하다'와 관련된 교안의 설명으로 옳은 것은?","box":null,"choices":["지금까지의 영재성 연구는 주로 영재 집단 내의 개인차를 밝히는 데 집중해 왔다.","영재들은 집단 내 차이가 거의 없는 동질적인 집단이다.","지금까지의 영재성 연구는 주로 영재집단과 일반집단으로 구분하여 두 집단 간의 차이검증으로 영재의 심리적인 특성을 탐색하여 왔다.","영재 집단 내의 차이를 밝히면 표준화된 일괄 교육이 가능해진다.","영재 개인 간의 차이는 영재교육과정 구성과 무관하다."],"answer":3,"explain":"교안은 지금까지의 연구가 영재집단과 일반집단 간 차이검증 중심이었고, 영재 집단 내의 차이나 개인 간의 차이를 밝혀 영재교육과정을 구성할 때 개별화, 특성화 교육이 가능하다고 했다. ① 집단 간 차이검증 중심이었다. ② 영재들은 다양하다. ④ 표준화된 일괄 교육이 아니라 개별화·특성화 교육이다. ⑤ 교육과정 구성에 활용된다.","source":{"page":3,"section":"영재들은 정말 다양하다","quote":"지금까지의 영재성의 개념 및 정의에 대한 연구는 주로 영재집단과 일반집단으로 구분하여 두 집단 간의 차이검증으로 영재의 심리적인 특성을 탐색하여 왔음 영재들의 집단도 집단 내의 차이, 또는 개인 간의 차이를 밝혀 영재교육과정을 구성할 때 개별화, 특성화 교육이 가능함"}},{"id":"12-02","type":"옳지 않은 것","q":"베츠와 니하트(Betts \u0026 Neihart)의 영재 프로파일 연구에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["수년간의 관찰, 인터뷰, 문헌연구를 한 후에 여섯 가지 프로파일을 밝혔다.","영재 아동과 청소년을 대상으로 하였다.","영재의 정의, 판별, 교육계획, 상담을 위한 이론적 기초로 기여할 것이다.","교육자와 부모가 영재의 행동과 감정을 주의 깊게 살펴봄으로써 영재의 인지적, 정서적, 사회적 욕구를 이해하는 데 유용하다.","대규모 지능검사 결과의 통계 분석만으로 영재를 세 가지 유형으로 분류하였다."],"answer":5,"explain":"베츠와 니하트는 수년간의 관찰, 인터뷰, 문헌연구를 한 후 영재 아동과 청소년에 대한 '여섯 가지' 프로파일을 밝혔다. 지능검사 통계 분석만으로 세 가지 유형으로 분류한 것이 아니므로 ⑤는 틀리다. ①~④는 교안 내용 그대로이다.","source":{"page":4,"section":"6가지 유형의 영재 프로파일 - 베츠와 니하트(Betts \u0026 Neihart, 1988)","quote":"수년간의 관찰, 인터뷰, 문헌연구를 한 후에, 영재 아동과 청소년에 대한 여섯 가지 프로파일을 밝힘 ‣ 영재의 정의, 판별, 교육계획, 상담을 위한 이론적 기초로 기여할 것임"}},{"id":"12-03","type":"빈칸","q":"다음 (ㄱ), (ㄴ)에 들어갈 말로 바르게 짝지은 것은?","box":"베츠와 니하트(Betts \u0026 Neihart, (ㄱ))의 (ㄴ)가지 유형의 영재 프로파일 연구","choices":["(ㄱ) 1988 - (ㄴ) 6","(ㄱ) 1998 - (ㄴ) 6","(ㄱ) 1988 - (ㄴ) 5","(ㄱ) 1978 - (ㄴ) 4","(ㄱ) 1998 - (ㄴ) 8"],"answer":1,"explain":"교안: '베츠와 니하트(Betts \u0026 Neihart, 1988)의 6가지 유형의 영재 프로파일 연구'. 연도는 1988년, 유형은 6가지이다.","source":{"page":4,"section":"6가지 유형의 영재 프로파일","quote":"베츠와 니하트(Betts \u0026 Neihart, 1988)의 6가지 유형의 영재 프로파일 연구"}},{"id":"12-04","type":"보기 조합","q":"\u003c보기\u003e에서 베츠와 니하트(Betts \u0026 Neihart)의 6가지 유형의 영재 프로파일에 해당하는 것을 모두 고른 것은?","box":"ㄱ. 성공적인(successful) 영재\nㄴ. 잠복되어 있는(underground) 영재\nㄷ. 미성취(underachieving) 영재\nㄹ. 중복낙인(double-labeled) 영재","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"6가지 유형은 성공적인(successful), 자율적인 학습자(autonomous learner), 잠복되어 있는(underground), 중도탈락(dropouts), 중복낙인(double-labeled), 도전적인(challenging) 영재이다. ㄷ '미성취 영재'는 6가지 유형에 없다.","source":{"page":5,"section":"6가지 유형의 영재 프로파일","quote":"성공적인(successful) 영재 자율적인 학습자(autonomous learner) 영재 잠복되어 있는(underground) 영재 중도탈락(dropouts) 영재 중복낙인(double-labeled) 영재 도전적인(challenging) 영재"}},{"id":"12-05","type":"사례","q":"다음 사례의 학생에 해당하는 베츠와 니하트(Betts \u0026 Neihart)의 영재 유형은?","box":"민수는 영재교육 기관에서 영재로 판별되었다. 부모와 교사의 말을 경청하고 학교와 가정에서 적절하게 행동하는 모범생으로, 칭찬받기를 원하기 때문에 문제행동을 거의 일으키지 않지만 교사와 부모에게 의존적인 성향도 있다. 성취도검사와 지능검사에서 고득점을 받았으나 창의성과 자율성은 부족한 편이다.","choices":["자율적인 학습자(autonomous learner) 영재","성공적인(successful) 영재","잠복되어 있는(underground) 영재","도전적인(challenging) 영재","중도탈락된(dropouts) 영재"],"answer":2,"explain":"유형1 성공적인 영재는 영재로 판별된 대다수의 학생이 속하는 유형으로 모범생이며, 교사와 부모에게 의존적인 성향이 있고, 성취도검사·지능검사 고득점으로 판별 가능성이 높지만 창의성과 자율성이 부족할 수도 있다. ① 자율적 학습자는 자기 지향적이고 강한 자아개념을 지닌다. ③④⑤는 각각 영재성 숨김, 권위에 도전, 학교에 대한 분노가 특징이다.","source":{"page":6,"section":"유형1 : 성공적인(successful) 영재","quote":"교사, 부모와 다른 어른들로부터 칭찬받기를 원하기 때문에 문제행동을 거의 일으키지 않으나, 교사와 부모에게 의존적인 성향도 있음"}},{"id":"12-06","type":"옳지 않은 것","q":"베츠와 니하트(Betts \u0026 Neihart)의 영재 유형과 영문 명칭의 연결로 옳지 않은 것은?","box":null,"choices":["successful - 성공적인 영재","autonomous learner - 자율적인 학습자 영재","dropouts - 중도탈락된 영재","underground - 도전적인 영재","double-labeled - 중복낙인 영재"],"answer":4,"explain":"underground는 '잠복되어 있는' 영재이고, 도전적인 영재는 challenging이다. 따라서 ④가 틀리다. 나머지는 교안의 명칭과 일치한다.","source":{"page":5,"section":"6가지 유형의 영재 프로파일","quote":"잠복되어 있는(underground) 영재 중도탈락(dropouts) 영재 중복낙인(double-labeled) 영재 도전적인(challenging) 영재"}},{"id":"12-07","type":"개념 찾기","q":"다음 설명에 해당하는 영재 유형은?","box":"• 스스로 새로운 기회를 창조하기 위해 시스템 학습을 사용함\n• 자신의 욕구가 충족되므로 강하고 긍정적인 자아개념을 소유함\n• 학교와 지역공동체 내에서 리더십 능력으로 봉사하는 경우가 많음\n• 자기 지향적으로 자신의 교육적, 개인적 목표를 설계하며 모험을 감수할 수 있음","choices":["자율적인 학습자(autonomous learner) 영재","성공적인(successful) 영재","도전적인(challenging) 영재","잠복되어 있는(underground) 영재","중복낙인(double-labeled) 영재"],"answer":1,"explain":"유형2 자율적인 학습자 영재의 특성이다. ② 성공적인 영재는 학교 시스템에서 효과적으로 학습하고 가능한 적게 노력하며 교사·부모에게 의존적이다. ③④⑤는 권위 도전, 영재성 숨김, 장애·학습장애로 간주되는 유형이다.","source":{"page":7,"section":"유형2 : 자율적인 학습자(autonomous learner) 영재","quote":"자율적 학습자는 스스로 새로운 기회를 창조하기 위해 시스템 학습을 사용함 ‣ 자신의 욕구가 충족되므로 강하고 긍정적인 자아개념을 소유하고 있어, 성공적이고 긍정적인 배려를 받음"}},{"id":"12-08","type":"옳은 것","q":"성공적인(successful) 영재에 대한 설명으로 옳은 것은?","box":null,"choices":["영재교육 기관에서 영재로 판별된 학생 중 소수만 속하는 유형이다.","교사와 부모로부터 독립적인 성향이 강하다.","학교 시스템에서 효과적으로 학습하고 가능한 적게 노력하는 유형이다.","성취도검사와 지능검사에서 고득점을 얻기 어려워 영재로 판별될 가능성이 낮다.","영재성과 재능을 충분히 발달시켜 창의성과 자율성이 매우 뛰어나다."],"answer":3,"explain":"교안은 자율적 학습자와 비교하여 성공적인 영재를 '학교 시스템에서 효과적으로 학습하고 가능한 적게 노력하는 유형'이라고 했다. ① 영재로 판별된 대다수의 학생이 속한다. ② 의존적인 성향도 있다. ④ 고득점으로 판별 가능성이 높다. ⑤ 영재성과 재능을 충분히 발달시키지 못하여 창의성과 자율성이 부족할 수도 있다.","source":{"page":7,"section":"유형2 : 자율적인 학습자(autonomous learner) 영재","quote":"학교 시스템에서 효과적으로 학습하고 가능한 적게 노력하는 유형인 성공적인 영재와 달리"}},{"id":"12-09","type":"사례","q":"다음 사례의 학생에 해당하는 영재 유형은?","box":"지수는 친구들 사이에서 소속감을 더 느끼기 위해 자신의 재능을 부정하고 영재성을 숨긴다. 자주 불안해하며 걱정하고, 변화하려는 욕구 때문에 교사나 부모의 기대와 갈등을 겪는다. 지수의 부모 또한 비슷한 경향을 보인다.","choices":["성공적인(successful) 영재","자율적인 학습자(autonomous learner) 영재","중도탈락된(dropouts) 영재","도전적인(challenging) 영재","잠복되어 있는(underground) 영재"],"answer":5,"explain":"유형3 잠복되어 있는 영재는 자신의 영재성을 숨기거나 나중에 나타나는 경향이 있고, 일반 집단에서 소속감을 더 느끼기 위해 재능을 부정하며 자주 불안해하고 걱정한다. 부모 또한 같은 경향이 높다.","source":{"page":8,"section":"유형3 : 잠복되어 있는(underground) 영재","quote":"자신의 영재성을 숨기거나 나중에 나타나는 경향이 있고, 일반 집단에서 소속감을 더 느끼기 위해 재능을 부정하고 자주 불안해하며 걱정함 ‣ 부모 또한 상위와 같은 경향이 높음"}},{"id":"12-10","type":"옳지 않은 것","q":"잠복되어 있는(underground) 영재에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["자신의 영재성을 숨기거나 나중에 나타나는 경향이 있다.","부모는 이러한 경향이 낮아 자녀가 영재성을 드러내도록 적극 격려한다.","변화하려는 욕구는 종종 교사나 부모의 기대와 갈등을 일으킨다.","어른들은 이러한 아동들이 어떻게 느끼고 있는지를 고려하지 않고, 교육 프로그램을 계속할 것을 고집하고 강요하는 경향이 있다.","일반 집단에서 소속감을 더 느끼기 위해 재능을 부정한다."],"answer":2,"explain":"교안은 '부모 또한 상위와 같은 경향이 높음'이라고 했으므로 ②는 틀리다. ①③④⑤는 잠복되어 있는 영재의 특성 그대로이다.","source":{"page":8,"section":"유형3 : 잠복되어 있는(underground) 영재","quote":"부모 또한 상위와 같은 경향이 높음 ‣ 변화하려는 욕구는 종종 교사나 부모의 기대와 갈등을 일으킴"}},{"id":"12-11","type":"사례","q":"다음 사례의 학생에 해당하는 영재 유형은?","box":"고등학생 준호는 수년간 학교 시스템이 자신의 욕구를 충족시키지 못하고 거부감을 느끼게 했다며 자신과 어른들에게 화가 나 있다. 정규 학교 교육과정의 범위를 벗어난 것에 흥미를 보이며, 최근에는 학교에 거의 출석하지 않는다. 몸은 학교에 있어도 정서적, 정신적으로는 이미 학교를 떠났다고 느낀다.","choices":["잠복되어 있는(underground) 영재","도전적인(challenging) 영재","중복낙인(double-labeled) 영재","중도탈락된(dropouts) 영재","성공적인(successful) 영재"],"answer":4,"explain":"유형4 중도탈락된 영재는 수년간 시스템이 욕구를 충족시키지 못해 자신과 어른들에게 화가 나 있고, 정규 교육과정 밖에 흥미를 보이며, 대부분 고등학생으로 학교를 거의 출석하지 않거나 자퇴하는 경우가 많다. 신체적으로는 아니지만 정서적, 정신적으로 '중도탈락'되었다고 느낀다.","source":{"page":9,"section":"유형4 : 중도탈락된(dropouts) 영재","quote":"수년간 시스템이 자신들의 욕구를 충족시키지 못했고 거부감을 느끼게 하였기 때문에 자신과 어른들에게 화가 나 있음"}},{"id":"12-12","type":"옳지 않은 것","q":"중도탈락된(dropouts) 영재에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["대부분 초등학생으로, 학교에 성실히 출석하는 경우가 많다.","수년간 시스템이 자신들의 욕구를 충족시키지 못했고 거부감을 느끼게 하였기 때문에 자신과 어른들에게 화가 나 있다.","정규 학교 교육과정의 범위를 벗어난 것에 자주 흥미를 보인다.","비범한 영역에서 그들의 재능과 흥미가 확인되기도 한다.","신체적으로는 아니지만 정서적, 정신적으로 '중도탈락'되었다고 느낀다."],"answer":1,"explain":"교안은 '대부분 고등학생으로 학교를 거의 출석하지 않거나 자퇴하는 경우도 많음'이라고 했으므로 ①은 틀리다. ②~⑤는 교안 내용 그대로이다.","source":{"page":9,"section":"유형4 : 중도탈락된(dropouts) 영재","quote":"대부분 고등학생으로 학교를 거의 출석하지 않거나 자퇴하는 경우도 많음 ‣ 신체적으로는 아니지만 정서적, 정신적으로 ‘중도탈락’되었다고 느낌"}},{"id":"12-13","type":"개념 찾기","q":"다음 설명에 해당하는 영재 유형은?","box":"• 신체적, 정서적 장애를 가진 영재로 간주되거나 학습장애아로 간주되는 경향이 높음\n• 학교에서 영재로 보이는 행동이 나타나지 않으며, 낙심, 좌절, 무기력, 고독을 느낌","choices":["잠복되어 있는(underground) 영재","중도탈락된(dropouts) 영재","중복낙인(double-labeled) 영재","도전적인(challenging) 영재","자율적인 학습자(autonomous learner) 영재"],"answer":3,"explain":"유형5 중복낙인 영재의 특성이다. 대부분의 영재교육 프로그램은 이런 아동을 판별하지 못하거나 차별화된 프로그램을 제공하지 못한다.","source":{"page":10,"section":"유형5 : 중복낙인(double-labeled) 영재","quote":"신체적, 정서적 장애를 가진 영재로 간주되거나 학습장애아로 간주되는 경향이 높음 ‣ 학교에서 영재로 보이는 행동이 나타나지 않으며, 낙심, 좌절, 무기력, 고독을 느낌"}},{"id":"12-14","type":"옳은 것","q":"중복낙인(double-labeled) 영재에 대한 설명으로 옳은 것은?","box":null,"choices":["학교에서 영재로 보이는 행동이 뚜렷하게 나타난다.","대부분의 영재교육 프로그램은 이런 아동을 쉽게 판별하여 차별화된 프로그램을 제공한다.","강하고 긍정적인 자아개념을 소유하고 리더십 능력으로 봉사하는 경우가 많다.","교사, 부모로부터 칭찬받기를 원하기 때문에 문제행동을 거의 일으키지 않는다.","대부분의 영재교육 프로그램은 이런 아동을 판별하지 못하거나 차별화된 프로그램을 제공하지 못한다."],"answer":5,"explain":"교안: '대부분의 영재교육 프로그램은 이런 아동을 판별하지 못하거나 차별화된 프로그램을 제공하지 못함'. ① 영재로 보이는 행동이 나타나지 않는다. ② 반대 서술이다. ③ 자율적인 학습자 영재의 특성이다. ④ 성공적인 영재의 특성이다.","source":{"page":10,"section":"유형5 : 중복낙인(double-labeled) 영재","quote":"대부분의 영재교육 프로그램은 이런 아동을 판별하지 못하거나 차별화된 프로그램을 제공하지 못함"}},{"id":"12-15","type":"사례","q":"다음 사례의 학생에 해당하는 영재 유형은?","box":"서준이는 높은 수준의 창의성을 지니고 있으나 고집스럽고 요령이 없으며, 말투가 빈정대는 것처럼 보일 때가 있다. 종종 권위에 의문을 품고 교실에서 교사에게 도전적이며, 친구들에게도 도전하기 때문에 집단 프로젝트에서 환영받지 못한다. 전통적인 영재교육 시스템에서는 영재로 판별되지 못했다.","choices":["중도탈락된(dropouts) 영재","도전적인(challenging) 영재","잠복되어 있는(underground) 영재","성공적인(successful) 영재","중복낙인(double-labeled) 영재"],"answer":2,"explain":"유형6 도전적인 영재는 전통적인 영재교육 시스템에서 영재로 판별되기 어렵고, 높은 수준의 창의성을 지니나 고집스럽고 요령이 없으며 빈정대는 것처럼 보일 수 있고, 권위에 의문을 품으며 교사에게 도전적이다.","source":{"page":11,"section":"유형6 : 도전적인(challenging) 영재","quote":"전형적으로 높은 수준의 창의성을 지니고 있으나, 고집스럽고 요령이 없으며, 빈정대는 것처럼 보일 수 있음"}},{"id":"12-16","type":"옳지 않은 것","q":"도전적인(challenging) 영재에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["전통적인 영재교육 시스템에서 영재로 쉽게 판별된다.","전형적으로 높은 수준의 창의성을 지니고 있다.","학교 시스템에서 재능과 능력들을 인정받지 못하기 때문에 좌절감을 느끼나 자존심을 지키기 위해 애쓴다.","친구들에게 도전하기 때문에 또래집단에 속하지 못하거나 어떤 활동, 집단 프로젝트에서 환영받지 못한다.","유머감각과 창의성이 있어서 친구들에게 인기가 많은 경우도 있다."],"answer":1,"explain":"교안은 도전적인 영재가 '전통적인 영재교육 시스템에서는 영재로 판별되기 어려움'이라고 했으므로 ①은 틀리다. ②~⑤는 교안 내용 그대로이다.","source":{"page":11,"section":"유형6 : 도전적인(challenging) 영재","quote":"전통적인 영재교육 시스템에서는 영재로 판별되기 어려움"}},{"id":"12-17","type":"개념 찾기","q":"허버트(Herbert)의 저명인사의 영재성과 환경에 대한 연구에서 다음 특성을 보인 집단은?","box":"• 설득력 있음, 합리적, 확고함, 내성적, 낙천적\n• 매력 있음, 인기 있음, 잘생김, 키가 큼\n• 다른 형제들이 좋아함, 성공적인 학교생활\n• 자신의 분야에서 문화적 매체가 됨\n• 아버지가 없거나 외동아일 확률은 낮음","choices":["종교지도자","군인","철학가","정치가","음악가"],"answer":4,"explain":"제시된 특성은 32명의 정치가의 특성이다(대표 인물: Franklin, Benjamin(160), Grotius, Hugo(197), Jefferson, Thomas(160), Lincoln, Abraham(147) 등). 철학가는 반대로 잘생기거나 인기 있지 않았고 학교에서 성공적이지 않았다.","source":{"page":13,"section":"허버트(Herbert)의 연구 - 32명의 정치가의 특성","quote":"설득력 있음, 합리적, 확고함, 내성적, 낙천적 • 매력 있음, 인기 있음, 잘생김, 키가 큼 • 다른 형제들이 좋아함, 성공적인 학교생활"}},{"id":"12-18","type":"옳지 않은 것","q":"허버트(Herbert)의 저명인사의 영재성과 환경에 대한 연구에서 집단별 대상 인원으로 옳지 않은 것은?","box":null,"choices":["정치가 - 32명","종교지도자 - 21명","군인 - 23명","음악가 - 21명","철학가 - 19명"],"answer":3,"explain":"군인은 17명이다. 23명은 평론가, 역사, 사회학자 집단이다. 나머지(정치가 32명, 종교지도자 21명, 음악가 21명, 철학가 19명)는 교안과 일치한다.","source":{"page":15,"section":"허버트(Herbert)의 연구 - 17명의 군인의 특성","quote":"17명의 군인의 특성"}},{"id":"12-19","type":"옳은 것","q":"허버트(Herbert)의 연구에서 21명의 종교지도자의 특성으로 옳은 것은?","box":null,"choices":["쓰기 실력은 약했음","학교에서 성공적이지 않았음","아버지와 선생님의 격려가 있었음","외적 보상과 지원이 많음","어머니나 다른 어른들로부터 격려를 받았고, 어릴 때 일찍이 유명인사들과 만날 기회가 있었음"],"answer":5,"explain":"종교지도자는 집중력 있고, 일을 즐기고, 박식하고, 조숙하며 도덕적, 철학적, 민감하고, 어머니나 다른 어른들로부터 격려를 받았으며 어릴 때 일찍이 유명인사들과 만날 기회와 충분한 지원이 있었다. ①④ 군인, ② 철학가, ③ 음악가의 특성이다.","source":{"page":14,"section":"허버트(Herbert)의 연구 - 21명의 종교지도자의 특성","quote":"어머니나 다른 어른들로부터 격려를 받음 • 어릴 때 일찍이 유명인사들과 만날 기회가 있었고, 충분한 지원이 있었음"}},{"id":"12-20","type":"개념 찾기","q":"허버트(Herbert)의 연구에서 다음 특성을 보인 집단은?","box":"• 호기심이 강함, 키가 큼, 강함\n• 활력이 넘침\n• 외적 보상과 지원이 많음\n• 쓰기 실력은 약했음","choices":["정치가","군인","음악가","종교지도자","철학가"],"answer":2,"explain":"17명의 군인의 특성이다(대표 인물: Bolivar, Simon(145), Thomas Jonathan(132), Bonaparte, Napoleon(142), Washington, George(135) 등).","source":{"page":15,"section":"허버트(Herbert)의 연구 - 17명의 군인의 특성","quote":"호기심이 강함, 키가 큼, 강함 • 활력이 넘침 • 외적 보상과 지원이 많음 • 쓰기 실력은 약했음"}},{"id":"12-21","type":"옳은 것","q":"허버트(Herbert)의 연구에서 집단과 특성의 연결로 옳은 것은?","box":null,"choices":["정치가 - 쓰기 실력은 약했음","음악가 - 경험주의적, 다재다능","평론가, 역사, 사회학자 - 문화적 자극이 있었음, 다양한 문화와 아이디어에 대한 열린 마음","철학가 - 매력 있음, 인기 있음, 잘생김","군인 - 도덕적, 철학적, 민감함"],"answer":3,"explain":"23명의 평론가, 역사, 사회학자는 융통성, 참을성이 있음, 민감함, 도전적, 종교적이며 문화적 자극이 있었고 다양한 문화와 아이디어에 대한 열린 마음을 가졌다. ① 군인, ② 철학가, ④ 정치가, ⑤ 종교지도자의 특성이다.","source":{"page":16,"section":"허버트(Herbert)의 연구 - 23명의 평론가, 역사, 사회학자의 특성","quote":"융통성, 참을성이 있음, 민감함 • 도전적, 종교적 • 문화적 자극이 있었음 • 다양한 문화와 아이디어에 대한 열린 마음"}},{"id":"12-22","type":"개념 찾기","q":"허버트(Herbert)의 연구에서 다음 특성을 보인 집단은?","box":"• 능력이 우수하고, 매사 열심히 함\n• 기회를 잘 포착함\n• 아버지와 선생님의 격려가 있었음\n• 연설은 잘하지 못하고, 도덕성이 조금 부족","choices":["음악가","정치가","평론가, 역사, 사회학자","군인","종교지도자"],"answer":1,"explain":"21명의 음악가의 특성이다(대표 인물: Bach, J. Sebastian(152), Beethoven, Ludwig Van(157), Mozart, W. A.(162) 등). 종교지도자는 어머니나 다른 어른들의 격려를 받았다는 점과 구분한다.","source":{"page":17,"section":"허버트(Herbert)의 연구 - 21명의 음악가의 특성","quote":"능력이 우수하고, 매사 열심히 함 • 기회를 잘 포착함 • 아버지와 선생님의 격려가 있었음 • 연설은 잘하지 못하고, 도덕성이 조금 부족"}},{"id":"12-23","type":"옳지 않은 것","q":"허버트(Herbert)의 연구에서 19명의 철학가의 특성으로 옳지 않은 것은?","box":null,"choices":["질문이 많음, 경험주의적, 도전적, 다재다능","부모의 기대가 높았음","탐구의 기회가 많았음","잘생기고 인기가 많았으며 학교에서 성공적이었음","대표 인물로 Descartes, Rene(175), Spinoza, Baruch(172) 등이 있음"],"answer":4,"explain":"철학가는 '잘 생기거나 인기 있지 않았음', '학교에서 성공적이지 않았음'이므로 ④는 틀리다(잘생김·인기·성공적인 학교생활은 정치가의 특성). ①②③⑤는 교안 내용 그대로이다.","source":{"page":18,"section":"허버트(Herbert)의 연구 - 19명의 철학가의 특성","quote":"질문이 많음, 경험주의적, 도전적, 다재다능 • 부모의 기대가 높았음, 탐구의 기회가 많았음 • 잘 생기거나 인기 있지 않았음 • 학교에서 성공적이지 않았음"}},{"id":"12-24","type":"옳지 않은 것","q":"허버트(Herbert)의 연구에서 대표 인물과 집단의 연결로 옳지 않은 것은?","box":null,"choices":["Lincoln, Abraham - 정치가","Calvin, John - 종교지도자","Bonaparte, Napoleon - 군인","Rousseau, J. J. - 평론가, 역사, 사회학자","Beethoven, Ludwig Van - 철학가"],"answer":5,"explain":"Beethoven, Ludwig Van(157)은 음악가의 대표 인물이다. 철학가의 대표 인물은 Bacon, Francis(172), Descartes, Rene(175), Leibnitz, Gottfried Wihelm(200), Spinoza, Baruch(172) 등이다. ①~④는 교안과 일치한다.","source":{"page":17,"section":"허버트(Herbert)의 연구 - 21명의 음악가의 특성","quote":"Bach, J. Sebastian(152) / Beethoven, Ludwig Van(157) / Mozart, W. A.(162) 등"}},{"id":"12-25","type":"빈칸","q":"허버트(Herbert)의 연구에서 철학가의 대표 인물로 제시된 Leibnitz, Gottfried Wihelm의 IQ로 알맞은 것은?","box":"Leibnitz, Gottfried Wihelm(   )","choices":["172","200","175","197","180"],"answer":2,"explain":"교안: Leibnitz, Gottfried Wihelm(200). 172는 Bacon·Spinoza, 175는 Descartes, 197은 정치가 Grotius, Hugo, 180은 종교지도자 Melanchthon, Philipp와 평론가 Macaulay, Thomas의 IQ이다.","source":{"page":18,"section":"허버트(Herbert)의 연구 - 19명의 철학가의 특성","quote":"Bacon, Francis(172) / Descartes, Rene(175) / Leibnitz, Gottfried Wihelm(200)"}}]},{"lesson":13,"title":"AI를 영재교육에서 어떻게 활용해야 하나?","file":"4. 교안 (1~30)/13.pdf","summary":["인간의 지능(지식 습득·추상적 사고와 추론·새로운 문제 해결 능력)을 컴퓨터가 구현하도록 만든 것 = 인공지능","앨런 튜링(Alan Turing) \"계산하는 기계와 지성, 1950\" / 1956년 디트머스 콘퍼런스(Dartmouth Conference)에서 \"인공지능\" 용어 등장","Program = 수학적 논리로 표현 가능한 명령체계, Coding = 컴퓨터 Program 만드는 작업, Algorithm = 수학적으로 완결된 구조","1970년대 모라벡의 역설: 인간에게 어려운 것은 AI에게 쉽고, AI가 쉬운 것은 인간에게 어렵다","1990년대 이전 기호주의(지적능력 모두 입력) → 1990년대~2010년 기계학습(스스로 특징 학습) → 2010년 이후 심층 신경망·딥러닝(빅데이터로부터 스스로 특징 찾음) → 2023년 11월 이후 대화형 생성AI(ChatGPT, bard, bing): 식별·검색의 시대 → 생성의 시대","Goldin \u0026 Katz: 교육이 테크놀로지를 앞서면 번영, 테크놀로지가 교육을 앞서면 사회적 고통","ChatGPT 장점: 확률 기반 모델로 더욱 자연스러운 언어 생성 / 대화 기반 활동에 활용 가능","ChatGPT 단점: 사람이 점검하지 않으면 틀린 정보·편견 생성, 훈련데이터 편향으로 불공정 결과 → 인간에 의한 강화학습(Reinforcement Learning by Human Response) 도입","정부·교육기관은 학습장면 활용 활발히 논의 중(AI 윤리, 학습권 방해 등 이슈)","영재교육 활용 4영역: 학습능력 향상, 언어능력 향상(예: 영어 에세이/실험 일지/발표 자료 번역·수정·보완), 컴퓨터 프로그래밍(예: 코딩교육, SW교육), 교실환경 개선(협력적 학습·자기주도적 학습)","문제점: 불필요한 정보 생성 우려, 빅데이터 내재 편향 반영, 과도한 의존 시 자기주도적 사고능력·창의성·독립적 아이디어 발전 억제"],"questions":[{"id":"13-01","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"인간의 지능을 컴퓨터가 구현하도록 만든 것을 \"(   )\"이라 함","choices":["기계학습","인공지능","딥러닝","알고리즘","빅데이터"],"answer":2,"explain":"교안은 인간의 지능(지식 습득, 추상적 사고·추론, 새로운 문제 해결 능력)을 컴퓨터가 구현하도록 만든 것을 '인공지능'이라 함. ① 기계학습은 1990년대~2010년 스스로 특징을 학습하는 방식 ③ 딥러닝은 2010년 이후 학습 방식 ④ 알고리즘은 '수학적으로 완결된 구조' ⑤ 빅데이터는 AI가 학습하는 자료.","source":{"page":3,"section":"01. AI의 발전 - 인간의 지능","quote":"인간의 지능을 컴퓨터가 구현하도록 만든 것을 \"인공지능\"이라 함"}},{"id":"13-02","type":"옳지 않은 것","q":"교안에서 설명한 '인간의 언어와 인공지능'에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["스스로 인간의 언어를 이해하고 주의를 기울여 생성하는 인공지능이다.","컴퓨터(로봇, 자율형 자동차, 드론 등)가 스스로 수천만~수조의 빅데이터를 학습한다.","자신의 지능을 발달시킬 뿐 아니라 사물 간에도 서로 실시간 네트워크로 연계되어 있다.","인간이 입력해 준 프로그램대로만 작동하는 컴퓨터이다.","지능을 스스로 진화하고 있는 인공지능의 세계이다."],"answer":4,"explain":"교안은 '인간이 입력해준 프로그램대로 작동하는 컴퓨터가 아님'이라고 명시함 → ④가 반대 서술. ①②③⑤는 교안 내용 그대로임.","source":{"page":4,"section":"01. AI의 발전 - 인간의 언어와 인공지능","quote":"인간이 입력해준 프로그램대로 작동하는 컴퓨터가 아님 ‣ 컴퓨터(로봇, 자율형 자동차, 드론 등)가 스스로 수천만~수조의 빅데이터 학습"}},{"id":"13-03","type":"빈칸","q":"다음 (   )에 들어갈 연도로 알맞은 것은?","box":"수학자 앨런 튜링(Alan Turing)의 \"계산하는 기계와 지성, (   )\" - 인간의 이성적인 논리를 수학의 문자와 숫자 및 기호로 완결된 구조를 표현 가능","choices":["1946","1948","1950","1956","1957"],"answer":3,"explain":"교안: 앨런 튜링의 \"계산하는 기계와 지성, 1950\". ④ 1956년은 디트머스 콘퍼런스에서 '인공지능' 용어가 등장한 해 ⑤ 1957은 교안 해당 내용 없음 ①② 해당 없음.","source":{"page":5,"section":"01. AI의 발전 - AI 발전과정","quote":"수학자 앨런 튜링(Alan Turing)의 \"계산하는 기계와 지성, 1950\" 인간의 이성적인 논리를 수학의 문자와 숫자 및 기호로 완결된 구조를 표현 가능"}},{"id":"13-04","type":"보기 조합","q":"AI 발전과정에 대한 \u003c보기\u003e의 설명 중 옳은 것을 모두 고른 것은?","box":"ㄱ. Program: 수학적 논리로 표현 가능한 명령체계\nㄴ. Coding: 컴퓨터 Program 만드는 작업\nㄷ. Algorithm: 컴퓨터 Program 만드는 작업\nㄹ. 1956년 디트머스 콘퍼런스(Dartmouth Conference)에서 \"인공지능\" 용어가 등장함","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ·ㄴ·ㄹ은 교안 그대로. ㄷ은 틀림 → 교안에서 Algorithm은 '수학적으로 완결된 구조'이고, '컴퓨터 Program 만드는 작업'은 Coding임.","source":{"page":5,"section":"01. AI의 발전 - AI 발전과정","quote":"Program: 수학적 논리로 표현 가능한 명령체계 ‣ Coding: 컴퓨터 Program 만드는 작업 ‣ Algorithm: 수학적으로 완결된 구조 / 1956년 디트머스 콘퍼런스(Dartmouth Conference)에서 \"인공지능\" 용어가 등장함"}},{"id":"13-05","type":"빈칸","q":"다음 (   )에 들어갈 연도로 알맞은 것은?","box":"(   )년 디트머스 콘퍼런스(Dartmouth Conference)에서 \"인공지능\" 용어가 등장함","choices":["1946","1950","1952","1955","1956"],"answer":5,"explain":"교안: 1956년 디트머스 콘퍼런스에서 '인공지능' 용어 등장. ② 1950은 앨런 튜링 \"계산하는 기계와 지성\" 발표 연도 ①③④는 교안에 없는 연도.","source":{"page":5,"section":"01. AI의 발전 - AI 발전과정","quote":"1956년 디트머스 콘퍼런스(Dartmouth Conference)에서 \"인공지능\" 용어가 등장함"}},{"id":"13-06","type":"개념 찾기","q":"다음 설명에 해당하는 것은?","box":"1970년대 AI 발전과정에서 제시된 것으로, 인간에게 어려운 것은 AI에게는 쉽고, AI가 쉬운 것은 인간에게 어렵다는 것 (예: 양자물리학, 좋은 사람(첫인상))","choices":["모라벡의 역설(Moravec's Paradox)","기호주의","기계학습(machine learning)","심층 신경망(Deep Neural Network Learning)","인간에 의한 강화학습"],"answer":1,"explain":"1970년대 AI 발전과정의 '모라벡의 역설'에 대한 설명. ② 기호주의는 1990년대 이전, 인간의 지적능력을 모두 입력하려 함 ③ 기계학습은 1990년대~2010년, 스스로 특징 학습 ④ 심층 신경망은 2010년 이후 ⑤ 인간에 의한 강화학습은 ChatGPT 단점 보완책.","source":{"page":6,"section":"01. AI의 발전 - 1970년대 AI 발전과정","quote":"모라벡의 역설(Moravec's Paradox): 인간에게 어려운 것은 AI에게는 쉽고, AI가 쉬운 것은 인간에게 어렵다 ‣ 예: 양자물리학, 좋은 사람(첫인상)"}},{"id":"13-07","type":"옳은 것","q":"AI 발전과정의 시기와 특징을 바르게 연결한 것은?","box":null,"choices":["1970년대 - 기계학습: 스스로 컴퓨터가 특징들을 학습","1990년대 이전 - 심층 신경망, 딥러닝","1990년대~2010년 - 기계학습(machine learning): 스스로 컴퓨터(기계)가 특징들을 학습하는 시대","2010년 이후 - 기호주의: 컴퓨터에게 인간의 지적능력을 모두 입력","2023년 11월 이후 - 생성의 시대에서 식별, 검색의 시대로 전환"],"answer":3,"explain":"교안: 1990년대~2010년 = 기계학습. ① 1970년대는 모라벡의 역설 ② 1990년대 이전은 기호주의 ④ 2010년 이후는 심층 신경망·딥러닝 ⑤ 2023년 11월 이후는 '식별, 검색의 시대에서 생성의 시대로' 전환(방향 반대).","source":{"page":6,"section":"01. AI의 발전 - 1970년대 AI 발전과정","quote":"1990년대 이전 ‣ 기호주의: 컴퓨터에게 인간의 지적능력을 모두 입력하려고 함 ‣ 예: 고양이란? 1990년대~2010년 ‣ 기계학습(machine learning): 스스로 컴퓨터(기계)가 특징들을 학습하는 시대"}},{"id":"13-08","type":"개념 찾기","q":"다음 설명에 해당하는 AI 발전과정의 단계는?","box":"1990년대 이전, 컴퓨터에게 인간의 지적능력을 모두 입력하려고 함 (예: 고양이란?)","choices":["기계학습","딥러닝","대화형 생성AI","기호주의","모라벡의 역설"],"answer":4,"explain":"1990년대 이전 '기호주의'에 대한 설명. ① 기계학습은 1990년대~2010년, 컴퓨터가 스스로 특징 학습 ② 딥러닝은 2010년 이후 ③ 대화형 생성AI는 2023년 11월 이후 ⑤ 모라벡의 역설은 1970년대.","source":{"page":6,"section":"01. AI의 발전 - 1970년대 AI 발전과정","quote":"1990년대 이전 ‣ 기호주의: 컴퓨터에게 인간의 지적능력을 모두 입력하려고 함 ‣ 예: 고양이란?"}},{"id":"13-09","type":"빈칸","q":"다음은 2010년 이후 AI 발전과정에 대한 설명이다. (   )에 공통으로 들어갈 말로 알맞은 것은?","box":"심층 신경망, 딥러닝(Deep Neural Network Learning): 컴퓨터의 성능과 인터넷(SNS)의 발달로 (   )가 생성되어 AI가 (   )로부터 스스로 가장 적절한 특징을 찾아내는 학습","choices":["알고리즘","프로그램","기호","가중치","빅데이터"],"answer":5,"explain":"교안: 컴퓨터 성능과 인터넷(SNS) 발달로 '빅데이터'가 생성되어 AI가 빅데이터로부터 스스로 가장 적절한 특징을 찾아내는 학습 = 딥러닝. ① 알고리즘 = 수학적으로 완결된 구조 ② 프로그램 = 명령체계 ③ 기호는 기호주의 관련 ④ 가중치는 인간에 의한 강화학습 설명에 등장.","source":{"page":7,"section":"01. AI의 발전 - AI 발전과정(2010년 이후)","quote":"심층 신경망, 딥러닝(Deep Neural Network Learning): 컴퓨터의 성능과 인터넷(SNS)의 발달로 빅데이터가 생성되어 AI가 빅데이터로부터 스스로 가장 적절한 특징을 찾아내는 학습"}},{"id":"13-10","type":"옳은 것","q":"교안에서 설명한 '대화형 생성AI의 등장'에 대한 설명으로 옳은 것은?","box":null,"choices":["2010년 이후 등장하여 기호주의를 대체하였다.","ChatGPT, bard, bing의 등장은 AI의 지각변동으로, 식별·검색의 시대에서 생성의 시대로 전환되었다.","생성의 시대에서 식별·검색의 시대로 전환되었다.","1990년대~2010년에 등장하여 기계학습의 시대를 열었다.","인간이 입력해 준 규칙만을 따르는 시대로 회귀하였다."],"answer":2,"explain":"교안: 2023년 11월 이후 대화형 생성AI(ChatGPT, bard, bing) 등장은 AI의 지각변동, 식별·검색의 시대 → 생성의 시대로 전환. ① 2010년 이후는 딥러닝 ③ 전환 방향 반대 ④ 1990년대~2010년은 기계학습 시대 ⑤ 교안에 없는 내용.","source":{"page":7,"section":"01. AI의 발전 - AI 발전과정(2023년 11월 이후)","quote":"대화형 생성AI의 등장: ChatGPT, bard, bing의 등장은 AI의 지각변동 ‣ 식별, 검색의 시대에서 생성의 시대로 전환됨"}},{"id":"13-11","type":"개념 찾기","q":"다음 주장을 한 학자로 교안에 제시된 것은?","box":"교육이 테크놀로지를 앞서면 번영이 오지만 테크놀로지가 교육을 앞서면 사회적 고통이 뒤따름. 현재의 디지털 혁명 속에서 교육이 어떤 위치를 차지할 것인지 진지한 고민이 필요함","choices":["앨런 튜링(Alan Turing)","모라벡(Moravec)","Goldin \u0026 Katz","로버트 스턴버그(Robert J. Sternberg)","하워드 가드너(Howard Gardner)"],"answer":3,"explain":"교안 '교육과 테크놀로지' 쪽의 출처: Goldin \u0026 Katz (2018). The race between education and technology. ① 앨런 튜링은 \"계산하는 기계와 지성, 1950\" ② 모라벡은 모라벡의 역설 ④⑤는 이 차시 해당 주장과 무관.","source":{"page":9,"section":"01. AI의 발전 - 교육과 테크놀로지","quote":"교육이 테크놀로지를 앞서면 번영이 오지만 테크놀로지가 교육을 앞서면 사회적 고통이 뒤따름 현재의 디지털 혁명 속에서 교육이 어떤 위치를 차지할 것인지 진지한 고민이 필요함(goldin \u0026 Katz, Havard)"}},{"id":"13-12","type":"옳은 것","q":"교안에서 제시한 ChatGPT의 장점으로 옳은 것은?","box":null,"choices":["확률 기반 모델로 다른 자연어 처리 기술보다 더욱 자연스러운 언어 생성이 가능하다.","규칙 기반 모델로 다른 자연어 처리 기술보다 정확한 정보만 생성한다.","사람이 점검하지 않아도 틀린 정보나 편견을 생성하지 않는다.","텍스트를 이해하는 능력은 없으나 생성하는 능력은 뛰어나다.","대화 기반 활동에는 활용하기 어렵다."],"answer":1,"explain":"교안: ChatGPT는 확률 기반 모델로 다른 자연어 처리 기술보다 더욱 자연스러운 언어 생성 가능(정확도와 자연성). ② '규칙 기반'이 아니라 확률 기반 ③ 단점: 사람이 점검하지 않으면 틀린 정보·편견 생성 가능 ④ 텍스트를 이해하고 생성하는 능력을 모두 가짐 ⑤ 다양한 대화 기반 활동에 활용 가능.","source":{"page":11,"section":"02. AI를 영재교육에 활용하기 - ChatGPT의 장점","quote":"ChatGPT의 경우 확률 기반 모델로 다른 자연어 처리 기술보다 더욱 자연스러운 언어 생성이 가능"}},{"id":"13-13","type":"보기 조합","q":"ChatGPT의 단점 및 활용 논의에 대한 \u003c보기\u003e의 설명 중 옳은 것을 모두 고른 것은?","box":"ㄱ. 사람이 점검하지 않았을 때, 틀린 정보나 편견을 생성할 수 있다.\nㄴ. 훈련 데이터에 내재된 편향으로 인해 공정하지 않은 결과를 만들 수도 있다.\nㄷ. 훈련 데이터가 방대하므로 편향 없는 공정한 결과가 보장된다.\nㄹ. 정부, 교육기관에서는 학습장면에서의 활용에 대해 현재 활발히 논의 중이다.","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"answer":5,"explain":"ㄱ·ㄴ은 ChatGPT의 단점, ㄹ은 교안 그대로. ㄷ은 틀림 → 교안은 훈련데이터에 내재된 편향으로 공정하지 않은 결과를 만들 수 있다고 함.","source":{"page":12,"section":"02. AI를 영재교육에 활용하기 - ChatGPT의 단점","quote":"사람이 점검하지 않았을 때, 틀린 정보나 편견을 생성할 수 있음 훈련데이터에 내재된 편향으로 인해 공정하지 않은 결과를 만들 수도 있음"}},{"id":"13-14","type":"개념 찾기","q":"다음 설명에 해당하는 것은?","box":"ChatGPT의 단점을 보완하기 위한 것으로, 자연 언어 확률 기반 모델이기에 인간의 반응을 확률 언어모델에 가중치를 두어, 더욱 인간에 가까운 가치관, 윤리, 대화에 근거하여 답을 하도록 함","choices":["기호주의","기계학습","심층 신경망","인간에 의한 강화학습(Reinforcement Learning by Human Response)","모라벡의 역설"],"answer":4,"explain":"교안의 '인간에 의한 강화학습(Reinforcement Learning by Human Response) 도입'에 대한 설명. ①②③은 AI 발전과정의 시기별 학습 방식 ⑤는 1970년대 AI 발전과정의 역설.","source":{"page":13,"section":"02. AI를 영재교육에 활용하기 - ChatGPT의 단점","quote":"인간에 의한 강화학습(Reinforcement Learning by Human Response) 도입 ‣ 자연 언어 확률 기반 모델이기에, 인간의 반응을 확률 언어모델에 가중치를 두어, 더욱 인간에 가까운 가치관, 윤리, 대화에 근거하여 답을 하도록 함"}},{"id":"13-15","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"정부, 교육기관에서는 학습장면에서 활용에 대해 현재 활발히 논의 중 - AI 윤리, (   ) 방해 등 이슈","choices":["저작권","학습권","교권","수업권","개인정보"],"answer":2,"explain":"교안: 'AI 윤리, 학습권 방해 등 이슈'. 나머지(저작권, 교권, 수업권, 개인정보)는 교안에 제시되지 않은 표현.","source":{"page":13,"section":"02. AI를 영재교육에 활용하기 - ChatGPT의 단점","quote":"정부, 교육기관에서는 학습장면에서 활용에 대해 현재 활발히 논의 중 / AI 윤리, 학습권 방해 등 이슈"}},{"id":"13-16","type":"옳지 않은 것","q":"AI를 '학습능력 향상(영재와 영재교사)'을 위해 영재교육에 활용하는 방안으로 옳지 않은 것은?","box":null,"choices":["인터넷의 다양한 분야의 전문자료 및 참고 자료를 확장시켜 준다.","여러 관점과 의견을 고려하여 풍부한 학습 자료를 생성할 수 있다.","학습 자료와 관련된 다양한 질문을 만들어 지식을 탐구하고 확장하는 능력을 키울 수 있다.","학습한 결과물을 요약 정리하고, 복잡한 정보를 간결하게 정리하여 학습효과를 극대화할 수 있다.","AI로는 원하는 유형의 문제 출제가 불가능하므로 문제 출제는 교사가 전담해야 한다."],"answer":5,"explain":"교안은 학습능력 향상 활용 방안으로 '원하는 유형의 문제 출제가 가능함'을 제시함 → ⑤ 반대 서술. ①~④는 교안 그대로.","source":{"page":14,"section":"02. AI를 영재교육에 활용하기 - 학습능력 향상(영재와 영재교사)","quote":"학습한 결과물을 요약정리하고, 복잡한 정보를 간결하게 정리하여 학습효과를 극대화할 수 있음 ‣ 원하는 유형의 문제출제가 가능함"}},{"id":"13-17","type":"사례","q":"다음 사례에서 교사가 AI를 활용한 영역으로 교안에 제시된 것은?","box":"김 교사는 영재 학생들이 AI를 사용하여 영어 에세이, 실험 일지, 발표 자료 등을 번역하고 수정·보완하도록 지도하였다. 또한 AI와의 외국어 회화를 통해 실제 대화 상황에서의 활용 능력을 높이도록 하였다.","choices":["언어능력 향상","학습능력 향상","컴퓨터 프로그래밍","교실환경 개선","인간에 의한 강화학습"],"answer":1,"explain":"교안의 '언어능력 향상' 영역: 외국어 회화능력 향상 도모, 실제 대화상황 활용능력 향상, 예: 영어 에세이/실험 일지/발표 자료 등의 번역, 수정, 보완. ② 학습능력 향상은 자료 확장·요약·문제 출제 ③ 컴퓨터 프로그래밍은 코딩교육, SW교육 ④ 교실환경 개선은 협력적·자기주도적 학습 ⑤ ChatGPT 단점 보완책.","source":{"page":15,"section":"02. AI를 영재교육에 활용하기 - 언어능력 향상","quote":"AI를 사용하여 영재들의 외국어 회화능력 향상 도모함 ‣ 실제 대화상황에서의 활용능력을 향상함 / • 예: 영어 에세이/ 실험 일지/ 발표 자료 등의 번역, 수정, 보완"}},{"id":"13-18","type":"빈칸","q":"다음은 AI를 '컴퓨터 프로그래밍' 영재교육에 활용하는 방안이다. (   )에 들어갈 말로 알맞은 것은?","box":"AI를 활용하여 컴퓨터 프로그래밍에 도전함\n새로운 (   )과 소프트웨어를 개발하는 능력을 배양함\n예: 코딩교육, SW교육 등","choices":["하드웨어","데이터","알고리즘","로봇","네트워크"],"answer":3,"explain":"교안: '새로운 알고리즘과 소프트웨어를 개발하는 능력을 배양함'. 나머지는 교안 해당 문장에 없는 용어.","source":{"page":16,"section":"02. AI를 영재교육에 활용하기 - 컴퓨터 프로그래밍","quote":"AI를 활용하여 컴퓨터 프로그래밍에 도전함 ‣ 새로운 알고리즘과 소프트웨어를 개발하는 능력을 배양함 / • 예: 코딩교육, SW교육 등"}},{"id":"13-19","type":"옳은 것","q":"AI를 '교실환경 개선'을 위해 영재교육에 활용하는 방안으로 옳은 것은?","box":null,"choices":["AI를 활용하여 학생들 간의 경쟁적 학습을 촉진한다.","AI가 교사의 역할을 대신하므로 교사는 학습에 개입하지 않는다.","AI를 통해 학생들의 의견을 하나로 통일시킨다.","AI를 활용하여 학생들 간의 협력적 학습을 촉진하고, 문제해결능력을 향상한다.","AI가 정해 준 주제만 탐구하도록 하여 학습 효율을 높인다."],"answer":4,"explain":"교안: AI를 활용하여 학생들 간의 협력적 학습을 촉진하고 문제해결능력 향상. ① '경쟁적'이 아니라 협력적 ② 교사는 학생들의 학습을 돕고 창의성과 자기주도적 학습을 장려 ③ 다양한 의견을 수용하고 표현·토론·소통 능력 함양 ⑤ 자신의 관심사를 탐구할 수 있도록 도움.","source":{"page":17,"section":"02. AI를 영재교육에 활용하기 - 교실환경 개선","quote":"AI를 활용하여 학생들 간의 협력적 학습을 촉진하고, 문제해결능력을 향상함 ‣ 교사는 학생들의 학습을 돕고, 창의성과 자기주도적인 학습을 장려할 수 있음"}},{"id":"13-20","type":"옳지 않은 것","q":"AI를 활용해서 발생할 수 있는 영재교육의 문제점으로 옳지 않은 것은?","box":null,"choices":["AI에 과도하게 의존하면 영재들의 자기주도적인 사고능력과 창의성이 더욱 강화된다.","AI는 빅데이터로부터 충분한 가이드 없이 예측을 하기 때문에 불필요한 정보를 생성할 우려가 있다.","불필요한 정보는 영재들의 학습에 방해가 될 수 있다.","AI에는 빅데이터에서 내재된 편향이 반영될 가능성이 있다.","공정하지 않은 정보나 편집적인 의견이 생성될 수 있다."],"answer":1,"explain":"교안: AI에 과도하게 의존하는 경우 영재들은 자기주도적인 사고능력, 창의성과 독립적인 아이디어 발전이 '억제'될 수 있음 → ① 반대 서술. ②~⑤는 교안 그대로.","source":{"page":18,"section":"02. AI를 영재교육에 활용하기 - 발생할 수 있는 문제점","quote":"AI에 과도하게 의존하는 경우, 영재들은 자기주도적인 사고능력, 창의성과 독립적인 아이디어 발전이 억제될 수 있음"}},{"id":"13-21","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"AI는 빅데이터로부터 충분한 가이드 없이 예측을 하기 때문에 (   ) 정보를 생성할 우려가 있으며, 영재들의 학습에 방해가 될 수 있음","choices":["정확한","불필요한","최신의","검증된","공식적인"],"answer":2,"explain":"교안: '불필요한 정보를 생성할 우려가 있으며, 영재들의 학습에 방해가 될 수 있음'. 나머지는 학습 방해 요인과 맞지 않고 교안 표현도 아님.","source":{"page":18,"section":"02. AI를 영재교육에 활용하기 - 발생할 수 있는 문제점","quote":"AI는 빅데이터로부터 충분한 가이드 없이 예측을 하기 때문에 불필요한 정보를 생성할 우려가 있으며, 영재들의 학습에 방해가 될 수 있음"}}]},{"lesson":14,"title":"영재를 이해하기 위한 지능이론","file":"4. 교안 (1~30)/14.pdf","summary":["영재의 심리적 특성을 잘 파악해 일반 학생에게도 육성시킬 수 있는 특성으로 적용 → 일반 학생들의 잠재력 향상에도 기여","지능 연구는 심리학 연구 중 가장 오랜 역사 / 1904년 프랑스 정부의 요구로 비네-시몽(Binet-Simon) 지능검사 최초 개발(정규학교 교육과정과 특수교육이 필요한 학생 구분 목적)","지능 = 학습능력, 추상적으로 사고하는 능력, 새로운 환경 적응능력 / 웩슬러(Wechsler): \"합목적적으로 행동하고, 합리적으로 사고하며, 환경을 효과적으로 처리하는 종합적인 능력\"","현대적 지능이론: 하워드 가드너(Howard Gardner) 다중지능이론, 로버트 스턴버그(Robert J. Sternberg) 성공지능이론","가드너: 영역-일반성 지능이론에 문제 제기, 언어지능·논리·수학 지능만 중시하는 학교교육 비판 / 8가지 지능: 언어, 논리·수학, 시각·공간, 운동, 음악, 대인관계, 개인내적, 자연탐구","스턴버그: IQ 점수와 학교 성적으로 인간 능력 설명 부족 / 분석적 지능(분석·평가·비판), 창의적 지능(새롭고 흥미로운 아이디어 창안), 실천적 지능(경험으로 습득된 지식을 인생의 성공에 활용) / 미래사회는 창의적 지능이 탁월한 사람의 시대","미국은 1868년부터 영재교육 시작, 능력별 수준학습 최초 실시","루이스 터만 종단연구: 스탠포드-비네 지능검사 상위 1%, IQ 135 이상 / 홀링워스: 영재 아동 = \"일반지능에 대한 상위 1%의 아동\"","렌줄리(Joseph Renzulli) 세 고리(three-ring) 모형: 지적능력, 과제집착력, 창의성","위티(Witty): 많은 어휘·언어발달, 말대답 빨리 독창적, 관찰력·기억력, 시간과 날짜에 일찍 관심, 인과관계, 그림·노래 재능, 독서 흥미","이정규(2005): 인문사회·자연과학·예술 3개 영역 성인영재 IQ 평균 135.8, 영역 간 통계적으로 유의미한 차이 → 지능검사가 주로 언어·수리·논리·지식 측정하기 때문","정리: 모든 영역 영재의 지능지수가 다 높은 것은 아님, 평균보다 낮아도 노력과 열정으로 성공한 영재도 많음"],"questions":[{"id":"14-01","type":"옳은 것","q":"영재의 심리적 특성에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["영재의 심리적 특성은 일반 학생에게는 전혀 적용할 수 없다.","영재교육은 심리적 특성과 무관하게 교과 지식 위주로 이루어져야 한다.","영재의 심리적 특성을 잘 파악하여 일반 학생에게도 육성시킬 수 있는 특성으로 적용한다면, 일반 학생들의 잠재력 향상에도 기여한다.","영재의 심리적 특성을 파악하면 일반 학생과 분리 교육해야 함을 알 수 있다.","영재의 심리적 특성은 지능검사 점수만으로 완전히 파악된다."],"answer":3,"explain":"교안: 영재의 심리적 특성을 잘 파악하여 일반 학생에게도 육성시킬 수 있는 특성으로 적용하면 일반 학생들의 잠재력 향상에도 기여. ①④ 교안과 반대 ② 교안은 심리적 특성과 교육적 요구에 적합한 영재교육을 강조 ⑤ 교안에 없는 내용.","source":{"page":3,"section":"01. 지능의 주요이론 - 영재의 심리적 특성","quote":"영재의 심리적 특성을 잘 파악하여 영재의 특성을 일반 학생에게도 육성시킬 수 있는 특성으로 적용한다면, 일반 학생들의 잠재력 향상에도 기여"}},{"id":"14-02","type":"빈칸","q":"다음 (   )에 들어갈 연도로 알맞은 것은?","box":"(   )년 정규학교 교육과정과 특수교육이 필요한 학생을 구분하기 위해 프랑스 정부의 요구로 비네-시몽(Binet-Simon) 지능검사가 최초로 개발됨","choices":["1868","1904","1950","1956","2005"],"answer":2,"explain":"교안: 1904년 비네-시몽 지능검사 최초 개발. ① 1868년은 미국이 영재교육을 시작한 해 ③④는 교안 해당 내용에 없는 연도 ⑤ 2005는 이정규의 연구 연도.","source":{"page":4,"section":"01. 지능의 주요이론 - 인간의 지능","quote":"1904년 정규학교 교육과정과 특수교육이 필요한 학생을 구분하기 위해 프랑스 정부의 요구로 비네-시몽(Binet-Simon) 지능검사가 최초로 개발됨"}},{"id":"14-03","type":"옳은 것","q":"인간의 지능 연구와 비네-시몽(Binet-Simon) 지능검사에 대한 설명으로 옳은 것은?","box":null,"choices":["지능에 대한 연구는 심리학 연구 중 가장 짧은 역사를 지닌다.","미국 정부의 요구로 개발되었다.","영재를 선발하기 위한 목적으로 최초 개발되었다.","웩슬러(Wechsler)가 최초로 개발하였다.","정규학교 교육과정과 특수교육이 필요한 학생을 구분하기 위해 프랑스 정부의 요구로 개발되었다."],"answer":5,"explain":"교안: 프랑스 정부의 요구로 정규학교 교육과정과 특수교육이 필요한 학생을 구분하기 위해 개발. ① 지능 연구는 '가장 오랜 역사'를 지님 ② 미국이 아니라 프랑스 ③ 영재 선발이 아닌 특수교육 필요 학생 구분 목적 ④ 웩슬러는 지능의 정의를 제시한 학자.","source":{"page":4,"section":"01. 지능의 주요이론 - 인간의 지능","quote":"인간을 심리와 행동을 연구하는 심리학 연구에서 지능에 대한 연구는 심리학 연구 중 가장 오랜 역사를 지님"}},{"id":"14-04","type":"개념 찾기","q":"지능을 다음과 같이 정의한 학자는?","box":"\"합목적적으로 행동하고, 합리적으로 사고하며, 환경을 효과적으로 처리하는 종합적인 능력\"","choices":["비네(Binet)","하워드 가드너(Howard Gardner)","로버트 스턴버그(Robert J. Sternberg)","웩슬러(Wechsler)","루이스 터만"],"answer":4,"explain":"교안에 제시된 웩슬러(Wechsler)의 지능 정의. ① 비네는 비네-시몽 지능검사 ② 가드너는 다중지능이론 ③ 스턴버그는 성공지능이론 ⑤ 터만은 스탠포드-비네 지능검사 상위 1% 대상 종단연구.","source":{"page":5,"section":"01. 지능의 주요이론 - 인간의 지능","quote":"웩슬러(Wechsler)의 정의 / \"합목적적으로 행동하고, 합리적으로 사고하며, 환경을 효과적으로 처리하는 종합적인 능력\""}},{"id":"14-05","type":"옳지 않은 것","q":"교안에서 제시한 지능의 의미(구성)에 해당하지 않는 것은?","box":null,"choices":["타인의 감정에 공감하는 능력","학습능력(지식을 습득할 수 있는 능력)","추상적으로 사고하는 능력(추상적으로 생각하고 추론할 수 있는 능력)","새로운 환경 적응능력(새로운 문제를 해결할 수 있는 능력)","지식을 습득할 수 있는 능력"],"answer":1,"explain":"교안은 지능을 학습능력, 추상적으로 사고하는 능력, 새로운 환경 적응능력(지식 습득, 추상적 사고·추론, 새로운 문제 해결 능력)으로 제시함. ① '타인의 감정에 공감하는 능력'은 교안 지능 의미에 없음.","source":{"page":5,"section":"01. 지능의 주요이론 - 인간의 지능","quote":"학습능력 추상적으로 사고하는 능력 새로운 환경 적응능력 / 지식을 습득할 수 있는 능력 추상적으로 생각하고 추론할 수 있는 능력 새로운 문제를 해결할 수 있는 능력"}},{"id":"14-06","type":"옳은 것","q":"현대적 개념의 지능이론에서 학자와 이론을 바르게 연결한 것은?","box":null,"choices":["하워드 가드너(Howard Gardner) - 성공지능이론","로버트 스턴버그(Robert J. Sternberg) - 다중지능이론","조셉 렌줄리(Joseph Renzulli) - 다중지능이론","하워드 가드너(Howard Gardner) - 다중지능이론","웩슬러(Wechsler) - 성공지능이론"],"answer":4,"explain":"교안: 미국 심리학자 하워드 가드너 = 다중지능이론, 로버트 스턴버그 = 성공지능이론. ①② 서로 바뀜 ③ 렌줄리는 세 고리 모형 ⑤ 웩슬러는 지능의 정의.","source":{"page":6,"section":"01. 지능의 주요이론 - 현대적 개념의 지능이론","quote":"미국의 심리학자 하워드 가드너(Howard Gardner)의 \"다중지능이론\" ‣ 미국의 심리학자 로버트 스턴버그(Robert J. Sternberg)의 \"성공지능이론\""}},{"id":"14-07","type":"옳지 않은 것","q":"하워드 가드너의 다중지능이론에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["인간은 모두 똑같은 능력을 지니고 태어나지 않았다고 본다.","지능이 높은 사람이 모든 영역에서 우수하다는 영역-일반성의 지능이론을 지지한다.","과거의 지능이론보다 인간의 지능을 더욱 확장하였다.","\"언어지능\"과 \"논리·수학 지능\"만을 중시하는 학교교육은 다른 지능의 중요성을 상대적으로 경시한다고 본다.","전통적으로 중시되는 학업지능에서 실패한 많은 학생들은 낮은 자기존중감으로 장점을 살리지 못한 채 실패할 수 있다고 본다."],"answer":2,"explain":"가드너는 '지능이 높은 사람이 모든 영역에서 우수할 것'이라는 영역-일반성의 지능이론에 '문제 제기'함 → ② 반대 서술. 나머지는 교안 그대로.","source":{"page":7,"section":"01. 지능의 주요이론 - 하워드 가드너의 다중지능이론","quote":"인간은 모두 똑같은 능력을 지니고 태어나지 않았으며, 지능이 높은 사람이 모든 영역에서 우수할 것이라는 영역-일반성의 지능이론에 문제제기"}},{"id":"14-08","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"기존의 \"(   )\"과 \"논리·수학 지능\"만을 중시하는 학교교육은 다른 지능의 중요성을 상대적으로 경시","choices":["음악지능","운동지능","언어지능","대인관계지능","자연탐구지능"],"answer":3,"explain":"교안: 기존의 \"언어지능\"과 \"논리·수학 지능\"만을 중시하는 학교교육 비판. 나머지는 학교교육에서 상대적으로 경시된 다른 지능들.","source":{"page":7,"section":"01. 지능의 주요이론 - 하워드 가드너의 다중지능이론","quote":"기존의 \"언어지능\"과 \"논리·수학 지능\"만을 중시하는 학교교육은 다른 지능의 중요성을 상대적으로 경시"}},{"id":"14-09","type":"옳지 않은 것","q":"가드너의 다중지능이론에서 제시한 8가지 지능에 해당하지 않는 것은?","box":null,"choices":["시각·공간지능","자연탐구지능","개인내적지능","창의적 지능","대인관계지능"],"answer":4,"explain":"8가지 지능: 언어지능, 논리·수학지능, 시각·공간지능, 운동지능, 음악지능, 대인관계지능, 개인내적지능, 자연탐구지능. ④ 창의적 지능은 스턴버그 성공지능이론의 하위 지능.","source":{"page":8,"section":"01. 지능의 주요이론 - 하워드 가드너의 다중지능이론","quote":"언어지능 논리·수학지능 시각·공간지능 운동지능 음악지능 대인관계지능 개인내적지능 자연탐구지능"}},{"id":"14-10","type":"빈칸","q":"다음 (   )에 들어갈 숫자로 알맞은 것은?","box":"대다수의 사람들은 (   )가지 다양한 지능들을 소유하고 있으며, 매우 개인적인 방식으로 조합하여 지능들을 사용함","choices":["3","5","6","7","8"],"answer":5,"explain":"교안(가드너): 대다수의 사람들은 8가지 다양한 지능을 소유하고 개인적인 방식으로 조합하여 사용. ① 3은 스턴버그 성공지능(분석적·창의적·실천적)과 혼동 유도 ③ 6은 해당 없음.","source":{"page":8,"section":"01. 지능의 주요이론 - 하워드 가드너의 다중지능이론","quote":"대다수의 사람들은 8가지 다양한 지능들을 소유하고 있으며, 매우 개인적인 방식으로 조합하여 지능들을 사용함"}},{"id":"14-11","type":"옳은 것","q":"로버트 스턴버그의 성공지능이론에 대한 설명으로 옳은 것은?","box":null,"choices":["IQ 점수와 학교 성적 등으로 인간의 능력을 설명하기는 부족하다고 하였다.","IQ 점수가 인간의 능력을 설명하는 가장 정확한 지표라고 하였다.","인간의 지능을 8가지로 구분하였다.","지능을 지적능력, 과제집착력, 창의성의 세 고리로 설명하였다.","학교 성적이 성공적인 삶을 결정한다고 보았다."],"answer":1,"explain":"교안: 스턴버그는 IQ 점수와 학교 성적 등으로 인간의 능력을 설명하기는 부족하다고 하며, 성공적인 삶의 방향으로 나아가기 위해 갖추어야 할 지능이 더 중요하다고 함. ②⑤ 반대 ③ 8가지 지능은 가드너 ④ 세 고리 모형은 렌줄리.","source":{"page":9,"section":"01. 지능의 주요이론 - 로버트 스턴버그의 성공지능이론","quote":"스턴버그는 IQ 점수와 학교 성적 등으로 인간의 능력을 설명하기는 부족하다고 함 성공적인 삶의 방향으로 나아가기 위해 갖추어야 할 지능이 더 중요함"}},{"id":"14-12","type":"개념 찾기","q":"스턴버그의 성공지능이론에서 다음 설명에 해당하는 지능은?","box":"· 실제 생활에서 경험으로 습득될 수 있는 지식을 인생의 성공을 위하여 활용하는 능력\n· 외부 상황과 관련해서 환경에 적응하고 변화하며 선택\n· 이 능력에 뛰어난 재능을 보이는 학생은 활용, 적용, 실천하는 데 강점","choices":["분석적 지능","창의적 지능","실천적 지능","개인내적지능","논리·수학지능"],"answer":3,"explain":"교안의 '실천적 지능' 설명. ① 분석적 지능은 분석, 평가, 비판에 강점 ② 창의적 지능은 새롭고 흥미로운 아이디어를 창안해내는 능력 ④⑤는 가드너 다중지능.","source":{"page":10,"section":"01. 지능의 주요이론 - 로버트 스턴버그의 성공지능이론","quote":"실천적 지능 ‣ 실제 생활에서 경험으로 습득될 수 있는 지식을 인생의 성공을 위하여 활용하는 능력 ‣ 외부 상황과 관련해서 환경에 적응하고 변화하며 선택 ‣ 실용 능력에 뛰어난 재능을 보이는 학생은 활용, 적용, 실천하는 데 강점"}},{"id":"14-13","type":"사례","q":"다음 사례의 학생이 스턴버그의 성공지능이론에서 강점을 보이는 지능은?","box":"학생 A는 주어진 주장을 꼼꼼히 분석하고, 그 타당성을 평가하며, 논리적 허점을 비판하는 데 뛰어나다.","choices":["창의적 지능","분석적 지능","실천적 지능","대인관계지능","개인내적지능"],"answer":2,"explain":"교안: 분석력이 뛰어난 학생은 분석, 평가, 비판에 강점 = 분석적 지능. ① 창의적 지능은 새롭고 흥미로운 아이디어 창안 ③ 실천적 지능은 활용, 적용, 실천에 강점 ④⑤는 가드너의 다중지능.","source":{"page":10,"section":"01. 지능의 주요이론 - 로버트 스턴버그의 성공지능이론","quote":"분석적 지능 ‣ 분석력이 뛰어난 학생은 분석, 평가, 비판에 강점 / 창의적 지능 / ‣ 새롭고 흥미로운 아이디어를 창안해내는 능력"}},{"id":"14-14","type":"빈칸","q":"다음은 로버트 스턴버그의 말이다. (   )에 들어갈 말로 알맞은 것은?","box":"\"지금까지 사회를 주도하는 사람이 분석적 지능이 우수한 사람이었다고 한다면, 미래사회는 (   ) 지능이 탁월한 사람의 시대가 될 것!\"","choices":["분석적","실천적","정서적","논리·수학","창의적"],"answer":5,"explain":"교안: 미래사회는 '창의적 지능'이 탁월한 사람의 시대. ① 분석적 지능은 지금까지 사회를 주도한 사람의 지능 ② 실천적 지능은 성공지능의 다른 하위 지능 ③④는 해당 문장과 무관.","source":{"page":11,"section":"01. 지능의 주요이론 - 로버트 스턴버그의 성공지능이론","quote":"\"지금까지 사회를 주도하는 사람이 분석적 지능이 우수한 사람이었다고 한다면, 미래사회는 창의적 지능이 탁월한 사람의 시대가 될 것!\""}},{"id":"14-15","type":"옳은 것","q":"영재의 지능 연구에 대한 설명으로 옳은 것은?","box":null,"choices":["미국은 1904년부터 영재교육을 시작하였다.","루이스 터만은 스탠포드-비네 지능검사의 상위 1%에 해당되는 IQ 135 이상 학생을 대상으로 종단연구를 하였다.","루이스 터만은 \"창의성이 높은 사람\"을 영재로 정의하였다.","홀링워스는 영재 아동을 \"일반지능에 대한 상위 5%의 아동\"으로 정의하였다.","루이스 터만은 IQ 145 이상 학생만을 대상으로 횡단연구를 하였다."],"answer":2,"explain":"교안: 터만의 종단연구는 스탠포드-비네 지능검사 상위 1%, IQ 135 이상 학생 대상, \"지능이 높은 사람\"을 영재로 정의. ① 1904년 → 교안은 1868년(1904년은 비네-시몽 검사 개발) ③ 창의성이 아닌 '지능이 높은 사람' ④ 5% → 교안은 상위 1% ⑤ IQ 135 이상, 종단연구.","source":{"page":13,"section":"02. 영재의 지능 - 영재의 지능 연구","quote":"미국 심리학자 루이스 터만의 종단연구 / • 스탠포드-비네 지능검사의 상위 1%에 해당되는 IQ 135 이상 학생을 대상으로 연구하였으며, \"지능이 높은 사람\"을 영재로 정의"}},{"id":"14-16","type":"빈칸","q":"다음 (   )에 들어갈 연도로 알맞은 것은?","box":"미국은 (   )년부터 영재교육을 시작하면서, 높은 지능지수의 학생에게 적합한 능력별 수준학습을 최초로 실시","choices":["1868","1904","1950","1957","2005"],"answer":1,"explain":"교안: 미국은 1868년부터 영재교육 시작, 능력별 수준학습 최초 실시. ② 1904년은 비네-시몽 지능검사 개발 ⑤ 2005는 이정규 연구 ③④는 교안 해당 내용 없음.","source":{"page":13,"section":"02. 영재의 지능 - 영재의 지능 연구","quote":"미국은 1868년부터 영재교육을 시작하면서, 높은 지능지수의 학생에게 적합한 능력별 수준학습을 최초로 실시"}},{"id":"14-17","type":"개념 찾기","q":"영재 아동을 \"일반지능에 대한 상위 1%의 아동\"으로 정의한 미국의 심리학자는?","box":null,"choices":["루이스 터만","조셉 렌줄리(Joseph Renzulli)","위티(Witty)","레타 스테터 홀링워스","하워드 가드너(Howard Gardner)"],"answer":4,"explain":"교안: 미국의 심리학자 레타 스테터 홀링워스는 영재 아동을 \"일반지능에 대한 상위 1%의 아동\"으로 정의. ① 터만은 \"지능이 높은 사람\"을 영재로 정의 ② 렌줄리는 세 고리 모형 ③ 위티는 성인영재 추적 연구 ⑤ 가드너는 다중지능이론.","source":{"page":13,"section":"02. 영재의 지능 - 영재의 지능 연구","quote":"미국의 심리학자 레타 스테터 홀링워스 / • 영재 아동을 \"일반지능에 대한 상위 1%의 아동\"으로 정의"}},{"id":"14-18","type":"보기 조합","q":"렌줄리(Renzulli)의 세 고리(three-ring) 모형의 구성 요소를 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 지적능력\nㄴ. 과제집착력\nㄷ. 창의성\nㄹ. 실천적 지능","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"explain":"교안: 조셉 렌줄리는 사회적으로 성공한 영재들이 지닌 특성을 '세 고리 모형'(지적능력, 과제집착력, 창의성)으로 제시. ㄹ 실천적 지능은 스턴버그 성공지능이론의 하위 지능.","source":{"page":14,"section":"02. 영재의 지능 - 렌줄리(Renzulli)의 세 고리 모형","quote":"미국의 교육심리학자 조셉 렌줄리(Joseph Renzulli)는 사회적으로 성공한 영재들이 지닌 특성을 '세 고리(three-ring) 모형'으로 제시 / 지적능력 / 과제집착력 창의성"}},{"id":"14-19","type":"옳지 않은 것","q":"렌줄리의 세 고리 모형에서 '보통 이상의 지적능력'에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["어려운 내용을 빨리 쉽게 배움","수준 높은 책을 즐겨 보고 많이 읽음","어려운 내용은 천천히 반복해야만 이해함","수준 높은 개념을 쉽게 이해하고 문제해결에 쉽게 활용함","이해가 빠르고 기억을 잘하며 아는 것이 많음"],"answer":3,"explain":"교안: 보통 이상의 지적능력 = 어려운 내용을 빨리 쉽게 배움 → ③ 반대 서술. ①②④⑤는 교안 그대로.","source":{"page":15,"section":"02. 영재의 지능 - 렌줄리(Renzulli)의 세 고리 모형(보통 이상의 지적능력이란)","quote":"어려운 내용을 빨리 쉽게 배움 ‣ 수준 높은 책을 즐겨보고 많이 읽음 ‣ 수준 높은 개념을 쉽게 이해하고 문제해결에 쉽게 활용함 ‣ 이해가 빠르고 기억을 잘하며 아는 것이 많음 등"}},{"id":"14-20","type":"옳지 않은 것","q":"미국에서 영재성을 발휘한 성인영재를 추적한 위티(Witty)가 제시한 영재의 지능 특성으로 옳지 않은 것은?","box":null,"choices":["어릴 때부터 많은 어휘를 사용하고 언어 발달이 잘 되어 있음","말대답을 빨리 독창적으로 함","날카로운 관찰력과 사물에 대한 기억력이 뛰어남","어릴 때부터 사물과 현상의 인과관계를 잘 밝힘","시간과 날짜에 대한 관심이 또래보다 늦게 나타남"],"answer":5,"explain":"교안(위티): 시간과 날짜에 대한 관심을 '일찍' 나타냄 → ⑤ 반대 서술. 그 밖에 그림과 노래 등 활동에 재능, 책을 무척 좋아해 독서에 일찍부터 흥미.","source":{"page":16,"section":"02. 영재의 지능 - 위티(Witty)의 영재의 지능","quote":"시간과 날짜에 대한 관심을 일찍 나타남 ‣ 어릴 때부터 사물과 현상의 인과관계를 잘 밝힘"}},{"id":"14-21","type":"옳은 것","q":"영재의 인지적 특성에 관한 이정규(2005)의 연구에 대한 설명으로 옳은 것은?","box":null,"choices":["우리나라 영재들의 IQ 평균은 145.8이었다.","3개 영역 간의 IQ 평균치는 통계적으로 유의미한 차이가 없었다.","인문사회, 자연과학, 예술의 3개 영역 성인영재를 대상으로 초~고등학교 학교생활기록부에 기록된 지능지수에 기초하여 연구하였다.","기존 지능검사가 주로 창의성과 예술성을 측정하기 때문에 영역 간 차이가 나타났다.","초등학생 영재만을 대상으로 지능검사를 새로 실시하였다."],"answer":3,"explain":"교안 그대로 ③. ① IQ 평균 135.8 ② 통계적으로 유의미한 차이가 '나타남' ④ 지능검사가 주로 언어, 수리, 논리, 지식 등을 측정하기 때문 ⑤ 성인영재 대상, 학교생활기록부에 기록된 지능지수 기초.","source":{"page":17,"section":"02. 영재의 지능 - 영재의 인지적 특성 연구","quote":"우리나라 인문사회, 자연과학, 예술의 3개 영역의 성인영재를 대상으로 초~고등학교 학교생활기록부에 기록된 지능지수에 기초하여 영재의 인지적 특성을 연구(이정규, 2005)"}},{"id":"14-22","type":"빈칸","q":"이정규(2005)의 연구에서 우리나라 영재들의 IQ 평균으로 알맞은 것은?","box":"우리나라 영재들의 IQ의 평균은 (   )이었음","choices":["135.8","130.5","135.0","140.2","145.8"],"answer":1,"explain":"교안: 우리나라 영재들의 IQ 평균은 135.8. ③ 135는 터만 연구 대상(IQ 135 이상) 기준과 혼동 유도 ②④⑤는 교안에 없는 수치.","source":{"page":17,"section":"02. 영재의 지능 - 영재의 인지적 특성 연구","quote":"우리나라 영재들의 IQ의 평균은 135.8이었음 ‣ 3개 영역 간의 IQ 평균치는 통계적으로 유의미한 차이가 나타남 ‣ 이는 그동안 개발된 지능검사가 주로 언어, 수리, 논리, 지식 등을 주로 측정하기 때문임"}},{"id":"14-23","type":"옳지 않은 것","q":"영재의 지능에 대한 교안의 정리 내용으로 옳지 않은 것은?","box":null,"choices":["일반적으로 영재들은 보통 이상의 지적능력을 소유하고 있다.","영역별 또는 개인별로 지능지수에 차이가 나타날 수 있다.","지능지수가 평균보다 낮을지라도 노력과 열정으로 자기 영역에서 성공한 영재도 많다.","모든 영역의 영재들은 지능지수가 다 높다.","자신의 지능의 한계를 충분히 극복하여 성공한 영재도 많다."],"answer":4,"explain":"교안: '모든 영역의 영재들의 지능지수가 다 높은 것은 아니다' → ④ 반대 서술. 나머지는 교안 그대로.","source":{"page":18,"section":"02. 영재의 지능 - 정리","quote":"일반적으로 영재들은 보통 이상의 지적능력을 소유하고 있다. 그러나 모든 영역의 영재들의 지능지수가 다 높은 것은 아니다. 영역별 또는 개인별로 차이가 나타날 수 있으며, 오히려 지능지수가 평균보다 낮을지라도 노력과 열정으로 자신의 지능의 한계를 충분히 극복하여 자기 영역에서 성공한 영재도 많다."}}]},{"lesson":15,"title":"인지적 능력이 탁월한 영재에게 나타나는 특성은?","file":"4. 교안 (1~30)/15.pdf","summary":["상위인지(meta-cognition) = 학습자의 인지를 잘 통제하고 모니터링하여 더욱 효율적이고 융통성 있는 학습자가 되게 하는 능력","시험 앞두고 \"자신 있는 과목과 부족한 과목을 구분하여 시간과 공간 활용을 어떻게 해야지\" 계획 = 상위인지 활용","전통적 학습 = 암기와 표면적 이해 / 메타인지 학습 = 목표 설정, 자기 모니터링, 자기통제 강화","로저스(Rogers): 영재와 상위인지 관련 20개 연구 분석 → 과제 신속 인지, 적절한 전략 선택, 자원 할당에 능숙","데이비드슨과 스턴버그(Davidson \u0026 Sternberg): 계획 단계에 시간 많이 투자, 새 전략 쉽게 학습·전이, 자기보고 능력 뛰어남","베니토(Benito): 심층면접과 관찰을 통한 질적 연구 / 계획 단계 시간 투자, 신속한 정보처리(정보처리의 자동화), 자발적 전략 사용, 연역적·귀납적 추리, 전략을 말로 표현","언어가 인지발달을 촉진하거나 매개 / 영재의 급속한 언어발달은 개념과 지식기반의 확장과 관련 / 또래보다 더 긴 문장, 명확·논리적 사고","긍·부정적 행동특성 5가지: 높은 지적호기심, 발달된 언어능력, 높은 창의성, 높은 사고능력, 높은 주의집중력","지적호기심 부정: 지시 거부, 인내심 부족, 정규 학교생활 지루 / 언어능력 부정: 나이에 맞지 않는 언어, 잘난 체·논쟁, 장황한 핑계","창의성 부정: 복잡한 규칙 설정으로 친구들이 기피, 반복학습 기피, 동조하지 않음 / 사고능력 부정: 단순 연습 기피, 세부적인 것 놓침, 지나치게 복잡하게 생각","주의집중력 긍정: 흥미영역 지속, 선택적 주의집중, 목표 지향 / 부정: 하던 일을 멈추지 못함, 타인 관심 부족, 제안된 시간 넘김"],"questions":[{"id":"15-01","type":"사례","q":"다음 사례의 학생이 잘 활용하고 있는 것은?","box":"시험을 앞둔 학생 B는 \"자신 있는 과목과 부족한 과목을 구분하여 시간과 공간 활용을 어떻게 해야지\"라고 계획을 세웠다.","choices":["지식의 양","상위인지(meta-cognition)","정보처리의 자동화","과제집착력","선택적 주의집중"],"answer":2,"explain":"교안: 시험을 앞두고 자신 있는 과목과 부족한 과목을 구분하여 시간과 공간 활용을 계획하는 것은 자신의 상위인지를 잘 활용하는 것. ① 지식의 양은 얼마나 많이 학습했는가의 문제 ③ 베니토가 말한 신속한 정보처리 ④ 렌줄리 세 고리 요소 ⑤ 높은 주의집중력의 긍정적 특성.","source":{"page":3,"section":"01. 인지적 능력이 탁월한 영재 - 영재의 상위인지(meta-cognition)","quote":"시험을 앞두고 \"자신 있는 과목과 부족한 과목을 구분하여 시간과 공간 활용을 어떻게 해야지\"라고 계획하는 것은 자신의 상위인지를 잘 활용하는 것"}},{"id":"15-02","type":"빈칸","q":"다음은 상위인지의 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"학습자의 인지를 잘 (   )하고 모니터링하여 더욱 효율적이고 융통성 있는 학습자가 되게 하는 능력","choices":["암기","확장","평가","통제","표현"],"answer":4,"explain":"교안: 상위인지란 학습자의 인지를 잘 '통제'하고 모니터링하여 더욱 효율적이고 융통성 있는 학습자가 되게 하는 능력. 나머지는 정의에 없는 용어(암기는 전통적 학습의 초점).","source":{"page":4,"section":"01. 인지적 능력이 탁월한 영재 - 영재의 상위인지(meta-cognition)","quote":"학습자의 인지를 잘 통제하고 모니터링하여 더욱 효율적이고 융통성 있는 학습자가 되게 하는 능력"}},{"id":"15-03","type":"옳은 것","q":"상위인지와 메타인지 학습에 대한 설명으로 옳은 것은?","box":null,"choices":["메타인지 학습은 목표를 설정하고 자기 모니터링하며, 자기통제를 강화하는 학습법이다.","메타인지 학습은 암기와 표면적인 이해에 초점이 있다.","전통적인 학습은 목표 설정과 자기 모니터링을 강조한다.","학습전략과 능력에 대한 지식이 많은 영재일수록 새로운 지식과 기법을 터득하는 속도가 느리다.","상위인지는 정신적 활동과는 무관하게 학습 증진 전략만을 관찰한다."],"answer":1,"explain":"교안 그대로 ①. ②③ 서로 바뀜: 전통적 학습 = 암기와 표면적 이해, 메타인지 학습 = 목표 설정·자기 모니터링·자기통제 ④ 지식이 많은 영재일수록 보다 쉽고 빠르게 터득 ⑤ 상위인지는 학습증진 전략과 정신적 활동 전반을 관찰·통제.","source":{"page":5,"section":"01. 인지적 능력이 탁월한 영재 - 영재의 상위인지(meta-cognition)","quote":"전통적인 학습에서는 암기와 표면적인 이해에 초점이 있는 반면, 메타인지 학습은 목표를 설정하고 자기모니터링하며, 자기통제를 강화하는 학습법"}},{"id":"15-04","type":"개념 찾기","q":"다음 연구를 한 학자는?","box":"영재와 상위인지에 관한 20개의 연구를 분석함\n· 영재들은 상위인지에 있어서 해결해야 할 과제를 신속하게 인지함\n· 문제 해결을 위한 적절한 전략을 선택함\n· 문제를 해결하는 데 필요한 자원을 할당하는 데 보다 능숙함","choices":["베니토(Benito)","데이비드슨과 스턴버그(Davidson \u0026 Sternberg)","로저스(Rogers)","렌줄리(Renzulli)","위티(Witty)"],"answer":3,"explain":"교안: 영재와 상위인지에 관한 20개의 연구를 분석한 로저스(Rogers)의 연구. ① 베니토는 심층면접·관찰 질적 연구 ② 데이비드슨과 스턴버그는 계획 단계 시간 투자·전략 전이·자기보고 능력 ④⑤는 이 차시 상위인지 연구자가 아님.","source":{"page":6,"section":"01. 인지적 능력이 탁월한 영재 - 영재의 상위인지(meta-cognition)","quote":"영재와 상위인지에 관한 20개의 연구를 분석한 로저스(Rogers)의 연구 / ‣ 영재들은 상위인지에 있어서 해결해야 할 과제를 신속하게 인지함 ‣ 문제 해결을 위한 적절한 전략을 선택함 ‣ 문제를 해결하는 데 필요한 자원을 할당하는 데 보다 능숙함"}},{"id":"15-05","type":"빈칸","q":"다음 (   )에 들어갈 숫자로 알맞은 것은?","box":"영재와 상위인지에 관한 (   )개의 연구를 분석한 로저스(Rogers)의 연구","choices":["10","12","15","20","30"],"answer":4,"explain":"교안: 로저스는 영재와 상위인지에 관한 20개의 연구를 분석함. 나머지 숫자는 교안에 없음.","source":{"page":6,"section":"01. 인지적 능력이 탁월한 영재 - 영재의 상위인지(meta-cognition)","quote":"영재와 상위인지에 관한 20개의 연구를 분석한 로저스(Rogers)의 연구"}},{"id":"15-06","type":"옳은 것","q":"데이비드슨과 스턴버그(Davidson \u0026 Sternberg)가 제시한 영재의 상위인지 특성으로 옳은 것은?","box":null,"choices":["영재들은 문제를 해결할 때 계획 단계에 시간을 적게 투자한다.","새로운 전략을 학습하는 데 오래 걸리며 다른 장면에 전이시키기 어려워한다.","자신이 사용한 전략에 대한 자기보고 능력이 부족하다.","영재와 상위인지에 관한 20개의 연구를 분석하였다.","자신이 사용한 전략에 대한 자기보고 능력이 뛰어나다."],"answer":5,"explain":"교안(데이비드슨과 스턴버그): 계획 단계에 시간을 많이 투자, 새로운 전략을 쉽게 학습하고 다른 장면에도 쉽게 전이, 자기보고 능력이 뛰어남. ①②③ 반대 서술 ④ 20개 연구 분석은 로저스.","source":{"page":7,"section":"01. 인지적 능력이 탁월한 영재 - 영재의 상위인지(meta-cognition)","quote":"영재들은 문제를 해결할 때 계획 단계에 시간을 많이 투자함 ‣ 새로운 전략을 쉽게 학습하고 다른 장면에도 쉽게 전이시킴 ‣ 자신이 사용한 전략에 대한 자기보고 능력이 뛰어나다고 함"}},{"id":"15-07","type":"옳지 않은 것","q":"베니토(Benito)가 제시한 영재의 상위인지 기술과 전략에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재는 문제를 해결할 때 계획 단계에서 시간을 많이 투자한다.","누가 가르쳐 주어야만 효과적인 전략을 사용하는 경향이 있다.","연역적 추리와 귀납적 추리를 포함하는 다양한 문제해결 전략을 사용한다.","정보를 처리할 때 신속하게 처리한다.","사용한 전략을 말로 표현하는 데에도 능숙함을 보인다."],"answer":2,"explain":"교안(베니토): 누가 가르치지 않아도 '자발적으로' 효과적인 전략을 사용하는 경향 → ② 반대 서술. 나머지는 교안 그대로.","source":{"page":8,"section":"01. 인지적 능력이 탁월한 영재 - 베니토(Benito)의 연구","quote":"누가 가르치지 않아도 자발적으로 효과적인 전략을 사용하는 경향이 있음 ‣ 연역적 추리와 귀납적 추리를 포함하는 다양한 문제해결 전략을 사용"}},{"id":"15-08","type":"빈칸","q":"베니토(Benito)의 연구에 대한 다음 내용에서 (   )에 들어갈 말로 알맞은 것은?","box":"정보를 처리할 때 신속하게 처리함(정보처리의 (   ))","choices":["자동화","구조화","내면화","단순화","시각화"],"answer":1,"explain":"교안: 정보를 처리할 때 신속하게 처리함(정보처리의 자동화). 나머지는 교안에 없는 용어.","source":{"page":8,"section":"01. 인지적 능력이 탁월한 영재 - 베니토(Benito)의 연구","quote":"정보를 처리할 때 신속하게 처리함(정보처리의 자동화)"}},{"id":"15-09","type":"옳은 것","q":"베니토(Benito)의 연구 방법에 대한 설명으로 옳은 것은?","box":null,"choices":["영재와 상위인지에 관한 20개의 연구를 분석하였다.","스탠포드-비네 지능검사 상위 1% 학생을 대상으로 종단연구를 하였다.","영재의 상위인지 기술과 전략에 대해 심층면접과 관찰을 통한 질적 연구를 하였다.","대규모 설문조사를 통한 양적 연구를 하였다.","학교생활기록부에 기록된 지능지수에 기초하여 연구하였다."],"answer":3,"explain":"교안: 베니토는 영재의 상위인지 기술과 전략에 대해 심층면접과 관찰을 통한 질적 연구를 함. ① 로저스 ② 터만(지능이론 차시) ④ 교안에 없음 ⑤ 이정규(2005)의 연구 방식.","source":{"page":8,"section":"01. 인지적 능력이 탁월한 영재 - 베니토(Benito)의 연구","quote":"영재의 상위인지 기술과 전략에 대해 심층면접과 관찰을 통한 질적 연구를 한 베니토(Benito)"}},{"id":"15-10","type":"옳은 것","q":"영재의 탁월한 인지적 능력과 언어의 관계에 대한 설명으로 옳은 것은?","box":null,"choices":["교육심리학에서 인지발달과 언어는 관계가 없는 것으로 본다.","아동의 인지적 발달은 타인과의 상호작용과 무관하다.","영재의 급속한 언어발달은 개념과 지식기반의 축소와 관련이 있다.","인지발달이 언어를 억제하는 것으로 본다.","언어가 인지발달을 촉진하거나 매개하며, 영재의 급속한 언어발달은 개념과 지식기반의 확장과 관련이 있다."],"answer":5,"explain":"교안 그대로 ⑤. ① 인지발달과 언어는 밀접한 관계 ② 아동은 타인(가족, 교사, 친구 등)과 언어를 통한 상호작용으로 인지적 발달을 촉진 ③ 축소가 아니라 확장 ④ 교안에 없는 반대 서술.","source":{"page":9,"section":"01. 인지적 능력이 탁월한 영재 - 영재의 탁월한 인지적 능력을 종합하면","quote":"교육심리학에서 인지발달과 언어는 밀접한 관계가 있으며 언어가 인지발달을 촉진하거나 매개함 아동은 타인(가족, 교사, 친구 등)과 언어를 통한 상호작용으로 인지적 발달을 촉진하는데, 영재의 급속한 언어발달은 개념과 지식기반의 확장과 관련이 있음"}},{"id":"15-11","type":"옳지 않은 것","q":"영재의 탁월한 인지적 능력을 종합한 설명으로 옳지 않은 것은?","box":null,"choices":["영재들은 읽는 것을 쉽게 배우며 스스로 터득한다.","이해, 파지, 어휘, 정보 저장, 논리적인 능력이 우수하다.","영재는 글을 명확하게 쓴다.","자기 또래의 아동보다 더 짧은 문장을 쓴다.","명확하고 논리적으로 사고한다."],"answer":4,"explain":"교안: 영재는 자기 또래의 아동보다도 '더 긴 문장'을 씀 → ④ 반대 서술. 나머지는 교안 그대로.","source":{"page":10,"section":"01. 인지적 능력이 탁월한 영재 - 영재의 탁월한 인지적 능력을 종합하면","quote":"영재들은 읽는 것을 쉽게 배우며 스스로 터득하고, 이해, 파지, 어휘, 정보 저장, 논리적인 능력이 우수함 영재는 글을 명확하게 쓰며, 자기 또래의 아동보다도 더 긴 문장을 쓰고 명확하고 논리적으로 사고함"}},{"id":"15-12","type":"옳은 것","q":"'높은 지적호기심'으로 인한 부정적인 행동특성에 해당하는 것은?","box":null,"choices":["정보 습득이 빠름","다양한 책을 읽음","정규 학교생활을 지루해함","유머 감각","선택적 주의집중 우수함"],"answer":3,"explain":"교안: 높은 지적호기심의 부정적 특성 = 과다한 질문과 의욕이 넘쳐 지시에 따르기를 거부, 인내심 부족, 정규 학교생활을 지루해함. ①② 높은 지적호기심의 긍정적 특성 ④ 발달된 언어능력의 긍정적 특성 ⑤ 높은 주의집중력의 긍정적 특성.","source":{"page":12,"section":"02. 영재의 탁월한 인지능력으로 인한 긍·부정적 행동특성 - 높은 지적호기심","quote":"과다한 질문과 의욕이 넘쳐 지시에 따르기를 거부 • 인내심 부족 • 정규 학교생활을 지루해함"}},{"id":"15-13","type":"옳지 않은 것","q":"'높은 지적호기심'으로 인한 긍정적인 행동특성으로 옳지 않은 것은?","box":null,"choices":["정보 습득이 빠름","질문이 많음","인내심 부족","풍부한 양의 정보를 소유","다양한 책을 읽음"],"answer":3,"explain":"③ 인내심 부족은 높은 지적호기심의 '부정적' 행동특성. 긍정적 특성: 정보 습득이 빠름, 호기심과 궁금함이 많음, 질문이 많음, 풍부한 양의 정보를 소유, 다양한 책을 읽음.","source":{"page":12,"section":"02. 영재의 탁월한 인지능력으로 인한 긍·부정적 행동특성 - 높은 지적호기심","quote":"정보 습득이 빠름 • 호기심과 궁금함이 많음 • 질문이 많음 • 풍부한 양의 정보를 소유 • 다양한 책을 읽음"}},{"id":"15-14","type":"보기 조합","q":"'발달된 언어능력'으로 인한 부정적인 행동특성을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 나이에 맞지 않는 언어\nㄴ. 장황한 핑계를 자주 댐\nㄷ. 유머 감각\nㄹ. 잘난 체, 따지거나 논쟁함","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"answer":5,"explain":"교안: 발달된 언어능력의 부정적 특성 = 나이에 맞지 않는 언어, 의사소통에 어려움, 대인관계가 어려움, 잘난 체·따지거나 논쟁함, 장황한 핑계를 자주 댐. ㄷ 유머 감각은 긍정적 특성.","source":{"page":13,"section":"02. 영재의 탁월한 인지능력으로 인한 긍·부정적 행동특성 - 발달된 언어능력","quote":"나이에 맞지 않는 언어 • 의사소통에 어려움 • 대인관계가 어려움 • 잘난 체, 따지거나 논쟁함 • 장황한 핑계를 자주 댐"}},{"id":"15-15","type":"옳지 않은 것","q":"'발달된 언어능력'으로 인한 긍정적인 행동특성으로 옳지 않은 것은?","box":null,"choices":["의사소통에 어려움","어휘력 풍부","앞선 언어발달","언어로 비판","유머 감각"],"answer":1,"explain":"① 의사소통에 어려움은 발달된 언어능력의 '부정적' 특성. 긍정적 특성: 어휘력 풍부, 높은 어휘수준, 앞선 언어발달, 언어로 비판, 책을 많이 읽음, 앞선 정보력, 유머 감각.","source":{"page":13,"section":"02. 영재의 탁월한 인지능력으로 인한 긍·부정적 행동특성 - 발달된 언어능력","quote":"어휘력 풍부 • 높은 어휘수준 • 앞선 언어발달 • 언어로 비판 • 책을 많이 읽음 • 앞선 정보력 • 유머 감각"}},{"id":"15-16","type":"사례","q":"다음 사례의 학생에게 나타난 부정적 행동특성은 어떤 인지적 특성으로 인한 것인가?","box":"학생 C는 놀이를 할 때 복잡한 규칙을 설정하여 친구들이 함께 놀기를 기피하고, 반복학습과 연습을 싫어하며, 다른 사람들에게 동조하지 않는다.","choices":["높은 지적호기심","높은 창의성","발달된 언어능력","높은 주의집중력","높은 사고능력"],"answer":2,"explain":"교안: 높은 창의성의 부정적 특성 = 복잡한 규칙 설정으로 친구들이 기피, 파괴적이거나 보조를 깨뜨리는 것으로 보임, 반복학습과 연습 기피, 동조하지 않음. ⑤ 높은 사고능력의 부정적 특성은 '단순 연습 기피', 전통적 학습방법 거부 등.","source":{"page":14,"section":"02. 영재의 탁월한 인지능력으로 인한 긍·부정적 행동특성 - 높은 창의성","quote":"복잡한 규칙 설정으로 친구들이 기피 • 파괴적이거나 보조를 깨뜨리는 것으로 보임 • 반복학습과 연습 기피 • 동조하지 않음"}},{"id":"15-17","type":"옳지 않은 것","q":"'높은 창의성'으로 인한 긍정적인 행동특성으로 옳지 않은 것은?","box":null,"choices":["동조하지 않음","상상력 풍부, 독특함","새로운 발명과 방식 추구","아이디어나 해결책을 내기 좋아함","심리적이고 예술적 감각이 풍부"],"answer":1,"explain":"① 동조하지 않음은 높은 창의성의 '부정적' 특성. 긍정적 특성: 상상력 풍부·독특함, 새로운 발명과 방식 추구, 자기 해석과 스타일 추구, 아이디어나 해결책을 내기 좋아함, 심리적이고 예술적 감각이 풍부.","source":{"page":14,"section":"02. 영재의 탁월한 인지능력으로 인한 긍·부정적 행동특성 - 높은 창의성","quote":"상상력 풍부, 독특함 • 새로운 발명과 방식 추구 • 자기 해석과 스타일 추구 • 아이디어나 해결책을 내기 좋아함 • 심리적이고 예술적 감각이 풍부"}},{"id":"15-18","type":"옳지 않은 것","q":"'높은 사고능력'으로 인한 긍정적인 행동특성으로 옳지 않은 것은?","box":null,"choices":["추상화 및 종합능력 우수","세부적인 것을 놓침","원인-결과 관계 파악함","사물과 사람을 조직화함","도전적, 논리적"],"answer":2,"explain":"② 세부적인 것을 놓침은 높은 사고능력의 '부정적' 특성(그 밖에 단순 연습 기피, 전통적 학습방법 거부, 지나치게 복잡하게 생각, 비논리적인 것을 따짐, 논쟁적). 긍정적 특성: 사고력 우수, 사고 과정이 빠름, 판단력과 문제해결 즐김, 추상화 및 종합능력 우수, 원인-결과 관계 파악, 사물과 사람을 조직화, 도전적·논리적.","source":{"page":15,"section":"02. 영재의 탁월한 인지능력으로 인한 긍·부정적 행동특성 - 높은 사고능력","quote":"단순 연습 기피 • 전통적 학습방법 거부 • 세부적인 것을 놓침 • 지나치게 복잡하게 생각하는 경향이 있음 • 비논리적인 것을 따짐 • 논쟁적"}},{"id":"15-19","type":"사례","q":"다음 사례의 학생에게 나타난 부정적 행동특성은 어떤 인지적 특성으로 인한 것인가?","box":"학생 D는 한번 시작한 일은 하던 일을 멈추지 못해 제안된 시간을 자주 넘긴다. 또한 자기 일에만 편중되어 타인에 대한 관심이 부족하고 일상생활의 일들에 무관심하다.","choices":["높은 지적호기심","발달된 언어능력","높은 창의성","높은 주의집중력","높은 사고능력"],"answer":4,"explain":"교안: 높은 주의집중력의 부정적 특성 = 하던 일을 멈추지 못함, 타인에 대한 관심 부족, 일상생활의 일들에 무관심, 제안된 시간을 넘김, 자기 일에만 편중됨. 다른 특성들의 부정적 행동은 지시 거부(지적호기심), 장황한 핑계(언어능력), 동조하지 않음(창의성), 세부적인 것을 놓침(사고능력) 등.","source":{"page":16,"section":"02. 영재의 탁월한 인지능력으로 인한 긍·부정적 행동특성 - 높은 주의집중력","quote":"하던 일을 멈추지 못함 • 타인에 대한 관심 부족 • 일상생활의 일들에 무관심 • 제안된 시간을 넘김 • 자기 일에만 편중됨"}},{"id":"15-20","type":"옳은 것","q":"'높은 주의집중력'으로 인한 긍정적인 행동특성으로 옳은 것은?","box":null,"choices":["일상생활의 일들에 무관심","자기 일에만 편중됨","타인에 대한 관심 부족","하던 일을 멈추지 못함","복잡함 속에서도 자기 일에 몰두함"],"answer":5,"explain":"교안: 높은 주의집중력의 긍정적 특성 = 흥미영역 지속, 복잡함 속에서도 자기 일에 몰두함, 선택적 주의집중 우수함, 목표 지향 행동. ①~④는 모두 부정적 특성.","source":{"page":16,"section":"02. 영재의 탁월한 인지능력으로 인한 긍·부정적 행동특성 - 높은 주의집중력","quote":"흥미영역 지속 • 복잡함 속에서도 자기 일에 몰두함 • 선택적 주의집중 우수함 • 목표 지향 행동"}}]},{"lesson":16,"title":"영재를 이해하기 위한 창의성","file":"4. 교안 (1~30)/16.pdf","summary":["2000년 이후 \"창의적 인재육성\"은 국가 교육정책의 중요한 목표 / 과학영재학교 및 과학고 학교교육 목표: \"창의적 융합인재 육성\"","한국과학영재학교: 학생선발 인재상(수학 또는 과학영역에서 탁월한 역량과 창의성, 도전정신과 열정·큰 꿈), 2단계 전형 창의적 문제해결력 평가","서울과학고: 2단계 전형 창의력 문제해결력 검사 = 영재성·창의력·융합적 사고력 평가, 중학교 교육과정에서 통합형 교과, 서술형 문항","클라우드 슈밥(세계경제포럼 회장): 4차 산업혁명 혁신역량으로 창의성 강조 / 스티브 잡스: \"창의성은 경험을 연결시켜 새로운 것들을 합성하는 능력\"","기업 인사담당자: 디지털 시대에는 빠른 두뇌와 독창성이 경쟁력의 원천, 창의력·도전의식·비전 등 정신적 요소 중시","1950년 미국 심리학회 회장 J. P. 길포드 기조연설: 전통적 지적능력 개념은 속도, 정확성, 무오류성, 논리성, 수렴적 사고와 정답만 지나치게 강조 / 1950년 이후 창의성 연구 학문적 체계","스푸트니크 쇼크(1957): 1957년 10월 4일 구소련 발사, 제2의 진주만 폭격 비유 → 미국 창의성 계발교육 강화·영재교육 도화선","창의성 = 새로움(novelty) + 적절성(appropriateness), 새롭고 가치 있는 아이디어(무형)나 산출물(유형)을 창출해내는 능력 / 최근 \"누구나 발휘할 수 있는 능력\"","인지적 능력: 유창성(많은 아이디어), 융통성(다양한 종류의 해결책), 독창성(독특하고 새로운 아이디어), 정교성(자세하고 실용적으로 발전)","정의적 특성: 자발성, 모험심, 개방성, 인내심, 민감성 → 창의적 환경과 상호작용하여 창의적 산출물","월리스(영국 사회심리학자) 창의적 사고과정: 준비기(Preparation) → 부화기(Incubation, 정신적 휴지기·무의식적 사고) → 발현기(Illumination, 유레카) → 검증기(Verification, 타당성 검증)"],"questions":[{"id":"16-01","type":"빈칸","q":"다음 (   )에 들어갈 연도로 알맞은 것은?","box":"(   )년 이후 \"창의적 인재육성\"은 국가 교육정책의 중요한 목표","choices":["1950","1957","1990","2000","2010"],"answer":4,"explain":"교안: 2000년 이후 \"창의적 인재육성\"은 국가 교육정책의 중요한 목표. ① 1950은 길포드 미국 심리학회 회장 취임 연도 ② 1957은 스푸트니크 쇼크 ③⑤는 교안 해당 내용 없음.","source":{"page":3,"section":"01. 창의성의 개념과 정의 - 창의성이 왜 중요할까?","quote":"2000년 이후 \"창의적 인재육성\"은 국가 교육정책의 중요한 목표"}},{"id":"16-02","type":"빈칸","q":"과학영재학교 및 과학고의 학교교육 목표로 교안에 제시된 것은?","box":"과학영재학교 및 과학고의 학교교육의 목표도 \"(   )\"","choices":["글로벌 리더 육성","창의적 융합인재 육성","과학기술 전문가 육성","미래 과학자 육성","자기주도적 학습자 육성"],"answer":2,"explain":"교안: 과학영재학교 및 과학고의 학교교육의 목표도 \"창의적 융합인재 육성\". 나머지는 교안에 해당 목표로 제시되지 않음(① '조화로운 인격을 갖춘 글로벌 리더'는 서울과학고 인재상의 일부).","source":{"page":3,"section":"01. 창의성의 개념과 정의 - 창의성이 왜 중요할까?","quote":"과학영재학교 및 과학고의 학교교육의 목표도 \"창의적 융합인재 육성\""}},{"id":"16-03","type":"옳지 않은 것","q":"교안에 제시된 한국과학영재학교의 학생 선발에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["학생선발 인재상: 수학 또는 과학영역에서 탁월한 역량과 창의성을 갖춘 학생","학생선발 인재상: 도전정신과 열정이 뛰어나고 꿈이 큰 학생","2단계 전형에서는 창의적 문제해결력 검사 없이 교과 성적만으로 평가한다.","2단계 전형에서는 창의적 문제해결력 검사를 포함한 학생기록물 등을 종합적으로 평가한다.","입학담당관의 종합평가를 통과한 자를 대상으로 한다."],"answer":3,"explain":"교안: 한국과학영재학교 2단계 전형은 '창의적 문제해결력 평가'로, 창의적 문제해결력 검사를 포함한 학생기록물 등을 종합적 평가 → ③ 틀림. 나머지는 교안 그대로.","source":{"page":5,"section":"01. 창의성의 개념과 정의 - 창의성이 왜 중요할까?","quote":"한국과학영재학교 2단계 전형 창의적 문제해결력 평가 / • 창의적 문제해결력 검사를 포함한 학생기록물 등을 종합적 평가 • 입학담당관의 종합평가를 통과한 자"}},{"id":"16-04","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"\"창의성\"을 중요한 교육목표와 (   ), 교육과정에 반영 (예: 한국과학영재학교 일반전형 개요, KSA 교훈)","choices":["교원연수","입학전형","교육철학","평가기준","진로지도"],"answer":2,"explain":"교안: \"창의성\"을 중요한 교육목표와 '입학전형', 교육과정에 반영. 한국과학영재학교·서울과학고의 학생선발 인재상과 2단계 전형이 그 예시임.","source":{"page":4,"section":"01. 창의성의 개념과 정의 - 창의성이 왜 중요할까?","quote":"\"창의성\"을 중요한 교육목표와 입학전형, 교육과정에 반영 / ‣ 한국과학영재학교 일반전형개요 / • KSA 교훈"}},{"id":"16-05","type":"옳지 않은 것","q":"교안에 제시된 서울과학고등학교의 개요 및 학생 선발 인재상에 해당하지 않는 것은?","box":null,"choices":["도전정신과 열정이 뛰어나고 꿈이 큰 학생","미래를 창조하는 과학영재의 요람","창의성을 갖춘 과학도","조화로운 인격을 갖춘 글로벌 리더","전통을 계승하며 세계를 선도하는 인재 육성"],"answer":1,"explain":"① '도전정신과 열정이 뛰어나고 꿈이 큰 학생'은 한국과학영재학교의 학생선발 인재상. ②~⑤는 서울과학고등학교 개요 및 학생 선발 인재상.","source":{"page":6,"section":"01. 창의성의 개념과 정의 - 창의성이 왜 중요할까?","quote":"서울과학고등학교 개요 및 학생 선발 인재상 / • 미래를 창조하는 과학영재의 요람 • 창의성을 갖춘 과학도 • 조화로운 인격을 갖춘 글로벌 리더 • 전통을 계승하며 세계를 선도하는 인재 육성"}},{"id":"16-06","type":"옳은 것","q":"서울과학고등학교 2단계 전형 '창의력 문제해결력 검사'에 대한 설명으로 옳은 것은?","box":null,"choices":["고등학교 교육과정에서 분과형 교과로 시행한다.","선택형(객관식) 문항으로 출제한다.","지식의 양과 암기력을 평가하는 검사이다.","영재성, 창의력, 융합적 사고력을 평가하는 검사로 서술형 문항으로 출제한다.","1단계 전형에서 실시한다."],"answer":4,"explain":"교안: 창의력 문제해결력 검사 = 영재성, 창의력, 융합적 사고력을 평가, 중학교 교육과정에서 통합형 교과로 시행, 서술형 문항. ① 중학교 교육과정·통합형 ② 서술형 ③ 교안에 없음 ⑤ 2단계 전형.","source":{"page":7,"section":"01. 창의성의 개념과 정의 - Q. 창의력 문제해결력 검사","quote":"영재성, 창의력, 융합적 사고력을 평가하는 검사 ‣ 중학교 교육과정에서 통합형 교과로 시행 ‣ 서술형 문항으로 출제"}},{"id":"16-07","type":"개념 찾기","q":"4차 산업혁명의 혁신역량으로 창의성을 강조한 세계경제포럼 회장은?","box":null,"choices":["스티브 잡스","클라우드 슈밥","J. P. 길포드","앨런 튜링","조셉 렌줄리"],"answer":2,"explain":"교안: 세계경제포럼 회장 클라우드 슈밥은 4차 산업혁명의 혁신역량으로 창의성 강조, 특정 지식 차원이 아닌 융합적·포괄적 이해능력이 성공의 전제조건이라 봄. ① 스티브 잡스는 애플 전 CEO·공동창립자 ③ 길포드는 1950년 미국 심리학회 회장 ④⑤ 해당 없음.","source":{"page":8,"section":"01. 창의성의 개념과 정의 - 4차 산업혁명을 선도할 혁신역량","quote":"세계경제포럼 회장 클라우드 슈밥은 4차 산업혁명의 혁신역량으로 창의성 강조 / 특정 지식 차원의 접근이 아닌 융합적, 포괄적 이해능력이 성공의 전제조건"}},{"id":"16-08","type":"빈칸","q":"다음은 애플의 전 CEO이자 공동창립자 스티브 잡스의 말이다. (   )에 들어갈 말로 알맞은 것은?","box":"창의성은 (   )을 연결시켜 새로운 것들을 합성하는 능력이다","choices":["지식","기술","경험","정보","사람"],"answer":3,"explain":"교안: 스티브 잡스 \"창의성은 경험을 연결시켜 새로운 것들을 합성하는 능력이다\". 기술, 공학 분야와 창의성을 융합한 21세기 혁신의 아이콘.","source":{"page":9,"section":"01. 창의성의 개념과 정의 - 창의성을 통한 혁신의 모델 제시","quote":"창의성은 경험을 연결시켜 새로운 것들을 합성하는 능력이다 애플의 전 CEO이자 공동창립자 스티브 잡스"}},{"id":"16-09","type":"옳은 것","q":"교안에 제시된 삼성전자 인사담당자 인터뷰 내용으로 옳은 것은?","box":null,"choices":["디지털 시대에는 축적된 경험이 경쟁력의 원천이다.","아날로그 시대에는 빠른 두뇌와 독창성이 경쟁력의 원천이었다.","면접 과정에서는 전문지식의 양을 집중적으로 파악한다.","창의성보다 외국어 능력을 가장 중요하게 본다.","과거 아날로그 시대에는 축적된 경험이 경쟁력의 원천이었으나 디지털 시대에서는 빠른 두뇌와 독창성이 경쟁력의 원천이다."],"answer":5,"explain":"교안 그대로 ⑤. ①② 시대가 서로 바뀜 ③ 면접에서 지원자가 얼마나 창의적인지를 집중적으로 파악 ④ 창의성, 자기비전이 중요.","source":{"page":10,"section":"01. 창의성의 개념과 정의 - 기업 인사담당자들이 특별히 강조하는 것들","quote":"과거 아날로그 시대에는 축적된 경험이 경쟁력의 원천이었으나 디지털 시대에서는 빠른 두뇌와 독창성이 경쟁력의 원천 • 면접 과정에서 다양한 질문을 통해 지원자가 얼마나 창의적인지를 집중적으로 파악"}},{"id":"16-10","type":"옳지 않은 것","q":"기업체 인사담당자들의 평가기준에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["전문지식이 많고 외국어 능력이 출중하면 창의력 등 정신적 요소를 갖추지 못해도 높은 점수를 준다.","창의력, 도전의식, 비전 등 정신적 요소를 중시한다.","최근 기업체들은 최종면접 과정에서 정신적 요소들을 집중적으로 파악하고자 한다.","창의성, 자기비전이 중요하다.","면접 과정에서 다양한 질문을 통해 지원자가 얼마나 창의적인지를 파악한다."],"answer":1,"explain":"교안: 아무리 전문지식이 많고 외국어 능력이 출중해도 창의력, 도전의식, 비전 등 정신적 요소를 갖추지 못한 사람에게는 높은 점수를 주지 않음 → ① 반대 서술.","source":{"page":11,"section":"01. 창의성의 개념과 정의 - 기업 인사담당자들이 특별히 강조하는 것들","quote":"아무리 전문지식이 많고 외국어 능력이 출중해도 창의력, 도전의식, 비전 등 정신적 요소를 갖추지 못한 사람에게는 높은 점수를 주지 않음"}},{"id":"16-11","type":"옳지 않은 것","q":"길포드(Guilford)가 창의성에 대한 기조연설에서 '전통적인 지적능력 개념들이 지나치게 강조했다'고 지적한 것에 해당하지 않는 것은?","box":null,"choices":["속도","정확성","무오류성","수렴적 사고와 정답","새로움과 적절성"],"answer":5,"explain":"교안: 지적능력에 대한 전통적인 개념들은 속도, 정확성, 무오류성, 논리성 그리고 수렴적 사고와 정답만을 지나치게 강조. ⑤ 새로움과 적절성은 창의성의 정의 요소.","source":{"page":12,"section":"01. 창의성의 개념과 정의 - 창의성 연구의 시작","quote":"지적능력에 대한 전통적인 개념들은 속도, 정확성, 무오류성, 논리성 그리고 수렴적 사고와 정답만을 지나치게 강조하였다."}},{"id":"16-12","type":"빈칸","q":"다음 (   )에 공통으로 들어갈 연도로 알맞은 것은?","box":"· (   )년 미국 심리학회의 회장이 된 J. P. 길포드\n· (   )년 이후 심리학자들이 창의성 연구의 학문적 체계를 갖추기 시작","choices":["1904","1945","1956","1957","1950"],"answer":5,"explain":"교안: 1950년 미국 심리학회 회장이 된 길포드, 1950년 이후 창의성 연구의 학문적 체계. ④ 1957년은 스푸트니크 쇼크 ①②③은 교안 해당 내용 없음.","source":{"page":12,"section":"01. 창의성의 개념과 정의 - 창의성 연구의 시작","quote":"1950년 미국 심리학회의 회장이 된 J. P. 길포드 / 1950년 이후 심리학자들이 창의성 연구의 학문적 체계를 갖추기 시작"}},{"id":"16-13","type":"옳지 않은 것","q":"스푸트니크 쇼크(1957)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["세계 최초의 인공위성인 스푸트니크 1호가 1957년 10월 4일 발사되었다.","구소련에 의해 발사되었다.","당시 제2의 진주만 폭격에 비유되던 사건이다.","미국에서 창의성 계발교육과 영재교육이 위축되는 계기가 되었다.","우월주의에 빠져 있던 미국 사회에 큰 충격을 주었다."],"answer":4,"explain":"교안: 미국에서 창의성 계발교육 강화와 영재교육을 꽃피우는 도화선이 됨 → ④ 반대 서술. 나머지는 교안 그대로.","source":{"page":13,"section":"01. 창의성의 개념과 정의 - 창의성 연구의 시작(스푸트니크 쇼크)","quote":"세계 최초의 인공위성인 스푸트니크 1호가 1957년 10월 4일 구소련에 의해 발사됨 ‣ 당시 제2의 진주만 폭격에 비유되던 사건 ‣ 당시 정치, 경제, 과학, 사회, 문화 면에서 우월주의에 빠져있던 미국 사회에 큰 충격 ‣ 미국에서 창의성 계발교육 강화와 영재교육을 꽃피우는 도화선이 됨"}},{"id":"16-14","type":"빈칸","q":"창의성의 정의에 대한 다음 내용에서 (   )에 들어갈 말로 알맞은 것은?","box":"창의성 = 새로움(novelty) + (   )","choices":["유용성","독창성","적절성(appropriateness)","정교성","효율성"],"answer":3,"explain":"교안: 창의성 = 새로움(novelty) + 적절성(appropriateness). ②④ 독창성·정교성은 창의성의 인지적 구성요인 ①⑤는 교안 정의에 없음.","source":{"page":14,"section":"01. 창의성의 개념과 정의 - 창의성의 정의","quote":"새로움(novelty) + 적절성(appropriateness)"}},{"id":"16-15","type":"옳은 것","q":"창의성의 정의에 대한 설명으로 옳은 것은?","box":null,"choices":["창의성이란 새롭고 가치 있는 아이디어(무형)나 산출물(유형)을 창출해내는 능력이다.","최근에도 창의성은 뉴턴이나 아인슈타인 등 비범한 사람에게만 있는 특수한 능력으로 인식된다.","창의성 연구 초기에는 창의성을 \"누구나 발휘할 수 있는 능력\"으로 인식하였다.","아이디어는 유형, 산출물은 무형의 결과물이다.","새롭기만 하면 적절하지 않아도 창의성이라 할 수 있다."],"answer":1,"explain":"교안 그대로 ①. ②③ 시기가 바뀜: 초기 = 비범한 사람의 특수한 능력, 최근 = 누구나 발휘할 수 있는 능력 ④ 아이디어(무형), 산출물(유형) ⑤ 창의성 = 새로움 + 적절성.","source":{"page":14,"section":"01. 창의성의 개념과 정의 - 창의성의 정의","quote":"창의성이란 새롭고 가치 있는 아이디어(무형)나 산출물(유형)을 창출해내는 능력 / 창의성 연구 초기에는 뉴턴이나 아인슈타인 등 비범한 사람에게만 있는 특수한 능력이라고 생각 최근에는 창의성을 \"누구나 발휘할 수 있는 능력\"으로 인식"}},{"id":"16-16","type":"보기 조합","q":"창의성의 구성요인 중 '인지적 능력'에 해당하는 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 유창성\nㄴ. 민감성\nㄷ. 정교성\nㄹ. 융통성","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"교안: 인지적 능력 = 유창성, 융통성, 독창성, 정교성 / 정의적 특성 = 자발성, 모험심, 개방성, 인내심, 민감성. ㄴ 민감성은 정의적 특성.","source":{"page":16,"section":"02. 창의성의 구성요인 - 창의성의 구성요인","quote":"정의적 특성 / 인지적 능력 / • 유창성 • 융통성 • 독창성 • 정교성 / • 자발성 • 모험심 • 개방성 • 인내심 • 민감성 / 창의적 산출물(제품, 아이디어 등)"}},{"id":"16-17","type":"옳지 않은 것","q":"창의성의 구성요인 중 '정의적 특성'에 해당하지 않는 것은?","box":null,"choices":["자발성","독창성","개방성","인내심","민감성"],"answer":2,"explain":"② 독창성은 '인지적 능력'(유창성, 융통성, 독창성, 정교성). 정의적 특성 = 자발성, 모험심, 개방성, 인내심, 민감성. 인지적 능력·정의적 특성이 창의적 환경과 상호작용하여 창의적 산출물(제품, 아이디어 등)이 나옴.","source":{"page":16,"section":"02. 창의성의 구성요인 - 창의성의 구성요인","quote":"• 유창성 • 융통성 • 독창성 • 정교성 / • 자발성 • 모험심 • 개방성 • 인내심 • 민감성"}},{"id":"16-18","type":"개념 찾기","q":"다음 정의에 해당하는 창의성의 인지적 구성요인은?","box":"특정한 문제 상황에서 주어진 시간 내에 많은 아이디어를 내는 능력\n(조작적 정의: 과제로부터 많은 것을 연상하기, 자신의 생각을 여러 가지 방법으로 표현하기, 가능한 한 많은 대안 제시하기)","choices":["유창성","융통성","독창성","정교성","민감성"],"answer":1,"explain":"교안의 '유창성' 정의. ② 융통성은 사고방식을 변화시켜 다양한 종류의 해결책을 찾는 능력 ③ 독창성은 독특하고 새로운 아이디어 산출 ④ 정교성은 아이디어를 자세하고 실용적으로 발전 ⑤ 민감성은 정의적 구성요인.","source":{"page":17,"section":"02. 창의성의 구성요인 - 유창성, 융통성","quote":"유창성 특정한 문제상황에서 주어진 시간 내에 많은 아이디어를 내는 능력 / • 과제로부터 많은 것을 연상하기 • 자신의 생각을 여러 가지 방법(그림, 글, 동작, 노래 등)으로 표현하기 • 가능한 한 많은 대안 제시하기"}},{"id":"16-19","type":"개념 찾기","q":"다음 조작적 정의에 해당하는 창의성의 인지적 구성요인은?","box":"· 과제에 대한 첨가, 확대, 제거, 축소하기\n· 과제를 새로운 요소로 대치하기\n· 과제를 재배열, 재분류, 재결합하기\n· 과제의 의미를 재정의하기","choices":["유창성","독창성","정교성","개방성","융통성"],"answer":5,"explain":"교안: 융통성 = 고정적인 사고방식이나 시각을 변화시켜서 다양한 종류의 해결책을 찾아내는 능력, 조작적 정의는 제시문과 같음. ① 유창성은 많은 것 연상·많은 대안 제시 ② 독창성은 부정하고 달리 생각해보기 ③ 정교성은 구체화·명료화 ④ 개방성은 정의적 구성요인.","source":{"page":17,"section":"02. 창의성의 구성요인 - 유창성, 융통성","quote":"융통성 고정적인 사고방식이나 시각을 변화시켜서 다양한 종류의 해결책을 찾아내는 능력 / • 과제에 대한 첨가, 확대, 제거, 축소하기 • 과제를 새로운 요소로 대치하기 • 과제를 재배열, 재분류, 재결합하기 • 과제의 의미를 재정의하기"}},{"id":"16-20","type":"개념 찾기","q":"다음 설명에 해당하는 창의성의 인지적 구성요인은?","box":"기존의 아이디어를 보다 자세하고 실용적인 것으로 발전시키는 능력\n(조작적 정의: 아이디어를 구체화 및 명료화하기, 아이디어의 실용적 가치 찾기, 아이디어의 실천방안 찾기)","choices":["유창성","독창성","정교성","융통성","자발성"],"answer":3,"explain":"교안의 '정교성' 정의와 조작적 정의. ① 유창성은 많은 아이디어 ② 독창성은 독특하고 새로운 아이디어 산출 ④ 융통성은 다양한 종류의 해결책 ⑤ 자발성은 정의적 구성요인.","source":{"page":18,"section":"02. 창의성의 구성요인 - 독창성, 정교성","quote":"정교성 기존의 아이디어를 보다 자세하고 실용적인 것으로 발전시키는 능력 / • 아이디어를 구체화 및 명료화하기 • 아이디어의 실용적 가치 찾기 • 아이디어의 실천방안 찾기"}},{"id":"16-21","type":"사례","q":"다음 활동이 계발하고자 하는 창의성의 인지적 구성요인은?","box":"교사는 학생들에게 \"우리가 당연하게 여기는 사물이나 사실, 생각을 부정하고 달리 생각해 보자. 기발하고 새로운 생각을 해 보자.\"라고 제안하였다. 이를 통해 기존의 것과는 다른 독특하고 새로운 아이디어를 산출하도록 하였다.","choices":["정교성","융통성","유창성","독창성","개방성"],"answer":4,"explain":"교안: 독창성 = 기존의 것과는 다른 독특하고 새로운 아이디어를 산출하는 능력, 조작적 정의 = 기존의 사물, 사실 및 생각을 부정하고 달리 생각해보기, 기발하고 새로운 생각해보기. ① 정교성은 구체화·실용적 발전 ② 융통성은 다양한 해결책 ③ 유창성은 많은 아이디어 ⑤ 개방성은 정의적 구성요인.","source":{"page":18,"section":"02. 창의성의 구성요인 - 독창성, 정교성","quote":"• 기존의 사물, 사실 및 생각을 부정하고, 달리 생각해보기 • 기발하고 새로운 생각해보기 / 독창성 기존의 것과는 다른 독특하고 새로운 아이디어를 산출하는 능력"}},{"id":"16-22","type":"개념 찾기","q":"다음 조작적 정의에 해당하는 창의성의 정의적 구성요인은?","box":"· 주변 상황에 대한 호기심이나 의문 갖기\n· 자신에 대한 관심 갖기\n· 익숙한 것을 낯설게 보기\n· 낯선 것을 익숙하게 보기","choices":["민감성","개방성","자발성","인내심","모험심"],"answer":1,"explain":"교안: 민감성 = 주변의 환경에 대해 예민한 관심을 보이고, 이를 통해 새로운 탐색을 하려는 성향. ② 개방성은 다양한 경험 수용하기, 타인의 입장에서 보기, 한계나 제한으로부터 벗어나기 ③ 자발성은 주도적으로 행동하기 등 ④ 인내심은 쉽게 포기하지 않기 등 ⑤ 모험심은 두려움에 직면하기 등.","source":{"page":19,"section":"02. 창의성의 구성요인 - 민감성, 개방성","quote":"민감성 주변의 환경에 대해 예민한 관심을 보이고, 이를 통해 새로운 탐색을 하려는 성향 / • 주변 상황에 대한 호기심이나 의문 갖기 • 자신에 대한 관심 갖기 • 익숙한 것을 낯설게 보기 • 낯선 것을 익숙하게 보기"}},{"id":"16-23","type":"빈칸","q":"다음은 창의성의 정의적 구성요인 중 '개방성'의 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"자신의 경험에 제한받지 않고 모든 (   )을 수용하려는 성향","choices":["의견","가능성","평가","정보","보상"],"answer":2,"explain":"교안: 개방성 = 자신의 경험에 제한받지 않고 모든 가능성을 수용하려는 성향(조작적 정의: 다양한 경험 수용하기, 타인의 입장에서 보기, 한계나 제한으로부터 벗어나기). 나머지는 정의에 없는 말.","source":{"page":19,"section":"02. 창의성의 구성요인 - 민감성, 개방성","quote":"개방성 자신의 경험에 제한받지 않고 모든 가능성을 수용하려는 성향"}},{"id":"16-24","type":"옳지 않은 것","q":"창의성의 정의적 구성요인에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["자발성: 남의 평가에 구애받지 않고, 능동적으로 창의적 산출물을 내려는 성향","자발성의 조작적 정의: 주도적으로 행동하기, 과제에 대해 흥미 갖기","인내심: 모험을 감수하며 장애를 극복하려는 성향","인내심의 조작적 정의: 상황의 불확실성을 견디기, 결정을 유보하기, 쉽게 포기하지 않기","모험심의 조작적 정의: 두려움에 직면하기, 새로운 상황에 접해보기"],"answer":3,"explain":"③ '모험을 감수하며 장애를 극복하려는 성향'은 모험심의 정의. 인내심 = 불확실함을 끝까지 견디며, 포기하지 않으려는 성향. 나머지는 교안 그대로.","source":{"page":20,"section":"02. 창의성의 구성요인 - 자발성, 인내심, 모험심","quote":"인내심 불확실함을 끝까지 견디며, 포기하지 않으려는 성향 / • 주의 집중기간을 연장하기 • 상황의 불확실성을 견디기 • 결정을 유보하기 • 쉽게 포기하지 않기 • 어려움을 이겨내기 / 모험심 모험을 감수하며 장애를 극복하려는 성향 • 두려움에 직면하기 • 새로운 상황에 접해보기"}},{"id":"16-25","type":"옳은 것","q":"영국의 사회심리학자 그레이엄 월리스의 창의적 사고과정을 순서대로 바르게 나열한 것은?","box":null,"choices":["부화기 → 준비기 → 발현기 → 검증기","준비기 → 발현기 → 부화기 → 검증기","준비기 → 검증기 → 부화기 → 발현기","발현기 → 부화기 → 준비기 → 검증기","준비기 → 부화기 → 발현기 → 검증기"],"answer":5,"explain":"교안: 1 준비기(Preparation) → 2 부화기(Incubation) → 3 발현기(Illumination) → 4 검증기(Verification) → 창의적 아이디어.","source":{"page":23,"section":"02. 창의성의 구성요인 - 창의적 사고과정","quote":"준비기 Preparation / 부화기 Incubation 발현기 Illumination / 4 / 검증기 Verification 아이디어의 타당성 검증 창의적 아이디어"}},{"id":"16-26","type":"사례","q":"다음 사례는 월리스의 창의적 사고과정 중 어느 단계에 해당하는가?","box":"과학 탐구 문제에 막힌 학생 E는 문제를 잠시 내려놓고 산책을 하며 쉬었다. 의식적으로 생각하지 않는 동안에도 머릿속에서는 무의식적으로 문제가 계속 숙성되고 있었다.","choices":["준비기(Preparation)","발현기(Illumination)","검증기(Verification)","부화기(Incubation)","창의적 아이디어"],"answer":4,"explain":"교안: 부화기(Incubation) = 정신적 휴지기, 무의식적 사고. ① 준비기는 아이디어 껴안고 살기 ② 발현기는 \"오~! 유레카!\" ③ 검증기는 아이디어의 타당성 검증 ⑤ 사고과정의 결과물.","source":{"page":23,"section":"02. 창의성의 구성요인 - 창의적 사고과정","quote":"아이디어 껴안고 살기 정신적 휴지기 무의식적 사고 오~! 유레카!"}}]},{"lesson":17,"title":"영재의 창의성을 설명하는 주요 이론","file":"4. 교안 (1~30)/17.pdf","summary":["창의성에 대한 오해: 기발함·황당함, 고집불통, 일반인과 다름, 비상식적 → 올바른 이해: 새롭다 + 적절하다","현대적 창의성 이론: 1980년대 말부터 단일요인이 아닌 다원적, 통합적, 생태학적 접근 / 주요 공통변인으로 '동기' 강조","애머바일(Amabile): 창의성의 요소모델, 내적 동기가 외적 동기보다 창의성에 더 많이 도움","스턴버그와 루바트(Sternberg \u0026 Lubart): 창의성의 투자이론, 여섯 가지 자원(지적 능력, 지식, 사고방식, 인성, 동기, 환경)이 복합적으로 상호작용할 때 창의성 극대화","칙센트미하이(Csikszentmihalyi): 창의성은 어느 곳에 존재하는가에 대한 체계이론, 몰입(FLOW) / 개인(individual)·영역(domain)·분야(field) 세 체계가 상호작용할 때 창의성 발휘","분야(field) 체계 = 개인의 창의적 아이디어를 평가하고 선택하는 사람들의 집합체","로데스(Rhodes) 4P 이론: 길포드 이후 연구 정리 → Product(창의적 산출물), Person(창의적 인물의 특성), Process(창의적 과정), Press(창의적 환경) / 4P는 서로 밀접하게 연결","창의적인 산출물 = 창의적인 사람이 창의적인 과정을 통해 얻은 결과, 창의적인 환경의 지원을 받을 때 창의성 최대 발휘","배런과 해링턴: 심미적 특성 관심·광범위한 흥미, 과제집착력, 넘치는 활동에너지, 판단의 독립성·자율성·통찰력·자신감·개방성","칙센트미하이 연구결과(창의적 성취에 도움 되는 순서): 같은 필드의 인간관계·가족 → 내적 동기 → 사회에 대한 관심·다양한 흥미·개방성 → 철저한 지식의 준비 → 독립성·혼자만의 시간·성실함","애머바일 연구결과: 자기 절제, 만족 유보(마시멜로 효과), 인내력, 쉽게 확정하지 않는 것 / 갤럽(Gallap): 창의적 사람의 전형 = 자기 일에만 몰두, 타인의 일·사회적 책임에 무관심","애머바일과 헤네시: 창의성 촉진 9가지(자유, 훌륭한 프로젝트 관리, 충분한 자원, 격려, 다양한 조직의 특성, 인정, 충분한 시간, 도전, 긴장) / 저하 6가지(평가될 것이라는 생각, 감시 감독, 외적 동기, 경쟁, 선택이 제한된 경우, 보상만을 추구)"],"questions":[{"id":"17-01","type":"옳은 것","q":"교안에서 창의성에 대한 오해를 바로잡으며 제시한 창의성의 올바른 의미로 옳은 것은?","box":null,"choices":["기발하고 황당한 것","새롭다 + 적절하다","고집불통인 것","일반인과 다른 것","비상식적인 것"],"answer":2,"explain":"교안은 '기발함, 황당함', '고집불통', '일반인과 다름', '비상식적'을 창의성에 대한 오해로 제시하고, 창의성은 '새롭다+적절하다'로 정리한다. ①③④⑤는 모두 교안이 '잘못된 오해'로 든 항목이다.","source":{"page":3,"section":"창의성에 대한 오해","quote":"새롭다+적절하다 / 기발함, 황당함 고집불통 일반인과 다름 비상식적 / ‣ 잘못된 오해를 올바로 알기 위해 창의성에 대한 이론을 공부"}},{"id":"17-02","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"(   )부터 창의성은 단일 요인에 의한 접근이 아닌 다원적, 통합적, 생태학적 접근을 해야 한다는 창의성 이론들이 등장","choices":["1950년대 초","1960년대 말","1970년대 중반","1980년대 말","1990년대 말"],"answer":4,"explain":"현대적 창의성 이론은 1980년대 말부터 다원적, 통합적, 생태학적 접근을 강조하며 등장했다. ①②③⑤는 교안의 '1980년대 말'과 다른 시기다.","source":{"page":4,"section":"현대적 창의성 이론","quote":"1980년대 말부터 창의성은 단일요인에 의한 접근이 아닌 다원적, 통합적, 생태학적 접근을 해야 한다는 창의성 이론들이 등장"}},{"id":"17-03","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"많은 연구자들이 창의적 산출물과 과정, 창의적인 인물을 설명하는 주요 공통변인으로서 '(   )'를 강조","choices":["동기","지능","지식","환경","성격"],"answer":1,"explain":"현대적 창의성 이론에서 많은 연구자들은 주요 공통변인으로 '동기'를 강조했다. ②지능 ③지식 ④환경 ⑤성격은 교안이 공통변인으로 강조한 것이 아니다.","source":{"page":4,"section":"현대적 창의성 이론","quote":"많은 연구자들이 창의적 산출물과 과정, 창의적인 인물을 설명하는 주요 공통변인으로서 '동기'를 강조"}},{"id":"17-04","type":"개념 찾기","q":"다음 설명에 해당하는 학자는?","box":"· 창의성의 요소모델\n· 내적 동기가 외적 동기보다 창의성에 더 많이 도움이 됨","choices":["로데스(Rhodes)","칙센트미하이(Csikszentmihalyi)","애머바일(Amabile)","스턴버그와 루바트(Sternberg \u0026 Lubart)","배런과 해링턴(Barron \u0026 Harrington)"],"answer":3,"explain":"창의성의 요소모델과 내적 동기 강조는 애머바일(Amabile)이다. ① 로데스는 4P 이론, ② 칙센트미하이는 체계이론·몰입, ④ 스턴버그와 루바트는 투자이론, ⑤ 배런과 해링턴은 창의적 영재의 특성 연구다.","source":{"page":5,"section":"창의성 연구 동향 - 애머바일(Amabile)","quote":"창의성의 요소모델 ‣ 내적 동기가 외적 동기보다 창의성에 더 많이 도움이 됨"}},{"id":"17-05","type":"개념 찾기","q":"'좋은 투자가들은 대중의 의견에 개의치 않고 잠재력을 보고 투자 가치가 있다고 판단되면 과감히 투자'한다는 비유로 설명되는 창의성 이론과 학자의 연결로 옳은 것은?","box":null,"choices":["요소모델 - 애머바일","체계이론 - 칙센트미하이","4P 이론 - 로데스","요소모델 - 스턴버그와 루바트","투자이론 - 스턴버그와 루바트"],"answer":5,"explain":"창의성의 투자이론은 스턴버그와 루바트(Sternberg \u0026 Lubart)가 제시했다. ①②③은 이론-학자 연결은 맞지만 투자 비유와 무관하고, ④ 요소모델은 애머바일의 이론이다.","source":{"page":6,"section":"창의성 연구 동향 - 스턴버그와 루바트(Sternberg \u0026 Lubart)","quote":"창의성의 투자이론 ‣ 좋은 투자가들은 대중의 의견에 개의치 않고 잠재력을 보고 투자가치가 있다고 판단되면 과감히 투자"}},{"id":"17-06","type":"옳지 않은 것","q":"스턴버그와 루바트의 창의성의 투자이론에서 제시한 여섯 가지 자원에 해당하지 않는 것은?","box":null,"choices":["지적 능력","사고방식","인성","학업 성적","환경"],"answer":4,"explain":"여섯 가지 자원은 지적 능력, 지식, 사고방식, 인성, 동기, 환경이다. ④ 학업 성적은 포함되지 않는다.","source":{"page":6,"section":"창의성 연구 동향 - 스턴버그와 루바트(Sternberg \u0026 Lubart)","quote":"사람들은 여섯 가지 자원(지적 능력, 지식, 사고방식, 인성, 동기, 환경)을 누구나 어느 정도 가지고 있으며, 이러한 자원들이 복합적으로 상호작용할 때 창의성이 극대화"}}
