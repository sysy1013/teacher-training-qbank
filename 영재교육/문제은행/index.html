0.2%초등학교에서는영역별로구분되기시작하여예체능(51.42%), 언어논리와수리과학이각각(17.14%)"}},{"id":"51-13","type":"옳은 것","q":"영재 본인이 자신의 특별한 재능을 알게 된 근거 중 가장 높은 비율을 차지한 것은?","box":null,"choices":["경시대회 수상","주변 추천","2개 이상","교사 추천","자기추천"],"answer":5,"explain":"자기추천(31.4%)이 가장 높고, 경시대회 수상(28.57%), 주변 추천(25.71%), 2개 이상(16.66%) 순이다. 교사 추천은 교안에 별도로 제시되지 않았다.","source":{"page":11,"section":"01. 우리나라 영재의 특성 - 영재 본인이 인지한 영재성 시기","quote":"본인의특별한재능을알게된근거로는 경시대회수상(28.57%), 자기추천(31.4%), 주변추천(25.71%), 2 개이상에서는16.66% 순"}},{"id":"51-14","type":"옳은 것","q":"부모가 자녀의 영재성을 인지한 시기에 대한 설명으로 옳은 것은?","box":null,"choices":["2-3세(35.4%)가 가장 많았다.","6-7세(35.4%)가 가장 많았다.","특별한 재능의 분야는 언어논리(33.3%), 예능(28.9%) 순이었다.","4-5세(35.4%), 6-7세(29.1), 2-3세(25%) 순이었다.","특별한 재능의 분야는 수리과학이 가장 많았다."],"answer":4,"explain":"부모가 인지한 시기는 4-5세(35.4%), 6-7세(29.1), 2-3세(25%) 순이며, 특별한 재능 분야는 예능(33.3%), 언어논리(28.9%) 순이다. ①② 시기 오류. ③ 순서 뒤바뀜. ⑤ 교안과 다름.","source":{"page":12,"section":"01. 우리나라 영재의 특성 - 부모가 자녀의 영재성을 인지한 시기","quote":"4 - 5 세(35.4%), 6 - 7 세(29.1), 2 - 3 세(25%) 순, 특별한재능의분야로예능(33.3%), 언어논리(28.9%) 순"}},{"id":"51-15","type":"옳지 않은 것","q":"부모가 자녀의 영재성을 인지한 시기와 관련하여 부모가 응답한 자녀의 특성으로 교안에 제시되지 않은 것은?","box":null,"choices":["생활, 놀이, 학습 등 모든 면에서 전반적으로 월등히 빠른 과업성취와 흥미를 보였다.","책을 본다든가 놀이를 할 때 집중하는 시간이 길고, 한두 번 본 것에 대한 기억력이 뛰어났다.","문제 하나를 가지고 며칠씩 고민하여 결국 해결했다.","평소 생활에서 학습활동이 매우 많았고 정해진 학습 시간을 철저히 지켰다.","스스로 문제를 인내심 있게 푸는 것을 좋아했다."],"answer":4,"explain":"교안은 '평소 생활에 학습활동이 적은 편이나 학교수업 또는 자율적 학습 시 집중력이 뛰어나고 학습요점을 정확히 파악함'이라고 했다. ④는 반대 서술이다.","source":{"page":14,"section":"01. 우리나라 영재의 특성 - 부모가 자녀의 영재성을 인지한 시기","quote":"평소생활에학습활동이적은편이나학교수업또는자율적학습시집중력이 뛰어나고학습요점을정확히파악함스스로문제를인내심있게푸는것을좋아함"}},{"id":"51-16","type":"빈칸","q":"부모가 응답한 영재 자녀의 특성이다. (   )에 들어갈 말로 알맞은 것은?","box":"책을 본다든가 놀이를 할 때 집중하는 시간이 길고, 한두 번 본 것에 대한 기억력이 뛰어났음. 받아들이는 속도가 빠르고 (   )이 높았음","choices":["이해력","운동능력","사교성","순응성","경쟁심"],"answer":1,"explain":"받아들이는 속도가 빠르고 '이해력'이 높았다. 나머지는 교안의 해당 문장과 다르다.","source":{"page":13,"section":"01. 우리나라 영재의 특성 - 부모가 자녀의 영재성을 인지한 시기","quote":"받아들이는속도가빠르고이해력이높았음문제하나를가지고며칠씩고민하여결국해결했음"}},{"id":"51-17","type":"보기 조합","q":"교안에 '높은 창의적 인성(본인 및 부모의 응답)'으로 제시된 항목을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 필요하면 내 생각이나 의견을 과감히 바꿈\nㄴ. 새로운 일을 경험하는 일이 나에게는 즐거움\nㄷ. 자발적으로 박물관, 실험실 등을 찾아간 적이 있음\nㄹ. 나만의 독창적인 생각을 함","choices":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":5,"explain":"ㄱ~ㄹ 모두 '높은 창의적 인성' 항목이다. 이 밖에 특별한 주제·학업영역에 지속적인 의구심을 가짐, 호기심이 많아 사물을 자세히 조사하거나 많은 질문을 함, 독특한 산출물을 만들어냄 등이 있다.","source":{"page":15,"section":"01. 우리나라 영재의 특성 - 높은 창의적 인성(본인 및 부모의 응답)","quote":"필요하면내생각이나 의견을과감히바꿈새로운일을경험하는일이나에게는즐거움특별한주제또는특별한학업영역에지속적인의구심을갖음자발적으로박물관, 실험실 등을찾아간적이있음"}},{"id":"51-18","type":"개념 찾기","q":"다음은 우리나라 영재의 특성(본인 및 부모의 응답) 중 어느 능력 영역에 해당하는가?","box":"‣ 다른 동년배들이 인식하지 못하는 것을 이해\n‣ 타인은 물론 자신에게도 비판적","choices":["언어","논리","수학","공간","음악"],"answer":2,"explain":"제시된 항목은 '논리' 능력에 해당한다. ① 언어: 말을 일찍 시작함, 독서할 때 장시간 집중함. ③ 수학: 수와 관련지어 생각하기를 좋아함 등. ④ 공간: 퍼즐·기계장난감 분리·조립 등. ⑤ 음악: 들었던 멜로디 재현 등.","source":{"page":16,"section":"01. 우리나라 영재의 특성 - 언어, 논리 능력(본인 및 부모의 응답)","quote":"논리 / ‣ 다른 동년배들이인식하지못하는것을이해‣ 타인은 물론자신에게도비판적"}},{"id":"51-19","type":"옳은 것","q":"우리나라 영재의 특성(본인 및 부모의 응답)에서 능력 영역과 특성의 연결로 옳은 것은?","box":null,"choices":["언어 – 수와 관련을 지어 생각하기를 좋아함","수학 – 자연과 사물의 기능에 대해서 질문함","과학 – 자연이나 과학과 관련된 TV 프로그램이나 책을 즐겨 찾음","시각 – 들었던 멜로디를 노래로, 또는 악기로 재현해 냄","음악 – 동화책을 볼 때 그림에 더 관심이 많음"],"answer":3,"explain":"과학 능력: 자연이나 과학 관련 TV 프로그램이나 책을 즐겨 찾음, 자연과 사물의 기능에 대해 질문함. ① 수학 특성. ② 과학 특성. ④ 음악 특성. ⑤ 시각 특성.","source":{"page":17,"section":"01. 우리나라 영재의 특성 - 수학, 과학 능력(본인 및 부모의 응답)","quote":"자연이나 과학과관련된TV 프로그램이나 책을즐겨찾음‣ 자연과 사물의기능에대해서질문함"}},{"id":"51-20","type":"개념 찾기","q":"다음 특성에 해당하는 능력 영역은?","box":"‣ 본 것에 대해 아주 세부적인 것까지도 기억함\n‣ 동화책을 볼 때 그림에 더 관심이 많음","choices":["공간","음악","신체운동","시각","언어"],"answer":4,"explain":"제시된 특성은 '시각' 능력이다. ① 공간: 퍼즐·기계장난감 분리·조립, 그림 요소 배치 계획. ② 음악: 멜로디 재현, 음악적 활동에 강한 관심. ③ 신체운동: 걷기를 일찍 시작함 등. ⑤ 언어: 말을 일찍 시작함 등.","source":{"page":18,"section":"01. 우리나라 영재의 특성 - 음악, 시각 능력(본인 및 부모의 응답)","quote":"시각 / ‣ 본것에 대해아주세부적인것까지도기억함‣ 동화책을 볼때그림에 더관심이 많음"}},{"id":"51-21","type":"옳지 않은 것","q":"교안에 제시된 공간 및 신체운동 능력(본인 및 부모의 응답)의 특성으로 옳지 않은 것은?","box":null,"choices":["퍼즐이나 기계장난감들을 분리하고 다시 끼워 맞추기를 좋아함","그림에 중요한 요소를 사용하고 배치할 것을 미리미리 계획함","걷기를 일찍 시작함","눈과 손이 협동하는 작업에 효율성이 있음","평균 아동에 비해서 체격 면에서 왜소하고 허약함"],"answer":5,"explain":"교안은 신체운동 특성으로 '평균 아동에 비해서 건강하고 체격 면에서 우월함'을 제시했다. ⑤는 반대 서술이다.","source":{"page":19,"section":"01. 우리나라 영재의 특성 - 공간, 신체운동 능력(본인 및 부모의 응답)","quote":"걷기를 일찍시작함‣ 눈과 손이협동하는작업에효율성이있음‣ 평균 아동에비해서건강하고체격면에서우월함"}},{"id":"51-22","type":"개념 찾기","q":"교안에서 다음 응답 항목들이 제시된 영역은?","box":"• 나는 내가 다른 사람들처럼 가치 있는 사람이라고 생각\n• 나는 나 자신에 대해 별로 자부심을 가지고 있지 않음\n• 나는 나 자신에 대하여 긍정적인 태도를 가지고 있음","choices":["학습동기","감성지능","자아개념, 자아존중감","과제집착력","사회적 특성"],"answer":3,"explain":"제시된 항목은 '자아개념, 자아존중감(본인 및 부모의 응답)' 영역이다. ①② 공부 목표 설정, 표정으로 기분 파악 등. ④⑤ 꾸준히 앉아서 공부, 지도자 역할 등.","source":{"page":20,"section":"01. 우리나라 영재의 특성 - 자아개념, 자아존중감(본인 및 부모의 응답)","quote":"나는내가다른사람들처럼가치있는사람이라고생각나는나자신에 대해별로자부심을가지고있지않음나는나자신에 대하여긍정적인태도를가지고있음"}},{"id":"51-23","type":"사례","q":"다음 응답 항목들이 교안에서 제시된 영역은?","box":"• 나는 얼굴 표정만 봐도 그 사람의 기분을 알 수 있음\n• 나는 화가 나면 기분을 가라앉혀 보려고 노력함","choices":["감성지능","자아존중감","과제집착력","창의적 인성","논리 능력"],"answer":1,"explain":"타인의 기분 파악과 자기 감정 조절 항목은 '학습동기, 감성지능' 영역 중 감성지능에 해당한다. 같은 쪽의 학습동기 항목은 '내가 할 확실한 공부의 목표를 누군가가 설정해 주는 것을 좋아함', '성적이 어떠하든지, 내가 공부를 열심히 할 수 있었다는 것에 만족함'이다.","source":{"page":21,"section":"01. 우리나라 영재의 특성 - 학습동기, 감성지능(본인 및 부모의 응답)","quote":"나는얼굴표정만봐도그사람의 기분을알수있음 나는화가나면기분을가라앉혀보려고노력함"}},{"id":"51-24","type":"보기 조합","q":"교안의 '과제집착력, 사회적 특성(본인 및 부모의 응답)'에 제시된 항목을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 어렵고 복잡한 문제일수록 풀어야 직성이 풀림\nㄴ. 또래들 사이에서 지도자 역할을 함\nㄷ. 친구들 사이의 분쟁을 잘 조정함\nㄹ. 다른 사람의 판단에 의존하여 결정함","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ·ㄴ·ㄷ은 교안 항목이다. ㄹ 교안은 '독립적으로 판단함'을 제시했다. 이 밖에 시험공부 시 꾸준히 앉아서 공부함, 인기가 있음, 기대 이상의 책임감, 주저 없이 발표함, 지시적인 방법으로 일을 처리함 등이 있다.","source":{"page":22,"section":"01. 우리나라 영재의 특성 - 과제집착력, 사회적 특성(본인 및 부모의 응답)","quote":"어렵고복잡한문제일수록풀어야직성이풀림독립적으로판단함인기가있음그에게기대하는이상의책임감을가지고있음또래들사이에서지도자역할을함"}},{"id":"51-25","type":"옳지 않은 것","q":"우리나라 영재들이 '학교 정규수업' 때문에 학교생활에 불만족한 이유로 교안에 제시되지 않은 것은?","box":null,"choices":["수업 내용이 너무 쉬워서, 흥미요소 부족","교과서 위주의 재미없는 수업","수업 내용의 이해력, 상상보다 암기력 위주의 평가방식","평균이 맞춰진 수업레벨","수업 내용이 너무 어려워서 따라가기 힘듦"],"answer":5,"explain":"교안은 '수업 내용이 너무 쉬워서, 흥미요소 부족'을 제시했다. ⑤는 반대 서술이다.","source":{"page":24,"section":"02. 우리나라 영재의 교육환경 - 학교생활 불만족 이유(학교 정규수업)","quote":"수업 내용이너무쉬워서, 흥미요소 부족‣ 교과서 위주의재미없는수업‣ 수업 내용의이해력상상보다암기력위주의평가방식‣ 평균이 맞춰진수업레벨등"}},{"id":"51-26","type":"사례","q":"다음은 영재들이 응답한 학교생활 불만족 이유이다. 교안에서 이 내용이 제시된 범주는?","box":"‣ 친구들이 좋아하지 않았음\n‣ 자연스럽게 피상적인 인간관계가 성립\n‣ 성격 및 환경 차이로 많은 친구들과 상호이해하지 못함\n‣ 대인관계가 좁음","choices":["학교 정규수업","선생님과 관계","학교 친구와 관계","학교행사와 특별활동","영재교육기관"],"answer":3,"explain":"제시된 내용은 '학교 친구와 관계' 범주이다. ② 선생님의 편애, 건방진 아이로 보는 선생님 등. ④ 형식적, 시간 때우기 등. ① 쉬운 수업, 암기력 위주 평가 등.","source":{"page":26,"section":"02. 우리나라 영재의 교육환경 - 학교생활 불만족 이유(학교 친구와 관계)","quote":"친구들이 좋아하지않았음‣ 자연스럽게 피상적인인간관계가성립‣ 성격 및환경 차이로많은친구들과상호이해하지못함‣ 대인관계가 좁음등"}},{"id":"51-27","type":"옳은 것","q":"'선생님과 관계'로 인한 학교생활 불만족 이유로 교안에 제시된 것은?","box":null,"choices":["선생님이 지나치게 높은 수준의 과제를 부여함","여전히 건방진 아이로 보는 선생님이 계심","선생님이 영재 학생에게만 지나친 관심을 보임","선생님과의 상담 시간이 너무 많음","선생님이 속진·심화 학습만 강요함"],"answer":2,"explain":"교안은 선생님의 편애로 인한 갈등, 여전히 건방진 아이로 보는 선생님, 모범생이 아니어서 관심 밖, 일부 권위적이고 무능력한 교사, 성의 없이 수업 준비하는 선생님 등을 제시했다. 나머지는 교안에 없다.","source":{"page":25,"section":"02. 우리나라 영재의 교육환경 - 학교생활 불만족 이유(선생님과 관계)","quote":"선생님의 편애하는학생과그렇지못한학생간의갈등‣ 여전히 건방진아이로보는선생님계심‣ 모범생이 아니어서선생님관심밖에있음"}},{"id":"51-28","type":"옳지 않은 것","q":"'학교행사와 특별활동'으로 인한 학교생활 불만족 이유로 교안에 제시되지 않은 것은?","box":null,"choices":["특별한 흥미를 느낄 수 없었음","'특별 시간' 활동이 없었음(학교에서 제공하지 않음)","시간 때우기 같았음","담당교사들의 불성실한 태도","행사가 너무 많아 학업에 방해가 됨"],"answer":5,"explain":"교안은 흥미 없음, 형식적임, '특별 시간' 활동 없음, 시간 때우기, 형식적이고 지루한 행사, 담당교사들의 불성실한 태도, 학교 지원 부족 등을 제시했다. ⑤는 교안에 없다.","source":{"page":27,"section":"02. 우리나라 영재의 교육환경 - 학교생활 불만족 이유(학교행사와 특별활동)","quote":"특별한 흥미를느낄수없었음 ‣ 형식적임 ‣ '특별 시간' 활동 없었음(학교에서 제공하지않음)‣ 시간 때우기같았음"}},{"id":"51-29","type":"옳은 것","q":"영재교육기관의 만족도가 높은 이유에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["영재학급, 영재교육원은 일반학교보다 학업 스트레스가 낮아 만족도가 높다.","과학고등학교와 영재학교 학생들의 만족도는 중학교나 일반고등학교 때와 비슷하다.","만개효과(Bloomin effect)의 요인으로 나와 수준이 같은 또래학생, 나를 이해해 주고 격려해 주는 선생님, 지적 호기심과 속진·심화 학습이 가능한 수업방식 등이 있다.","만개효과는 수준이 다양한 또래와 함께 배울 때 나타난다.","영재교육기관은 수업 만족도가 낮은 편이다."],"answer":3,"explain":"만개효과(Bloomin effect)의 요인은 같은 수준의 또래, 이해·격려하는 선생님, 속진·심화 학습이 가능한 수업방식 등이다. ① 학업 스트레스는 높긴 하나 수업 만족도가 높음. ② 현저히 높음. ④ 나와 수준이 같은 또래. ⑤ 만족도가 높은 편.","source":{"page":28,"section":"02. 우리나라 영재의 교육환경 - 영재교육기관이 만족도가 높은 이유","quote":"일반학교보다영재학급, 영재교육원에서 학업에대한스트레스가높긴하나, 대체로 수업의만족도가높은편임"}}]},{"lesson":52,"title":"영재들에게 상담이 필요한 이유","file":"4. 교안 (31~60)[1] (1)/52.pdf","summary":["영재에 대한 편견: \"탁월한 영재성이 있기 때문에 적응에 어려움이 없고 특별한 교육이 없어도 잘 성장할 것이다\" – 터먼(Terman) 등의 연구가 부정적 영향","홀링워스(Hollingworth): 아동의 정서와 성인의 지적능력을 동시에 가지면 어려움에 직면 / 알트만(Altman): 특별한 욕구와 문제 → 특별한 교육·조치 필요 / 림(Rimm): 학습부진 및 미성취, 부적응 문제 연구와 상담 필요","새도스키(Sadowski): 고등학교 중퇴 영재 – 가정 불안정, 음주·마약, 학교 동기 낮음, 학교와 권위에 반항적 → 상담 부재, 부모·교사와의 의사소통 부적절","쿠키뉴스(2023. 9. 14) \"학교 떠나는 천재들\": 만 10세 서울과학고 입학 백강현 군 자퇴 / 류지영 센터장: 고도영재는 멘토링과 상담 동시 진행 / 오성환 교장: 지적인 또래와 정서적인 또래의 불일치 / 교육부·과기부 고도영재 지원책 확대","WHO 헌장: 건강이란 질병이 없는 상태만이 아니라 신체적·심리적·사회적으로 건전함(sound)","영재학생이 말하는 편견과 역차별: 완벽 기대, 이야기 나눌 친구 거의 없음, 놀림감(괴물), 세상 문제 걱정 → 무력감","영재상담이 어려운 이유: 성적 하락·문제 있는 것으로 인식될까 걱정 / 모든 문제를 혼자 해결해야 한다고 착각, 도움 청하기에 익숙지 않음","방향성: 중요성 인식·제도적 장치 마련, 가정·학교·지역사회 상담 기회 확대","실제: 학교 내부 – 일부 기관만 상담전문가, 외부 정신과 의사·심리학자 초빙 / 학교 외부 – 주로 일반 상담센터, 개인 특성·가정환경 접근, 체계적·차별화된 상담 어려움","반타셀-바스카(VanTassel-Baska) 영재상담 지침: 인지적·사회정의적 특성 이해, 이질감·열등감·사회적 고립 없이 영재성 이해 / 관계 속 의미 → 정체감과 높은 자존감","영재 담당교사: 영재에 대한 전문성 + 상담에 대한 전문성 → 상담가로 적합","영재상담: 생활 속 문제와 과제 해결, 사고·행동·감정의 변화 도모 → 정신적인 성숙과 발전을 이루도록 조력하는 과정"],"questions":[{"id":"52-01","type":"빈칸","q":"다음은 영재에 대한 교사, 학부모, 정책 행정가 등의 편견이다. 이러한 편견에 부정적 영향을 준 연구로 교안에 제시된 것은?","box":"영재는 탁월한 영재성이 있기 때문에, 적응에 어려움이 없고, 특별한 교육이 없어도 잘 성장할 것이다.","choices":["홀링워스(Hollingworth) 등의 연구","터먼(Terman) 등의 연구","림(Rimm) 등의 연구","새도스키(Sadowski) 등의 연구","알트만(Altman) 등의 연구"],"answer":2,"explain":"터먼(Terman) 등의 연구는 영재학생들이 인지적·정의적·사회적 측면에서 매우 우수하여 적응에 어려움이 없으므로 특별한 문제나 조치가 필요하지 않다는 부정적 영향을 주었다. 홀링워스·알트만·림·새도스키는 영재에게 상담이 필요한 이유를 제시한 학자들이다.","source":{"page":3,"section":"01. 영재상담의 이슈 - 영재에 대한 편견","quote":"터먼(Terman) 등의연구 / ‣ 영재학생들은 인지적· 정의적 · 사회적 측면에서매우우수하여적응에어려움이없으므로특별한문제나그조치가 필요하지않다는부정적영향이있음"}},{"id":"52-02","type":"개념 찾기","q":"영재에게 상담이 필요한 이유와 관련하여 다음 주장을 한 학자는?","box":"영재 아동이 아동의 정서와 성인의 지적능력을 동시에 갖고 있다면, 분명 어려움에 직면하게 됨","choices":["터먼(Terman)","림(Rimm)","알트만(Altman)","홀링워스(Hollingworth)","새도스키(Sadowski)"],"answer":4,"explain":"홀링워스(Hollingworth)의 주장이다. ① 터먼은 영재가 적응에 어려움이 없다는 편견에 영향. ② 림은 학습부진·미성취·부적응 연구와 상담 필요. ③ 알트만은 특별한 욕구와 문제로 특별한 교육·조치 필요. ⑤ 새도스키는 고등학교 중퇴 영재 연구.","source":{"page":4,"section":"01. 영재상담의 이슈 - 영재에게 상담이 필요한 이유","quote":"홀링워스Hollingworth영재에게상담이필요한이유 / ‣ 영재 아동이아동의정서와성인의지적능력을동시에갖고있다면, 분명 어려움에직면하게됨"}},{"id":"52-03","type":"옳은 것","q":"영재에게 상담이 필요한 이유에 대한 학자와 주장의 연결로 옳은 것은?","box":null,"choices":["알트만(Altman) – 영재 아동의 학습부진 및 미성취, 부적응의 문제에 대한 연구와 상담이 필요함","림(Rimm) – 영재 아동에게는 특별한 욕구와 문제가 있어서 특별한 교육이나 조치가 필요함","림(Rimm) – 영재 아동의 학습부진 및 미성취, 부적응의 문제에 대한 연구와 상담이 필요함","홀링워스(Hollingworth) – 고등학교를 중퇴한 영재들은 가정이 불안정함","새도스키(Sadowski) – 아동의 정서와 성인의 지적능력을 동시에 가지면 어려움에 직면함"],"answer":3,"explain":"림(Rimm)은 학습부진·미성취·부적응 문제에 대한 연구와 상담의 필요성을 주장했다. ①② 알트만과 림의 주장이 뒤바뀜. ④⑤ 홀링워스와 새도스키의 주장이 뒤바뀜.","source":{"page":4,"section":"01. 영재상담의 이슈 - 영재에게 상담이 필요한 이유","quote":"림Rimm / ‣ 영재 아동의학습부진및미성취 , 부적응의 문제에대한연구와상담이필요함"}},{"id":"52-04","type":"옳지 않은 것","q":"새도스키(Sadowski)가 밝힌 고등학교를 중퇴한 영재들의 특징으로 옳지 않은 것은?","box":null,"choices":["가정이 불안정하다.","음주와 마약을 한다.","학교에 대한 동기가 낮다.","학교와 권위에 대해 반항적이다.","상담을 충분히 받았으나 학업 부담으로 중퇴하였다."],"answer":5,"explain":"새도스키는 이러한 특징이 상담을 제대로 받지 못하고 부모와 교사와의 의사소통도 부적절했기 때문이라고 했다. ⑤는 반대 서술이다.","source":{"page":5,"section":"01. 영재상담의 이슈 - 영재에게 상담이 필요한 이유","quote":"학교와 권위에대해반항적‣ 이는 상담을제대로받지못하고부모와교사와의의사소통도부적절했기때문"}},{"id":"52-05","type":"빈칸","q":"다음은 교안의 Tips! 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"영재아동도 상당한 정도의 부적응과 학업부담 등 스트레스를 받아 (   )(으)로 이어질 수 있음","choices":["영재성의 상실","조기 졸업","과잉 성취","속진 학습","영재성의 강화"],"answer":1,"explain":"스트레스는 '영재성의 상실'로 이어질 수 있다. 나머지는 교안 문장과 다르다.","source":{"page":5,"section":"01. 영재상담의 이슈 - 영재에게 상담이 필요한 이유","quote":"영재아동도상당한정도의부적응과학업부담등스트레스를받아영재성의상실로이어질수있음"}},{"id":"52-06","type":"옳은 것","q":"교안에 제시된 기사 '학교 떠나는 천재들…\"심리·정서 지원 중요\"'(쿠키뉴스, 2023. 9. 14)에 대한 설명으로 옳은 것은?","box":null,"choices":["백강현 군은 만 12세에 영재학교인 한국과학영재학교에 입학하였다.","백강현 군은 만 10세에 영재학교인 서울과학고에 입학하였고, 자퇴 이후 영재에 대한 국가적 지원 필요성이 강조되었다.","백 군의 아버지는 어린 영재에 대한 국가지원이 충분하다고 밝혔다.","백강현 군은 서울과학고를 조기졸업하였다.","영재교육 관리주체인 교육부와 행정안전부가 고도영재 지원책 확대를 밝혔다."],"answer":2,"explain":"만 10세에 서울과학고에 입학한 백강현 군의 자퇴 이후 영재에 대한 국가적 지원 필요성이 강조되었다. ① 만 10세, 서울과학고. ③ \"어린 영재 아이에 대한 국가지원이 부족하다\". ④ 자퇴. ⑤ 교육부와 과기부.","source":{"page":6,"section":"01. 영재상담의 이슈 - 심리·정서 지원의 중요성","quote":"만10세에영재학교인서울과학고에입학한백강현군. / 자퇴한그를둘러싼논란이후영재에대한국가적지원필요성이강조되고 있다."}},{"id":"52-07","type":"사례","q":"다음 발언을 한 인물로 교안에 제시된 것은?","box":"\"고도영재들은 학습속도가 빠르고 높은 몰입도 및 과제집착력을 보이지만, 아동의 정서를 보이며, 심리·정서 적응을 위한 멘토링과 상담을 동시에 진행해야 한다.\"","choices":["오성환 서울과학고등학교 교장","백강현 군의 아버지","교육부 장관","류지영 카이스트 과학영재교육연구원 영재정책센터장","반타셀-바스카(VanTassel-Baska)"],"answer":4,"explain":"류지영 카이스트 과학영재교육연구원 영재정책센터장의 발언이다. ① 오성환 교장은 지적인 또래와 정서적인 또래의 불일치 해결을 고민해야 한다고 했다. ② 국가지원 부족. ③ 교안에 발언 없음. ⑤ 영재상담 지침 제시 학자.","source":{"page":7,"section":"01. 영재상담의 이슈 - 심리·정서 지원의 중요성","quote":"류지영카이스트과학영재교육연구원영재정책센터장 “고도영재들은학습속도가빠르고높은몰입도및과제집착력을보이지만, 아동의정서를보이며, 심리·정서적응을위한멘토링과상담을동시에 진행해야한다.”"}},{"id":"52-08","type":"빈칸","q":"오성환 서울과학고등학교 교장의 발언이다. (   )에 들어갈 말로 알맞은 것은?","box":"\"서울과학고에 근무하면서 아이들을 위한 정서적 지원이 중요함을 느꼈으며, (   )인 또래와 (   )인 또래가 불일치하는 경우가 있는데, 이 불일치를 어떻게 해결할지 고민해야 한다.\"","choices":["신체적 – 정서적","지적 – 사회적","지적 – 정서적","학업적 – 신체적","사회적 – 정서적"],"answer":3,"explain":"'지적인 또래와 정서적인 또래'의 불일치이다. 나머지는 교안 발언과 다르다.","source":{"page":7,"section":"01. 영재상담의 이슈 - 심리·정서 지원의 중요성","quote":"지적인또래와정서적인또래가불일치하는경우가있는데, 이불일치를어떻게 해결할지고민해야해야한다."}},{"id":"52-09","type":"빈칸","q":"다음은 세계보건기구(WHO) 헌장의 건강(health)에 대한 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"건강(health)이란 질병이 없는 상태만을 뜻하는 것이 아니라 신체적으로, 심리적으로, (   ) 건전함(sound)을 뜻한다.","choices":["경제적으로","지적으로","영적으로","정서적으로","사회적으로"],"answer":5,"explain":"WHO 헌장은 신체적으로, 심리적으로, '사회적으로' 건전함(sound)을 건강으로 정의한다.","source":{"page":9,"section":"02. 건강하고 행복한 영재상담 - 세계보건기구 WHO 헌장","quote":"건강(health)이란질병이없는상태만을뜻하는것이아니라신체적으로, 심리적으로 , 사회적으로 건전함(sound)을뜻한다 ."}},{"id":"52-10","type":"옳지 않은 것","q":"영재학생이 말하는 편견과 역차별로 교안에 제시되지 않은 것은?","box":null,"choices":["누구도 영재라는 것이 무엇인지 확실히 알려 주지 않아 나 혼자만의 문제가 됨","부모, 교사, 심지어 친구들까지 도와주지는 않고 모든 면에서 내가 완벽하기만을 기대함","나를 이해해 주고 이야기를 나눌 수 있는 친구가 거의 없음","학교 수업이 너무 어려워 따라가기 벅참","반에서나 학교에서 놀림감(괴물)이 되기도 함"],"answer":4,"explain":"교안은 '학교 수업이 너무 쉽거나 너무 지겨움'이라고 했다. ④는 반대 서술이다.","source":{"page":10,"section":"02. 건강하고 행복한 영재상담 - 영재학생이 말하는 편견과 역차별","quote":"누구도영재라는것이무엇인지확실히알려주지않아,     나혼자만의 문제가됨학교수업이너무쉽거나너무지겨움부모, 교사 , 심지어 친구들까지도와주지는않고, 모든면에서내가완벽하기만을기대함"}},{"id":"52-11","type":"빈칸","q":"영재학생이 말하는 편견과 역차별이다. (   )에 들어갈 말로 알맞은 것은?","box":"주위와 세상에서 일어나는 여러 가지 문제에 대하여 걱정을 많이 하지만, 실제로 무엇을 해야 할지 몰라서 (   )이 들 때도 있음","choices":["무력감","우월감","책임감","성취감","기대감"],"answer":1,"explain":"무엇을 해야 할지 몰라서 '무력감'이 들 때도 있다.","source":{"page":11,"section":"02. 건강하고 행복한 영재상담 - 영재학생이 말하는 편견과 역차별","quote":"주위와세상에서일어나는여러가지문제에대하여걱정을많이하지만, 실제로 무엇을해야할지몰라서무력감이들때도 있음"}},{"id":"52-12","type":"보기 조합","q":"우리나라에서 영재상담이 어려운 이유로 교안에 제시된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 상담을 받으면 학업성적이 떨어질까 걱정함\nㄴ. 상담을 받으면 자신이 문제가 있는 것으로 인식될까 걱정함\nㄷ. 자신에게 주어진 모든 문제를 혼자 해결해야 하는 것으로 착각함\nㄹ. 다른 사람에게 도움을 청하는 것에 지나치게 익숙함","choices":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"ㄱ·ㄴ·ㄷ은 교안 내용이다. ㄹ 교안은 '다른 사람에게 도움을 청하는 것에 익숙지 않아서' 효과적으로 도움을 받지 못한다고 했다.","source":{"page":13,"section":"02. 건강하고 행복한 영재상담 - 우리나라에서 영재상담이 어려운 이유는 무엇일까요?","quote":"자신에게주어진모든문제를혼자해결해야하는것으로착각하거나, 다른 사람에게도움을청하는것에익숙지않아서큰어려움에 직면하더라도효과적으로도움을받지못하는경우도있음"}},{"id":"52-13","type":"옳은 것","q":"우리나라에서 영재상담이 어려운 이유에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["영재교육기관에 다니는 영재학생들은 일반학생들보다 학교생활에 적응하지 못하는 경우가 많다.","영재학생들은 일반학생들보다 학업성적이 낮아 상담을 기피한다.","일반적으로 영재교육기관에 다니는 영재학생들은 학업성적이 우수하고 학교생활에 잘 적응하는 경우가 많다.","학교나 지역사회에서 영재가 상담을 받는 기회가 일반학생보다 많다.","영재학생들은 상담이 학업성적 향상에 도움이 된다고 기대한다."],"answer":3,"explain":"영재학생들은 일반적으로 학업성적이 우수하고 학교생활에 잘 적응하는 경우가 많으며, 상담을 받으면 성적이 떨어지거나 문제 있는 것으로 인식될까 걱정한다. ①② 반대. ④ 상담 받는 기회가 적을 수 있음. ⑤ 성적이 떨어질까 걱정함.","source":{"page":12,"section":"02. 건강하고 행복한 영재상담 - 우리나라에서 영재상담이 어려운 이유는 무엇일까요?","quote":"일반적으로영재교육기관에다니는영재학생들은일반학생들보다학업성적이우수하고, 학교생활에잘적응하는 경우가많음상담을받으면학업성적이떨어질까,                             자신이문제가있는것으로인식될까걱정함"}},{"id":"52-14","type":"옳지 않은 것","q":"우리나라에서 영재상담의 방향성으로 교안에 제시된 내용으로 옳지 않은 것은?","box":null,"choices":["영재상담의 중요성을 잘 인식해야 한다.","영재상담을 위한 제도적 장치를 마련해야 한다.","가정과 학교, 지역사회에서 영재학생들을 위한 상담 기회를 확대해야 한다.","영재학생들이 잠재력을 최대한 발휘하고 행복하고 건강한 삶을 살 수 있도록 도와야 한다.","영재상담은 학교 내부로 한정하여 지역사회의 개입을 줄여야 한다."],"answer":5,"explain":"교안은 가정과 학교, 지역사회에서 상담 기회를 확대해야 한다고 했다. ⑤는 반대 서술이다.","source":{"page":14,"section":"02. 건강하고 행복한 영재상담 - 우리나라에서 영재상담의 방향성은 무엇일까요?","quote":"영재상담의중요성을잘인식하고 , 제도적 장치를마련해야함가정과학교, 지역사회에서 영재학생들을위한상담기회를확대해야함"}},{"id":"52-15","type":"옳은 것","q":"우리나라 영재상담의 실제에 대한 설명으로 옳은 것은?","box":null,"choices":["학교 내부에서는 모든 기관에 상담전문가가 배치되어 있다.","학교 외부에서는 주로 영재 전문 상담센터에서 상담이 이루어진다.","학교 외부 상담은 영재의 영재성에 맞춘 접근이 주로 이루어진다.","학교 내부에서는 외부 정신과 의사나 심리학자를 초빙하여 영재상담, 영재 부모교육을 진행한다.","학교 외부에서는 영재를 위한 체계적이고 차별화된 상담이 이루어지고 있다."],"answer":4,"explain":"학교 내부: 일부 기관에서만 상담전문가 배치, 외부 정신과 의사나 심리학자 초빙. 학교 외부: 주로 일반 상담센터, 개인의 특성과 가정환경으로의 접근, 체계적·차별화된 상담으로 보기 어려움. ①②③⑤는 이와 다르다.","source":{"page":15,"section":"02. 건강하고 행복한 영재상담 - 우리나라 영재상담의 실제","quote":"일부 기관에서만상담전문가가배치됨• 외부 정신과의사나심리학자를초빙하여 영재상담, 영재 부모교육을진행함"}},{"id":"52-16","type":"사례","q":"다음은 우리나라 영재상담의 실제 중 어느 영역에 대한 설명인가?","box":"• 주로 일반 상담센터에서 이루어짐\n• 영재의 영재성에 맞춘 접근보다는 개인의 특성과 가정환경으로의 접근이 이루어지고 있음\n• 영재를 위한 체계적이고 차별화된 상담으로 이루어진다고 보기는 어려움","choices":["학교 외부","학교 내부","영재교육원","영재학급","영재 담당교사"],"answer":1,"explain":"제시된 내용은 '학교 외부' 상담의 실제이다. 학교 내부는 일부 기관에서만 상담전문가가 배치되고, 외부 정신과 의사·심리학자를 초빙해 진행한다.","source":{"page":15,"section":"02. 건강하고 행복한 영재상담 - 우리나라 영재상담의 실제","quote":"주로 일반상담센터에서이루어짐• 영재의 영재성에맞춘접근보다는개인의특성과가정환경으로의접근이이루어지고있음"}},{"id":"52-17","type":"옳은 것","q":"영재의 특성을 고려한 상담의 필요성에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["영재상담은 일반상담과 완전히 동일하다.","영재상담은 일반상담과 공통점이 전혀 없다.","영재에게는 대인간 갈등이나 내적 갈등을 일으키는 특성이 존재하지 않는다.","영재상담은 영재의 독특함으로 인해 일반상담과 공통점·차이점이 공존한다.","영재상담은 내적 갈등보다 학업 문제만 다룬다."],"answer":4,"explain":"영재상담은 영재의 독특함으로 일반상담과 공통점·차이점이 공존하며, 영재에게는 잠재적인 대인간 갈등 및 내적인 갈등을 일으키는 여러 특성이 존재한다. 나머지는 이와 반대이다.","source":{"page":16,"section":"02. 건강하고 행복한 영재상담 - 영재의 특성을 고려한 상담의 필요성","quote":"영재상담은영재의독특함으로인해일반상담과공통점· 차이점이 공존영재에게는잠재적인대인간갈등 및내적인 갈등을일으키는여러가지특성이존재"}},{"id":"52-18","type":"개념 찾기","q":"다음 영재상담 지침을 제시한 학자는?","box":"• 영재상담가는 영재의 인지적·사회정의적 특성을 잘 이해해야 함\n• 영재가 이질감, 열등감, 사회적 고립 등을 느끼지 않고 자신의 영재성을 이해하도록 도움을 주어야 함\n• 영재들은 삶의 의미, 내면세계의 의미, 대인관계에서의 의미 등에서 강한 열망이 있음","choices":["홀링워스(Hollingworth)","반타셀-바스카(VanTassel-Baska)","터먼(Terman)","림(Rimm)","탄넨바움(Tannenbaum)"],"answer":2,"explain":"반타셀-바스카(VanTassel-Baska)의 영재상담 지침이다. ① 아동의 정서와 성인의 지적능력. ③ 영재 편견에 부정적 영향. ④ 학습부진·미성취·부적응 연구와 상담. ⑤ 51차시 잠재된 영재성 발현 특성.","source":{"page":17,"section":"02. 건강하고 행복한 영재상담 - 반타셀-바스카의 영재상담 지침","quote":"영재상담가는영재의인지적· 사회정의적 특성을잘이해해야함영재가이질감, 열등감 , 사회적 고립등을느끼지않고자신의영재성을이해하도록도움을주어야함"}},{"id":"52-19","type":"빈칸","q":"반타셀-바스카(VanTassel-Baska)의 영재상담 지침이다. (   )에 들어갈 말로 알맞은 것은?","box":"자신에 대한 탐구는 영재학생이 자신의 영재성을 발견하고, 소중히 다루는 방법을 알게 함. 영재가 다른 사람과의 관계 속에서 어떤 의미를 찾을 수 있다면 (   )을 개발할 수 있음","choices":["경쟁심과 성취동기","논리력과 비판력","정체감과 높은 자존감","독립심과 자율성","창의성과 과제집착력"],"answer":3,"explain":"관계 속에서 의미를 찾으면 '정체감과 높은 자존감'을 개발할 수 있다.","source":{"page":18,"section":"02. 건강하고 행복한 영재상담 - 반타셀-바스카의 영재상담 지침","quote":"영재가다른사람과의관계속에서어떤의미를찾을수있다면정체감과높은자존감을개발할수있음"}},{"id":"52-20","type":"옳지 않은 것","q":"영재 담당교사가 상담가로 적합한 이유로 교안에 제시되지 않은 것은?","box":null,"choices":["일정 기간 영재의 특성을 관찰하고, 각 영재에 대한 자료를 축적해 놓을 수 있다.","영재 수업과 상담을 통합하여 정서 프로그램을 제공할 수 있다.","학생들과 보내는 시간이 많기 때문에 상담의 진행이 원활하고 수시 격려가 가능하다.","정신과 의사 자격을 갖추고 있어 의료적 처치가 가능하다.","학교에서 영재학생과의 경험이 많아 영재를 충분히 이해할 수 있다."],"answer":4,"explain":"영재 담당교사는 영재에 대한 전문성과 상담에 대한 전문성을 겸할 수 있어 상담가로 적합하다. ④ 정신과 의사 자격·의료적 처치는 교안에 없다.","source":{"page":19,"section":"02. 건강하고 행복한 영재상담 - 영재 담당교사와 상담","quote":"영재담당교사는학교에서영재학생과의경험이많아영재를충분히이해할수있으며 상담가로적합함"}},{"id":"52-21","type":"옳은 것","q":"교안에서 영재 담당교사가 상담가로서 겸비할 수 있는 두 가지 전문성으로 제시한 것은?","box":null,"choices":["영재에 대한 전문성, 상담에 대한 전문성","교과에 대한 전문성, 평가에 대한 전문성","의료에 대한 전문성, 상담에 대한 전문성","영재에 대한 전문성, 행정에 대한 전문성","진로에 대한 전문성, 입시에 대한 전문성"],"answer":1,"explain":"교안 도식은 '영재에 대한 전문성'과 '상담에 대한 전문성'의 교집합으로 영재 담당교사의 상담 역할을 제시한다.","source":{"page":19,"section":"02. 건강하고 행복한 영재상담 - 영재 담당교사와 상담","quote":"영재에대한전문성 상담에대한전문성"}},{"id":"52-22","type":"개념 찾기","q":"다음 정의에 해당하는 것은?","box":"생활 속에서 생기는 문제와 과제를 해결하고, 영재의 사고, 행동, 감정의 변화를 도모하여 정신적인 성숙과 발전을 이루도록 조력하는 과정","choices":["영재판별","영재교육","영재상담","심화학습","멘토링"],"answer":3,"explain":"교안의 '영재상담' 정의이다.","source":{"page":20,"section":"02. 건강하고 행복한 영재상담 - 영재상담이란?","quote":"영재상담이란생활속에서생기는문제와과제를해결하고, 영재의사고, 행동 , 감정의 변화를도모하여정신적인성숙과발전을이루도록조력하는과정"}},{"id":"52-23","type":"빈칸","q":"다음 영재상담의 정의에서 (   )에 들어갈 말로 알맞은 것은?","box":"영재상담이란 생활 속에서 생기는 문제와 과제를 해결하고, 영재의 사고, 행동, 감정의 변화를 도모하여 (   )을 이루도록 조력하는 과정","choices":["학업성적의 향상","영재성의 판별","진로의 결정","정신적인 성숙과 발전","사회적 성공"],"answer":4,"explain":"'정신적인 성숙과 발전'을 이루도록 조력하는 과정이다.","source":{"page":20,"section":"02. 건강하고 행복한 영재상담 - 영재상담이란?","quote":"영재의사고, 행동 , 감정의 변화를도모하여정신적인성숙과발전을이루도록조력하는과정"}}]},{"lesson":53,"title":"영재들을 위한 상담기법(1) : 행동수정","file":"4. 교안 (31~60)[1] (1)/53.pdf","summary":["미국심리학회(APA) 상담심리 정의: 정서·사회·교육·건강·발달 및 조직 관심에 초점, 전 생애에 걸쳐 개인적 기능과 사람들 간의 기능 촉진, 정상적 발달 문제뿐 아니라 역기능적 혹은 장애 발달에도 초점","상담심리학 5대 이론: 정신분석, 행동수정, 인본주의, 인지치료, 인지행동정서치료 / 이론 + 실습 = 상담사 또는 치료사","행동주의: 연구대상은 관찰과 측정이 가능한 외현적 행동, 부적응 행동을 소거·제거·둔화하고 새로운 적응적 행동으로 대체, 행동·인지·정서와 통합하여 발전","고전적 조건화: 파블로프 Pavlov의 S→R 실험, 왓슨 Watson의 공포 형성 조건화(12명의 건강한 유아 발언), 모워 Mower의 야뇨증 치료(1938)","스키너 Skinner의 조작적 조건화(인간 행동의 긍정적 변화) → 프로그래밍 학습법","반두라 Bandura 사회학습이론(모방, 대리, 관찰학습), self-efficacy → 아동학습장애, 공포증, 강박장애, 중독치료에 기여 / 중독 → 의존, 남용 / 성인병 → 대사증후군, 생활편협증, 생활습관병","셀리그만 Seligman의 학습된 무기력: 혐오자극에 계속 노출 → 노력이 효과 없다고 느낌 → 무력감으로 아무런 대응도 하지 않음 / 뇌세포 리모컨: 자기장으로 뇌세포 활성 제어(동아사이언스 2021.1.29)","행동수정 인간관: 모든 행동은 학습된 결과, 행동은 예언 및 수정 가능, 성격구조(정신분석)는 없으며 행동 형성 원리만 존재, 조건형성 원리로 문제·부적응 행동 수정","A-B-C 이론(Antecedents-Behavior-Consequences): B 행동 자체보다 A 선행조건이나 C 후속결과를 변화 / 내담자와 치료목표 합의, 내담자의 강한 동기·실천 필요, 상담자는 적극적·지시적","정적 강화: 강화물(생리적·사회적·금전적), 환권보상제 Token(상점 스티커→물건 교환), 조성법 Shaping(테니스 배우기, 물개 공 던지기), 자기 강화 Image Training","부적강화(부적응 행동 소거/제거): 부정적·혐오적 처벌(안전벨트 경고음), 타임아웃 Time Out(일시적으로 고립), 연속적 비강화 소거(투정 무시, 일관되고 지속적인 태도), 변별강화(바람직한 행동은 강화, 문제행동은 무시)","영재상담: 정적강화가 가장 효과적, 학습동기 고취, 자기주도능력 향상(구체적 행동목표 설정→실행→행동수준 평가: 체크리스트, 리커트 척도 등)"],"questions":[{"id":"53-01","type":"옳지 않은 것","q":"미국심리학회(APA)의 상담심리 정의에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["한 사람의 정서, 사회, 교육, 건강, 발달 및 조직에 대한 관심에 초점을 맞춘다.","정상적 발달 문제에만 초점을 맞추며, 역기능적 혹은 장애 발달은 다루지 않는다.","전 생애에 걸쳐 그의 개인적 기능과 사람들 간의 기능을 촉진한다.","행동과 심리적 힘의 건강한 면을 강조한다.","개인들이 직면하는 발달 문제들과 자아정체감 형성, 전체 맥락에서의 사람에 대한 분석이 포함된다."],"answer":2,"explain":"교안은 '정상적 발달 문제뿐 아니라, 역기능적 혹은 장애 발달에도 초점을 맞춤'이라고 정의한다. 따라서 ②는 틀렸다. ①③④⑤는 교안의 APA 정의 내용 그대로이다.","source":{"page":3,"section":"미국심리학회(APA)의 상담심리 정의","quote":"정상적 발달 문제뿐 아니라, 역기능적 혹은 장애 발달에도 초점을 맞춤"}},{"id":"53-02","type":"옳지 않은 것","q":"교안에서 제시한 상담심리학의 5대 이론에 해당하지 않는 것은?","box":null,"choices":["정신분석","인본주의","인지치료","교류분석","인지행동정서치료"],"answer":4,"explain":"상담심리학의 5대 이론은 정신분석, 행동수정, 인본주의, 인지치료, 인지행동정서치료이다. ④ 교류분석은 교안의 5대 이론에 없다.","source":{"page":4,"section":"상담심리학의 5대 이론과 치료기법","quote":"정신분석 ‣ 행동수정 ‣ 인본주의 ‣ 인지치료 ‣ 인지행동정서치료"}},{"id":"53-03","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"이론 + (   ) = 상담사 또는 치료사\n(Theory + Practice = Counselor or Therapist)","choices":["실습","자격","경험","공감","윤리"],"answer":1,"explain":"교안은 '이론 + 실습 = 상담사 또는 치료사(Theory + Practice = Counselor or Therapist)'로 제시한다. Practice에 해당하는 말은 실습이다. ②③④⑤는 교안 공식에 없는 말이다.","source":{"page":4,"section":"상담심리학의 5대 이론과 치료기법","quote":"이론 + 실습 = 상담사 또는 치료사(Theory + Practice = Counselor or Therapist)"}},{"id":"53-04","type":"옳은 것","q":"행동주의 학습이론과 상담에 대한 설명으로 옳은 것은?","box":null,"choices":["심리학의 연구대상은 무의식 속에 억압된 욕구이다.","심리학의 연구대상은 내담자의 주관적 경험과 자아실현 경향성이다.","심리학의 연구대상은 관찰과 측정이 가능한 외현적 행동이다.","부적응 행동은 그대로 두고 적응적 행동만 새로 추가한다.","행동만을 다루며 인지, 정서와의 통합은 배제한다."],"answer":3,"explain":"교안: '심리학의 연구대상은 관찰과 측정이 가능한 외현적 행동'. ①은 정신분석, ②는 인본주의 쪽 내용이다. ④ 교안은 부적응 행동을 소거, 제거, 둔화하고 새로운 적응적 행동으로 대체한다고 했다. ⑤ 교안은 행동, 인지, 정서와 통합하여 발전한다고 했다.","source":{"page":5,"section":"행동주의 학습이론과 상담","quote":"심리학의 연구대상은 관찰과 측정이 가능한 외현적 행동"}},{"id":"53-05","type":"보기 조합","q":"행동주의 학습이론과 상담에 대한 설명으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 학습장애, 심리적 장애 등 부적응 행동을 소거, 제거, 둔화한다.\nㄴ. 부적응 행동을 새로운 적응적 행동으로 대체한다.\nㄷ. 행동, 인지, 정서와 통합하여 발전하였다.\nㄹ. 관찰할 수 없는 성격구조의 분석을 상담의 핵심으로 삼는다.","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"ㄱ, ㄴ, ㄷ은 교안 내용 그대로이다. ㄹ은 틀렸다. 행동주의의 연구대상은 관찰과 측정이 가능한 외현적 행동이며, 행동수정의 인간관에서도 '성격구조(정신분석)는 없으며, 행동 형성원리만 존재함'이라고 했다.","source":{"page":5,"section":"행동주의 학습이론과 상담","quote":"학습장애, 심리적 장애 등 부적응 행동을 소거, 제거, 둔화하고, 새로운 적응적 행동으로 대체함 행동, 인지, 정서와 통합하여 발전함"}},{"id":"53-06","type":"개념 찾기","q":"다음 발언을 한 학자는?","box":"나에게 12명의 건강한 유아를 데려다 주고 내가 고안한 세계에서 그들을 키울 수 있게 해준다면, 그 아이를 내가 지정한 어떠한 전문가로든 키울 수 있다.","choices":["파블로프(Pavlov)","스키너(Skinner)","반두라(Bandura)","셀리그만(Seligman)","왓슨(Watson)"],"answer":5,"explain":"교안의 '고전적 조건화' 쪽에서 왓슨 Watson의 공포 형성 조건화와 함께 이 발언을 소개한다. ① 파블로프는 S→R 실험, ② 스키너는 조작적 조건화, ③ 반두라는 사회학습이론, ④ 셀리그만은 학습된 무기력과 관련된다.","source":{"page":6,"section":"고전적 조건화","quote":"왓슨Watson의 공포 형성 조건화 ‣ 나에게 12명의 건강한 유아를 데려다 주고 내가 고안한 세계에서 그들을 키울 수 있게 해준다면, 그 아이를 내가 지정한 어떠한 전문가로든 키울 수 있다고 말함"}},{"id":"53-07","type":"개념 찾기","q":"파블로프(Pavlov)의 S→R 실험과 왓슨(Watson)의 공포 형성 조건화가 공통으로 해당하는 것은?","box":null,"choices":["조작적 조건화","고전적 조건화","사회학습이론","학습된 무기력","변별강화"],"answer":2,"explain":"교안은 '고전적 조건화' 제목 아래 파블로프의 S→R 실험과 왓슨의 공포 형성 조건화를 함께 제시한다. ① 조작적 조건화는 스키너, ③ 사회학습이론은 반두라, ④ 학습된 무기력은 셀리그만이다. ⑤ 변별강화는 부적응 행동 소거 기법이다.","source":{"page":6,"section":"고전적 조건화","quote":"고전적 조건화 / 파블로프Pavlov의 S →R 실험 왓슨Watson의 공포 형성 조건화"}},{"id":"53-08","type":"옳은 것","q":"모워(Mower)의 야뇨증 치료에 대한 설명으로 옳은 것은?","box":null,"choices":["1948년에 시행된 조작적 조건화의 사례이다.","1938년에 시행된 사회학습이론의 사례이다.","1958년에 시행된 고전적 조건화의 사례이다.","1938년에 시행된 고전적 조건화의 사례이다.","1938년에 시행된 학습된 무기력의 사례이다."],"answer":4,"explain":"교안: '모워 Mower의 야뇨증 치료(1938) 고전적 조건화'. ①③ 연도가 틀렸다(1948년, 1958년이 아니라 1938년). ① 조작적 조건화, ② 사회학습이론, ⑤ 학습된 무기력은 이론이 틀렸다.","source":{"page":7,"section":"모워 Mower의 야뇨증 치료","quote":"모워Mower의 야뇨증 치료(1938) 고전적 조건화"}},{"id":"53-09","type":"개념 찾기","q":"인간 행동의 긍정적 변화를 다루며 '프로그래밍 학습법'과 연결되는 이론은?","box":null,"choices":["스키너(Skinner)의 조작적 조건화","파블로프(Pavlov)의 고전적 조건화","반두라(Bandura)의 사회학습이론","셀리그만(Seligman)의 학습된 무기력","왓슨(Watson)의 공포 형성 조건화"],"answer":1,"explain":"교안은 '인간 행동의 긍정적 변화 / 스키너 Skinner의 조작적 조건화 / 프로그래밍 학습법'으로 제시한다. ②⑤는 고전적 조건화의 예이다. ③은 모방·대리·관찰학습, ④는 무력감과 관련된다.","source":{"page":8,"section":"스키너 Skinner의 조작적 조건화","quote":"인간행동의 긍정적 변화 스키너Skinner의 조작적 조건화 / ‣ 프로그래밍 학습법"}},{"id":"53-10","type":"옳지 않은 것","q":"반두라(Bandura)의 사회학습이론에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["모방, 대리, 관찰학습을 다룬다.","self-efficacy 개념과 관련된다.","혐오자극에 계속 노출되어 아무런 대응도 하지 않게 되는 현상을 핵심 개념으로 한다.","아동학습장애, 공포증, 강박장애, 중독치료에 기여하였다.","성인병과 관련하여 대사증후군, 생활편협증, 생활습관병을 제시한다."],"answer":3,"explain":"③은 셀리그만(Seligman)의 학습된 무기력에 대한 설명이다. ①②④⑤는 교안의 반두라 사회학습이론 쪽 내용 그대로이다.","source":{"page":9,"section":"반두라 Bandura의 사회학습이론","quote":"사회학습이론(모방, 대리, 관찰학습), self-efficacy ‣ 아동학습장애, 공포증, 강박장애, 중독치료에 기여"}},{"id":"53-11","type":"빈칸","q":"반두라(Bandura)의 사회학습이론 쪽 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"‣ 중독 → (   )\n‣ 성인병 → 대사증후군, 생활편협증, 생활습관병","choices":["금단, 내성","충동, 강박","회피, 불안","의존, 남용","우울, 무기력"],"answer":4,"explain":"교안: '중독 → 의존, 남용'. 다른 선지는 교안에 제시되지 않은 표현이다.","source":{"page":9,"section":"반두라 Bandura의 사회학습이론","quote":"중독 →의존, 남용 ‣ 성인병 →대사증후군, 생활편협증, 생활습관병"}},{"id":"53-12","type":"사례","q":"다음 사례의 학생에게 나타난 현상으로 알맞은 것은?","box":"영재학생 A는 어려운 과제에서 계속 실패하고 꾸중을 들었다. 어떤 시도나 노력도 효과가 없다고 느낀 A는 무력감으로 인해 이제 새로운 과제가 주어져도 아무런 대응도 하지 않는다.","choices":["변별강화","자기 강화","공포 형성 조건화","관찰학습","학습된 무기력"],"answer":5,"explain":"셀리그만(Seligman)의 학습된 무기력은 '혐오자극에 계속하여 노출되면서 극복을 위한 시도나 노력이 효과가 없다고 느낌, 무력감으로 인해 아무런 대응도 하지 않게 되는 현상'이다. ① 변별강화, ② 자기 강화는 행동수정 기법이다. ③은 왓슨, ④는 반두라와 관련된다.","source":{"page":10,"section":"셀리그만 Seligman의 학습된 무기력","quote":"혐오자극에 계속하여 노출되면서 극복을 위한 시도나 노력이 효과가 없다고 느낌 무력감으로 인해 아무런 대응도 하지 않게 되는 현상"}},{"id":"53-13","type":"빈칸","q":"동물 행동을 조종하는 '뇌세포 리모컨'에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   )으로 뇌세포의 활성을 제어해 뇌 기능을 조절하는 기술을 개발함","choices":["전기장","자기장","초음파","레이저","약물"],"answer":2,"explain":"교안: '자기장으로 뇌세포의 활성을 제어해 뇌 기능을 조절하는 기술을 개발함'(동아사이언스, 2021.1.29). 다른 선지는 교안에 없다.","source":{"page":11,"section":"동물 행동 조종하는 '뇌세포 리모컨'","quote":"자기장으로 뇌세포의 활성을 제어해 뇌기능을 조절하는 기술을 개발함"}},{"id":"53-14","type":"옳지 않은 것","q":"행동수정의 인간관에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["인간의 행동은 정신분석의 성격구조를 통해 파악해야 한다.","모든 행동은 학습된 결과로 인간의 행동을 파악한다.","인간의 행동은 예언 및 수정이 가능하다.","성격구조는 없으며 행동 형성 원리만 존재한다.","조건형성 원리로 문제 및 부적응 행동을 수정할 수 있다."],"answer":1,"explain":"교안은 '성격구조(정신분석)는 없으며, 행동 형성원리만 존재함'이라고 했다. 따라서 ①은 틀렸다. ②③④⑤는 교안 내용 그대로이다.","source":{"page":13,"section":"행동수정의 인간관","quote":"성격구조(정신분석)는 없으며, 행동 형성원리만 존재함"}},{"id":"53-15","type":"빈칸","q":"행동수정의 A-B-C 이론에서 A, B, C가 뜻하는 것을 순서대로 바르게 나열한 것은?","box":null,"choices":["Attitude - Belief - Change","Antecedents - Belief - Consequences","Antecedents - Behavior - Consequences","Attention - Behavior - Control","Action - Behavior - Consequences"],"answer":3,"explain":"교안: 'A - B - C 이론(Antecedents - Behavior - Consequences)'. 행동수정의 B는 Behavior(행동)이다. B를 Beliefs(신념)로 쓰는 것은 REBT의 ABCDEF 모델이다.","source":{"page":14,"section":"행동수정의 목표와 과정","quote":"A - B - C 이론(Antecedents - Behavior - Consequences)"}},{"id":"53-16","type":"옳은 것","q":"행동수정의 목표와 과정에 대한 설명으로 옳은 것은?","box":null,"choices":["A-B-C 이론에서는 A 선행조건이나 C 후속결과보다 B 행동 자체를 직접 변화시키는 데 중점을 둔다.","치료목표는 상담자가 단독으로 정하며 내담자와의 합의는 필요하지 않다.","상담자는 비지시적인 태도로 내담자의 자발적 성장을 기다린다.","학습된 구체적인 부적응 행동을 소거하고 효과적·적응된 행동을 학습시키는 것이 목표이다.","내담자의 동기보다 상담자의 노력만으로 충분히 치료가 이루어진다."],"answer":4,"explain":"교안: '학습된 구체적인 부적응 행동을 소거하고 효과적, 적응된 행동을 학습시키는 것임'. ① 교안은 'B 행동 자체보다는 A 선행조건이나 C 후속결과를 변화시키는 것'이라고 했다. ② 치료목표에 대한 내담자와의 합의가 필요하다. ③ 상담자는 적극적, 지시적이다. ⑤ 내담자의 강한 동기와 실천이 필요하다.","source":{"page":14,"section":"행동수정의 목표와 과정","quote":"학습된 구체적인 부적응 행동을 소거하고 효과적, 적응된 행동을 학습시키는 것임"}},{"id":"53-17","type":"사례","q":"다음 사례에서 교사가 사용한 정적 강화 방법은?","box":"교사는 학생이 과제를 완수할 때마다 상점 스티커를 주고, 스티커를 일정 개수 모으면 학생이 좋아하는 물건으로 교환해 주었다.","choices":["조성법(Shaping)","환권보상제(Token)","타임아웃(Time Out)","자기 강화(Image Training)","연속적 비강화 소거"],"answer":2,"explain":"교안은 환권보상제 Token의 예로 '상점 스티커 → 좋아하는 물건 교환'을 제시한다. ① 조성법의 예는 테니스 배우기, 물개 공 던지기이다. ③⑤는 부적응 행동 소거 방법이다. ④ 자기 강화는 Image Training이다.","source":{"page":15,"section":"바람직한 행동 강화 : 정적 강화","quote":"환권보상제Token / ‣ 상점 스티커→ 좋아하는 물건 교환"}},{"id":"53-18","type":"옳지 않은 것","q":"바람직한 행동을 강화하는 정적 강화에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["강화물에는 생리적, 사회적, 금전적 강화물이 있다.","환권보상제는 Token이라고 한다.","조성법(Shaping)의 예로 테니스 배우기, 물개 공 던지기 등이 있다.","자기 강화는 Image Training이라고 한다.","조성법(Shaping)의 예로 안전벨트를 하지 않으면 나오는 경고음 소리가 있다."],"answer":5,"explain":"안전벨트 경고음 소리는 부적강화 쪽의 '부정적, 혐오적 처벌' 예이다. 따라서 ⑤는 틀렸다. ①②③④는 교안의 정적 강화 내용 그대로이다.","source":{"page":15,"section":"바람직한 행동 강화 : 정적 강화","quote":"조성법Shaping / ‣ 테니스 배우기, 물개 공던지기 등 자기강화Image Training"}},{"id":"53-19","type":"사례","q":"다음 사례에서 교사가 사용한 부적응 행동 소거/제거 방법은?","box":"수업 중 친구를 계속 방해하는 학생에게 교사는 문제 행동이 있을 때 일시적으로 교실 한쪽 자리에 떨어져 있도록 하여 고립시켰다.","choices":["타임아웃(Time Out)","환권보상제(Token)","조성법(Shaping)","변별강화","자기 강화"],"answer":1,"explain":"교안: '타임아웃 Time Out - 문제 행동이 있을 때 일시적으로 고립'. ②③⑤는 바람직한 행동을 강화하는 정적 강화 방법이다. ④ 변별강화는 바람직한 행동은 강화하고 문제행동은 무시하는 방법이다.","source":{"page":16,"section":"부적응 행동 소거/제거 : 부적강화","quote":"타임아웃Time Out / ‣ 문제 행동이 있을 때 일시적으로 고립"}},{"id":"53-20","type":"사례","q":"다음 사례에 적용된 부적응 행동 소거 방법으로 알맞은 것은?","box":"아이가 장난감을 사 달라고 투정을 부렸지만, 부모는 일관되고 지속적인 태도로 아무리 투정을 해도 무시하였다. 그러자 아이의 투정이 사라졌다.","choices":["조성법","타임아웃","연속적 비강화 소거","환권보상제","부정적, 혐오적 처벌"],"answer":3,"explain":"교안은 연속적 비강화 소거의 예로 '아무리 장난감 투정을 해도 무시하면(강화물) 투정은 사라짐', '일관되고 지속적인 태도'를 든다. ② 타임아웃은 일시적 고립, ⑤는 안전벨트 경고음 같은 예이다. ①④는 정적 강화 방법이다.","source":{"page":16,"section":"부적응 행동 소거/제거 : 부적강화","quote":"연속적 비강화 소거 / ‣ 아무리 장난감 투정을 해도 무시하면(강화물) 투정은 사라짐 ‣ 일관되고 지속적인 태도"}},{"id":"53-21","type":"개념 찾기","q":"교안의 '부적응 행동 소거/제거 : 부적강화'에서 '안전벨트를 하지 않으면 나오는 경고음 소리'를 예로 든 방법은?","box":null,"choices":["타임아웃","변별강화","연속적 비강화 소거","부정적, 혐오적 처벌","조성법"],"answer":4,"explain":"교안은 '부정적, 혐오적 처벌'의 예로 안전벨트 경고음 소리를 든다. ① 타임아웃은 일시적 고립, ② 변별강화는 바람직한 행동은 강화하고 문제행동은 무시하는 것, ③은 투정 무시의 예이다. ⑤ 조성법은 정적 강화 방법이다.","source":{"page":16,"section":"부적응 행동 소거/제거 : 부적강화","quote":"부정적, 혐오적 처벌 / ‣ 안전벨트를 하지 않으면 나오는 경고음 소리"}},{"id":"53-22","type":"개념 찾기","q":"다음 설명에 해당하는 부적응 행동 소거/제거 방법은?","box":"‣ 바람직한 행동은 강화\n‣ 문제행동은 무시\n‣ 공부를 잘할 때는 가만있으나, 잠시 떠들면 주의를 줌","choices":["타임아웃","변별강화","조성법","환권보상제","자기 강화"],"answer":2,"explain":"교안의 '변별강화' 내용이다. ① 타임아웃은 일시적 고립이다. ③④⑤는 정적 강화 방법이다.","source":{"page":17,"section":"부적응 행동 소거/제거 : 부적강화","quote":"변별강화 / ‣ 바람직한 행동은 강화‣ 문제행동은 무시‣ 공부를 잘할 때는 가만있으나, 잠시 떠들면 주의를 줌"}},{"id":"53-23","type":"옳은 것","q":"영재상담과 행동수정에 대한 설명으로 옳은 것은?","box":null,"choices":["부적강화가 바람직한 행동을 이끄는 가장 효과적인 방법이다.","학습동기가 부족할 때 학업에 집중하는 시간을 줄여 준다.","자기주도능력 향상을 위해 추상적이고 포괄적인 목표만 설정한다.","학업성취도가 향상될 때 외적 보상만 주고 내적 보상은 배제한다.","정적강화는 바람직한 행동을 할 때 보상을 제공하는 방법으로 가장 효과적이다."],"answer":5,"explain":"교안: '정적강화는 바람직한 행동을 할 때 보상을 제공하는 방법으로 가장 효과적임'. ① 가장 효과적인 것은 정적강화이다. ② 학업에 집중하는 시간을 증가시킨다. ③ 구체적 행동목표를 설정한다. ④ 스스로 내적/외적 보상을 준다.","source":{"page":18,"section":"영재상담과 행동수정","quote":"정적강화는 바람직한 행동을 할 때 보상을 제공하는 방법으로 가장 효과적임"}},{"id":"53-24","type":"빈칸","q":"영재상담에서 행동수정으로 자기주도능력을 향상시키는 방법이다. (   )에 들어갈 말로 알맞은 것은?","box":"구체적 행동목표를 설정하고, 행동으로 실행하며, 구체적인 행동수준을 평가함(체크리스트, (   ) 등)","choices":["리커트 척도","포트폴리오","투사검사","지능검사","면담 기록"],"answer":1,"explain":"교안은 행동수준 평가 도구로 '체크리스트, 리커트 척도 등'을 제시한다. 다른 선지는 교안에 없다.","source":{"page":18,"section":"영재상담과 행동수정","quote":"구체적 행동목표를 설정하고, 행동으로 실행하며, 구체적인 행동수준을 평가함(체크리스트, 리커트 척도 등)"}}]},{"lesson":54,"title":"영재들을 위한 상담기법2 : 인지정서행동치료","file":"4. 교안 (31~60)[1] (1)/54.pdf","summary":["REBT = Rational Emotive Behavioral Therapy, 합리적 정서행동치료 / 지정행 요법 (인지정서행동치료)","비합리적 생각의 확장: 나 → 가족 → 주변 사람 → 세계 (예: 나는 완벽하게 일을 처리해야 해!, 세상은 항상 공정하고 정의로워야 한다!)","앨버트 엘리스 Albert Ellis: 아동기 불우(부모 양육소홀, 허약한 신체, 내성적 성격)했으나 역경 극복, Carl Rogers(완전히 기능하는 인간)에 이어 가장 영향력 있는 심리치료자로 선정, 10대 때 방대한 독서, 콜롬비아대학 박사 후 정신분석 수련, 적극적이고 지시적인 개입, 단기간 치료로도 실용적·효과적","REBT 사례: (전) 미국 통신위원회 권율 부국장 - CBS 'survival' 최후의 월계관, 어린 시절 괴롭힘으로 대인공포증과 강박증, 변호사·컨설턴트 경험, 아시아계로 소외된 사람의 심리를 알고 연합","REBT 인간관: 합리성과 비합리성의 양면적 본성, 비합리적·역기능적 사고를 우선하는 생물학적 근원, 자기패배적 행동을 배우기 쉬움, 외부사건을 자기 식대로 해석하며 부정적인 사고를 먼저 함","자동화된 비합리적 신념: 생득적이고 후천적으로 학습, 거의 자동적·확산적·과잉 일반화 / 결과: 절대적·당위적 사고(must), 파국화·낮은 인내심(견딜 수 없다), 자신과 타인에 대한 질책과 비하(한심한 인간이다), 과잉 일반화(사소한 실수도 인생 패배자)","치료 목표: 정서장애를 유발하는 것은 선행사건이 아니라 그 사건에 대한 자동화되고 왜곡된 비합리적 신념 → 합리적, 생산적 사고로 전환","ABCDEF 모델: A(Antecedent events) 선행사건 → B(Beliefs) 비합리적 신념 → C(Consequence) 부정적 정서·행동·신체적 반응 → D(Dispute) 논박 → E(Effect) 합리적 신념·행동·정서로 변화 → F(effort) 일반화·내재화를 위한 지속적인 노력","치료기법: 인지치료(지적, 설득, 학습, 논박, 독서, 세미나 참석, 자기 진술카드, 녹음테이프 청취) / 정서적 치료(무조건 수용, 권위적·지시적·포용적 태도) / 행동적 치료(상황 노출, 기술 훈련, 역할연기, 여론 조사, 숙제)","영재상담과 REBT: 지적 능력이 탁월한 영재학생에게 아주 적합, 우울증·불안·강박장애·공황장애·분노조절장애·성격장애 등에 효과적, 대인관계 기술 향상·삶의 만족도 향상","사례(시험을 망친 영재학생): A 시험 성적 나쁨 → B '나는 바보야… 나는 실패자야!' → C 우울함·불안·무기력함·공부 포기 → D '시험 성적이 좋지 못했다고 해서 내가 바보가 되는 것은 아니야' → E 공부를 다시 시작"],"questions":[{"id":"54-01","type":"빈칸","q":"인지정서행동치료(REBT) 도입부에서 제시한 비합리적 생각의 예이다. (   )에 들어갈 말로 알맞은 것은?","box":"나는 다른 사람들에 인정을 받아야 해, 그렇지 않으면 (   ) 인간이야!","choices":["불행한","외로운","무능한","나약한","실패한"],"answer":3,"explain":"교안의 예시 문장은 '나는 다른 사람들에 인정을 받아야 해, 그렇지 않으면 무능한 인간이야!'이다. 다른 선지는 교안 표현이 아니다.","source":{"page":3,"section":"Q. 이렇게 생각해 본 적이 있나요?","quote":"나는 다른 사람들에 인정을 받아야 해, 그렇지 않으면 무능한 인간이야!"}},{"id":"54-02","type":"옳은 것","q":"교안의 'Q. 이렇게 생각해 본 적이 있나요?'에서 비합리적 생각이 확장되는 순서로 제시한 것은?","box":null,"choices":["나 → 가족 → 주변 사람 → 세계","세계 → 주변 사람 → 가족 → 나","가족 → 나 → 주변 사람 → 세계","나 → 주변 사람 → 가족 → 세계","주변 사람 → 가족 → 나 → 세계"],"answer":1,"explain":"교안: '나 → 가족 → 주변 사람 → 세계'. 나에 대한 생각(완벽하게 일을 처리해야 해)에서 가족(반드시 나를 편하게 해주어야 해), 세상(항상 공정하고 정의로워야 한다)으로 넓어진다. 다른 선지는 순서가 틀렸다.","source":{"page":4,"section":"Q. 이렇게 생각해 본 적이 있나요?","quote":"나 →가족 →주변 사람→세계"}},{"id":"54-03","type":"옳지 않은 것","q":"REBT에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["REBT는 Rational Emotive Behavioral Therapy의 약자이다.","합리적 정서행동치료라고도 한다.","지정행 요법이라고도 한다.","인지정서행동치료라고 한다.","REBT의 B는 Biological(생물학적)을 뜻한다."],"answer":5,"explain":"REBT는 Rational Emotive Behavioral Therapy이므로 B는 Behavioral이다. 따라서 ⑤는 틀렸다. 교안은 REBT를 인지정서행동치료, 합리적 정서행동치료, 지정행 요법으로 소개한다.","source":{"page":5,"section":"REBT 인지정서행동치료","quote":"Rational Emotive Behavioral Therapy 합리적 정서행동치료/ 지정행 요법"}},{"id":"54-04","type":"옳지 않은 것","q":"REBT를 창시한 앨버트 엘리스(Albert Ellis)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["아동기에 부모의 양육소홀, 허약한 신체, 내성적 성격으로 불우했으나 역경을 극복하였다.","10대 때 방대한 양의 독서를 하였고, 콜롬비아대학 박사 후 정신분석 수련을 받았다.","인간의 비합리적 신념을 변화시키려면 비지시적이고 수용적인 태도로 기다려야 한다고 보았다.","인간은 자동화되고 왜곡된 비합리적 신념이 본성이라고 보았다.","단기간 치료로도 실용적이고 효과적인 심리치료로 널리 활용된다."],"answer":3,"explain":"교안: '이를 변화시키기 위한 적극적이고 지시적인 개입이 필요'. 따라서 ③의 비지시적 태도는 틀렸다. ①②④⑤는 교안 내용 그대로이다.","source":{"page":6,"section":"앨버트 엘리스 Albert Ellis","quote":"인간은 자동화되고 왜곡된 비합리적 신념이 본성으로, 이를 변화시키기 위한 적극적이고 지시적인 개입이 필요"}},{"id":"54-05","type":"빈칸","q":"앨버트 엘리스(Albert Ellis)에 대한 설명이다. (   )에 들어갈 인물로 알맞은 것은?","box":"미국 임상 및 상담 심리학자가 뽑은 (   )(완전히 기능하는 인간)에 이어 가장 영향력 있는 심리치료자로 선정","choices":["Carl Rogers","Sigmund Freud","Aaron Beck","B. F. Skinner","Albert Bandura"],"answer":1,"explain":"교안: '미국 임상 및 상담 심리학자가 뽑은 Carl Rogers(완전히 기능하는 인간)에 이어 가장 영향력 있는 심리치료자로 선정'. '완전히 기능하는 인간'과 짝지어진 인물은 Carl Rogers이다.","source":{"page":6,"section":"앨버트 엘리스 Albert Ellis","quote":"미국 임상 및 상담 심리학자가 뽑은 Carl Rogers(완전히 기능하는 인간)에 이어 가장 영향력 있는 심리치료자로 선정"}},{"id":"54-06","type":"옳지 않은 것","q":"교안에 제시된 REBT 사례 인물인 (전) 미국 통신위원회 권율 부국장에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["CBS 'survival' 프로그램에서 최후의 월계관을 차지하였다.","로펌과 구글, 맥킨지, 의회 등에서 다양한 경험을 쌓았다.","어린 시절 미국에서 피부색과 외모가 다르다는 이유로 괴롭힘을 많이 당하였다.","어린 시절의 괴롭힘으로 공황장애와 분노조절장애가 생겼다.","TV에서도 황인종은 늘 조롱거리여서 자살도 몇 차례 시도하였다."],"answer":4,"explain":"교안: '괴롭힘을 많이 당해서, 대인공포증과 강박증이 생김'. 따라서 ④의 공황장애와 분노조절장애는 틀렸다. ①②③⑤는 교안 내용 그대로이다.","source":{"page":7,"section":"REBT 사례","quote":"어린 시절 미국에서 한국인으로 피부색과 외모가 다르다는 이유로 괴롭힘을 많이 당해서, 대인공포증과 강박증이 생김"}},{"id":"54-07","type":"보기 조합","q":"REBT 사례인 권율 부국장이 자신의 경험을 강점으로 재해석한 내용으로 교안에 제시된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 변호사 일을 해봤기에 남을 설득하는 데 어려움이 없었다.\nㄴ. 컨설턴트 경험을 했기에 계획을 세워 움직이는 데 익숙했다.\nㄷ. 주류에 속하지 않은 아시아계였기에 소외된 사람의 심리를 알고 연합할 수 있었다.\nㄹ. 의사 경험을 했기에 사람들의 아픔을 치료하는 데 익숙했다.","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"ㄱ, ㄴ, ㄷ은 교안 문장 그대로이다. ㄹ의 의사 경험은 교안에 없다.","source":{"page":8,"section":"REBT 사례","quote":"변호사 일을 해봤기에 남을 설득하는데 어려움이 없었고, 컨설턴트 경험을 했기에 계획을 세워 움직이는데 익숙했다. 주류에 속하지 않은 아시아계였기에 소외된 사람의 심리를 알고 연합할 수 있었다."}},{"id":"54-08","type":"옳지 않은 것","q":"REBT의 인간관에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["인간은 합리성과 비합리성의 양면적 본성을 지닌 존재이다.","인간은 비합리적이고 역기능적인 사고를 우선하게 되는 생물학적 근원을 타고났다.","인간은 자기패배적인 행동을 배우고 행동하기 쉽다.","인간은 외부사건을 있는 그대로 객관적으로 받아들이며 긍정적인 사고를 먼저 한다.","인간은 외부사건(자극)을 자기 식대로 해석하고 평가하여 그 반응을 결정한다."],"answer":4,"explain":"교안: '인간은 외부사건(자극)을 자기 식대로 해석하고 평가하여 그 반응을 결정하는데 부정적인 사고를 먼저 함'. 따라서 ④는 틀렸다. ①②③⑤는 교안 내용 그대로이다.","source":{"page":9,"section":"REBT의 인간관","quote":"인간은 외부사건(자극)을 자기 식대로 해석하고 평가하여 그 반응을 결정하는데 부정적인 사고를 먼저 함"}},{"id":"54-09","type":"옳은 것","q":"인간의 자동화된 비합리적 신념에 대한 설명으로 옳은 것은?","box":null,"choices":["생득적이고 후천적으로 학습되어서 거의 자동적이고 확산적이며, 과잉 일반화되어 표출된다.","후천적 학습과 무관하게 생득적으로만 형성된다.","의식적으로 통제되어 매우 드물게 표출된다.","특정 상황에만 한정되어 확산되지 않는다.","구체적 사건에만 적용되어 일반화되지 않는다."],"answer":1,"explain":"교안: '생득적이고 후천적으로 학습되어서 거의 자동적이고 확산적이며, 과잉 일반화되어 표출되는 인간의 한계'. ② 후천적으로도 학습된다. ③ 거의 자동적이다. ④ 확산적이다. ⑤ 과잉 일반화된다.","source":{"page":10,"section":"인간의 자동화된 비합리적 신념이란?","quote":"생득적이고 후천적으로 학습되어서 거의 자동적이고 확산적이며, 과잉 일반화되어 표출되는 인간의 한계"}},{"id":"54-10","type":"사례","q":"다음 사례의 학생에게 나타난 비합리적 사고로 발생하는 결과로 알맞은 것은?","box":"영재학생 B는 발표 중 단어 하나를 잘못 말한 사소한 실수를 하고 나서 '나는 인생 패배자야'라고 생각하였다.","choices":["절대적이고 당위적 사고","파국화, 낮은 인내심","자신과 타인에 대한 질책과 비하","학습된 무기력","과잉 일반화"],"answer":5,"explain":"교안은 과잉 일반화의 예로 '사소한 실수도 인생 패배자로 생각'을 든다. ① 절대적이고 당위적 사고는 must(나는 반드시 ~해야 한다), ② 파국화와 낮은 인내심은 '견딜 수 없다, 참을 수 없다', ③ 질책과 비하는 '한심한 인간이다'이다. ④는 이 차시의 비합리적 사고 결과 목록에 없다.","source":{"page":10,"section":"인간의 자동화된 비합리적 신념이란?","quote":"과잉 일반화 / • 사소한 실수도 인생 패배자로 생각"}},{"id":"54-11","type":"옳지 않은 것","q":"비합리적인 사고로 발생하는 결과와 그 예를 짝지은 것으로 옳지 않은 것은?","box":null,"choices":["절대적이고 당위적 사고 - must, 나는 반드시 ... 해야 한다","자신과 타인에 대한 질책과 비하 - 견딜 수 없다, 참을 수 없다","파국화, 낮은 인내심 - 견딜 수 없다, 참을 수 없다","자신과 타인에 대한 질책과 비하 - 한심한 인간이다","과잉 일반화 - 사소한 실수도 인생 패배자로 생각"],"answer":2,"explain":"'견딜 수 없다, 참을 수 없다'는 파국화, 낮은 인내심의 예이다. 자신과 타인에 대한 질책과 비하의 예는 '한심한 인간이다'이다. 따라서 ②가 잘못된 짝이다.","source":{"page":10,"section":"인간의 자동화된 비합리적 신념이란?","quote":"파국화, 낮은 인내심 / • 견딜 수 없다, 참을 수 없다 / ‣ 자신과 타인에 대한 질책과 비하 / • 한심한 인간이다"}},{"id":"54-12","type":"옳은 것","q":"REBT 치료의 목표와 과정에 대한 설명으로 옳은 것은?","box":null,"choices":["정서장애를 유발하는 것은 선행사건 그 자체이다.","인간은 자신의 사고, 정서와 행동을 바꿀 능력이 없다.","정서장애를 유발하는 것은 선행사건이 아니라 그 사건에 대한 자동화되고 왜곡된 비합리적 신념 때문이다.","왜곡된 신념은 합리적이며 자기향상적이다.","심리치료를 통해 합리적 사고를 정서적, 감각적 사고로 전환시킨다."],"answer":3,"explain":"교안: '정서장애를 유발하는 것은 선행사건이 아니라, 그 사건에 대한 자동화되고 왜곡된 비합리적 신념 때문'. ① 선행사건이 아니라 신념 때문이다. ② 인간은 사고, 정서와 행동을 바꿀 수 있는 능력이 있다. ④ 왜곡된 신념은 비합리적이고 자기패배적이다. ⑤ 비합리적 사고를 합리적, 생산적 사고로 전환시킨다.","source":{"page":11,"section":"REBT 치료의 목표와 과정","quote":"정서장애를 유발하는 것은 선행사건이 아니라, 그 사건에 대한 자동화되고 왜곡된 비합리적 신념 때문"}},{"id":"54-13","type":"빈칸","q":"다음은 REBT 치료의 목표와 과정이다. (   )에 들어갈 말로 알맞은 것은?","box":"왜곡된 신념은 비합리적이고 자기패배적 → 심리치료를 통해 (   ) 사고로 전환시킴","choices":["긍정적, 낙관적","합리적, 생산적","객관적, 분석적","창의적, 확산적","논리적, 수렴적"],"answer":2,"explain":"교안: '심리치료를 통해 합리적, 생산적 사고로 전환시킴'. 다른 선지는 교안 표현이 아니다.","source":{"page":11,"section":"REBT 치료의 목표와 과정","quote":"왜곡된 신념은 비합리적이고 자기패배적 심리치료를 통해 합리적, 생산적 사고로 전환시킴"}},{"id":"54-14","type":"옳은 것","q":"REBT 치료의 ABCDEF 모델의 진행 순서로 옳은 것은?","box":null,"choices":["선행사건 → 결과 → 신념 → 논박 → 효과 → 노력","신념 → 선행사건 → 결과 → 논박 → 노력 → 효과","선행사건 → 신념 → 논박 → 결과 → 효과 → 노력","선행사건 → 신념 → 결과 → 효과 → 논박 → 노력","선행사건 → 신념 → 결과 → 논박 → 효과 → 노력"],"answer":5,"explain":"ABCDEF 모델은 A(Antecedent events, 선행사건) → B(Beliefs, 신념) → C(Consequence, 결과) → D(Dispute, 논박) → E(Effect, 효과) → F(effort, 노력) 순서로 진행된다. 비합리적 신념이 부정적 결과를 낳고, 그 신념을 논박해 변화시킨 뒤, 지속적인 노력으로 일반화·내재화한다.","source":{"page":13,"section":"REBT 치료의 ABCDEF 모델","quote":"REBT 치료의 ABCDEF모델 / DE / A / BC / F"}},{"id":"54-15","type":"개념 찾기","q":"REBT 치료의 ABCDEF 모델에서 다음 설명에 해당하는 단계는?","box":"‣ 우선적으로 자동화된 왜곡되고 비합리적인 신념\n‣ 해석, 평가 등","choices":["A(Antecedent events)","B(Beliefs)","C(Consequence)","D(Dispute)","E(Effect)"],"answer":2,"explain":"B(Beliefs)는 '우선적으로 자동화된 왜곡되고 비합리적인 신념, 해석, 평가 등'이다. A는 선행사건, C는 부정적인 정서 및 행동·신체적 반응, D는 논박, E는 논박으로 합리적인 신념과 행동, 정서로 변화하는 단계이다.","source":{"page":14,"section":"REBT 치료의 ABCDEF 모델","quote":"B(Beliefs) / ‣ 우선적으로 자동화된 왜곡되고 비합리적인 신념‣ 해석, 평가 등"}},{"id":"54-16","type":"옳지 않은 것","q":"REBT 치료의 ABCDEF 모델에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["A(Antecedent events)는 어떤 선행사건으로, 내외부적 생각, 정서, 행동, 사건 등을 포함한다.","C(Consequence)는 부정적인 정서 및 행동, 신체적 반응이다.","D(Dispute)는 비합리적 신념에 대해 논박하는 과정이다.","E(Effect)는 일반화, 내재화를 위한 지속적인 노력이다.","F(effort)는 ABCDEF 모델의 마지막 단계이다."],"answer":4,"explain":"E(Effect)는 '논박으로 합리적인 신념과 행동, 정서로 변화하기'이다. '일반화 내재화를 위해서 지속적인 노력'은 F(effort)이다. 따라서 ④가 틀렸다.","source":{"page":15,"section":"REBT 치료의 ABCDEF 모델","quote":"E(Effect) / ‣ 논박으로 합리적인 신념과 행동, 정서로 변화하기 F(effort) / ‣ 일반화 내재화를 위해서 지속적인 노력"}},{"id":"54-17","type":"빈칸","q":"REBT 치료의 ABCDEF 모델에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"D(Dispute): 비합리적 신념에 대해 (   )하는 과정","choices":["수용","공감","논박","강화","해석"],"answer":3,"explain":"교안: 'D(Dispute) - 비합리적 신념에 대해 논박하는 과정'. Dispute는 논박이다. 다른 선지는 교안 설명이 아니다.","source":{"page":15,"section":"REBT 치료의 ABCDEF 모델","quote":"D(Dispute) / ‣ 비합리적 신념에 대해 논박하는 과정"}},{"id":"54-18","type":"옳지 않은 것","q":"REBT 치료기법의 분류와 예를 짝지은 것으로 옳지 않은 것은?","box":null,"choices":["인지치료기법 - 자기 진술카드, 녹음테이프 청취","인지치료기법 - 지적, 설득, 논박, 독서, 세미나 참석","정서적 치료 - 내담자의 무조건 수용","정서적 치료 - 상황 노출, 기술 훈련, 역할연기","행동적 치료 - 여론 조사, 숙제"],"answer":4,"explain":"상황 노출, 기술 훈련, 역할연기는 행동적 치료이다. 정서적 치료는 '내담자의 무조건 수용, 상담자의 상황에 맞는 권위적, 지시적, 포용적 태도 등'이다. 따라서 ④가 잘못된 짝이다.","source":{"page":16,"section":"REBT 치료기법","quote":"행동적 치료 / ‣ 상황 노출, 기술 훈련, 역할연기, 여론 조사, 숙제 등"}},{"id":"54-19","type":"개념 찾기","q":"다음 설명에 해당하는 REBT 치료기법은?","box":"내담자의 무조건 수용, 상담자의 상황에 맞는 권위적, 지시적, 포용적 태도 등","choices":["정서적 치료","인지치료기법","행동적 치료","타임아웃","환권보상제"],"answer":1,"explain":"교안의 REBT 치료기법 중 '정서적 치료' 내용이다. ② 인지치료기법은 지적, 설득, 학습, 논박, 독서 등이다. ③ 행동적 치료는 상황 노출, 기술 훈련, 역할연기, 여론 조사, 숙제 등이다. ④⑤는 행동수정 기법이다.","source":{"page":16,"section":"REBT 치료기법","quote":"정서적 치료 / ‣ 내담자의 무조건 수용, 상담자의 상황에 맞는 권위적, 지시적, 포용적 태도 등"}},{"id":"54-20","type":"옳지 않은 것","q":"영재상담과 REBT에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["REBT는 지적 능력이 탁월한 영재학생에게 아주 적합한 심리치료기법이다.","REBT는 우울증, 불안, 강박장애에 효과적이다.","REBT는 공황장애, 분노조절장애, 성격장애 등에 효과적이다.","REBT는 대인관계 기술을 향상시키고 삶의 만족도를 높이는 데에도 크게 도움이 된다.","REBT는 지적 능력보다 정서적 수용에 의존하므로 영재학생에게는 적합하지 않다."],"answer":5,"explain":"교안: '지적 능력이 탁월한 영재학생에게 아주 적합한 심리치료기법'. 따라서 ⑤는 틀렸다. ①②③④는 교안 내용 그대로이다.","source":{"page":17,"section":"영재상담과 REBT","quote":"지적 능력이 탁월한 영재학생에게 아주 적합한 심리치료기법"}},{"id":"54-21","type":"보기 조합","q":"교안에서 REBT가 효과적이라고 제시한 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 우울증\nㄴ. 강박장애\nㄷ. 분노조절장애\nㄹ. 성격장애","choices":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":5,"explain":"교안: 'REBT는 우울증, 불안, 강박장애, 공황장애, 분노조절장애, 성격장애 등에 효과적'. 따라서 ㄱ, ㄴ, ㄷ, ㄹ 모두 해당한다.","source":{"page":17,"section":"영재상담과 REBT","quote":"특히 REBT는 우울증, 불안, 강박장애, 공황장애, 분노조절장애, 성격장애 등에 효과적"}},{"id":"54-22","type":"사례","q":"다음은 시험을 망친 어느 영재학생의 REBT 사례이다. 밑줄 친 부분은 ABCDEF 모델의 어느 단계에 해당하는가?","box":"시험 성적이 좋지 못했던 학생은 '__나는 바보야. 앞으로도 시험을 잘 볼 수 없을 거야. 내 인생은 이제 끝이야. 나는 실패자야!__'라고 생각하였다.","choices":["A","B","C","D","E"],"answer":2,"explain":"교안 사례에서 B는 '나는 바보야. 앞으로도 시험을 잘 볼 수 없을 거야. 내 인생은 이제 끝이야. 나는 실패자야!'이다. B(Beliefs)는 자동화된 왜곡되고 비합리적인 신념이다. A는 시험 성적이 좋지 못했다는 사건, C는 우울함·불안·무기력함 등, D는 논박 문장, E는 변화된 생각·감정·행동이다.","source":{"page":18,"section":"영재상담과 REBT 사례(시험을 망친 어느 영재학생)","quote":"B : '나는 바보야. 앞으로도 시험을 잘 볼 수 없을 거야. 내 인생은 이제 끝이야. 나는 실패자야!'"}},{"id":"54-23","type":"사례","q":"시험을 망친 영재학생의 REBT 사례에서 D(Dispute) 단계에 해당하는 것은?","box":null,"choices":["시험 성적이 좋지 못했다는 사건","나는 바보야. 앞으로도 시험을 잘 볼 수 없을 거야.","우울함, 불안, 무기력함, 공부를 포기하는 등의 감정이나 행동","시험 성적이 좋지 못했다고 해서 내가 바보가 되는 것은 아니야. 앞으로 더 노력하면 잘할 수 있을 거야.","우울함, 불안, 무기력함이 줄어들고, 공부를 다시 시작함"],"answer":4,"explain":"D(Dispute)는 비합리적 신념을 논박하는 과정이다. 교안 사례의 D는 '시험 성적이 좋지 못했다고 해서 내가 바보가 되는 것은 아니야. 앞으로 더 노력하면 잘할 수 있을 거야.'이다. ①은 A, ②는 B, ③은 C, ⑤는 E이다.","source":{"page":18,"section":"영재상담과 REBT 사례(시험을 망친 어느 영재학생)","quote":"D : '시험성적이 좋지 못했다고 해서 내가 바보가 되는 것은 아니야. 앞으로 더 노력하면 잘할 수 있을 거야.'"}},{"id":"54-24","type":"사례","q":"시험을 망친 영재학생의 REBT 사례에서 C(Consequence) 단계에 해당하는 것으로 알맞은 것은?","box":null,"choices":["우울함, 불안, 무기력함, 공부를 포기하는 등의 감정이나 무기력 또는 공격적 행동","시험 성적이 좋지 못했다는 사건","앞으로 더 노력하면 잘할 수 있을 거야.","우울함, 불안, 무기력함이 줄어들고, 공부를 다시 시작함","일반화, 내재화를 위한 지속적인 노력"],"answer":1,"explain":"C(Consequence)는 부정적인 정서 및 행동, 신체적 반응이다. 교안 사례의 C는 '우울함, 불안, 무기력함, 공부를 포기하는 등의 감정이나 무기력 또는 공격적 행동'이다. ②는 A, ③은 D, ④는 E, ⑤는 F에 대한 설명이다.","source":{"page":18,"section":"영재상담과 REBT 사례(시험을 망친 어느 영재학생)","quote":"C : 우울함, 불안, 무기력함, 공부를 포기하는 등의 감정이나 무기력 또는 공격적 행동"}}]},{"lesson":55,"title":"영재들의 상담 실제와 Tip (1)","file":"4. 교안 (31~60)[1] (1)/55.pdf","summary":["영재학생 A: 생후 8개월에 걷기 시작, 만 2-3세 때 글을 읽고 쓰기 시작, 1인 다역의 역할극, 클래식 음악 즐겨 들음","A의 부모는 논리보다 어른의 권위를 더 중요하게 생각 → 잦은 마찰, 교사들은 A를 '반골'이라 부름","A는 중2 때 친구 문제로 문제아들과 어울리는 이중생활, 과학고 입시 탈락 후 인생 첫 패배감","A의 영재성: 높은 지능, 비범한 기억력, 사고와 행동에의 독립성, 논리적인 사고과정, 일찍 글 읽기 / 조울증처럼 감정 기복 / 완벽주의로 스트레스","A의 교육방법: 부모와 교사가 좀 더 협력했더라면 / 부모가 좀 더 수용적이었다면 / 교사가 좀 더 수용적이었다면","상담사의 흔한 실수: 똑같은 어른들의 잔소리 \"이래야 해!\" = 지시적 상담(인지행동정서치료, REBT) 중심","비지시적 상담(인간중심, 인본주의): 아동은 '긍정적 자기존중'을 얻기 위해 '가치의 조건화' 형성 → 실현화 경향성 성취 방해","상담교사는 문제를 해결해 주는 것이 아니라 영재학생 스스로 해결해 나가도록 촉진하는 역할","3가지 인간중심적 태도: 일치성, 무조건적 긍정적 존중, 공감적 이해('마치 교사가 영재학생인 것처럼')","비지시적 상담 → 지시적 상담(REBT) 순서가 효과적: 당위주의, 비합리적 신념에서 벗어남","상담심리학 5대 이론: 정신분석, 행동수정, 인본주의, 인지치료, 인지행동정서치료 / 만능 상담방법은 존재하지 않음","Rapport(래포) 형성이 무엇보다 중요"],"questions":[{"id":"55-01","type":"옳은 것","q":"교안에 제시된 영재학생 A의 어린 시절 사례에 대한 설명으로 옳은 것은?","box":null,"choices":["1인 다역의 역할극을 하며 혼자 놀았다.","만 5세 때 글을 읽고 쓰기 시작하였다.","생후 12개월에 걷기 시작하였다.","나이 차가 컸던 형제들이 듣던 대중가요를 즐겨 들었다.","부모님은 어른의 권위보다 논리를 더 중요하게 생각했다."],"answer":1,"explain":"A는 1인 다역의 역할극을 하며 혼자 놀았다. ③ 생후 8개월에 걷기 시작. ② 만 2-3세 때 글을 읽고 쓰기 시작. ④ 클래식 음악을 즐겨 들음. ⑤ 부모님은 논리보다는 어른의 권위를 더 중요하게 생각함.","source":{"page":3,"section":"영재상담의 사례 - 영재학생 A의 사례","quote":"생후 8개월에 걷기 시작. 만 2-3세 때 글을 읽고 쓰기 시작하여 집에 있는 책이란 책은 모조리 읽었음. 1인 다역의 역할극을 하며 혼자 놀고, 나이 차가 컸던 형제들이 듣던 클래식 음악을 즐겨 들음."}},{"id":"55-02","type":"옳지 않은 것","q":"영재학생 A의 초등 시기 특성에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["또래보다는 어른들과 이야기하는 것을 즐겼다.","자기가 정한 순서대로 물건이 놓여 있어야 직성이 풀렸다.","학교가 재미없었고 학원도 다니지 않았다.","독서량이 많아 글짓기 대회, 독후감 대회 등에서 우수한 성적을 거두었다.","교내 합창단 활동을 거부하여 음악에는 관심을 보이지 않았다."],"answer":5,"explain":"A는 교내 합창단을 뽑는다는 이야기에 참가하여 활동하면서 음악에 관심을 보였고 동요대회 등에서 입상하였다. ①~④는 교안 내용과 일치.","source":{"page":3,"section":"영재상담의 사례 - 영재학생 A의 사례","quote":"교내 합창단을 뽑는다는 이야기에 참가하여 활동하면서 음악에 관심을 보이고 동요대회 등에서 입상."}},{"id":"55-03","type":"빈칸","q":"다음은 영재학생 A의 사례이다. (   )에 들어갈 말로 알맞은 것은?","box":"합창단에서 또래에게 관심이 생겼으나 함께 노는 방법을 몰라서 교내 (   )에 들어가서 공놀이를 함.","choices":["축구부","핸드볼부","농구부","야구부","배구부"],"answer":2,"explain":"A는 교내 핸드볼부에 들어가 공놀이를 했다. 나머지 운동부는 교안에 언급되지 않음.","source":{"page":4,"section":"영재상담의 사례 - 영재학생 A의 사례","quote":"합창단에서 또래에게 관심이 생겼으나 함께 노는 방법을 몰라서 교내 핸드볼부에 들어가서 공놀이를 함."}},{"id":"55-04","type":"옳은 것","q":"영재학생 A의 중학교 시기에 대한 설명으로 옳은 것은?","box":null,"choices":["중1 때 친구들이 자신을 좋아하지 않는다는 것을 알게 되었다.","문제아들과 어울렸으나 성적이 높아 어른들의 우려 없이 이중생활을 했다.","부모는 학교가 권한 과학고 대비 수준 높은 교육을 적극 지원했다.","과학고 입시에 합격하였다.","탐구대회, 발명대회에서는 좋은 성적을 거두지 못했다."],"answer":2,"explain":"A는 문제아들과 어울렸으나 성적이 높아 어른들의 우려 없이 이중생활을 함. ① 중2 때. ③ 부모는 대수롭지 않게 생각함. ④ 과학고 입시에서 탈락. ⑤ 탐구대회, 발명대회에서 우수한 성적을 거둠.","source":{"page":4,"section":"영재상담의 사례 - 영재학생 A의 사례","quote":"중2 때 그러한 자신을 좋아하지 않는다는 것을 알게 된 아이는 이미 형성된 친구들 무리에 끼지 못하고 문제아들과 어울렸으나, 성적이 높아 어른들의 우려 없이 이중생활을 함."}},{"id":"55-05","type":"사례","q":"다음 영재학생 A의 사례에서 A가 '인생에서의 첫 패배감'에 휩싸이게 된 계기는?","box":"책을 읽다 과학에 관심이 생긴 아이는 탐구대회, 발명대회에 나가 우수한 성적을 거두었으며, 학교에서 과학고를 위해 별도의 수준 높은 교육을 권하였으나 부모는 대수롭지 않게 생각함.","choices":["교내 합창단 선발 탈락","동요대회 낙선","과학고 입시 탈락","음악 대학 진학 실패","발명대회 예선 탈락"],"answer":3,"explain":"과학고 입시에서 탈락한 A는 인생에서의 첫 패배감에 휩싸여 책을 한 번도 펴지 않았다. 나머지는 교안에 없는 내용(동요대회에서는 오히려 입상).","source":{"page":4,"section":"영재상담의 사례 - 영재학생 A의 사례","quote":"과학고 입시에서 탈락한 아이는 인생에서의 첫 패배감에 휩싸여 책을 한 번도 펴지 않음."}},{"id":"55-06","type":"옳지 않은 것","q":"영재학생 A의 고등학교 시기에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["우수한 성적으로 교장이 부모를 불러 치하했다.","수학과 물리를 좋아하여 그것만 했다.","물리 노트는 담당 선생님이 복사해 갈 만큼 완벽했다.","모든 과목에 고르게 시간을 투자하여 교과 간 성적 편차가 작았다.","교사들은 A를 '반골'이라 불렀다."],"answer":4,"explain":"다른 과목들은 시간 투자를 하지 않아 성적이 낮아 교과 간 성적 편차가 클 수밖에 없었다. ①②③⑤는 교안과 일치.","source":{"page":5,"section":"영재상담의 사례 - 영재학생 A의 사례","quote":"다른 과목들은 시간 투자를 하지 않으니 성적이 낮아 교과 간 성적 편차가 클 수밖에 없었음."}},{"id":"55-07","type":"옳은 것","q":"영재학생 A가 고등학교에서 국어 성적이 우수했던 이유로 교안에 제시된 것은?","box":null,"choices":["책을 많이 읽었기에","언어 습득 능력이 뛰어났기에","본인이 좋아하여 공부하였기에","개인 과외를 받았기에","담당 교사의 권유로 집중했기에"],"answer":1,"explain":"국어는 책을 많이 읽었기에 우수했다. ② 언어 습득 능력 → 영어의 이유. ③ 본인이 좋아하여 → 수학과 물리의 이유. ④⑤ 교안에 없음(학원도 다니지 않음).","source":{"page":5,"section":"영재상담의 사례 - 영재학생 A의 사례","quote":"국어는 책을 많이 읽었기에, 영어는 언어 습득 능력이 뛰어났기에, 수학과 물리는 본인이 좋아하여 공부하였기에 성적이 우수함."}},{"id":"55-08","type":"옳은 것","q":"영재학생 A가 다시 음악으로 관심을 돌린 이후의 내용으로 옳은 것은?","box":null,"choices":["부모의 지원으로 성악 개인 레슨을 받았다.","음악교사의 권유에 따라 음악 전공으로 명문대학에 진학했다.","현재 크게 성공한 영재로서의 삶을 살고 있다.","부모는 처음부터 A의 음악 활동을 알고 있었다.","아르바이트를 하며 성악 레슨비를 벌어 개인 레슨까지 받았다."],"answer":5,"explain":"A는 아르바이트를 하며 성악 레슨비를 벌어 개인 레슨까지 받았다. ① 부모는 큰 연주회 참가 때까지 전혀 모름. ② 부모가 거절하여 일반대학 진학. ④ 큰 연주회에 참가하면서 알게 됨. ③ 크게 성공한 영재로서의 삶은 아님.","source":{"page":6,"section":"영재상담의 사례 - 영재학생 A의 사례","quote":"아르바이트를 하며 성악 레슨비를 벌어 개인 레슨까지 받음. 이때까지 부모가 전혀 모르고 있다가 큰 연주회에 참가하면서 알게 됨."}},{"id":"55-09","type":"옳지 않은 것","q":"영재학생 A의 대학 진학 이후 및 현재 모습에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["결국 일반대학에 진학했다.","과외 및 학원 강사를 하며 경제적으로 독립했다.","경제적 독립 후 하고 싶은 음악 공부를 하여 여러 번 무대에도 섰다.","적당히 세상과 타협하며 평범하고 일상적인 삶을 살고 있다.","정서적 특성이 거의 사라져 스트레스가 매우 적다."],"answer":5,"explain":"A는 정서적 특성이 많이 남아 있어 스트레스가 매우 많다. ①~④는 교안과 일치.","source":{"page":6,"section":"영재상담의 사례 - 영재학생 A의 사례","quote":"그러나 정서적 특성이 많이 남아 있어 스트레스가 매우 많음."}},{"id":"55-10","type":"보기 조합","q":"\u003c보기\u003e 중 교안의 '영재학생 A의 영재성 탐구'에 제시된 내용을 모두 고른 것은?","box":"ㄱ. 높은 지능, 비범한 기억력, 사고와 행동에의 독립성\nㄴ. 수업을 지루해하여 학교의 과외 활동을 즐김\nㄷ. 조울증처럼 감정의 기복이 심함\nㄹ. 엄격하고 완고한 부모와의 긴밀한 유대","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ·ㄴ·ㄷ은 교안 내용. ㄹ은 틀림 → 교안은 '권위에 도전, 엄격하고 완고한 부모와의 단절'.","source":{"page":7,"section":"영재학생 A의 영재성 탐구","quote":"권위에 도전, 엄격하고 완고한 부모와의 단절 / 높은 지능, 비범한 기억력, 사고와 행동에의 독립성, 논리적인 사고과정, 일찍 글 읽기 / 수업을 지루해 하여 학교의 과외 활동을 즐김"}},{"id":"55-11","type":"빈칸","q":"영재학생 A의 영재성 탐구 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   )(으)로 인하여 몸이 힘들고, 일에 시간이 많이 걸리며 스트레스 많음","choices":["완벽주의","비동시적 발달","과흥분성","조울증","이중생활"],"answer":1,"explain":"교안: '완벽주의로 인하여 몸이 힘들고, 일에 시간이 많이 걸리며 스트레스 많음'. ④ 조울증은 '조울증처럼 감정의 기복이 심함'에 쓰인 표현. ⑤ 이중생활은 친구 문제 관련.","source":{"page":7,"section":"영재학생 A의 영재성 탐구","quote":"완벽주의로 인하여 몸이 힘들고, 일에 시간이 많이 걸리며 스트레스 많음"}},{"id":"55-12","type":"사례","q":"교안은 영재학생 A의 교육방법으로 '부모와 교사가 좀 더 협력했더라면' 어떠했을 것이라고 보았는가?","box":null,"choices":["학교생활을 보다 성실하게 했을 것이다.","부모 몰래 다른 활동들을 하지는 않았을 것이다.","진학에 도움이 되었을 것이다.","좀 더 안정적이고 지지적인 환경 속에서 성장했을 것이다.","긍정적인 교우관계를 유지했을 것이다."],"answer":4,"explain":"부모와 교사가 협력해 집중적인 관심을 주고 아이의 의견을 수렴했다면 좀 더 안정적이고 지지적인 환경 속에서 성장했을 것. ① 교사가 수용적이었다면. ②③⑤ 부모가 수용적이었다면.","source":{"page":8,"section":"영재학생 A의 교육방법 - 부모와 교사가 좀 더 협력했더라면","quote":"집중적인 관심을 주고, 생활에 영향을 끼치는 어떤 결정에 아이의 의견을 수렴하였다면 좀 더 안정적이고 지지적인 환경 속에서 성장했을 것임"}},{"id":"55-13","type":"빈칸","q":"영재학생 A의 교육방법 중 '부모가 좀 더 수용적이었다면'의 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   )을/를 개발하도록 관심을 갖고 지도했다면 긍정적인 교우관계를 유지했을 것임","choices":["지적 능력","사회적 기술","자기주도 학습력","음악적 재능","논리적 사고"],"answer":2,"explain":"사회적 기술 개발 지도 → 긍정적인 교우관계 유지. ① 지적 능력은 '존중했더라면 진학에 도움'. 나머지는 해당 문장에 없음.","source":{"page":9,"section":"영재학생 A의 교육방법 - 부모가 좀 더 수용적이었다면","quote":"사회적 기술을 개발하도록 관심을 갖고 지도했다면 긍정적인 교우관계를 유지했을 것임"}},{"id":"55-14","type":"옳은 것","q":"영재학생 A의 교육방법 중 '교사가 좀 더 수용적이었다면'에 대한 설명으로 옳은 것은?","box":null,"choices":["반복 학습을 통해 기초 학력을 다지도록 했어야 한다.","학교 규칙을 엄격히 적용해 반항을 억제했어야 한다.","도전적이고 반복에 싫증을 느끼는 아이를 이해해 주고 타일러서 공부의 방향성을 바로잡아 주는 게 바람직하다.","음악 대신 수학·과학에만 집중하도록 지도했어야 한다.","부모 몰래 하던 활동을 즉시 부모에게 알렸어야 한다."],"answer":3,"explain":"교안: 교사에게 도전적이고 반복에 싫증을 느끼는 아이를 이해해 주고 타일러서 공부의 방향성을 바로잡아 주는 게 바람직함 → 학교생활을 보다 성실하게 했을 것. 나머지는 교안에 없는 내용.","source":{"page":10,"section":"영재학생 A의 교육방법 - 교사가 좀 더 수용적이었다면","quote":"교사에게 도전적이고, 반복에 싫증을 느껴 수업에 집중하지 못하며, 하고 싶은 것만 하려는 아이를 이해해주고 타일러서 공부의 방향성을 바로잡아 주는 게 바람직함"}},{"id":"55-15","type":"옳은 것","q":"영재학생 상담에서 '상담사의 흔한 실수'에 대한 설명으로 옳은 것은?","box":null,"choices":["비지시적 상담만 고집하는 것이다.","REBT는 영재학생에게 적합하지 않은 기법이므로 사용하는 것 자체가 실수이다.","똑같은 어른들의 잔소리인 \"이래야 해!\"식의 지시적 상담(REBT) 중심으로 상담하는 것이다.","아이들은 위로나 인정보다 논리적 해결책만 원한다.","정신분석 중심으로 상담하는 것이다."],"answer":3,"explain":"흔한 실수 = \"이래야 해!\" 지시적 상담(인지행동정서치료, REBT) 중심. ② REBT는 지적 능력이 탁월한 영재학생에게 적합한 기법이긴 함. ④ 아이들은 위로를 받고, 인정을 받고 싶어함. ①⑤ 교안에 없음.","source":{"page":12,"section":"상담사의 흔한 실수","quote":"인지정서행동치료(REBT)가 지적 능력이 탁월한 영재학생에게 적합한 심리치료기법이긴 하지만, 아이들은 위로를 받고, 인정을 받고 싶어함"}},{"id":"55-16","type":"빈칸","q":"비지시적 상담(인간중심, 인본주의)에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"아동은 기본적 욕구인 '긍정적 자기존중'을 얻기 위해 노력하기 때문에 \"(   )\" 태도를 형성하게 됨. 형성된 (   )은/는 경험을 통해 실현화 경향성을 성취하는 것을 방해하는 주요한 원인이 됨.","choices":["가치의 조건화","당위주의","비합리적 신념","자기효능감","완벽주의"],"answer":1,"explain":"'가치의 조건화'. 가장 영향력 있는 부모의 양육태도에 따라 형성됨. ②③ 당위주의·비합리적 신념은 지시적 상담(REBT)에서 벗어나야 할 대상. ④⑤ 해당 없음.","source":{"page":13,"section":"비지시적 상담: 인간중심, 인본주의","quote":"아동은 기본적 욕구인 '긍정적 자기존중'을 얻기 위해 노력하기 때문에 \"가치의 조건화\" 태도를 형성하게 됨"}},{"id":"55-17","type":"옳지 않은 것","q":"비지시적 상담과 실현화 경향성에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["가치의 조건화는 가장 영향력 있는 부모의 양육태도에 따라 형성된다.","모든 사람들은 태어나는 순간부터 자신이 되고자 하는 그 무엇도 될 수 있는 가능성과 잠재력을 가지고 있다.","형성된 가치의 조건화는 실현화 경향성 성취를 방해하는 주요한 원인이 된다.","상담교사는 영재학생 스스로 문제를 해결해 나가도록 촉진해 주는 역할을 한다.","상담교사는 영재학생의 문제를 직접 해결해 주는 역할을 한다."],"answer":5,"explain":"상담교사는 영재학생의 문제를 해결해 주는 것이 아니라 스스로 해결해 나가도록 촉진해 주는 역할. ①~④는 교안과 일치.","source":{"page":14,"section":"실현화 경향성 - 비지시적 상담: 인간중심, 인본주의","quote":"상담교사는 영재학생의 문제를 해결해주는 것이 아니라 영재학생 스스로가 자신의 문제를 해결해 나가도록 촉진해주는 역할을 함"}},{"id":"55-18","type":"개념 찾기","q":"교사가 영재학생의 변화를 위해 가져야 할 인간중심적 태도 중 다음 설명에 해당하는 것은?","box":"· 영재 학생이 순간순간 경험하는 자신의 감정이나 태도를 있는 그대로 진솔하게 인정하고 개방하는 것\n· 학생과의 진솔한 만남, 교사는 학생에게 모델로서 본보기가 됨","choices":["공감적 이해","일치성","무조건적 긍정적 존중","실현화 경향성","래포 형성"],"answer":2,"explain":"일치성에 대한 설명. ① 공감적 이해 = 사적 세계를 정확하고 민감하게 이해. ③ 무조건적 긍정적 존중 = 가치의 조건화를 버리고 조건 없이 수용. ④⑤는 3가지 태도에 해당하지 않음.","source":{"page":15,"section":"교사가 영재학생의 변화를 위해 가져야 할 3가지 인간중심적 태도 - 일치성","quote":"영재 학생이 순간순간 경험하는 자신의 감정이나 태도를 있는 그대로 진솔하게 인정하고 개방하는 것"}},{"id":"55-19","type":"개념 찾기","q":"다음 설명에 해당하는 인간중심적 태도는?","box":"· 가치의 조건화를 버리고 조건 없이 영재학생을 수용하는 것\n· 함부로 평가하고 판단하지 말 것","choices":["일치성","긍정적 자기존중","공감적 이해","무조건적 긍정적 존중","자기 개방"],"answer":4,"explain":"무조건적 긍정적 존중. ① 일치성 = 진솔한 인정·개방. ③ 공감적 이해 = 사적 세계를 이해. ② 긍정적 자기존중은 아동의 기본적 욕구. ⑤ 해당 없음.","source":{"page":15,"section":"교사가 영재학생의 변화를 위해 가져야 할 3가지 인간중심적 태도 - 무조건적 긍정적 존중","quote":"가치의 조건화를 버리고 조건 없이 영재학생을 수용하는 것 / 함부로 평가하고 판단하지 말 것"}},{"id":"55-20","type":"빈칸","q":"공감적 이해에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"영재 학생이 주관적으로 경험하는 사적 세계를 정확하고 민감하게 이해. '(   )'이란 가정을 잃지 않으면서 학생의 감정을 파악하고 이해하는 것","choices":["마치 학생이 교사인 것처럼","마치 교사가 부모인 것처럼","마치 교사가 영재학생인 것처럼","마치 학생이 성인인 것처럼","마치 부모가 교사인 것처럼"],"answer":3,"explain":"교안 표현: '마치 교사가 영재학생인 것처럼'. 나머지는 주체를 바꾼 오답.","source":{"page":16,"section":"교사가 영재학생의 변화를 위해 가져야 할 3가지 인간중심적 태도 - 공감적 이해","quote":"'마치 교사가 영재학생인 것처럼'이란 가정을 잃지 않으면서 학생의 감정을 파악하고 이해하는 것"}},{"id":"55-21","type":"옳은 것","q":"교안에서 제시한 영재학생 상담의 순서와 효과에 대한 설명으로 옳은 것은?","box":null,"choices":["지시적 상담으로 먼저 신념을 교정한 후 비지시적 상담을 하는 것이 효과적이다.","진솔하고 공감적이며 무조건적인 긍정적 존중을 받아 변화된 이후 지시적 상담(REBT)에 들어가면 효과적이다.","비지시적 상담과 지시적 상담은 동시에 진행해야 효과적이다.","영재학생에게는 지시적 상담이 불필요하다.","REBT를 통해 당위주의적 신념을 강화하도록 돕는다."],"answer":2,"explain":"비지시적 상담 → 지시적 상담 순서. 이후 REBT로 당위주의, 비합리적 신념에서 벗어나 현실적인 목표를 설정. ⑤ 당위주의를 강화하는 것이 아니라 벗어나는 것.","source":{"page":17,"section":"비지시적 상담 → 지시적 상담","quote":"만약 영재학생이 교사로부터 진솔하고, 공감적이고, 무조건적인 긍정적 존중을 받는다면, 변화될 수 있음 그 이후에 지시적 상담(인지행동정서치료, REBT)을 들어가면 효과적임"}},{"id":"55-22","type":"보기 조합","q":"\u003c보기\u003e 중 교안에 제시된 '상담심리학의 5대 이론과 치료기법'에 해당하는 것을 모두 고른 것은?","box":"ㄱ. 정신분석\nㄴ. 행동수정\nㄷ. 게슈탈트\nㄹ. 인지행동정서치료","choices":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"5대 이론: 정신분석, 행동수정, 인본주의, 인지치료, 인지행동정서치료. ㄷ 게슈탈트는 교안 목록에 없음.","source":{"page":18,"section":"영재학생을 위한 만능 상담방법","quote":"상담심리학의 5대 이론과 치료기법: 정신분석, 행동수정, 인본주의, 인지치료, 인지행동정서치료"}},{"id":"55-23","type":"옳지 않은 것","q":"'영재학생을 위한 만능 상담방법'에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["어떤 영재이든 적용할 수 있는 만능 상담방법은 존재하지 않는다.","개별 영재학생의 상황에 적합한 방법을 사용한다.","학생과의 Rapport(래포) 형성이 무엇보다 중요하다.","교사를 믿고 좋은 인간관계가 우선되어야 상담도 효과를 볼 수 있다.","인지행동정서치료(REBT)는 모든 영재에게 적용 가능한 만능 상담방법이다."],"answer":5,"explain":"만병통치약이 존재하지 않듯이 어떤 영재이든지 적용할 수 있는 만능 상담방법은 존재하지 않음. ①~④는 교안과 일치.","source":{"page":18,"section":"영재학생을 위한 만능 상담방법","quote":"만병통치약이 존재하지 않듯이, 어떤 영재이든지 적용할 수 있는 만능 상담방법은 존재하지 않음"}}]},{"lesson":56,"title":"영재들의 상담 실제와 Tip (2)","file":"4. 교안 (31~60)[1] (1)/56.pdf","summary":["영재학생 B: 이중언어(Bilingual: English, Korean) 사용, 수업 중 영어 전쟁 서적·SW 프로그램 언어 책, 응용 문장제 해결 못해 성취도 낮음","학습계약서 = 교사와 학생이 함께 학습을 관리하는 도구, 수준 높은 학습 전 반드시 이루어야 할 것 명시 + 선택목록 제시 → 책임감","교사와 학생 모두 서명 → 강제성, 자기주도적 학습 촉진, 한 가지 분야·꼭 필요한 기능에 집중하도록 도움","부모에게도 선물: 매일 저녁 공부량 충돌 방지, 반복이 필요 없는 영재에게 휴식, 계약서 조항으로 넌지시 지적","학습계약서 개발: 몇 칸의 간단한 일지로 개별적 지도안 역할, 복잡할 필요 없음, 교육과정과 무관한 '재미' 위주 프로젝트 지양","사례: 필독도서 독서록 1편, 주제일기 1편·자유일기 1편(1편은 반드시 한글), 국어 단원평가 적어도 80점, The Battle of Midway 등, 두 번의 회의","학습계약서 효과: 책임감, 학습동기 촉진, 권한 이임→자립심, 이미 아는 내용 재학습 스트레스 감소, 궁극적으로 평생학습자","영재학생 C: 공상, 수업 중 졸음, 급히 대충 해결 시 오답, 예의 없는 말투, 지각 → 행동수정 필요, 수면장애 검사, 개별 진도 과제, 보상으로 선택활동","행동계약서 가치: 과제 집중·산만함 방지, 충동심 자제, 계획·시간관리 조절능력, 칭찬 → 작은 성공경험으로 자존감 향상","행동계약서 사례: 저녁 8시까지 수학숙제, 부모는 7시-8시 집에 있음(정답 여부는 확인 안 함), 8시-9시 자유시간, 9시-10시 부모와 시간, 10시 취침, 6시-7시 기상, 한 달 지각 안 하면 선물","행동계약서 Tip: 학생·학부모·교사 함께 의논·서명(팀워크), 외적강화도 일정 부분 필요, 강도 점차 높임, 자기주도학습 제1단계 스캐폴딩(scaffolding) 기법(일명 자전거 타기 기법)"],"questions":[{"id":"56-01","type":"옳지 않은 것","q":"영재학생 B의 사례에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["수학 응용 문장제를 잘 해결하여 성취도가 높다.","영어책만 읽고, 영어로 글을 쓸 수 있다.","수업시간에 영어로 된 전쟁 연관 서적이나 SW 관련 프로그램 언어 책을 본다.","종이로 무기와 비행기를 만들기도 한다.","이중언어(English, Korean)를 사용하는 상황이다."],"answer":1,"explain":"B는 수학 문제를 풀 수 있지만 응용된 문장제가 나오면 해결하지 못하여 성취도가 낮다. ⑤~④는 교안과 일치.","source":{"page":3,"section":"영재학생 B의 사례","quote":"수학 문제를 풀 수 있지만, 응용된 문장제가 나오면 해결하지 못하여 성취도 낮음."}},{"id":"56-02","type":"옳은 것","q":"학습계약서의 가치에 대한 설명으로 옳은 것은?","box":null,"choices":["교사가 단독으로 학생의 학습을 관리하는 도구이다.","학생이 교육과정에서 배제되었다는 인식을 준다.","수준 높은 학습에 대한 선택목록은 제시하지 않는다.","수준 높은 학습에 참여하기 전에 반드시 이루어야만 하는 것을 명시한다.","학생에게 학습 결과에 대한 책임을 면제해 준다."],"answer":4,"explain":"학습계약서는 아이가 보다 수준 높은 학습에 참여하기 전에 반드시 이루어야만 하는 것을 명시. ① 교사와 학생이 함께 관리. ③ 선택목록을 제시. ②⑤ 스스로 교육과정에 참여했다는 의식 → 책임감을 가지게 함.","source":{"page":4,"section":"학습계약서의 가치","quote":"교사와 학생이 함께 학습을 관리하는 도구로 활용 아이가 보다 수준 높은 학습에 참여하기 전에 반드시 이루어야만 하는 것을 명시 수준 높은 학습에 대한 선택목록을 제시"}},{"id":"56-03","type":"빈칸","q":"학습계약서의 가치에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"학생 스스로 교육과정에 참여했다는 의식을 심어줌으로써 자신의 학습활동에 일종의 (   )을/를 가지게 하는 효과를 줌","choices":["경쟁심","책임감","우월감","성취감","자부심"],"answer":2,"explain":"교안: '일종의 책임감을 가지게 하는 효과'. 나머지는 교안 표현이 아님.","source":{"page":4,"section":"학습계약서의 가치","quote":"학생 스스로 교육과정에 참여했다는 의식을 심어줌으로써 자신의 학습활동에 일종의 책임감을 가지게 하는 효과를 줌"}},{"id":"56-04","type":"옳은 것","q":"학습계약서가 '강제성'을 가지는 이유로 교안에 제시된 것은?","box":null,"choices":["교사와 학생 모두가 서명하는 것이기 때문","학교장의 결재를 받기 때문","학부모가 공증하기 때문","교육청에 제출하기 때문","성적에 반영되기 때문"],"answer":1,"explain":"교사와 학생 모두가 서명하는 것이기 때문에 강제성을 가짐. 나머지는 교안에 없음.","source":{"page":5,"section":"학습계약서의 가치","quote":"교사와 학생 모두가 서명하는 것이기 때문에 강제성을 가짐 영재학생의 자기주도적인 학습을 촉진하는데 톡톡한 역할"}},{"id":"56-05","type":"사례","q":"다음 상황에서 학습계약서가 하는 역할로 교안에 제시된 것은?","box":"영재학생이 호기심으로 인하여 더 매혹적인 내용이 나타나자, 이전의 활동을 성취하기 전에 새로운 활동에 몰두하기 시작하였다.","choices":["새로운 활동으로 즉시 전환하도록 허용한다.","새로운 활동에 대한 벌점을 부과한다.","모든 활동을 중단하고 휴식하게 한다.","한 가지 분야에 집중하거나 꼭 필요한 기능에 집중하도록 돕는다.","부모에게 즉시 통보하게 한다."],"answer":4,"explain":"이럴 때 계약서는 한 가지 분야에 집중하거나 꼭 필요한 기능에 집중하도록 도움. 나머지는 교안에 없음.","source":{"page":5,"section":"학습계약서의 가치","quote":"호기심으로 인하여 더 매혹적인 내용이 나타나면 이전의 활동을 성취하기 전에 새로운 활동에 몰두하기도 하는데, 이럴 때 계약서는 한 가지 분야에 집중하거나 꼭 필요한 기능에 집중하도록 도움"}},{"id":"56-06","type":"옳지 않은 것","q":"학습계약서가 '부모에게도 선물이 될 수 있는' 이유로 옳지 않은 것은?","box":null,"choices":["매일 저녁 얼마나 공부할지에 대한 아이와의 충돌을 방지한다.","스스로 의미 있게 학습하는 모습을 보면 규칙을 강요할 필요가 없음을 느낀다.","반복이 필요 없는 영재 아이에게 휴식이 될 수 있다.","학습에 집중하지 않을 경우 계약서의 조항으로 넌지시 지적할 수 있다.","부모가 직접 매일의 학습량을 정해 아이에게 통보할 수 있다."],"answer":5,"explain":"⑤는 교안에 없으며 오히려 규칙을 강요할 필요가 없다는 취지와 반대. ①~④는 교안과 일치.","source":{"page":6,"section":"학습계약서의 가치 - 부모에게도 선물이 될 수 있음","quote":"매일 저녁 얼마나 공부할지에 대한 아이와의 충돌을 방지함 스스로 의미 있게 학습하는 모습을 본다면 학습에 관해 아이에게 규칙을 강요할 필요가 없음을 느낌"}},{"id":"56-07","type":"옳은 것","q":"학습계약서의 개발과 사용에 대한 설명으로 옳은 것은?","box":null,"choices":["가능한 한 복잡하고 상세하게 작성해야 한다.","몇 칸의 간단한 일지로 개별적 지도안의 역할을 한다.","교사가 결과물을 대신 계획하고 실행한다.","교육과정과 무관한 '재미' 위주의 프로젝트를 지향한다.","학생은 결과물을 선보일 필요가 없다."],"answer":2,"explain":"몇 칸의 간단한 일지로 개별적 지도안의 역할, 복잡할 필요 없음. ③⑤ 학생들은 결과물을 선보이기 위해 스스로 계획하고 실행. ④ '재미' 위주 프로젝트만을 지향해서는 안 됨.","source":{"page":7,"section":"학습계약서의 개발과 사용","quote":"몇 칸의 간단한 일지로 개별적 지도안의 역할을 함 복잡할 필요가 없음 학생들은 결과물들을 선보이기 위해 스스로 계획하고 실행해야 함 교육과정과 무관한 '재미' 위주의 프로젝트만을 지향해서는 안 됨"}},{"id":"56-08","type":"옳은 것","q":"교안에 제시된 학습계약서의 내용 항목에서 '학습목표'의 기준으로 제시된 것은?","box":null,"choices":["국가교육과정 성취수준","학생의 희망 진로","학부모 요구사항","영재교육원 선발 기준","교사의 재량 목표"],"answer":1,"explain":"학습계약서 내용: 학생명, 학년, 날짜, 교사 명, 주제, 학습목표(국가교육과정 성취수준). 교육과정과 연계됨.","source":{"page":8,"section":"학습계약서의 내용","quote":"학생명, 학년, 날짜, 교사 명, 주제 학습목표(국가교육과정 성취수준)"}},{"id":"56-09","type":"옳지 않은 것","q":"교안 학습계약서 내용 예시의 학습목표(국가교육과정 성취수준)로 제시되지 않은 것은?","box":null,"choices":["매체 자료를 활용하여 내용을 효과적으로 발표함","글의 구조를 고려하여 글 전체의 내용을 요약함","목적이나 주제에 따라 알맞은 내용과 매체를 선정하여 글을 씀","영어로 된 원서를 번역하여 한국어로 출판함","작품에 대한 이해와 감상을 바탕으로 하여 다른 사람과 적극적으로 소통함"],"answer":4,"explain":"④는 교안 학습목표에 없음. ①②③⑤는 교안의 학습목표 목록에 있음.","source":{"page":8,"section":"학습계약서의 내용","quote":"매체 자료를 활용하여 내용을 효과적으로 발표함 / 글의 구조를 고려하여 글 전체의 내용을 요약함 / 목적이나 주제에 따라 알맞은 내용과 매체를 선정하여 글을 씀"}},{"id":"56-10","type":"빈칸","q":"다음은 교안의 학습계약서 사례 중 필수항목이다. (   )에 들어갈 말로 알맞은 것은?","box":"· 매주 다른 친구들과 마찬가지로 주제일기 1편, 자유일기 1편을 작성하여 제출하겠습니다. (그중 1편은 반드시 한글로 작성)\n· 국어 단원평가에서 적어도 (   )점을 받을 것입니다.","choices":["60","70","80","90","100"],"answer":3,"explain":"교안: 국어 단원평가에서 적어도 80점. 나머지 숫자는 오답.","source":{"page":9,"section":"사례: 학습계약서 내용","quote":"국어 단원평가에서 적어도 80점을 받을 것입니다."}},{"id":"56-11","type":"옳은 것","q":"교안의 학습계약서 사례(필수항목)에 대한 설명으로 옳은 것은?","box":null,"choices":["매주 필독도서로 독서록 2편을 작성하여 제출한다.","매주 주제일기와 자유일기는 모두 영어로 작성한다.","주제일기 1편, 자유일기 1편 중 1편은 반드시 한글로 작성한다.","국어 단원평가에서 만점을 받는다.","필수항목은 다른 친구들과 달리 면제된다."],"answer":3,"explain":"주제일기 1편, 자유일기 1편 중 1편은 반드시 한글로 작성. ① 독서록 1편. ② 1편은 반드시 한글. ④ 적어도 80점. ⑤ 다른 친구들과 마찬가지로 작성.","source":{"page":9,"section":"사례: 학습계약서 내용","quote":"매주 다른 친구들과 마찬가지로 주제일기 1편, 자유일기 1편을 작성하여 제출하겠습니다. (그중 1편은 반드시 한글로 작성)"}},{"id":"56-12","type":"개념 찾기","q":"교안의 학습계약서 사례에서 학생이 '제 연구를 위해' 읽겠다고 한 책의 주제와 관련된 것은?","box":"· The Battle of Midway (Craig L. Symonds)\n· 강대국 중의 강대국이 되다: 제2차 세계대전 (제2장)\n· (   )와/과 나 (챕터 13-15)","choices":["노르망디 상륙작전","SW 프로그램 언어","진주만 공습","한국전쟁","미드웨이 해전"],"answer":5,"explain":"교안: '미드웨이 해전과 나(챕터 13-15)'. B는 전쟁 연관 서적에 관심이 많았음.","source":{"page":10,"section":"사례: 학습계약서 내용","quote":"The Battle of Midway (Craig L. Symonds) 강대국 중의 강대국이 되다: 제2차 세계대전 (제2장) 미드웨이 해전과 나(챕터 13-15)"}},{"id":"56-13","type":"빈칸","q":"교안의 학습계약서 사례이다. (   )에 들어갈 말로 알맞은 것은?","box":"저는 발표자료를 만들어 친구들 앞에서 발표하겠습니다. (날짜 ____ 까지) 저는 ____ 선생님과 날짜 ____, ____에 (   )의 회의를 거쳐 기한 내에 연구를 확실히 마치겠습니다.","choices":["한 번","두 번","세 번","네 번","매주"],"answer":2,"explain":"교안: 두 번의 회의를 거쳐 기한 내에 연구를 마침. 날짜 칸도 두 개.","source":{"page":11,"section":"사례: 학습계약서 내용","quote":"저는 ________ 선생님과 날짜 ______, ______ 에 두 번의 회의를 거쳐 기한 내에 연구를 확실히 마치겠습니다."}},{"id":"56-14","type":"보기 조합","q":"\u003c보기\u003e 중 교안에 제시된 '학습계약서의 효과'로 옳은 것을 모두 고른 것은?","box":"ㄱ. 학생들은 자신의 학습에 대한 책임감을 가지게 됨\nㄴ. 영재 학생들에게 권한을 이임하여 스스로 학습을 관리하는 자립심을 키워줌\nㄷ. 이미 알고 있는 교육과정 내용을 다시 학습해야 하는 스트레스를 줄일 수 있음\nㄹ. 궁극적으로 평생학습자가 될 수 있음","choices":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":5,"explain":"ㄱ~ㄹ 모두 교안의 학습계약서 효과. 이외에 합의된 시간이나 도움이 필요할 때 교사와 함께 문제 해결, 학습동기 촉진도 있음.","source":{"page":12,"section":"학습계약서의 효과","quote":"학습동기를 촉진하고, 영재 학생들에게 권한을 이임하여 스스로 학습을 관리하는 자립심을 키워줌 이미 알고 있는 교육과정 내용을 다시 학습해야 하는 스트레스를 줄일 수 있음 궁극적으로 평생학습자가 될 수 있음"}},{"id":"56-15","type":"옳지 않은 것","q":"영재학생 C의 사례에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["공상에 빠져 있는 시간이 많다.","수업시간에 졸거나 아예 잠이 들기도 한다.","집중할 땐 어려운 수학 문제도 잘 푼다.","급히 대충 해결하면 오답이 계속된다.","등교 시간을 철저히 지켜 지각을 하지 않는다."],"answer":5,"explain":"C는 지각을 잘한다. ①~④는 교안과 일치. 그 밖에 교사의 말이 자신의 의견과 다를 경우 예의 없는 말투로 생각을 어필함.","source":{"page":14,"section":"영재학생 C의 사례","quote":"가끔 수업 중 교사의 말이 자신의 의견과 다를 경우 예의 없는 말투로 자신의 생각을 어필함. 지각을 잘함."}},{"id":"56-16","type":"옳은 것","q":"영재학생 C의 상담방향으로 교안에 제시된 것은?","box":null,"choices":["비지시적 상담만 진행한다.","수면장애가 있는 것은 아닌지 검사가 필요하다.","자고 일어나는 시각은 학생 자율에 맡긴다.","학급 전체와 동일한 진도의 과제를 부여한다.","보상 없이 벌점 제도를 운영한다."],"answer":2,"explain":"C의 상담방향: 행동수정 필요, 수면장애 검사, 일정한 시각에 자고 일어나게 함, 개별 진도 과제 부여(문제집과 수학학습프로그램 중 선택), 보상으로 선택활동 부여.","source":{"page":15,"section":"영재학생 C의 상담방향","quote":"행동수정이 필요함 수면장애가 있는 것은 아닌지 검사가 필요함 일정한 시각에 자고 일어나게 함 개별 진도 과제 부여(문제집과 수학학습프로그램 중 선택) 보상으로 선택활동 부여"}},{"id":"56-17","type":"옳지 않은 것","q":"행동계약서의 가치에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["칭찬은 자존감을 떨어뜨리므로 사용을 자제한다.","충동심을 자제하는 것을 배우는 데 도움이 된다.","학습계약서와 유사한 간단한 행동계약서를 사용한다.","계획을 세우고 시간을 관리하는 조절능력을 키워준다.","과제에 집중하고, 산만함을 방지한다."],"answer":1,"explain":"칭찬을 적절히 활용하면 작은 성공경험으로 자존감이 향상됨. ⑤~④는 교안과 일치.","source":{"page":16,"section":"행동계약서의 가치","quote":"계획을 세우고 시간을 관리하는 조절능력을 키워줌 칭찬을 적절히 활용하면 작은 성공경험으로 자존감 향상"}},{"id":"56-18","type":"빈칸","q":"교안의 행동계약서 사례이다. (   )에 들어갈 말로 알맞은 것은?","box":"본인 C(학생 이름)는 매일 저녁 (   )시까지 수학숙제를 마칠 것을 약속합니다.","choices":["6","7","8","9","10"],"answer":3,"explain":"저녁 8시까지 수학숙제. 7시-8시는 부모가 집에 있는 시간, 9시-10시는 부모와 함께하는 시간, 10시는 취침.","source":{"page":17,"section":"사례: 행동계약서 내용","quote":"본인 C(학생 이름)는 매일 저녁 8시까지 수학숙제를 마칠 것을 약속합니다."}},{"id":"56-19","type":"옳은 것","q":"교안의 행동계약서 사례에서 부모(D, E)가 약속한 내용으로 옳은 것은?","box":null,"choices":["두 사람 모두 저녁 6시-7시 사이에 집에 있는다.","문제의 답이 맞았는지 틀렸는지까지 확인한다.","C가 질문할 경우 능력이 닿는 데까지 개념을 설명해 준다.","C가 숙제를 마치지 않으면 직접 벌을 준다.","8시 이후에는 컴퓨터와 핸드폰 사용을 금지한다."],"answer":3,"explain":"부모는 C가 스스로 문제를 풀 수 있도록 질문할 경우 개념을 설명. ① 적어도 한 사람이 7시-8시. ② 정답 여부는 확인하지 않음(C의 책임). ④ 간섭하지 않음, 벌은 선생님에게. ⑤ 8시-9시 컴퓨터·핸드폰 게임 등 자유.","source":{"page":18,"section":"사례: 행동계약서 내용","quote":"우리는 문제의 답이 맞았는지 틀렸는지까지는 확인하지 않을 것입니다. 그것은 C의 책임이기 때문입니다. 그렇지만 우리는 우리의 능력이 닿는 데까지 C가 스스로 문제를 풀 수 있도록 질문할 경우 개념을 설명해 줄 것입니다."}},{"id":"56-20","type":"사례","q":"교안의 행동계약서 사례에서 C가 저녁 8시까지 수학숙제를 끝내지 않았을 경우에 대한 내용으로 옳은 것은?","box":"만일 C가 저녁 8시까지 수학숙제를 끝낸다면, 8시-9시까지 자유롭게 개인시간을 가져도 좋습니다.","choices":["부모가 숙제를 끝낼 때까지 감독한다.","부모가 대신 숙제를 마무리해 준다.","다음 날 자유시간을 두 배로 줄인다.","부모는 간섭하지 않으며, C는 선생님으로부터 벌을 받게 된다.","부모가 선생님에게 연락하여 숙제를 면제받는다."],"answer":4,"explain":"C가 숙제를 마치지 않았다고 하더라도 부모는 간섭하지 않음 → 선생님으로부터 벌을 받게 됨. 나머지는 교안에 없음.","source":{"page":19,"section":"사례: 행동계약서 내용","quote":"C가 숙제를 마치지 않았다고 하더라도 우리는 간섭하지 않을 것입니다. C가 숙제를 하지 않는다면 선생님으로부터 벌을 받게 될 것이기 때문입니다."}},{"id":"56-21","type":"옳지 않은 것","q":"교안의 행동계약서 사례 중 C의 저녁 이후 일과에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["9시부터 10시까지 부모님과 함께 시간을 보낸다.","씻고 나서 10시에는 불을 끄고 침대에 눕는다.","잠이 오지 않으면 책을 읽는 등 다른 활동을 해도 된다.","다음 날 아침 6시-7시에는 일어날 수 있도록 한다.","한 달 동안 지각하지 않으면 부모님께 선물을 요청한다."],"answer":3,"explain":"잠이 오지 않아도 다른 활동을 하지 않겠다고 약속함. ①②④⑤는 교안과 일치(지각하지 않으면 선생님께 확인 도장).","source":{"page":20,"section":"사례: 행동계약서 내용","quote":"씻고 나서 10시에는 불을 끄고 침대에 눕겠습니다. 잠이 오지 않아도 다른 활동을 하지 않겠습니다."}},{"id":"56-22","type":"개념 찾기","q":"행동계약서 Tip에서, 내용이나 빈도의 강도를 점차 높여 나가는 자기주도학습 제1단계 기법(일명 '자전거 타기 기법')은?","box":null,"choices":["래포(Rapport) 기법","스캐폴딩(scaffolding) 기법","인지적 재평가 기법","토큰 경제 기법","가치의 조건화 기법"],"answer":2,"explain":"자기주도학습 제1단계 스캐폴딩(scaffolding) 기법(일명 자전거 타기 기법). 나머지는 해당 명칭이 아님.","source":{"page":21,"section":"행동계약서 Tip","quote":"내용이나 빈도의 강도를 점차 높여나감 자기주도학습 제1단계 스캐폴딩(scaffolding) 기법 (일명 자전거 타기 기법)"}},{"id":"56-23","type":"옳은 것","q":"행동계약서 Tip에 대한 설명으로 옳은 것은?","box":null,"choices":["학생과 학부모, 학생과 교사가 함께 의논하여 서명하며 모두가 한편이 되어 팀워크를 이룬다.","교사가 단독으로 작성하여 학생에게 통보한다.","아이이므로 외적강화는 전혀 필요 없다.","내용이나 빈도의 강도는 처음부터 높게 유지한다.","눈에 보이는 성과는 기대하기 어렵다."],"answer":1,"explain":"학생과 학부모, 학생과 교사가 함께 의논하여 서명 → 팀워크. ③ 아직 아이이기 때문에 외적강화도 일정 부분 필요. ④ 강도를 점차 높여 나감. ⑤ 눈에 보이는 성과를 거둘 수 있음.","source":{"page":21,"section":"행동계약서 Tip","quote":"학생과 학부모, 학생과 교사가 함께 의논하여 서명 (모두가 한편이 되어 팀워크를 이루게 됨) 눈에 보이는 성과를 거둘 수 있음 내적동기화가 되어야 하지만, 아직은 아이이기 때문에 외적강화도 일정 부분 필요함"}}]},{"lesson":57,"title":"우리나라 영재들의 가정환경은 어떨까?","file":"4. 교안 (31~60)[1] (1)/57.pdf","summary":["영재 잠재력에 가장 직접적이며 중요한 영향을 미치는 환경은 가정환경 (경제적 수준, 문화, 형제자매 수, 친밀관계, 지적 환경)","크게 성공한 인물들(칙센트미하이, 스턴버그 등): 흥미·관심에 귀 기울이고 끊임없이 격려·지원해 준 부모나 선생님 덕분","출처: 이신동, 이정규, 박춘성(2020). 최신영재교육학개론(3판). 학지사","영재들의 취미생활: 독서 \u003e 예능 \u003e 체육 \u003e 컴퓨터 순 / 학년이 올라갈수록 혼자 있는 시간, 박사까지 교육 희망","친구관계: 대체로 소수로 깊게, 취미가 같은 친구 / 어려움: 반복학습 위주 학교생활, 시기심, 질문에 답하면 싫어함, 반면 학원수업은 재미","양육방식은 3집단(영재/부/모) 독립적 측정과 면담 필요","영재 응답: 아버지 (자율H, 애정H)·(자율L, 애정L) 반반 / 어머니 (자율L, 애정H) 23%, (자율L, 애정L) 68%","아버지 응답은 영재 응답과 유사·상관관계 높음 / 어머니 93%가 (자율H, 애정H) 응답 → 상관관계 낮음","영향을 많이 준 가족: 어머니(55%), 형/누나/언니(30%), 친척(15%) / 외가 \u003e 친가 / 훈육보다 애정과 지지","부모님과 박물관·고궁·전람회 관람 51.2% \u003e 외식이나 쇼핑 25.6%","부모가 말하는 학교생활: 중학교부터 학년이 올라갈수록 만족도 높음, 자기주도적 학습력 / 학교수업: 편파적, 반복 수업 시 다른 일 → 건방지다, 암기 위주 주입식·입시 위주 교육으로 힘들어함"],"questions":[{"id":"57-01","type":"옳은 것","q":"영재의 가정환경에 대한 연구결과로 옳은 것은?","box":null,"choices":["형제자매의 수, 가족 구성원 간의 친밀관계, 지적 환경 등은 영재성의 발달에 큰 영향을 미친다.","가정의 경제적 수준은 영재성 발달과 무관하다.","영재성 발달에 가장 직접적이며 중요한 영향을 미치는 환경은 학교환경이다.","가정환경은 영재 잠재력에 간접적인 영향만 미친다.","가정의 문화는 영재성 발달에 영향을 주지 않는다."],"answer":1,"explain":"가정의 경제적 수준이나 문화, 형제자매의 수, 친밀관계, 지적 환경 등은 영재성 발달에 큰 영향. ③④ 가장 직접적이며 중요한 환경은 가정환경. ②⑤ 경제적 수준·문화도 큰 영향.","source":{"page":3,"section":"영재의 가정환경에 대한 연구결과","quote":"가정의 경제적 수준이나 문화, 형제자매의 수, 가족 구성원 간의 친밀관계, 지적 환경 등은 영재성의 발달에 큰 영향을 미침"}},{"id":"57-02","type":"개념 찾기","q":"교안에서 '어려서부터 자신의 특별한 흥미나 관심에 귀 기울여주고 끊임없이 격려, 지원해 주는 부모나 선생님이 있었기에 오늘의 성취가 가능했다'고 한, 학문적·사회적으로 크게 성공한 인물로 제시된 사람은?","box":null,"choices":["듀이, 샌델","렌줄리, 가드너","터먼, 테넌바움","로저스, 엘리스","칙센트미하이, 스턴버그"],"answer":5,"explain":"교안은 칙센트미하이, 스턴버그 등을 예로 듦. 나머지 인명은 이 쪽에 제시되지 않음.","source":{"page":4,"section":"영재의 가정환경에 대한 연구결과","quote":"어려서부터 자신의 특별한 흥미나 관심에 귀 기울여주고 끊임없이 격려, 지원해 주는 부모나 선생님이 있었기에 오늘의 성취가 가능했다고 했음 칙센트미하이, 스턴버그 등"}},{"id":"57-03","type":"옳지 않은 것","q":"우리나라 영재들이 부모님을 존경하는 이유로 교안에 제시되지 않은 것은?","box":null,"choices":["가정과 일에 모두 충실하고 별다른 불화 없이 가족을 화목하게 이끌어 나가기 때문","나를 키우기까지 많은 희생과 노력이 있었음을 앎","어려운 환경을 극복해서 훌륭한 사업가로 성공함","명문대 진학을 위해 모든 사교육을 지원해 주었기 때문","상식적인 선을 항상 강조하고 옳고 그른 것을 구별하고 결정하는 길을 제시해 줌"],"answer":4,"explain":"④는 교안에 없음. ①②③⑤는 교안의 존경 이유에 해당.","source":{"page":5,"section":"우리나라 영재들이 부모님을 존경하는 이유는?","quote":"가정과 일에 모두 충실하고 별다른 불화 없이 가족을 화목하게 이끌어 나가기 때문"}},{"id":"57-04","type":"옳은 것","q":"우리나라 영재들이 부모님을 존경하는 이유에 대한 설명으로 옳은 것은?","box":null,"choices":["부모님이 무턱대고 이끌어 주었기 때문","다른 집에 비해 두 분 다 생각이 열리신 분이었으며, 언제나 올바른 길을 제안해 줌","엄격한 통제로 공부 시간을 관리해 줌","성적이 오를 때마다 보상을 해 줌","자녀의 진로를 부모가 대신 결정해 줌"],"answer":2,"explain":"생각이 열리신 분이었으며 올바른 길을 제안해 줌(무턱대고 이끌어 간 것이 아님). ① 반대 서술. ③④⑤ 교안에 없음.","source":{"page":6,"section":"우리나라 영재들이 부모님을 존경하는 이유는?","quote":"다른 집에 비해 두 분 다 생각이 열리신 분이었으며, 언제나 나에게 올바른 길을 제안해 줌 (무턱대고 이끌어 간 것이 아님)"}},{"id":"57-05","type":"옳지 않은 것","q":"우리나라 영재들이 선생님을 존경하는 이유로 옳지 않은 것은?","box":null,"choices":["성적이 우수하다는 이유로 특별히 더 배려하고 편애해 줌","항상 자상하시고 누구보다 날 많이 아껴줌","선생님만의 독특한 교육방법을 통해 자율성과 창의성을 키워줌","고등학교 때 담임선생님은 내내 삶에 대한 충고와 조언을 아끼지 않음","과학전람회 지도교사로서 과학탐구활동에 관심을 가질 수 있도록 도와줌"],"answer":1,"explain":"교안: 다른 선생님들과 달리 성적이 우수하다는 이유로 편애하지 않고 똑같이 엄격히 대함. ②③④⑤는 교안과 일치.","source":{"page":7,"section":"우리나라 영재들이 선생님을 존경하는 이유는?","quote":"다른 선생님들과 달리 성적이 우수하다는 이유로 편애하지 않고 똑같이 엄격히 대함"}},{"id":"57-06","type":"빈칸","q":"우리나라 영재들이 선생님을 존경하는 이유이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   ) 선생님으로서 연구방향과 진로에 영향을 끼침","choices":["물리","화학","지구과학","수학","생물"],"answer":5,"explain":"교안: '생물선생님으로서 연구방향과 진로에 영향을 끼침'.","source":{"page":8,"section":"우리나라 영재들이 선생님을 존경하는 이유는?","quote":"생물선생님으로서 연구방향과 진로에 영향을 끼침"}},{"id":"57-07","type":"옳지 않은 것","q":"우리나라 영재들의 독서 이유로 교안에 제시되지 않은 것은?","box":null,"choices":["책을 읽는 게 재미있고 많은 것을 알거나 생각할 수 있음","책을 읽어가며 작가의 의도나 심정을 파악할 때의 기쁨","새로운 세계에 대한 호기심 충족","부모님이 독서 시간을 정해 강제로 읽게 함","지금도 TV보다는 책이 더 재밌음"],"answer":4,"explain":"④는 교안에 없음. 교안은 어렸을 때 글자 읽는 것을 좋아해 습관처럼 굳어졌다고 함.","source":{"page":9,"section":"우리나라 영재들의 독서 이유는?","quote":"어렸을 때 글자 읽는 것을 좋아하여 책을 자주 보게 되었고, 습관처럼 굳어졌으며 지금도 TV보다는 책이 더 재밌음"}},{"id":"57-08","type":"옳은 것","q":"교안에 제시된 우리나라 영재들의 학창시절 취미생활 순서로 옳은 것은?","box":null,"choices":["독서 \u003e 체육 \u003e 예능 \u003e 컴퓨터","독서 \u003e 예능 \u003e 체육 \u003e 컴퓨터","예능 \u003e 독서 \u003e 컴퓨터 \u003e 체육","컴퓨터 \u003e 독서 \u003e 예능 \u003e 체육","독서 \u003e 컴퓨터 \u003e 예능 \u003e 체육"],"answer":2,"explain":"교안: 독서 \u003e 예능 \u003e 체육 \u003e 컴퓨터 순서. 나머지는 순서를 바꾼 오답.","source":{"page":10,"section":"우리나라 영재들의 학창시절은?","quote":"취미생활: 독서 \u003e 예능 \u003e 체육 \u003e 컴퓨터 순서"}},{"id":"57-09","type":"옳은 것","q":"우리나라 영재들의 학창시절에 대한 설명으로 옳은 것은?","box":null,"choices":["학년이 올라갈수록 최종학위인 박사까지의 교육을 희망","학년이 올라갈수록 혼자 있는 시간을 즐기는 빈도가 낮아짐","학년이 올라갈수록 학사까지만 교육을 희망","취미생활 중 컴퓨터가 가장 높은 순위","학년과 무관하게 희망 학위가 일정함"],"answer":1,"explain":"학년이 올라갈수록 박사까지의 교육을 희망. ② 혼자 있는 시간을 즐기는 빈도가 높아짐. ④ 컴퓨터는 가장 낮은 순위.","source":{"page":10,"section":"우리나라 영재들의 학창시절은?","quote":"학년이 올라갈수록 혼자 있는 시간을 즐기는 빈도가 높아짐 학년이 올라갈수록 최종학위인 박사까지의 교육을 희망"}},{"id":"57-10","type":"보기 조합","q":"\u003c보기\u003e 중 우리나라 영재들의 친구관계에 대한 교안 내용으로 옳은 것을 모두 고른 것은?","box":"ㄱ. 대체로 소수로 깊게, 취미가 같은 친구가 많았음\nㄴ. 반복학습 위주의 학교생활에 흥미를 잃어서 학교 가는 것과 친구와의 교류가 재미가 없었음\nㄷ. 선생님의 질문에 답을 하면 반 친구들이 싫어해 나중에는 아예 입을 다물게 됨\nㄹ. 학원수업에도 흥미를 느끼지 못함","choices":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"explain":"ㄱ·ㄴ·ㄷ은 교안과 일치. ㄹ은 틀림 → 반면 학원수업에는 재미를 느낌. 그 외 다른 아이들의 시기심 때문에 힘들었음.","source":{"page":11,"section":"우리나라 영재들의 친구관계는?","quote":"대체로 소수로 깊게, 취미가 같은 친구가 많았음 / 반면 학원수업에는 재미를 느낌"}},{"id":"57-11","type":"빈칸","q":"우리나라 영재들의 양육방식 연구에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"(   )집단(영재/부/모) 독립적 측정과 면담이 필요","choices":["2","3","4","5","6"],"answer":2,"explain":"영재/부/모의 3집단 독립적 측정과 면담이 필요.","source":{"page":13,"section":"우리나라 영재들의 양육방식","quote":"3집단(영재/부/모) 독립적 측정과 면담이 필요"}},{"id":"57-12","type":"옳은 것","q":"학창시절 부/모님의 양육방식에 대한 '영재의 응답'으로 옳은 것은?","box":null,"choices":["아버지는 (자율 H, 애정 H)가 대부분이었다.","어머니는 (자율 H, 애정 H)가 93%였다.","아버지는 (자율 H, 애정 H), (자율 L, 애정 L)가 반반 비율이었다.","어머니는 (자율 L, 애정 H)가 68%였다.","어머니는 (자율 L, 애정 L)가 23%였다."],"answer":3,"explain":"영재의 응답: 아버지는 (자율H, 애정H), (자율L, 애정L)가 반반. 어머니는 (자율L, 애정H) 23%, (자율L, 애정L) 68%. ② 93%는 어머니 본인의 응답. ④⑤ 수치를 바꾼 오답.","source":{"page":13,"section":"우리나라 영재들의 양육방식","quote":"아버지는 (자율 H, 애정 H), (자율 L, 애정 L)가 반반 비율 / 어머니는 (자율 L, 애정 H) 23%, (자율 L, 애정 L) 68%로 응답"}},{"id":"57-13","type":"빈칸","q":"다음은 학창시절 양육방식에 대한 '영재의 응답' 중 어머니에 관한 내용이다. (   )에 들어갈 수치로 알맞은 것은?","box":"어머니는 (자율 L, 애정 H) 23%, (자율 L, 애정 L) (   )%로 응답","choices":["23","51.2","55","68","93"],"answer":4,"explain":"(자율L, 애정L) 68%. ① 23%는 (자율L, 애정H). ② 51.2%는 박물관·고궁·전람회 관람. ③ 55%는 영향을 준 가족 중 어머니. ⑤ 93%는 어머니 본인 응답의 (자율H, 애정H).","source":{"page":13,"section":"우리나라 영재들의 양육방식","quote":"어머니는 (자율 L, 애정 H) 23%, (자율 L, 애정 L) 68%로 응답"}},{"id":"57-14","type":"옳지 않은 것","q":"학창시절 양육방식에 대한 '부모의 응답'에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["아버지의 응답은 영재의 응답과 유사하다.","아버지의 응답은 영재의 응답과 상관관계가 높다.","어머니의 93%가 (자율 H, 애정 H)로 응답하였다.","어머니는 본인의 삶과 직장을 희생하고 지원하였다고 응답하였다.","어머니의 응답은 영재의 응답과 상관관계가 높다."],"answer":5,"explain":"어머니의 응답은 93%가 (자율H, 애정H)로 영재 응답과 상관관계가 낮음. ①②③④는 교안과 일치(공부하는 데 불편하지 않도록 우선 지원 등).","source":{"page":14,"section":"학창시절에 부/모님의 양육방식은?","quote":"어머니의 응답 / 93%가 (자율 H, 애정 H)으로 응답하여 상관관계 낮음 / 본인의 삶과 직장을 희생하고 지원, 공부하는 데 불편하지 않도록 우선 지원 등"}},{"id":"57-15","type":"
