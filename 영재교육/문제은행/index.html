"제재 방안은 2022학년도 입학생부터 의약학 계열 진학 희망·지원 시 일반고 전출 권고, 학교생활기록부Ⅱ 제공, 교육비·장학금 환수 등을 실시하는 것이다. ⑤는 교안에 없다. 이 방안을 안정적으로 적용하여 이공계 진로·진학 지도를 강화한다.","source":{"page":19,"section":"중점 추진과제 3은 무엇인가요?","quote":"2022 학년도입학생부터의약학계열진학을희망하거나지원시, 일반고전출권고, 학교생활기록부 Ⅱ제공 , 교육비 ‧장학금 환수등실시"}},{"id":"05-26","type":"옳은 것","q":"중점 추진과제 3(영재학교 등 영재교육기관 내실화 및 성과 관리 추진)에 대한 설명으로 옳은 것은?","box":null,"choices":["영재학교는 입학 전형의 사교육 유발 정도 등을 3년마다 점검한다.","영재학교 입학 전형의 사교육 유발 정도 점검은 2025년부터 시작한다.","학교 운영에 대한 성과평가 제도를 2021년부터 도입하였다.","영재학교는 입학 전형의 사교육 유발 정도 등을 매년 점검(2021년~)하여 다음 연도 입학 전형을 개선해 나가야 한다.","의약학 계열 진학 제재 방안은 2025학년도 입학생부터 적용한다."],"answer":4,"explain":"사교육 유발 정도는 ‘매년 점검(2021년~)’, 성과평가 제도는 ‘도입(2025년~)’이다. ① 3년마다 아님. ② 점검은 2021년~. ③ 성과평가는 2025년~. ⑤ 제재 방안은 2022학년도 입학생부터.","source":{"page":20,"section":"중점 추진과제 3은 무엇인가요?","quote":"영재학교는 입학전형의사교육유발정도등을매년점검(2021년~) 하여 다음연도입학전형을개선해나가야함‣ 학교 운영에대한성과평가제도를도입(2025년~)"}},{"id":"05-27","type":"보기 조합","q":"제5차 영재교육종합계획에서 영재학급과 영재교육원의 특성화·내실화 방향으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 영재학급은 단위 학교에서 잠재력 있는 학생의 재능 계발을 중심으로 운영한다.\nㄴ. 영재교육원은 해당 분야 다양한 주제의 수준별 교육 및 전문가 사사 교육을 중심으로 운영한다.\nㄷ. 영재학급은 전문가 사사 교육을 중심으로 운영한다.\nㄹ. 영재교육원은 단위 학교에서 재능 계발을 중심으로 운영한다.","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"answer":1,"explain":"영재학급 = 단위 학교에서 잠재력 있는 학생의 재능 계발 중심, 영재교육원 = 해당 분야 다양한 주제의 수준별 교육 및 전문가 사사 교육 중심. ㄷ, ㄹ은 두 기관의 역할을 뒤바꾼 것이다.","source":{"page":20,"section":"중점 추진과제 3은 무엇인가요?","quote":"영재학급은 단위학교에서잠재력있는학생의재능계발을중심으로, 영재교육원은 해당분야다양한주제의수준별교육및전문가 사사교육을중심으로운영되도록하는등‣ 특성화 ‧내실화를 추진"}}]},{"lesson":6,"title":"우리나라 영재교육기관의 최근 동향","file":"4. 교안 (1~30)/06.pdf","summary":["8개 과학영재학교: 서울/경기/대구/대전/광주과학고, 인천/세종과학예술영재학교, KAIST 부설 한국과학영재학교(KSA)","영재학교 8교(공립 7교, 국립 1교), ’22년 재학생 2,500명(입학정원 789명), 「영재교육 진흥법」, 이공계 분야 우수인재 양성, 교육부장관 지정(중앙영재교육진흥위원회 심의), 재지정평가 없음","과학고 20교(공립 20교), 4,377명(입학정원 1,638명), 「초·중등교육법」, 과학 분야 우수인재 양성, 시·도교육감 지정(교육부장관 동의), 5년 주기 재지정평가","교육과정: 영재학교 = 학칙, 무학년제·학점제, 영재학교장이 교재 채택·학교생활기록 별도 작성 / 과학고 = 국가교육과정, 학년제·총 이수단위제(2학년 조기졸업 가능), 검·인정 교과용도서, NEIS 의무","학생선발: 영재학교는 중학교 재학생도 지원, 전국단위 모집, 사회통합 정원 외 선발(권장) / 과학고는 광역단위 모집(세종·광주는 인근 시·도 지원 가능), 사회통합 정원 내 20%(의무)","서울과학고: 다중근거, 다단계 전형 / 1단계 관찰소견서 A·B, 자기소개서, 학교생활기록부 II → 2단계 영재성 및 사고력 검사, 창의력·문제해결력 검사 → 3단계 과학영재 캠프(실험평가, 과제수행, 과학 글쓰기) / 외부 수상실적 기재 시 불이익 / 지역 인재 우선선발 41개 지역 각 2명 이내 / 12월 1일 최종 발표","한국과학영재학교: 1단계 학생기록물평가 → 2단계 창의적 문제해결력 평가 → 3단계 영재성 다면평가(정원 120명의 80% 내외 최종합격대상자)","영재교육원·영재학급 = 비전일제 영재교육기관, 교사관찰추천제 도입(사교육·선행학습 효과 최소화, 소외계층 영재성 발굴) / 교사관찰추천 평가요소 반영 기관 2022년 기준 77.4%","2022년 선발 도구 활용: 교사관찰추천 체크리스트 61.7%(900기관), KEDI 심층면접도구 등 36.2%, KEDI 영재성 검사 35.4% / KEDI 검사도구는 15개 교육청 활용(서울, 인천 제외)","KEDI 영재성검사: 창의사고 영재성검사(30분) + 영역별 60분(기본 A형)/90분(심화 B형) 수학·과학·수과학 통합·인문사회·정보과학 = 6가지 / 기본형 4가지 테마, 심화형 5가지 테마","교사관찰추천제 절차: 잠재 영재군 형성 → 교사의 관찰 수행 → 영재교육대상자 추천(학교추천위원회) → 영재교육기관 선발(선정심사위원회) / 자기체크리스트는 선정에 영향 없음 / 교사 체크리스트 영재행동특성(10점)·창의적 인성(10점)","서울 영재교육원: 초등 연간 90시간 이상(수요일 또는 토요일), 중등 100시간 이상(토요일), 1차시 50분, 선행학습 아닌 심화학습 / 대구 영재학급: 최소 80시간, 인성 및 리더십 2시간 이상, 강사 2명 이상, 급당 정원 20명, 초4~고1"],"questions":[{"id":"06-01","type":"옳지 않은 것","q":"교안에 제시된 ‘8개 과학영재학교 현황’에 포함되지 않는 학교는?","box":null,"choices":["경기과학고","대구과학고","울산과학고","세종과학예술영재학교","KAIST 부설 한국과학영재학교(KSA)"],"answer":3,"explain":"8개 과학영재학교는 서울/경기/대구/대전/광주과학고, 인천/세종과학예술영재학교, KAIST 부설 한국과학영재학교(KSA)이다. 울산과학고는 목록에 없다.","source":{"page":3,"section":"8개 과학영재학교 현황","quote":"서울/ 경기 / 대구 / 대전 / 광주과학고 인천/세종과학예술영재학교 KAIST 부설한국과학영재학교 (KSA)"}},{"id":"06-02","type":"개념 찾기","q":"8개 과학영재학교 중 KAIST 부설 영재학교는?","box":null,"choices":["서울과학고","한국과학영재학교(KSA)","인천과학예술영재학교","광주과학고","대전과학고"],"answer":2,"explain":"KAIST 부설 영재학교는 한국과학영재학교(KSA)이다. 서울·대전·광주과학고는 ‘과학고’ 명칭의 영재학교, 인천은 과학예술영재학교이다.","source":{"page":3,"section":"8개 과학영재학교 현황","quote":"KAIST 부설한국과학영재학교 (KSA)"}},{"id":"06-03","type":"옳은 것","q":"영재학교와 과학고등학교의 운영 현황에 대한 설명으로 옳은 것은? (교육부(2023), 제5차 영재교육종합계획)","box":null,"choices":["과학고등학교는 20교이며 그중 국립이 2교이다.","’22년 영재학교 재학생 수는 4,377명이다.","과학고등학교의 입학정원은 789명이다.","영재학교는 8교(공립 7교, 국립 1교)이다.","영재학교는 8교 모두 공립이다."],"answer":4,"explain":"영재학교 8교(공립 7교, 국립 1교), 과학고 20교(공립 20교). ① 과학고는 모두 공립. ② 4,377명은 과학고 재학생 수(영재학교는 2,500명). ③ 789명은 영재학교 입학정원(과학고는 1,638명). ⑤ 국립 1교가 있다.","source":{"page":4,"section":"영재학교와 과학고는 어떻게 운영되나요?","quote":"운영현황8 교 ( 공립 7 교 , 국립 1 교 ) 20교( 공립 20교) / ’22 년재학생 수( ’22.4. 기준)2,500명( 입학정원 : 789명)4,377명( 입학정원 : 1,638명)"}},{"id":"06-04","type":"옳지 않은 것","q":"영재학교와 과학고등학교의 근거법령 및 학교 설립·지정에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재학교는 5년 주기로 재지정평가를 받는다.","영재학교의 근거법령은 「영재교육 진흥법」이다.","과학고등학교의 근거법령은 「초·중등교육법」이다.","영재학교의 지정(취소) 권한은 교육부장관(중앙영재교육진흥위원회 심의)에게 있다.","과학고등학교의 지정(취소) 권한은 시·도교육감(교육부장관 동의)에게 있다."],"answer":1,"explain":"영재학교는 재지정평가 ‘평가제도 없음’이고, 5년 주기 평가는 과학고등학교이다. ②~⑤는 교안 표와 일치한다.","source":{"page":4,"section":"영재학교와 과학고는 어떻게 운영되나요?","quote":"지정( 취소 ) 권한교육부장관 / (중앙영재교육진흥위원회 심의)시‧도교육감 / 학교설립지정 / (교육부장관 동의)재지정평가평가제도없음5 년주기 평가"}},{"id":"06-05","type":"빈칸","q":"영재학교와 과학고등학교의 설립목적이다. (ㄱ), (ㄴ)에 들어갈 말로 알맞은 것은?","box":"· 영재학교: (ㄱ) 분야 우수인재 양성\n· 과학고등학교: (ㄴ) 분야 우수인재 양성","choices":["ㄱ: 과학, ㄴ: 이공계","ㄱ: 수학·과학, ㄴ: 과학","ㄱ: 융합, ㄴ: 수학·과학","ㄱ: 첨단기술, ㄴ: 이공계","ㄱ: 이공계, ㄴ: 과학"],"answer":5,"explain":"영재학교 설립목적은 ‘이공계 분야 우수인재 양성’, 과학고는 ‘과학 분야 우수인재 양성’이다. ①은 둘을 뒤바꾼 것이고, ②③④는 교안에 없는 표현이다.","source":{"page":4,"section":"영재학교와 과학고는 어떻게 운영되나요?","quote":"설립목적이공계분야우수인재양성과학분야우수인재양성"}},{"id":"06-06","type":"옳지 않은 것","q":"영재학교와 과학고등학교의 교육과정 운영에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재학교의 교육과정 편성·운영은 학칙으로 정한다.","과학고등학교는 국가교육과정(교육부 고시)에 따른다.","영재학교는 학교생활기록에 교육행정정보시스템(NEIS)을 의무 사용한다.","영재학교는 무학년제, 학점제를 운영한다.","과학고등학교는 교육부장관 검·인정 교과용도서를 사용한다."],"answer":3,"explain":"영재학교의 학교생활기록은 ‘영재학교장이 별도 작성·관리’하며, NEIS 의무 사용은 과학고등학교이다. 나머지는 교안 표와 일치한다.","source":{"page":5,"section":"영재학교와 과학고는 어떻게 운영되나요?","quote":"학교생활기록영재학교장이별도작성‧관리 교육행정정보시스템(NEIS) 의무사용"}},{"id":"06-07","type":"사례","q":"다음 설명에 해당하는 학교 유형은?","box":"· 학년 구분 없이 학점제로 운영된다.\n· 학교장이 필요한 도서 또는 교재를 채택한다.\n· 학교생활기록을 학교장이 별도로 작성·관리한다.","choices":["과학고등학교","영재학교","영재교육원","영재학급","일반고등학교"],"answer":2,"explain":"무학년제·학점제 운영, 영재학교장이 필요한 도서 또는 교재 채택, 학교생활기록 별도 작성·관리는 영재학교의 특징이다. 과학고는 학년제·총 이수단위제, 검·인정 교과용도서, NEIS 의무 사용이다.","source":{"page":5,"section":"영재학교와 과학고는 어떻게 운영되나요?","quote":"졸업제도무학년제, 학점제 운영학년제, 총이수단위제 운영※ 2 학년 조기졸업가능 / 교육과정운영 / 교과용도서영재학교장이필요한도서또는교재채택"}},{"id":"06-08","type":"빈칸","q":"과학고등학교의 졸업제도에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"학년제, 총 이수단위제 운영\n※ (   ) 조기졸업 가능","choices":["1학년","2학년","3학년 1학기","조기졸업 불가","학점 취득 시 언제든"],"answer":2,"explain":"과학고등학교는 학년제, 총 이수단위제를 운영하며 ‘2학년 조기졸업 가능’이다. 나머지는 교안과 다르다.","source":{"page":5,"section":"영재학교와 과학고는 어떻게 운영되나요?","quote":"학년제, 총이수단위제 운영※ 2 학년 조기졸업가능"}},{"id":"06-09","type":"옳은 것","q":"영재학교와 과학고등학교의 입학자격 및 모집단위에 대한 설명으로 옳은 것은?","box":null,"choices":["과학고등학교는 중학교 재학생도 입학자격이 있다.","영재학교는 소재지 시·도 학생을 대상으로 광역단위 모집한다.","과학고등학교는 전국단위로 모집한다.","영재학교는 중학교(각종 학교 포함) 재학생도 입학자격이 있다.","과학고가 없는 세종·광주 학생은 과학고에 지원할 수 없다."],"answer":4,"explain":"영재학교 입학자격에는 졸업자, 동등 이상 학력 인정자 외에 ‘중학교(각종 학교 포함) 재학생’이 포함된다. ① 재학생 자격은 영재학교만. ② 영재학교는 전국단위 모집. ③ 과학고는 소재지 시·도 학생(광역단위 모집). ⑤ 세종·광주는 인근 시·도 과학고 지원 가능.","source":{"page":6,"section":"영재학교와 과학고는 어떻게 운영되나요?","quote":"• 중학교 ( 각종 학교포함) 재학생 / 학생선발 / 일반전국단위모집소재지시· 도학생 ( 광역단위 모집)※과학고가 없는세종‧광주는 인근시‧도과학고 지원가능"}},{"id":"06-10","type":"옳지 않은 것","q":"영재학교와 과학고등학교의 학생선발에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재학교는 전국단위로 모집한다.","과학고등학교는 소재지 시·도 학생을 광역단위로 모집한다.","과학고가 없는 세종·광주는 인근 시·도 과학고 지원이 가능하다.","과학고등학교는 사회통합 전형으로 정원 내 20%를 의무 선발한다.","영재학교는 사회통합 전형으로 정원 내 20%를 의무 선발한다."],"answer":5,"explain":"영재학교의 사회통합 선발은 ‘정원 외 선발(권장)’이고, ‘정원 내 20%(의무)’는 과학고등학교이다. ①~④는 교안과 일치한다.","source":{"page":6,"section":"영재학교와 과학고는 어떻게 운영되나요?","quote":"사회통합정원외선발 ( 권장 )정원내20%( 의무)"}},{"id":"06-11","type":"옳지 않은 것","q":"서울과학고의 다중근거, 다단계 전형에서 검사 유형과 그 내용의 연결로 옳지 않은 것은?","box":null,"choices":["서류검사 - 관찰소견서","서류검사 - 자기소개서","심리검사 - 창의적 문제해결력검사","심리검사 - 문제해결력 수행평가","행동검사 - 영재캠프"],"answer":4,"explain":"문제해결력 수행평가는 영재캠프와 함께 ‘행동검사’에 해당한다. 서류검사 = 관찰소견서, 학생생활기록부, 자기소개서 등 / 심리검사 = 영재성검사, 창의적 문제해결력검사, 사고력검사, 학업적성검사 등 / 행동검사 = 문제해결력 수행평가, 영재캠프 등.","source":{"page":7,"section":"영재학교의 전형방법은 어떻게 되나요? 서울과학고 다중근거, 다단계 전형","quote":"‣ 행동검사 / • 문제해결력 수행평가, 영재캠프 등"}},{"id":"06-12","type":"빈칸","q":"다음은 서울과학고 전형의 특징을 나타낸 것이다. (   )에 들어갈 말로 알맞은 것은?","box":"서울과학고 (   ) 전형: 서류검사, 심리검사, 행동검사를 통한 전형(판별, 선발)","choices":["다중근거, 다단계","단일근거, 다단계","다중근거, 단일단계","교사관찰추천","선교육·후선발"],"answer":1,"explain":"교안은 서울과학고 전형을 ‘다중근거, 다단계 전형’으로 제시하며, 서류검사·심리검사·행동검사를 통해 전형(판별, 선발)한다. ②③은 표현을 비튼 것이고, ④는 영재교육원·영재학급의 선발 방식, ⑤는 제5차 계획의 방향이다.","source":{"page":7,"section":"영재학교의 전형방법은 어떻게 되나요?","quote":"영재학교의전형방법은 어떻게되나요? 서울과학고다중근거, 다단계 전형"}},{"id":"06-13","type":"옳은 것","q":"서울과학고 전형방법(2024학년도 입학설명회)의 단계별 내용으로 옳은 것은?","box":null,"choices":["1단계에서 창의력·문제해결력 검사를 실시한다.","2단계에서 관찰소견서 A, B를 평가한다.","3단계는 과학영재 캠프이다.","2단계에서 과학영재 캠프를 실시한다.","1단계에서 영재성 및 사고력 검사를 실시한다."],"answer":3,"explain":"1단계: 관찰소견서 A, B, 자기소개서, 학교생활기록부 II / 2단계: 영재성 및 사고력 검사, 창의력·문제해결력 검사 / 3단계: 과학영재 캠프. ①⑤는 2단계 내용, ②는 1단계 내용, ④는 3단계 내용이다.","source":{"page":8,"section":"영재학교의 전형방법은 어떻게 되나요? 서울과학고 전형방법","quote":"1 단계 • 관찰소견서 A, B• 자기소개서 • 학교생활기록부 II / 2 단계 • 영재성 및사고력 검사• 창의력 · 문제해결력 검사 / 3 단계 • 과학영재 캠프"}},{"id":"06-14","type":"옳은 것","q":"한국과학영재학교 전형방법(2024학년도 신입생 선발 모집요강, 일반전형)에 대한 설명으로 옳은 것은?","box":null,"choices":["1단계 전형은 창의적 문제해결력 평가이다.","2단계 전형은 영재성 다면평가이다.","3단계 전형에서 정원 150명의 80% 내외를 최종합격대상자로 선발한다.","1단계 전형은 담임교사의 추천서만으로 평가한다.","3단계 전형인 영재성 다면평가에서 최종합격대상자(정원 120명의 80% 내외)를 선발한다."],"answer":5,"explain":"1단계 학생기록물평가(입학담당관) → 2단계 창의적 문제해결력 평가 → 3단계 영재성 다면평가(정원 120명의 80% 내외 최종합격대상자 선발). ① 1단계는 학생기록물평가. ② 2단계는 창의적 문제해결력 평가. ③ 정원은 120명. ④ 제출된 서류에 의한 영재성 평가이며 입학담당관이 평가.","source":{"page":9,"section":"영재학교의 전형방법은 어떻게 되나요? 한국과학영재학교 전형방법","quote":"3 단계 전형영재성다면평가 / • 글로벌 과학자로서의자질및잠재성을 평가• 최종합격대상자 ( 정원 120명의80%내외) 선발"}},{"id":"06-15","type":"개념 찾기","q":"한국과학영재학교 전형 중 ‘글로벌 과학자로서의 자질 및 잠재성을 평가’하는 단계는?","box":null,"choices":["학생기록물평가","영재성 다면평가","창의적 문제해결력 평가","과학영재 캠프","집중 관찰 및 면접"],"answer":2,"explain":"글로벌 과학자로서의 자질 및 잠재성 평가는 3단계 ‘영재성 다면평가’이다. ① 1단계(제출 서류에 의한 영재성 평가). ③ 2단계(창의적 문제해결력 검사 포함 학생기록물 등 종합 평가). ④ 서울과학고 3단계. ⑤ 서울과학고 정원외 선발 2단계.","source":{"page":9,"section":"영재학교의 전형방법은 어떻게 되나요? 한국과학영재학교 전형방법","quote":"3 단계 전형영재성다면평가 / • 글로벌 과학자로서의자질및잠재성을 평가"}},{"id":"06-16","type":"옳지 않은 것","q":"서울과학고 1단계 전형의 관찰소견서에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["학생을 지도한 현재 재직 중인 교사가 작성한다.","지원자의 장점이 드러나도록 칭찬 위주로 풍부한 미사여구를 사용해 기술한다.","학생의 영재성과 인성을 잘 아는 선생님이 작성한다.","지원자의 영재성, 인성을 객관적으로 평가한다.","1단계 전형에서 관찰소견서는 A, B로 구성된다."],"answer":2,"explain":"관찰소견서는 ‘과도한 미사여구, 칭찬 일변도 기술 지양’해야 한다. ②는 반대 서술이다. ①③④는 p10, ⑤는 p8과 일치한다.","source":{"page":10,"section":"영재학교의 전형방법은 어떻게 되나요? 1단계 전형: 관찰소견서","quote":"지원자의 영재성, 인성을 객관적으로평가• 과도한 미사여구, 칭찬일변도 기술지양"}},{"id":"06-17","type":"사례","q":"서울과학고 지원을 준비 중인 중학생 B가 자기소개서를 작성하고 있다. 교안(2024학년도 입학설명회)에 비추어 B에게 줄 수 있는 조언으로 옳은 것은?","box":null,"choices":["외부 수학경시대회 수상실적을 반드시 기록해야 유리하다.","지원 동기는 진로와 관계없이 학교의 장점 위주로 서술한다.","수학, 과학 이외 분야의 특기만 서술한다.","외부 수상실적은 기록할 수 없으며, 기재 시 불이익이 있다.","경험은 가능한 한 많이 나열하는 것이 좋다."],"answer":4,"explain":"자기소개서에 외부 수상실적은 ‘기록할 수 없음, 기재 시 불이익이 있음’. 작성 내용은 지원 동기를 자신의 진로와 연관 지어 서술, 수학·과학에서 지원자의 특기·잠재력, 지원자의 경험 중 가장 특별한 것이다. ①은 반대, ② 진로와 연관 지어야 함, ③ 수학·과학에서의 특기, ⑤ 가장 특별한 것.","source":{"page":11,"section":"영재학교의 전형방법은 어떻게 되나요? 1단계 전형: 자기소개서","quote":"외부수상실적을 기록할수있는가 ? / • 기록할 수없음 기재시불이익이 있음"}},{"id":"06-18","type":"보기 조합","q":"서울과학고 2단계 전형(영재성 및 사고력 검사, 창의력·문제해결력 검사)에서 평가하는 요소로 교안에 제시된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 수학·과학에 대한 학문적성\nㄴ. 언어이해능력, 수리능력\nㄷ. 융합적 사고력\nㄹ. 고등학교 교육과정 선행학습 정도","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"explain":"2단계 평가 요소는 영재성, 수학·과학에 대한 학문적성, 언어이해능력·수리능력 등, 창의력, 문제해결력, 융합적 사고력이며, ‘중학교 교육과정’, ‘개념/교과 통합’, ‘새로운 상황 이해능력’을 기반으로 한다. ㄹ 고등학교 선행학습은 교안에 없다.","source":{"page":12,"section":"영재학교의 전형방법은 어떻게 되나요? 2단계 전형","quote":"중학교교육과정 / 개념/ 교과 통합 / • 영재성 • 수학 · 과학에 대한학문적성• 언어이해능력 , 수리능력 등• 창의력 • 문제해결력 • 융합적 사고력 / 새로운상황이해능력"}},{"id":"06-19","type":"옳은 것","q":"서울과학고 2단계 전형 통과자 중 ‘지역 인재 우선선발’에 대한 설명으로 옳은 것은?","box":null,"choices":["25개 지역에서 각 3명 이내로 우선선발한다.","서울특별시 25개 자치구와 서울 제외 16개 광역지방자치단체, 총 41개 지역이 대상이다.","공고일 기준 해당 지역 학교에 1년 이상 재학 중인 지원자가 대상이다.","서울 제외 17개 광역지방자치단체가 대상이다.","수학 또는 과학에서 탁월한 재능이 있는 자를 지역별로 선발하는 제도이다."],"answer":2,"explain":"지역 인재 우선선발: 41개 지역(서울특별시 25개 자치구, 서울 제외 16개 광역지방자치단체)에서 각 2명 이내, 공고일 기준 해당 지역 학교에 2년 이상 연속 재학 중인 지원자. ① 41개 지역, 2명 이내. ③ 2년 이상 연속. ④ 16개. ⑤는 ‘특정 영역 우수인재 우선선발’의 기준이다.","source":{"page":13,"section":"영재학교의 전형방법은 어떻게 되나요? 2단계 전형 통과자 중 우선선발","quote":"41 개지역에서 탁월하다고판단되는자각2 명이내로 우선선발• 서울특별시 25개자치구 , 서울 제외16 개광역지방자치단체 • 공고일 기준해당지역학교에2 년이상 연속으로재학중인지원자"}},{"id":"06-20","type":"빈칸","q":"서울과학고 지역 인재 우선선발에 대한 내용이다. (   )에 들어갈 수로 알맞은 것은?","box":"41개 지역에서 탁월하다고 판단되는 자 각 (   )명 이내로 우선선발","choices":["1","3","5","2","10"],"answer":4,"explain":"41개 지역에서 각 2명 이내로 우선선발한다. 참고로 재학 요건도 ‘2년 이상 연속’이다.","source":{"page":13,"section":"영재학교의 전형방법은 어떻게 되나요? 2단계 전형 통과자 중 우선선발","quote":"41 개지역에서 탁월하다고판단되는자각2 명이내로 우선선발"}},{"id":"06-21","type":"옳은 것","q":"서울과학고 3단계 전형(과학영재캠프)에서 이루어지는 것으로 옳은 것은?","box":null,"choices":["관찰소견서 평가","창의력·문제해결력 검사","자기소개서 평가","영재성 및 사고력 검사","실험평가, 과제수행, 과학 글쓰기"],"answer":5,"explain":"3단계 과학영재캠프는 실험평가, 과제수행, 과학 글쓰기로 구성된다. ①③은 1단계, ②④는 2단계 전형 내용이다.","source":{"page":14,"section":"영재학교의 전형방법은 어떻게 되나요? 3단계 전형","quote":"실험평가 / 과학영재캠프 과제수행과학글쓰기"}},{"id":"06-22","type":"옳은 것","q":"서울과학고 합격자 선발에 대한 설명으로 옳은 것은?","box":null,"choices":["합격 예정자 선발에는 3단계 결과만 반영한다.","합격 예정자 선발에 1단계 결과는 포함되지 않는다.","1, 2, 3단계 결과를 종합하여 합격 예정자를 선발한다.","최종 합격자는 1학기 학교 교육과정 이수 여부 확인 후 발표한다.","최종 합격자는 11월 1일에 발표한다."],"answer":3,"explain":"합격 예정자는 1, 2, 3단계 결과를 종합하여 선발하며, 최종 합격자는 2학기 학교 교육과정 성실 이수 여부 확인 후 12월 1일 발표한다. ①② 1단계 결과도 포함. ④ 2학기. ⑤ 12월 1일.","source":{"page":15,"section":"영재학교의 전형방법은 어떻게 되나요?","quote":"1, 2, 3 단계결과를종합하여선발합격예정자선발에1 단계 결과가포함되는가? / ‣ 2 학기 학교교육과정성실이수여부확인후12월1 일발표"}},{"id":"06-23","type":"개념 찾기","q":"서울과학고 정원외 선발(2024 입학전형)에서 일반 전형과 달리 2단계에 추가로 포함된 것은?","box":null,"choices":["집중 관찰 및 면접","과학영재 캠프","학교생활기록부 II","자기소개서","실험평가"],"answer":1,"explain":"정원외 선발 2단계는 영재성 및 사고력 검사, 창의력·문제해결력 검사에 더해 ‘집중 관찰 및 면접’을 실시한다. ③④는 1단계 서류, ②⑤는 일반 전형 3단계(과학영재캠프) 내용이다.","source":{"page":16,"section":"영재학교의 전형방법은 어떻게 되나요? 정원외 선발(2024 입학전형)","quote":"2 단계 • 영재성 및사고력 검사• 창의력 · 문제해결력 검사• 집중 관찰및면접"}},{"id":"06-24","type":"개념 찾기","q":"서울과학고 교육과정(자율연구) 중 다음 설명에 해당하는 것은?","box":"자연현상의 관찰을 통해 스스로 문제를 설정하고 탐구활동을 통해 문제를 해결하는 능력을 함양","choices":["졸업논문연구","해외 이공계 체험","자연탐사","과제연구","위탁교육"],"answer":4,"explain":"제시문은 ‘과제연구’이다. ① 졸업논문연구 = 관심 분야의 학문적 연구 성과를 체계적으로 종합하고 발전. ② 해외 이공계 체험 = 과학 선진국의 첨단 연구시설 견학과 연구자들과의 만남. ③ 자연탐사 = 체험활동을 통해 탐구능력과 호연지기. ⑤ 위탁교육 = 국외 과학자들의 집중적 지도.","source":{"page":17,"section":"영재학교의 교육과정은 어떻게 되나요? (예: 서울과학고)","quote":"‣ 과제연구 / • 자연현상의 관찰을통해스스로문제를설정하고탐구활동을통해문제를해결하는능력을함양"}},{"id":"06-25","type":"옳지 않은 것","q":"서울과학고 자율연구 교육과정의 프로그램과 그 내용의 연결로 옳지 않은 것은?","box":null,"choices":["졸업논문연구 - 관심 분야의 학문적 연구 성과를 체계적으로 종합하고 발전","위탁교육 - 자연 속 다양한 체험활동을 통해 탐구능력과 호연지기를 기름","해외 이공계 체험 - 과학 선진국의 첨단 연구시설 견학과 연구자들과의 만남","자율연구 - 대학 및 연구소의 연구과정에 직접 참여하여 연구능력을 신장하고 진로를 탐색","자연탐사 - 폭넓은 과학적 소양을 함양"],"answer":2,"explain":"호연지기를 기르는 것은 ‘자연탐사’이다. ‘위탁교육’은 국외 과학자들의 집중적 지도를 통해 다양한 학문 분야 연구의 기본을 체험하는 것이다. 나머지 연결은 교안과 일치한다.","source":{"page":18,"section":"영재학교의 교육과정은 어떻게 되나요? (예: 서울과학고)","quote":"‣ 위탁교육 / • 국외 과학자들의집중적지도를통해다양한학문분야연구의기본을체험"}},{"id":"06-26","type":"옳지 않은 것","q":"한국과학영재학교의 교육과정(창의·연구활동, 국제학술교류)으로 교안에 제시되지 않은 것은?","box":null,"choices":["창의·연구활동","국외 위탁교육","대학 조기 입학 연계 과정","국제학술대회 및 국제과학영재 학술대회 참가","우수 논문 국내·외 발표"],"answer":3,"explain":"한국과학영재학교 교육과정으로 창의·연구활동, 국외 위탁교육, 국제학술대회 및 국제과학영재 학술대회 참가, 우수 논문 국내·외 발표가 제시되어 있다. ③은 교안에 없다.","source":{"page":19,"section":"영재학교의 교육과정은 어떻게 되나요? (예: 한국과학영재학교)","quote":"창의 · 연구활동 ‣ 국외 위탁교육‣ 국제학술대회 및국제과학영재 학술대회참가‣ 우수 논문국내· 외발표"}},{"id":"06-27","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재교육원 및 영재학급은 대학 및 시도교육청, 단위학교에 설치된 (   ) 영재교육기관으로 사교육 및 선행학습의 효과를 최소화하고 소외계층의 영재성 발굴 기회를 높이기 위하여 교사관찰추천제를 도입하여 영재교육대상자를 선발","choices":["전일제","기숙형","정규 학교형","특수목적","비전일제"],"answer":5,"explain":"영재교육원 및 영재학급은 ‘비전일제’ 영재교육기관이다. 나머지는 교안 표현이 아니다.","source":{"page":21,"section":"영재교육원 및 영재학급의 전형방법","quote":"영재교육원및영재학급은 대학및시도교육청 , 단위학교에 설치된비전일제영재교육기관으로사교육및선행학습의 효과를최소화하고소외계층의영재성발굴기회를높이기위하여교사관찰추천제를도입"}},{"id":"06-28","type":"옳지 않은 것","q":"영재교육원 및 영재학급에서 교사관찰추천제를 도입한 목적으로 옳지 않은 것은?","box":null,"choices":["선행학습으로 교과 성취도가 높은 학생을 우선 선발하기 위해","사교육 및 선행학습의 효과를 최소화하기 위해","소외계층의 영재성 발굴 기회를 높이기 위해","영재교육의 본질에 보다 충실한 학생 선발을 위해","잠재력 있는 학생에게 영재교육의 기회를 제공하기 위해"],"answer":1,"explain":"교사관찰추천제는 사교육·선행학습 효과를 최소화하려는 것이므로 ①은 반대 서술이다. 학교에서 영재행동특성을 보이는 학생들을 관찰 추천하여 영재교육 본질에 충실한 선발과 잠재력 있는 학생에게 기회 제공을 목적으로 한다.","source":{"page":21,"section":"영재교육원 및 영재학급의 전형방법 - 교사관찰추천제","quote":"학교에서영재행동특성을보이는학생들을관찰추천하는 영재교육의본질에보다충실한학생선발이가능하고, 잠재력 있는학생에게영재교육의기회를제공하는데목적"}},{"id":"06-29","type":"빈칸","q":"다음 (   )에 들어갈 수치로 알맞은 것은?","box":"전국 영재교육원 및 영재학급 중에서 교사관찰추천 평가요소(ex. 교사추천 체크리스트 평가, 수행 관찰형 평가, 면접평가 등)를 반영하여 영재교육대상자를 선발한 기관은 2022년 기준 (   )으로 집계됨(한국교육개발원, 2022)","choices":["61.7%","36.2%","77.4%","84.5%","35.4%"],"answer":3,"explain":"2022년 기준 77.4%이다. 61.7%는 교사관찰추천 체크리스트, 36.2%는 KEDI 심층면접도구 등, 35.4%는 KEDI 영재성 검사 활용 비율이다. 84.5%는 교안에 없다.","source":{"page":22,"section":"영재교육원 및 영재학급의 전형방법","quote":"영재교육대상자를선발한기관은2022년기준 77.4%으로집계됨(한국교육개발원 , 2022)"}},{"id":"06-30","type":"옳은 것","q":"2022년 교육청 영재교육기관 주요 선발 도구 활용 비율에 대한 설명으로 옳은 것은?","box":null,"choices":["KEDI 영재성 검사의 활용 비율이 61.7%로 가장 높다.","교사추천서 활용 비율은 36.2%이다.","KEDI 심층면접도구 등의 활용 비율은 13.9%이다.","교사관찰추천 체크리스트는 61.7%(900기관)로 활용 비율이 가장 높다.","실력평가 활용 비율은 24.1%이다."],"answer":4,"explain":"교사관찰추천 체크리스트 61.7%(900기관)가 가장 높다. ① KEDI 영재성 검사는 35.4%(516기관). ② 교사추천서는 23.9%(348기관). ③ KEDI 심층면접도구 등은 36.2%(528기관). ⑤ 실력평가는 6.2%(91기관)이며 24.1%는 기타 지필평가.","source":{"page":23,"section":"2022년 교육청 영재교육기관 주요 선발 도구 활용 비율","quote":"교사관찰추천체크리스트61.7%(900기관)교사추천서23.9%(348기관)교사추천기타4.8%(70기관) / KEDI 영재성검사35.4%(516기관)"}},{"id":"06-31","type":"옳지 않은 것","q":"2022학년도 교육청 영재교육기관 선발에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["2022학년은 코로나19 학생 안전을 위해 비대면 선발 방식으로 전환되었다.","자체 선발 문항을 출제한 부산, 대구를 제외한 교육청이 KEDI 검사도구를 활용하였다.","비대면 선발 방식 전환으로 검사도구 활용 비율이 낮은 측면이 있다.","KEDI 검사도구는 15개 교육청 영재교육기관에서 선택 활용하였다.","KEDI, 자체 창의적 문제해결력 수행 관찰도구의 활용 비율은 6.4%(94기관)이다."],"answer":2,"explain":"자체 선발 문항을 출제하여 KEDI 검사도구 활용에서 제외된 곳은 ‘서울, 인천’이다. 나머지는 교안과 일치한다.","source":{"page":23,"section":"2022년 교육청 영재교육기관 주요 선발 도구 활용 비율","quote":"2022 학년도영재교육대상자선발을위한KEDI 검사도구는15개교육청 영재교육기관에서선택활용하였음( 자체 선발문항을출제한서울, 인천 제외)"}},{"id":"06-32","type":"옳지 않은 것","q":"KEDI 영재성검사의 개요에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["학년급별 교육과정 수준 내에서 영재성과 비판적 사고력, 종합적 탐구능력을 측정한다.","사교육 기관의 선행학습에 의한 교과지식이나 기출문제 유형에 익숙한 학생 선발을 지양한다.","실생활(real-world) 문제를 활용한 사고력, 창의력, 문제해결과정 중심이다.","잠재된 타고난 영재성, 미래 발전가능성 중심이다.","잠재력보다 현재 성취수준을 중심으로 측정한다."],"answer":5,"explain":"KEDI 영재성검사는 ‘현재 성취수준보다 잠재된 타고난 영재성, 미래 발전가능성 중심’이다. ⑤는 반대 서술이다.","source":{"page":24,"section":"KEDI 영재성검사","quote":"현재 성취수준보다잠재된타고난영재성, 미래 발전가능성중심"}},{"id":"06-33","type":"옳은 것","q":"KEDI 영재성검사의 종류와 구성에 대한 설명으로 옳은 것은?","box":null,"choices":["영역별 영재성검사의 심화 B형은 90분 과정이다.","창의사고 영재성검사는 영역별 영재성을 측정하는 60분 과정이다.","검사 도구는 모두 4가지 종류이다.","영역별 영재성검사에는 예술 영역이 포함된다.","검사 종류는 한국교육개발원이 기관별로 일괄 지정한다."],"answer":1,"explain":"영역별 영재성은 60분(기본 A형) 혹은 90분(심화 B형) 과정이다. ② 창의사고 영재성검사는 일반 영재성을 측정하는 30분 과정. ③ 6가지 종류. ④ 영역은 수학, 과학, 수과학 통합, 인문사회, 정보과학. ⑤ 선정심사위원회에서 선택하여 실시.","source":{"page":25,"section":"KEDI 영재성검사","quote":"일반 영재성을측정하는30분과정의 창의사고영재성검사와영역별영재성을측정하는60분( 기본 A 형 ) 혹은 90분( 심화 B 형 ) 과정의수학, 과학 , 수과학 통합, 인문사회 , 정보과학 영재성검사로6 가지 종류의검사도구가있음"}},{"id":"06-34","type":"빈칸","q":"KEDI 영재성검사의 구성에 대한 설명이다. (ㄱ), (ㄴ)에 들어갈 수로 알맞은 것은?","box":"검사 도구는 실생활에서의 소재와 맥락을 중심으로 기본형((ㄱ)가지 테마)과 심화형((ㄴ)가지 테마)으로 구성됨","choices":["ㄱ: 3, ㄴ: 4","ㄱ: 5, ㄴ: 4","ㄱ: 4, ㄴ: 5","ㄱ: 4, ㄴ: 6","ㄱ: 6, ㄴ: 5"],"answer":3,"explain":"기본형은 4가지 테마, 심화형은 5가지 테마로 구성된다. 6은 검사 도구 종류의 수이다.","source":{"page":25,"section":"KEDI 영재성검사","quote":"검사 도구는실생활에서의소재와맥락을중심으로기본형(4 가지 테마) 과심화형 (5 가지 테마) 으로 구성됨"}},{"id":"06-35","type":"보기 조합","q":"교사관찰추천제의 장점(서울특별시교육청)으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 영재교육의 본질에 보다 충실한 학생 선발 및 교육 가능\nㄴ. 지필검사로 학생을 객관적으로 서열화할 수 있음\nㄷ. 잠재력이 있는 학생 모두에게 영재교육 기회를 제공할 수 있음\nㄹ. 영재교육기관의 입학과 관련하여 사교육 문제가 해소될 수 있음","choices":["ㄱ, ㄴ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":2,"explain":"교사관찰추천제의 장점은 ㄱ, ㄷ, ㄹ이다. ㄴ 지필검사 중심은 종전 방식(시험 위주의 학생 선발)의 특징이다.","source":{"page":26,"section":"교사관찰추천제","quote":"영재교육의 본질에보다충실한학생선발및교육 가능‣ 잠재력이 있는학생모두에게영재교육기회를제공할수있음 ‣ 영재교육기관의 입학과관련하여사교육문제가해소될수있음"}},{"id":"06-36","type":"옳지 않은 것","q":"교사관찰추천제 도입 이전의 ‘종전 방식(시험 위주의 학생 선발)’인 지필검사 중심의 다단계 전형에 해당하지 않는 것은?","box":null,"choices":["학교장 추천","영재성 검사","학문적성검사","개별추천인(담임 및 교과담당 교사) 추천","심층면접"],"answer":4,"explain":"개별추천인(담임 및 교과담당 교사) 추천은 ‘현재 방식(영재교사의 관찰을 토대로 추천)’에 해당한다. 현재 방식에는 학교 집중관찰위원 및 추천위원회 관찰 및 추천, 영재교육 대상자 선정심사위원회 심의도 포함된다.","source":{"page":27,"section":"영재교육원 및 영재학급의 전형방법 - 교사 관찰추천제","quote":"지필검사중심의다단계전형•학교장 추천•영재성 검사•학문적성검사 •심층면접 / 영재교사의관찰을토대로추천•개별추천인 ( 담임 및교과담당 교사)추천"}},{"id":"06-37","type":"옳은 것","q":"교사관찰추천제의 진행 순서로 옳은 것은?","box":null,"choices":["잠재 영재군 형성 → 교사의 관찰 수행 → 영재교육대상자 추천 → 영재교육기관 선발","교사의 관찰 수행 → 잠재 영재군 형성 → 영재교육대상자 추천 → 영재교육기관 선발","잠재 영재군 형성 → 영재교육대상자 추천 → 교사의 관찰 수행 → 영재교육기관 선발","영재교육대상자 추천 → 잠재 영재군 형성 → 교사의 관찰 수행 → 영재교육기관 선발","교사의 관찰 수행 → 영재교육대상자 추천 → 잠재 영재군 형성 → 영재교육기관 선발"],"answer":1,"explain":"순서는 첫째 잠재 영재군 형성 → 둘째 교사(또는 영재교사)의 관찰 수행 → 셋째 영재교육대상자 추천 → 넷째 영재교육기관 선발이다.","source":{"page":28,"section":"교사 관찰추천제","quote":"잠재영재군형성 교사의관찰수행영재교육대상자추천영재교육기관선발"}},{"id":"06-38","type":"사례","q":"다음 사례는 교사관찰추천제의 어느 단계에 해당하는가?","box":"○○초등학교 5학년 담임인 이 교사는 학교생활 중 관심을 가지고 지켜볼 학생 몇 명을 학교 영재교사에게 의뢰하였다. 영재교사는 학생 및 학부모 상담을 통해 수시로 잠재적 영재들을 발굴하고 있다.","choices":["영재교육기관에서 영재교육 대상자 선발","영재교육 대상자를 추천","교사 또는 영재교사가 잠재적 영재군 관찰","선정심사위원회 심의","잠재 영재군을 형성"],"answer":5,"explain":"담임 또는 교과담당교사가 지켜볼 잠재적 영재들을 영재교사에게 의뢰하고, 영재교사가 상담 등을 통해 잠재적 영재를 발굴하는 것은 ‘첫째, 잠재 영재군을 형성’ 단계이다. ③ 둘째 단계는 지속적 관찰, 자료 수집·분석, 검사와 체크리스트 활용. ② 셋째, ①④ 넷째 단계와 관련된다.","source":{"page":29,"section":"교사관찰추천제","quote":"첫째 , 잠재 영재군을형성 / • 담임 또는교과담당교사등이학교생활중에관심을가지고지켜볼잠재적영재들을영재교사에게의뢰• 영재교사들은 학생이나학부모상담등을통해수시로잠재적영재들을발굴"}},{"id":"06-39","type":"옳은 것","q":"교사관찰추천제의 ‘둘째’ 단계(교사 또는 영재교사가 잠재적 영재군 관찰)에 대한 설명으로 옳은 것은?","box":null,"choices":["학교추천위원회가 영재교육기관에 학생을 추천한다.","선정심사위원회를 통해 영재교육 대상자를 선발한다.","영재교사는 학교생활에서 잠재적 영재들을 지속적으로 관찰하고 학생에 대한 자료를 수집 및 분석한다.","담임교사는 영재교사의 역할을 할 수 없다.","영재성 진단에 체크리스트는 사용하지 않고 관찰만 활용한다."],"answer":3,"explain":"둘째 단계에서 영재교사는 지속적으로 관찰하고 자료를 수집·분석하며, 영재성 진단을 위해 다양한 검사와 체크리스트를 활용한다. ① 셋째 단계. ② 넷째 단계. ④ 담임 또는 교과담당교사가 영재교사의 역할을 하기도 함. ⑤ 검사와 체크리스트 활용.","source":{"page":29,"section":"교사관찰추천제","quote":"영재교사는 학교생활에서잠재적영재들을지속적으로관찰하고학생에대한자료를수집및분석 • 영재성을 진단하기위한다양한검사와체크리스트를활용"}},{"id":"06-40","type":"옳은 것","q":"교사관찰추천제의 셋째·넷째 단계에 대한 설명으로 옳은 것은?","box":null,"choices":["학교추천위원회는 학부모 대표와 지역 인사로 구성된다.","영재교육기관은 학교추천위원회를 통해 최종 선발한다.","학교추천위원회는 지필검사 결과만을 토대로 추천한다.","학교추천위원회는 학교 소속 교사, 영재교사, 외부 전문가 등으로 구성되어 관찰 결과를 토대로 추천한다.","영재학급은 별도 심사 없이 추천된 학생 전원을 선발한다."],"answer":4,"explain":"셋째, 학교 소속 교사·영재교사·외부 전문가 등으로 구성된 학교추천위원회가 관찰 결과를 토대로 추천. 넷째, 영재학급·영재교육원 등은 선정심사위원회를 통해 선발. ① 구성원 다름. ② 최종 선발은 선정심사위원회. ③ 관찰 결과를 토대로 함. ⑤ 선정심사위원회를 거침.","source":{"page":30,"section":"교사관찰추천제","quote":"학교 소속교사, 영재교사 , 외부 전문가등으로구성된학교추천위원회에서교사또는영재교사의관찰결과를토대로영재교육기관에추천 / ‣ 넷째 , 영재교육기관에서 영재교육대상자선발 / • 영재학급 , 영재교육원 등영재교육기관에서는 선정심사위원회를통해영재교육대상자를 선발하게됨"}},{"id":"06-41","type":"옳은 것","q":"서울특별시교육청 영재교육대상자 선발에서 사용하는 ‘자기체크리스트: 창의적 인성검사(초등학교 학생용)’에 대한 설명으로 옳은 것은?","box":null,"choices":["교사가 학생을 관찰하여 작성한다.","결과가 점수화되어 최종 단계에 반영된다.","5점 척도(매우 아니다~매우 그렇다)로 응답한다.","영재행동특성(10점)을 평가한다.","자신의 영재성을 스스로 확인하는 검사지로 영재교육대상자 선정에 영향을 주지 않는다."],"answer":5,"explain":"자기체크리스트는 자신의 영재성을 스스로 확인하는 검사지로 선정에 영향을 주지 않는다. ①②④는 교사용 체크리스트의 특징. ③ 예시 문항은 1~4(매우 아니다, 아니다, 그렇다, 매우 그렇다)의 4점 척도이며, 5점 척도는 교사 체크리스트 예시이다.","source":{"page":31,"section":"자기체크리스트: 창의적 인성검사(초등학교 학생용) 예시","quote":"자기체크 리스트는자신의영재성을스스로확인하는검사지로영재교육대상자선정에영향을주지않음"}},{"id":"06-42","type":"옳지 않은 것","q":"서울특별시교육청 교사용 체크리스트에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["검사 결과는 학생과 학부모에게 공개된다.","교사(담임)가 지원자의 영재행동특성(10점), 창의적 인성(10점)을 평가한다.","점수화되어 영재교육대상자 최종단계에 반영된다.","영재 선발의 교사관찰추천제도 취지에 맞도록 타당성과 변별력을 고려하여 작성한다.","검사 결과는 학교추천위원회 및 영재선정심사위원회를 제외하고 외부에 공개되지 않는다."],"answer":1,"explain":"검사 결과는 학교추천위원회 및 영재선정심사위원회를 제외하고 외부(학생, 학부모 포함)에 공개되지 않는다. ①은 반대 서술이다.","source":{"page":32,"section":"교사체크리스트","quote":"검사 결과는학교추천위원회및영재선정심사위원회를 제외하고외부( 학생 , 학부모 포함) 에공개되지 않음"}},{"id":"06-43","type":"개념 찾기","q":"다음 예시 문항이 포함된 교사 체크리스트(초·중·고 공용)는?","box":"1. 높은 수준의 어휘를 사용하여 깊이 있는 사고를 할 줄 안다.\n2. 새로운 정보에 대한 이해가 빠르다.\n3. 관심 분야에 대하여 호기심을 가지고 적극적으로 사고하고 탐구한다.","choices":["창의적 인성검사","자기체크리스트","영재행동특성검사","KEDI 창의사고 영재성검사","학문적성검사"],"answer":3,"explain":"제시 문항은 ‘교사체크리스트: 영재행동특성검사(초·중·고 공용)’ 예시이다. 창의적 인성검사(교사용)의 예시 문항은 ‘자신의 잘못을 알게 되면 솔직히 인정한다’ 등이다.","source":{"page":33,"section":"교사체크리스트: 영재행동특성검사(초·중·고 공용) 예시","quote":"1높은수준의어휘를사용하여깊이있는사고를할줄안다 . / 2새로운정보에대한이해가빠르다. / 3관심분야에대하여호기심을가지고적극적으로사고하고탐구한다."}},{"id":"06-44","type":"개념 찾기","q":"다음 예시 문항이 포함된 교사 체크리스트(초·중·고 공용)는?","box":"1. 자신의 잘못을 알게 되면 솔직히 인정한다.\n2. 새로운 일을 경험하는 데 적극적이다.\n3. 한번 마음먹은 일은 어떤 어려움이 있더라도 끝까지 하고야 만다.","choices":["영재행동특성검사","창의적 인성검사","학업적성검사","KEDI 영재성검사","창의적 문제해결력검사"],"answer":2,"explain":"제시 문항은 ‘교사체크리스트: 창의적 인성검사(초·중·고 공용)’ 예시로, 5점 척도(매우 아니다~매우 그렇다)이다. ① 영재행동특성검사는 어휘·정보 이해·호기심 관련 문항이다.","source":{"page":34,"section":"교사체크리스트: 창의적 인성검사(초·중·고 공용) 예시","quote":"1자신의잘못을알게되면솔직히인정한다. / 2새로운일을경험하는데적극적이다. / 3한번마음먹은 일은어떤어려움이있더라도끝까지하고야만다."}},{"id":"06-45","type":"옳은 것","q":"서울특별시교육청 영재교육원 규정 ‘제7장 교육과정 운영’에 대한 설명으로 옳은 것은?","box":null,"choices":["초등 교육과정은 연간 100시간 이상 운영한다.","중등 교육과정은 연간 90시간 이상 운영한다.","1차시는 45분으로 한다.","초등은 연간 90시간 이상, 중등은 연간 100시간 이상 운영하며 1차시는 50분으로 한다.","캠프 또는 전일제 집중수업은 실시할 수 없다."],"answer":4,"explain":"제17조 초등: 연간 90시간 이상, 제18조 중등: 연간 100시간 이상, 모두 1차시는 50분. ①② 시간이 뒤바뀜. ③ 50분. ⑤ 캠프 또는 전일제 집중수업을 실시할 수 있다.","source":{"page":35,"section":"제7장 교육과정 운영","quote":"①연간 90 시간 이상운영하며, 1 차시는 50 분으로 한다. … ①연간 100시간이상운영하며, 1 차시는 50 분으로 한다."}},{"id":"06-46","type":"빈칸","q":"서울특별시교육청 영재교육원 규정의 학기 중 수업 요일에 대한 내용이다. (ㄱ), (ㄴ)에 들어갈 말로 알맞은 것은?","box":"· 제17조(초등 교육과정 운영) ② 학기 중 수업은 (ㄱ)에 실시한다.\n· 제18조(중등 교육과정 운영) ② 학기 중 수업은 (ㄴ)에 실시한다.\n(단, 부득이한 사유로 어려울 경우에는 다른 요일에 실시할 수 있다.)","choices":["ㄱ: 토요일, ㄴ: 수요일 또는 토요일","ㄱ: 수요일, ㄴ: 금요일","ㄱ: 금요일 또는 토요일, ㄴ: 토요일","ㄱ: 토요일, ㄴ: 일요일","ㄱ: 수요일 또는 토요일, ㄴ: 토요일"],"answer":5,"explain":"초등은 수요일 또는 토요일, 중등은 토요일에 실시한다. ①은 초등과 중등을 뒤바꾼 것이고 나머지는 교안과 다르다.","source":{"page":35,"section":"제7장 교육과정 운영","quote":"②학기 중수업은 수요일또는토요일에실시한다. … ②학기 중수업은 토요일에실시한다."}},{"id":"06-47","type":"옳지 않은 것","q":"서울특별시교육청 영재교육원 규정 제19조(초·중등 공통 교육과정 운영)의 내용으로 옳지 않은 것은?","box":null,"choices":["상급 학년 교육과정의 선행학습을 실시한다.","영재교육 영역별 유관기관 체험 등 현장 체험학습을 실시할 수 있다.","탐구 실험 중심의 자기주도적 수업을 실시한다.","교육과정 운영 시 필요에 따라 수익자 부담으로 실시할 수 있다.","선행학습이 아닌 심화학습을 실시한다."],"answer":1,"explain":"제19조는 ‘선행학습이 아닌 심화학습을 실시한다’고 규정한다. ①은 반대 서술이다.","source":{"page":36,"section":"제7장 교육과정 운영","quote":"②선행학습이 아닌심화학습을실시한다.③탐구 실험중심의자기주도적수업을실시한다.④교육과정 운영시필요에 따라수익자부담으로 실시할수있다 ."}},{"id":"06-48","type":"옳은 것","q":"대구광역시교육청의 영재학급 교육과정 운영방침에 대한 설명으로 옳은 것은?","box":null,"choices":["영재학급 수업시수는 최소 100시간 이상이다.","인성 및 리더십 교육은 4시간 이상 운영한다.","영재학급 수업시수는 최소 80시간 이상이며, 인성 및 리더십 교육 2시간 이상, 1학급당 강사 2명 이상이다.","교당 개설 가능 영재학급 수는 2개로 제한된다.","초등학교 3학년부터 중학교 3학년까지 기초과정 프로그램을 운영한다."],"answer":3,"explain":"대구 운영방침: 수업시수 최소 80시간 이상, 인성 및 리더십 교육 2시간 이상, 1학급당 강사 2명 이상, 교당 개설 가능 영재학급 수 및 학급당 개설 최소인원 제한 없음, 초 4학년부터 고 1학년까지 영재교육 기초과정 운영, 2023년 운영 신청 공모를 통해 선정·승인, 단위학교 맞춤형 컨설팅. ① 80시간. ② 2시간. ④ 제한 없음. ⑤ 초4~고1.","source":{"page":37,"section":"교육과정 운영방침","quote":"영재학급 수업시수: 최소 80 시간 이상‣ 인성 및리더십 교육2 시간 이상, 1 학급당 강사2 명이상 ‣ 교당 개설가능영재학급수및학급당 개설최소인원제한없음"}},{"id":"06-49","type":"옳지 않은 것","q":"대구광역시교육청 영재학급 교육과정 운영 추진내용으로 옳지 않은 것은?","box":null,"choices":["설치 장소는 초·중·고등학교이다.","운영 방법은 단위학교 또는 협력학교이다.","급당 정원은 20명이다.","수익자부담금은 담임수당 및 운영경비로 사용한다.","교육 대상은 초등학교 4학년 ~ 고등학교 1학년이다."],"answer":4,"explain":"담임수당 및 운영경비는 ‘운영지원금’으로 사용하고, 수익자부담금은 강사수당으로 사용하며 학교별로 결정한다. 교육 경비는 대구광역시교육청 운영지원금 및 수익자 부담금이다. 운영 분야는 융합, 수학·과학, 외국어(영어, 중국어, 일본어), 정보, 문예, 미술, 음악, 체육 등이다.","source":{"page":38,"section":"교육과정 운영 추진내용","quote":"운영지원금 : 담임수당 및운영경비 ‣ 수익자부담금 : 강사수당으로 사용, 학교별 결정"}}]},{"lesson":7,"title":"미국 영재교육의 최근 동향","file":"4. 교안 (1~30)/07.pdf","summary":["미국 영재교육 핵심요소: 창의력과 혁신성, 문제해결능력, 세계 경쟁력, 사회적 자본","미국 영재교육 체계(정부): 정책 및 공급 지원, 교육자 및 학교 지원, 연구와 개발 (출처: 미국 교육부 홈페이지)","미국 교육부 성공 요소: 개인화된 차별적 교육, 도전과 실패의 인정, 커리큘럼 다양성, 멘토와의 상호작용 / 프로그램: STEM·예술·리더십","도전과제: 인종·문화·경제적 불균형 극복 → 포용적인 영재교육 시스템 필요성 증가, 교사·학부모 참여와 협력 필수","토머스제퍼슨과학고: 1985년 개교, 재학생 1802명, 교사 142명, 12학년 432명 중 158명 NMSP 선발(전국 1위), SAT 평균 전국 1위, 합격률 17%","미국 사례: 공립학교에서 유아 5-7세 대상 공식 시험으로 상위 3% 선발, 초등학교 끝날 때까지 영재학급","발전: 1868 능력수준별 학습제도·속진학습 시작 → 1922 스탠포드-비네 → 1930년대 속진→심화, 예산삭감 정체 → 1957 Sputnik Shock → 1972 말랜드 보고서 → 1988 영재교육법 → 1990 NRC → 2022.4 우수성법안(39개 주 2~16%)","루이스 터만 = 영재교육(운동)의 아버지, 상위 1%(IQ 135 이상) 1,528명 50년 종단연구 → 심리적·사회적·신체적으로도 더 건강 / 홀링워스 = 영재교육의 어머니(사회정서적 교육 강조) / 롬브로소(이탈리아 범죄인류학자)의 영재 퇴화설 반박","스푸트니크 충격(1957): 총체적 재능 인재 육성의 도화선(탄넨바움)","말랜드 보고서(1972, 교육부 국장 시드니 P. 말랜드): 차별화된 교육과정·교수전략의 조직적/행정적 지원 최초 제안, 6영역(일반적인 지적능력, 특수한 학업적성, 창의적 혹은 생산적 사고, 리더십, 시각 및 공연예술, 심리운동 능력)","영재교육법(1988): 지능·창의성·예술성·리더십·특수한 학문영역 / 2005년 의회 재승인 확대 / 26개 주 특별 프로그램, 27개 주 영재교육법 제정","A Nation Deceived(2004) '미국은 수월성을 무시하고 있다' / 우수성법안(Excellence for All Act, 2022.4.27): 연방지원금 10억→20억 달러"],"questions":[{"id":"07-01","type":"옳지 않은 것","q":"교안에 제시된 미국 영재교육의 핵심요소가 아닌 것은?","box":null,"choices":["창의력과 혁신성","평준화와 형평성","문제해결능력","세계 경쟁력","사회적 자본"],"answer":2,"explain":"미국 영재교육의 핵심요소는 창의력과 혁신성, 문제해결능력, 세계 경쟁력, 사회적 자본 4가지이다. ② '평준화와 형평성'은 핵심요소로 제시되지 않았다.","source":{"page":3,"section":"01. 미국 영재교육의 체계 - 미국의 영재교육","quote":"‣ 창의력과 혁신성 ‣ 문제해결능력 ‣ 세계 경쟁력 ‣ 사회적 자본"}},{"id":"07-02","type":"빈칸","q":"다음은 미국 영재교육의 핵심요소에 대한 설명이다. (   )에 들어갈 말로 알맞은 것은?","box":"영재교육은 (   )을/를 형성하는데 기여","choices":["문화적 자본","경제적 자본","인적 네트워크","사회적 자본","국가 경쟁력"],"answer":4,"explain":"교안: '영재교육은 사회적 자본을 형성하는데 기여'. 나머지(문화적 자본, 경제적 자본, 인적 네트워크, 국가 경쟁력)는 교안 표현이 아니다. 경쟁력 관련 요소는 '세계 경쟁력'이다.","source":{"page":4,"section":"01. 미국 영재교육의 체계 - 미국 영재교육의 핵심요소","quote":"영재교육은 사회적 자본을 형성하는데 기여"}},{"id":"07-03","type":"개념 찾기","q":"미국 영재교육의 체계 중 다음 설명에 해당하는 것은?","box":"정부는 영재교육의 효과적인 방법을 연구하고 발전시키는데 힘씀","choices":["연구와 개발","정책 및 공급 지원","교육자 및 학교 지원","커리큘럼 다양성","멘토와의 상호작용"],"answer":1,"explain":"효과적인 방법을 연구·발전시키는 것은 '연구와 개발'이다. ② 정책 및 공급 지원 = 정책 수립, 자금과 지원 제공 ③ 교육자 및 학교 지원 = 교육자 교육 및 학교 지원 ④⑤는 미국 교육부의 성공적인 영재교육을 위한 요소이다.","source":{"page":5,"section":"01. 미국 영재교육의 체계 - 미국 영재교육의 체계","quote":"연구와 개발 ‣ 정부는 영재교육의 효과적인 방법을 연구하고 발전시키는데 힘씀"}},{"id":"07-04","type":"옳지 않은 것","q":"미국 교육부가 제시한 성공적인 영재교육을 위한 요소가 아닌 것은?","box":null,"choices":["개인화된 차별적 교육","도전과 실패의 인정","커리큘럼 다양성","멘토와의 상호작용","속진 중심의 표준화 교육"],"answer":5,"explain":"미국 교육부의 성공적인 영재교육 요소는 개인화된 차별적 교육, 도전과 실패의 인정, 커리큘럼 다양성, 멘토와의 상호작용이다. ⑤는 교안에 없다(오히려 학생 특성과 관심사를 고려한 맞춤형 교육이 중요).","source":{"page":6,"section":"01. 미국 영재교육의 체계 - 미국 교육부의 성공적인 영재교육을 위한 요소","quote":"개인화된 차별적 교육 ‣ 학생들의 특성과 관심사를 고려한 맞춤형 교육이 중요"}},{"id":"07-05","type":"개념 찾기","q":"미국 영재교육 프로그램 중 다음 설명에 해당하는 것은?","box":"학생들의 능력을 키우고 협업과 의사소통을 강화하는 프로그램","choices":["STEM 프로그램","예술 프로그램","리더십 프로그램","GEP 프로그램","멘토링 프로그램"],"answer":3,"explain":"리더십 프로그램은 학생들의 리더십 능력을 키우고 협업과 의사소통을 강화한다. ① STEM = 과학·기술·공학·수학 분야 교육 ② 예술 = 예술 분야 교육으로 창의력 발휘 ④ GEP는 싱가포르 영재교육 프로그램 ⑤ 교안의 프로그램 분류가 아니다.","source":{"page":7,"section":"01. 미국 영재교육의 체계 - 미국 영재교육 프로그램","quote":"리더십 프로그램 ‣ 생들의 리더십 능력을 키우고 협업과 의사소통을 강화"}},{"id":"07-06","type":"옳은 것","q":"미국 영재교육의 장점에 대한 설명으로 옳은 것은?","box":null,"choices":["교사의 전문역량을 향상시킨다.","학생들의 순응성과 집단적 사고를 촉진한다.","미국의 혁신과 기술발전과는 직접적 관련이 없다.","현재의 산업경제를 유지할 인력 양성에 초점을 둔다.","개인의 능력보다 집단 평균 성취 향상에 중점을 둔다."],"answer":1,"explain":"장점: 교사의 전문역량 향상, 학생들의 창의성과 독립적 사고 촉진, 개인의 능력과 잠재력 최대 발휘, 미국의 혁신과 기술발전에 중요한 역할, 미래 지식경제를 이끌어갈 주역으로서 기회 제공. ② 순응성 → 창의성과 독립적 사고 ③ 무관 → 중요한 역할 ④ 현재 산업경제 → 미래 지식경제 ⑤ 개인의 능력과 잠재력을 최대한 발휘.","source":{"page":8,"section":"01. 미국 영재교육의 체계 - 미국 영재교육의 장점","quote":"교사의 전문역량을 향상 학생들의 창의성과 독립적 사고를 촉진 개인의 능력과 잠재력을 최대한 발휘할 수 있음"}},{"id":"07-07","type":"빈칸","q":"다음은 미국 영재교육의 도전과제이다. (   )에 들어갈 말로 알맞은 것은?","box":"모든 학생들에게 평등한 기회를 제공하기 위해 인종, 문화, 경제적인 불균형을 극복하기 (   )의 필요성이 증가하고 있음","choices":["선발 중심 영재교육","속진 중심 영재교육","포용적인 영재교육 시스템","사립 영재학교 확대","연방 통합 선발시험"],"answer":3,"explain":"교안: '포용적인 영재교육 시스템의 필요성이 증가하고 있음'. 또한 미국 영재교육의 성공에는 교사와 학부모의 활발한 참여와 협력이 필수적이다. 나머지는 교안에 없는 표현이다.","source":{"page":9,"section":"01. 미국 영재교육의 체계 - 미국 영재교육의 도전과제","quote":"인종, 문화, 경제적인 불균형을 극복하기 포용적인 영재교육 시스템의 필요성이 증가하고 있음"}},{"id":"07-08","type":"옳지 않은 것","q":"토머스제퍼슨과학고에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["1985년에 개교하였다.","재학생은 9학년(중3)~12학년(고3) 1802명이다.","교사는 142명이다.","12학년 432명 중 158명이 전국장학생선발대회(NMSP)에 선발되어 전국 1위이다.","SAT(대학수능시험) 평균 성적이 전국 3위이다."],"answer":5,"explain":"SAT 평균 성적은 전국 1위이다(⑤ 3위 → 1위). ①~④는 교안 내용 그대로이다.","source":{"page":10,"section":"01. 미국 영재교육의 체계 - 토머스제퍼슨과학고","quote":"개교: 1985년 재학생: 9학년(중3)~12학년(고3) 1802명 교사: 142명 12학년 432명 중 158명이 전국장학생선발대회(NMSP)에 선발됨(전국 1위) SAT(대학수능시험) 평균 성적 전국 1위"}},{"id":"07-09","type":"개념 찾기","q":"교안에 제시된 토머스제퍼슨과학고의 SAT 평균 점수 중 '수학' 점수는?","box":null,"choices":["701","737","717","518","503"],"answer":2,"explain":"토머스제퍼슨 SAT: 작문 701(미국평균 407), 수학 737(미국평균 518), 독해 717(미국평균 503). ① 작문 ③ 독해 ④ 수학 미국평균 ⑤ 독해 미국평균.","source":{"page":10,"section":"01. 미국 영재교육의 체계 - 토머스제퍼슨과학고","quote":"점수 토머스제퍼슨 미국평균 / 작문 701 407 / 수학 737 518 / 독해 717 503"}},{"id":"07-10","type":"옳은 것","q":"토머스제퍼슨과학고의 입학절차에 대한 설명으로 옳은 것은?","box":null,"choices":["필기시험 없이 서류전형만으로 선발한다.","서류전형은 10명의 위원이 단독 심사한다.","지원자 합격률은 3%이다.","서류전형(50명 이상의 위원들이 중복심사)과 필기시험으로 선발하며, 지원자 합격률은 17%이다.","교사 추천과 면접으로만 선발한다."],"answer":4,"explain":"입학절차: 서류전형(50명 이상의 위원들이 중복심사) + 필기시험, 지원자 합격률 17%. ① 필기시험도 있음 ② 50명 이상 위원 중복심사 ③ 17% ⑤ 교안에 없음.","source":{"page":11,"section":"01. 미국 영재교육의 체계 - 토머스제퍼슨과학고","quote":"서류전형(50명 이상의 위원들이 중복심사) + 필기시험 ‣ 지원자 합격률 17%"}},{"id":"07-11","type":"옳은 것","q":"토머스제퍼슨과학고의 대학진학(2006년) 실적에 대한 설명으로 옳은 것은?","box":null,"choices":["하버드에 29명이 합격하였다.","에일에 19명이 합격하였다.","MIT에 12명이 합격하였다.","프린스턴에 29명이 합격하였다.","아이비리그 8개 대학 + MIT, 스탠퍼드대에 총 158명이 합격하였다."],"answer":4,"explain":"2006년: 아이비리그 8개 대학 + MIT, 스탠퍼드대에 133명 합격, 하버드 12명, 에일 9명, 프린스턴 29명, MIT 19명 등. ① 하버드 12명 ② 에일 9명 ③ MIT 19명 ⑤ 133명(158명은 NMSP 선발 인원).","source":{"page":11,"section":"01. 미국 영재교육의 체계 - 토머스제퍼슨과학고","quote":"아이비리그 8개 대학 + MTI, 스탠퍼드대에 133명 합격 ‣ 하버드 12명, 에일 9명, 프린스턴 29명, MIT 19명 등"}},{"id":"07-12","type":"사례","q":"다음 미국 영재교육 사례에 대한 설명으로 옳은 것은?","box":"사례: 유치원 전 단계서 시험…상위 3% 아동만 영재 혜택 (출처: EBS 2021.10.13)\n미국은 공립학교에서 영재교육을 실시한다. 각 주마다 영재교육 프로그램의 이름이 다르다. ...","choices":["영재교육은 사립학교에서만 실시한다.","유아 5-7세 아동을 대상으로 공식적인 시험을 통해 상위 3%의 학생들을 선발한다.","초등학교 3학년 말에 전 학생을 대상으로 선발한다.","선발된 학생은 매년 재선발 시험을 통과해야 영재학급에 남는다.","모든 주가 동일한 영재교육 프로그램 이름을 사용한다."],"answer":2,"explain":"미국은 공립학교에서 유아 5-7세 아동을 대상으로 공식적인 시험을 통해 상위 3%를 선발하며, 한번 선발되면 초등학교 끝날 때까지 영재학급에 있을 수 있다. ① 공립학교 ③ 싱가포르 방식 ④ 초등학교 끝날 때까지 유지 ⑤ 각 주마다 이름이 다르다.","source":{"page":12,"section":"01. 미국 영재교육의 체계 - 미국 영재교육 사례","quote":"영재교육은 유아 5-7세 아동을 대상으로 하며, 공식적인 시험을 통해, 상위 3%의 학생들을 선발한다. 한번 선발되면 초등학교 끝날 때까지 영재학급에 있을 수 있다."}},{"id":"07-13","type":"보기 조합","q":"\u003c보기\u003e의 미국 영재교육 발전 사건을 시간 순서대로 바르게 나열한 것은?","box":"ㄱ. 말랜드 보고서\nㄴ. 스탠포드-비네 지능검사 개발\nㄷ. Sputnik Shock\nㄹ. 영재교육법 제정, 공포","choices":["ㄱ - ㄴ - ㄷ - ㄹ","ㄴ - ㄱ - ㄷ - ㄹ","ㄷ - ㄴ - ㄱ - ㄹ","ㄴ - ㄷ - ㄹ - ㄱ","ㄴ - ㄷ - ㄱ - ㄹ"],"answer":5,"explain":"1922년 스탠포드-비네 지능검사 개발(ㄴ) → 1957년 Sputnik Shock(ㄷ) → 1972년 말랜드 보고서(ㄱ) → 1988년 영재교육법 제정, 공포(ㄹ).","source":{"page":14,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 미국 영재교육의 발전","quote":"1922년 스탠포드-비네 지능검사 개발 / 1957년 Sputnik Shock! / 1972년 말랜드 보고서 / 1988년 영재교육법 제정, 공포"}},{"id":"07-14","type":"옳은 것","q":"미국 영재교육의 발전 과정 중 1930년대에 대한 설명으로 옳은 것은?","box":null,"choices":["속진학습 → 심화학습, 세계대전으로 예산삭감 → 영재교육 정체","능력수준별 학습제도와 속진학습이 시작되었다.","국립영재연구센터(NRC)가 설립되었다.","39개 주에서 2~16% 영재교육을 실시하였다.","교육, 과학 분야의 대대적 부흥운동이 전개되었다."],"answer":1,"explain":"1930년대: 속진학습 → 심화학습, 세계대전으로 예산삭감 → 영재교육 정체. ② 1868년 ③ 1990년 ④ 2022년 ⑤ 1957년 Sputnik Shock.","source":{"page":14,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 미국 영재교육의 발전","quote":"1930년대 속진학습 → 심화학습 • 세계대전으로 예산삭감 → 영재교육 정체"}},{"id":"07-15","type":"개념 찾기","q":"다음 설명에 해당하는 인물은?","box":"• 미국 '영재교육의 어머니'\n• 영재의 사회정서적 교육 강조","choices":["루이스 터만","시드니 P. 말랜드","홀링워스","탄넨바움","체사레 롬브로소"],"answer":3,"explain":"영재교육의 어머니 = 홀링워스(Hollingworth), 영재의 사회정서적 교육 강조. ① 터만 = 미국 영재교육의 아버지 ② 말랜드 = 1972년 말랜드 보고서 ④ 탄넨바움 = 스푸트니크 충격을 총체적 재능 인재 육성의 도화선으로 봄 ⑤ 롬브로소 = 영재 퇴화설.","source":{"page":14,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 미국 영재교육의 발전","quote":"영재교육의 어머니 홀링워스(Hollingworth) 영재의 사회정서적 교육 강조"}},{"id":"07-16","type":"빈칸","q":"다음은 루이스 터만의 연구에 대한 설명이다. (   )에 들어갈 숫자로 알맞은 것은?","box":"스탠포드-비네 지능검사 상위 1%(IQ 135 이상) (   )명 50년 종단연구","choices":["1,258","1,825","1,528","1,802","1,582"],"answer":3,"explain":"터만은 스탠포드-비네 지능검사 상위 1%(IQ 135 이상) 1,528명을 50년간 종단연구하였다. ④ 1,802는 토머스제퍼슨과학고 재학생 수이다.","source":{"page":15,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - '영재교육 운동의 아버지' 루이스 터만","quote":"스탠포드-비네 지능검사 상위 1%(IQ 135 이상) 1,528명 50년 종단연구 결과"}},{"id":"07-17","type":"옳은 것","q":"루이스 터만의 50년 종단연구 결과로 옳은 것은?","box":null,"choices":["영재들은 지적으로만 우수하고 신체적으로는 허약하였다.","영재들은 사회적 부적응을 보였다.","영재들은 점차 퇴화되는 조짐을 보였다.","연구 대상은 지능검사 상위 3%의 아동이었다.","영재들은 지적으로 우수하였을 뿐만 아니라 심리적, 사회적, 신체적으로도 보통 사람들보다 더 건강하였다."],"answer":5,"explain":"50년 종단연구 결과 영재들은 지적으로 우수하였을 뿐만 아니라 심리적, 사회적, 신체적으로도 보통 사람들보다 더 건강하였다. ①②③은 롬브로소식 기존 인식으로, 터만이 이를 반박하였다. ④ 상위 1%(IQ 135 이상).","source":{"page":15,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - '영재교육 운동의 아버지' 루이스 터만","quote":"50년 종단연구 결과, 지적으로 우수하였을 뿐만 아니라 심리적, 사회적, 신체적으로도 보통 사람들보다 더 건강하다."}},{"id":"07-18","type":"개념 찾기","q":"다음 주장을 한 인물로, 루이스 터만의 50년 종단연구에 의해 반박된 기존 인식의 주인공은?","box":"영재들은 점차 퇴화되는 조짐을 보이고 있는데, 특징으로는 어눌한 말씨, 작은 키, 쇠약한 몸, 창백한 얼굴색, 구루병, 대머리, 기억상실, 불임, 심각한 두뇌퇴화 등이 나타난다","choices":["이탈리아 범죄인류학자 체사레 롬브로소","미국 심리학자 루이스 터만","교육부 국장 시드니 P. 말랜드","영재교육의 어머니 홀링워스","미국 심리학자 로버트 스턴버그"],"answer":1,"explain":"영재 퇴화설은 이탈리아 범죄인류학자 체사레 롬브로소의 주장이며, 터만은 50년 종단연구로 이 기존 인식을 반박하였다.","source":{"page":16,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - '영재교육 운동의 아버지' 루이스 터만","quote":"50년 종단연구로 기존 영재에 대한 인식 반박 / 이탈리아 범죄인류학자 체사레 롬브로소"}},{"id":"07-19","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"(   )은/는 교육, 과학 분야의 대대적 부흥운동을 전개하게 하였으며, 잠재력을 계발해서 자신들의 능력을 국가에 봉사하는데 활용하는, 영재교육을 포함한 총체적 재능 인재 육성의 도화선(탄넨바움)이 되었다.","choices":["말랜드 보고서(1972)","A Nation Deceived(2004)","영재교육법(1988)","스푸트니크 충격(1957)","우수성법안(2022)"],"answer":4,"explain":"스푸트니크 충격(1957)은 교육, 과학 분야의 대대적 부흥운동을 전개하게 했고, 탄넨바움은 이를 총체적 재능 인재 육성의 도화선으로 보았다.","source":{"page":17,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 스푸트니크 충격(1957)","quote":"잠재력을 계발해서 자신들의 능력을 국가에 봉사하는데 활용 영재교육을 포함한 총체적 재능 인재 육성의 도화선(탄넨바움)"}},{"id":"07-20","type":"옳은 것","q":"말랜드 보고서에 대한 설명으로 옳은 것은?","box":null,"choices":["1988년에 발표되었다.","교육부 국장 시드니 P. 말랜드가 영재학생들을 위한 차별화된 교육과정과 교수전략의 조직적/행정적 지원을 최초로 제안하였다.","영재 연방지원금을 20억 달러로 확대하였다.","루이스 터만이 작성한 보고서이다.","'미국은 수월성을 무시하고 있다'는 내용으로 유명하다."],"answer":2,"explain":"말랜드 보고서(1972)는 교육부 국장 시드니 P. 말랜드가 차별화된 교육과정과 교수전략의 조직적/행정적 지원을 최초로 제안한 것이다. ① 1972년 ③ 우수성법안(2022) ④ 시드니 P. 말랜드 ⑤ A Nation Deceived(2004).","source":{"page":18,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 말랜드 보고서(1972)","quote":"교육부 국장 시드니 P. 말랜드 / 영재학생들을 위한 차별화된 교육과정과 교수전략의 조직적/행정적 지원을 최초로 제안"}},{"id":"07-21","type":"빈칸","q":"다음은 말랜드 보고서(1972)의 영재 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"영재는 우수한 능력을 가지고 있기 때문에 뛰어난 수행을 할 수 있을 것으로 (   )에 의해 판별된 아동임","choices":["부모들","전문가들","담임교사들","또래들","정부기관들"],"answer":2,"explain":"말랜드 보고서: '전문가들에 의해 판별된 아동'. 이들이 자신과 사회에 기여하도록 하기 위해서는 일반학교의 정상적 프로그램과는 차별화된 교육프로그램과 서비스가 필요하다.","source":{"page":19,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 말랜드 보고서(1972)","quote":"영재는 우수한 능력을 가지고 있기 때문에 뛰어난 수행을 할 수 있을 것으로 전문가들에 의해 판별된 아동임"}},{"id":"07-22","type":"옳지 않은 것","q":"말랜드 보고서(1972)가 지적한 내용으로 옳지 않은 것은?","box":null,"choices":["영재에게 제공되는 서비스가 많은 수의 영재학생들에게는 제공되지 않고 있다.","주요 하위집단(예: 소수민족, 장애 등)은 충분치 않은 서비스를 제공받는다.","영재를 위한 특별 프로그램 개발은 정부의 모든 수준에서 낮은 우선순위에 있다.","영재에게 서비스를 제공하는 데 있어 연방정부의 역할이 크게 확대되었다.","영재의 재능이 발견되지 않고 계발되지 못하기 때문에 막대한 개인적·사회적 손실이 나타난다."],"answer":4,"explain":"말랜드 보고서는 영재에게 서비스를 제공하는 데 있어 연방정부의 역할은 거의 없어졌다고 지적했다(④ 크게 확대 → 거의 없어짐).","source":{"page":20,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 말랜드 보고서(1972)","quote":"영재에게 서비스를 제공하는데 있어 연방정부의 역할은 거의 없어짐"}},{"id":"07-23","type":"보기 조합","q":"\u003c보기\u003e에서 말랜드 보고서(1972)가 제시한 영재성 영역을 모두 고른 것은?","box":"ㄱ. 일반적인 지적능력\nㄴ. 리더십\nㄷ. 심리운동 능력\nㄹ. 과제집착력","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"explain":"말랜드 보고서의 영역: 일반적인 지적능력, 특수한 학업적성, 창의적 혹은 생산적 사고, 리더십, 시각 및 공연 예술, 심리운동 능력. ㄹ 과제집착력은 포함되지 않는다.","source":{"page":21,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 말랜드 보고서(1972)","quote":"‣ 일반적인 지적능력 ‣ 특수한 학업적성 ‣ 창의적 혹은 생산적 사고 ‣ 리더십 ‣ 시각 및 공연 예술 ‣ 심리운동 능력"}},{"id":"07-24","type":"옳지 않은 것","q":"미국의 영재교육법 제정·공포(1988)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["2005년 미국 의회의 재승인을 받아 영재교육을 확대하였다.","26개 주에서 영재들을 위한 특별 프로그램과 서비스를 제공하였다.","27개 주에서 영재교육법을 제정하였다.","1990년 국립영재연구센터(NRC, G/T)가 설립되었다.","영재의 정의에서 리더십 영역을 제외하였다."],"answer":5,"explain":"영재교육법은 영재를 지능, 창의성, 예술성, 리더십이나 특수한 학문영역에서 뛰어난 능력을 입증한 아동·청소년으로 정의하므로 리더십이 포함된다(⑤ 틀림).","source":{"page":22,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 영재교육법 제정·공포(1988)","quote":"영재는 지능, 창의성, 예술성, 리더십이나 특수한 학문영역에서 뛰어난 능력을 입증하였거나"}},{"id":"07-25","type":"개념 찾기","q":"다음 내용이 담긴 보고서는?","box":"'미국은 수월성을 무시하고 있다'\n미국의 교육시스템은 우수한 학생들에게 고정된 지식을 일반학생들과 함께 배우라고 강요한다. ... 이것은 국가적 스캔들이다.","choices":["말랜드 보고서(1972)","Excellence for All Act(2022)","A Nation Deceived(2004)","영재교육법(1988)","The Myth of the Genius"],"answer":3,"explain":"A Nation Deceived(2004)는 '미국은 수월성을 무시하고 있다'며 우수한 학생들의 욕망을 무시하는 것을 국가적 스캔들이라 지적했다. ⑤ The Myth of the Genius는 터만의 50년 종단연구 출판물이다.","source":{"page":23,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - A Nation Deceived (2004)","quote":"'미국은 수월성을 무시하고 있다'"}},{"id":"07-26","type":"옳은 것","q":"우수성법안(Excellence for All Act)에 대한 설명으로 옳은 것은?","box":null,"choices":["2004년에 통과되었다.","영재 및 재능 있는 학생들을 위한 연방지원금을 10억 달러에서 20억 달러로 확대하였다.","연방지원금을 5억 달러에서 10억 달러로 확대하였다.","교사 및 전문가 양성 프로그램을 축소하였다.","인종·민족별 선발 할당제를 도입하였다."],"answer":2,"explain":"우수성법안(2022.4.27 통과): 연방지원금 10억→20억 달러, 교사 및 전문가 양성 프로그램 확대, 혁신적 교육자료·프로그램 개발 지원, 인종·민족·성별·장애·경제적 배경 등의 차별 없는 교육 보장. ① 2022년 ③ 10억→20억 ④ 확대 ⑤ 차별 없는 교육 보장.","source":{"page":24,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 우수성법안(Excellence for All Act) 통과(2022.4.27)","quote":"영재 및 재능 있는 학생들을 위한 연방지원금 확대 ‣ 10억 달러에서 20억 달러로"}},{"id":"07-27","type":"빈칸","q":"다음은 2022년 미국 영재교육의 현황이다. (   )에 들어갈 숫자로 알맞은 것은?","box":"2022. 4. 우수성법안 통과, (   )개 주에서 2~16% 영재교육 실시","choices":["26","27","50","33","39"],"answer":5,"explain":"2022년 4월 우수성법안 통과, 39개 주에서 2~16% 영재교육 실시. ① 26개 주 = 특별 프로그램과 서비스 제공 ② 27개 주 = 영재교육법 제정(1988 영재교육법 관련).","source":{"page":14,"section":"02. 미국 영재교육의 발전 동향과 교육적 시사점 - 미국 영재교육의 발전","quote":"2022. 4. 우수성법안 통과 • 39개 주에서 2~16% 영재교육 실시"}}]},{"lesson":8,"title":"싱가포르와 이스라엘의 영재교육의 최근 동향","file":"4. 교안 (1~30)/08.pdf","summary":["싱가포르: 1965년 말레이시아로부터 독립, 천연자원 거의 없는 도시국가, 1990년대 후반 '맨파워 21' 국가비전, 이중언어교육·영재교육 강화 → PISA·TIMMS 최상위","싱가포르 1인당 GNP 1965년 500달러 → 2023년 6만9천 달러 (당시 한국 100달러 → 2023년 3만4천 달러)","싱가포르 발전: 1979 능력별 학급제도 → 1984 '국가영재교육안', 영재교육과 신설, GEP 반 개설 → 1990 후반 맨파워 21 → 2007 초등 9개교·중등 7개교로 확대 → 현재 3학년 말 선별, 상위 1% 최종 선발 / 6학년 말 PSLE → IP 스쿨","싱가포르 목표 '국가의 미래를 만들자': 다양한 재능 발견, 개인 맞춤형 교육, 지속적인 성장 / 선발원칙: 다문화·인종 고려 기회 균등, 다중근거 활용, 영재판별평가팀, 다양한 기회","싱가포르 선발: 초3 말 전 학생, 1차(영어 및 수학 선별검사) 2차(영어, 수학 등 학력검사), 상위 6% 선발 → 종합 상위 1% '지능이 뛰어난 학생' 최종 선발 → 4~6학년 상설영재학급(self-contained classes)","싱가포르 특징: 속진학습보다는 심화학습, 일반학교 내 영재학급 상설 운영, 사회적 인식과 책무성, '자기주도적 학습태도' 함양 / 2021.1.1 영재교육에 10억 달러 투자 / '평준화 교육은 자원낭비'","이스라엘: 2500년 유목생활 끝 1948년 독립, 1인당 GNP 1948년 1000달러 → 2023년 4만7천 달러","이스라엘 3원칙: 최선의 여건 제공 / 모든 아동 잠재력 실현 여건 / 이민 학생 통합정책 지속·모든 방법 동원","이스라엘 발전: 1970 형평성 원리 강조 → 1978 영재 및 과학청소년과 설치, 쫄드 연구소 → 1990 기숙형 '예술과학고등학교(IASA)' → 현재 상위 1~1.5% 주중 1회 영재교육센터, 1.5~3% 방과후 심화학습","이스라엘 선발: 첫 단계 매년 3월 교육부, 초등 모든 학생 수학·영어·논리·창의성 / 두 번째 단계 상위 15% 이내 또는 학교 추천, 쫄드 재단 특수센터 주관 / 정기선발(2~4학년, 오페크 스쿨)·특별선발(학부모 추천, 재시험)","이스라엘 교육과정: 간학문적 접근(인문사회과학과 자연과학 균형), 평등과 민주주의 가치관 및 도덕 교육 중시","IASA: 노벨상 최다 배출, 과학과 예술의 만남, '길더(Gilder) 프로젝트 주간', 탐색캠프"],"questions":[{"id":"08-01","type":"옳은 것","q":"싱가포르 영재교육의 배경에 대한 설명으로 옳은 것은?","box":null,"choices":["1948년 말레이시아로부터 독립하였다.","천연자원이 풍부한 국가로 자원 개발에 국가정책 역량을 집중하였다.","1990년대 후반부터 '맨파워 21'이라는 국가비전을 세우고 인재양성과 해외인재 유치정책을 펼쳤다.","중학교부터 실시하는 단일언어교육을 강화하였다.","PISA와 TIMMS에서 중위권 수준을 보이고 있다."],"answer":3,"explain":"싱가포르는 1990년대 후반부터 '맨파워 21' 국가비전을 세웠다. ① 1965년 독립(1948년은 이스라엘) ② 천연자원이 거의 없는 도시국가, 인재 발굴·육성에 역량 집중 ④ 초등학교부터 이중언어교육 ⑤ 최상위 수  적은 나라\"라며 \"한정된 인적자원을 최대한 활용해야 살아남을 수 있다\"고 말했다. \"제각각 능력이 다른 학생에게 평준화 교육을 시키는 것은 (   )\"라는 것이다.","choices":["형평성 위반","교육 불평등","국가적 스캔들","인권 침해","자원낭비"],"answer":5,"explain":"교안: \"제각각 능력이 다른 학생에게 평준화 교육을 시키는 것은 자원낭비\". ③ '국가적 스캔들'은 미국 A Nation Deceived(2004)의 표현이다.","source":{"page":12,"section":"01. 싱가포르 영재교육의 발전 동향과 교육적 시사점 - 싱가포르 영재학생 선발사례","quote":"\"제각각 능력이 다른 학생에게 평준화 교육을 시키는 것은 자원낭비\"라는 것이다."}},{"id":"08-15","type":"옳은 것","q":"이스라엘의 배경에 대한 설명으로 옳은 것은?","box":null,"choices":["1965년에 독립하였다.","2500년 유목생활 끝에 1948년에 독립하였다.","천연자원이 풍부하여 자원 중심으로 국가가 발전하였다.","1948년 1인당 GNP는 500달러였다.","2023년 1인당 GNP는 6만 9천 달러이다."],"answer":2,"explain":"이스라엘은 2500년 유목생활 끝에 1948년 독립, 국토환경이 열악하고 천연자원이 부족하여 영재교육에 역량을 집중했다. 1인당 GNP 1948년 1000달러 → 2023년 4만7천 달러. ① 1965년은 싱가포르 ④⑤ 싱가포르 수치.","source":{"page":14,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 영재교육의 발전 동향","quote":"2500년 유목생활 끝에 1948년에 독립한 이스라엘 ... 1948년 1인당 GNP 1000달러 → 2023년 4만 7천 달러"}},{"id":"08-16","type":"옳지 않은 것","q":"이스라엘 영재교육의 3원칙에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재들에 대한 관심은 광범위하고도 혁신적인 방법으로 재능을 계발시키기 위해 가능한 한 최선의 여건을 제공한다.","모든 아동들의 잠재력, 최상의 재능을 실현할 수 있는 여건을 제공한다.","교육체제에서 가능한 한 모든 방법을 동원하여 영재교육을 수행한다.","영재교육은 엘리트 사립학교를 중심으로만 수행한다.","문화적 배경이 다른 여러 나라에서 이민 온 학생들 간의 통합정책은 계속될 것이다."],"answer":4,"explain":"이스라엘 3원칙: 최선의 여건 제공, 모든 아동의 잠재력 실현 여건 제공, 이민 학생 간 통합정책 지속 및 교육체제에서 가능한 모든 방법 동원. ④는 교안에 없다(엘리트 사립학교 중심은 영국의 상황 설명과 관련).","source":{"page":15,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 영재교육의 3원칙","quote":"문화적 배경이 다른 여러 나라에서 이민 온 학생들 간의 통합정책은 계속될 것이며, 교육체제에서 가능한 한 모든 방법을 동원하여 영재교육을 수행"}},{"id":"08-17","type":"개념 찾기","q":"이스라엘 영재교육 발전 동향에서 '형평성 원리 강조'가 해당하는 연도는?","box":null,"choices":["1948년","1978년","1990년","1970년","1965년"],"answer":4,"explain":"1970년 형평성 원리 강조 → 1978년 영재 및 과학청소년과 설치, 쫄드 연구소 → 1990년 기숙형 영재학교 IASA 설립.","source":{"page":16,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 영재교육의 발전 동향","quote":"1970년 형평성 원리 강조"}},{"id":"08-18","type":"개념 찾기","q":"다음 설명에 해당하는 이스라엘의 기관은?","box":"영재교육 정책 수립, 시행, 선발도구 개발, 전문교육 연구기관","choices":["오페크 스쿨","쫄드 연구소","예술과학고등학교(IASA)","영재교육 아카데미","국립영재연구센터(NRC)"],"answer":2,"explain":"쫄드 연구소: 영재교육 정책 수립, 시행, 선발도구 개발, 전문교육 연구기관(1978년 영재 및 과학청소년과 설치와 함께 제시). ① 주 1회 영재교육 ③ 1990년 기숙형 영재학교 ④ 홍콩 ⑤ 미국 1990년.","source":{"page":16,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 영재교육의 발전 동향","quote":"쫄드 연구소: 영재교육 정책 수립, 시행, 선발도구 개발, 전문교육 연구기관"}},{"id":"08-19","type":"옳은 것","q":"이스라엘의 현재 영재교육 운영(학생)에 대한 설명으로 옳은 것은?","box":null,"choices":["상위 1~1.5% 학생은 방과후 심화학습 프로그램에 참여한다.","상위 1.5~3% 학생은 주중 1회 영재교육센터 교육을 받는다.","상위 15% 학생은 모두 영재교육센터 교육을 받는다.","상위 1% 학생은 모두 기숙형 영재학교에 입학한다.","상위 1~1.5% 학생은 주중 1회 영재교육센터 교육, 상위 1.5~3% 학생은 방과후 심화학습 프로그램에 참여한다."],"answer":5,"explain":"현재 1, 2차 영재선발을 통해 상위 1~1.5%는 주중 1회 영재교육센터 교육, 상위 1.5~3%는 방과후 심화학습 프로그램 참여. ①② 서로 바뀜 ③ 15%는 첫 단계 통과 기준 ④ 교안에 없음.","source":{"page":16,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 영재교육의 발전 동향","quote":"\u003c학생\u003e 현재 1, 2차 영재선발을 통해 상위 1~1.5% 학생 주중 1회 영재교육센터 교육, 상위 1.5~3% 학생 방과후 심화학습 프로그램 참여"}},{"id":"08-20","type":"옳은 것","q":"이스라엘의 정기선발과 특별선발에 대한 설명으로 옳은 것은?","box":null,"choices":["정기선발은 5~6학년만을 대상으로 한다.","정기선발은 학부모 추천에 의해 이루어진다.","특별선발은 학부모 추천에 의한 선발, 재시험이다.","정기선발 후 매일 오페크 스쿨에서 교육받는다.","특별선발은 교육부 장관 지명으로 이루어진다."],"answer":3,"explain":"정기선발: 2~4학년 전학년 대상, 교사 추천 선발시험 → 쫄드 재단 선발 → 주 1회 영재교육(오페크 스쿨). 특별선발: 학부모 추천에 의한 선발, 재시험. ① 2~4학년 ② 교사 추천 ④ 주 1회 ⑤ 교안에 없음.","source":{"page":16,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 영재교육의 발전 동향","quote":"정기선발: 2~4학년 전학년 대상, 교사 추천 선발시험 → 쫄드 재단 선발 → 주 1회 영재교육(오페크 스쿨) • 특별선발: 학부모 추천에 의한 선발, 재시험"}},{"id":"08-21","type":"빈칸","q":"다음은 이스라엘 영재선발의 두 번째 단계이다. (   )에 들어갈 숫자로 알맞은 것은?","box":"첫 단계에서 상위 (   )% 이내의 학생이나, 두 번째 단계의 검사를 받을 자격이 있다고 학교가 추천한 학생에 대해 쫄드 재단의 특수센터가 주관이 되어 실시","choices":["15","1","3","6","10"],"answer":1,"explain":"두 번째 단계는 첫 단계 상위 15% 이내 학생 또는 학교 추천 학생을 대상으로 쫄드 재단의 특수센터가 주관한다. ④ 6%는 싱가포르 상위 6% 선발.","source":{"page":17,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 영재선발","quote":"첫 단계에서 상위 15% 이내의 학생이나, 두 번째 단계의 검사를 받을 자격이 있다고 학교가 추천한 학생에 대해 쫄드 재단의 특수센터가 주관이 되어 실시"}},{"id":"08-22","type":"빈칸","q":"다음은 이스라엘 영재선발의 첫 단계이다. (   )에 들어갈 말로 알맞은 것은?","box":"매년 (   )에 교육부에서 초등학교 모든 학생을 대상으로 수학, 영어, 논리, 창의성 등 선발시험을 실시","choices":["1월","9월","6월","12월","3월"],"answer":5,"explain":"첫 단계: 매년 3월에 교육부에서 초등학교 모든 학생을 대상으로 수학, 영어, 논리, 창의성 등 선발시험 실시.","source":{"page":17,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 영재선발","quote":"매년 3월에 교육부에서 초등학교 모든 학생을 대상으로 수학, 영어, 논리, 창의성 등 선발시험을 실시"}},{"id":"08-23","type":"보기 조합","q":"\u003c보기\u003e에서 이스라엘 영재선발에 대한 설명으로 옳은 것을 모두 고른 것은?","box":"ㄱ. 첫 단계는 교육부에서 초등학교 모든 학생을 대상으로 선발시험을 실시한다.\nㄴ. 두 번째 단계는 쫄드 재단의 특수센터가 주관한다.\nㄷ. 선발 결과 상위 1~1.5% 학생은 일반학교의 영재학급, 주중 1일 영재교육센터에서 영재교육을 받는다.\nㄹ. 두 번째 단계는 교육부가 직접 주관한다.","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],"answer":1,"explain":"ㄱ·ㄴ·ㄷ은 교안 내용 그대로이다. ㄹ 두 번째 단계는 교육부가 아닌 쫄드 재단의 특수센터가 주관한다.","source":{"page":18,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 영재선발","quote":"선발 결과에 따라 ‣ 상위 1~1.5% 학생은 일반학교의 영재학급 ‣ 주중 1일 영재교육센터에서 영재교육을 받음"}},{"id":"08-24","type":"개념 찾기","q":"이스라엘 영재교육과정의 특징 중 다음 설명에 해당하는 것은?","box":"영재교육 프로그램을 계획할 때 인문사회과학과 자연과학이 균형 있게 제공되도록 해야 함을 명시함","choices":["속진적 접근","심화학습 중심","간학문적 접근","자기주도적 학습","개인 맞춤형 교육"],"answer":3,"explain":"인문사회과학과 자연과학의 균형 = 간학문적 접근. 이스라엘 영재교육과정의 또 다른 특징은 평등과 민주주의 가치관 및 도덕 교육 중시(이웃에 민감, 사회 및 국가 의식 계발)이다.","source":{"page":19,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 영재교육과정의 특징","quote":"간학문적 접근 ‣ 영재교육 프로그램을 계획할 때 인문사회과학과 자연과학이 균형 있게 제공되도록 해야 함을 명시함"}},{"id":"08-25","type":"옳지 않은 것","q":"이스라엘 예술과학고등학교(Arts and Science Academy)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["세계에서 노벨상을 제일 많이 배출하였다.","과학과 예술의 만남을 강조하는 교육과정을 운영한다.","과학전공 학생은 음악이나 미술 수업을 통해 미적 감각을 기른다.","과학전공 학생에게는 과학 수업만 집중적으로 제공한다.","예술전공 학생은 과학을 배우며 논리성과 합리성을 신장한다."],"answer":4,"explain":"과학전공 학생은 음악이나 미술 수업을 통해 미적 감각을 기르므로 ④는 틀리다. 고등학교 수준에서 과학 분야에만 한정된 경험을 주는 것은 좋지 않다고 인식한다.","source":{"page":20,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 예술과학고등학교","quote":"과학전공 학생은 음악이나 미술수업을 통해 미적감각 예술전공 학생은 과학을 배우며 논리성과 합리성을 신장"}},{"id":"08-26","type":"개념 찾기","q":"이스라엘 예술과학고등학교에서 학생들이 종합적으로 사고하고 문제를 해결해 나갈 수 있는 기회를 제공하기 위해 선정·운영하는 것은?","box":null,"choices":["오페크 스쿨","길더(Gilder) 프로젝트 주간","맨파워 21","GEP 반","IP 스쿨"],"answer":2,"explain":"'길더(Gilder) 프로젝트 주간'을 선정하여 학생들이 종합적으로 사고하게 하고 문제를 해결해 나갈 기회를 제공한다. ③④⑤ 싱가포르 관련 ① 이스라엘 정기선발 후 주 1회 영재교육.","source":{"page":21,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 예술과학고등학교","quote":"'길더(Gilder) 프로젝트 주간'을 선정하여 학생들이 종합적으로 사고하게 함 문제를 해결해 나갈 수 있는 기회를 제공"}},{"id":"08-27","type":"옳은 것","q":"이스라엘 예술과학고등학교의 탐색캠프 운영 취지로 옳은 것은?","box":null,"choices":["과학 영재에게는 과학 분야에만 집중된 경험이 바람직하다고 보기 때문이다.","예술 전공자의 실기 능력만을 높이기 위해서이다.","고등학교 수준에서는 과학 분야에만 한정된 경험을 주는 것이 좋지 않다고 인식하여 다른 학문 분야를 탐색할 기회를 제공하기 위해서이다.","대학 입시 준비를 위한 속진 교육을 위해서이다.","학부모 추천 학생의 재시험을 위해서이다."],"answer":3,"explain":"고등학교 수준에서는 과학 분야에만 한정된 경험을 주는 것이 좋지 않다고 인식하여 다른 학문 분야를 탐색할 기회를 제공하는 탐색캠프를 운영한다. ⑤ 특별선발(학부모 추천, 재시험)과 혼동.","source":{"page":21,"section":"02. 이스라엘 영재교육의 발전 동향과 교육적 시사점 - 이스라엘 예술과학고등학교","quote":"고등학교 수준에서는 과학 분야에만 한정된 경험을 주는 것이 좋지 않다고 인식 다른 학문 분야를 탐색할 기회를 제공하는 탐색캠프 운영"}}]},{"lesson":9,"title":"누구를 영재라고 할 것인가?","file":"4. 교안 (1~30)/09.pdf","summary":["문제제기: AI를 이긴 16세 소녀, 범죄자 리스트 상위 1%·자장면 빨리 먹는 상위 1%, 간디 vs 히틀러 → 누구를 영재라 할 것인가?","영재(英才) = The Gifted \u0026 Talented, 영재교육대상자 / 영재성(英才性) = The Giftedness, 영재의 심리적 특성","영재 패러다임(영재성 개념과 정의, 출현율, 출현 영역 등)은 시대적·문화적·사회적 상황에 따라 변화","행동과학: 영재 특성 간 규칙 발견 → 과학적 연구방법으로 이론화 → 교육모델 개발 → 일반학생도 계발(시너지 효과)","영재성 요소: 인지적 능력(지능, 창의성), 정의적 특성(학습동기, 자아존중감), 사회적 특성(리더십, 교우관계)","개념정의가 중요한 이유: 심리적 특성과 요구 파악이 선결과제 → 법적·제도적 기반 위에 영재교육 / 판별(Identification)·선발(Selection), 배치, 프로그램 설계·운용, 효과 측정, 교원 양성·배치, 영재상담","로버트 스턴버그(2004): 영재성 개념화는 미래사회 공헌 기회를 많게/적게 함 → 신중한 접근과 경계 강조","과학적 연구 = 인간과 환경의 관계를 연구대상(현상)으로 규정·탐구, 결과가 이론화 / 기술·설명·예측·통제","연구방법론 2가지: 잠재된 영재성의 아동 vs 발현된 영재성의 성인","잠재된 영재성 연구: 1904년 비네 지능검사 → 1922년 터만 스탠포드-비네, Terman \u0026 Oden(1947, 1959) 상위 1% 1,528여 명 50여 년 종단연구('천재에 대한 유전적 연구') / 조석희 외(2003) 1985-1989년 3-5세 신동 144명 → 적절한 교육 부재, 더 불행, 39% 학업 뜻 잃음 / 김홍원 외(2003) 초등학생 583명, 체계적 영재교육 받는 학생이 영재성 잘 계발","발현된 영재성 연구: 탄넨바움 – 심리·사회학적 관점, 성인 중심, 충분히 계발된 재능은 성인에게서만 / 아동의 영재성 = 훌륭한 수행자나 산출자가 될 수 있는 잠재력","정의가 어려운 이유: 시대적·문화적 차이, 일치된 정의 요구는 오만이자 학자의 독선, 반증과 논쟁은 과학적 발전 과정"],"questions":[{"id":"09-01","type":"개념 찾기","q":"교안에서 '누구를 영재라고 할 것인가?'라는 문제를 제기하며 비교한 두 인물은?","box":null,"choices":["링컨 vs 나폴레옹","간디 vs 히틀러","아인슈타인 vs 에디슨","터만 vs 롬브로소","베토벤 vs 모차르트"],"answer":2,"explain":"교안은 'AI를 이긴 16세의 소녀', '범죄자 리스트 중 상위 1%나 자장면을 빨리 먹는 상위 1%', '간디 vs 히틀러 중에 누구를 영재라고 할 것인가?'라는 질문으로 영재성 정의 문제를 제기한다.","source":{"page":3,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 누구를 영재라고 할 것인가?","quote":"간디 vs 히틀러 중에 누구를 영재라고 할 것인가?"}},{"id":"09-02","type":"옳은 것","q":"영재와 영재성의 용어에 대한 설명으로 옳은 것은?","box":null,"choices":["영재는 The Giftedness로 표기한다.","영재성은 영재교육대상자를 의미한다.","영재는 영재의 심리적 특성을 의미한다.","영재성(英才性, The Giftedness)은 영재의 심리적 특성을 의미한다.","영재성은 The Gifted \u0026 Talented로 표기한다."],"answer":4,"explain":"영재 = 英才, The Gifted \u0026 Talented, 영재교육대상자 / 영재성 = 英才性, The Giftedness, 영재의 심리적 특성. ①②③⑤는 두 용어의 설명을 뒤바꾼 것이다.","source":{"page":4,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 영재성에 대한 패러다임의 변화","quote":"영재 ‣ 英才, The Gifted \u0026 Talented, 영재교육대상자 / ‣ 英才性, The Giftedness, 영재의 심리적 특성 영재성"}},{"id":"09-03","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재에 대한 패러다임(영재성 개념과 정의, 출현율, 출현 영역 등)은 (   )에 따라 변화됨","choices":["시대적, 문화적, 사회적 상황","개인의 지능 수준","학자 개인의 선호","지능검사 도구의 종류","부모의 교육적 요구"],"answer":1,"explain":"영재 패러다임은 시대적, 문화적, 사회적 상황에 따라 변화한다(예: 스파르타와 로마시대, 중세시대, 중국 당나라의 과거제도, 주마다 영재 패러다임이 다른 미국, 4차 산업혁명·AI 시대).","source":{"page":4,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 영재성에 대한 패러다임의 변화","quote":"영재에 대한 패러다임(영재성 개념과 정의, 출현율, 출현 영역 등)은 시대적, 문화적, 사회적 상황에 따라 변화됨"}},{"id":"09-04","type":"옳지 않은 것","q":"교육학 및 심리학과 같은 행동과학에서 영재의 특성을 연구한 방식에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재들의 탁월한 특성을 알기 위해 특성 간에 존재하는 규칙을 발견한다.","발견한 규칙을 과학적 연구방법으로 이론화한다.","이를 바탕으로 교육모델을 개발한다.","일반학생들에게도 이러한 특성을 계발하도록 교육한다.","연구 결과는 영재교육에만 적용되며 일반교육과는 무관하다."],"answer":5,"explain":"영재 연구는 영재교육과 일반교육 모두 시너지(Synergy) 효과를 발휘하며, 일반학생들에게도 이러한 특성을 계발하도록 교육한다(⑤ 틀림).","source":{"page":5,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 행동과학에서의 영재 특성 연구","quote":"영재교육과 일반교육 모두 시너지(Synergy) 효과를 발휘 일반학생들에게도 이러한 특성을 계발하도록 교육"}},{"id":"09-05","type":"개념 찾기","q":"영재성의 요소 중 '정의적 특성'에 해당하는 것은?","box":null,"choices":["지능","창의성","학습동기","리더십","교우관계"],"answer":3,"explain":"영재성 요소: 인지적 능력(지능, 창의성 등), 정의적 특성(학습동기, 자아존중감 등), 사회적 특성(리더십, 교우관계 등). ①② 인지적 ④⑤ 사회적.","source":{"page":6,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 영재성의 요소","quote":"인지적 능력(지능, 창의성 등) 영재성 / 사회적 특성(리더십, 교우관계 등) 정의적 특성(학습동기, 자아존중감 등)"}},{"id":"09-06","type":"개념 찾기","q":"영재성의 요소 중 '사회적 특성'에 해당하는 것은?","box":null,"choices":["리더십","지능","자아존중감","창의성","학습동기"],"answer":1,"explain":"사회적 특성 = 리더십, 교우관계 등. ②④ 인지적 능력 ③⑤ 정의적 특성.","source":{"page":6,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 영재성의 요소","quote":"영재가 지닌 인지적, 정의적, 사회적 특성으로 구분됨"}},{"id":"09-07","type":"빈칸","q":"다음은 영재성의 개념정의가 중요한 이유이다. (   )에 들어갈 말로 알맞은 것은?","box":"영재의 심리적 특성과 요구 파악이 (   ) 이를 충족시켜 줄 수 있는 법적, 제도적 기반 위에 영재교육이 이루어짐","choices":["후속과제","부차적 과제","선택사항","선결과제","최종목표"],"answer":4,"explain":"영재의 심리적 특성과 요구 파악이 선결과제이며, 이를 충족시켜 줄 법적, 제도적 기반 위에서 영재교육이 이루어진다(심리적 특성 + 교육적 요구 / 법 + 교육제도 → 영재성의 정립).","source":{"page":7,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 영재성의 개념정의가 중요한 이유","quote":"영재의 심리적 특성과 요구 파악이 선결과제 이를 충족시켜 줄 수 있는 법적, 제도적 기반 위에 영재교육이 이루어짐"}},{"id":"09-08","type":"옳지 않은 것","q":"정립된 영재성에 기초하여 이루어지는 영재교육과정으로 교안에 제시된 것이 아닌 것은?","box":null,"choices":["누가 영재인지를 판별하고 선발","일반학생 대상 평준화 교육의 확대","영재교육 프로그램의 효과 측정과 평가","영재교육을 담당하는 교원의 양성과 배치","영재의 심리적 특성에 따른 영재상담"],"answer":2,"explain":"영재교육과정: 판별(Identification)·선발(Selection), 교육프로그램에 배치, 프로그램 설계·구성·운용, 효과 측정과 평가, 교원 양성과 배치, 영재상담. ②는 제시되지 않았다.","source":{"page":8,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 영재성의 개념정의가 중요한 이유","quote":"‣ 영재교육 프로그램의 효과측정과 평가 ‣ 영재교육을 담당하는 교원의 양성과 배치 ‣ 영재의 심리적 특성에 따른 영재상담 등"}},{"id":"09-09","type":"빈칸","q":"다음 (   )에 들어갈 영어 용어로 알맞은 것은?","box":"정립된 영재성에 기초하여 누가 영재인지를 판별(   )하고 선발(Selection)","choices":["Assessment","Placement","Evaluation","Nomination","Identification"],"answer":5,"explain":"교안: '판별(Identification)하고 선발(Selection)'.","source":{"page":8,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 영재성의 개념정의가 중요한 이유","quote":"누가 영재인지를 판별(Identification)하고 선발(Selection)"}},{"id":"09-10","type":"개념 찾기","q":"다음 말을 한 미국 심리학자는?","box":"우리가 영재성을 개념화하는 것은 누군가 미래사회에 공헌할 수 있는 기회를 많게 하거나 적게 하는데 영향을 줄 수 있다는 것이다. 영재로 판별된 사람들은 성공할 기회가 주어지지만, 판별되지 못한 사람들은 그렇지 못하다.","choices":["루이스 터만","탄넨바움","로버트 스턴버그","렌줄리","가네"],"answer":3,"explain":"미국 심리학자 로버트 스턴버그(2004)의 말로, 영재성 연구에 대한 신중한 접근과 경계를 강조한다.","source":{"page":9,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 영재성의 개념정의가 중요한 이유","quote":"미국 심리학자 로버트 스턴버그(2004)"}},{"id":"09-11","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"우리가 영재성을 개념화하는 것은 누군가 미래사회에 공헌할 수 있는 (   )을/를 많게 하거나 적게 하는데 영향을 줄 수 있다는 것이다.","choices":["기회","능력","동기","자원","책임"],"answer":1,"explain":"스턴버그(2004): 영재성 개념화는 미래사회에 공헌할 수 있는 '기회'를 많게 하거나 적게 한다. 판별된 사람에게는 성공할 기회가 주어지기 때문에 신중한 접근과 경계가 필요하다.","source":{"page":9,"section":"01. 영재성의 개념정의의 필요성과 중요성 - 영재성의 개념정의가 중요한 이유","quote":"우리가 영재성을 개념화하는 것은 누군가 미래사회에 공헌할 수 있는 기회를 많게 하거나 적게 하는데 영향을 줄 수 있다는 것이다."}},{"id":"09-12","type":"옳은 것","q":"교안에 제시된 과학적 연구의 네 가지 요소(목적)로 옳은 것은?","box":null,"choices":["기술, 설명, 예측, 통제","관찰, 가설, 실험, 결론","계획, 실행, 평가, 환류","판별, 선발, 배치, 평가","분석, 종합, 평가, 적용"],"answer":1,"explain":"과학적 연구란 인간과 인간을 둘러싼 환경과의 관계를 '연구대상(현상)'으로 규정하고 탐구하는 과학적 활동이며, 연구 결과가 이론화되는 것이다. 교안은 기술, 설명, 예측, 통제를 제시한다.","source":{"page":11,"section":"02. 영재성의 과학적 연구방법 - 과학적 연구란?","quote":"연구의 결과가 이론화되는 것 / 기술 설명 예측 통제"}},{"id":"09-13","type":"옳은 것","q":"영재성의 2가지 연구방법론에 대한 설명으로 옳은 것은?","box":null,"choices":["잠재된 영재성 연구는 업적이 검증된 성인을 대상으로 한다.","발현된 영재성 연구는 아직 잠재되어 있는 아동을 대상으로 한다.","두 연구방법론 모두 아동만을 대상으로 한다.","잠재된 영재성의 아동과 발현된 영재성의 성인을 대상으로 하는 연구로 구분된다.","두 연구방법론 모두 성인만을 대상으로 한다."],"answer":4,"explain":"잠재된 영재성 연구 = 아직 잠재되어 있거나 발현 중인 아동·학생 대상 / 발현된 영재성 연구 = 학문적·사회적 업적이 검증된 성인 영재 대상. ①② 대상이 뒤바뀜 ③⑤ 틀림.","source":{"page":12,"section":"02. 영재성의 과학적 연구방법 - 영재성의 2가지 연구방법론","quote":"잠재된 영재성의 아동 발현된 영재성의 성인"}},{"id":"09-14","type":"빈칸","q":"다음 (ㄱ), (ㄴ)에 들어갈 연도로 알맞은 것은?","box":"(ㄱ)년 프랑스 비네(Binet)가 개발한 지능검사에, (ㄴ)년 미국 스탠포드대학교의 심리학자인 루이스 터만 교수가 스탠포드-비네(Stanford-Binet) 지능검사를 개발","choices":["ㄱ: 1922, ㄴ: 1904","ㄱ: 1904, ㄴ: 1922","ㄱ: 1904, ㄴ: 1947","ㄱ: 1868, ㄴ: 1922","ㄱ: 1922, ㄴ: 1959"],"answer":2,"explain":"1904년 프랑스 비네의 지능검사 → 1922년 루이스 터만의 스탠포드-비네 지능검사. 1947, 1959는 Terman \u0026 Oden 연구 연도.","source":{"page":13,"section":"02. 영재성의 과학적 연구방법 - 잠재된 영재성에 대한 대표적 연구","quote":"1904년 프랑스 비네(Binet)가 개발한 지능검사에, 1922년 미국 스탠포드대학교의 심리학자인 루이스 터만 교수가 스탠포드-비네(Stanford-Binet) 지능검사를 개발"}},{"id":"09-15","type":"옳은 것","q":"터만과 오든(Terman \u0026 Oden, 1947, 1959) 연구에 대한 설명으로 옳은 것은?","box":null,"choices":["검사결과 상위 3%의 지능을 가진 학생을 대상으로 하였다.","583명의 영재학생을 10여 년 동안 연구하였다.","성인 영재의 업적을 회고적으로 분석한 연구이다.","연구 대상은 3-5세 신동 144명이었다.","검사결과 상위 1%의 지능을 가진 1,528여 명의 영재학생에 대하여 50여 년 동안 종단연구를 시행하고 '천재에 대한 유전적 연구'라는 시리즈로 출판하였다."],"answer":5,"explain":"터만과 오든은 상위 1% 지능의 1,528여 명을 50여 년간 종단연구하고 '천재에 대한 유전적 연구' 시리즈로 출판했다. ② 583명은 김홍원 외(2003) ④ 144명은 조석희 외(2003) ③ 잠재된 영재성(아동) 연구이다.","source":{"page":13,"section":"02. 영재성의 과학적 연구방법 - 잠재된 영재성에 대한 대표적 연구","quote":"검사결과 상위 1%의 지능을 가진 1,528여 명의 영재학생에 대하여 50여 년 동안 종단연구를 시행 ‣ 연구 결과를 '천재에 대한 유전적 연구'라는 시리즈로 출판"}},{"id":"09-16","type":"빈칸","q":"다음은 조석희 외(2003)의 연구이다. (   )에 들어갈 숫자로 알맞은 것은?","box":"1985-1989년도 3-5세의 아동 중 국가적으로 신동으로 발굴된 (   )명의 성장과정을 연구하였으며, 그 결과 발굴된 영재아들에게 적절한 영재교육이 이루어지지 않음","choices":["1,528","583","144","39","158"],"answer":3,"explain":"조석희 외(2003)는 1985-1989년 신동으로 발굴된 144명의 성장과정을 연구했다. 성인이 된 이들은 오히려 일반 사람들에 비하여 더 불행한 인생을 살고 있었다. ① 터만 ② 김홍원 외 ④ 학업 뜻을 잃은 비율(39%).","source":{"page":14,"section":"02. 영재성의 과학적 연구방법 - 잠재된 영재성에 대한 대표적 연구","quote":"1985-1989년도 3-5세의 아동 중 국가적으로 신동으로 발굴된 144명의 성장과정을 연구하였으며, 그 결과 발굴된 영재아들에게 적절한 영재교육이 이루어지지 않음"}},{"id":"09-17","type":"빈칸","q":"다음 신문 기사 내용의 (   )에 들어갈 숫자로 알맞은 것은?","box":"1985년 정부가 발굴했던 3-5세의 신동 중 초·중·고교에서 학업에 대한 뜻을 잃은 영재가 전체의 (   )%나 됐다 (중앙일보, 2001. 3. 28)","choices":["39","17","3","15","25"],"answer":1,"explain":"중앙일보(2001. 3. 28): 학업에 대한 뜻을 잃은 영재가 전체의 39%. 이 자료는 조석희 외(2003) 연구와 함께 제시되며, 영재성은 조기 발굴·조기 교육되어야 함을 보여준다.","source":{"page":14,"section":"02. 영재성의 과학적 연구방법 - 잠재된 영재성에 대한 대표적 연구","quote":"1985년 정부가 발굴했던 3-5세의 신동 중 초·중·고교에서 학업에 대한 뜻을 잃은 영재가 전체의 39%나 됐다"}},{"id":"09-18","type":"옳은 것","q":"김홍원 외(2003)의 '초등영재학생의 지적·정의적 행동특성 및 지도방안 연구'에 대한 설명으로 옳은 것은?","box":null,"choices":["전국 영재교육기관의 초등학생 144명을 대상으로 하였다.","창의성 검사 점수를 영재성의 준거로 하였다.","성인 영재를 대상으로 한 발현된 영재성 연구이다.","고지능의 영재들 중 영재교육기관에서 체계적으로 영재교육을 받고 있는 학생들이 다른 집단에 비하여 영재성이 잘 계발되고 있는 것으로 밝혀졌다.","영재교육기관에서 교육받은 학생들의 영재성이 오히려 덜 계발되었다."],"answer":4,"explain":"김홍원 외(2003)는 초등학생 583명을 대상으로 지능지수를 영재성의 준거로 하여 연구했고, 체계적 영재교육을 받는 학생들이 영재성이 잘 계발됨을 밝혔다. ① 583명 ② 지능지수 ③ 잠재된 영재성(아동) 연구 ⑤ 반대.","source":{"page":15,"section":"02. 영재성의 과학적 연구방법 - 잠재된 영재성에 대한 대표적 연구","quote":"고지능의 영재들 중에서도 영재교육기관에서 체계적으로 영재교육을 받고 있는 학생들이 다른 집단들에 비하여 영재성이 잘 계발되고 있는 것으로 밝혀짐"}},{"id":"09-19","type":"개념 찾기","q":"다음 설명에 해당하는 학자는?","box":"• 심리·사회학적인 관점에서 아동보다는 성인을 중심으로 한 영재성 연구를 주장함\n• 충분히 계발된 재능은 성인에게서만 찾아볼 수 있음","choices":["터만","탄넨바움","비네","홀링워스","스턴버그"],"answer":2,"explain":"탄넨바움(Tannenbaum)은 발현된 영재성에 대한 대표적 연구자로, 심리·사회학적 관점에서 성인 중심의 영재성 연구를 주장했다. ① 터만·③ 비네는 잠재된 영재성(지능검사) 연구.","source":{"page":16,"section":"02. 영재성의 과학적 연구방법 - 발현된 영재성에 대한 대표적 연구","quote":"심리·사회학적인 관점에서 아동보다는 성인을 중심으로 한 영재성 연구를 주장함 충분히 계발된 재능은 성인에게서만 찾아볼 수 있음"}},{"id":"09-20","type":"빈칸","q":"다음은 탄넨바움의 영재성 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"영재성은 인간의 윤리적, 신체적, 정서적, 사회적, 지적, 심리적 생활에서 새로운 아이디어를 생산해내는 표상이나 또는 결정적으로 (   )이/가 될 가능성을 말함","choices":["부를 축적한 성공자","높은 지능의 소유자","존경을 받는 수행자","사회적 지도자","학업 성취자"],"answer":3,"explain":"탄넨바움: 영재성은 새로운 아이디어를 생산해내는 표상이나 또는 결정적으로 '존경을 받는 수행자'가 될 가능성.","source":{"page":16,"section":"02. 영재성의 과학적 연구방법 - 발현된 영재성에 대한 대표적 연구","quote":"영재성은 인간의 윤리적, 신체적, 정서적, 사회적, 지적, 심리적 생활에서 새로운 아이디어를 생산해내는 표상이나 또는 결정적으로 존경을 받는 수행자가 될 가능성을 말함"}},{"id":"09-21","type":"빈칸","q":"다음은 '아동의 영재성'에 대한 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"\"미래의 활동영역에서 인간의 도덕적, 신체적, 정서적, 사회적, 지적 혹은 미적 삶을 향상시키게 될 활동 영역에서 훌륭한 수행자나 산출자가 될 수 있는 (   )\"을 의미함","choices":["능력","성취","동기","재능","잠재력"],"answer":5,"explain":"아동의 영재성은 훌륭한 수행자나 산출자가 될 수 있는 '잠재력'을 의미한다(충분히 계발된 재능은 성인에게서만 찾아볼 수 있으므로).","source":{"page":17,"section":"02. 영재성의 과학적 연구방법 - 발현된 영재성에 대한 대표적 연구","quote":"훌륭한 수행자나 산출자가 될 수 있는 잠재력\"을 의미함"}},{"id":"09-22","type":"옳지 않은 것","q":"영재성에 대한 개념, 정의가 어려운 이유에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재성의 정의는 시대적, 문화적 차이에 따라 변화되고 달리 정의되어 왔다.","연구자들 간의 끊임없는 반증과 논쟁은 영재성 연구의 과학적 발전을 꾀하고자 하는 발전과정으로 해석할 수 있다.","연구자들에게 일치된 '영재성'의 정의를 요구하는 것은 학문의 과학적 발전에 반드시 필요한 조건이다.","영재에 대한 패러다임은 시대적, 문화적, 사회적 상황에 따라 변화된다.","영재성 연구에 대한 신중한 접근과 경계가 강조된다."],"answer":3,"explain":"교안은 일치된 '영재성'의 정의를 요구하는 것 자체가 학문의 과학적인 발전에 대한 오만이자 학자의 독선이라고 본다(③ 틀림).","source":{"page":18,"section":"02. 영재성의 과학적 연구방법 - 영재성에 대한 개념, 정의가 어려운 이유","quote":"연구자들에게 일치된 '영재성'의 정의를 요구하는 것 자체가 학문의 과학적인 발전에 대한 오만이자 학자의 독선임"}},{"id":"09-23","type":"빈칸","q":"다음 (ㄱ), (ㄴ)에 들어갈 말로 알맞은 것은?","box":"연구자들에게 일치된 '영재성'의 정의를 요구하는 것 자체가 학문의 과학적인 발전에 대한 (ㄱ)이자 학자의 (ㄴ)임","choices":["ㄱ: 기여, ㄴ: 헌신","ㄱ: 도전, ㄴ: 책임","ㄱ: 필수조건, ㄴ: 의무","ㄱ: 오만, ㄴ: 독선","ㄱ: 겸손, ㄴ: 성찰"],"answer":4,"explain":"교안: '오만이자 학자의 독선임'.","source":{"page":18,"section":"02. 영재성의 과학적 연구방법 - 영재성에 대한 개념, 정의가 어려운 이유","quote":"학문의 과학적인 발전에 대한 오만이자 학자의 독선임"}}]},{"lesson":10,"title":"국가마다 영재성은 왜 다를까?","file":"4. 교안 (1~30)/10.pdf","summary":["「영재교육진흥법」(2000) 제2조: \"영재\"란 재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 특별한 교육이 필요한 사람","제5조 영재교육 대상자 선정 영역: 1. 일반 지능 2. 특수 학문적성 3. 창의적 사고능력 4. 예술적 재능 5. 신체적 재능 6. 그 밖의 특별한 재능","영재·신동·천재·수재 등 다양한 용어를 '영재(英才)'로 통일 / 영재성은 인간의 능력 영역, 재능은 성취 영역에 적용된다고 구분하는 학자도 있음","영재성 = 타고난 잠재력을 영재교육으로 계발, 서비스 없으면 조기에 사장 / '유전 vs 환경' 논쟁 / 에디슨 \"영재는 1%의 영감과 99%의 노력\", 자수성가(self-made man)","미국 1988년 「영재교육법(Gifted and Talented Student Education Act, P.L.100-297)」: 지능, 창의성, 예술성, 리더십, 특수한 학문영역 / 2005년 의회 재승인 확대 / 우수성법안(2022.4.27) 10억→20억 달러","영국: 이튼칼리지 등 사립학교 중심 → 정부 필요성 없었음 → 2001년 공립학교 영재교육 본격 실시 → 2007년 '과학기술고등교육부' 신설 / 영재 = 학업, 예술, 스포츠 모든 분야","영국: 상위 2% '예외적으로 유능한 학생(Exceptionally able pupils)', 상위 5% '매우 유능한 학생(Very able pupils)' / '현재의 성취'보다 '미래의 잠재력' 강조","이스라엘: 인문과학과 자연과학 분야의 지적·학문적 능력, 영어·수학·과학 등 주요 과목의 학문적 정의, 과학기술 인재 → 국가경쟁력","싱가포르: 상위 1% '지능이 뛰어난 학생(intellectually gifted)', 영재교육 6대 목표(고등사고능력, 창의적 생산능력, 자기주도적 생애학습, 자아개념과 자기성취 포부, 사회적 양심과 봉사, 지도자적 자질)","홍콩: 2000년 이전 형평성 원리 → 2000년 '영재교육정책' 수립 → 2007년 '영재교육 아카데미' 설립 / 6영역(지능, 특수 학업적성, 창의적 사고, 시각과 공연예술, 자연적 리더십, 정신운동 능력)","비교표: 리더십 X = 한국·영국·이스라엘 / 정신운동 X = 미국(1996년 제외)·이스라엘 / 이스라엘 창의성·시각공연예술 X / 싱가포르 △ = 특수 학문적성·시각공연예술·정신운동 / 홍콩 전 영역 ○ / 영국·홍콩 = 다중지능이론 중심"],"questions":[{"id":"10-01","type":"빈칸","q":"다음은 「영재교육진흥법」 제2조의 영재 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"\"영재\"란 재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 (   )이/가 필요한 사람을 말한다.","choices":["일반 교육","속진 교육","특별한 교육","영재 상담","개별 지도"],"answer":3,"explain":"영재교육진흥법 제2조(정의): 타고난 잠재력을 계발하기 위하여 '특별한 교육'이 필요한 사람.","source":{"page":3,"section":"01. 우리나라, 미국, 영국의 영재성의 정의 - 영재의 법적 정의가 내포한 의미","quote":"\"영재\"란 재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 특별한 교육이 필요한 사람을 말한다."}},{"id":"10-02","type":"개념 찾기","q":"우리나라 영재교육 기본법인 「영재교육진흥법」의 제정 연도로 교안에 제시된 것은?","box":null,"choices":["2000년","1988년","2001년","2007년","1996년"],"answer":1,"explain":"영재교육기본법인 「영재교육진흥법」(2000). ② 1988년 미국 영재교육법 ③ 2001년 영국 공립학교 영재교육 본격 실시 ④ 2007년 영국 과학기술고등교육부·홍콩 영재교육 아카데미 ⑤ 1996년 미국 '정신운동능력' 제외.","source":{"page":3,"section":"01. 우리나라, 미국, 영국의 영재성의 정의 - 영재의 법적 정의가 내포한 의미","quote":"영재교육기본법인 「영재교육진흥법」(2000)에서 밝힌 영재의 법적 정의"}},{"id":"10-03","type":"옳지 않은 것","q":"「영재교육진흥법」 제5조(영재교육 대상자의 선정)에 제시된 영역이 아닌 것은?","box":null,"choices":["일반 지능","특수 학문적성","창의적 사고능력","신체적 재능","리더십"],"answer":5,"explain":"제5조 영역: 일반 지능, 특수 학문적성, 창의적 사고능력, 예술적 재능, 신체적 재능, 그 밖의 특별한 재능. 리더십은 포함되지 않는다(비교표에서도 한국 리더십 X).","source":{"page":7,"section":"01. 우리나라, 미국, 영국의 영재성의 정의 - 영재교육 대상자 선정 및 규정","quote":"‣ 일반 지능 ‣ 특수 학문적성 ‣ 창의적 사고능력 ‣ 예술적 재능 ‣ 신체적 재능 ‣ 기타 특별한 재능"}},{"id":"10-04","type":"옳은 것","q":"영재의 법적 정의가 내포한 의미에 대한 설명으로 옳은 것은?","box":null,"choices":["그동안 다양한 용어로 불리던 사람을 '천재(天才)'라는 용어로 통일하였다.","그동안 영재, 신동, 천재, 수재 등 다양한 용어로 불리던 사람을 '영재(英才)'라는 용어로 통일하였다.","모든 연구자는 영재, 신동, 천재를 구분하지 않는다.","법적으로 '수재(秀才)'라는 용어를 공식 사용한다.","신동(神童)은 영재보다 상위의 법적 용어이다."],"answer":2,"explain":"영재(英才), 신동(神童), 천재(天才), 수재(秀才) 등 다양한 용어를 '영재(英才)'로 통일하였다. 다만 수행능력 수준, 심리적 특성의 차이 등으로 영재, 신동, 천재를 구분하려는 연구자도 있다(③ 틀림).","source":{"page":4,"section":"01. 우리나라, 미국, 영국의 영재성의 정의 - 영재의 법적 정의가 내포한 의미","quote":"그동안 영재(英才), 신동(神童), 천재(天才), 수재(秀才) 등 다양한 용어로 불리던 사람을 '영재(英才)'라는 용어로 통일"}},{"id":"10-05","type":"빈칸","q":"다음 (ㄱ), (ㄴ)에 들어갈 말로 알맞은 것은?","box":"영재아와 재능아를 구분하여 영재성은 인간의 (ㄱ) 영역에 적용되고, 재능은 (ㄴ) 영역에 적용된다고 구분하는 학자도 있음","choices":["ㄱ: 성취, ㄴ: 능력","ㄱ: 정의, ㄴ: 인지","ㄱ: 환경, ㄴ: 유전","ㄱ: 능력, ㄴ: 성취","ㄱ: 사회, ㄴ: 정서"],"answer":4,"explain":"영재성은 인간의 능력 영역, 재능은 성취 영역에 적용된다고 구분하는 학자도 있다(The gifted = 천부적으로 타고난, 재능이 있는).","source":{"page":5,"section":"01. 우리나라, 미국, 영국의 영재성의 정의 - 영재의 법적 정의가 내포한 의미","quote":"영재아와 재능아를 구분하여 영재성은 인간의 능력 영역에 적용되고, 재능은 성취 영역에 적용된다고 구분하는 학자도 있음"}},{"id":"10-06","type":"옳지 않은 것","q":"'영재성은 타고난 잠재력을 영재교육으로 계발함을 의미'한다는 내용에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["특별한 교육적 서비스가 제공되지 않더라도 영재성은 자연스럽게 발견되고 계발된다.","영재는 천부적으로 타고난(The Gifted) 사람이다.","영재의 잠재력 계발을 위해 일반적인 정규학교 교육과정 이외에도 '영재교육'이라는 특별한 교육적 서비스가 제공되어야 한다.","교육적 서비스가 제공되지 않으면 영재가 지닌 영재성조차 발견하지 못한 채 조기에 사장된다.","이는 '유전 vs 환경'의 끊임없는 논쟁과 같다."],"answer":1,"explain":"교안은 교육적 서비스가 제공되지 않으면 영재나 주변 사람들이 영재성조차 발견하지 못한 채 조기에 사장된다고 하였다(① 틀림).","source":{"page":6,"section":"01. 우리나라, 미국, 영국의 영재성의 정의 - 타고난 잠재력을 영재교육으로 계발","quote":"이러한 교육적 서비스가 제공되지 않으면, 영재나 주변의 사람들은 영재가 지닌 영재성조차 발견하지 못한 채 조기에 사장됨"}},{"id":"10-07","type":"개념 찾기","q":"교안에서 \"영재는 1%의 영감과 99%의 노력\"이라는 말을 한 인물로 소개된 사람은?","box":null,"choices":["루이스 터만","렌줄리","토머스 에디슨","로버트 스턴버그","홀링워스"],"answer":3,"explain":"\"영재는 1%의 영감과 99%의 노력\"(토머스 에디슨) – 자수성가(self-made man)를 더 높이 평가하기도 함('유전 vs 환경' 논쟁).","source":{"page":6,"section":"01. 우리나라, 미국, 영국의 영재성의 정의 - 타고난 잠재력을 영재교육으로 계발","quote":"\"영재는 1%의 영감과 99%의 노력\"(토머스 에디슨) 자수성가(self-made man)를 더 높이 평가하기도 함"}},{"id":"10-08","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"1988년 「영재교육법(Gifted and Talented 1978년 ④ 홍콩 2007년 ⑤ 미국 1990년(NRC).","source":{"page":10,"section":"01. 우리나라, 미국, 영국의 영재성의 정의 - 영국의 영재성의 정의","quote":"2007년 인재 육성을 위한 \"과학기술고등교육부\"를 신설하여 영재교육에 박차를 가함"}},{"id":"10-13","type":"옳은 것","q":"영국의 영재 구분에 대한 설명으로 옳은 것은?","box":null,"choices":["상위 1%는 \"예외적으로 유능한 학생\", 상위 3%는 \"매우 유능한 학생\"이다.","상위 2%는 \"예외적으로 유능한 학생(Exceptionally able pupils)\", 상위 5%는 \"매우 유능한 학생(Very able pupils)\"이다.","상위 2%는 \"매우 유능한 학생(Very able pupils)\", 상위 5%는 \"예외적으로 유능한 학생\"이다.","상위 1%의 \"지능이 뛰어난 학생(intellectually gifted)\"만 영재로 규정한다.","상위 15%를 모두 영재로 규정한다."],"answer":2,"explain":"영국은 상위 2% = 예외적으로 유능한 학생(Exceptionally able pupils), 상위 5% = 매우 유능한 학생(Very able pupils)으로 구분한다. ③ 뒤바뀜 ④ 싱가포르.","source":{"page":11,"section":"01. 우리나라, 미국, 영국의 영재성의 정의 - 영국의 영재성의 정의","quote":"상위 2%는 \"예외적으로 유능한 학생(Exceptionally able pupils)\" 상위 5%는 \"매우 유능한 학생(Very able pupils)\""}},{"id":"10-14","type":"빈칸","q":"다음은 영국의 영재 선발에 대한 설명이다. (ㄱ), (ㄴ)에 들어갈 말로 알맞은 것은?","box":"영재 선발을 시험결과, 교사, 부모, 친구들의 추천, 성취 포트폴리오 등을 활용하고 선발과정에서 중요하게 여기는 것은 적절한 지원과 제공으로 얻어진 \"(ㄱ)\"보다 \"(ㄴ)\"을 보여주는 증거를 더욱 강조","choices":["ㄱ: 미래의 잠재력, ㄴ: 현재의 성취","ㄱ: 시험결과, ㄴ: 추천","ㄱ: 지능, ㄴ: 창의성","ㄱ: 교사 추천, ㄴ: 부모 추천","ㄱ: 현재의 성취, ㄴ: 미래의 잠재력"],"answer":5,"explain":"영국은 \"현재의 성취\"보다 \"미래의 잠재력\"을 보여주는 증거를 더욱 강조한다.","source":{"page":11,"section":"01. 우리나라, 미국, 영국의 영재성의 정의 - 영국의 영재성의 정의","quote":"적절한 지원과 제공으로 얻어진 \"현재의 성취\"보다 \"미래의 잠재력\"을 보여주는 증거를 더욱 강조"}},{"id":"10-15","type":"옳은 것","q":"이스라엘의 영재성 정의에 대한 설명으로 옳은 것은?","box":null,"choices":["예술과 체육 분야의 재능을 중심으로 정의한다.","리더십과 정신운동 능력을 핵심 영역으로 포함한다.","전체 학생의 상위 1%를 '지능이 뛰어난 학생'으로 규정한다.","인문과학과 자연과학 분야에서 아동의 지적 혹은 특별한 학문적 능력과 관련된 영재성을 의미한다.","다중지능이론을 중심으로 정의한다."],"answer":4,"explain":"이스라엘: 인문과학과 자연과학 분야의 지적·학문적 능력, 영어·수학·과학 등 주요 과목의 학문적 정의, 과학기술 인재 육성으로 국가경쟁력 강화. ② 리더십·정신운동 X ③ 싱가포르 ⑤ 영국·홍콩.","source":{"page":13,"section":"02. 이스라엘, 싱가포르, 홍콩의 영재성의 정의 - 이스라엘의 영재성의 정의","quote":"인문과학과 자연과학 분야에서 아동의 지적 혹은 특별한 학문적 능력과 관련된 영재성을 의미함"}},{"id":"10-16","type":"옳지 않은 것","q":"싱가포르 교육부의 영재교육 6대 목표에 해당하지 않는 것은?","box":null,"choices":["탁월한 운동이나 기계기술 등 정신운동 능력의 계발","창의적 생산능력 계발","자기주도적 생애학습에 필요한 사고능력과 태도 계발","사회적 양심과 사회에 헌신적으로 봉사하려는 태도 신장","지도자적 자질 함양"],"answer":1,"explain":"싱가포르 6대 목표: 고등사고능력 계발, 창의적 생산능력 계발, 자기주도적 생애학습 사고능력과 태도 계발, 자아개념과 자기성취 포부 신장, 사회적 양심과 봉사 태도 신장, 지도자적 자질 함양. ① 정신운동 능력(탁월한 운동이나 기계기술 등)은 홍콩의 영역이다.","source":{"page":14,"section":"02. 이스라엘, 싱가포르, 홍콩의 영재성의 정의 - 싱가포르의 영재성의 정의","quote":"‣ 창의적 생산능력 계발 ‣ 자기주도적 생애학습에 필요한 사고능력과 태도 계발 ‣ 학생의 자아개념과 자기성취에 대한 포부 신장 ‣ 사회적 양심과 사회에 헌신적으로 봉사하려는 태도 신장 ‣ 지도자적 자질 함양"}},{"id":"10-17","type":"개념 찾기","q":"싱가포르가 영재로 규정하는 전체 학생의 상위 1%에 해당하는 학생을 가리키는 표현은?","box":null,"choices":["Exceptionally able pupils","Very able pupils","지능이 뛰어난 학생(intellectually gifted)","The Gifted \u0026 Talented","self-made man"],"answer":3,"explain":"싱가포르는 전체 학생의 상위 1%에 해당되는 '지능이 뛰어난 학생(intellectually gifted)'을 영재로 규정한다. ①② 영국의 상위 2%, 5% 구분.","source":{"page":14,"section":"02. 이스라엘, 싱가포르, 홍콩의 영재성의 정의 - 싱가포르의 영재성의 정의","quote":"싱가포르는 전체 학생의 상위 1%에 해당되는 '지능이 뛰어난 학생(intellectually gifted)'을 영재로 규정"}},{"id":"10-18","type":"옳은 것","q":"홍콩의 영재교육에 대한 설명으로 옳은 것은?","box":null,"choices":["1990년 '영재교육정책'을 수립하였다.","2007년 영재학생과 교사, 학부모를 위한 '영재교육 아카데미'를 설립하여 영재교육을 활성화하였다.","2000년 이후 형평성의 원리를 강조하였다.","2001년 공립학교에서 영재교육을 본격적으로 실시하였다.","2007년 '과학기술고등교육부'를 신설하였다."],"answer":2,"explain":"홍콩: 2000년 이전까지 형평성의 원리 강조 → 2000년 '영재교육정책' 수립 → 2007년 '영재교육 아카데미' 설립. ① 2000년 ③ 2000년 이전 ④⑤ 영국.","source":{"page":15,"section":"02. 이스라엘, 싱가포르, 홍콩의 영재성의 정의 - 홍콩의 영재성의 정의","quote":"2000년 이전까지는 형평성의 원리 강조 2000년 '영재교육정책'을 수립함 2007년 영재학생과 교사, 학부모를 위한 '영재교육 아카데미'를 설립하여 영재교육을 활성화"}},{"id":"10-19","type":"옳지 않은 것","q":"홍콩의 영재성 정의에 포함된 영역이 아닌 것은?","box":null,"choices":["측정된 높은 수준의 지능","창의적 사고","공통 목적 달성을 위해 타인을 지도할 수 있는 자연적 리더십","정신운동 능력(탁월한 운동이나 기계기술 등)","사회적 양심과 사회에 헌신적으로 봉사하려는 태도"],"answer":5,"explain":"홍콩 영역: 측정된 높은 수준의 지능, 특수 학업적성, 창의적 사고, 시각과 공연예술의 탁월한 재능, 자연적 리더십, 정신운동 능력. ⑤는 싱가포르 영재교육 6대 목표이다.","source":{"page":15,"section":"02. 이스라엘, 싱가포르, 홍콩의 영재성의 정의 - 홍콩의 영재성의 정의","quote":"‣ 측정된 높은 수준의 지능 ‣ 특수 학업적성 ‣ 창의적 사고 ‣ 시각과 공연예술의 탁월한 재능 ‣ 공통 목적 달성을 위해 타인을 지도할 수 있는 자연적 리더십 ‣ 정신운동 능력(탁월한 운동이나 기계기술 등)"}},{"id":"10-20","type":"보기 조합","q":"국가별 영재성의 정의 비교표에서 '리더십'이 X(포함되지 않음)로 표시된 국가를 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 한국\nㄴ. 미국\nㄷ. 영국\nㄹ. 이스라엘","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"비교표의 리더십: 한국 X, 미국 ○, 영국 X, 이스라엘 X, 싱가포르 ○, 홍콩 ○. 따라서 ㄱ, ㄷ, ㄹ.","source":{"page":16,"section":"02. 이스라엘, 싱가포르, 홍콩의 영재성의 정의 - 국가별 영재성의 정의 비교표","quote":"리더십 X ○ X X ○ ○"}},{"id":"10-21","type":"옳은 것","q":"국가별 영재성의 정의 비교표에 대한 설명으로 옳은 것은?","box":null,"choices":["미국은 1996년 '정신운동 능력'을 제외하였다.","이스라엘은 창의성을 영재성 영역에 포함한다(○).","싱가포르는 리더십이 X로 표시되어 있다.","한국은 리더십이 ○로 표시되어 있다.","홍콩은 정신운동 능력이 X로 표시되어 있다."],"answer":1,"explain":"미국 비고: 1996년 '정신운동 능력' 제외(정신운동 능력 X). ② 이스라엘 창의성 X ③ 싱가포르 리더십 ○ ④ 한국 리더십 X ⑤ 홍콩은 모든 영역 ○.","source":{"page":16,"section":"02. 이스라엘, 싱가포르, 홍콩의 영재성의 정의 - 국가별 영재성의 정의 비교표","quote":"비고 • 1996년 '정신운동능력' 제외"}},{"id":"10-22","type":"옳은 것","q":"국가별 영재성의 정의 비교표의 비고란에서 '다중지능이론 중심'으로 표시된 두 나라는?","box":null,"choices":["한국, 미국","영국, 홍콩","이스라엘, 싱가포르","미국, 영국","싱가포르, 홍콩"],"answer":2,"explain":"비고: 미국 = 1996년 '정신운동능력' 제외, 영국 = 다중지능이론 중심, 이스라엘 = 지적, 학문적 능력 강조, 싱가포르 = 상위 1%의 지능이 뛰어난 학생, 홍콩 = 다중지능이론 중심. 한국 기타 = 특별한 재능을 추가.","source":{"page":16,"section":"02. 이스라엘, 싱가포르, 홍콩의 영재성의 정의 - 국가별 영재성의 정의 비교표","quote":"•다중지능이론 중심 / •다중지능이론 중심"}},{"id":"10-23","type":"개념 찾기","q":"국가별 영재성의 정의 비교표에서 6개 영역(일반적인 지적 능력, 특수 학문 적성, 창의성, 시각/공연예술, 리더십, 정신운동 능력)이 모두 ○로 표시된 국가는?","box":null,"choices":["한국","미국","홍콩","영국","싱가포르"],"answer":3,"explain":"홍콩은 6개 영역 모두 ○. ① 한국 리더십 X ② 미국 정신운동 X ④ 영국 리더십 X ⑤ 싱가포르는 특수 학문적성·시각/공연예술·정신운동 능력이 △.","source":{"page":16,"section":"02. 이스라엘, 싱가포르, 홍콩의 영재성의 정의 - 국가별 영재성의 정의 비교표","quote":"일반적인 지적능력 ○ ○ ○ ○ ○ ○ / 특수학문적성 ○ ○ ○ ○ △ ○ 창의성 ○ ○ ○ X ○ ○ 시각/공연예술 ○ ○ ○ X △ ○ 리더십 X ○ X X ○ ○ 정신운동능력 ○ X ○ X △ ○"}}]},{"lesson":11,"title":"학자들은 영재성을 어떻게 정의할까?","file":"4. 교안 (1~30)/11.pdf","summary":["우리나라에서 \"영재\"란 재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 특별한 교육이 필요한 사람 / 영재성의 개념과 정의는 시대적, 사회문화적, 국가적인 상황에 따라 다름 (심리적 특성: 인지적 능력·정의적 특성·사회적 특성)","영재교육대상자 선정 영역: 일반 지능, 특수 학문적성, 창의적 사고능력, 예술적 재능, 신체적 재능, 그 밖의 특별한 재능","창의성 = 개인의 인지적 능력과 정의적 특성 간의 상호작용을 통해 새롭고 가치 있는 아이디어나 산출물을 만드는 능력 → 새로움(novelty)과 적절성(appropriateness)을 갖추어야 함","스턴버그의 성공지능: 지금까지는 분석지능이 우수한 사람이 성공 → 미래사회는 창의적 지능이 뛰어난 사람이 필요한 시대","재능 = 어떤 일을 하는 데 필요한 타고난 재주와 능력 / 영재(The gifted \u0026 talented)에서 최근에는 the gifted로 더 많이 사용","가네(Gagné)의 영재성과 재능의 차별화 모형: 능력의 영역과 수행의 분야를 이분법적으로 나눔 → '영재성' = 하나 이상의 영역에서 평균 이상의 능력, '재능' = 하나 이상의 분야에서 평균 이상의 뛰어난 수행 / 촉매: 개인 내적(자기관리, 인식, 동기와 의지)·환경적(사회문화적 환경, 인간, 규정, 사건), 발달과정, 우연 혹은 기회","가네: '잠재된 vs 발현된' / '유전 vs 환경'의 이슈와 같은 논쟁, 최근 많은 학자들은 영재성과 재능을 크게 구분하지 않음","터만(Terman): 영재교육의 아버지(미국), 1922년 비네-시몬 지능검사를 미국판으로 표준화하여 스탠포드-비네 검사 개발, IQ 135 이상 1,528명 50여 년 종단연구 → 롬브로소(Lombroso)의 '영재 퇴화' 주장 반증","터만 연구 결과: IQ 140 이상 어린이 형제의 평균 IQ 약 123, 영재아는 사회적 부적응 없음·건강과 체격 약간 우월, 잠재력의 성공 여부는 양육 요인에 달려 있음","홀링워스(Hollingworth): 영재교육의 어머니(미국), 일반 지능 상위 1% 아동, 미국 동부 자퇴자 4명 중 1명은 영재, 인지 발달이 먼저 이루어져 사회적·정서적 문제 → 정서학습 강조, 영재의 정서교육에 공헌","렌줄리(Renzulli) 세 고리 모형: 평균 이상의 지적 능력·과제 집착력·창의성 / 세 요소 모두 상위 15% 이내 + 그중 한 가지 상위 2% 안 → 영재, 공통부분이 클수록 영재성도 큼","스턴버그 오각형의 암묵적 이론(↔명시적 이론): 수월성, 희귀성, 검증 가능성, 생산성, 가치의 5가지 기준"],"questions":[{"id":"11-01","type":"빈칸","q":"다음은 우리나라의 '영재'에 대한 정의이다. (   )에 들어갈 말로 알맞은 것은?","box":"우리나라에서 \"영재\"란 재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 (   )이 필요한 사람","choices":["개별 상담","특별한 교육","조기 진학","심화 평가","가정의 지원"],"answer":2,"explain":"교안은 우리나라에서 \"영재\"란 재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 '특별한 교육'이 필요한 사람이라고 정의한다. 나머지(개별 상담, 조기 진학, 심화 평가, 가정의 지원)는 정의 문장에 없는 표현이다.","source":{"page":3,"section":"영재성(The giftedness) - 영재가 지닌 심리적인 특성","quote":"우리나라에서 \"영재\"란 재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 특별한 교육이 필요한 사람"}},{"id":"11-02","type":"옳지 않은 것","q":"교안에서 설명한 영재성(The giftedness)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["영재가 지닌 심리적인 특성으로 인지적 능력이 있다.","영재가 지닌 심리적인 특성으로 정의적 특성이 있다.","영재가 지닌 심리적인 특성으로 사회적 특성이 있다.","영재성의 개념과 정의는 시대나 국가에 관계없이 동일하게 적용된다.","우리나라에서 영재란 재능이 뛰어난 사람으로서 타고난 잠재력을 계발하기 위하여 특별한 교육이 필요한 사람이다."],"answer":4,"explain":"교안은 '시대적, 사회문화적, 국가적인 상황에 따라 영재성의 개념과 정의가 다름'이라고 했으므로 ④는 틀리다. ①②③ 영재의 심리적 특성은 인지적 능력/정의적 특성/사회적 특성이다. ⑤ 우리나라의 영재 정의 그대로이다.","source":{"page":3,"section":"영재성(The giftedness) - 영재가 지닌 심리적인 특성","quote":"인지적 능력/ 정의적 특성/ 사회적 특성 시대적, 사회문화적, 국가적인 상황에 따라 영재성의 개념과 정의가 다름"}},{"id":"11-03","type":"보기 조합","q":"\u003c보기\u003e에서 교안에 제시된 '영재교육대상자의 선정' 영역에 해당하는 것을 모두 고른 것은?","box":"ㄱ. 일반 지능\nㄴ. 특수 학문적성\nㄷ. 신체적 재능\nㄹ. 학업 성적 순위","choices":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ","ㄱ, ㄷ, ㄹ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"explain":"영재교육대상자 선정 영역은 일반 지능, 특수 학문적성, 창의적 사고능력, 예술적 재능, 신체적 재능, 그 밖의 특별한 재능이다. ㄹ '학업 성적 순위'는 교안의 선정 영역에 없다. 따라서 ㄱ, ㄴ, ㄷ이 정답이다.","source":{"page":4,"section":"영재성(The giftedness) - 영재교육대상자의 선정","quote":"일반 지능 ‣ 특수 학문적성 ‣ 창의적 사고능력 ‣ 예술적 재능 ‣ 신체적 재능 ‣ 그 밖의 특별한 재능"}},{"id":"11-04","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"창의성은 새로움(novelty)과 (   )을 갖추어야 함","choices":["유창성(fluency)","정교성(elaboration)","독창성(originality)","융통성(flexibility)","적절성(appropriateness)"],"answer":5,"explain":"교안은 창의성이 새로움(novelty)과 적절성(appropriateness)을 갖추어야 한다고 설명한다. 나머지 선지는 이 문장에 제시되지 않은 용어이다.","source":{"page":5,"section":"창의성","quote":"창의성은 새로움(novelty)과 적절성(appropriateness)을 갖추어야 함"}},{"id":"11-05","type":"개념 찾기","q":"다음 설명에 해당하는 개념은?","box":"개인의 인지적 능력과 정의적 특성 간의 상호작용을 통해서 새롭고 가치 있는 아이디어나 산출물을 만드는 능력","choices":["영재성","재능","창의성","성공지능","과제집착력"],"answer":3,"explain":"교안의 창의성 정의이다. ② 재능은 '어떤 일을 하는 데 필요한 타고난 재주와 능력', ④ 성공지능은 스턴버그의 개념, ⑤ 과제집착력은 렌줄리 세 고리 모형의 한 요소이다.","source":{"page":5,"section":"창의성","quote":"창의성이란 개인의 인지적 능력과 정의적 특성 간의 상호작용을 통해서 새롭고 가치 있는 아이디어나 산출물을 만드는 능력"}},{"id":"11-06","type":"옳은 것","q":"스턴버그(Sternberg)의 성공지능(Successful Intelligence)에 대한 설명으로 옳은 것은?","box":null,"choices":["렌줄리가 영재성의 세 고리 모형을 설명하기 위해 제시한 개념이다.","미래사회는 창의적 지능이 뛰어난 사람이 필요한 시대가 될 것이라고 보았다.","지금까지는 창의적 지능이 우수한 사람이 성공해 왔다고 보았다.","미래사회에는 분석지능이 더욱 중요해질 것이라고 보았다.","가네가 영재성과 재능을 구분하기 위해 제시한 개념이다."],"answer":2,"explain":"성공지능은 스턴버그의 개념으로, '지금까지는 분석지능이 우수한 사람이 성공함', '미래사회는 창의적 지능이 뛰어난 사람이 필요한 시대가 될 것임'이라고 했다. ①⑤ 학자가 다르다. ③ 지금까지 성공한 사람은 분석지능 우수자이다. ④ 미래사회는 창의적 지능이 중요하다.","source":{"page":6,"section":"창의성 - 스턴버그(Sternberg)의 성공지능","quote":"지금까지는 분석지능이 우수한 사람이 성공함 ‣ 미래사회는 창의적 지능이 뛰어난 사람이 필요한 시대가 될 것임"}},{"id":"11-07","type":"옳지 않은 것","q":"영재성과 창의성의 관계에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["렌줄리의 영재성의 세 고리 모형에서 사회에서 뛰어난 공헌을 한 영재들의 세 가지 특성 중 창의성이 중요하다.","렌줄리의 세 고리는 지적능력, 과제집착력, 창의성이다.","우리나라를 비롯한 많은 나라에서 '창의적이고 생산적인 사고능력'을 영재성의 본질 중 하나로 포함한다.","영재교육대상자 선발에서 창의성 검사와 창의적 문제해결력이 많은 비중을 차지한다.","영재교육대상자 선발에서는 창의성보다 지능검사 점수만을 기준으로 삼는다."],"answer":5,"explain":"교안은 '창의적이고 생산적인 사고능력'을 영재성의 본질 중 하나로 포함하고, 이에 따라 영재교육대상자 선발에서도 창의성 검사와 창의적 문제해결력이 많은 비중을 차지한다고 했다. 따라서 ⑤는 틀리다. ①~④는 교안 내용 그대로이다.","source":{"page":7,"section":"영재성과 창의성 - 렌줄리(Renzulli)의 영재성의 세 고리 모형","quote":"이에 따라 영재교육대상자 선발에서도 창의성 검사와 창의적 문제해결력이 많은 비중을 차지"}},{"id":"11-08","type":"개념 찾기","q":"다음 설명에 해당하는 개념은?","box":"어떤 일을 하는 데 필요한 타고난 재주와 능력","choices":["재능","영재성","창의성","과제집착력","성공지능"],"answer":1,"explain":"교안은 재능을 '어떤 일을 하는 데 필요한 타고난 재주와 능력'으로 설명한다. 또한 영재(The gifted \u0026 talented)에서 최근에는 the gifted로 더 많이 사용한다. ③ 창의성은 새롭고 가치 있는 아이디어나 산출물을 만드는 능력이다.","source":{"page":8,"section":"재능","quote":"어떤 일을 하는 데 필요한 타고난 재주와 능력 영재(The gifted \u0026 talented)에서 최근에는 the gifted로 더 많이 사용"}},{"id":"11-09","type":"옳지 않은 것","q":"가네(Gagné)의 영재성과 재능에 대한 의문 제기와 관련된 설명으로 옳지 않은 것은?","box":null,"choices":["지금까지 영재성에 대한 연구의 대부분이 재능과의 구분이 불명확하였다.","영재성과 재능은 구분되어야 할 별개의 개념이다.","최근 많은 학자들은 영재성과 재능을 엄격하게 구분하고 있다.","'잠재된 vs 발현된' 이슈와 같은 논쟁이다.","'유전 vs 환경'의 이슈와 같은 논쟁이다."],"answer":3,"explain":"교안은 '최근 많은 학자들은 영재성과 재능을 크게 구분하지 않음'이라고 했으므로 ③은 틀리다. ①②④⑤는 가네의 의문 제기 내용 그대로이다.","source":{"page":9,"section":"영재성과 재능에 대한 의문 제기 - 가네(Gagné)","quote":"‘잠재된 vs 발현된’ / ‘유전 vs 환경’의 이슈와 같은 논쟁 ‣ 최근 많은 학자들은 영재성과 재능을 크게 구분하지 않음"}},{"id":"11-10","type":"빈칸","q":"가네(Gagné)의 영재성과 재능의 차별화 모형에 대한 다음 설명에서 (ㄱ), (ㄴ)에 들어갈 말로 바르게 짝지은 것은?","box":"‘(ㄱ)’은 하나 이상의 영역에서 나타나는 평균 이상의 능력에 해당\n‘(ㄴ)’은 하나 이상의 분야에서 보이는 평균 이상의 뛰어난 수행에 해당","choices":["(ㄱ) 재능 - (ㄴ) 영재성",
