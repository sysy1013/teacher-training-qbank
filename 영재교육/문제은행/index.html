,{"id":"17-07","type":"옳은 것","q":"창의성의 투자이론에 대한 설명으로 옳은 것은?","box":null,"choices":["사람들은 여섯 가지 자원을 누구나 어느 정도 가지고 있으며, 자원들이 복합적으로 상호작용할 때 창의성이 극대화된다.","좋은 투자가는 대중의 의견을 따라 안전하게 투자한다는 비유로 창의성을 설명한다.","여섯 가지 자원은 소수의 영재만이 가지고 있다고 본다.","여섯 가지 자원 중 한 가지만 탁월하면 창의성이 극대화된다고 본다.","애머바일이 제시한 이론으로, 창의성의 요소모델이라고도 한다."],"answer":1,"explain":"① 교안 그대로의 설명이다. ② 좋은 투자가는 대중의 의견에 개의치 않고 과감히 투자한다. ③ 누구나 어느 정도 가지고 있다. ④ 자원들이 복합적으로 상호작용할 때 극대화된다. ⑤ 투자이론은 스턴버그와 루바트, 요소모델은 애머바일이다.","source":{"page":6,"section":"창의성 연구 동향 - 스턴버그와 루바트(Sternberg \u0026 Lubart)","quote":"사람들은 여섯 가지 자원(지적 능력, 지식, 사고방식, 인성, 동기, 환경)을 누구나 어느 정도 가지고 있으며, 이러한 자원들이 복합적으로 상호작용할 때 창의성이 극대화"}},{"id":"17-08","type":"개념 찾기","q":"'창의성은 어느 곳에 존재하는가'에 대한 체계이론을 제시하였으며, 몰입(FLOW)으로 유명한 학자는?","box":null,"choices":["애머바일(Amabile)","칙센트미하이(Csikszentmihalyi)","로데스(Rhodes)","스턴버그(Sternberg)","갤럽(Gallap)"],"answer":2,"explain":"체계이론과 몰입(FLOW)은 칙센트미하이(Csikszentmihalyi)다. ① 애머바일은 요소모델, ③ 로데스는 4P 이론, ④ 스턴버그는 루바트와 투자이론, ⑤ 갤럽은 창의적 사람의 전형에 대한 연구결과다.","source":{"page":7,"section":"창의성 연구 동향 - 칙센트미하이(Csikszentmihalyi)","quote":"창의성은 어느 곳에 존재하는가에 대한 체계이론 ‣ 몰입 FLOW으로 유명"}},{"id":"17-09","type":"개념 찾기","q":"칙센트미하이의 세 가지 창의성 체계 중 다음 설명에 해당하는 것은?","box":"개인의 창의적 아이디어를 평가하고 선택하는 사람들의 집합체","choices":["개인(individual) 체계","영역(domain) 체계","분야(field) 체계","환경(press) 체계","과정(process) 체계"],"answer":3,"explain":"분야(field) 체계는 개인의 창의적 아이디어를 평가하고 선택하는 사람들의 집합체다. ① 개인 체계는 정보를 변형·확장하는 역할, ② 영역 체계는 현재의 정보를 변형시켜 다음 세대에 전달하는 것과 관련된다. ④⑤는 칙센트미하이의 세 체계에 없다(Press·Process는 로데스 4P).","source":{"page":8,"section":"칙센트미하이의 세 가지 창의성 체계","quote":"분야(field) 체계: 이 체계는 개인의 창의적 아이디어를 평가하고 선택하는 사람들의 집합체"}},{"id":"17-10","type":"옳지 않은 것","q":"칙센트미하이의 세 가지 창의성 체계에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["개인(individual) 체계는 정보를 한 영역으로 이끌어야 하고, 인지적 과정 및 성격적 특징에 의해 정보를 변형, 확장시키는 역할을 한다.","영역(domain) 체계에서 창의적인 사람이란 현재의 정보를 변형시켜 이를 다음 세대에 전달하기 위해 끊임없이 노력하는 사람이다.","분야(field) 체계는 개인의 창의적 아이디어를 평가하고 선택하는 사람들의 집합체이다.","세 가지 체계는 개인, 영역, 분야로 구성된다.","창의성은 세 가지 체계 중 어느 하나만 충분히 갖추어져도 발휘된다."],"answer":5,"explain":"⑤ 교안은 창의성이 개인, 영역, 분야의 세 가지 체계가 '상호작용할 때 비로소' 발휘된다고 했다. ①②③④는 교안 내용과 일치한다.","source":{"page":8,"section":"칙센트미하이의 세 가지 창의성 체계","quote":"창의성은 개인, 영역, 분야의 세 가지 체계가 상호작용할 때 비로소 발휘됨"}},{"id":"17-11","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"로데스(Rhodes)는 (   ) 이후의 활발한 창의성 연구들을 정리·요약하면서 4P로 구분하였다.","choices":["토랜스","길포드","애머바일","칙센트미하이","월리스"],"answer":2,"explain":"로데스의 4P 이론은 길포드 이후의 활발한 창의성 연구들을 정리·요약한 것이다. ①③④⑤는 교안 해당 문장의 인물이 아니다.","source":{"page":9,"section":"로데스(Rhodes)의 창의성 4P 이론","quote":"길포드 이후의 활발한 창의성 연구들을 정리· 요약하면서 4P로 구분"}},{"id":"17-12","type":"옳지 않은 것","q":"로데스(Rhodes)의 창의성 4P 이론의 구성 요소에 해당하지 않는 것은?","box":null,"choices":["Product(창의적 산출물)","Person(창의적 인물의 특성)","Process(창의적 과정)","Press(창의적 환경)","Purpose(창의적 목적)"],"answer":5,"explain":"4P는 Product(창의적 산출물), Person(창의적 인물의 특성), Process(창의적 과정), Press(창의적 환경)이다. ⑤ Purpose는 4P에 없다.","source":{"page":9,"section":"로데스(Rhodes)의 창의성 4P 이론","quote":"창의적 산출물 Product / 창의적 인물의 특성 Person 창의적 과정 Process 창의적 환경 Press"}},{"id":"17-13","type":"개념 찾기","q":"로데스의 4P 중 다음 연구 내용에 해당하는 것은?","box":"창의성을 극대화할 수 있는 환경 조건(가정, 학교, 사회, 문화 등)에 대해 연구","choices":["Product","Person","Process","Press","Place"],"answer":4,"explain":"환경 조건(가정, 학교, 사회, 문화 등)에 대한 연구는 Press(창의적 환경)다. ① Product는 무엇이 창의적 산출물인가, ② Person은 창의적인 사람의 인성·특성·태도·가치, ③ Process는 창의적인 과정이 어떻게 이루어지는가에 대한 연구다. ⑤ Place는 4P에 없다.","source":{"page":10,"section":"로데스(Rhodes)의 창의성 4P 이론","quote":"Press 창의적 환경 • 창의성을 극대화할 수 있는 환경 조건(가정, 학교, 사회, 문화 등)에 대해 연구"}},{"id":"17-14","type":"보기 조합","q":"로데스의 창의성 4P 이론에 대한 설명으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. Product: 창의성 연구의 기본은 무엇이 창의적 산출물인가에 대한 연구이다.\nㄴ. Person: 창의적인 과정은 어떻게 이루어지는가에 대한 연구이다.\nㄷ. Person: 창의적인 사람의 인성, 특성, 태도, 가치 등에 대한 연구이다.\nㄹ. Process: 창의성을 극대화할 수 있는 환경 조건에 대한 연구이다.","choices":["ㄱ, ㄷ","ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],"answer":1,"explain":"ㄱ, ㄷ은 교안과 일치한다. ㄴ 창의적 과정이 어떻게 이루어지는가는 Process에 대한 연구다. ㄹ 환경 조건에 대한 연구는 Press다.","source":{"page":10,"section":"로데스(Rhodes)의 창의성 4P 이론","quote":"Product 창의적 산출물 • 창의성 연구의 기본은 무엇이 창의적 산출물인가에 대한 연구 / ‣ Person 창의적 인물의 특성 • 창의적인 사람의 인성, 특성, 태도, 가치 등에 대한 연구"}},{"id":"17-15","type":"옳은 것","q":"로데스의 4P 간 관계에 대한 설명으로 옳은 것은?","box":null,"choices":["4P는 서로 독립적이어서 각각 따로 연구해야 한다.","창의적인 환경이란 창의적인 사람이 창의적인 산출물을 통해 얻은 결과이다.","창의적인 산출물이란 창의적인 사람이 창의적인 과정을 통해 얻은 결과이며, 창의적인 환경의 지원을 받을 때 창의성이 최대로 발휘된다.","창의적인 과정은 창의적인 환경과 무관하게 최대로 발휘된다.","4P 중 창의적 인물의 특성(Person)만이 창의성 발휘를 결정한다."],"answer":3,"explain":"③ 교안은 4P가 서로 밀접하게 연결되어 있고, 창의적인 산출물은 창의적인 사람이 창의적인 과정을 통해 얻은 결과이며 창의적인 환경의 지원을 받을 때 창의성이 최대로 발휘된다고 했다. ① 서로 밀접하게 연결되어 있다. ② 결과로 얻는 것은 산출물이다. ④⑤ 환경의 지원과 4P의 연결을 강조하므로 틀리다.","source":{"page":11,"section":"로데스(Rhodes)의 창의성 4P 이론","quote":"4P가 서로 밀접하게 연결되어 있음 ‣ 창의적인 산출물이란 창의적인 사람이 창의적인 과정을 통해 얻은 결과 ‣ 이는 창의적인 환경에 의해 지원을 받을 때 창의성이 최대로 발휘됨"}},{"id":"17-16","type":"옳지 않은 것","q":"배런과 해링턴(Barron \u0026 Harrington)의 연구결과에서 제시한 창의적 영재의 특성으로 옳지 않은 것은?","box":null,"choices":["심미적 특성에 관한 관심, 광범위한 흥미","한 분야에 국한된 좁은 흥미와 타인 판단에 대한 의존","어려운 문제를 끝까지 해결하고자 하는 과제집착력","넘치는 활동 에너지","판단의 독립성, 자율성, 통찰력, 자신감, 개방성"],"answer":2,"explain":"② 교안은 '광범위한 흥미'와 '판단의 독립성'을 제시하므로 좁은 흥미와 타인 판단 의존은 반대 서술이다. ①③④⑤는 교안 내용이다.","source":{"page":13,"section":"창의적 영재의 특성 - 배런과 해링턴(Barron \u0026 Harrington)의 연구결과","quote":"심미적 특성에 관한 관심, 광범위한 흥미 ‣ 어려운 문제를 끝까지 해결하고자 하는 과제집착력 ‣ 넘치는 활동에너지 ‣ 판단의 독립성, 자율성, 통찰력, 자신감, 개방성"}},{"id":"17-17","type":"옳은 것","q":"칙센트미하이(Csikszentmihalyi)의 연구결과에서 창의적 성취에 도움이 되는 순서로 가장 먼저 제시된 것은?","box":null,"choices":["같은 필드의 인간관계, 가족","자신의 분야에 대한 흥미와 관심의 내적 동기","사회에 대한 관심, 다양한 흥미, 개방성","철저한 지식의 준비","독립성, 혼자만의 시간, 성실함"],"answer":1,"explain":"창의적 성취에 도움이 되는 순서는 같은 필드의 인간관계·가족 → 자신의 분야에 대한 흥미와 관심의 내적 동기 → 사회에 대한 관심·다양한 흥미·개방성 → 철저한 지식의 준비 → 독립성·혼자만의 시간·성실함 등이다. ②는 두 번째, ③ 세 번째, ④ 네 번째, ⑤ 마지막이다.","source":{"page":14,"section":"창의적 영재의 특성 - 칙센트미하이(Csikszentmihalyi)의 연구결과","quote":"창의적 성취에 도움이 되는 순서 • 같은 필드의 인간관계, 가족 • 자신의 분야에 대한 흥미와 관심의 내적동기 • 사회에 대한 관심, 다양한 흥미, 개방성 • 철저한 지식의 준비 • 독립성, 혼자만의 시간, 성실함 등"}},{"id":"17-18","type":"빈칸","q":"애머바일(Amabile)의 연구결과에 제시된 창의적 영재의 특성 중 (   )에 들어갈 말로 알맞은 것은?","box":"자기 절제 / 만족 유보(   ) / 인내력 / 쉽게 확정하지 않는 것","choices":["피그말리온 효과","호손 효과","마시멜로 효과","플린 효과","낙인 효과"],"answer":3,"explain":"애머바일은 창의적 영재의 특성으로 자기 절제, 만족 유보(마시멜로 효과), 인내력, 쉽게 확정하지 않는 것을 제시했다. ①②④⑤는 교안에 제시되지 않았다.","source":{"page":15,"section":"창의적 영재의 특성 - 애머바일(Amabile)의 연구결과","quote":"자기 절제 ‣ 만족 유보(마시멜로 효과) ‣ 인내력 ‣ 쉽게 확정하지 않는 것"}},{"id":"17-19","type":"옳은 것","q":"갤럽(Gallap)의 연구결과에서 미국 사람들이 첨단 지식을 주도하는 창의적 사람에 대해 가진 전형(stereo type)으로 옳은 것은?","box":null,"choices":["타인의 일에 적극적으로 협력한다.","사회적 책임을 가장 중시한다.","다양한 일에 두루 관심을 분산한다.","자기 일에만 몰두하고, 타인의 일이나 사회적 책임에는 무관심하다.","가족과 같은 필드의 인간관계를 가장 중시한다."],"answer":4,"explain":"갤럽 연구결과, 창의적 사람에 대한 전형은 자기 일에만 몰두하고 타인의 일이나 사회적 책임에는 무관심하다는 것이다. ①②③은 반대 서술이고, ⑤는 칙센트미하이의 연구결과(창의적 성취에 도움이 되는 순서)와 섞은 것이다.","source":{"page":16,"section":"창의적 영재의 특성 - 갤럽(Gallap)의 연구결과","quote":"미국 사람들이 첨단지식을 주도하는 창의적 사람에 대한 전형(stereo type)은 자기 일에만 몰두 ‣ 타인의 일이나 사회적 책임에는 무관심"}},{"id":"17-20","type":"빈칸","q":"애머바일과 헤네시(Amabile \u0026 Hennessey)의 연구결과에 대한 다음 (ㄱ), (ㄴ)에 들어갈 숫자로 알맞은 것은?","box":"창의성을 촉진시키는 (ㄱ)가지 요인, 창의성을 저하시키는 (ㄴ)가지 요인","choices":["ㄱ: 6, ㄴ: 9","ㄱ: 8, ㄴ: 5","ㄱ: 9, ㄴ: 6","ㄱ: 10, ㄴ: 6","ㄱ: 9, ㄴ: 4"],"answer":3,"explain":"창의성을 촉진시키는 요인은 9가지, 저하시키는 요인은 6가지다. ① 순서가 뒤바뀌었고 ②④⑤는 숫자가 다르다.","source":{"page":17,"section":"창의적인 영재의 환경은? - 애머바일과 헤네시(Amabile \u0026 Hennessey)의 연구결과","quote":"창의성을 촉진시키는 / 창의성을 저하시키는 / 9가지 요인 / 6가지 요인"}},{"id":"17-21","type":"옳은 것","q":"애머바일과 헤네시의 연구결과에서 창의성을 저하시키는 요인에 해당하는 것은?","box":null,"choices":["자유","격려","도전","긴장","경쟁"],"answer":5,"explain":"창의성을 저하시키는 6가지 요인은 평가될 것이라는 생각, 감시 감독, 외적 동기, 경쟁, 선택이 제한된 경우, 보상만을 추구다. ①자유 ②격려 ③도전 ④긴장은 모두 창의성을 촉진시키는 9가지 요인이다(특히 '긴장'이 촉진 요인임에 유의).","source":{"page":17,"section":"창의적인 영재의 환경은? - 애머바일과 헤네시(Amabile \u0026 Hennessey)의 연구결과","quote":"평가될 것이라는 생각 • 감시 감독 • 외적 동기 • 경쟁 • 선택이 제한된 경우 • 보상만을 추구"}},{"id":"17-22","type":"보기 조합","q":"애머바일과 헤네시의 연구결과에서 창의성을 촉진시키는 요인을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 충분한 시간\nㄴ. 외적 동기\nㄷ. 인정\nㄹ. 선택이 제한된 경우\nㅁ. 훌륭한 프로젝트 관리","choices":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄷ","ㄱ, ㄷ, ㅁ","ㄴ, ㄷ, ㄹ, ㅁ"],"answer":4,"explain":"촉진 9가지 요인은 자유, 훌륭한 프로젝트 관리, 충분한 자원, 격려, 다양한 조직의 특성, 인정, 충분한 시간, 도전, 긴장이므로 ㄱ, ㄷ, ㅁ이 해당한다. ㄴ 외적 동기와 ㄹ 선택이 제한된 경우는 창의성을 저하시키는 요인이다.","source":{"page":17,"section":"창의적인 영재의 환경은? - 애머바일과 헤네시(Amabile \u0026 Hennessey)의 연구결과","quote":"자유 • 훌륭한 프로젝트 관리 • 충분한 자원 • 격려 • 다양한 조직의 특성 • 인정 • 충분한 시간 • 도전 • 긴장"}}]},{"lesson":18,"title":"학교는 영재의 창의성을 어떻게 키울까?","file":"4. 교안 (1~30)/18.pdf","summary":["스턴버그와 루바트: 학교교육의 경직성이 학생들의 창의성을 억제 (위험 회피 교육, 실패는 처벌·잘한 일은 보상, 대학에서 도전적 과목보다 안전한 과목 신청, 학생들이 느낄 만한 위험을 배우지 못함 → 창의적인 일에 꼭 필요한 기술을 배우지 못함)","홀맨(Hallman): 창의성을 방해하는 학교의 장애물 = 학생과 교사 모두 순응 압력(규칙, 관례), 독특한 아이디어와 유머 무시, 외적 보상 지나치게 중시","아도르노(Adorno): 교사의 권위에 대한 실험, 400종 직업 수백 명 대상 → 경찰 1위, 군장교 2위, 교사 3위 / 교실에 들어간 교사는 최고의 권위, 교장·재단이사장에게 불만 표현 못하나 학생에게는 완벽한 복종 기대","토랜스(Torrance): 교사가 학생의 창의적 능력을 가르치려 하면 학생들의 통제권을 잃기 쉽다고 생각하는 경향이 높음","스턴버그와 그리고렌코: 예상치 못한 질문·엉뚱한 질문을 하는 학생은 권위적인 교사에게 지적당하거나 문제아로 낙인받을 가능성 높음","토랜스 교사 연수: 미교육부의 정책으로 프로그램 개발, 다년간 실제 교사 연수 실시 → 결과 성공적이지 않음","연수 실패원인: 교사의 성격과 신념이 교수방법 변화 거부, 잘못을 고쳐주고 비판하는 데 익숙, 독특한 대답에 적절한 보상 못함, 집단의 성공 중시 분위기, 창의성 활동은 가끔씩 제공·많은 시간 소비","교사들의 잘못된 신념: 엉뚱한 질문 부담, 창의적 문제해결능력은 몇몇 학생만의 선천적 능력, 창의적 학생은 대체로 비협조적, 창의성 높아지면 정상적 사회생활 어렵고 비협조적이 될 위험","교실환경 조성: 학생 의견 존중·표현 격려, 질문 후 충분한 시간 두고 기다림, 선생님 의견은 되도록 나중에, 다른 학생 아이디어 경청·발전 격려, 교사 자신이 창의적인 모델, 폐쇄형 \u003c 개방형 질문","미국 알트스쿨: 어린이-부모-교사 협력적 관계, 작은 집단 수업, 데이터 수집 기술 기반 개인별 맞춤화 학습 / 플레이리스트(과업 카드), 러닝 프로그레션(활동 및 학습 진도 및 결과 저장), 알트스쿨 스트림(학교-가정 커뮤니케이션 지원), 알트 비디오(행동 및 상호작용 기록)","네델란드 스티브잡스스쿨: 매일 학교 출석, 기기로 언제 어디서나 학습, 웹 기반 학습프로그램, 학부모는 애플리케이션으로 일과 확인, 학생은 포트폴리오·문서 보유","미국 퀀텀캠프: 수학과학교육 중점 서머캠프, '탐구기반학습' 후 디지털 콘텐츠로 개별 개념 탐구 / 미국 뉴비오스튜디오: 스튜디오(작업 공방) 개념 학교, 400여 명 고등학생이 130여 개 프로젝트 참여"],"questions":[{"id":"18-01","type":"개념 찾기","q":"'학교교육의 경직성이 학생들의 창의성을 억제'한다는 연구결과를 제시한 학자는?","box":null,"choices":["홀맨(Hallman)","아도르노(Adorno)","토랜스(Torrance)","스턴버그와 루바트(Sternberg \u0026 Lubart)","스턴버그와 그리고렌코(Sternberg \u0026 Grigorenko)"],"answer":4,"explain":"학교교육의 경직성이 창의성을 억제한다는 것은 스턴버그와 루바트의 연구결과다. ① 홀맨은 창의성을 방해하는 학교의 장애물, ② 아도르노는 교사의 권위에 대한 실험, ③ 토랜스는 교사들이 창의성을 격려하지 못하는 이유와 교사 연수, ⑤ 스턴버그와 그리고렌코는 교사가 학생의 창의성을 억제한다는 연구결과다.","source":{"page":3,"section":"학교가 창의성을 계발시키고 있는가? - 스턴버그와 루바트(Sternberg \u0026 Lubart)의 연구결과","quote":"학교교육의 경직성이 학생들의 창의성을 억제"}},{"id":"18-02","type":"옳지 않은 것","q":"스턴버그와 루바트의 연구결과에서 학교교육의 경직성에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["위험스러운 일은 회피하는 것이 바람직하다고 가르친다.","학교에서 어떤 일을 할 때 실패는 어떠한 방법으로든 처벌을 받게 되고 잘한 일들은 보상을 받는다.","대학에서 학생들은 안전한 과목보다는 도전적인 과목을 골라 신청한다.","학생들이 낮은 성적을 받아 보충수업에 참여하는 일은 어리석어 보이며 새로운 도전을 주저하게 한다.","학교에서의 도전은 명백하게 방해를 받는다."],"answer":3,"explain":"③ 교안은 대학에서 학생들이 '도전적인 과목보다는 안전한 과목을 골라 신청'한다고 했다(반대 서술). ①②④⑤는 교안 내용과 일치한다.","source":{"page":3,"section":"학교가 창의성을 계발시키고 있는가? - 스턴버그와 루바트(Sternberg \u0026 Lubart)의 연구결과","quote":"대학에서 학생들은 도전적인 과목보다는 안전한 과목을 골라 신청"}},{"id":"18-03","type":"빈칸","q":"다음 (   )에 공통으로 들어갈 말로 알맞은 것은?","box":"· (   )스러운 일은 회피하는 것이 바람직하다고 가르침\n· 학교 문화의 문제점들 중 하나는 학생들이 느낄 만한 (   )을 배우지 못한다는 것임\n· 즉, 창의적인 일을 할 때 꼭 필요한 기술을 배우지 못함","choices":["위험","실패","경쟁","협력","보상"],"answer":1,"explain":"스턴버그와 루바트는 학교가 위험스러운 일을 회피하도록 가르치고, 학생들이 느낄 만한 위험을 배우지 못해 창의적인 일에 꼭 필요한 기술을 배우지 못한다고 했다. ②③④⑤는 교안 문장의 단어가 아니다.","source":{"page":3,"section":"학교가 창의성을 계발시키고 있는가? - 스턴버그와 루바트(Sternberg \u0026 Lubart)의 연구결과","quote":"학교문화의 문제점들 중 하나는 학생들이 느낄 만한 위험을 배우지 못한다는 것임 • 즉, 창의적인 일을 할 때 꼭 필요한 기술을 배우지 못함"}},{"id":"18-04","type":"보기 조합","q":"홀맨(Hallman)이 제시한 창의성을 방해하는 학교의 여러 가지 장애물로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 학생과 교사 모두 학교에 잘 순응하도록 압력(규칙, 관례)을 받음\nㄴ. 독특한 아이디어와 유머는 무시됨\nㄷ. 외적 보상을 지나치게 중시함\nㄹ. 내적 동기만을 지나치게 강조함","choices":["ㄱ","ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"answer":5,"explain":"홀맨은 순응 압력(규칙, 관례), 독특한 아이디어와 유머 무시, 외적 보상을 지나치게 중시하는 것 등을 장애물로 들었다. ㄹ은 교안에 없는 내용이며, 교안은 오히려 '외적 보상' 중시를 문제로 지적한다.","source":{"page":4,"section":"학교가 창의성을 계발시키고 있는가? - 홀맨(Hallman)의 연구결과","quote":"학생과 교사 모두 학교에 잘 순응하도록 압력(규칙, 관례)을 받음 • 독특한 아이디어와 유머는 무시됨 • 외적 보상을 지나치게 중시하는 것 등"}},{"id":"18-05","type":"옳은 것","q":"아도르노(Adorno)의 권위에 대한 실험 결과, 높은 점수 순위를 바르게 나열한 것은?","box":null,"choices":["교사 - 경찰 - 군장교","경찰 - 군장교 - 교사","군장교 - 경찰 - 교사","경찰 - 교사 - 군장교","군장교 - 교사 - 경찰"],"answer":2,"explain":"경찰이 가장 높은 점수, 2위가 군장교, 3위가 교사였다. 나머지는 순서가 교안과 다르다.","source":{"page":5,"section":"학교가 창의성을 계발시키고 있는가? - 아도르노(Adorno)의 연구결과","quote":"경찰이 가장 높은 점수, 2위가 군장교, 3위가 교사였음"}},{"id":"18-06","type":"옳지 않은 것","q":"아도르노(Adorno)의 교사의 권위에 대한 실험에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["권위적인 사람들은 아래 사람들이 제대로 일을 하지 못하면 쉽게 화를 내고, 아래 사람들로부터 즉시 복종받기를 원한다.","권위적인 사람은 '지위서열'에 따른 위계적 위치에 민감하다.","학생과 교사에게는 신분의 표시가 없으나, 학생과 교사 간에는 차이가 있었다.","교사는 교장이나 재단이사장에 대해 공공연한 불만이나 반대를 하지만, 학생들에게는 자율을 허용한다.","교실에 들어간 교사는 최고의 권위를 가진다."],"answer":4,"explain":"④ 교안은 교사가 교장이나 재단이사장에 대해 공공연한 불만이나 반대를 '하지 못하지만' 학생들에게는 '완벽한 복종을 기대'한다고 했다. ①②③⑤는 교안 내용과 일치한다.","source":{"page":5,"section":"학교가 창의성을 계발시키고 있는가? - 아도르노(Adorno)의 연구결과","quote":"교사는 학교의 중요한 사건과 관련해 교장이나 재단이사장에 대해 공공연한 불만이나 반대를 하지 못하지만 학생들에게는 완벽한 복종을 기대함"}},{"id":"18-07","type":"빈칸","q":"다음 (   )에 들어갈 숫자로 알맞은 것은?","box":"아도르노는 (   )종에 이르는 직업에 종사하는 수백 명의 사람들에게 권위에 대한 실험을 실행하였다.","choices":["100","200","300","400","500"],"answer":4,"explain":"아도르노는 400종에 이르는 직업에 종사하는 수백 명의 사람들에게 권위에 대한 실험을 실행했다. ①②③⑤는 숫자가 다르다.","source":{"page":5,"section":"학교가 창의성을 계발시키고 있는가? - 아도르노(Adorno)의 연구결과","quote":"400종에 이르는 직업에 종사하는 수백 명의 사람들에게 권위에 대한 실험을 실행"}},{"id":"18-08","type":"옳은 것","q":"토랜스(Torrance)가 제시한, 학생들의 창의성을 격려하거나 인식하지 못하는 교사들이 늘어가는 이유로 옳은 것은?","box":null,"choices":["뛰어난 교사가 되는 과정에는 새로운 발견이나 위험 감수가 전혀 필요하지 않기 때문이다.","교사들이 학생의 창의성은 학교 밖에서만 길러진다고 생각하기 때문이다.","교육과정에 창의성 관련 내용이 전혀 없기 때문이다.","학생들이 창의적 활동을 거부하는 경향이 높기 때문이다.","교사가 학생들의 창의적 능력을 가르치려고 한다면 학생들의 통제권을 잃기 쉽다고 생각하는 경향이 높기 때문이다."],"answer":5,"explain":"⑤ 교안은 교사가 학생들의 창의적 능력을 가르치려 하면 통제권을 잃기 쉽다고 생각하는 경향이 높다고 했다. ① 교안은 뛰어난 교사가 되는 과정에 새로운 발견, 위험 감수, 집착, 미지의 세계에 대한 도전 등이 '있어야' 하며 이것들이 중대하면서 위험스러운 일이라고 했다. ②③④는 교안에 없는 내용이다.","source":{"page":6,"section":"학교가 창의성을 계발시키고 있는가? - 토랜스(Torrance)의 연구결과","quote":"만약 교사가 학생들의 이런 창의적 능력을 가르치려고 한다면 학생들의 통제권을 잃기 쉽다고 생각하는 경향이 높음"}},{"id":"18-09","type":"사례","q":"다음 사례와 가장 관련 깊은 연구결과를 제시한 학자는?","box":"수업 중 민수가 예상치 못한 엉뚱한 질문을 하자, 권위적인 담임교사는 민수를 지적하고 이후 '문제아'로 여기게 되었다.","choices":["스턴버그와 그리고렌코(Sternberg \u0026 Grigorenko)","홀맨(Hallman)","애머바일(Amabile)","로데스(Rhodes)","칙센트미하이(Csikszentmihalyi)"],"answer":1,"explain":"스턴버그와 그리고렌코는 교사가 학생들의 창의성을 억제한다는 연구결과에서, 예상치 못한 질문이나 엉뚱한 질문을 하는 학생들은 권위적인 교사에게 지적당하거나 문제아로 낙인받을 가능성이 높다고 했다. ② 홀맨은 학교의 장애물(순응 압력 등)이며, ③④⑤는 이 차시의 학교와 창의성 관계 연구자가 아니다.","source":{"page":7,"section":"학교가 창의성을 계발시키고 있는가? - 스턴버그와 그리고렌코(Sternberg \u0026 Grigorenko)의 연구결과","quote":"예상치 못한 질문이나 엉뚱한 질문을 하는 학생들은 권위적인 교사에게 지적당하거나 문제아로 낙인받을 가능성이 높음"}},{"id":"18-10","type":"옳은 것","q":"토랜스(Torrance)의 창의성 계발을 위한 교사 연수에 대한 설명으로 옳은 것은?","box":null,"choices":["교사들의 자발적 요구로 단기간 실시된 연수였다.","미교육부의 정책으로 학교가 학생의 창의성을 억압하고 있다는 문제를 해결하기 위해 교사들을 위한 프로그램을 개발하고 다년간 실제 교사 연수를 실시하였다.","교사 연수의 결과는 기대한 대로 매우 성공적이었다.","학생들을 대상으로 직접 창의성 프로그램을 운영한 것이다.","아도르노와 함께 공동으로 실시한 연수였다."],"answer":2,"explain":"② 교안 내용과 일치한다. ① 미교육부의 정책으로 다년간 실시했다. ③ 기대와는 달리 결과가 성공적이지 않았다. ④ 교사들을 위한 프로그램이다. ⑤ 교안에 없는 내용이다.","source":{"page":8,"section":"창의성을 계발시키기 위한 교사 연수 - 토랜스(Torrance)의 연구결과","quote":"토랜스(Torrance)는 미교육부의 정책으로 학교가 학생의 창의성을 억압하고 있다는 문제를 해결하기 위해 교사들을 위한 프로그램을 개발하고 다년간 실제 교사연수를 실시 • 그러나 기대와는 달리 교사연수의 결과가 성공적이지 않았음"}},{"id":"18-11","type":"옳지 않은 것","q":"토랜스가 제시한 교사 연수 실패 원인으로 옳지 않은 것은?","box":null,"choices":["교사들의 성격과 신념이 교수방법의 변화를 거부하였다.","교사들은 학생들의 특별한 아이디어를 수용하기보다는 잘못을 고쳐주고 비판하는 것에 익숙해져 있었다.","창의성 계발에 도움이 되는 활동이 자주, 짧은 시간 안에 효율적으로 제공되었다.","교사들은 흥미롭고 독특한 대답에 적절한 보상을 주지 못하였다.","교사들은 집단의 성공을 중시하는 분위기에서 독창적인 생각을 가진 학생들을 격려하지 못하였다."],"answer":3,"explain":"③ 교안은 창의성 계발 활동이 필요하지만 '가끔씩 제공되었고 많은 시간을 소비'했다고 했다. ①②④⑤는 교안의 실패 원인과 일치한다.","source":{"page":9,"section":"창의성을 계발시키기 위한 교사 연수 - 토랜스(Torrance)의 연구결과","quote":"창의성 계발에 도움이 되는 활동이 필요하지만, 이런 활동은 가끔씩 제공되었고 많은 시간을 소비"}},{"id":"18-12","type":"보기 조합","q":"토랜스가 제시한 '교사들의 잘못된 신념'에 해당하는 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 창의적인 학생이 수업시간에 엉뚱한 질문을 하면 부담스러움\nㄴ. 창의적인 문제해결능력은 몇몇의 학생만 가지고 있는 선천적인 능력이기 때문에 교사의 노력은 결과를 얻기 어려울 것\nㄷ. 창의적인 학생은 대체로 협조적임\nㄹ. 학생들의 창의성이 높아지면 정상적인 사회생활을 하기 어렵고, 비협조적이 될 위험이 있음","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"answer":5,"explain":"ㄱ, ㄴ, ㄹ은 교안에 제시된 교사들의 잘못된 신념이다. ㄷ 교안은 '창의적인 학생은 대체로 비협조적'이라는 신념을 제시했으므로 반대 서술이다.","source":{"page":10,"section":"창의성을 계발시키기 위한 교사 연수 - 교사들의 잘못된 신념","quote":"창의적인 학생이 수업시간에 엉뚱한 질문을 하면 부담스러움 • 창의적인 문제해결능력은 몇몇의 학생만 가지고 있는 선천적인 능력이기 때문에 ... • 창의적인 학생은 대체로 비협조적임 • 만약 학생들의 창의성이 높아지면 이들은 정상적인 사회생활을 하기 어렵고, 비협조적이 될 위험이 있음"}},{"id":"18-13","type":"옳은 것","q":"창의적인 영재교육의 교실환경 조성 방법으로 옳은 것은?","box":null,"choices":["질문을 하거나 요구를 하고 나서 충분한 시간을 두고 기다린다.","선생님의 의견을 먼저 제시하여 학생들의 사고 방향을 잡아준다.","학생이 아이디어를 말하는 도중이라도 시간 절약을 위해 정리해 준다.","양자택일이나 예/아니오를 요구하는 질문을 주로 한다.","다른 학생의 아이디어보다 자신의 아이디어에만 집중하도록 한다."],"answer":1,"explain":"① 교안 내용이다. ② 선생님의 의견은 되도록 나중에 제시한다. ③ 학생이 아이디어를 모두 이야기할 때까지 기다린다. ④ 의견을 물어보는 개방형 질문을 한다(폐쇄형 \u003c 개방형). ⑤ 다른 학생의 아이디어를 열심히 듣고 새로운 아이디어로 발전시키도록 격려한다.","source":{"page":12,"section":"창의적인 영재교육의 교실환경 조성 1","quote":"질문을 하거나 요구를 하고 나서 충분한 시간을 두고 기다림 선생님의 의견은 되도록 나중에 제시하고, 학생이 아이디어를 모두 이야기할 때까지 기다림"}},{"id":"18-14","type":"빈칸","q":"다음은 창의적인 영재교육의 교실환경 조성에 관한 내용이다. (   )에 들어갈 말로 알맞은 것은?","box":"양자택일이나 예/아니오를 요구하는 질문보다는 의견을 물어본다는지 등의 질문을 함 (폐쇄형 \u003c (   ))","choices":["수렴형","개방형","선택형","단답형","확인형"],"answer":2,"explain":"교안은 양자택일·예/아니오를 요구하는 폐쇄형 질문보다 의견을 묻는 개방형 질문을 하라고 했다(폐쇄형 \u003c 개방형). ①③④⑤는 교안에 없는 표현이다.","source":{"page":13,"section":"창의적인 영재교육의 교실환경 조성 2","quote":"양자택일이나 예/ 아니오를 요구하는 질문보다는 의견을 물어본다는지 등의 질문을 함(폐쇄형 \u003c 개방형)"}},{"id":"18-15","type":"옳지 않은 것","q":"창의적인 영재교육의 교실환경 조성에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["학생의 의견을 존중하고 학생이 의사를 표현할 수 있도록 격려한다.","다른 학생의 아이디어를 열심히 듣고 거기에서 새로운 아이디어의 발전을 격려한다.","교사는 학생의 창의성을 평가하는 심판 역할에 집중하고, 창의적인 모델이 되는 것은 피한다.","선생님의 의견은 되도록 나중에 제시한다.","의견을 물어보는 등의 질문을 한다."],"answer":3,"explain":"③ 교안은 '교사 자신이 창의적인 모델이 됨'을 제시했다. ①②④⑤는 교실환경 조성 1, 2의 내용과 일치한다.","source":{"page":13,"section":"창의적인 영재교육의 교실환경 조성 2","quote":"다른 학생의 아이디어를 열심히 듣고 거기에서 새로운 아이디어의 발전을 격려 교사 자신이 창의적인 모델이 됨"}},{"id":"18-16","type":"개념 찾기","q":"다음 설명에 해당하는 창의적 영재교육 환경은?","box":"· 어린이-부모-교사의 협력적인 관계와 작은 집단의 수업을 중심으로 데이터 수집 기술 기반의 개인별 맞춤화된 학습\n· 활용 소프트웨어: 플레이리스트, 러닝 프로그레션, 알트스쿨 스트림, 알트 비디오","choices":["네델란드 스티브잡스스쿨","미국 퀀텀캠프","미국 뉴비오스튜디오","한국과학영재학교","미국 알트스쿨"],"answer":5,"explain":"협력적 관계·작은 집단 수업·데이터 수집 기술 기반 개인별 맞춤화 학습과 플레이리스트 등의 소프트웨어는 미국 알트스쿨이다. ① 스티브잡스스쿨은 기기·웹 기반 학습과 학부모 애플리케이션, ② 퀀텀캠프는 수학과학 서머캠프, ③ 뉴비오스튜디오는 스튜디오(작업 공방) 개념의 학교이며, ④는 이 차시 사례가 아니다.","source":{"page":14,"section":"창의적 영재교육 환경 소개 1: 미국 알트스쿨","quote":"어린이-부모-교사의 협력적인 관계와 작은 집단의 수업을 중심으로 데이터 수집 기술 기반의 개인별 맞춤화된 학습"}},{"id":"18-17","type":"옳지 않은 것","q":"미국 알트스쿨의 활용 소프트웨어와 그 기능의 연결로 옳지 않은 것은?","box":null,"choices":["플레이리스트 - 과업 카드","러닝 프로그레션 - 활동 및 학습 진도 및 결과 저장","알트스쿨 스트림 - 학교-가정 커뮤니케이션 지원","알트 비디오 - 학교-가정 커뮤니케이션 지원","알트 비디오 - 학생들의 행동 및 상호작용 기록"],"answer":4,"explain":"④ 학교-가정 커뮤니케이션 지원은 알트스쿨 스트림의 기능이며, 알트 비디오는 학생들의 행동 및 상호작용 기록이다. ①②③⑤는 올바른 연결이다.","source":{"page":14,"section":"창의적 영재교육 환경 소개 1: 미국 알트스쿨","quote":"플레이리스트(과업 카드) 러닝 프로그레션(활동 및 학습 진도 및 결과 저장) 알트스쿨 스트림(학교-가정 커뮤니케이션 지원) 알트 비디오(학생들의 행동 및 상호작용 기록)"}},{"id":"18-18","type":"옳은 것","q":"네델란드 스티브잡스스쿨에 대한 설명으로 옳은 것은?","box":null,"choices":["학생들은 매일 학교에 출석하나, 기기를 통해 언제 어디서나 학습 가능하며 웹 기반의 학습프로그램을 활용한다.","학생들은 학교에 출석하지 않고 온라인으로만 학습한다.","수학과학교육 중점 서머캠프로 운영된다.","사물 설계 및 제작, 협업 지원 스튜디오(작업 공방) 개념의 학교이다.","학부모는 정기 면담을 통해서만 학생의 일과를 확인할 수 있다."],"answer":1,"explain":"① 교안 내용이다. ② 학생들은 매일 학교에 출석한다. ③ 미국 퀀텀캠프의 특징이다. ④ 미국 뉴비오스튜디오의 특징이다. ⑤ 학부모는 애플리케이션을 통해 학생의 일과를 살펴본다.","source":{"page":15,"section":"창의적 영재교육 환경 소개 2: 네델란드 스티브잡스스쿨","quote":"학생들은 매일 학교에 출석하나, 기기를 통해 언제 어디서나 학습 가능하며 웹 기반의 학습프로그램 활용 학부모는 애플리케이션을 통해 학생의 일과를 살펴보고, 학생은 작업의 포트폴리오, 문서 등을 보유"}},{"id":"18-19","type":"개념 찾기","q":"다음 설명에 해당하는 창의적 영재교육 환경은?","box":"· 수학과학교육 중점 서머캠프\n· '탐구기반학습' 수업 후 디지털 콘텐츠를 통한 개별 개념 탐구\n· 저학년 학생들에게도 고등 수준의 수학 및 과학 관련 개념을 충분히 학습시킬 수 있음을 확인","choices":["미국 알트스쿨","네델란드 스티브잡스스쿨","미국 퀀텀캠프","미국 뉴비오스튜디오","서울과학고"],"answer":3,"explain":"수학과학교육 중점 서머캠프, 탐구기반학습 후 디지털 콘텐츠를 통한 개별 개념 탐구는 미국 퀀텀캠프다. ① 알트스쿨은 개인별 맞춤화 학습, ② 스티브잡스스쿨은 기기·웹 기반 학습, ④ 뉴비오스튜디오는 공동제작 프로젝트 중심의 스튜디오 개념 학교이며, ⑤는 이 차시 사례가 아니다.","source":{"page":16,"section":"창의적 영재교육 환경 소개 3: 미국 퀀텀캠프","quote":"수학과학교육 중점 서머캠프 '탐구기반학습' 수업 후 디지털 콘텐츠를 통한 개별 개념 탐구 저학년 학생들에게도 고등수준의 수학 및 과학 관련 개념을 충분히 학습시킬 수 있음을 확인"}},{"id":"18-20","type":"빈칸","q":"미국 뉴비오스튜디오에 대한 다음 설명의 (ㄱ), (ㄴ)에 들어갈 숫자로 알맞은 것은?","box":"(ㄱ)여 명의 고등학교 학생들이 (ㄴ)여 개의 프로젝트에 참여, 디지털 결과물 제작·발표","choices":["ㄱ: 130, ㄴ: 400","ㄱ: 400, ㄴ: 130","ㄱ: 300, ㄴ: 100","ㄱ: 400, ㄴ: 300","ㄱ: 1,000, ㄴ: 130"],"answer":2,"explain":"400여 명의 고등학교 학생들이 130여 개의 프로젝트에 참여했다. ① 숫자가 뒤바뀌었고 ③④⑤는 숫자가 다르다.","source":{"page":17,"section":"창의적 영재교육 환경 소개 4: 미국 뉴비오스튜디오","quote":"400여 명의 고등학교 학생들이 130여 개의 프로젝트에 참여, 디지털 결과물 제작‧발표"}},{"id":"18-21","type":"옳은 것","q":"미국 뉴비오스튜디오에 대한 설명으로 옳은 것은?","box":null,"choices":["어린이-부모-교사의 협력적 관계를 중심으로 데이터 수집 기술을 활용한다.","학부모가 애플리케이션으로 학생의 일과를 살펴본다.","수학과학교육 중점 서머캠프이다.","저학년 학생들을 주 대상으로 한다.","사물 설계 및 제작, 협업 지원 스튜디오(작업 공방) 개념의 학교로, 다학제적 성격의 공동제작 프로젝트, 지역사회 연계 프로젝트 등이 주요 활동이다."],"answer":5,"explain":"⑤ 교안 내용이다. ① 미국 알트스쿨, ② 네델란드 스티브잡스스쿨, ③ 미국 퀀텀캠프의 특징이다. ④ 뉴비오스튜디오는 고등학교 학생들이 참여했다.","source":{"page":17,"section":"창의적 영재교육 환경 소개 4: 미국 뉴비오스튜디오","quote":"사물 설계 및 제작, 협업 지원 스튜디오(작업 공방) 개념의 학교 주요활동: 다학제적 성격의 공동제작 프로젝트, 지역사회 연계 프로젝트 등"}},{"id":"18-22","type":"사례","q":"다음 사례의 교사들에게서 나타나는 모습은 토랜스(Torrance)가 제시한 무엇에 해당하는가?","box":"창의성 교사 연수를 받은 A교사는 연수 후에도 학생이 독특한 대답을 하면 적절한 보상을 주기보다 틀린 부분을 고쳐주고 비판하는 기존 방식을 그대로 유지하였다.","choices":["창의성을 촉진시키는 9가지 요인","창의적 영재의 특성","교사 연수 실패원인","창의성 4P 이론","칙센트미하이의 분야(field) 체계"],"answer":3,"explain":"토랜스는 교사 연수 실패원인으로 교사들이 학생들의 특별한 아이디어를 수용하기보다 잘못을 고쳐주고 비판하는 것에 익숙해 변화가 힘들고, 흥미롭고 독특한 대답에 적절한 보상을 주지 못한다는 점을 들었다. ①은 애머바일과 헤네시, ②는 여러 학자의 창의적 영재 특성 연구, ④는 로데스, ⑤는 칙센트미하이의 이론이다.","source":{"page":9,"section":"창의성을 계발시키기 위한 교사 연수 - 교사 연수 실패원인","quote":"교사들은 학생들의 특별한 아이디어를 수용하기보다는, 학생들의 잘못을 고쳐주고 비판하는 것에 익숙해져 있기 때문에 변화가 힘듦 • 교사들은 흥미롭고, 독특한 대답에 적절한 보상을 주지 못함"}}]},{"lesson":19,"title":"영재의 지능과 창의성의 관계는 어떨까?","file":"4. 교안 (1~30)/19.pdf","summary":["옥스퍼드대학 최종면접: 물리학과(냉장고 열면 방 온도), 경제학과(모래 알갱이 몇 개), 의학과(동물 뼈 모형) / 창의적 문제해결력 실제문제: 보어(노벨물리학상 1922) 기압계로 건물 높이, 서울예술의전당 7개 낱말 시, 빌게이츠 3분 이내 워싱턴시 주유소 수","지능: 태어날 때 결정 = 유전설 / 교육과 환경에 따라 변함 = 환경설. 최초 지능연구학자 골튼의 ‘천재의 가계도’","지능 상관: 일란성 쌍생아 0.82, 이란성 쌍생아 0.59, 형제 0.55, 부모와 자녀 0.50 → 혈통이 가까울수록 상관 높음(유전적 요인)","왓슨(행동주의): ‘나에게 12명의 아이가 맡겨지고…어떤 유형의 인간이라도 만들 수 있다’ / 맹모의 삼천지교(공동묘지→시장→서당 근처, 3번 이사)","유전설과 환경설의 역동적 상호작용으로 지능 발달. 제임스 카텔: 유동성 지능(유전적 발달, 학습 영향 없음) vs 결정성 지능(경험·환경·교육으로 발달: 문해력, 상식, 문제해결력)","김아영·조영미(2001): 지능-학업성취도 상관 0.62~0.63, 설명력 38~39% / 이정규(2004): TTCT-학업성취도 상관 0.32~0.44, 예측력 10.43~19.18%","박병기(2000) ‘창의성과 지능의 관계구조’: 동등한 중첩 모형이 타당. 관계모형 = 독립적(완전한/실질적 독립), 중첩적(동등한/지능 위주/창의성 위주), 포섭적(동등한/지능 위주/창의성 위주)","식역이론(threshold theory): 지능지수가 식역 수준(IQ 120 정도)을 넘어서면 창의성과 지능 간 상관 거의 없어짐","토랜스: 창의적 인재 육성이 국가의 부와 직결 / 창의성 학문 연구 시작 = 1950년 미국심리학회 회장 길포드 기조강연","와이어버그: 10년의 법칙(전문분야 10년 이상 노력) = 말콤 글래드웰 ‘아웃라이어’의 1만시간의 법칙","루바트: 동양 창의성 = 본성 탐구와 전통의 재해석 / 스턴버그: 반복 속 완성도 높이는 정적인 창의성 → 온고지신(溫故知新)","서양 중심 창의성 연구 = 개인의 자유와 다양성, 개방성과 독창성 강조 / 우리나라 = 대학입시제도·교과지식 암기 위주. 창의성 계발은 프로그램보다 열린 문화 환경이 더 중요"],"questions":[{"id":"19-01","type":"옳은 것","q":"교안에 소개된 옥스퍼드대학 최종면접 질문과 학과의 연결로 옳은 것은?","box":null,"choices":["물리학과 – 동물 뼈 모형을 보여주며 어느 동물의 어느 부위 뼈인지 묻기","경제학과 – 손에 모래를 쥐고 조금씩 떨어뜨릴 때 땅에 쌓이려면 모래 알갱이가 몇 개 필요한지 묻기","의학과 – 빈 방의 냉장고를 열면 방 온도가 어떻게 변할지 묻기","물리학과 – 3분 이내에 워싱턴시에 있는 주유소의 수를 알 수 있는 방법 묻기","경제학과 – 기압계로 건물의 높이를 알 수 있는 방법 묻기"],"answer":2,"explain":"경제학과 질문은 모래 알갱이 문제다. ① 동물 뼈 모형은 의학과 ③ 냉장고와 방 온도는 물리학과 ④ 주유소 수는 빌게이츠 관련 문제 ⑤ 기압계 문제는 보어 관련 문제로 면접 학과 질문이 아니다.","source":{"page":3,"section":"세계 3대 대학인 옥스퍼드 대학의 최종면접","quote":"경제학과 / ‣ 손에 모래를 쥐고 있다가 조금씩 떨어뜨리기 시작했다. 땅에 쌓이려면 모래 알갱이 몇 개가 필요할까?"}},{"id":"19-02","type":"옳은 것","q":"교안의 ‘창의적 문제해결력 실제문제’에 대한 설명으로 옳은 것은?","box":null,"choices":["기압계로 건물의 높이를 알 수 있는 방법은 빌게이츠와 관련된 문제이다.","보어는 1932년 노벨물리학상을 받았다.","서울예술의전당 문제는 5개 낱말을 모두 사용하여 시를 짓게 한다.","빌게이츠 관련 문제는 3분 이내에 워싱턴시에 있는 주유소의 수를 알 수 있는 방법을 묻는다.","서울예술의전당 문제는 낱말을 보고 떠오르는 생각을 5~7개 낱말로 쓰게 한다."],"answer":4,"explain":"빌게이츠 문제는 ‘3분 이내 워싱턴시 주유소의 수’이다. ① 기압계 문제는 보어 ② 보어 노벨물리학상은 1922년 ③ 7개 낱말(구름, 우유, 시계, 친구, 섬, 햇살, 연필) ⑤ 떠오르는 생각을 1~3개 낱말로 씀.","source":{"page":4,"section":"창의적 문제해결력 실제문제","quote":"빌게이츠 / ‣ 3분 이내에 워싱턴시에 있는 주유소의 수를 알 수 있는 방법은?"}},{"id":"19-03","type":"개념 찾기","q":"다음 창의적 문제해결력 실제문제와 관련하여 교안에 제시된 출처(인물·기관)는?","box":"‣ 다음 7개 낱말(구름, 우유, 시계, 친구, 섬, 햇살, 연필)을 보고, 떠오르는 생각을 1~3개 낱말로 아래 밑줄에 쓰시오.\n‣ 그리고 7개 낱말을 모두 사용하여 창의적으로 시를 지으시오.","choices":["서울예술의전당","보어","빌게이츠","옥스퍼드대학 물리학과","옥스퍼드대학 의학과"],"answer":1,"explain":"7개 낱말로 시 짓기 문제는 서울예술의전당 문제이다. ② 보어는 기압계로 건물 높이 ③ 빌게이츠는 주유소 수 ④ 물리학과는 냉장고와 방 온도 ⑤ 의학과는 동물 뼈 모형 질문이다.","source":{"page":4,"section":"창의적 문제해결력 실제문제","quote":"서울예술의전당 / ‣ 다음 7개 낱말(구름, 우유, 시계, 친구, 섬, 햇살, 연필)을 보고, 떠오르는 생각을 1~3개 낱말로 아래 밑줄에 쓰시오"}},{"id":"19-04","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"지능이 유전된다면, 최초 지능연구학자인 (   )의 “천재의 가계도”나 최근 인간게놈프로젝트를 통해 인간의 유전자 지도가 완성되었는데, 지능을 결정하는 유전자 정보를 편집한다면?","choices":["왓슨","카텔","토랜스","길포드","골튼"],"answer":5,"explain":"교안은 ‘천재의 가계도’를 최초 지능연구학자인 골튼과 연결한다. ① 왓슨은 행동주의(12명의 아이) ② 카텔은 유동성·결정성 지능 ③ 토랜스는 창의적 인재 육성과 국가의 부 ④ 길포드는 1950년 미국심리학회 기조강연.","source":{"page":5,"section":"지능에 대한 이슈 – 유전 vs 환경","quote":"지능이 유전된다면, 최초 지능연구학자인 골튼의 “천재의 가계도”나 최근 인간게놈프로젝트를 통해 인간의 유전자 지도가 완성되었는데"}},{"id":"19-05","type":"옳은 것","q":"교안에 제시된 지능의 상관관계 수치로 옳은 것은?","box":null,"choices":["일란성 쌍생아 간 0.92","이란성 쌍생아 간 0.55","형제 간 0.55","부모와 자녀 간 0.59","이란성 쌍생아 간 0.82"],"answer":3,"explain":"교안 수치: 일란성 0.82, 이란성 0.59, 형제 0.55, 부모와 자녀 0.50. ① 0.92 → 0.82 ② 0.55는 형제 → 이란성은 0.59 ④ 0.59 → 0.50 ⑤ 0.82는 일란성 쌍생아.","source":{"page":6,"section":"지능에 대한 이슈 – 유전 vs 환경","quote":"지능의 상관관계는 일란성 쌍생아 간은 0.82, 이란성 쌍생아 간은 0.59, 형제 간은 0.55, 부모와 자녀 간은 0.50"}},{"id":"19-06","type":"옳지 않은 것","q":"지능의 유전설에 관한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["혈통이 가까울수록 지능의 상관이 낮은 것은 지능 발달이 환경적 요인에 의해 영향받고 있음을 보여준다.","심리학자들은 지능의 유전설을 쌍생아에 대한 연구 등을 통해 증명하려고 했다.","전혀 다른 개인 간 지능의 상관관계보다 쌍생아의 상관관계가 훨씬 높다.","가족 연구는 지능 발달의 개인차가 유전적 소인이 있음을 보여준다.","유전설은 지능이 태어날 때부터 이미 결정된다고 본다."],"answer":1,"explain":"교안: 혈통이 가까울수록 지능의 상관이 ‘높은’ 것은 지능 발달이 ‘유전적 요인’에 의해 영향받고 있음을 보여준다. ①은 반대로 서술. ②③④는 p6, ⑤는 p5 내용 그대로.","source":{"page":6,"section":"지능에 대한 이슈 – 유전 vs 환경","quote":"혈통이 가까울수록 지능의 상관이 높은 것은 지능 발달이 유전적 요인에 의해 영향받고 있음을 보여줌"}},{"id":"19-07","type":"개념 찾기","q":"다음 주장을 한 학자로 교안에 제시된 사람은?","box":"“나에게 12명의 아이가 맡겨지고 내가 원하는 환경을 마련해 주면 그들의 재능이나 특성과 관계없이 어떤 유형의 인간이라도 만들 수 있다”","choices":["골튼","제임스 카텔","왓슨","토랜스","홀링워스"],"answer":3,"explain":"교육에 많은 영향을 미친 행동주의 심리학의 대가 왓슨(Watson)의 주장으로, 유전과 관계없이 적절한 자극(교육적 처치)으로 원하는 반응(행동의 변화)을 형성할 수 있다는 환경설 견해다. ① 골튼은 천재의 가계도 ② 카텔은 유동성·결정성 지능 ④ 토랜스는 창의적 인재와 국가의 부.","source":{"page":7,"section":"지능에 대한 이슈 – 유전 vs 환경","quote":"교육에 많은 영향을 미친 행동주의 심리학의 대가인 왓슨(Watson)은 “나에게 12명의 아이가 맡겨지고"}},{"id":"19-08","type":"옳은 것","q":"교안에서 환경의 영향을 보여주는 예로 든 ‘맹모의 삼천지교’에 대한 설명으로 옳은 것은?","box":null,"choices":["시장 근처, 공동묘지 근처, 서당 근처 순으로 이사하였다.","모두 5번 이사하였다.","결국 시장 가까운 곳으로 이사하여 맹자가 예법에 관한 놀이를 하였다.","지능 발달에 바람직한 환경으로 학교 \u003e 또래 \u003e 가정 순서를 제시하였다.","서당 가까운 곳으로 이사하니 맹자가 예법에 관한 놀이를 하고 책과 붓을 가까이하였다."],"answer":5,"explain":"교안: 공동묘지 근처, 시장 근처, 서당 근처로 3번 이사, 결국 서당 가까운 곳에서 맹자가 예법 놀이·책과 붓을 가까이함. ① 순서 틀림 ② 3번 ③ 시장 → 서당 ④ 교안은 ‘가정 \u003e 또래 \u003e 학교 등’.","source":{"page":8,"section":"지능에 대한 이슈 – 유전 vs 환경","quote":"공동묘지 근처, 시장 근처, 서당 근처로 3번 이사, 결국 서당 가까운 곳으로 이사하니 아들인 맹자가 예법에 관한 놀이를 하고 책과 붓을 가까이하여"}},{"id":"19-09","type":"빈칸","q":"미국의 심리학자 제임스 카텔이 구분한 지능에 대한 다음 설명에서 (가), (나)에 들어갈 말로 알맞은 것은?","box":"• (가) 지능: 유전적 발달, 학습의 영향 없음\n• (나) 지능: 경험, 환경, 교육에 의해 발달 (문해력, 상식, 문제해결력 등)","choices":["(가) 결정성 (나) 유동성","(가) 유동성 (나) 결정성","(가) 선천성 (나) 후천성","(가) 유동성 (나) 환경성","(가) 일반 (나) 특수"],"answer":2,"explain":"유동성(fluid) 지능은 유전적 발달·학습 영향 없음, 결정성(crystallized) 지능은 경험·환경·교육으로 발달한다. ①은 뒤바뀜, ③④⑤는 교안에 없는 용어.","source":{"page":9,"section":"지능에 대한 이슈 – 유전 vs 환경","quote":"유동성(fluid) 지능: 유전적 발달, 학습의 영향 없음 • 결정성(crystallized) 지능: 경험, 환경, 교육에 의해 발달"}},{"id":"19-10","type":"보기 조합","q":"지능의 유전과 환경에 대한 교안의 결론으로 옳은 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 유전설과 환경설의 역동적 상호작용으로 지능이 발달한다.\nㄴ. 지능은 불변이 아닌 장래의 교육 경험과 환경에 의해 더욱 발달한다.\nㄷ. 미국의 심리학자 제임스 카텔은 정신을 측정할 수 없다고 주장하였다.\nㄹ. 지능의 성장과 발달에는 유전과 환경이 함께 작용한다.","choices":["ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ·ㄴ은 p9 문장 그대로, ㄹ은 p10 도식(유전·환경 → 지능의 성장과 발달). ㄷ: 카텔은 정신을 측정할 ‘수 있다’고 주장했다.","source":{"page":9,"section":"지능에 대한 이슈 – 유전 vs 환경","quote":"유전설과 환경설의 역동적 상호작용으로 지능이 발달 ‣ 지능은 불변이 아닌 장래의 교육 경험과 환경에 의해 더욱 발달함 ‣ 미국의 심리학자 제임스 카텔은 정신을 측정할 수 있다고 주장"}},{"id":"19-11","type":"옳은 것","q":"김아영과 조영미(2001)의 『학업성취도에 대한 지능과 동기변인들의 상대적 예측력』 연구 결과로 옳은 것은?","box":null,"choices":["지능과 학업성취도의 상관은 0.32~0.44였다.","지능의 학업성취도 분산 설명력은 10.43~19.18%였다.","동기가 학업성취를 예측하는 가장 강력한 변인이었다.","지능의 학업성취도 분산 설명력은 62~63%였다.","지능은 학업성취를 예측하는 가장 강력한 변인으로, 학업성취도와의 상관이 0.62~0.63이었다."],"answer":5,"explain":"지능은 가장 강력한 예측 변인, 상관 0.62~0.63, 설명력 38~39%. ①② TTCT(창의성) 수치(이정규, 2004) ③ 가장 강력한 변인은 지능 ④ 62~63% → 38~39%.","source":{"page":11,"section":"지능에 대한 이슈 – 학업성취도에 대한 예언력","quote":"학업성취를 예측하는 가장 강력한 변인으로서 지능은 학업성취도와의 상관이 0.62～0.63이었고, 지능이 학업성취도 분산을 설명하는 정도(설명력)는 38～39%였음"}},{"id":"19-12","type":"빈칸","q":"이정규(2004)의 『학업성취도에 대한 창의성의 상대적 예측력』에 관한 다음 설명에서 (   )에 들어갈 수치로 알맞은 것은?","box":"학업성취도와 TTCT와의 상관관계는 (   ) (지능은 0.62～0.63)","choices":["0.32～0.44","0.50～0.55","0.59～0.82","0.10～0.19","0.38～0.39"],"answer":1,"explain":"TTCT와 학업성취도 상관은 0.32~0.44, 예측력 10.43~19.18%(지능 38~39%). 창의성도 학업성취도에 대해 설명력이 높음이 검증되었다. 나머지 수치는 교안의 다른 수치(쌍생아 상관, 설명력 등)를 변형한 것.","source":{"page":12,"section":"창의성에 대한 이슈 – 학업성취도에 대한 예언력","quote":"학업성취도와 TTCT와의 상관관계는 0.32～0.44 (지능은 0.62～0.63)"}},{"id":"19-13","type":"옳지 않은 것","q":"창의성과 학업성취도에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["이정규(2004)는 학업성취도에 대하여 창의성도 설명력이 높음을 검증하였다.","학업성취도에 대하여 TTCT는 10.43~19.18%로 상대적인 예측력을 보였다.","학업성취도와 TTCT의 상관관계는 0.32~0.44이다.","학업성취도에 대한 TTCT의 예측력은 지능의 예측력(38~39%)보다 높다.","지능과 학업성취도의 상관은 0.62~0.63이다."],"answer":4,"explain":"TTCT 예측력 10.43~19.18%는 지능 38~39%보다 낮다. 나머지는 교안 p11~12 내용 그대로.","source":{"page":12,"section":"창의성에 대한 이슈 – 학업성취도에 대한 예언력","quote":"학업성취도에 대하여 TTCT는 10.43～19.18%로 상대적인 예측력(지능은 38~39%)"}},{"id":"19-14","type":"옳지 않은 것","q":"교안의 ‘지능과 창의성의 관계에 대한 질문’에 포함되지 않은 것은?","box":null,"choices":["창의성과 지능은 서로 다른 정신적 실체인가? 아니면 동일한 정신적 실체의 다른 표현인가?","창의성은 지능의 하위요소인가? 지능이 창의성의 하위요소인가?","창의성과 지능은 모두 유전에 의해서만 결정되는가?","창의성과 지능 간에는 실질적인 관련성이 존재하는가?","창의성과 지능의 관계는 어떠한 양상을 띠고 있는가?"],"answer":3,"explain":"교안 질문: 서로 다른/동일한 정신적 실체인가, 하위요소 관계, 실질적 관련성 존재 여부, 관계의 양상. ③ 유전에 의해서만 결정되는가는 제시되지 않았다.","source":{"page":14,"section":"지능과 창의성의 관계에 대한 질문","quote":"창의성과 지능은 서로 다른 정신적 실체인가? 아니면 동일한 정신적 실체의 다른 표현인가? 창의성은 지능의 하위요소인가? 지능이 창의성의 하위요소인가?"}},{"id":"19-15","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"박병기(2000) “창의성과 지능의 관계구조” 연구에서 (   ) 모형이 타당함","choices":["완전한 독립","동등한 포섭","지능 위주의 중첩","실질적 독립","동등한 중첩"],"answer":5,"explain":"박병기(2000)는 ‘동등한 중첩 모형’이 타당하다고 보았다. 나머지는 관계모형 표의 다른 하위 유형이다.","source":{"page":15,"section":"지능과 창의성의 관계에 대한 질문","quote":"박병기(2000) “창의성과 지능의 관계구조” 연구에서 동등한 중첩 모형이 타당함"}},{"id":"19-16","type":"옳지 않은 것","q":"교안의 ‘창의성과 지능 간 관계모형’ 구분으로 옳지 않은 것은?","box":null,"choices":["독립적 관계 – 완전한 독립","독립적 관계 – 실질적 독립","독립적 관계 – 동등한 독립","중첩적 관계 – 창의성 위주의 중첩","포섭적 관계 – 지능 위주의 포섭"],"answer":3,"explain":"독립적 관계는 완전한 독립·실질적 독립 2가지뿐이다. 중첩적 관계(동등한/지능 위주/창의성 위주의 중첩), 포섭적 관계(동등한/지능 위주/창의성 위주의 포섭)는 각각 3가지.","source":{"page":15,"section":"지능과 창의성의 관계에 대한 질문","quote":"독립적 관계 완전한 독립 실질적 독립 / 중첩적 관계 동등한 중첩 지능 위주의 중첩 창의성 위주의 중첩 / 포섭적 관계 동등한 포섭 지능 위주의 포섭 창의성 위주의 포섭"}},{"id":"19-17","type":"개념 찾기","q":"다음 설명에 해당하는 이론은?","box":"창의성이 어느 정도까지는 지능에 근거하지만, 지능지수가 어느 수준을 넘어서면 창의성과 지능 간에는 상관이 거의 없어진다.","choices":["식역이론(threshold theory)","세고리모형","귀인이론","10년의 법칙","동등한 포섭 모형"],"answer":1,"explain":"창의성의 ‘식역이론(識域, threshold theory, 역치, 임계점, 문지방)’이다. ② 세고리모형은 렌줄리 ③ 귀인이론은 행동 원인 설명 ④ 10년의 법칙은 와이어버그 ⑤ 박병기 관계모형의 한 유형.","source":{"page":16,"section":"창의성의 식역이론","quote":"창의성이 어느 정도까지는 지능에 근거하지만, 지능지수가 어느 수준(즉, 식역 수준)을 넘어서면 창의성과 지능 간에는 상관이 거의 없어짐"}},{"id":"19-18","type":"빈칸","q":"창의성의 식역이론에서 식역 수준으로 교안에 제시된 지능지수는?","box":"식역 수준은 IQ (   ) 정도","choices":["100","110","130","140","120"],"answer":5,"explain":"교안: 식역 수준은 IQ 120 정도. 그 이상에서는 창의성과 지능 간 상관이 거의 없어진다.","source":{"page":16,"section":"창의성의 식역이론","quote":"식역 수준은 IQ 120 정도"}},{"id":"19-19","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"우리나라가 10년 뒤에도 더욱 성장하려면, (   )에 더 많은 정책적 지원이 있어야 한다.","choices":["창의적인 영재육성","교과지식 암기교육","대입제도 개선","IT·BT 산업","조기입학 제도"],"answer":1,"explain":"교안 p17: ‘창의적인 영재육성에 더 많은 정책적 지원이 있어야 한다.’ 나머지는 교안 문장과 다르다.","source":{"page":17,"section":"지능과 창의성의 관계","quote":"우리나라가 10년 뒤에도 더욱 성장하려면, 창의적인 영재육성에 더 많은 정책적 지원이 있어야 한다."}},{"id":"19-20","type":"옳은 것","q":"사례 ‘한국인 창의 DNA 경쟁력 있다(아시아경제, 2011. 4. 6)’의 내용으로 옳은 것은?","box":null,"choices":["길포드는 “창의적인 인재 육성이 국가의 부와 직결된다”고 말했다.","창의성이 학문으로 연구되기 시작한 시점은 1950년 미국심리학회 회장이 된 길포드의 기조강연이다.","토랜스는 1950년 기조강연에서 “하나의 정답만을 요구하는 시대는 지나갔다”고 했다.","창의성 연구는 영국을 중심으로 진행되었다.","서양 중심 창의 연구는 집단의 조화와 전통을 강조한다."],"answer":2,"explain":"심리학자들은 창의성 연구 시작 시점을 1950년 미국심리학회 회장이 된 길포드의 기조강연에서 찾는다. ① 국가의 부 발언은 토랜스 ③ 정답 하나 시대 발언은 길포드 ④ 미국 중심 ⑤ 서양 연구는 개인의 자유와 다양성, 개방적 토의와 독창성 강조.","source":{"page":18,"section":"한국인의 창의 DNA","quote":"심리학자들은 창의성이 학문으로 연구되기 시작한 시점을 1950년 미국심리학회 회장이 된 길포드의 기조강연에서 찾고 있다."}},{"id":"19-21","type":"옳지 않은 것","q":"사례 ‘한국인 창의 DNA’에서 창의 유전자의 첫째 관점(학교교육을 통한 기본지식의 축적)에 대한 설명으로 옳지 않은 것은?","box":null,"choices":["창의성을 발현하는 데는 해당 분야의 기본지식이 절대적으로 필요하다.","와이어버그 박사는 ‘10년의 법칙’을 강조했다.","말콤 글래드웰의 ‘아웃라이어’에서 나오는 ‘1만 시간의 법칙’과 같은 맥락이다.","전문지식은 고정관념이 될 수 있으므로 창의성 발현에 방해만 된다.","우리나라는 G20 의장국으로 세계 10위권 경제대국이 되었고, IT와 BT 분야에서 세계가 부러워하는 성과물을 만들었다."],"answer":4,"explain":"교안은 ‘전문지식이 방해만 된다고 생각하는 사람들도 있을 것’이라 언급한 뒤 ‘하지만 기본지식이 절대적으로 필요하다’고 반박한다. ④는 교안이 부정한 견해.","source":{"page":19,"section":"한국인의 창의 DNA","quote":"하지만 창의성을 발현하는 데는 해당 분야의 기본지식이 절대적으로 필요하다."}},{"id":"19-22","type":"개념 찾기","q":"다음 설명에 해당하는 학자는?","box":"지금까지의 창의성 개념을 확대해 반복 속에서 완성도를 높여가는 정적인 창의성을 강조한다.","choices":["루바트","토랜스","와이어버그","스턴버그","길포드"],"answer":4,"explain":"정적인 창의성은 스턴버그. ① 루바트는 동양과 서양의 창의성 개념이 다름을 인식(본성 탐구·전통의 재해석) ② 토랜스는 국가의 부 ③ 와이어버그는 10년의 법칙 ⑤ 길포드는 1950년 기조강연. 한마디로 온고지신(溫故知新)의 창의성 문화.","source":{"page":20,"section":"한국인의 창의 DNA","quote":"스턴버그도 지금까지의 창의성 개념을 확대해 반복 속에서 완성도를 높여가는 정적인 창의성을 강조한다."}},{"id":"19-23","type":"옳은 것","q":"창의 유전자의 둘째 관점(창의성 계발이 가능한 문화적 환경)에 대한 교안 설명으로 옳은 것은?","box":null,"choices":["서양 학자들은 동양 문화가 창의성 계발에 방해가 된다고 밝혔다.","창의성 계발은 열린 문화 환경보다 프로그램 자체가 더 중요하다.","루바트는 동양의 창의성이 물체의 본성 탐구와 전통의 재해석을 통해 창의성 계발에 도움을 준다고 본다.","창의적인 사회가 되려면 조직보다 개인의 노력만이 중요하다.","학교와 조직의 문화는 개인의 차이보다 획일성을 존중하는 방향으로 개선되어야 한다."],"answer":3,"explain":"루바트: 동양과 서양의 창의성 개념 차이 인식, 동양 창의성은 본성 탐구와 전통의 재해석. ① 도움이 된다고 밝힘 ② 프로그램보다 열린 문화 환경이 더 중요 ④ 개인뿐 아니라 조직도 노력 ⑤ 개인의 차이와 다양성 존중.","source":{"page":20,"section":"한국인의 창의 DNA – 본성탐구·전통재해석 학습법","quote":"동양의 창의성은 물체의 본성 탐구와 전통의 재해석을 통해 창의성 계발에 도움을 준다는 것이다."}},{"id":"19-24","type":"보기 조합","q":"교안의 정리(‘그런 한국이 왜 10위권의 경제대국이 되었는가?’)에서 한국인의 창의 유전자에 도움이 되는 것으로 제시된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 학교교육을 통한 기본지식의 축적(1만 시간의 법칙)\nㄴ. 본성 탐구와 재해석\nㄷ. 정적인 창의성\nㄹ. 온고지신의 문화\nㅁ. 교과지식 암기 위주의 교육제도","choices":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ, ㄹ","ㄴ, ㄷ, ㅁ","ㄱ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],"answer":2,"explain":"창의 유전자: 기본지식의 축적(1만 시간의 법칙), 본성 탐구와 재해석, 정적인 창의성, 온고지신의 문화. ㅁ 교과지식 암기 위주 교육은 창의성을 기르는 데 어려움을 준 요인(p18, p21). 가정·학교·사회·문화가 창의성을 존중하고 계발하는 데 더 노력해야 한다.","source":{"page":22,"section":"한국인의 창의 DNA","quote":"창의 유전자는 학교교육을 통한 기본지식의 축적(1만 시간의 법칙), 본성 탐구와 재해석, 정적인 창의성, 온고지신의 문화가 도움이 됨"}},{"id":"19-25","type":"옳지 않은 것","q":"교안의 서양 중심 창의성 연구와 우리나라 교육에 대한 비교로 옳지 않은 것은?","box":null,"choices":["서양 중심의 창의성 연구는 개인의 자유와 다양성을 강조한다.","서양 중심의 창의성 연구는 개방성과 독창성을 강조한다.","우리나라는 모든 교과목에서 높은 점수를 받아야 하는 대학입시제도를 강조했다.","우리나라는 교과지식 암기 위주의 교육제도를 강조했다.","우리나라는 개방적인 토의와 독창성을 강조하는 교육으로 창의성을 쉽게 길러왔다."],"answer":5,"explain":"교안: 우리나라는 대입제도와 교과지식 위주의 암기교육으로 창의성을 기르는 데 어려움을 겪은 것이 사실. 개방적 토의와 독창성 강조는 서양 중심 창의 연구의 특징.","source":{"page":21,"section":"한국인의 창의 DNA","quote":"서양 중심의 창의성 연구는 개인의 자유와 다양성, 개방성과 독창성을 강조 반면 우리나라는 모든 교과목에서 높은 점수를 받아야 하는 대학입시제도와 교과지식 암기 위주의 교육제도를 강조"}}]},{"lesson":20,"title":"영재의 정의적·사회적 특성은 무엇일까? (1)","file":"4. 교안 (1~30)/20.pdf","summary":["영재성의 3대 영역: 인지적 능력(지능, 창의성) / 정의적 특성(동기, 자아존중감) / 사회적 특성(리더십, 대인관계)","인지적 능력이 높다는 것은 널리 인정됨. 정의적·사회적 특성은 인지적 특성과 조화 또는 부조화(비동시적 발달) 가능","홀링워스: 미국 뉴욕 고교 자퇴자 4명 중 1명은 영재 → 정서함양, 도덕심 함양, 자기주도적 학습태도 함양과 상담 등 프로그램 제공 필요","사례: 영재학교 떠나는 영재들(YTN 2023.08.25), 조기입학 영재 제때 입학보다 중도포기율 높아(한국일보 2023.10.11)","영재의 정의적·사회적 특성(이신동 외, 2020): 타인 기대에 민감, 간섭 없이 혼자 해결, 반복 싫어함, 높은 도덕성, 과제집착력, 정규수업 흥미 상실, 완벽 추구 스트레스, 높은 자아개념","학업성취도 영향 변인: 인지적 변인 = 지능, 정서적 변인 = 동기","동기: 행동 유발 → 목표 지향 → 목표 도달 시 행동 강화(학습동기, 성취동기, 친화동기 등)","내적동기 = 외부 보상 없이 일에 대한 열정 / 외적동기 = 외부 보상, 타인의 인정, 승인, 상벌, 통제, 압력, 지시","과거: 내적 동기 높으면 외적 동기 낮음 / 현대: 4가지 성향(1.내고외고 2.내고외저 3.내저외저 4.내저외고) 중 하나","렌줄리 세고리모형의 하나 = 과제집착력","애머바일(하버드 화학과 수석 졸업): 노벨상 수상자 공통 특성 = 일에 대한 열정, 과제에 대한 추진력, 몰입","델코트: 도전적 프로그램이 흥미와 호기심, 자기만족감, 향학열, 도전의식, 자기표현 욕구 충족 / 히로나카 헤이스케: 남보다 2~3배의 시간 투자"],"questions":[{"id":"20-01","type":"옳지 않은 것","q":"교안에 제시된 영재성의 3대 영역과 그 예의 연결로 옳지 않은 것은?","box":null,"choices":["인지적 능력 – 지능","인지적 능력 – 창의성","정의적 특성 – 리더십","정의적 특성 – 자아존중감","사회적 특성 – 대인관계"],"answer":3,"explain":"교안: 인지적 능력(지능, 창의성), 정의적 특성(동기, 자아존중감), 사회적 특성(리더십, 대인관계). 리더십은 사회적 특성.","source":{"page":4,"section":"영재의 정의적・사회적 특성은 무엇일까?","quote":"인지적 능력(지능, 창의성) / 정의적 특성(동기, 자아존중감) / 사회적 특성(리더십, 대인관계)"}},{"id":"20-02","type":"옳지 않은 것","q":"교안의 ‘영재의 정의적·사회적 특성은 무엇일까?’에서 제기한 질문이 아닌 것은?","box":null,"choices":["학습동기가 높다면 내·외적 동기 중에서 어느 동기가 더 높으며, 왜 그럴까?","자신에 대한 신념과 평가인 자아개념은 긍정적일까 아니면 부정적일까?","주변 친구들을 널리 많이 사귈까, 아니면 소수로 깊게 사귈까?","머리가 좋다면 성격도 좋을까? 학교생활의 만족도는 높을까?","영재의 지능은 유전으로 결정될까, 환경으로 결정될까?"],"answer":5,"explain":"①②③은 p3, ④는 p4의 질문이다. ⑤ 유전 vs 환경은 19차시(지능의 이슈) 내용으로, 이 쪽의 질문이 아니다.","source":{"page":3,"section":"영재의 정의적・사회적 특성은 무엇일까?","quote":"학습동기가 높다고 한다면 내ㆍ외적 동기 중에서 어느 동기가 더 높으며, 왜 그럴까? 자신에 대한 신념과 평가인 자아개념은 긍정적일까 아니면 부정적일까?"}},{"id":"20-03","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재성의 3대 영역인 인지적 능력, 정의적 특성, 사회적 특성 간의 관계는 어떠할까? … 조화를 이룬다면 혹은 조화를 이루지 못한다면 어떠한 영재교육과 (   )을 해야 할까?","choices":["심리상담","조기입학","월반","지능검사","대입지도"],"answer":1,"explain":"교안: ‘어떠한 영재교육과 심리상담을 해야 할까?’ 영재의 심리적 특성에 대한 관심과 질문은 꼬리에 꼬리를 물고 계속될 수 있다.","source":{"page":5,"section":"영재의 정의적・사회적 특성은 무엇일까?","quote":"조화를 이룬다면 혹은 조화를 이루지 못한다면 어떠한 영재교육과 심리상담을 해야 할까?"}},{"id":"20-04","type":"개념 찾기","q":"영재의 정의적·사회적 특성이 인지적 특성과 조화를 이루지 못하는 현상을 교안에서는 무엇이라고 표현하는가?","box":null,"choices":["식역 현상","피그말리온 효과","과제집착력","비동시적 발달","우수아 신드롬"],"answer":4,"explain":"정의적·사회적 특성은 긍정적 또는 부정적 측면으로 나타나 인지적 특성과 조화 또는 부조화를 이룰 수 있음(비동시적 발달). ① 식역은 지능-창의성 관계 ② 피그말리온은 교사 기대 효과 ③ 렌줄리 세고리 ⑤ 완벽주의의 부정적 특성.","source":{"page":6,"section":"영재의 정의적・사회적 특성은 무엇일까?","quote":"인지적 특성과 조화를 이루거나 부조화를 이룰 수도 있음(비동시적 발달)"}},{"id":"20-05","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"미국 뉴욕 고교 자퇴자 (   ) 중 1명은 영재 (홀링워스)","choices":["3명","4명","5명","10명","2명"],"answer":2,"explain":"교안 p6: 미국 뉴욕 고교 자퇴자 4명 중 1명은 영재(홀링워스). 그래서 영재들에게 정서함양, 도덕심 함양, 자기주도적 학습태도 함양과 상담 등 프로그램을 제공해야 한다.","source":{"page":6,"section":"영재의 정의적・사회적 특성은 무엇일까?","quote":"미국 뉴욕 고교 자퇴자 4명 중 1명은 영재(홀링워스)"}},{"id":"20-06","type":"보기 조합","q":"교안에서 영재들에게 제공해야 한다고 제시한 프로그램을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 정서함양\nㄴ. 도덕심 함양\nㄷ. 자기주도적 학습태도 함양과 상담\nㄹ. 선행학습 중심의 속진 프로그램","choices":["ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":2,"explain":"교안: 정서함양, 도덕심 함양, 자기주도적 학습태도 함양과 상담 등 각종 프로그램 제공. ㄹ은 교안에 없다.","source":{"page":6,"section":"영재의 정의적・사회적 특성은 무엇일까?","quote":"영재들에게 정서함양, 도덕심 함양, 자기주도적 학습태도 함양과 상담 등 각종 프로그램들을 제공해야 함"}},{"id":"20-07","type":"옳은 것","q":"교안의 사례2 ‘대학만 보고 질주하는 영재학교엔, 조기입학 어린 영재 설 자리가 없다’(한국일보 2023.10.11)의 내용으로 옳은 것은?","box":null,"choices":["조기입학 영재는 제때 입학한 학생보다 중도포기율이 낮다.","영재고는 대입보다 어린 영재 배려를 최우선 과제로 삼는다.","전문가는 영재학교 입학 연령을 더 낮추어야 한다고 제안했다.","전문가는 영재학교 대입 부담을 덜고 대인관계 교육을 해야 한다고 했다.","이 사례는 YTN 2023.08.25 보도이다."],"answer":4,"explain":"기사 요점: 조기입학 영재, 제때 입학보다 중도포기율 높아 / 영재고도 대입이 지상과제… 어린 영재 배려 못해 / 전문가 ‘영재학교 대입 부담 덜고 대인관계 교육’. ⑤ YTN 2023.08.25는 사례1(영재학교 떠나는 영재들).","source":{"page":8,"section":"사례2: 대학만 보고 질주하는 영재학교엔, 조기입학 어린 영재 설 자리가 없다","quote":"• 조기입학 영재, 제때 입학보다 중도포기율 높아 • 영재고도 대입이 지상과제... 어린 영재 배려 못해 • 전문가 “영재학교 대입 부담 덜고 대인관계 교육”"}},{"id":"20-08","type":"옳은 것","q":"교안 사례1 ‘영재학교 떠나는 영재들…한국 영재교육 어디로?’의 출처로 옳은 것은?","box":null,"choices":["한국일보 2023.10.11","아시아경제 2011.4.6","YTN 2023.10.11","한국일보 2023.08.25","YTN 2023.08.25"],"answer":5,"explain":"사례1은 YTN 2023.08.25, 사례2는 한국일보 2023.10.11. 아시아경제 2011.4.6은 19차시 ‘한국인 창의 DNA’ 사례.","source":{"page":7,"section":"영재의 정의적・사회적 특성은 무엇일까?","quote":"사례1 : 영재학교 떠나는 영재들…한국 영재교육 어디로?(YTN 2023.08.25)"}},{"id":"20-09","type":"옳지 않은 것","q":"교안의 ‘영재의 정의적·사회적 특성 정리’(이신동, 이정규, 박춘성, 2020) 내용으로 옳지 않은 것은?","box":null,"choices":["다른 사람의 기대에 둔감하여 잘 반응하지 않는다.","간섭 없이 혼자 해결하는 것을 좋아한다.","반복적인 것을 싫어하고 새로운 것을 시도해 보려고 한다.","도덕성이 높아 보다 이상적인 가치를 추구하려 한다.","사회적인 문제에 대해 수준 높은 도덕적 사고를 하고 토론하려 한다."],"answer":1,"explain":"교안: ‘다른 사람의 기대에 민감하게 반응함’. ①은 반대 서술. ②~⑤는 교안 그대로.","source":{"page":9,"section":"영재의 정의적・사회적 특성 정리","quote":"다른 사람의 기대에 민감하게 반응함 간섭 없이 혼자 해결하는 것을 좋아함 반복적인 것을 싫어하고 새로운 것을 시도해 보려고 함"}},{"id":"20-10","type":"옳은 것","q":"교안의 ‘영재의 정의적·사회적 특성 정리’ 내용으로 옳은 것은?","box":null,"choices":["학습속도가 느리기 때문에 정규 학교수업에 흥미를 잃는다.","과제를 대충 수행하려 하기 때문에 스트레스가 적다.","학습속도가 빠르기 때문에 정규 학교수업에 흥미를 잃고, 공부를 하지 않거나 문제행동을 일으키는 경우도 있다.","자아개념이 낮고 자기주장이 약하다.","자신이 하는 일에 관심이 적고 과제집착력이 낮다."],"answer":3,"explain":"교안: 학습속도가 빠르기 때문에 정규수업에 흥미를 잃고 문제행동을 일으키기도 함. ① 느리기 → 빠르기 ② 완벽하게 수행하려 해 스트레스 ④ 자아개념 높고 자신감·자기주장 강함 ⑤ 관심 많고 과제집착력 높음.","source":{"page":10,"section":"영재의 정의적・사회적 특성 정리","quote":"학습속도가 빠르기 때문에 정규 학교수업에 흥미를 잃고, 공부를 하지 않거나 문제행동을 일으키는 경우도 있음"}},{"id":"20-11","type":"빈칸","q":"다음 (가), (나)에 들어갈 말로 알맞은 것은?","box":"학업성취도에 대한 지금까지의 연구들을 고찰해 볼 때, 인지적 변인으로서는 (가)이, 정서적 변인으로서는 (나)가 학생들의 학업성취도에 가장 많은 영향력을 주고 있음이 밝혀졌음","choices":["(가) 창의성 (나) 동기","(가) 지능 (나) 자아개념","(가) 창의성 (나) 자아존중감","(가) 지능 (나) 동기","(가) 동기 (나) 지능"],"answer":4,"explain":"인지적 변인 = 지능, 정서적 변인 = 동기. 교육학과 심리학(행동과학)은 학업성취도를 설명·예측하는 변인을 연구한다.","source":{"page":12,"section":"영재의 학업성취도를 어떻게 예측할 것인가?","quote":"인지적 변인으로서는 지능이, 정서적 변인으로서는 동기가 학생들의 학업성취도에 가장 많은 영향력을 주고 있음이 밝혀졌음"}},{"id":"20-12","type":"옳지 않은 것","q":"동기(motivation)에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["목표에 도달되면 유발된 행동을 약화시켜 소거하는 기능을 한다.","인간의 행동을 설명하고 예측하는 중요한 심리학적 개념이다.","개인의 행동을 유발한다.","일정한 목표로 지향하게 만든다.","학습동기, 성취동기, 친화동기 등이 있다."],"answer":1,"explain":"교안: 목표에 도달되면 유발된 행동을 더욱 ‘강화’시켜 주는 기능. ①은 반대 서술.","source":{"page":13,"section":"동기(motivation)란?","quote":"개인의 행동을 유발하고, 일정한 목표로 지향하게 만들며, 목표에 도달되면 유발된 행동을 더욱 강화시켜 주는 기능 학습동기, 성취동기, 친화동기 등"}},{"id":"20-13","type":"보기 조합","q":"학습동기의 기능으로 교안에 제시된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 학생의 학습행동을 유발\nㄴ. 학습목표에 도달할 수 있도록 방향을 유지시킴\nㄷ. 학습목표에 도달되면 학습행동이 더욱 강화됨\nㄹ. 외부 보상이 없으면 학습행동을 중단시킴","choices":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"answer":5,"explain":"학습동기: 학습행동 유발, 방향 유지, 목표 도달 시 학습행동 강화. ㄹ은 교안에 없다.","source":{"page":14,"section":"학습동기란?","quote":"학생의 학습행동을 유발 학습목표에 도달할 수 있도록 방향을 유지시킴 학습목표에 도달되면 학습행동이 더욱 강화되는 기능을 수행"}},{"id":"20-14","type":"개념 찾기","q":"다음 설명에 해당하는 동기는?","box":"외부의 보상이 없더라도 일에 대한 열정으로 행동하는 동기로, 일(공부)하는 자체가 즐겁고, 흥미와 관심이 있기에 도전하고, 스스로 만족스럽기 때문에 행동하는 동기","choices":["외적동기","친화동기","내적동기","성취동기","결핍동기"],"answer":3,"explain":"내적동기의 정의. 외적동기는 일 자체와는 다른 외부 보상이나 타인의 인정, 승인, 상벌, 통제, 압력, 지시로 일하는 동기.","source":{"page":15,"section":"내적동기 vs 외적동기","quote":"외부의 보상이 없더라도 일에 대한 열정으로 행동하는 동기 ‣ 일(공부)하는 자체가 즐겁고, 흥미와 관심이 있기에 도전하고, 스스로 만족스럽기 때문에 행동하는 동기"}},{"id":"20-15","type":"사례","q":"다음 사례의 학생에게 주로 작용하는 동기로 교안에 근거해 가장 알맞은 것은?","box":"민수는 수학 공부 자체에는 흥미가 없지만, 부모님이 성적이 오르면 용돈을 올려 주겠다고 하고 선생님께 칭찬(인정)을 받고 싶어서 매일 문제집을 푼다.","choices":["내적동기","외적동기","과제집착력","자기효능감","지적 호기심"],"answer":2,"explain":"일 자체와는 다른 외부 보상(용돈)이나 타인의 인정으로 일하는 동기 = 외적동기. 내적동기는 외부 보상 없이 일 자체의 즐거움·흥미로 행동.","source":{"page":15,"section":"내적동기 vs 외적동기","quote":"일 자체와는 다른 어떤 외부 보상이나 타인의 인정, 승인, 상벌, 통제, 압력, 지시로 일하는 동기"}},{"id":"20-16","type":"옳은 것","q":"내적 동기 vs 외적 동기의 최근 연구경향에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["현대에는 내적 동기가 높으면 외적 동기가 낮다고 본다.","과거에는 내외적 동기의 4가지 성향 중 어느 하나를 가진다고 보았다.","현대에는 내외적 동기를 3가지 성향으로 구분한다.","4가지 성향 중 ‘1’은 내저외저이다.","현대에는 내외적 동기의 4가지 성향 중 어느 하나를 가지고 있다고 본다."],"answer":5,"explain":"과거: 내적 동기 높으면 외적 동기 낮음 / 현대: 4가지 성향(1.내고외고 2.내고외저 3.내저외저 4.내저외고) 중 하나. ①② 과거와 현대 뒤바뀜 ③ 4가지 ④ 1은 내고외고, 내저외저는 3.","source":{"page":16,"section":"내적동기 vs 외적동기의 최근 연구경향","quote":"과거 / ‣ 내적 동기가 높으면 외적 동기가 낮음 현대 / ‣ 내외적 동기의 4가지 성향 중 어느 하나를 가지고 있음"}},{"id":"20-17","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"렌줄리(Renzulli)는 사회적으로 성공한 영재들이 지닌 3가지 특성을 ‘세고리모형’으로 소개하면서 그중의 하나를 ‘(   )’이라고 함","choices":["자아존중감","과제집착력","자기효능감","도덕심","내적동기"],"answer":2,"explain":"렌줄리 세고리모형의 3가지 특성 중 하나 = 과제집착력.","source":{"page":17,"section":"렌줄리(Renzulli)의 ‘세고리모형’","quote":"사회적으로 성공한 영재들이 지닌 3가지 특성을 ‘세고리모형’으로 소개하면서 그중의 하나를 ‘과제집착력’이라고 함"}},{"id":"20-18","type":"옳지 않은 것","q":"렌줄리가 말한 ‘과제집착력’에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["과제를 수행하는 도중에는 주위의 사물이나 상황에 의해 영향을 받지 않는 것","문제가 쉽게 해결되지 않아도 포기하지 않고 끝까지 노력하는 것","여러 가지 일을 동시에 빠르게 바꾸어 가며 처리하는 것","관심 있는 문제에 사로잡혀 있을 때 떼어 놓기가 힘든 것","오랫동안 한 가지 일에 몇 시간씩 집중할 수 있는 것"],"answer":3,"explain":"과제집착력은 오랫동안 한 가지 일에 몇 시간씩 집중하는 것. ③ 여러 일을 바꾸어 처리는 교안에 없고 반대 성격.","source":{"page":17,"section":"렌줄리(Renzulli)의 ‘세고리모형’","quote":"문제가 쉽게 해결되지 않아도 포기하지 않고 끝까지 노력하는 것 ‣ 관심 있는 문제에 사로잡혀 있을 때 떼어 놓기가 힘든 것 ‣ 오랫동안 한 가지 일에 몇 시간씩 집중할 수 있는 것"}},{"id":"20-19","type":"개념 찾기","q":"다음 설명에 해당하는 학자는?","box":"하버드대학교 화학과 수석 졸업 후 심리학을 전공하며 “왜 공부는 즐겁지 않는가?”를 연구하였고, 노벨상 수상자들을 면접한 결과 이들의 공통적 특성으로 일에 대한 열정과 과제에 대한 추진력, 몰입을 꼽았다.","choices":["애머바일(Amabile)","델코트(Delcourt)","렌줄리(Renzulli)","홀링워스(Hollingworth)","히로나카 헤이스케"],"answer":1,"explain":"애머바일의 연구. ② 델코트는 도전적인 프로그램이 욕구 충족 ③ 렌줄리는 세고리모형 ④ 홀링워스는 뉴욕 고교 자퇴자 ⑤ 히로나카는 2~3배 시간 투자.","source":{"page":18,"section":"애머바일(Amabile)의 연구","quote":"애머바일은 하버드대학교 화학과 수석 졸업 후 심리학 전공을 하며 “왜 공부는 즐겁지 않는가?”를 연구 노벨상 수상자들을 면접한 결과, 이들의 공통적 특성으로 일에 대한 열정과 과제에 대한 추진력, 몰입을 꼽음"}},{"id":"20-20","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"영재에게서 보이는 높은 학습동기는 (   )이 높은 수준의 사고력, 논리적 능력과 결합되어 나타남","choices":["외적 보상","자아존중감","과제집착력","지적 호기심","도덕심"],"answer":4,"explain":"교안 p18: 높은 학습동기는 지적 호기심이 높은 수준의 사고력, 논리적 능력과 결합되어 나타남.","source":{"page":18,"section":"애머바일(Amabile)의 연구","quote":"영재에게서 보이는 높은 학습동기는 지적 호기심이 높은 수준의 사고력, 논리적 능력과 결합되어 나타남"}},{"id":"20-21","type":"사례","q":"다음 학생의 진술을 사례로 들어, 도전적인 프로그램이 흥미와 호기심, 자기만족감, 향학열, 도전의식, 자기표현과 같은 욕구를 충족시켜 준다고 한 연구자는?","box":"“내가 왜 컴퓨터 프로그램을 열심히 만드는가? 나는 뭔가를 보고 그것이 어떻게 작동하는지 모르면 궁금해한다. … 내가 프로그램을 만드는 동기는 점수를 원하거나 돈이 필요해서가 아니라 나 자신을 표현하기 위해서다.”","choices":["애머바일","렌줄리","델코트","홀링워스","카네스와 빈"],"answer":3,"explain":"델코트(Delcourt) 연구. 점수나 돈(외적 보상)이 아니라 자기표현을 위해 프로그램을 만든다는 내적동기 사례이다.","source":{"page":19,"section":"델코트(Delcourt) 연구","quote":"도전적인 프로그램이 흥미와 호기심, 자기만족감, 향학열, 도전의식, 자기표현과 같은 욕구를 충족시켜 준다고 함"}},{"id":"20-22","type":"빈칸","q":"일본의 수학자 히로나카 헤이스케의 말로 교안에 제시된 다음 문장의 (   )에 들어갈 말은?","box":"어떤 문제에 부딪히면, 나는 미리 남보다 (   )의 시간을 투자할 각오를 한다.","choices":["1.5배","5~6배","10배","2~3배","1만 시간"],"answer":4,"explain":"교안 p20: ‘남보다 2~3배의 시간을 투자할 각오를 한다’(히로나카 헤이스케, 학문의 즐거움). 영재의 높은 학습동기를 보여주는 예.","source":{"page":20,"section":"영재의 학습동기","quote":"어떤 문제에 부딪히면, 나는 미리 남보다 2~3배의 시간을 투자할 각오를 한다. / 일본의 수학자 히로나카 헤이스케"}}]},{"lesson":21,"title":"영재의 정의적·사회적 특성은 무엇일까? (2)","file":"4. 교안 (1~30)/21.pdf","summary":["Self = 자기(自己), 일반적 용어, 자아로도 번역 / Ego = 자아(自我), 정신분석학·임상심리·상담심리·심리치료 등","자아개념(Self-concept): “나는 누구인가” – 자신의 능력, 흥미, 목표 등에 대한 체계화된 내적 생각과 태도의 복합체, 자기효능감·자아존중감 등을 포괄","자아개념 구분: 긍정적/부정적, 내용에 따라 학업적/신체적/사회적. 학업적 자아개념에는 교사의 태도와 평가가 가장 많은 영향(예: 피그말리온 효과)","영재의 자기 표현 용어: 열심히 공부하는, 적극적, 자발적, 외향적, 도전적, 독립적 → 긍정적 자아개념 성향 강함","부정적 자아개념 요인: 높은 기대로 인한 실패 경험, 자신의 능력에 대한 비판적 태도, 우수한 영재들끼리의 비교","자아존중감(self-esteem): “나는 소중한 사람” – 자신의 가치, 능력, 성공과 실패에 대한 자부심과 존중하는 능력","자아존중감 높이는 전략: 작은 성과도 칭찬, 부정적 생각을 긍정적으로, 자신을 위한 시간·스트레스 해소","자기효능감(Self-efficacy): “나는 잘할 수 있어” – 특정한 과제 또는 도전을 수행할 능력과 자신감","자기효능감 높이는 전략: 목표 세우고 노력, 실패를 배움의 기회로, 학습일지·오답일지 기록(기록은 기억을 지배함)","리더십은 타고난 재능이 아니며 학습과 개발을 통해 향상될 수 있는 능력","카네스와 빈(Karnes \u0026 Bean): 유능한 리더와 영재학생 모두 언어능력 뛰어남, 비전, 논리적·비판적 사고, 창의적·책임감·융통성 있는 선도자 / 리더적 자질 = 뛰어난 능력, 사회에 대한 헌신, 도덕성"],"questions":[{"id":"21-01","type":"옳은 것","q":"교육학과 심리학에서 Self와 Ego에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["Self는 정신분석학에서 주로 쓰는 전문 용어이다.","Self는 자기(自己)로, 일반적인 용어이며 자아로도 번역된다.","Ego는 자기(自己)로 번역되는 일반적인 용어이다.","Ego는 교육학에서만 사용된다.","Self와 Ego는 모두 정신분석학 용어로만 쓰인다."],"answer":2,"explain":"Self = 자기(自己), 일반적인 용어, 자아로도 번역 / Ego = 자아(自我), 정신분석학·임상심리·상담심리·심리치료 등. ①③⑤ 뒤바꿈·왜곡 ④ 교안에 없음.","source":{"page":3,"section":"영재의 자아개념","quote":"Self / ‣ 자기, 自己, 일반적인 용어, 자아로도 번역 Ego / ‣ 자아, 自我, 정신분석학, 임상심리, 상담심리, 심리치료 등"}},{"id":"21-02","type":"옳지 않은 것","q":"교안에서 Ego(자아, 自我)라는 용어를 주로 사용하는 분야로 제시하지 않은 것은?","box":null,"choices":["정신분석학","임상심리","상담심리","행동주의 학습이론","심리치료"],"answer":4,"explain":"교안: Ego는 정신분석학, 임상심리, 상담심리, 심리치료 등. 행동주의 학습이론은 제시되지 않았다.","source":{"page":3,"section":"영재의 자아개념","quote":"자아, 自我, 정신분석학, 임상심리, 상담심리, 심리치료 등"}},{"id":"21-03","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"자아개념이란 자신의 능력, 흥미, 목표 등에 대한 체계화된 내적 생각과 태도의 (   )를 의미함","choices":["복합체","총합","평균","단일 요소","외적 평가"],"answer":1,"explain":"교안: ‘체계화된 내적 생각과 태도의 복합체’. 자아개념은 자기효능감, 자아존중감 등의 개념들을 포괄하는 보다 심리학적 개념이다.","source":{"page":4,"section":"자아개념(Self-concept)","quote":"자아개념이란 자신의 능력, 흥미, 목표 등에 대한 체계화된 내적 생각과 태도의 복합체를 의미함"}},{"id":"21-04","type":"옳은 것","q":"교안에 제시된 개념과 대표 문장의 연결로 옳은 것은?","box":null,"choices":["자아개념 – “나는 잘할 수 있어”","자아존중감 – “나는 누구인가”","자아존중감 – “나는 소중한 사람”","자기효능감 – “나는 소중한 사람”","자기효능감 – “나는 어떤 존재이며, 어떤 능력을 지니고 있는가?”"],"answer":3,"explain":"자아개념 = “나는 누구인가”, “나는 어떤 존재이며, 어떤 능력을 지니고 있는가?” / 자아존중감 = “나는 소중한 사람” / 자기효능감 = “나는 잘할 수 있어”.","source":{"page":8,"section":"자아존중감(self-esteem)","quote":"“나는 소중한 사람” 자신을 사랑하고 받아들이며"}},{"id":"21-05","type":"옳지 않은 것","q":"자아개념(Self-concept)에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["긍정적 자아개념과 부정적 자아개념으로 구분한다.","내용에 따라 학업적/신체적/사회적 자아개념 등으로 구분한다.","자신의 학업성취에 대한 관찰과 평가, 타인의 평가와 인정에 따라 학업적 자아개념을 형성해 나간다.","자기효능감, 자아존중감 등의 개념들을 포괄하는 보다 심리학적 개념이다.","학업적 자아개념 형성에는 부모의 태도와 평가가 가장 많은 영향을 미친다."],"answer":5,"explain":"교안: ‘특히, 교사의 태도와 평가가 가장 많은 영향을 미침(예: 피그말리온 효과)’. 부모 → 교사.","source":{"page":5,"section":"자아개념(Self-concept)","quote":"특히, 교사의 태도와 평가가 가장 많은 영향을 미침 / ‣ 예 : 피그말리온 효과"}},{"id":"21-06","type":"사례","q":"다음 사례에서 학생의 학업적 자아개념 형성에 작용한 것으로 교안이 예로 든 효과는?","box":"담임교사가 평소 ‘너는 수학에 재능이 있어’라고 기대를 표현하며 긍정적으로 평가해 주자, 학생은 스스로를 수학을 잘하는 사람으로 인식하게 되었고 실제로 성적도 올랐다.","choices":["우수아 신드롬","식역 효과","피그말리온 효과","해석의 주지화","건전한 속임수"],"answer":3,"explain":"교사의 태도와 평가가 학업적 자아개념에 가장 많은 영향을 미친다는 예로 교안은 피그말리온 효과를 든다. ① 완벽주의의 부정적 특성 ② 지능-창의성 식역이론 ④ 방어기제 ⑤ 홀링워스가 지적한 영재의 비도덕성.","source":{"page":5,"section":"자아개념(Self-concept)","quote":"특히, 교사의 태도와 평가가 가장 많은 영향을 미침 / ‣ 예 : 피그말리온 효과"}},{"id":"21-07","type":"옳지 않은 것","q":"교안에서 영재들이 자신을 표현할 때 많이 사용하는 용어로 제시하지 않은 것은?","box":null,"choices":["열심히 공부하는","적극적","자발적","도전적","내성적"],"answer":5,"explain":"교안: ‘열심히 공부하는, 적극적, 자발적, 외향적, 도전적, 독립적’. ‘내성적’이 아니라 ‘외향적’. 영재들의 자아개념은 긍정적 자아개념의 성향이 강하다.","source":{"page":6,"section":"영재의 자아개념","quote":"영재들은 자신을 표현할 때 ‘열심히 공부하는, 적극적, 자발적, 외향적, 도전적, 독립적’과 같은 용어를 많이 사용함 영재들의 자아개념은 긍정적 자아개념의 성향이 강함"}},{"id":"21-08","type":"보기 조합","q":"교안에서 영재가 부정적 자아개념을 가질 수 있는 요인으로 제시한 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 자신의 높은 기대로 인한 실패 경험\nㄴ. 자신의 능력에 대한 비판적 태도\nㄷ. 우수한 영재들끼리의 비교를 통해 자신을 열등하게 평가\nㄹ. 사회적으로 영재라는 인정과 판별을 받음","choices":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"ㄱ·ㄴ·ㄷ은 부정적 자아개념 요인. ㄹ 영재라는 인정과 판별은 일반아동보다 ‘긍정적’ 자아개념 형성에 기여하는 요인(자신의 높은 지적 능력과 높은 포부수준 인지와 함께).","source":{"page":7,"section":"영재가 가질 수 있는 자아개념(self-concept)","quote":"자신의 높은 기대로 인한 실패 경험 • 자신의 능력에 대한 비판적 태도 • 우수한 영재들끼리의 비교를 통해 자신을 열등하게 평가하면 부정적인 자아개념과 낮은 자아존중감을 가질 수 있음"}},{"id":"21-09","type":"사례","q":"다음 사례의 학생에 대한 교안 기반 해석으로 가장 알맞은 것은?","box":"초등학교에서 늘 1등이던 지우는 과학영재학교에 입학한 뒤, 자기보다 뛰어난 친구들과 자신을 계속 비교하면서 ‘나는 별로 잘하는 게 없다’고 느끼고 자신감을 잃었다.","choices":["우수한 영재들끼리의 비교로 자신을 열등하게 평가해 부정적 자아개념과 낮은 자아존중감을 가질 수 있다.","영재라는 인정과 판별을 받았으므로 반드시 긍정적 자아개념을 형성한다.","자기효능감이 높아 실패를 배움의 기회로 받아들이고 있다.","교사의 태도와 평가에 따른 피그말리온 효과가 나타난 것이다.","식역 수준을 넘어 창의성과 지능의 상관이 사라진 것이다."],"answer":1,"explain":"우수한 영재들끼리의 비교를 통해 자신을 열등하게 평가하면 부정적인 자아개념과 낮은 자아존중감을 가질 수 있다(p7). ② ‘반드시’ 아님 ③ 사례와 반대 ④⑤ 관련 없음.","source":{"page":7,"section":"영재가 가질 수 있는 자아개념(self-concept)","quote":"우수한 영재들끼리의 비교를 통해 자신을 열등하게 평가하면 부정적인 자아개념과 낮은 자아존중감을 가질 수 있음"}},{"id":"21-10","type":"개념 찾기","q":"다음 설명에 해당하는 개념은?","box":"자신을 사랑하고 받아들이며, 자신의 가치, 능력, 성공과 실패에 대한 자부심과 존중하는 능력으로, 자신에게 대화를 나누는 방식과 자신의 감정과 생각에 대해 긍정적으로 대처하는 방식에도 영향을 미친다.","choices":["자기효능감","자아존중감","자아개념","리더십","과제집착력"],"answer":2,"explain":"자아존중감(self-esteem)의 정의. 자기효능감은 특정 과제 수행 능력과 자신감, 자아개념은 능력·흥미·목표 등에 대한 내적 생각과 태도의 복합체.","source":{"page":8,"section":"자아존중감(self-esteem)","quote":"자신을 사랑하고 받아들이며, 자신의 가치, 능력, 성공과 실패에 대한 자부심과 존중하는 능력 자기존중감은 자신에게 대화를 나누는 방식과 자신의 감정과 생각에 대해 긍정적으로 대처하는 방식에도 영향을 미침"}},{"id":"21-11","type":"옳은 것","q":"영재에게 자아존중감이 중요한 이유에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["영재는 자신의 특별한 능력을 드러내지 않고 겸손하게 감추는 것이 중요하다.","높은 자아존중감은 타인과의 관계보다 경쟁에서 이기는 능력을 키워준다.","영재의 높은 자아존중감은 자신의 능력과 가치를 믿고 꿈을 펼치고 이룰 수 있는 자신감을 키워준다.","자아존중감은 타인을 존중하는 능력과는 관련이 없다.","영재의 자아존중감은 학업성취와 무관하므로 별도로 지도할 필요가 없다."],"answer":3,"explain":"교안: 높은 자아존중감은 자신의 능력과 가치를 믿고 꿈을 펼치고 이룰 수 있는 자신감을 키워줌. 영재는 자신의 특별한 능력과 잠재력을 인정하고 자부심과 존중을 가지는 것이 중요하며, 타인과의 관계에서 상호존중의 기반을 형성하는 능력을 키워주는 것이 중요하다. ①②④⑤ 교안과 반대.","source":{"page":9,"section":"영재에게 자아존중감이 왜 중요한가?","quote":"영재의 높은 자아존중감은 자신의 능력과 가치를 믿고 자신의 꿈을 펼치고 이룰 수 있는 자신감을 키워줌"}},{"id":"21-12","type":"옳지 않은 것","q":"교안에 제시된 영재의 자아존중감을 높이는 전략으로 옳지 않은 것은?","box":null,"choices":["영재의 성취를 격려해 주고, 작은 성과도 칭찬해 주면서 성공의 기쁨을 느낄 수 있도록 한다.","자신에 대해 부정적으로 생각할 때, 긍정적인 생각으로 바꿔 준다.","자신에게 친절하고 격려해 주는 습관을 가지도록 한다.","자신을 위한 시간을 가지며 스트레스를 해소하고 원하는 일을 하도록 한다.","작은 성과는 칭찬하지 않고 큰 성과를 냈을 때만 칭찬하여 기준을 높인다."],"answer":5,"explain":"교안은 ‘작은 성과도 칭찬해 주면서’ 성공의 기쁨을 느끼게 하라고 한다. ⑤는 반대.","source":{"page":10,"section":"영재의 자아존중감을 높이는 전략","quote":"영재의 성취를 격려해 주고, 작은 성과도 칭찬해 주면서 성공의 기쁨을 느낄 수 있도록 함"}},{"id":"21-13","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"(   ): “나는 잘할 수 있어” – 특정한 과제 또는 도전에 대해 그것을 수행할 능력과 자신감을 갖는 것을 의미함","choices":["자아존중감","자아개념","내적동기","자기효능감(Self-efficacy)","과제집착력"],"answer":4,"explain":"자기효능감의 정의. 높은 자기효능감은 도전에 대한 긍정적인 태도와 더 높은 성취감에 영향을 준다.","source":{"page":12,"section":"자기효능감(Self-efficacy)","quote":"“나는 잘할 수 있어” 특정한 과제 또는 도전에 대해 그것을 수행할 능력과 자신감을 갖는 것을 의미함"}},{"id":"21-14","type":"옳은 것","q":"영재의 자기효능감에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["높은 자기효능감은 도전에 대해 회피적인 태도를 갖게 한다.","영재의 높은 자기효능감은 학습에 매우 긍정적인 영향을 준다.","자기효능감이 높은 영재는 어려운 과제를 피하고 쉬운 과제를 선호한다.","높은 자기효능감은 성취감과 관련이 없다.","자기효능감이 높으면 노력을 게을리하게 된다."],"answer":2,"explain":"교안: 영재의 높은 자기효능감은 학습에 매우 긍정적인 영향, 어려운 과제에 도전하며 실패를 극복할 동기를 갖고 노력을 게을리하지 않음. ①③④⑤ 반대 서술.","source":{"page":13,"section":"영재의 자기효능감(Self-efficacy)","quote":"영재의 높은 자기효능감은 학습에 매우 긍정적인 영향 어려운 과제에 도전하며, 실패를 극복할 수 있는 동기를 갖고, 노력을 게을리하지 않음"}},{"id":"21-15","type":"사례","q":"다음 교사의 지도는 교안의 어떤 전략에 해당하는가?","box":"김 교사는 영재반 학생들에게 자신의 성공을 주의 깊게 관찰하여 학습일지와 오답일지에 기록하도록 하고, “기록은 기억을 지배한다”고 강조하였다.","choices":["자아존중감을 높이는 전략","리더십을 계발하는 전략","자기효능감을 높이는 전략","외적동기를 강화하는 전략","도덕심을 함양하는 전략"],"answer":3,"explain":"학습일지·오답일지 기록(기록은 기억을 지배함)은 ‘영재의 자기효능감을 높이는 전략’에 제시. 같은 전략에 목표를 세우고 노력하기, 실패를 배움의 기회로 생각하기가 있다.","source":{"page":14,"section":"영재의 자기효능감을 높이는 전략","quote":"영재들에게 자신의 성공을 주의 깊게 관찰하여 학습일지, 오답일지 등에 기록하도록 함 / ‣ 기록은 기억을 지배함"}},{"id":"21-16","type":"옳지 않은 것","q":"리더십에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["조직의 비전과 방향을 제시해 준다.","구성원의 다양한 활동에 영향을 미쳐 변화시켜 나가는 능력이다.","조직의 성공에 기여한다.","학습과 개발을 통해 향상될 수 있는 능력이다.","리더십은 타고난 재능이므로 교육으로 향상되기 어렵다."],"answer":5,"explain":"교안: ‘리더십은 타고난 재능이 아니며, 학습과 개발을 통해 향상될 수 있는 능력임’. ⑤는 반대.","source":{"page":15,"section":"리더십이란?","quote":"리더십은 타고난 재능이 아니며, 학습과 개발을 통해 향상될 수 있는 능력임"}},{"id":"21-17","type":"보기 조합","q":"영재를 사회적 리더로 활용하기 위해 리더십과 함께 계발되어야 한다고 교안에 제시된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 창의적 문제해결력\nㄴ. 미래에 대한 비전\nㄷ. 의사소통 능력\nㄹ. 학제간 융합으로 인한 시너지 효과 창출\nㅁ. 타인에 대한 배려","choices":["ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㅁ","ㄴ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":1,"explain":"교안: 리더십과 함께 창의적 문제해결력, 미래에 대한 비전, 의사소통 능력, 학제간 융합으로 인한 시너지 효과 창출, 타인에 대한 배려 등이 계발되어야 영재의 능력이 충분히 활용되고 실질적으로 사회에 기여한다. 모두 해당.","source":{"page":16,"section":"영재의 리더십","quote":"리더십과 함께 창의적 문제해결력, 미래에 대한 비전, 의사소통 능력, 학제간 융합으로 인한 시너지 효과 창출, 타인에 대한 배려 등이 계발되어야만"}},{"id":"21-18","type":"개념 찾기","q":"다음 연구 내용을 제시한 연구자는?","box":"‣ 유능한 리더와 영재학생 모두 언어능력이 뛰어남\n‣ 비전을 가지고 있으며 문제를 해결하는 사람들임\n‣ 논리적이고 비판적인 사고를 할 수 있음\n‣ 창의적이고 책임감 있고 융통성 있는 선도자","choices":["리차슨과 벤보우","쿠르츠와 바이너트","카네스와 빈(Karnes \u0026 Bean)","터만과 오든","세일러와 브룩샤이"],"answer":3,"explain":"카네스와 빈의 영재 리더십 연구. ①② 귀인 연구(22차시) ④⑤ 영재성 조화 연구(24차시).","source":{"page":17,"section":"카네스와 빈(Karnes \u0026 Bean)의 연구","quote":"유능한 리더와 영재학생 모두 언어능력이 뛰어남 ‣ 비전을 가지고 있으며 문제를 해결하는 사람들임 ‣ 논리적이고 비판적인 사고를 할 수 있음"}},{"id":"21-19","type":"보기 조합","q":"교안에서 영재에게 기대되는 중요한 리더적 자질로 제시한 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 자신이 속한 분야에서 발휘할 뛰어난 능력\nㄴ. 사회에 대한 헌신\nㄷ. 도덕성\nㄹ. 경쟁에서의 승리욕","choices":["ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ","ㄷ, ㄹ"],"answer":2,"explain":"교안: 자신이 속한 분야에서 발휘할 뛰어난 능력과 사회에 대한 헌신, 도덕성이 중요한 리더적 자질로 기대됨. ㄹ은 교안에 없다.","source":{"page":17,"section":"카네스와 빈(Karnes \u0026 Bean)의 연구","quote":"자신이 속한 분야에서 발휘할 뛰어난 능력과 사회에 대한 헌신, 도덕성이 중요한 리더적 자질로 기대됨"}},{"id":"21-20","type":"옳은 것","q":"영재의 리더십과 자기효능감에 관한 교안의 설명으로 옳은 것은?","box":null,"choices":["영재들은 독특한 시각이 부족하여 선도적인 역할을 하기 어렵다.","목표를 세우지 않고 자유롭게 활동하는 것이 자기효능감 향상에 도움이 된다.","실패는 배움의 기회가 아니므로 어려운 문제를 피하도록 지도한다.","영재들은 창의적인 아이디어와 문제해결 능력을 가지고 있으며, 독특한 시각으로 선도적인 역할을 수행한다.","카네스와 빈은 유능한 리더와 영재학생이 언어능력에서 차이가 크다고 보았다."],"answer":4,"explain":"p16 그대로. ① 반대 ② 목표를 세우고 달성하기 위해 노력하는 것이 도움(p14) ③ 실패를 배움의 기회로 생각하도록(p14) ⑤ 모두 언어능력이 뛰어남(p17).","source":{"page":16,"section":"영재의 리더십","quote":"영재들은 창의적인 아이디어와 문제해결 능력을 가지고 있으며, 독특한 시각으로 선도적인 역할을 수행함"}}]},{"lesson":22,"title":"영재의 정의사회적 특성의 긍·부정적 영향","file":"4. 교안 (1~30)/22.pdf","summary":["귀인이론(attribution theory): 자신 또는 타인의 행동의 원인을 설명하는 이론. 원인 특성에 따라 3가지 분류 – 개인 내적(노력)/외적(운, chance), 통제 가능/불가능, 안정적/불안정적(과제, 시간)","영재는 자신감·독립심 강하고 내적 통제가 높음 → 결과를 바꾸려 더 열심히 노력, 목표 미성취 시 실망·좌절 경험","리차슨과 벤보우: 18-23세 수학영재, 성공 원인을 노력이나 능력 같은 내적 요소로 돌림 / 쿠르츠와 바이너트: 학문적 성공을 높은 지적 능력에 귀인","도덕심: 옳고 그름을 판단하고 실천하는 능력, 윤리적 리더십 발휘에 필수, 가치 있는 역할모델(교사, 부모, 친구, 미디어 등) 통해 학습 / 간디와 히틀러 중 간디를 영재로 꼽음","그로스(Gross): 10-13세 영재 도덕적 판단 검사 → 도덕적·윤리적 의식수준이 고등학생이나 대학생 수준, 반사회적 문제행동 덜 일으킴","영재교육의 어머니 홀링워스: 영재들의 비도덕성 지적, ‘건전한 속임수’ → 청소년 비행과 범죄로 발전 가능 경고, 정서함양과 상담 강조","정서적 민감성과 열정: 긍정(정서적 예민함, 공감성, 사랑과 수용 열망, 타인 기대 부응, 높은 에너지) / 부정(과잉욕심·과잉행동·과민반응 – ADHD로 오인 가능성, 해석의 주지화(방어기제))","완벽주의와 자기비판: 부정 = 우울, 자기비판과 자기비하, 타인 평가에 예민, 우수아 신드롬, 일중독(공부벌레) 또는 미성취","자아개념과 자기통제력: 부정 = 고집스럽고 의지가 강한 사람으로 보임, 타인 배려 부족, 비판·또래거부에 예민, 목표 미달성 시 좌절","내향성과 독립성: 부정 = 고집, 타협 어려움, 지시 거부, 부모·교사에게 동조 안 함, 고립·외톨이, 사회성 결여, 책에 몰두","도덕발달과 정의감: 긍정 = 진실·평등·공평 추구, 인류애 / 부정 = 비현실적 목표 설정 → 개혁 시도하다 좌절 또는 우울","도전성과 회피: 긍정 = 일상생활의 틀 싫어함, 새로운 것·도전적 일 선호 / 부정 = 전통과 권위에 도전하는 것으로 비춰짐, 실패 가능한 일은 시도조차 하지 않으려 함"],"questions":[{"id":"22-01","type":"개념 찾기","q":"다음 설명에 해당하는 이론은?","box":"사람들이 자신 또는 타인의 행동의 원인을 설명하는 이론으로, 인간의 행동을 이해하고 예측하는 데 중요한 역할을 하며, 그 방식에 따라 개인의 태도, 감정, 행동에 영향을 미친다.","choices":["귀인이론(attribution theory)","식역이론","세고리모형","행동주의 이론","다중지능이론"],"answer":1,"explain":"귀인이론의 정의. ② 지능-창의성 관계 ③ 렌줄리 영재 특성 ④ 왓슨 등 ⑤ 교안 이 차시에 없음.","source":{"page":3,"section":"귀인이론(attribution theory)","quote":"귀인이론은 사람들이 자신 또는 타인의 행동의 원인을 설명하는 이론임 귀인이론은 인간의 행동을 이해하고 예측하는 데 중요한 역할을 함"}},{"id":"22-02","type":"옳지 않은 것","q":"귀인이론에서 원인의 특성에 따른 3가지 분류와 예의 연결로 옳지 않은 것은?","box":null,"choices":["개인 내적 – 노력","개인 외적 – 운(chance)","개인 내적 – 운(chance)","통제 가능 / 불가능","안정적 / 불안정적 – 과제, 시간"],"answer":3,"explain":"교안: 개인 내적(노력)/외적(운, chance), 통제 가능/불가능, 안정적/불안정적(과제, 시간). 운은 외적 원인.","source":{"page":3,"section":"귀인이론(attribution theory)","quote":"개인 내적(노력) / 외적(운, chance) ‣ 통제 가능/불가능 ‣ 안정적 / 불안정적(과제, 시간)"}},{"id":"22-03","type":"옳은 것","q":"영재의 귀인 특성에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["영재는 외적 통제가 높아 결과를 운의 탓으로 돌린다.","영재는 혼자 일을 수행하기보다 타인에게 의존하려는 경향이 강하다.","내적 통제가 강한 영재는 목표를 성취하지 못해도 실망이나 좌절을 경험하지 않는다.","영재는 행동의 결과가 자신의 통제권 밖에 있다고 생각한다.","영재는 행동의 결과가 자신의 통제권 내에 있다고 생각하므로 결과를 바꾸기 위해 더 열심히 노력한다."],"answer":5,"explain":"영재는 자신감이 높고 독립심이 강하며 내적 통제가 높다. ① 내적 통제 ② 독립심 강함 ③ 실망, 좌절 등을 경험함 ④ 통제권 내.","source":{"page":4,"section":"영재의 귀인이론","quote":"행동의 결과가 자신의 통제권 내에 있다고 생각하므로 결과를 바꾸기 위해서 더 열심히 노력함 내적 통제가 강한 영재는 자신이 설정한 목표를 성취하지 못했을 경우에 실망, 좌절 등을 경험하게 됨"}},{"id":"22-04","type":"빈칸","q":"리차슨과 벤보우(Richardson \u0026 Benbow)의 연구에 대한 다음 설명에서 (가), (나)에 들어갈 말로 알맞은 것은?","box":"(가)세의 (나)영재들을 대상으로 한 연구에서 영재들은 시험을 잘 보거나 과제수행을 잘했을 때 또는 학업적으로 성공을 했을 때 그 원인을 노력이나 능력 같은 자신의 내적인 요소로 돌리는 경향이 강했음","choices":["(가) 10-13 (나) 수학","(가) 18-23 (나) 수학","(가) 18-23 (나) 과학","(가) 10-13 (나) 언어","(가) 15-18 (나) 수학"],"answer":2,"explain":"18-23세 수학영재 대상. 10-13세는 그로스의 도덕적 판단 검사 대상 연령.","source":{"page":5,"section":"영재의 귀인이론 – 리차슨과 벤보우","quote":"18 - 23세의 수학영재들을 대상으로 한 연구에서 영재들은 시험을 잘 보거나 과제수행을 잘했을 때"}},{"id":"22-05","type":"개념 찾기","q":"‘영재 학생은 일반 학생에 비하여 자신의 학문적 성공을 자신의 높은 지적 능력에 귀인하는 경향이 높았다’는 연구 결과를 제시한 연구자는?","box":null,"choices":["리차슨과 벤보우","그로스","카네스와 빈","쿠르츠와 바이너트(Kurtz \u0026 Weinert)","터만과 오든"],"answer":4,"explain":"쿠르츠와 바이너트의 연구. ① 리차슨과 벤보우는 18-23세 수학영재의 내적 요소 귀인 ② 그로스는 도덕적 판단 검사 ③ 카네스와 빈은 리더십 ⑤ 터만과 오든은 종단연구.","source":{"page":5,"section":"영재의 귀인이론 – 쿠르츠와 바이너트","quote":"영재 학생은 일반 학생에 비하여 자신의 학문적 성공을 자신의 높은 지적 능력에 귀인하는 경향이 높았음"}},{"id":"22-06","type":"옳지 않은 것","q":"영재의 도덕심(moral)에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["도덕심이란 옳고 그름을 판단하고 이를 실천하는 능력이다.","영재에게 도덕심은 학업에서도 성공을 이루는 데 도움이 된다.","사회적 가치관을 형성하고 윤리적인 리더십을 발휘하는 데 필수적이다.","도덕심은 타고나는 것이므로 규칙·규범에 대한 피드백과 지도는 영향을 주지 못한다.","가치 있는 역할모델(교사, 부모, 친구, 미디어 등)을 통해 올바른 행동패턴을 학습하고 실천한다."],"answer":4,"explain":"교안: 규칙, 규범 및 윤리적인 행동에 대한 피드백과 지도는 도덕심을 형성하는 데 도움을 줌. ④는 반대.","source":{"page":6,"section":"영재의 도덕심 – 도덕심(moral)이란","quote":"규칙, 규범 및 윤리적인 행동에 대한 피드백과 지도는 도덕심을 형성하는 데 도움을 줌"}},{"id":"22-07","type":"옳은 것","q":"교안에서 ‘간디와 히틀러 중에서 누가 영재인가’를 꼽는다면 간디를 꼽는 이유로 제시한 것은?","box":null,"choices":["간디가 히틀러보다 지능지수가 높았기 때문","자신의 탁월한 능력도 중요하지만 도덕심에 따라 행동할 수 있는 사람을 더 훌륭한 인물로 여기기 때문","간디가 더 많은 사람을 이끈 리더였기 때문","히틀러는 창의성이 부족했기 때문","간디가 과제집착력이 더 높았기 때문"],"answer":2,"explain":"교안 p7: 자신의 탁월한 능력도 중요하지만 도덕심에 따라 행동할 수 있는 사람을 더 훌륭한 인물로 여기기 때문. 나머지는 교안에 없는 이유.","source":{"page":7,"section":"영재의 도덕심","quote":"이는 자신의 탁월한 능력도 중요하지만 도덕심에 따라 행동할 수 있는 사람을 더 훌륭한 인물로 여기기 때문"}},{"id":"22-08","type":"빈칸","q":"그로스(Gross)의 도덕적 판단에 대한 검사 결과에 대한 다음 설명에서 (가), (나)에 들어갈 말로 알맞은 것은?","box":"(가)세 영재들을 대상으로 도덕적 판단에 대한 검사를 실시한 결과, 이들의 도덕적·윤리적인 의식수준은 (나) 수준에 있는 것으로 나타남","choices":["(가) 18-23 (나) 대학원생","(가) 10-13 (나) 중학생","(가) 7-9 (나) 고등학생","(가) 18-23 (나) 성인","(가) 10-13 (나) 고등학생이나 대학생"],"answer":5,"explain":"그로스: 10-13세 영재, 도덕적·윤리적 의식수준이 고등학생이나 대학생 수준. 18-23세는 리차슨과 벤보우 연구 대상.","source":{"page":8,"section":"영재의 도덕심 – 그로스(Gross)의 도덕적 판단에 대한 검사","quote":"10 - 13세 영재들을 대상으로 도덕적 판단에 대한 검사를 실시한 결과 ‣ 이들의 도덕적·윤리적인 의식수준은 고등학생이나 대학생 수준에 있는 것으로 나타남"}},{"id":"22-09","type":"옳지 않은 것","q":"그로스(Gross)의 연구에서 제시한 영재의 도덕적 특성으로 옳지 않은 것은?","box":null,"choices":["일찍부터 가치, 공정함, 정의감을 발달시키고 구체화시키며 내면화시킨다.","동정심이 있고 정직하다.","반사회적인 문제행동을 더 많이 일으킨다.","일관된 기준에 따라 다른 사람을 공정하게 평가할 수 있다.","도덕적·윤리적 의식수준이 또래보다 높다."],"answer":3,"explain":"교안: 영재들은 반사회적인 문제행동을 ‘덜’ 일으킴. ③은 반대.","source":{"page":8,"section":"영재의 도덕심 – 그로스(Gross)의 도덕적 판단에 대한 검사","quote":"영재들은 동정심이 있고 정직함 ‣ 일관된 기준에 따라 다른 사람을 공정하게 평가할 수 있음 ‣ 반사회적인 문제행동을 덜 일으킴"}},{"id":"22-10","type":"개념 찾기","q":"다음 설명에 해당하는 인물은?","box":"• ‘영재교육의 어머니’로 불림\n• 영재들의 비도덕성에 대해 지적함\n• 영재들은 ‘건전한 속임수’를 잘하며, 이러한 속임수는 청소년 비행과 범죄로도 발전할 수 있다고 경고함\n• 정서함양과 상담이 필요하다고 강조함","choices":["홀링워스(Hollingworth)","그로스(Gross)","애머바일(Amabile)","롬브로소(Lombroso)","델코트(Delcourt)"],"answer":1,"explain":"영재교육의 어머니 홀링워스의 지적. ② 그로스는 영재의 높은 도덕적 의식수준 ③ 노벨상 수상자 연구 ④ 영재를 병약한 외톨이로 묘사 ⑤ 도전적 프로그램.","source":{"page":9,"section":"영재교육의 어머니 홀링워스(Hollingworth)의 지적","quote":"영재들은 ‘건전한 속임수’를 잘함 ‣ 이러한 속임수는 영재들의 높은 정신력과 도덕적 사고에도 불구하고 청소년 비행과 범죄로도 발전할 수 있다고 경고함"}},{"id":"22-11","type":"사례","q":"다음 사례의 학생에게서 나타난 부정적 행동 특성은 교안의 어느 정의사회적 특성 영역에 해당하는가?","box":"준호는 하고 싶은 것이 너무 많아 늘 과잉행동을 보이고, 작은 자극에도 과민반응을 하며 활동을 하지 않는 것을 못 견뎌 한다. 담임교사는 처음에 준호를 ADHD로 의심하였다.","choices":["완벽주의와 자기비판","정서적 민감성과 열정","내향성과 독립성","도덕발달과 정의감","도전성과 회피"],"answer":2,"explain":"‘정서적 민감성과 열정’의 부정적 행동 특성: 과잉욕심, 과잉행동, 과민반응(ADHD로 오인 가능성 높음), 활동을 하지 않는 것을 못 견뎌함, 현실적인 목표를 맞추기 어려워함, 해석의 주지화(방어기제).","source":{"page":11,"section":"정서적 민감성과 열정","quote":"과잉욕심, 과잉행동, 과민반응(ADHD로 오인 가능성 높음) • 활동을 하지 않는 것을 못 견뎌함"}},{"id":"22-12","type":"보기 조합","q":"‘정서적 민감성과 열정’의 긍정적인 행동 특성으로 교안에 제시된 것을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. 정서적 예민함\nㄴ. 공감성\nㄷ. 타인으로부터 사랑과 수용 받기를 열망함\nㄹ. 해석의 주지화(방어기제)\nㅁ. 높은 에너지","choices":["ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㅁ"],"answer":5,"explain":"긍정: 정서적 예민함, 공감성, 사랑과 수용 열망, 타인의 기대에 부응하려 함, 높은 에너지. ㄹ 해석의 주지화(방어기제)는 부정적인 행동 특성.","source":{"page":11,"section":"정서적 민감성과 열정","quote":"정서적 예민함 • 공감성 • 타인으로부터 사랑과 수용받기를 열망함 • 타인의 기대에 부응하려 함 • 높은 에너지"}},{"id":"22-13","type":"옳지 않은 것","q":"‘완벽주의와 자기비판’의 발생 가능한 부정적인 행동 특성으로 옳지 않은 것은?","box":null,"choices":["우울, 자기비판과 자기비하로 무기력해지거나 용기를 잃음","타인의 평가나 비판에 예민해짐","목표 지향적 행동","우수아 신드롬","일중독(공부벌레)이거나 미성취의 가능"],"answer":3,"explain":"목표 지향적 행동은 ‘완벽주의와 자기비판’의 긍정적인 행동 특성(자신에 대한 높은 기대로 최선을 다함, 성공과 인정에 대한 욕구가 강함과 함께).","source":{"page":12,"section":"완벽주의와 자기비판","quote":"자신에 대한 높은 기대로 최선을 다함 • 성공과 인정에 대한 욕구가 강함 • 목표 지향적 행동"}},{"id":"22-14","type":"개념 찾기","q":"교안에서 ‘우수아 신드롬’, ‘일중독(공부벌레)이거나 미성취의 가능’을 부정적 행동 특성으로 제시한 영역은?","box":null,"choices":["자아개념과 자기통제력","내향성과 독립성","정서적 민감성과 열정","완벽주의와 자기비판","도전성과 회피"],"answer":4,"explain":"완벽주의와 자기비판의 부정적 특성: 우울, 자기비판과 자기비하, 타인 평가에 예민, 우수아 신드롬, 일중독(공부벌레) 또는 미성취.","source":{"page":12,"section":"완벽주의와 자기비판","quote":"타인의 평가나 비판에 예민해짐 • 우수아 신드롬 • 일중독(공부벌레)이거나 미성취의 가능"}},{"id":"22-15","type":"옳은 것","q":"‘자아개념과 자기통제력’의 긍정적·부정적 행동 특성에 대한 연결로 옳은 것은?","box":null,"choices":["긍정 – 과제집착력, 인내심","긍정 – 타인에 대한 배려 부족","부정 – 자기 일에 책임감을 갖고 처리","부정 – 남과 다르다는 자의식과 자신감","긍정 – 비판이나 또래거부에 예민"],"answer":1,"explain":"긍정: 자신과 타인에 대한 높은 기대, 남과 다르다는 자의식과 자신감, 자신의 것을 명확히 주장, 자기 일에 책임감, 과제집착력·인내심. 부정: 고집스럽고 의지가 강한 사람으로 보임, 타인 배려 부족, 비판이나 또래거부에 예민, 자기 기준에 타인이 따르기 힘들어함, 목표 미달성 시 좌절. ②⑤는 부정, ③④는 긍정.","source":{"page":13,"section":"자아개념과 자기통제력","quote":"자기 일에 책임감을 갖고 처리 • 과제집착력, 인내심"}},{"id":"22-16","type":"사례","q":"다음 사례의 학생에게 나타난 부정적 행동 특성은 교안의 어느 영역에 해당하는가?","box":"서연이는 쉬는 시간에도 친구들과 어울리지 않고 혼자 책에 몰두한다. 교사의 지시를 거부하는 경우가 많고, 타협이 어려워 결국 스스로 고립되어 외톨이가 되었다.","choices":["내향성과 독립성","정서적 민감성과 열정","완벽주의와 자기비판","도덕발달과 정의감","도전성과 회피"],"answer":1,"explain":"‘내향성과 독립성’의 부정적 특성: 고집, 타협이 어려움, 자기주장, 지시를 거부, 타인에게 무관심, 부모나 교사에게 동조 안 함, 스스로 고립하여 외톨이, 사회성 결여, 책에 몰두. 긍정적 특성은 깊이 사색하고 혼자만의 시간을 즐김, 목표·가치가 옳다면 타협하지 않고 추구.","source":{"page":14,"section":"내향성과 독립성","quote":"고집, 타협이 어려움 • 자기주장, 지시를 거부 • 타인에게 무관심 • 부모나 교사에게 동조를 안 함 • 스스로 고립하여 외톨이가 됨 • 사회성 결여, 책에 몰두"}},{"id":"22-17","type":"옳은 것","q":"‘도덕발달과 정의감’에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["진실, 평등, 공평의 추구는 부정적인 행동 특성이다.","인류애에 대한 관심은 부정적인 행동 특성이다.","실패 가능한 일은 시도조차 하지 않으려 하는 것이 부정적 특성이다.","비현실적 목표를 설정하여 개혁을 시도하다가 좌절 또는 우울에 빠질 수 있다.","자기 가치를 실현하고자 하는 것은 발생 가능한 부정적 특성이다."],"answer":4,"explain":"도덕발달과 정의감의 발생 가능한 부정적 특성은 ‘비현실적 목표를 설정하여 개혁을 시도하다가 좌절 또는 우울’. 긍정: 진실·평등·공평의 추구, 인류애에 대한 관심, 근심, 자기 가치 실현, 도덕적 행동. ③은 도전성과 회피의 부정적 특성.","source":{"page":15,"section":"도덕발달과 정의감","quote":"비현실적 목표를 설정하여 개혁을 시도하다가 좌절 또는 우울"}},{"id":"22-18","type":"옳지 않은 것","q":"‘도전성과 회피’에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["긍정적 특성으로 일상생활의 틀을 싫어함이 있다.","긍정적 특성으로 평범한 것보다는 새로운 것, 도전적인 일을 선호함이 있다.","긍정적 특성으로 적극성, 노력이 있다.","부정적 특성으로 전통과 권위에 도전하는 것으로 비춰짐이 있다.","부정적 특성으로 실패 가능한 일에 무모하게 계속 도전함이 있다."],"answer":5,"explain":"교안의 부정적 특성: ‘실패 가능한 일은 시도조차 하지 않으려 함’(회피). ⑤는 반대 서술.","source":{"page":16,"section":"도전성과 회피","quote":"전통과 권위에 도전하는 것으로 비춰짐 • 실패 가능한 일은 시도조차 하지 않으려 함"}},{"id":"22-19","type":"사례","q":"다음 사례의 학생에게 나타난 부정적 행동 특성과 가장 관련 깊은 교안의 영역은?","box":"평소 새롭고 도전적인 일을 좋아하던 하준이는 이번 과학 경시대회에서 입상하지 못할 수도 있다는 생각이 들자 아예 참가 신청을 하지 않았다. 또한 수업 중 교사의 설명에 자주 이의를 제기해 권위에 도전한다는 오해를 받는다.","choices":["정서적 민감성과 열정","도전성과 회피","완벽주의와 자기비판","자아개념과 자기통제력","도덕발달과 정의감"],"answer":2,"explain":"‘도전성과 회피’: 긍정 = 새로운 것·도전적인 일 선호 / 부정 = 전통과 권위에 도전하는 것으로 비춰짐, 실패 가능한 일은 시도조차 하지 않으려 함.","source":{"page":16,"section":"도전성과 회피","quote":"평범한 것보다는 새로운 것, 도전적인 일을 선호 • 적극성, 노력"}},{"id":"22-20","type":"옳은 것","q":"‘정서적 민감성과 열정’의 부정적 행동 특성으로 교안에 제시된 것은?","box":null,"choices":["공감성","타인의 기대에 부응하려 함","현실적인 목표를 맞추기 어려워함","높은 에너지","정서적 예민함"],"answer":3,"explain":"‘현실적인 목표를 맞추기 어려워함’은 부정적 특성. 나머지(공감성, 타인 기대 부응, 높은 에너지, 정서적 예민함)는 긍정적인 행동 특성.","source":{"page":11,"section":"정서적 민감성과 열정","quote":"활동을 하지 않는 것을 못 견뎌함 • 현실적인 목표를 맞추기 어려워함 • 해석의 주지화(방어기제)"}},{"id":"22-21","type":"옳지 않은 것","q":"‘내향성과 독립성’의 행동 특성에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["긍정 – 깊이 사색하고 혼자만의 시간을 즐김","긍정 – 자신의 목표와 가치가 옳다면 타인과 타협하지 않고 추구함","부정 – 부모나 교사에게 동조를 안 함","긍정 – 타인의 의견에 쉽게 동조하여 갈등을 피함","부정 – 사회성 결여, 책에 몰두"],"answer":4,"explain":"긍정: 깊이 사색하고 혼자만의 시간을 즐김, 자신의 목표와 가치가 옳다면 타인과 타협하지 않고 추구함. ④는 교안에 없고 오히려 반대(부정적 특성에 ‘부모나 교사에게 동조를 안 함’, ‘타협이 어려움’). ③⑤는 교안의 부정적 특성 그대로.","source":{"page":14,"section":"내향성과 독립성","quote":"깊이 사색하고 혼자만의 시간을 즐김 • 자신의 목표와 가치가 옳다면 타인과 타협하지 않고 추구함"}}]},{"lesson":23,"title":"영재교육과 AI, ChatGPT, 유전자편집","file":"4. 교안 (1~30)/23.pdf","summary":["도덕과 윤리: 그리스어 ethos, 라틴어 mores 모두 ‘습관’ 의미. 도덕 = 개인의 내면적 가치관과 신념(거짓말 등) / 윤리 = 도덕의 사회적 측면, 사회 구성원 공통의 옳고 그름의 기준(살인, 폭행 등)","영재교육에서 윤리교육 필수: AI 윤리, ChatGPT 윤리, 유전자편집 윤리","AI 장점: 반복·일상 작업 자동화로 생산성 향상, 감정·피로 영향 없이 일관·정확, 대용량 데이터 신속 분석, 새로운 사업과 산업 창출","AI 한계: 대량 데이터 필요(부족·편향 시 정확성과 공정성 문제), 복잡한 추론·창의성·감성 등 한계, 결정 과정 윤리적 고민·개인정보보호","유럽 정상 브뤼셀 합의(2023. 7. 21): 대규모 언어모델(LLM) 등 AI의 윤리적 사용 촉진, 인간의 가치와 권리 보장","AI 유용: 스튜어트 러셀(질병 치료·환경 문제·재난 대응, 싱귤래리티), 빌 게이츠(새로운 일자리 창출, 불평등 해소)","AI 위협: 스티븐 호킹(가장 큰 위협, 통제 불능), 일론 머스크(올바르게 개발·관리하면 혁신 기회), 사티아 나델라(편견 강화, 개인정보 침해)","AI 윤리: 사회적 가치와 도덕적 원칙 존중, 개인의 권리와 기본 자유 보호, 투명성과 책임성 확보. 영재들이 AI를 잘 활용하되 개발자나 사용자의 윤리지침에 따라 활용하도록 교육","싯다르타 무케르지 ‘유전자의 내밀한 역사’: 2011년 봄 푸에르토리코 미생물학 학술대회, 제니퍼 다우드나와 에마뉘엘 샤르팡티에","CRISPR/Cas9 유전자가위 → 2020년 노벨화학상(Charpentier, Doudna). 유전병 예방·치료, 암세포 유전자 수정","유전자편집 윤리: 편집 능력을 어디까지 허용할지의 문제, 남용 시 인간의 다양성과 개인의 자율성 문제 → 신중하고 균형 잡힌 관점 교육"],"questions":[{"id":"23-01","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"도덕과 윤리는 그리스어 ethos나 라틴어 mores는 모두 (   )이란 의미로, 모두 옳고 그름에 대한 판단과 행동의 규범을 의미하는 용어임","choices":["양심","법률","습관","정의","인격"],"answer":3,"explain":"ethos, mores는 모두 ‘습관’이란 의미. 나머지는 교안에 없는 표현.","source":{"page":3,"section":"도덕과 윤리","quote":"도덕과 윤리는 그리스어 ethos나 라틴어 mores는 모두 습관이란 의미로, 모두 옳고 그름에 대한 판단과 행동의 규범을 의미하는 용어임"}},{"id":"23-02","type":"옳은 것","q":"도덕과 윤리의 구분에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["윤리는 도덕의 사회적 측면을 강조하는 용어로, 사회 구성원들이 공통으로 받아들이는 옳고 그름의 기준(살인, 폭행 등)을 의미한다.","도덕은 사회 구성원들이 공통으로 받아들이는 기준으로 살인, 폭행 등이 예이다.","윤리는 주로 개인의 내면적인 가치관과 신념을 의미한다.","거짓말은 윤리의 예로 제시되었다.","ethos는 라틴어, mores는 그리스어이다."],"answer":1,"explain":"도덕 = 개인의 내면적 가치관과 신념(거짓말 등), 윤리 = 도덕의 사회적 측면, 공통의 기준(살인, 폭행 등). ②③④ 도덕과 윤리 뒤바뀜 ⑤ ethos는 그리스어, mores는 라틴어.","source":{"page":3,"section":"도덕과 윤리","quote":"윤리란 / ‣ 도덕의 사회적 측면을 강조하는 용어로 사회 구성원들이 공통으로 받아들이는 옳고 그름의 기준(살인, 폭행 등)을 의미함"}},{"id":"23-03","type":"보기 조합","q":"교안에서 ‘영재교육에서 윤리교육이 필수’라고 하며 제시한 윤리 영역을 \u003c보기\u003e에서 모두 고른 것은?","box":"ㄱ. AI 윤리\nㄴ. ChatGPT 윤리\nㄷ. 유전자편집 윤리\nㄹ. 환경 윤리","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":4,"explain":"교안 p4: AI 윤리, ChatGPT 윤리, 유전자편집 윤리. 환경 윤리는 제시되지 않았다.","source":{"page":4,"section":"영재교육에서 윤리교육이 필수","quote":"AI 윤리 ChatGPT 윤리 유전자편집 윤리"}},{"id":"23-04","type":"옳지 않은 것","q":"교안에 제시된 AI 활용의 장점으로 옳지 않은 것은?","box":null,"choices":["반복적이고 일상적인 작업을 자동화하여 생산성을 향상한다.","인간처럼 감정이나 피로에 영향을 받아 상황에 따라 유연한 결과를 생성한다.","대용량의 데이터를 신속하게 분석하여 복잡한 문제에 대한 효과적인 의사결정을 도와준다.","새로운 기술과 혁신을 가능하게 하여 새로운 사업과 산업을 창출할 수 있다.","일관되고 정확한 결과를 생성할 수 있다."],"answer":2,"explain":"교안: 인간처럼 감정이나 피로에 영향을 ‘받지 않고’ 일관되고 정확한 결과를 생성. ②는 반대.","source":{"page":5,"section":"AI 활용의 장점","quote":"인간처럼 감정이나 피로에 영향을 받지 않고 일관되고 정확한 결과를 생성할 수 있음"}},{"id":"23-05","type":"옳은 것","q":"교안에 제시된 AI 활용의 한계로 옳은 것은?","box":null,"choices":["소량의 데이터만으로도 정확하고 공정한 결과를 낸다.","복잡한 추론, 창의성, 감성 등에서 인간의 능력을 이미 넘어섰다.","AI의 결정 과정에는 윤리적 고민이 필요하지 않다.","개인정보보호는 AI와 관련 없는 이슈이다.","데이터가 부족하거나 편향된 경우 정확성과 공정성에 문제가 생긴다."],"answer":5,"explain":"AI는 대량의 데이터가 필요하며, 부족·편향 시 정확성과 공정성 문제. ① 대량 데이터 필요 ② 인간과 비교했을 때 한계가 있음 ③ 윤리적 고민 필요 ④ 인간의 가치와 개인정보보호 등이 중요한 이슈.","source":{"page":6,"section":"AI 활용의 한계","quote":"대량의 데이터가 필요하며, 데이터가 부족하거나 편향된 경우 정확성과 공정성에 문제가 생김"}},{"id":"23-06","type":"빈칸","q":"유럽 정상들이 대규모 언어모델(LLM)과 같은 AI의 윤리적 사용을 촉진하고 인간의 가치와 권리를 보장하기 위해 맺은 합의로 교안에 제시된 것은?","box":"유럽 정상 (   ) 합의(2023. 7. 21)","choices":["파리","브뤼셀","제네바","베를린","런던"],"answer":2,"explain":"유럽 정상 브뤼셀 합의(2023. 7. 21).","source":{"page":7,"section":"유럽 정상 브뤼셀 합의(2023. 7. 21)","quote":"유럽 정상들은 회의에서 대규모 언어모델(LLM)과 같은 AI의 윤리적 사용을 촉진하고, 인간의 가치와 권리를 보장하기 위한 합의"}},{"id":"23-07","type":"옳지 않은 것","q":"유럽 정상 브뤼셀 합의에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["2023년 7월 21일에 이루어졌다.","대규모 언어모델(LLM)과 같은 AI의 윤리적 사용을 촉진하기 위한 합의이다.","윤리적 사용은 인간의 가치와 권리를 존중하고, 사회의 이익을 최우선으로 고려하는 방법이다.","공정하고 안전한 AI 시스템을 구축할 수 있다.","AI 기술의 개발 속도를 높이기 위해 윤리적 규제를 완화하기로 했다."],"answer":5,"explain":"합의의 목적은 AI의 윤리적 사용 촉진과 인간의 가치·권리 보장, 인공지능 기술이 지속 가능하고 사회적으로 수용되도록 보장하는 것. ⑤는 교안에 없고 반대 취지.","source":{"page":8,"section":"유럽 정상 브뤼셀 합의(2023. 7. 21)","quote":"윤리적 사용은 인간의 가치와 권리를 존중하고, 사회의 이익을 최우선으로 고려하는 방법이며, 공정하고 안전한 AI 시스템을 구축할 수 있음"}},{"id":"23-08","type":"개념 찾기","q":"교안에서 다음 주장을 한 인물로 제시된 사람은?","box":"AI는 인류에게 큰 이익을 가져다줄 수 있다. AI가 질병 치료, 환경 문제 해결, 재난 대응 등의 분야에서 활용될 수 있다.","choices":["캘리포니아대학 교수 스튜어트 러셀","마이크로소프트 설립자 빌 게이츠","영국의 이론물리학자 스티븐 호킹","테슬라 최고경영자 일론 머스크","마이크로소프트 CEO 사티아 나델라"],"answer":1,"explain":"스튜어트 러셀(캘리포니아대학 교수). ② 빌 게이츠는 새로운 일자리 창출·불평등 해소 ③ 호킹은 가장 큰 위협 ④ 머스크는 올바른 개발·관리 시 혁신적 기회 ⑤ 나델라는 편견 강화·개인정보 침해 위험.","source":{"page":9,"section":"AI가 인류에게 유용한가?","quote":"AI는 인류에게 큰 이익을 가져다줄 수 있다. AI가 질병 치료, 환경 문제 해결, 재난 대응 등의 분야에서 활용될 수 있다. 캘리포니아대학 교수 스튜어트 러셀"}},{"id":"23-09","type":"빈칸","q":"마이크로소프트 설립자 빌 게이츠의 말로 교안에 제시된 다음 문장의 (   )에 들어갈 말은?","box":"AI는 인류에게 엄청난 기회를 제공할 수 있다. AI가 새로운 일자리를 창출하고, (   )을 해소할 수 있다.","choices":["개인정보 침해","환경 문제","사회의 불평등","질병","편견"],"answer":3,"explain":"빌 게이츠: 새로운 일자리 창출, 사회의 불평등 해소. ②④ 질병·환경은 스튜어트 러셀 ①⑤ 편견·개인정보 침해는 사티아 나델라가 말한 위험.","source":{"page":9,"section":"AI가 인류에게 유용한가?","quote":"AI가 새로운 일자리를 창출하고, 사회의 불평등을 해소할 수 있다. 마이크로소프트 설립자 빌게이츠"}},{"id":"23-10","type":"옳은 것","q":"‘AI가 인류에게 위협인가?’에서 인물과 주장의 연결로 옳은 것은?","box":null,"choices":["스티븐 호킹 – AI가 편견을 강화하고 개인 정보 침해를 초래할 수 있다.","사티아 나델라 – AI가 인류의 미래에 대한 가장 큰 위협이 될 수 있다.","일론 머스크 – AI가 새로운 일자리를 창출하고 불평등을 해소할 수 있다.","스티븐 호킹 – AI가 통제 불능 상태에 빠질 수 있으며, 인류를 위협할 수 있다.","빌 게이츠 – AI는 큰 위협이 될 수 있지만 올바르게 개발·관리하면 혁신적인 변화의 기회가 될 것이다."],"answer":4,"explain":"영국의 이론물리학자 스티븐 호킹: 가장 큰 위협, 통제 불능. ① 편견·개인정보 침해는 사티아 나델라 ② 가장 큰 위협은 호킹 ③ 일자리·불평등 해소는 빌 게이츠 ⑤ 올바른 개발·관리 시 혁신 기회는 일론 머스크.","source":{"page":10,"section":"AI가 인류에게 위협인가?","quote":"AI가 인류의 미래에 대한 가장 큰 위협이 될 수 있다. AI가 통제 불능 상태에 빠질 수 있으며, 인류를 위협할 수 있다. 영국의 이론물리학자 스티븐 호킹"}},{"id":"23-11","type":"개념 찾기","q":"교안에서 다음 주장을 한 인물로 제시된 사람은?","box":"AI는 인류에게 큰 기회를 제공할 수 있지만, 잠재적인 위험도 인식해야 한다. AI가 편견을 강화하고, 개인 정보 침해를 초래할 수 있다.","choices":["스튜어트 러셀","일론 머스크","스티븐 호킹","마이크로소프트 CEO 사티아 나델라","빌 게이츠"],"answer":4,"explain":"마이크로소프트 CEO 사티아 나델라의 말. 빌 게이츠는 마이크로소프트 ‘설립자’로 일자리·불평등 해소를 말했다.","source":{"page":10,"section":"AI가 인류에게 위협인가?","quote":"AI가 편견을 강화하고, 개인 정보 침해를 초래할 수 있다. 마이크로소프트 CEO 사티아나델라"}},{"id":"23-12","type":"개념 찾기","q":"교안에서 다음 내용을 말한 인물로 제시된 사람은?","box":"기술의 발전이 급속히 가속화되어, 인간의 인식능력을 초월하는 지능이 탄생하는 순간을 의미하며, 싱귤래리티가 인류에게 삶을 더 풍요롭고 행복하게 만들 수 있다.","choices":["캘리포니아대학 교수 스튜어트 러셀","테슬라 최고경영자 일론 머스크","영국의 이론물리학자 스티븐 호킹","마이크로소프트 CEO 사티아 나델라","싯다르타 무케르지"],"answer":1,"explain":"교안 p9에서 싱귤래리티에 대한 긍정적 견해는 캘리포니아대학 교수 스튜어트 러셀의 말로 제시되어 있다(출처: 위키백과).","source":{"page":9,"section":"AI가 인류에게 유용한가?","quote":"싱귤래리티가 인류에게 삶을 더 풍요롭고 행복하게 만들 수 있다. 캘리포니아대학 교수 스튜어트 러셀"}},{"id":"23-13","type":"옳지 않은 것","q":"AI 윤리와 영재교육에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["AI 윤리는 인공지능 시스템이 사회적 가치와 도덕적인 원칙을 존중하는 것을 의미한다.","AI 윤리는 개인의 권리와 기본 자유를 보호하는 것을 의미한다.","사용자들과 AI 개발자들에 대한 교육 및 인식 활동을 통해 AI 윤리 지침을 이해하고 적용한다.","AI 시스템의 동작, 알고리즘, 데이터 처리 및 활용 방식에 대한 투명성과 책임성을 확보한다.","영재들은 윤리적 판단력이 높으므로 별도의 윤리지침 교육 없이 AI를 자유롭게 활용하게 한다."],"answer":5,"explain":"교안: 영재들이 AI를 잘 활용하되, 개발자나 사용자의 윤리지침에 따라 활용할 수 있도록 교육해야 함. ⑤는 반대.","source":{"page":12,"section":"AI 윤리와 영재교육","quote":"영재들이 지능정보화사회에서 AI를 잘 활용하되, 개발자나 사용자의 윤리지침에 따라 활용할 수 있도록 교육해야 함"}},{"id":"23-14","type":"빈칸","q":"다음 (   )에 들어갈 말로 알맞은 것은?","box":"AI 시스템의 동작, 알고리즘, 데이터 처리 및 활용 방식에 대한 (   )을 확보","choices":["효율성과 경제성","속도와 정확성","투명성과 책임성","독창성과 개방성","자율성과 다양성"],"answer":3,"explain":"교안 p11: 투명성과 책임성을 확보.","source":{"page":11,"section":"AI 윤리와 영재교육","quote":"AI 시스템의 동작, 알고리즘, 데이터 처리 및 활용 방식에 대한 투명성과 책임성을 확보"}},{"id":"23-15","type":"옳은 것","q":"교안에 소개된 싯다르타 무케르지의 『유전자의 내밀한 역사』 일화에 대한 설명으로 옳은 것은?","box":null,"choices":["2020년 봄, 스톡홀름에서 열린 화학학술대회의 일화이다.","2011년 봄, 푸에르토리코에서 열린 미생물학 학술대회에서 제니퍼 다우드나가 에마뉘엘 샤르팡티에와 이야기를 나누었다.","샤르팡티에는 인간의 면역계에 대한 관심이 있다고 말했다.","다우드나는 세균학자, 샤르팡티에는 물리학자로 소개되었다.","두 사람은 실험실에서 처음 만났다."],"answer":2,"explain":"2011년 봄, 푸에르토리코 미생물학 학술대회, 연구자 다우드나와 세균학자 샤르팡티에가 골목길을 걸으며 대화. ① 연도·장소 틀림 ③ 세균의 면역계(세균이 바이러스를 막는 메커니즘) ④ 샤르팡티에가 세균학자 ⑤ 골목길을 따라 걸음.","source":{"page":14,"section":"유전자편집","quote":"2011년 봄, 푸에르토리코에서 열린 미생물학 학술대회에 참석한 연구자인 제니퍼 다우드나가 세균학자 에마뉘엘 샤르팡티에와 얘기를 나누었다."}},{"id":"23-16","type":"빈칸","q":"다음 (가), (나)에 들어갈 말로 알맞은 것은?","box":"Emmanuelle Charpentier와 Jennifer A. Doudna는 유전자 기술의 가장 날카로운 도구 중 하나인 (가) 유전자가위를 발견했으며, 이 업적으로 (나) 노벨화학상을 받았다.","choices":["(가) CRISPR/Cas9 (나) 2011","(가) CRISPR/Cas9 (나) 2020","(가) TALEN (나) 2020","(가) CRISPR/Cas9 (나) 2022","(가) 인간게놈프로젝트 (나) 2020"],"answer":2,"explain":"2020 노벨화학상 CRISPR/Cas9(KOFST, 2022. 4. 1). 2011년은 두 사람이 만난 해, 2022는 자료 출처 날짜.","source":{"page":15,"section":"2020 노벨화학상 CRISPR/Cas9","quote":"Emmanuelle Charpentier와 Jennifer A. Doudna는 유전자 기술의 가장 날카로운 도구 중 하나인 CRISPR/Cas9 유전자가위를 발견했습니다."}},{"id":"23-17","type":"옳지 않은 것","q":"유전자편집에 대한 교안의 설명으로 옳지 않은 것은?","box":null,"choices":["현재 과학과 의학 분야에서 가장 논란이 되고 있는 주제 중 하나이다.","DNA의 수정과 조작을 통해 유전자의 특성을 변경하는 기술이다.","생명의 새로운 가능성을 열어주고 질병 치료에 대한 희망을 제시한다.","CRISPR/Cas9을 사용하여 동물, 식물 및 미생물의 DNA를 매우 정밀하게 변경할 수 있다.","유전자편집 기술인 CRISPR은 2020년 노벨생리의학상을 수상하였다."],"answer":5,"explain":"교안: CRISPR은 2020년 노벨‘화학상’을 수상. ①②③ p16, ④ p15 내용 그대로.","source":{"page":16,"section":"유전자편집","quote":"유전자편집 기술인 CRISPR은 혁신적인 기술로 유전자를 수정하는 데 사용되고, 2020년 노벨화학상을 수상함"}},{"id":"23-18","type":"옳은 것","q":"유전자편집의 활용에 대한 교안의 설명으로 옳은 것은?","box":null,"choices":["암의 치료에서 암세포의 유전자를 수정하여 암 성장을 억제하거나 암세포를 파괴할 수 있다.","유전적인 질병은 예방할 수 있으나 치료는 불가능하다.","유전자편집은 아직 생명과학 연구에 새로운 가능성을 제시하지 못했다.","유전적인 조건을 가진 아이들에게는 적용할 수 없다.","암 치료에는 활용되지 않는다."],"answer":1,"explain":"교안 p17: 암세포의 유전자를 수정하여 암 성장을 억제하거나 암세포를 파괴. ② 예방하거나 치료 가능 ③ 새로운 가능성 제시(p16) ④ 유전적인 조건을 가진 아이들이 정상적으로 성장 ⑤ 암 치료에도 활용.","source":{"page":17,"section":"유전자편집","quote":"암의 치료에도 암세포의 유전자를 수정하여 암 성장을 억제하거나 암세포를 파괴"}},{"id":"23-19","type":"빈칸","q":"유전자편집 윤리에 대한 다음 설명에서 (   )에 들어갈 말로 알맞은 것은?","box":"유전자편집을 통해 인간의 특정한 특성을 선택적으로 변경하는 것이 가능해진다면, (   )에 문제 발생","choices":["AI의 투명성과 책임성","데이터의 정확성과 공정성","인간의 다양성과 개인의 자율성","사회의 불평등과 일자리","개인의 신체적 건강"],"answer":3,"explain":"교안 p18: 남용될 경우 인간의 다양성과 개인의 자율성에 문제 발생. 유전자편집 윤리의 문제는 인류가 유전자를 편집하는 능력을 어디까지 허용해야 할지에 대한 문제이다.","source":{"page":18,"section":"유전자편집 윤리","quote":"유전자편집을 통해 인간의 특정한 특성을 선택적으로 변경하는 것이 가능해진다면, 인간의 다양성과 개인의 자율성에 문제 발생"}},{"id":"23-20","type":"옳은 것","q":"유전자편집 기술과 영재교육에 대한 교안의 입장으로 옳은 것은?","box":null,"choices":["유전자편집 기술은 이미 완성되어 더 이상 발전하지 않을 것이다.","영재교육에서는 유전자편집 기술을 적극적으로 활용해 지능을 향상시켜야 한다.","유전자편집은 윤리적 문제가 없으므로 제한 없이 허용되어야 한다.","영재교육에서도 기술의 발전과 함께 더욱 신중하고 균형 잡힌 관점을 가지도록 교육해야 한다.","유전자편집 윤리는 영재교육과 관계없는 주제이다."],"answer":4,"explain":"교안 p19: 유전자편집 기술은 끊임없이 발전하며 미래에 더 정교하고 강력한 도구로 진화할 것으로 예상, 영재교육에서도 신중하고 균형 잡힌 관점 교육. ① 끊임없이 발전 ②③⑤ 교안 취지와 반대.","source":{"page":19,"section":"유전자편집 윤리","quote":"영재교육에서도 우리는 기술의 발전과 함께 더욱 신중하고 균형 잡힌 관점을 가지도록 교육해야 함"}}]},{"lesson":24,"title":"영재의 인지적 능력과 사회정의적 특성은 조화로운가?","file":"4. 교안 (1~30)/24.pdf","summary":["행동과학자(교육과 심리학자)는 영재의 3가지 영역(인지적 능력/정의적 특성/사회적 특성)을 영재성(giftedness)으로 설명","쟁점: 3가지가 조화/동시적 발달인가, 비조화/비동시적 발달인가","인지적 능력 연구: 지능, 창의성, 상위 인지, 고차원적 추론능력 등이 탁월하다고 일관되게 보고 / 정의적·사회적 특성 연구는 상반되게 보고","상반된 이유: 영재성에 대한 정의의 차이, 연구 대상자 선정의 표집의 차이, 연구 방법의 차이","조화(모두 건강) 주장: 터만과 오든(사회·정서·도덕·신체 발달 종단연구, 잘못된 신화(myth) 사라지길 기대), 골루시·미들턴·클라인(3집단 심리사회적 적응 차이 없음, 창의성과 정신병리 상관 없음), 세일러와 브룩샤이(중학교 2학년, 영재학급이 더 좋음, 조기입학·월반 영재 대부분 사회적 고립 없음)","롬브로소: 영재를 ‘머리는 뛰어나나 꼽추이며
